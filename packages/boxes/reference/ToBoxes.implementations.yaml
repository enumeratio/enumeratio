power:
  epsil:
    in: ToBoxes(x ^ 2)
    out: SuperscriptBox("x", "2")
  tex:
    in: \mathrm{ToBoxes}(x^2)
    out: \mathrm{SuperscriptBox}(\text{x}, \text{2})
  fullform:
    in: ToBoxes[Power[x, 2]]
  wolfram:
    in: ToBoxes[Power[x, 2]]
    out: SuperscriptBox["x", "2"]
    tex:
      in: \text{ToBoxes}\left[x^2\right]
      out: \text{SuperscriptBox}[\text{x},2]
evaluates-first:
  epsil:
    in: ToBoxes(2 + 3)
    out: '"5"'
  tex:
    in: \mathrm{ToBoxes}(2+3)
    out: \text{5}
  fullform:
    in: ToBoxes[Plus[2, 3]]
  wolfram:
    in: ToBoxes[Plus[2, 3]]
binomial:
  epsil:
    in: ToBoxes(Binomial(n, k))
    out: RowBox(["(", FractionBox("n", "k", (FractionLine, False)), ")"])
  tex:
    in: \mathrm{ToBoxes}(\binom{n}{k})
    out: \mathrm{RowBox}(\bigl\lbrack\text{(}, \mathrm{FractionBox}(\text{n}, \text{k}, (\mathrm{FractionLine},\bot)), \text{)}\bigr\rbrack)
  traditional:
    in: \mathrm{ToBoxes}(\binom{n}{k})
    out: \mathrm{RowBox}(\bigl\lbrack\text{(}, \mathrm{FractionBox}(\text{n}, \text{k}, (\mathrm{FractionLine},\mathrm{False})), \text{)}\bigr\rbrack)
  fullform:
    in: ToBoxes[Binomial[n, k]]
  wolfram:
    in: ToBoxes[Binomial[n, k]]
    out: RowBox[{"Binomial", "[", RowBox[{"n", ",", "k"}], "]"}]
    tex:
      in: \text{ToBoxes}[\binom{n}{k}]
      out: \text{RowBox}[\{\text{Binomial},[,\text{RowBox}[\{\text{n},,,\text{k}\}],]\}]
    verdict: disagree
    kind: convention
    note: Wolfram's default ToBoxes[Binomial[n,k]] boxes the unevaluated function call as text; ours renders the traditional stacked fraction without a bar. A rendering choice, not a value.
square-root-over-y:
  epsil:
    in: ToBoxes(Sqrt(x) / y)
    out: FractionBox(SqrtBox("x"), "y")
  tex:
    in: \mathrm{ToBoxes}(\frac{\sqrt{x}}{y})
    out: \mathrm{FractionBox}(\mathrm{SqrtBox}(\text{x}), \text{y})
  fullform:
    in: ToBoxes[Divide[Sqrt[x], y]]
  wolfram:
    in: ToBoxes[Divide[Sqrt[x], y]]
    out: FractionBox[SqrtBox["x"], "y"]
    tex:
      in: \text{ToBoxes}\left[\frac{\sqrt{x}}{y}\right]
      out: \text{FractionBox}[\text{SqrtBox}[\text{x}],\text{y}]
