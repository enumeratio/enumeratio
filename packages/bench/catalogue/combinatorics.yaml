# Big-integer combinatorics. Huge answers are reduced mod a word-sized prime, which every
# system maps, so the answer compares as a small value and the reduction costs next to nothing.
# Arguments are drawn a little below a round size (10^5 - n, n seeded), so no system answers
# from a value it stored for the round number, and a call computes the whole list.

Factorial:
  - id: factorial-near-10-to-the-4
    role: bench
    expr: [Mod, [Factorial, $n], 1000000007]
    bench:
      tier: small
      tags: [combinatorics, big-integer]
      precision: exact
      sample: { seed: 20260926, count: 4, draw: { n: [int, 9900, 10000] } }
  - id: factorial-near-10-to-the-5
    role: bench
    expr: [Mod, [Factorial, $n], 1000000007]
    bench:
      tags: [combinatorics, big-integer]
      source: GMP
      precision: exact
      sample: { seed: 20260926, count: 4, draw: { n: [int, 99000, 100000] } }
  - id: factorial-near-10-to-the-6
    role: bench
    expr: [Mod, [Factorial, $n], 1000000007]
    bench:
      tier: large
      tags: [combinatorics, big-integer]
      precision: exact
      budget: 30
      sample: { seed: 20260926, count: 2, draw: { n: [int, 999000, 1000000] } }
Binomial:
