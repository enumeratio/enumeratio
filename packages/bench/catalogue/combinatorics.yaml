    expr: [Mod, [Binomial, $n, $k], 1000000007]
    bench:
      tags: [combinatorics, big-integer]
      precision: exact
      sample: { seed: 20260926, count: 4, draw: { k: [int, 29000, 30000], n: [int, 99000, 100000] } }
