# Integer arithmetic and number theory. Prime and PrimePi arguments sit a seeded distance
# below a power of ten, so a kernel's table of values at round numbers can't answer them.

GCD:
  - id: gcd-random-10000-bit
    role: bench
    expr: [GCD, $a, $b]
    bench:
      tags: [number-theory, big-integer]
      source: GMP
      precision: exact
      sample: { seed: 20260925, count: 8, draw: { a: [bits, 10000], b: [bits, 10000] } }
PowerMod:
  - id: powermod-random-2048-bit
    role: bench
    expr: [PowerMod, $a, $e, $m]
    bench:
      tags: [number-theory, big-integer]
      source: RSA-sized modular exponentiation
      precision: exact
      sample: { seed: 20260925, count: 8, draw: { a: [bits, 2048], e: [bits, 2048], m: [odd-bits, 2048] } }
PrimePi:
  - id: primepi-near-10-to-the-7
    role: bench
    expr: [PrimePi, $n]
    bench:
      tier: small
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, count: 4, draw: { n: [int, 9999000, 10000000] } }
  - id: primepi-near-10-to-the-9
    role: bench
    expr: [PrimePi, $n]
    bench:
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, count: 4, draw: { n: [int, 999999000, 1000000000] } }
  - id: primepi-near-10-to-the-11
    role: bench
    expr: [PrimePi, $n]
    bench:
      tier: large
      tags: [number-theory, primes]
      precision: exact
      budget: 30
      sample: { seed: 20260926, count: 4, draw: { n: [int, 99999999000, 100000000000] } }
Prime:
  - id: prime-near-10-to-the-5
    role: bench
    expr: [Prime, $n]
    bench:
      tier: small
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, count: 8, draw: { n: [int, 99000, 100000] } }
  - id: prime-near-10-to-the-7
    role: bench
    expr: [Prime, $n]
    bench:
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, count: 4, draw: { n: [int, 9999000, 10000000] } }
  - id: prime-near-10-to-the-9
    role: bench
    expr: [Prime, $n]
    bench:
      tier: large
      tags: [number-theory, primes]
      precision: exact
      budget: 30
      sample: { seed: 20260926, count: 4, draw: { n: [int, 999999000, 1000000000] } }
