# Integer arithmetic and number theory. Prime and PrimePi arguments are drawn from the decade
# below a power of ten, not at it, and each call takes a list it hasn't seen (`batches`):
# Wolfram memoises every Prime it computes and keeps the sieve segment around recent PrimePi
# arguments, and `ClearSystemCache[]` clears neither, so a repeated list or a tight cluster
# would time a lookup.

GCD:
  - id: gcd-random-10000-bit
    role: bench
    expr: [GCD, $a, $b]
    bench:
      tags: [number-theory, big-integer]
      source: GMP
      precision: exact
      sample: { seed: 20260925, count: 8, draw: { a: [bits, 10000], b: [bits, 10000] } }
PowerMod:
  - id: powermod-random-2048-bit
    role: bench
    expr: [PowerMod, $a, $e, $m]
    bench:
      tags: [number-theory, big-integer]
      source: RSA-sized modular exponentiation
      precision: exact
      sample: { seed: 20260925, count: 8, draw: { a: [bits, 2048], e: [bits, 2048], m: [odd-bits, 2048] } }
PrimePi:
  - id: primepi-below-10-to-the-7
    role: bench
    expr: [PrimePi, $n]
    bench:
      tier: small
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, batches: 24, count: 4, draw: { n: [int, 9000000, 10000000] } }
  - id: primepi-below-10-to-the-9
    role: bench
    expr: [PrimePi, $n]
    bench:
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, batches: 24, count: 4, draw: { n: [int, 900000000, 1000000000] } }
  - id: primepi-below-10-to-the-11
    role: bench
    expr: [PrimePi, $n]
    bench:
      tier: large
      tags: [number-theory, primes]
      precision: exact
      budget: 30
      sample: { seed: 20260926, batches: 24, count: 4, draw: { n: [int, 90000000000, 100000000000] } }
NthPrime:
  # compute-engine's own "Prime" is derivative notation (f', f''), not nth-prime -- these
  # cases used to call [Prime, $n], relying on an override that widened Prime to also mean
  # nth-prime for a plain integer argument. That overload was removed (issue #276); NthPrime
  # is the only head name for it on our side (the crosswalk still maps NthPrime to Wolfram's
  # Prime, so the oracle side of these cases is unchanged).
  - id: prime-below-10-to-the-5
    role: bench
    expr: [NthPrime, $n]
    bench:
      tier: small
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, batches: 24, count: 8, draw: { n: [int, 90000, 100000] } }
  - id: prime-below-10-to-the-7
    role: bench
    expr: [NthPrime, $n]
    bench:
      tags: [number-theory, primes]
      precision: exact
      sample: { seed: 20260926, batches: 24, count: 4, draw: { n: [int, 9000000, 10000000] } }
  - id: prime-below-10-to-the-9
    role: bench
    expr: [NthPrime, $n]
    bench:
      tier: large
      tags: [number-theory, primes]
      precision: exact
      budget: 30
      sample: { seed: 20260926, batches: 24, count: 4, draw: { n: [int, 900000000, 1000000000] } }
