# Argument reduction: a huge exact argument, reduced mod 2π before a double sees it. A kernel
# that turns the argument into a double first answers for a different number.
Sin:
  - id: sin-24-to-the-40
    role: bench
    expr: [Sin, [Power, 24, 40]]
    expected: 0.400083152719766
    bench:
      tier: small
      tags: [special-functions, argument-reduction]
      source: ours (#176)
      precision: machine
  - id: sin-random-1000-bit-integers-machine
    role: bench
    expr: [Sin, $n]
    bench:
      tags: [special-functions, argument-reduction]
      precision: machine
      sample: { seed: 20260926, count: 8, draw: { n: [bits, 1000] } }
