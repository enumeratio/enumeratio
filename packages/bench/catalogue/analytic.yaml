# Special functions, at machine precision and at a digit count. Answers with more digits than
# a double holds are MathJSON numeric strings, `{ num: "…" }`, so YAML never rounds them.
# Inputs to a digit-precision case must be exact in binary and decimal alike (rationals,
# integers, 3.5; never 0.3): mpmath reads a float's binary value, Wolfram its decimal digits,
# and at 30 digits the two inputs would differ. Sampled answers are pinned (scripts/pin.ts).

Zeta:
  # Not ζ(3) or ζ(2n): kernels answer those from stored constants and closed forms.
  - id: zeta-3-sevenths-to-30-digits
    role: bench
    expr: [Zeta, [Rational, 3, 7]]
    bench:
      tier: small
      tags: [special-functions, zeta]
      precision: 30
  - id: zeta-random-rationals-to-30-digits
    role: bench
    expr: [Zeta, [Rational, $p, $q]]
    bench:
      tags: [special-functions, zeta]
      precision: 30
      sample: { seed: 20260926, count: 8, draw: { p: [int, 14, 60], q: [int, 3, 13] } }
  - id: zeta-strip-rationals-to-30-digits
    role: bench
    expr: [Zeta, [Rational, $p, $q]]
    bench:
      tags: [special-functions, zeta]
      precision: 30
      sample: { seed: 20260926, count: 8, draw: { p: [int, 1, 12], q: [int, 13, 29] } }
  - id: zeta-random-rationals-to-100-digits
    role: bench
    expr: [Zeta, [Rational, $p, $q]]
    bench:
      tier: large
      tags: [special-functions, zeta]
      precision: 100
      sample: { seed: 20260926, count: 8, draw: { p: [int, 14, 60], q: [int, 3, 13] } }
  - id: zeta-critical-line-near-1000-machine
    role: bench
    expr: [Zeta, [Complex, 0.5, $t]]
    bench:
      tier: small
      tags: [special-functions, zeta, complex]
      precision: machine
      sample: { seed: 20260926, count: 8, draw: { t: [real, 1000, 1100] } }
  - id: zeta-critical-line-near-10-to-the-4-machine
    role: bench
    expr: [Zeta, [Complex, 0.5, $t]]
    bench:
      tags: [special-functions, zeta, complex]
      precision: machine
      sample: { seed: 20260926, count: 4, draw: { t: [real, 10000, 10100] } }
  - id: zeta-critical-line-near-10-to-the-5-machine
    role: bench
    expr: [Zeta, [Complex, 0.5, $t]]
    bench:
      tier: large
      tags: [special-functions, zeta, complex]
      precision: machine
      budget: 30
      sample: { seed: 20260926, count: 4, draw: { t: [real, 100000, 100100] } }
  - id: zeta-critical-strip-to-30-digits
    role: bench
    expr: [Zeta, [Add, [Rational, $p, 10], [Complex, 0, $t]]]
    bench:
      tags: [special-functions, zeta, complex]
      precision: 30
      sample: { seed: 20260926, count: 4, draw: { p: [int, 1, 9], t: [int, 100, 200] } }
