  args: { size: 1 }
  sage: Subsets(1)
- collection: integer_partitions
  args: { size: 0 }
  sage: Partitions(0)
- collection: integer_partitions
  args: { size: 1 }
  sage: Partitions(1)
- collection: integer_compositions
  args: { size: 0 }
  sage: Compositions(0)
- collection: integer_compositions
  args: { size: 1 }
  sage: Compositions(1)
- collection: set_partitions
  args: { size: 0 }
  sage: SetPartitions(0)
- collection: set_partitions
  args: { size: 1 }
  sage: SetPartitions(1)
- collection: set_compositions
  args: { size: 0 }
  sage: OrderedSetPartitions(0)
- collection: set_compositions
  args: { size: 1 }
