# --- the bounded collections deliberately NOT covered ---
# carriers / collections / traits / glyphs: our own REGISTRY meta-collections (rows of the catalog itself), not
#   mathematical objects sage has any notion of — nothing to check against.
# giuga_numbers: the 7 known terms run up to ~4.3e14; the collection's floor is the complete literal set, so an
#   honest oracle case would need to SWEEP every n up to ~4.3e14 testing the Giuga divisibility predicate — utterly
#   infeasible in oracle time. A bounded sweep (e.g. n<10^6) only recovers a subset (30,858,1722,66198) and would
#   never set-equal the full 7-element collection. Dropped rather than faked.
- collection: hypernumerary            # (b,k,n): base-b numerals over the widened digit alphabet {0..b-1+k}
  args: { b: 2, k: 1, n: 8 }
  sage: hypernumerary_words(2, 1, 8)
- collection: hypernumerary            # b=2,k=1 IS hyperbinary_representations; b=3 exercises the general engine
  args: { b: 3, k: 1, n: 11 }
  sage: hypernumerary_words(3, 1, 11)
- collection: hypernumerary            # a wider alphabet still: digits 0..4 in base 3
  args: { b: 3, k: 2, n: 7 }
  sage: hypernumerary_words(3, 2, 7)
