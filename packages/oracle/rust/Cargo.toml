# The Rust oracle lane (packages/oracle/src/run.ts): src/lib.rs is the adapters, and each scan
# batch is written to src/bin/batch.rs, built against them and run. Crates are pinned by Cargo.lock.
[package]
name = "enumeratio-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
adic = "0.5"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
primal = "0.3"
statrs = "0.18"
