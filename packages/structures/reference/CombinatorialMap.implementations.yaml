inverse-of-a-permutation:
  epsil:
    in: CombinatorialMap(Permutation([3, 1, 2]), "Inverse")
    out: Permutation([2, 3, 1])
  tex:
    in: \mathrm{CombinatorialMap}(\mathrm{Permutation}(\bigl\lbrack3, 1, 2\bigr\rbrack), \text{Inverse})
    out: \mathrm{Permutation}(\bigl\lbrack2, 3, 1\bigr\rbrack)
  fullform:
    in: CombinatorialMap[Permutation[List[3, 1, 2]], "Inverse"]
reverse-of-a-permutation:
  epsil:
    in: CombinatorialMap(Permutation([3, 1, 2]), "Reverse")
    out: Permutation([2, 1, 3])
  tex:
    in: \mathrm{CombinatorialMap}(\mathrm{Permutation}(\bigl\lbrack3, 1, 2\bigr\rbrack), \text{Reverse})
    out: \mathrm{Permutation}(\bigl\lbrack2, 1, 3\bigr\rbrack)
  fullform:
    in: CombinatorialMap[Permutation[List[3, 1, 2]], "Reverse"]
