- id: inversions-of-a-permutation
  expr: [CombinatorialStatistic, [Permutation, [List, 3, 1, 2]], "'Inversions'"]
  expected: 2
  caption: the inversions of 312
- id: by-findstat-id
  expr: [CombinatorialStatistic, [Permutation, [List, 3, 1, 2]], "'St000018'"]
  expected: 2
  caption: the same statistic, by its FindStat id
- id: sign-of-a-three-cycle
  expr: [CombinatorialStatistic, [Permutation, [List, 3, 1, 2]], "'Sign'"]
  expected: 1
  caption: a statistic whose bare name is compute-engine's `Sign`
- id: distinct-parts-of-a-partition
  expr: [CombinatorialStatistic, [IntegerPartition, [List, 3, 1, 1]], "'DistinctParts'"]
  expected: 2
  caption: the distinct parts of 311
- id: the-mahonian-distribution
  expr: [Tally, [CombinatorialStatistic, [SymmetricGroup, 4], "'Inversions'"]]
  expected: [Tuple, [List, 0, 1, 2, 3, 4, 5, 6], [List, 1, 3, 5, 6, 5, 3, 1]]
  caption: inversions over the permutations of 4
  category: Applications
- id: count-of-a-collection
  expr: [CombinatorialStatistic, [SymmetricGroup, 4], "'Count'"]
  expected: 24
  caption: a statistic of the collection itself
