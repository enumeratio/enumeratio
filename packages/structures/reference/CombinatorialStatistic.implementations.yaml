the-mahonian-distribution:
  epsil:
    in: Tally(CombinatorialStatistic(SymmetricGroup(4), "Inversions"))
    out: ([0, 1, 2, 3, 4, 5, 6], [1, 3, 5, 6, 5, 3, 1])
  tex:
    in: \mathrm{Tally}(\mathrm{CombinatorialStatistic}(\mathrm{SymmetricGroup}(4), \text{Inversions}))
    out: \operatorname{Tuple}(\bigl\lbrack0, 1, 2, 3, 4, 5, 6\bigr\rbrack,\bigl\lbrack1, 3, 5, 6, 5, 3, 1\bigr\rbrack)
  fullform:
    in: Tally[CombinatorialStatistic[SymmetricGroup[4], "Inversions"]]
count-of-a-collection:
  epsil:
    in: CombinatorialStatistic(SymmetricGroup(4), "Count")
    out: "24"
  tex:
    in: \mathrm{CombinatorialStatistic}(\mathrm{SymmetricGroup}(4), \text{Count})
    out: "24"
  fullform:
    in: CombinatorialStatistic[SymmetricGroup[4], "Count"]
