distinct-parts-of-a-partition:
  epsil:
    in: CombinatorialStatistic(IntegerPartition([3, 1, 1]), "DistinctParts")
    out: "2"
  tex:
    in: \mathrm{CombinatorialStatistic}(\mathrm{IntegerPartition}(\bigl\lbrack3, 1, 1\bigr\rbrack), \text{DistinctParts})
    out: "2"
  fullform:
