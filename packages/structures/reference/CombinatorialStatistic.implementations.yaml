inversions-of-a-permutation:
  epsil:
    in: CombinatorialStatistic(Permutation([3, 1, 2]), "Inversions")
    out: "2"
  tex:
    in: \mathrm{CombinatorialStatistic}(\mathrm{Permutation}(\bigl\lbrack3, 1, 2\bigr\rbrack), \text{Inversions})
    out: "2"
  fullform:
    in: CombinatorialStatistic[Permutation[List[3, 1, 2]], "Inversions"]
by-findstat-id:
  epsil:
    in: CombinatorialStatistic(Permutation([3, 1, 2]), "St000018")
    out: "2"
  tex:
    in: \mathrm{CombinatorialStatistic}(\mathrm{Permutation}(\bigl\lbrack3, 1, 2\bigr\rbrack), \text{St000018})
    out: "2"
  fullform:
    in: CombinatorialStatistic[Permutation[List[3, 1, 2]], "St000018"]
sign-of-a-three-cycle:
