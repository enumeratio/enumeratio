intersection-list-1-2-3-list-2-3-4:
  wolfram:
    in: Intersection[List[1, 2, 3], List[2, 3, 4]]
    out: "{2, 3}"
    tex:
      in: \{1,2,3\}\cap \{2,3,4\}
      out: \{2,3\}
intersection-list-1-2-3-4-list-2-3-4-5:
  wolfram:
    in: Intersection[List[1, 2, 3, 4], List[2, 3, 4, 5]]
    out: "{2, 3, 4}"
    tex:
      in: \{1,2,3,4\}\cap \{2,3,4,5\}
      out: \{2,3,4\}
with-three-or-more-collections-only-elements:
  wolfram:
    in: Intersection[List[1, 2, 3], List[2, 3, 4], List[2, 3, 5]]
    out: "{2, 3}"
    tex:
      in: \{1,2,3\}\cap \{2,3,4\}\cap \{2,3,5\}
      out: \{2,3\}
intersection-is-idempotent-a-cap-a-a:
  wolfram:
    in: (Intersection[Union[List[1, 2, 3]], Union[List[1, 2, 3]]] == Union[List[1, 2, 3]])
    out: True
    tex:
      in: \text{Union}[\{1,2,3\}]\cap \text{Union}[\{1,2,3\}]=\text{Union}[\{1,2,3\}]
      out: \text{True}
the-same-inclusion-exclusion-count-rearranged-a:
  wolfram:
    in: (Plus[Length[List[1, 2, 3]], Length[List[2, 3, 4]]] == Plus[Length[Union[List[1, 2, 3], List[2, 3, 4]]], Length[Intersection[List[1, 2, 3], List[2, 3, 4]]]])
    out: True
    tex:
      in: \text{Length}[\{1,2,3\}]+\text{Length}[\{2,3,4\}]=\text{Length}[\{1,2,3\}\cup \{2,3,4\}]+\text{Length}[\{1,2,3\}\cap \{2,3,4\}]
      out: \text{True}
disjoint-collections-intersect-to-the-special:
  wolfram:
    in: Intersection[List[1, 2], List[3, 4]]
    out: "{}"
    tex:
      in: \{1,2\}\cap \{3,4\}
      out: \{\}
    verdict: disagree
    kind: shape
    note: An empty result is the symbol EmptySet here and the empty list {} in Wolfram.
the-divisors-common-to-45-and-78:
  wolfram:
    in: Intersection[Divisors[45], Divisors[78]]
    out: "{1, 3}"
    tex:
      in: \text{Divisors}[45]\cap \text{Divisors}[78]
      out: \{1,3\}
the-result-keeps-the-order-elements-were-met-in:
