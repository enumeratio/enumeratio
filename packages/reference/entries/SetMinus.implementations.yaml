the-result-keeps-the-first-set-s-order-rather:
  epsil:
    in: SetMinus({5, 4, 3, 2, 1}, {2})
    out: "{5, 4, 3, 1}"
  tex:
    in: \lbrace5, 4, 3, 2, 1\rbrace\setminus\lbrace2\rbrace
    out: \lbrace5, 4, 3, 1\rbrace
  wolfram:
    in: Complement[Union[List[5, 4, 3, 2, 1]], Union[List[2]]]
    back: [SetMinus, [Union, [List, 5, 4, 3, 2, 1]], [Union, [List, 2]]]
    note: "Wolfram's Complement sorts its result: Complement[{5, 4, 3, 2, 1}, {2}] is {1, 3, 4, 5}."
