setminus-1-2-3-2:
  wolfram:
    in: Complement[Union[List[1, 2, 3]], Union[List[2]]]
    out: "{1, 3}"
    tex:
      in: \text{Complement}[\text{Union}[\{1,2,3\}],\text{Union}[\{2\}]]
      out: \{1,3\}
setminus-1-2-3-4-2-4:
  wolfram:
    in: Complement[Union[List[1, 2, 3, 4]], Union[List[2, 4]]]
    out: "{1, 3}"
    tex:
      in: \text{Complement}[\text{Union}[\{1,2,3,4\}],\text{Union}[\{2,4\}]]
      out: \{1,3\}
removing-elements-that-aren-t-present-leaves-the:
  wolfram:
    in: Complement[Union[List[1, 2, 3]], Union[List[9]]]
    out: "{1, 2, 3}"
    tex:
      in: \text{Complement}[\text{Union}[\{1,2,3\}],\text{Union}[\{9\}]]
      out: \{1,2,3\}
a-setminus-a-setminus-b-a-cap-b-see-intersection:
  wolfram:
    in: (Complement[Union[List[1, 2, 3, 4]], Complement[Union[List[1, 2, 3, 4]], Union[List[2, 4]]]] == Intersection[Union[List[1, 2, 3, 4]], Union[List[2, 4]]])
    out: True
    tex:
      in: \text{Complement}[\text{Union}[\{1,2,3,4\}],\text{Complement}[\text{Union}[\{1,2,3,4\}],\text{Union}[\{2,4\}]]]=\text{Union}[\{1,2,3,4\}]\cap \text{Union}[\{2,4\}]
      out: \text{True}
setminus-is-not-commutative-b-setminus-a-can:
  wolfram:
    in: Complement[Union[List[2, 4]], Union[List[1, 2, 3, 4]]]
    out: "{}"
    tex:
      in: \text{Complement}[\text{Union}[\{2,4\}],\text{Union}[\{1,2,3,4\}]]
      out: \{\}
    verdict: disagree
    kind: shape
    note: An empty result is the symbol EmptySet here and the empty list {} in Wolfram.
the-result-keeps-the-first-set-s-order-rather:
  wolfram:
    in: Complement[Union[List[5, 4, 3, 2, 1]], Union[List[2]]]
    note: "Wolfram's Complement sorts its result: Complement[{5, 4, 3, 2, 1}, {2}] is {1, 3, 4, 5}."
