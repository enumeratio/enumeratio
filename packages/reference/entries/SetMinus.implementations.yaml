setminus-1-2-3-2:
  epsil:
    in: SetMinus({1, 2, 3}, {2})
    out: "{1, 3}"
  tex:
    in: \lbrace1, 2, 3\rbrace\setminus\lbrace2\rbrace
    out: \lbrace1, 3\rbrace
  wolfram:
    in: Complement[Union[List[1, 2, 3]], Union[List[2]]]
    back: [SetMinus, [Union, [List, 1, 2, 3]], [Union, [List, 2]]]
    out: "{1, 3}"
    tex:
      in: \text{Complement}[\text{Union}[\{1,2,3\}],\text{Union}[\{2\}]]
      out: \{1,3\}
