    identity: perms
    url: https://www.mathworks.com/help/matlab/ref/perms.html
    note: perms(v) returns all n! permutations of v, but in reverse-lexicographic order of the element indices — our permutations() fiber_unrank/elements() order is plain lexicographic ascending, so the SET matches but the ORDER does not
