    in: ClausenCl(2, Pi / 2)
    out: Catalan
  tex:
    in: \mathrm{ClausenCl}(2, \frac{\pi}{2})
    out: \mathrm{Catalan}
  traditional:
    in: \operatorname{Cl}_{2}(\frac{\pi}{2})
    out: \mathrm{Catalan}
  fullform:
    in: ClausenCl[2, Divide[Pi, 2]]
  wolfram:
    in: ResourceFunction["ClausenCl"][2, Divide[Pi, 2]]
    out: Catalan
