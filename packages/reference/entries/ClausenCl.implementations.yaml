      out: C
odd-orders-are-cosine-series-cl-3-0-zeta-3:
  epsil:
    in: ClausenCl(3, 0)
    out: Zeta(3)
  tex:
    in: \mathrm{ClausenCl}(3, 0)
    out: \zeta(3)
  traditional:
    in: \operatorname{Cl}_{3}(0)
    out: \zeta(3)
  fullform:
    in: ClausenCl[3, 0]
  wolfram:
    in: ResourceFunction["ClausenCl"][3, 0]
    out: If[OddQ, Zeta[3], 0]
    tex:
      in: \text{ResourceFunction}[\text{ClausenCl}][3,0]
      out: \text{If}[\text{OddQ},\zeta (3),0]
    verdict: disagree
    kind: unevaluated
    note: The Function Repository's ClausenCl returns an unevaluated If[OddQ, …] at θ = 0 (a bug in that function); it does not dispute ζ(3).
