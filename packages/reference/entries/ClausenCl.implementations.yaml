cl-4-pi-2-beta-4-which-has-no-closed-form-of-its:
  epsil:
    in: ClausenCl(4, Pi / 2)
    out: DirichletBeta(4)
  tex:
    in: \mathrm{ClausenCl}(4, \frac{\pi}{2})
    out: \mathrm{DirichletBeta}(4)
  traditional:
    in: \operatorname{Cl}_{4}(\frac{\pi}{2})
    out: \beta(4)
  fullform:
    in: ClausenCl[4, Divide[Pi, 2]]
  wolfram:
    in: ResourceFunction["ClausenCl"][4, Divide[Pi, 2]]
    out: (Zeta[4, 1/4]/16 - Zeta[4, 3/4]/16)/16
    tex:
      in: \text{ResourceFunction}[\text{ClausenCl}]\left[4,\frac{\pi }{2}\right]
      out: \frac{1}{16} \left(\frac{\zeta \left(4,\frac{1}{4}\right)}{16}-\frac{\zeta \left(4,\frac{3}{4}\right)}{16}\right)
    verdict: disagree
    kind: shape
    note: Wolfram answers (ζ(4,1/4) − ζ(4,3/4))/256, which is β(4) spelled through Hurwitz zeta.
