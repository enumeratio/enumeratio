commutative-order-doesn-t-matter:
  epsil:
    in: Min(3, 7) == Min(7, 3)
    out: True
  tex:
    in: \min(3, 7)=\min(7, 3)
    out: \top
  traditional:
    in: \min(3, 7)=\min(7, 3)
    out: \mathrm{True}
  fullform:
    in: Equal[Min[3, 7], Min[7, 3]]
  wolfram:
    in: (Min[3, 7] == Min[7, 3])
    out: True
    tex:
      in: \min (3,7)=\min (7,3)
      out: \text{True}
  sage:
    in: bool(enumeratio_min(3, 7) == enumeratio_min(7, 3))
    out: True
  sympy:
    in: enumeratio_equal(enumeratio_min(3, 7), enumeratio_min(7, 3))
    out: True
min-a-b-max-a-b-a-b-see-max:
  epsil:
    in: Min(4, 9) + Max(4, 9) == 4 + 9
    out: True
  tex:
    in: \min(4, 9)+\max(4, 9)=4+9
    out: \top
  traditional:
    in: \min(4, 9)+\max(4, 9)=4+9
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[Min[4, 9], Max[4, 9]], Plus[4, 9]]
  wolfram:
    in: (Plus[Min[4, 9], Max[4, 9]] == Plus[4, 9])
    out: True
    tex:
      in: \min (4,9)+\max (4,9)=4+9
      out: \text{True}
  sage:
    in: bool((enumeratio_min(4, 9) + enumeratio_max(4, 9)) == (4 + 9))
    out: True
  sympy:
    in: enumeratio_equal((enumeratio_min(4, 9) + enumeratio_max(4, 9)), (4 + 9))
    out: True
