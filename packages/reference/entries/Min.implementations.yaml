nested-lists-are-flattened-into-the-pool:
  epsil:
    in: Min(2, 3, [[1 / 2, -1], [-5 / 3, 1 / 2]])
    out: -5 / 3
  tex:
    in: \min(2, 3, \bigl\lbrack\bigl\lbrack\frac{1}{2}, -1\bigr\rbrack, \bigl\lbrack-\frac{5}{3}, \frac{1}{2}\bigr\rbrack\bigr\rbrack)
    out: -\frac{5}{3}
  fullform:
    in: Min[2, 3, List[List[Rational[1, 2], -1], List[Rational[-5, 3], Rational[1, 2]]]]
  wolfram:
    in: Min[2, 3, List[List[Rational[1, 2], -1], List[Rational[-5, 3], Rational[1, 2]]]]
  sage:
    in: enumeratio_min(2, 3, [[(1/2), (-1)], [((-5)/3), (1/2)]])
  sympy:
    in: enumeratio_min(2, 3, [[Rational(1, 2), (-1)], [Rational((-5), 3), Rational(1, 2)]])
    out: -5/3
