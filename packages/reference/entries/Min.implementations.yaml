min-3-1-4-1-5:
  epsil:
    in: Min(3, 1, 4, 1, 5)
    out: "1"
  tex:
    in: \min(3, 1, 4, 1, 5)
    out: "1"
  fullform:
    in: Min[3, 1, 4, 1, 5]
  wolfram:
    in: Min[3, 1, 4, 1, 5]
    out: "1"
    tex:
      in: \min (3,1,4,1,5)
      out: "1"
  sage:
    in: enumeratio_min(3, 1, 4, 1, 5)
    out: "1"
  sympy:
    in: enumeratio_min(3, 1, 4, 1, 5)
    out: "1"
