min-3-1-4-1-5:
  wolfram:
    in: Min[3, 1, 4, 1, 5]
    out: "1"
    tex:
      in: \min (3,1,4,1,5)
      out: "1"
  sage:
    in: enumeratio_min(3, 1, 4, 1, 5)
    out: "1"
  sympy:
    in: Min(3, 1, 4, 1, 5)
    out: "1"
also-accepts-a-single-list-argument:
  wolfram:
    in: Min[List[3, 1, 4]]
    out: "1"
    tex:
      in: \min (\{3,1,4\})
      out: "1"
  sage:
    in: enumeratio_min([3, 1, 4])
    out: "1"
  sympy:
    in: Min([3, 1, 4])
    out: "ValueError: The argument '[3, 1, 4]' is not comparable."
    verdict: error
    kind: threading
    note: compute-engine's Min threads over (or pools) the list; SymPy's takes scalars.
min-neg-1-neg-5:
  wolfram:
    in: Min[-1, -5]
    out: "-5"
    tex:
      in: \min (-1,-5)
      out: "-5"
  sage:
    in: enumeratio_min(-1, -5)
    out: "-5"
  sympy:
    in: Min(-1, -5)
    out: "-5"
a-single-argument-is-returned-unchanged:
  wolfram:
    in: Min[3]
    out: "3"
    tex:
      in: \min (3)
      out: "3"
  sage:
    in: enumeratio_min(3)
    out: "3"
  sympy:
    in: Min(3)
    out: "3"
commutative-order-doesn-t-matter:
  wolfram:
    in: (Min[3, 7] == Min[7, 3])
    out: True
    tex:
      in: \min (3,7)=\min (7,3)
      out: \text{True}
  sage:
    in: bool(enumeratio_min(3, 7) == enumeratio_min(7, 3))
    out: True
  sympy:
    in: enumeratio_equal(Min(3, 7), Min(7, 3))
    out: True
min-a-b-max-a-b-a-b-see-max:
  wolfram:
    in: (Plus[Min[4, 9], Max[4, 9]] == Plus[4, 9])
    out: True
    tex:
      in: \min (4,9)+\max (4,9)=4+9
      out: \text{True}
  sage:
    in: bool((enumeratio_min(4, 9) + enumeratio_max(4, 9)) == (4 + 9))
    out: True
  sympy:
    in: enumeratio_equal((Min(4, 9) + Max(4, 9)), (4 + 9))
    out: True
the-day-s-low-from-the-same-hourly-readings-see:
  wolfram:
    in: Min[68, 72, 65, 80, 74]
    out: "65"
    tex:
      in: \min (68,72,65,80,74)
      out: "65"
  sage:
    in: enumeratio_min(68, 72, 65, 80, 74)
    out: "65"
  sympy:
    in: Min(68, 72, 65, 80, 74)
    out: "65"
infinities-participate-directly-in-the:
  wolfram:
    in: Min[-Infinity, 3]
    out: -Infinity
    tex:
      in: \min (-\infty ,3)
      out: -\infty
multiple-arguments-lists-included-are-flattened:
  wolfram:
    in: Min[List[3, 1], 0]
    out: "0"
    tex:
      in: \min (\{3,1\},0)
      out: "0"
  sage:
    in: enumeratio_min([3, 1], 0)
    out: "0"
  sympy:
    in: Min([3, 1], 0)
    out: "ValueError: The argument '[3, 1]' is not comparable."
    verdict: error
    kind: threading
    note: compute-engine's Min threads over (or pools) the list; SymPy's takes scalars.
the-min-of-an-empty-list-is-nan:
  wolfram:
    in: Min[List[]]
    note: Wolfram's $\mathrm{Min}[\{\}]$ is the identity element $+\infty$.
