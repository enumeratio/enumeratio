min-3-1-4-1-5:
  wolfram:
    in: Min[3, 1, 4, 1, 5]
    out: "1"
    tex:
      in: \min (3,1,4,1,5)
      out: "1"
  sage:
    in: enumeratio_min(3, 1, 4, 1, 5)
    out: "1"
  sympy:
    in: enumeratio_min(3, 1, 4, 1, 5)
    out: "1"
also-accepts-a-single-list-argument:
  wolfram:
    in: Min[List[3, 1, 4]]
    out: "1"
    tex:
      in: \min (\{3,1,4\})
      out: "1"
  sage:
    in: enumeratio_min([3, 1, 4])
    out: "1"
  sympy:
    in: enumeratio_min([3, 1, 4])
    out: "1"
min-neg-1-neg-5:
  wolfram:
    in: Min[-1, -5]
    out: "-5"
    tex:
      in: \min (-1,-5)
      out: "-5"
  sage:
    in: enumeratio_min(-1, -5)
    out: "-5"
  sympy:
    in: enumeratio_min((-1), (-5))
    out: "-5"
a-single-argument-is-returned-unchanged:
  wolfram:
    in: Min[3]
    out: "3"
    tex:
      in: \min (3)
      out: "3"
  sage:
    in: enumeratio_min(3)
    out: "3"
  sympy:
    in: enumeratio_min(3)
    out: "3"
commutative-order-doesn-t-matter:
  wolfram:
    in: (Min[3, 7] == Min[7, 3])
    out: True
    tex:
      in: \min (3,7)=\min (7,3)
      out: \text{True}
  sage:
    in: bool(enumeratio_min(3, 7) == enumeratio_min(7, 3))
    out: True
  sympy:
    in: enumeratio_equal(enumeratio_min(3, 7), enumeratio_min(7, 3))
    out: True
min-a-b-max-a-b-a-b-see-max:
  wolfram:
    in: (Plus[Min[4, 9], Max[4, 9]] == Plus[4, 9])
    out: True
    tex:
      in: \min (4,9)+\max (4,9)=4+9
      out: \text{True}
  sage:
    in: bool((enumeratio_min(4, 9) + enumeratio_max(4, 9)) == (4 + 9))
    out: True
  sympy:
    in: enumeratio_equal((enumeratio_min(4, 9) + enumeratio_max(4, 9)), (4 + 9))
    out: True
the-day-s-low-from-the-same-hourly-readings-see:
  wolfram:
    in: Min[68, 72, 65, 80, 74]
    out: "65"
    tex:
      in: \min (68,72,65,80,74)
      out: "65"
  sage:
    in: enumeratio_min(68, 72, 65, 80, 74)
    out: "65"
  sympy:
    in: enumeratio_min(68, 72, 65, 80, 74)
    out: "65"
infinities-participate-directly-in-the:
  wolfram:
    in: Min[-Infinity, 3]
    out: -Infinity
    tex:
      in: \min (-\infty ,3)
      out: -\infty
multiple-arguments-lists-included-are-flattened:
  wolfram:
    in: Min[List[3, 1], 0]
    out: "0"
    tex:
      in: \min (\{3,1\},0)
      out: "0"
  sage:
    in: enumeratio_min([3, 1], 0)
    out: "0"
  sympy:
    in: enumeratio_min([3, 1], 0)
    out: "0"
the-min-of-an-empty-list-is-nan:
  wolfram:
    in: Min[List[]]
    note: Wolfram's $\mathrm{Min}[\{\}]$ is the identity element $+\infty$.
  sympy:
    in: enumeratio_min([])
    out: oo
    verdict: disagree
    kind: convention
    note: Same as the Wolfram row above -- SymPy's min() of an empty sequence also takes the identity element (+infinity); we deliberately return NaN for Min of an empty LIST (a no-argument Min[] still returns the identity, see the example above this one).
min-9-2:
  sympy:
    in: enumeratio_min(9, 2)
    out: "2"
min-list-4-1-7-2:
  sympy:
    in: enumeratio_min([4, 1, 7, 2])
    out: "1"
min-5p56-neg-4p8-7p3:
  sympy:
    in: enumeratio_min(5.56, (-4.8), 7.3)
    out: "-4.80000000000000"
nested-lists-are-flattened-into-the-pool:
  sympy:
    in: enumeratio_min(2, 3, [[Rational(1, 2), (-1)], [Rational((-5), 3), Rational(1, 2)]])
    out: -5/3
exact-numbers-are-compared-numerically:
  sympy:
    in: enumeratio_min(sqrt(2), Rational(3, 2))
    out: sqrt(2)
compares-exact-constants-numerically-min-e-pi-5:
  sympy:
    in: enumeratio_min([E, pi, 5])
    out: E
with-no-arguments-it-returns-the-identity:
  sympy:
    in: enumeratio_min()
    out: oo
