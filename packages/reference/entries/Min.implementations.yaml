with-no-arguments-it-returns-the-identity:
  epsil:
    in: Min()
    out: PositiveInfinity
  tex:
    in: \min()
    out: \infty
  fullform:
    in: Min[]
  wolfram:
    in: Min[]
  sage:
    in: enumeratio_min()
  sympy:
    in: enumeratio_min()
    out: oo
the-min-of-an-empty-list-is-nan:
  epsil:
    in: Min([])
    out: "`NaN`"
  tex:
    in: \min(\bigl\lbrack \bigr\rbrack)
    out: \operatorname{NaN}
  fullform:
    in: Min[List[]]
  wolfram:
    in: Min[List[]]
    note: Wolfram's $\mathrm{Min}[\{\}]$ is the identity element $+\infty$.
  sage:
    in: enumeratio_min([])
  sympy:
    in: enumeratio_min([])
    out: oo
    verdict: disagree
    kind: convention
    note: Same as the Wolfram row above -- SymPy's min() of an empty sequence also takes the identity element (+infinity); we deliberately return NaN for Min of an empty LIST (a no-argument Min[] still returns the identity, see the example above this one).
min-min-folds-into-a-normal-call:
  epsil:
    in: Min(Min(), 5)
    out: "5"
  tex:
    in: \min(\min(), 5)
    out: "5"
  fullform:
    in: Min[Min[], 5]
  wolfram:
    in: Min[Min[], 5]
  sage:
    in: enumeratio_min(enumeratio_min(), 5)
  sympy:
    in: enumeratio_min(enumeratio_min(), 5)
    out: "5"
