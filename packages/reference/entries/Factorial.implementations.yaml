    in: factorial(-1)
    out: zoo
  sage:
    in: factorial(-1)
    out: "ValueError: factorial only defined for nonnegative integers"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity" and Sage raises an error.'
  oscar:
    in: factorial(ZZ(-1))
    out: "DomainError with -1: Argument must be non-negative"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity" and Oscar raises an error.'
  julia:
    in: factorial(ZZ(-1))
    out: "DomainError with -1: Argument must be non-negative"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity" and Nemo/Combinatorics.jl raises an error.'
  mathlib4:
    in: (Nat.factorial (-1))
    out: failed to synthesize instance of type class
    verdict: error
    kind: domain
    note: The Mathlib mapping is over Nat, which has no negative numbers; compute-engine extends Factorial to this argument.
  rust:
    in: factorial(n(-1))
    out: "panic: a non-negative integer"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity", and Rust gives panic: a non-negative integer.'
