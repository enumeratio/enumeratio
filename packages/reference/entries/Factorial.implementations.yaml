complex-arguments-1-i-gamma-2-i:
  epsil:
    in: (1 + i)!
    out: 0.652_965_496_420_167_4 + 0.343_065_839_816_546_3i
  tex:
    in: (1+i)!
    out: 0.652\,965\,496\,420\,167\,4+0.343\,065\,839\,816\,546\,3i
  fullform:
    in: Factorial[Complex[1, 1]]
  wolfram:
    in: Factorial[Complex[1, 1]]
  sympy:
    in: factorial((1 + 1*I))
    out: factorial(1 + I)
  sage:
    in: factorial((1 + 1*I))
    out: factorial(I + 1)
    verdict: disagree
    kind: unevaluated
    note: compute-engine evaluates a complex argument through Gamma(n+1); Sage's factorial() leaves a complex argument unevaluated, printing factorial(I + 1) back symbolically.
  oscar:
    in: factorial(ZZ(complex(1, 1)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: compute-engine evaluates a complex argument through Gamma(n+1); Oscar's ZZ wrapper is rational integers only, no Gaussian integers.
  julia:
    in: factorial(ZZ(complex(1, 1)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: Nemo's ZZ has no Gaussian integers; ours evaluates a complex argument through Gamma(n+1).
