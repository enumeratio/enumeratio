threads-element-wise-over-a-list:
  wolfram:
    in: Factorial[List[1, 2, 3, 4]]
    out: "{1, 2, 6, 24}"
    tex:
      in: \{1,2,3,4\}!
      out: \{1,2,6,24\}
  sage:
    in: factorial([1, 2, 3, 4])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Factorial is Listable and threads over the list; Sage's takes scalars only.
  julia:
    in: factorial(ZZ([1, 2, 3, 4]))
    out: "MethodError: no method matching (::ZZRing)(::Vector{Int64}) The object of type `ZZRing` exists, but "
    verdict: error
    kind: threading
    note: compute-engine's Factorial is Listable and threads over the list; Nemo/Combinatorics.jl's takes scalars only.
  mathlib4:
    in: (Nat.factorial [1, 2, 3, 4])
    out: "Application type mismatch: The argument"
    verdict: error
    kind: threading
    note: compute-engine's Factorial is Listable and threads over the list; Mathlib's takes scalars only.
  oscar:
    in: factorial(ZZ([1, 2, 3, 4]))
    out: "MethodError: no method matching (::ZZRing)(::Vector{Int64}) The object of type `ZZRing` exists, but "
    verdict: error
    kind: threading
    note: compute-engine's Factorial is Listable and threads over the list; Oscar's takes scalars only.
  rust:
    in: factorial(list(vec![n(1), n(2), n(3), n(4)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Factorial is Listable and threads over the list; the Rust crates take scalars.
  sympy:
    in: factorial([1, 2, 3, 4])
    out: "AttributeError: 'list' object has no attribute 'is_Number'"
    verdict: error
    kind: threading
    note: compute-engine's Factorial threads over (or pools) the list; SymPy's takes scalars.
recurrence-n-n-n-1:
  wolfram:
    in: (Factorial[5] == Times[5, Factorial[4]])
    out: True
    tex:
      in: 5!=5 4!
      out: \text{True}
  sage:
    in: bool(factorial(5) == (5 * factorial(4)))
    out: True
  julia:
    in: (factorial(ZZ(5)) == (5 * factorial(ZZ(4))))
    out: "true"
  mathlib4:
    in: (decide ((Nat.factorial 5) = (5 * (Nat.factorial 4))))
    out: "true"
  oscar:
    in: (factorial(ZZ(5)) == (5 * factorial(ZZ(4))))
    out: "true"
  rust:
    in: equal(factorial(n(5)), (n(5) * factorial(n(4))))
    out: "true"
  sympy:
    in: enumeratio_equal(factorial(5), (5 * factorial(4)))
    out: True
extends-to-non-integers-via-the-gamma-function:
  wolfram:
    in: Factorial[Rational[1, 2]]
    out: Sqrt[Pi]/2
    tex:
      in: \frac{1}{2}!
      out: \frac{\sqrt{\pi }}{2}
  sage:
    in: factorial((1/2))
    out: 1/2*sqrt(pi)
  julia:
    in: factorial(ZZ((1 // 2)))
    out: "AssertionError: denominator(x) == 1"
    verdict: error
    kind: domain
    note: compute-engine extends Factorial to non-integers through Gamma; Nemo/Combinatorics.jl's factorial takes integers only.
  mathlib4:
    in: "(Nat.factorial ((1 : ℚ) / 2))"
    out: Type mismatch
    verdict: error
    kind: domain
    note: compute-engine extends Factorial to non-integers through Gamma; Mathlib's factorial takes integers only.
  oscar:
    in: factorial(ZZ((1 // 2)))
    out: "AssertionError: denominator(x) == 1"
    verdict: error
    kind: domain
    note: compute-engine extends Factorial to non-integers through Gamma; Oscar's factorial takes integers only.
  rust:
    in: factorial(rational(n(1), n(2)))
    out: "panic: an integer, not 1/2"
    verdict: error
    kind: domain
    note: statrs' factorial takes non-negative integers; compute-engine extends Factorial through Gamma.
  sympy:
    in: factorial(Rational(1, 2))
    out: factorial(1/2)
