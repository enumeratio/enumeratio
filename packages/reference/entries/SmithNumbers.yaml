name: SmithNumbers
domain: Collections
signature: SmithNumbers
summary: "The Smith numbers $4, 22, 27, 58, 85, …$: composite integers whose digit sum equals the digit sum of their prime factors (with multiplicity)."
signatures:
  - call: SmithNumbers
    description: the composite $n$ with $\mathrm{digitSum}(n) = \sum \mathrm{digitSum}(p)$ over $n$'s prime factorisation, an infinite indexed collection.
details:
  - 'A lazy indexed collection: $Count(SmithNumbers) = +\infty$ (McDaniel, 1987). OEIS A006753.'
  - $At(SmithNumbers, k)$ unranks by scanning forward, factoring each candidate -- $At(SmithNumbers, 2) = 22$ ($2+2=4$; factors $2, 11$, digit sums $2+1+1=4$).
  - 'Membership goes through [[Element]]: $Element(4, SmithNumbers)$ is true ($4=2 \times 2$: digit sums $4 = 2+2$), $Element(6, SmithNumbers)$ is false ($6=2\times3$: digit sums $2+3=5 \ne 6$).'
enumerate:
  expr: Take(SmithNumbers, 20)
seeAlso:
  - Count
  - At
  - Element
  - HarshadNumbers
  - SemiprimeNumbers
catalog:
  - system: oeis
    identity: A006753
    url: https://oeis.org/A006753
