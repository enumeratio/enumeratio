the-set-partitions-of-an-explicit-list-in-the:
  epsil:
    in: SetPartitions([a, b, c])
    out: "[[[a, b, c]], [[a, b], [c]], [[a, c], [b]], [[a], [b, c]], [[a], [b], [c]]]"
  tex:
    in: \mathrm{SetPartitions}(\bigl\lbrack a, b, c\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\bigl\lbrack a, b, c\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack a, b\bigr\rbrack, \bigl\lbrack c\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack a, c\bigr\rbrack, \bigl\lbrack b\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack a\bigr\rbrack, \bigl\lbrack b, c\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack a\bigr\rbrack, \bigl\lbrack b\bigr\rbrack, \bigl\lbrack c\bigr\rbrack\bigr\rbrack\bigr\rbrack
  fullform:
    in: SetPartitions[List[a, b, c]]
exactly-2-blocks:
  epsil:
    in: SetPartitions(3, 2)
    out: "[[[1, 2], [3]], [[1, 3], [2]], [[1], [2, 3]]]"
  tex:
    in: \mathrm{SetPartitions}(3, 2)
    out: \bigl\lbrack\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack1, 3\bigr\rbrack, \bigl\lbrack2\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack1\bigr\rbrack, \bigl\lbrack2, 3\bigr\rbrack\bigr\rbrack\bigr\rbrack
  fullform:
    in: SetPartitions[3, 2]
the-partitions-of-a-4-set-into-2-blocks-number-s:
