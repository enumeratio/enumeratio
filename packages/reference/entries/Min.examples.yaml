- id: min-3-1-4-1-5
  expr: [Min, 3, 1, 4, 1, 5]
  expected: 1
- id: also-accepts-a-single-list-argument
  expr: [Min, [List, 3, 1, 4]]
  expected: 1
  caption: Also accepts a single list argument
- id: min-neg-1-neg-5
  expr: [Min, -1, -5]
  expected: -5
- id: a-single-argument-is-returned-unchanged
  expr: [Min, 3]
  expected: 3
  caption: A single argument is returned unchanged
- id: commutative-order-doesn-t-matter
  expr: [Equal, [Min, 3, 7], [Min, 7, 3]]
  expected: True
  category: Properties
  caption: "Commutative: order doesn't matter"
- id: min-a-b-max-a-b-a-b-see-max
  expr: [Equal, [Add, [Min, 4, 9], [Max, 4, 9]], [Add, 4, 9]]
  expected: True
  category: Properties
  caption: $\min(a,b) + \max(a,b) = a + b$. See [[Max]]
- id: the-day-s-low-from-the-same-hourly-readings-see
  expr: [Min, 68, 72, 65, 80, 74]
  expected: 65
  category: Applications
  caption: The day's low from the same hourly readings. See [[Max]]
- id: infinities-participate-directly-in-the
  expr: [Min, NegativeInfinity, 3]
  expected: NegativeInfinity
  category: Possible issues
  caption: Infinities participate directly in the comparison rather than being filtered out
- id: multiple-arguments-lists-included-are-flattened
  expr: [Min, [List, 3, 1], 0]
  expected: 0
  category: Possible issues
  caption: Multiple arguments -- lists included -- are flattened into one pool rather than compared list-by-list. See [[Max]]
- id: min-9-2
  expr: [Min, 9, 2]
  expected: 2
- id: min-list-4-1-7-2
  expr: [Min, [List, 4, 1, 7, 2]]
  expected: 1
- id: min-5p56-neg-4p8-7p3
  expr: [Min, 5.56, -4.8, 7.3]
  expected: -4.8
- id: nested-lists-are-flattened-into-the-pool
  expr: [Min, 2, 3, [List, [List, [Rational, 1, 2], -1], [List, [Rational, -5, 3], [Rational, 1, 2]]]]
  expected: [Rational, -5, 3]
  category: Scope
  caption: Nested lists are flattened into the pool
- id: exact-numbers-are-compared-numerically
  expr: [Min, [Sqrt, 2], [Rational, 3, 2]]
  expected: [Sqrt, 2]
  category: Scope
  caption: Exact numbers are compared numerically
- id: the-numeric-arguments-collapse-to-their-minimum
  expr: [Min, 3, x, 5]
  expected: [Min, 3, x]
  category: Scope
  caption: The numeric arguments collapse to their minimum; symbolic ones stay
- id: compares-exact-constants-numerically-min-e-pi-5
  expr: [Min, [List, ExponentialE, Pi, 5]]
  expected: ExponentialE
  category: Scope
  caption: 'Compares exact constants numerically: $\min(e, \pi, 5) = e$'
- id: the-min-of-two-intervals-is-the-interval-of
  expr: [Min, [Interval, 1, 3], [Interval, -3, 5]]
  expected: [Interval, -3, 3]
  category: Scope
  caption: The min of two [[Interval]]s is the interval of possible minima, $[-3, 3]$
- id: idempotent-min-x-x-x
  expr: [Min, x, x]
  expected: x
  category: Properties
  caption: 'Idempotent: $\min(x, x) = x$'
- id: with-no-arguments-it-returns-the-identity
  expr: [Min]
  expected: PositiveInfinity
  category: Possible issues
  caption: With no arguments it returns the identity element $+\infty$ (Max, whose identity is $-\infty$, still returns NaN)
- id: the-min-of-an-empty-list-is-nan
  expr: [Min, [List]]
  expected: NaN
  category: Possible issues
  caption: The min of an empty list is NaN
- id: min-min-folds-into-a-normal-call
  expr: [Min, [Min], 5]
  expected: 5
  role: test
  caption: The identity element folds into a normal call like any other argument
