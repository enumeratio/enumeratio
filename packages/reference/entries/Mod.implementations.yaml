17-mod-5:
  wolfram:
    in: Mod[17, 5]
    out: "2"
    tex:
      in: (17 \bmod 5)
      out: "2"
  sage:
    in: (17 % 5)
    out: "2"
  julia:
    in: mod(17, 5)
    out: "2"
  oscar:
    in: mod(17, 5)
    out: "2"
  mathlib4:
    in: "((17 : ℤ) % 5)"
    out: "2"
  rust:
    in: mod_floor(n(17), n(5))
    out: "2"
  sympy:
    in: (17 % 5)
    out: "2"
