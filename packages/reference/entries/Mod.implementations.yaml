a-gaussian-integer-5-3i-2-2-2i:
  sympy:
    in: ((5 + 3*I) % 2)
    out: "TypeError: Invalid comparison of non-real (1 - I)**2*(-2*I - (1 - I)**2)/2"
    verdict: error
    kind: domain
    note: Python's % doesn't support a Gaussian-integer modulus; SymPy's Mod tries to compare a non-real quantity and raises. Ours implements Gaussian-integer division deliberately (see this head's Scope examples).
1-i-divides-5-3i-1-i-4-i:
  sympy:
    in: ((5 + 3*I) % (1 + 1*I))
    out: (1 + I)*(Mod((1 - I)*(5 + 3*I)/2, (1 - I)*(1 + I)/2))
    verdict: inconclusive
    kind: domain
    note: Same underlying gap as the row above -- SymPy's Mod can't reduce a Gaussian-integer modulus, so it stays symbolic instead of reducing to 0.
