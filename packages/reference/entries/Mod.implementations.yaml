the-remainder-of-quotient:
  epsil:
    in: (7 + 5i) % (2 + i) == 7 + 5i - (2 + i) * Quotient(7 + 5i, 2 + i)
    out: True
  tex:
    in: (7+5i)\bmod(2+i)=(7+5i)-(2+i)\mathrm{Quotient}(7+5i, 2+i)
    out: \top
  traditional:
    in: (7+5i)\bmod(2+i)=(7+5i)-(2+i)\mathrm{Quotient}(7+5i, 2+i)
    out: \mathrm{True}
  fullform:
