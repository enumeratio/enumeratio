gaussian-integers-the-quotient-rounds-so-each:
  epsil:
    in: (7 + 5i) % 3
    out: 1 + -1 * i
  tex:
    in: (7+5i)\bmod3
    out: 1-i
  fullform:
    in: Mod[Complex[7, 5], 3]
  wolfram:
    in: Mod[Complex[7, 5], 3]
    out: 1 - I
    tex:
      in: ((7+5 i) \bmod 3)
      out: 1-i
  sympy:
    in: ((7 + 5*I) % 3)
    out: Mod(1 + 5*I, 3)
    verdict: disagree
    kind: domain
    note: SymPy leaves a Gaussian-integer remainder unevaluated; compute-engine reduces it.
  sage:
    in: ((7 + 5*I) % 3)
    out: "TypeError: unsupported operand parent(s) for %: 'Number Field in I with defining polynomial x^2 + 1 with I = 1*"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so Mod over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
  oscar:
    in: mod(complex(7, 5), 3)
    out: "MethodError: no method matching mod(::Complex{Int64}, ::Int64) The function `mod` exists, but no met"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to the Oscar mapping as a complex number in the Complex{Int} type, not an element of ℤ[i], so Mod over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
  julia:
    in: mod(complex(7, 5), 3)
    out: "MethodError: no method matching mod(::Complex{Int64}, ::Int64) The function `mod` exists, but no met"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to the Julia (Nemo) mapping as a complex number in the Complex{Int} type, not an element of ℤ[i], so Mod over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
