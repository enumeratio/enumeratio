square-2-over-3:
  epsil:
    in: Square(2 / 3)
    out: 4 / 9
  tex:
    in: \left(\frac{2}{3}\right)^2
    out: \frac{4}{9}
  wolfram:
    in: (Rational[2, 3])^2
    back: Unreadable
    out: 4/9
    tex:
      in: \left(\frac{2}{3}\right)^2
      out: \frac{4}{9}
  sympy:
    in: (Rational(2, 3))**2
    out: 4/9
  sage:
    in: ((2/3))^2
    out: 4/9
canonicalizes-to-x-2:
  epsil:
    in: Square(x)
    out: x ^ 2
  tex:
    in: x^2
    out: x^2
threads-element-wise-over-a-list:
  epsil:
    in: Square([2, 3, -4])
    out: "[4, 9, 16]"
  tex:
    in: \bigl\lbrack2, 3, -4\bigr\rbrack^2
    out: \bigl\lbrack4, 9, 16\bigr\rbrack
  wolfram:
    in: (List[2, 3, -4])^2
    back: Unreadable
    out: "{4, 9, 16}"
    tex:
      in: \{2,3,-4\}^2
      out: \{4,9,16\}
  sympy:
    in: ([2, 3, -4])**2
    out: "TypeError: unsupported operand type(s) for ** or pow(): 'list' and 'int'"
    verdict: error
    kind: threading
    note: compute-engine's Square threads over (or pools) the list; SymPy's takes scalars.
  sage:
    in: ([2, 3, -4])^2
    out: "TypeError: unsupported operand type(s) for ** or pow(): 'list' and 'int'"
    verdict: error
    kind: threading
    note: compute-engine's Square is Listable and threads over the list; Sage's takes scalars only.
even-function-x-2-x-2:
  epsil:
    in: Square(-5) == Square(5)
    out: True
  tex:
    in: (-5)^2=5^2
    out: \top
  traditional:
    in: (-5)^2=5^2
    out: \mathrm{True}
  wolfram:
    in: ((-5)^2 == (5)^2)
    back: Unreadable
    out: True
    tex:
      in: (-5)^2=5^2
      out: \text{True}
  sympy:
    in: enumeratio_equal((-5)**2, (5)**2)
    out: True
  mpmath:
    in: almosteq((-5)**2, (5)**2, 1e-20)
    out: True
  sage:
    in: bool((-5)^2 == (5)^2)
    out: True
1-i-2-2i-squaring-a-complex-number-needn-t-stay:
  epsil:
    in: Square(1 + i) == 2i
    out: True
  tex:
    in: \left(1+i\right)^2=2i
    out: \top
  traditional:
    in: \left(1+i\right)^2=2i
    out: \mathrm{True}
  wolfram:
    in: ((Complex[1, 1])^2 == Complex[0, 2])
    back: Unreadable
    out: True
    tex:
      in: (1+i)^2=2 i
      out: \text{True}
  sympy:
    in: enumeratio_equal(((1 + 1*I))**2, (0 + 2*I))
    out: True
  mpmath:
    in: almosteq((mpc(1, 1))**2, mpc(0, 2), 1e-20)
    out: True
  sage:
    in: bool(((1 + 1*I))^2 == (0 + 2*I))
    out: True
