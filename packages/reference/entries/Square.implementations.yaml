    in: Square(5)
    out: "25"
  tex:
    in: 5^2
    out: "25"
  wolfram:
    in: (5)^2
    back: Unreadable
    out: "25"
    tex:
      in: 5^2
      out: "25"
  sympy:
    in: (5)**2
    out: "25"
  mpmath:
    in: (5)**2
    out: "25"
  sage:
    in: (5)^2
    out: "25"
