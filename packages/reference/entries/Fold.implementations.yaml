symbolic-elements:
  epsil:
    in: Fold(Add, 0, [a, b, c])
    out: a + b + c
  tex:
    in: \mathrm{Fold}(\mathrm{Add}, 0, \bigl\lbrack a, b, c\bigr\rbrack)
    out: a+b+c
  fullform:
    in: Fold[Plus, 0, List[a, b, c]]
  wolfram:
    in: Fold[Plus, 0, List[a, b, c]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Fold}[\text{Plus},0,\{a,b,c\}]-(a+b+c)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Fold}\left[\text{Plus},0,\left\{\frac{7}{3},-\frac{11}{5},\frac{13}{4}\right\}\right]-\left(\frac{7}{3}-\frac{11}{5}+\frac{13}{4}\right)\right]\right],\text{Chop}\left[N\left[\text{Fold}\left[\text{Plus},0,\left\{-\frac{17}{6},\frac{19}{8},-\frac{23}{9}\right\}\right]-\left(-\frac{17}{6}+\frac{19}{8}-\frac{23}{9}\right)\right]\right],\text{Chop}\left[N\left[\text{Fold}\left[\text{Plus},0,\left\{\frac{7}{3},-\frac{11}{5},\frac{13}{4}\right\}\right]-\left(\frac{7}{3}-\frac{11}{5}+\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
any-two-argument-function-here-one-that-nests:
  epsil:
    in: Fold(Function([_1, _2]), x, [a, b])
    out: "[[x, a], b]"
    back: Unreadable
  tex:
    in: \mathrm{Fold}(()\mapsto\bigl\lbrack\operatorname{\_1}, \operatorname{\_2}\bigr\rbrack, x, \bigl\lbrack a, b\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack x, a\bigr\rbrack, b\bigr\rbrack
  fullform:
    in: Fold[Function[List[Slot[1], Slot[2]]], x, List[a, b]]
  wolfram:
    in: Fold[Function[List[Slot[1], Slot[2]]], x, List[a, b]]
    out: "{{x, a}, b}"
    tex:
      in: \text{Fold}[\{\text{$\#$1},\text{$\#$2}\}\&,x,\{a,b\}]
      out: \{\{x,a\},b\}
