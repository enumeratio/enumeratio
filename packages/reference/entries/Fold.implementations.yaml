horner-s-rule-for-ax-2-bx-c:
  epsil:
    in: Fold(Function(x * _1 + _2), 0, [a, b, c])
    out: x * (a * x + b) + c
  tex:
    in: \mathrm{Fold}(()\mapsto x\operatorname{\_1}+\operatorname{\_2}, 0, \bigl\lbrack a, b, c\bigr\rbrack)
    out: x\times(ax+b)+c
  fullform:
    in: Fold[Function[Plus[Times[x, Slot[1]], Slot[2]]], 0, List[a, b, c]]
evaluate-the-continued-fraction-1-2-2-2-from-the:
  epsil:
    in: Fold(Function(_2 + 1 / _1), 2, [2, 2, 1])
    out: 17 / 12
  tex:
    in: \mathrm{Fold}(()\mapsto\operatorname{\_2}+\frac{1}{\operatorname{\_1}}, 2, \bigl\lbrack2, 2, 1\bigr\rbrack)
    out: \frac{17}{12}
  fullform:
    in: Fold[Function[Plus[Slot[2], Divide[1, Slot[1]]]], 2, List[2, 2, 1]]
  wolfram:
    in: Fold[Function[Plus[Slot[2], Divide[1, Slot[1]]]], 2, List[2, 2, 1]]
