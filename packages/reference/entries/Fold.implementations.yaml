symbolic-elements:
  epsil:
    in: Fold(Add, 0, [a, b, c])
    out: a + b + c
  tex:
    in: \mathrm{Fold}(\mathrm{Add}, 0, \bigl\lbrack a, b, c\bigr\rbrack)
    out: a+b+c
  fullform:
    in: Fold[Plus, 0, List[a, b, c]]
any-two-argument-function-here-one-that-nests:
  epsil:
    in: Fold(Function([_1, _2]), x, [a, b])
    out: "[[x, a], b]"
  tex:
    in: \mathrm{Fold}(()\mapsto\bigl\lbrack\operatorname{\_1}, \operatorname{\_2}\bigr\rbrack, x, \bigl\lbrack a, b\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack x, a\bigr\rbrack, b\bigr\rbrack
  fullform:
    in: Fold[Function[List[Slot[1], Slot[2]]], x, List[a, b]]
without-a-seed-folding-starts-from-the-first:
  epsil:
    in: Fold(f, [a, b, c])
    out: f(f(a, b), c)
  tex:
    in: \mathrm{Fold}(f, \bigl\lbrack a, b, c\bigr\rbrack)
    out: f(f(a, b), c)
  fullform:
    in: Fold[f, List[a, b, c]]
folding-an-empty-list-returns-the-seed:
  epsil:
    in: Fold(f, x, [])
    out: x
  tex:
    in: \mathrm{Fold}(f, x, \bigl\lbrack \bigr\rbrack)
    out: x
  fullform:
    in: Fold[f, x, List[]]
folding-with-add-is-a-sum-1-2-100:
  epsil:
    in: Fold(Add, 0, Range(100))
    out: 5_050
  tex:
    in: \mathrm{Fold}(\mathrm{Add}, 0, 1..100)
    out: 5\,050
  fullform:
    in: Fold[Plus, 0, Range[100]]
  wolfram:
    in: Fold[Plus, 0, Range[100]]
assemble-a-number-from-its-decimal-digits:
  epsil:
    in: Fold(Function(10 * _1 + _2), 0, [1, 2, 3, 4])
    out: 1_234
  tex:
    in: \mathrm{Fold}(()\mapsto10\operatorname{\_1}+\operatorname{\_2}, 0, \bigl\lbrack1, 2, 3, 4\bigr\rbrack)
    out: 1\,234
  fullform:
    in: Fold[Function[Plus[Times[10, Slot[1]], Slot[2]]], 0, List[1, 2, 3, 4]]
  wolfram:
    in: Fold[Function[Plus[Times[10, Slot[1]], Slot[2]]], 0, List[1, 2, 3, 4]]
or-from-its-binary-digits-1011-2-11:
