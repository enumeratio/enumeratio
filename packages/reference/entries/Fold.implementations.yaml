horner-s-rule-for-ax-2-bx-c:
  epsil:
    in: Fold(Function(x * _1 + _2), 0, [a, b, c])
    out: x * (a * x + b) + c
    back: Unreadable
  tex:
    in: \mathrm{Fold}(()\mapsto x\operatorname{\_1}+\operatorname{\_2}, 0, \bigl\lbrack a, b, c\bigr\rbrack)
    out: x\times(ax+b)+c
  fullform:
    in: Fold[Function[Plus[Times[x, Slot[1]], Slot[2]]], 0, List[a, b, c]]
  wolfram:
    in: Fold[Function[Plus[Times[x, Slot[1]], Slot[2]]], 0, List[a, b, c]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Fold}[x \text{$\#$1}+\text{$\#$2}\&,0,\{a,b,c\}]-(x (a x+b)+c)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Fold}\left[-\frac{17}{6} \text{$\#$1}+\text{$\#$2}\&,0,\left\{\frac{7}{3},-\frac{11}{5},\frac{13}{4}\right\}\right]-\left(-\frac{17}{6} \left(\frac{7}{3} \left(-\frac{17}{6}\right)-\frac{11}{5}\right)+\frac{13}{4}\right)\right]\right],\text{Chop}\left[N\left[\text{Fold}\left[-\frac{11}{5} \text{$\#$1}+\text{$\#$2}\&,0,\left\{\frac{19}{8},-\frac{23}{9},\frac{7}{3}\right\}\right]-\left(-\frac{11}{5} \left(\frac{19}{8} \left(-\frac{11}{5}\right)-\frac{23}{9}\right)+\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{Fold}\left[-\frac{23}{9} \text{$\#$1}+\text{$\#$2}\&,0,\left\{\frac{13}{4},-\frac{17}{6},\frac{19}{8}\right\}\right]-\left(-\frac{23}{9} \left(\frac{13}{4} \left(-\frac{23}{9}\right)-\frac{17}{6}\right)+\frac{19}{8}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
