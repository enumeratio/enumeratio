fold-add-0-list-1-2-3-4:
  epsil:
    in: Fold(Add, 0, [1, 2, 3, 4])
    out: "10"
  tex:
    in: \mathrm{Fold}(\mathrm{Add}, 0, \bigl\lbrack1, 2, 3, 4\bigr\rbrack)
    out: "10"
  fullform:
    in: Fold[Plus, 0, List[1, 2, 3, 4]]
  wolfram:
    in: Fold[Plus, 0, List[1, 2, 3, 4]]
    out: "10"
    tex:
      in: \text{Fold}[\text{Plus},0,\{1,2,3,4\}]
      out: "10"
