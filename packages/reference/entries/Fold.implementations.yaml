folding-an-empty-list-returns-the-seed:
  epsil:
    in: Fold(f, x, [])
    out: x
  tex:
    in: \mathrm{Fold}(f, x, \bigl\lbrack\bigr\rbrack)
    out: x
  fullform:
    in: Fold[f, x, List[]]
  wolfram:
    in: Fold[f, x, List[]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Fold}[f,x,\{\}]-x],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Fold}\left[\frac{7}{3},-\frac{11}{5},\{\}\right]--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{Fold}\left[\frac{13}{4},-\frac{17}{6},\{\}\right]--\frac{17}{6}\right]\right],\text{Chop}\left[N\left[\text{Fold}\left[\frac{19}{8},-\frac{23}{9},\{\}\right]--\frac{23}{9}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
