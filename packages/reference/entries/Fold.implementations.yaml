the-shape-of-a-left-fold:
  epsil:
    in: Fold(f, x, [a, b, c])
    out: f(f(f(x, a), b), c)
  tex:
    in: \mathrm{Fold}(f, x, \bigl\lbrack a, b, c\bigr\rbrack)
    out: f(f(f(x, a), b), c)
  fullform:
    in: Fold[f, x, List[a, b, c]]
  wolfram:
    in: Fold[f, x, List[a, b, c]]
    out: f[f[f[x, a], b], c]
    tex:
      in: \text{Fold}[f,x,\{a,b,c\}]
      out: f(f(f(x,a),b),c)
