name: Floor
domain: Arithmetic
signature: Floor(x)
summary: 'The greatest integer less than or equal to x: $\lfloor x \rfloor$.'
signatures:
  - call: Floor(x)
    description: the greatest integer $\le x$, $\lfloor x \rfloor$.
  - call: Floor(x, step)
    description: the greatest multiple of `step` at or below x, $\mathrm{step}\cdot\lfloor x/\mathrm{step}\rfloor$.
    library: enumeratio-collections
  - call: Floor(z)
    description: for a complex $z$, the real and imaginary parts floored separately.
    library: enumeratio-collections
details:
  - 'The greatest integer $\le x$: $\lfloor x \rfloor$.'
  - Rounds toward $-\infty$, not toward 0 -- so $\lfloor -3.5 \rfloor = -4$, not $-3$.
  - For a non-integer x, $\lceil x \rceil = \lfloor x \rfloor + 1$. See [[Ceil]].
  - $\lfloor -x \rfloor = -\lceil x \rceil$.
  - Threads element-wise over a list.
  - A second argument floors to the nearest multiple of it -- the step needn't be an integer.
examples:
  - id: floor-7-over-2
    expr: [Floor, [Rational, 7, 2]]
    expected: 3
  - id: floor-3p7
    expr: [Floor, 3.7]
    expected: 3
  - id: integers-pass-through-unchanged
    expr: [Floor, 5]
    expected: 5
    caption: Integers pass through unchanged
  - id: threads-element-wise-over-a-list
    expr: [Floor, [List, 1.2, -1.2, 3.7]]
    expected: [List, 1, -2, 3]
    caption: Threads element-wise over a list
  - id: for-a-non-integer-x-lceil-x-rceil-lfloor-x
    expr: [Equal, [Add, [Floor, [Rational, 7, 2]], 1], [Ceil, [Rational, 7, 2]]]
    expected: True
    category: Properties
    caption: For a non-integer x, $\lceil x \rceil = \lfloor x \rfloor + 1$. See [[Ceil]]
  - id: lfloor-x-rfloor-lceil-x-rceil
    expr: [Equal, [Floor, [Rational, -7, 2]], [Negate, [Ceil, [Rational, 7, 2]]]]
    expected: True
    category: Properties
    caption: $\lfloor -x \rfloor = -\lceil x \rceil$
  - id: how-many-full-5-item-packs-fit-in-17-items
    expr: [Floor, [Divide, 17, 5]]
    expected: 3
    category: Applications
    caption: How many full 5-item packs fit in 17 items
  - id: rounds-toward-infty-not-toward-0-floor-3-2-is-4
    expr: [Floor, -3.2]
    expected: -4
    category: Possible issues
    caption: 'Rounds toward $-\infty$, not toward 0: floor(-3.2) is -4, not -3'
  - id: infinities-pass-through-unchanged
    expr: [Floor, NegativeInfinity]
    expected: NegativeInfinity
    category: Possible issues
    caption: Infinities pass through unchanged
  - id: floor-2p4
    expr: [Floor, 2.4]
    expected: 2
  - id: floor-2p6
    expr: [Floor, 2.6]
    expected: 2
  - id: stays-symbolic
    expr: [Floor, x]
    expected: [Floor, x]
    category: Scope
    caption: Stays symbolic
  - id: exact-radicals-are-decided-numerically
    expr: [Floor, [Sqrt, 50]]
    expected: 7
    category: Scope
    caption: Exact radicals are decided numerically
  - id: evaluates-at-an-exact-constant-lfloor-pi-rfloor
    expr: [Floor, Pi]
    expected: 3
    category: Scope
    caption: 'Evaluates at an exact constant: $\lfloor\pi\rfloor = 3$'
  - id: and-at-its-negative-lfloor-pi-rfloor-4
    expr: [Floor, [Negate, Pi]]
    expected: -4
    category: Scope
    caption: ...and at its negative, $\lfloor -\pi \rfloor = -4$
  - id: a-second-argument-floors-to-a-multiple-of-it-the
    expr: [Floor, 226, 10]
    expected: 220
    category: Scope
    caption: A second argument floors to a multiple of it -- the nearest multiple of 10 below 226
  - id: the-step-needn-t-be-an-integer-3-5-cdot-lfloor
    expr: [Floor, -10.3, 3.5]
    expected: -10.5
    category: Scope
    caption: "...the step needn't be an integer: $3.5 \\cdot \\lfloor -10.3/3.5 \\rfloor = -10.5$"
  - id: nor-rational-2-pi-e-approx-3-57-floors-to-the
    expr: [Floor, [Subtract, [Multiply, 2, Pi], ExponentialE], [Rational, 5, 4]]
    expected: [Rational, 5, 2]
    category: Scope
    caption: '...nor rational: $2\pi - e \approx 3.57$ floors to the multiple $5/2$ of $5/4$'
  - id: floors-the-real-and-imaginary-parts-separately
    expr: [Floor, [Complex, 5.37, -1.3]]
    expected: [Complex, 5, -2]
    category: Scope
    caption: Floors the real and imaginary parts separately
  - id: idempotent-lfloor-lfloor-x-rfloor-rfloor-lfloor
    expr: [Floor, [Floor, x]]
    expected: [Floor, x]
    category: Properties
    caption: 'Idempotent: $\lfloor\lfloor x \rfloor\rfloor = \lfloor x \rfloor$, since the inner value is already an integer'
  - id: legendre-s-formula-100-ends-in-lfloor-100-5
    expr: [Add, [Floor, [Divide, 100, 5]], [Floor, [Divide, 100, 25]]]
    expected: 24
    category: Applications
    caption: "Legendre's formula: $100!$ ends in $\\lfloor 100/5 \\rfloor + \\lfloor 100/25 \\rfloor = 24$ zeros"
  - id: the-number-of-decimal-digits-of-n-is-lfloor-log
    expr: [Add, [Floor, [Log, 12345]], 1]
    expected: 5
    category: Applications
    caption: The number of decimal digits of n is $\lfloor \log_{10} n \rfloor + 1$
  - id: the-first-four-digits-of-e
    expr: [Floor, [Multiply, 1000, ExponentialE]]
    expected: 2718
    category: Applications
    caption: The first four digits of $e$
seeAlso:
  - Ceil
  - Round
