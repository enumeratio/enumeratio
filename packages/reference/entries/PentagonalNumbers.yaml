name: PentagonalNumbers
domain: Collections
signature: PentagonalNumbers
summary: The pentagonal numbers $1, 5, 12, 22, …$ — $P(n) = n(3n-1)/2$ — dots in a pentagon.
signatures:
  - call: PentagonalNumbers
    description: $P(n) = n(3n-1)/2$ for $n = 1, 2, 3, …$.
details:
  - 'A lazy indexed collection: $Count(PentagonalNumbers) = +\infty$, and $At(PentagonalNumbers, k) = k(3k-1)/2$ unranks in closed form -- $At(PentagonalNumbers, 5) = 35$.'
  - OEIS A000326.
  - Membership goes through [[Element]] by inverting the closed form exactly, solving the quadratic in $n$ over the integers -- $Element(35, PentagonalNumbers)$ is true, $Element(36, PentagonalNumbers)$ is false.
  - The $k$-gonal case $k=5$ of [[PolygonalNumbers]]; not to be confused with the (signed-index) generalized pentagonal numbers of Euler's pentagonal number theorem.
enumerate:
  expr: Take(PentagonalNumbers, 20)
seeAlso:
  - PolygonalNumbers
  - TriangularNumbers
  - HexagonalNumbers
  - Count
  - At
  - Element
catalog:
  - system: oeis
    identity: A000326
    url: https://oeis.org/A000326
  - system: sage
    identity: sage.combinat.combinat.polygonal_number(5, n)
    url: https://doc.sagemath.org/html/en/reference/combinat/sage/combinat/combinat.html
    note: s=5 fixed for the pentagonal case; their n = our r
  - system: wolfram
    identity: PolygonalNumber
    url: https://reference.wolfram.com/language/ref/PolygonalNumber.html
    note: r=5 fixed for the pentagonal case; PolygonalNumber(5,r) — their n = our r
