a-permutation-of-4-seeded:
  epsil:
    in: Last([SeedRandom(7), Random(Permutations(4))])
    out: "[1, 2, 3, 4]"
  tex:
    in: \mathrm{Last}(\bigl\lbrack\mathrm{SeedRandom}(7), \mathrm{Random}(\mathrm{Permutations}(4))\bigr\rbrack)
    out: \bigl\lbrack1, 2, 3, 4\bigr\rbrack
  fullform:
    in: Last[List[SeedRandom[7], RandomReal[Permutations[4]]]]
a-count-draws-that-many:
  epsil:
    in: Length(Last([SeedRandom(1), Random(IntegerPartitions(10), 3)]))
    out: "3"
  tex:
    in: \mathrm{Length}(\mathrm{Last}(\bigl\lbrack\mathrm{SeedRandom}(1), \mathrm{Random}(\mathrm{IntegerPartitions}(10), 3)\bigr\rbrack))
    out: "3"
  fullform:
    in: Length[Last[List[SeedRandom[1], RandomReal[IntegerPartitions[10], 3]]]]
  wolfram:
    in: Length[Last[List[SeedRandom[1], RandomReal[IntegerPartitions[10], 3]]]]
randominteger-is-random-over-a-range:
  epsil:
    in: |-
      Last([SeedRandom(5), RandomInteger([10, 20])]) == Last([
                                                               SeedRandom(5),
                                                               Random(Range(10, 20)),
                                                             ])
    out: True
  tex:
    in: \mathrm{Last}(\bigl\lbrack\mathrm{SeedRandom}(5), \mathrm{RandomInteger}(\bigl\lbrack10, 20\bigr\rbrack)\bigr\rbrack)=\mathrm{Last}(\bigl\lbrack\mathrm{SeedRandom}(5), \mathrm{Random}(10..20)\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Last}(\bigl\lbrack\mathrm{SeedRandom}(5), \mathrm{RandomInteger}(\bigl\lbrack10, 20\bigr\rbrack)\bigr\rbrack)=\mathrm{Last}(\bigl\lbrack\mathrm{SeedRandom}(5), \mathrm{Random}(10..20)\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: Equal[Last[List[SeedRandom[5], RandomInteger[List[10, 20]]]], Last[List[SeedRandom[5], RandomReal[Range[10, 20]]]]]
  wolfram:
    in: (Last[List[SeedRandom[5], RandomInteger[List[10, 20]]]] == Last[List[SeedRandom[5], RandomReal[Range[10, 20]]]])
