name: IsEven
domain: Arithmetic
signature: IsEven(n)
summary: Whether n is an even integer.
signatures:
  - call: IsEven(n)
    description: $True$ if $n$ is an even integer, else $False$.
examples:
  - id: iseven-4
    expr: [IsEven, 4]
    expected: True
  - id: iseven-3
    expr: [IsEven, 3]
    expected: False
  - id: zero-is-even
    expr: [IsEven, 0]
    expected: True
    caption: Zero is even
  - id: negative-integers-count-too
    expr: [IsEven, -4]
    expected: True
    caption: Negative integers count too
  - id: a-non-integer-is-not-even
    expr: [IsEven, 2.5]
    expected: False
    category: Scope
    caption: A non-integer is not even
  - id: big-integers
    expr: [IsEven, [Power, 2, 100]]
    expected: True
    category: Scope
    caption: Big integers
  - id: iseven-10-factorial
    expr: [IsEven, [Factorial, 10]]
    expected: True
    category: Scope
  - id: threads-element-wise-over-a-list
    expr: [IsEven, [List, 1, 2, 3]]
    expected: [List, False, True, False]
    category: Scope
    caption: Threads element-wise over a list
  - id: every-integer-is-exactly-one-of-odd-and-even-see
    expr: [Xor, [IsOdd, 12], [IsEven, 12]]
    expected: True
    category: Properties
    caption: Every integer is exactly one of odd and even. See [[IsOdd]]
  - id: select-the-even-numbers-up-to-10
    expr: [Filter, [Range, 10], IsEven]
    expected: [List, 2, 4, 6, 8, 10]
    category: Applications
    caption: Select the even numbers up to 10
  - id: a-symbol-stays-undecided-rather-than-false
    expr: [IsEven, x]
    expected: [IsEven, x]
    category: Possible issues
    caption: A symbol stays undecided rather than False
seeAlso:
  - IsOdd
