default-base-is-10:
  epsil:
    in: Log(100)
    out: "2"
  tex:
    in: \log_{10}(100)
    out: "2"
  fullform:
    in: Log[10, 100]
    back: [Log, 100, 10]
  wolfram:
    in: Log[10, 100]
    out: "2"
    tex:
      in: \log _{10}(100)
      out: "2"
same-result-written-with-an-explicit-base:
  epsil:
    in: Log(100, 10)
    out: "2"
  tex:
    in: \log_{10}(100)
    out: "2"
  fullform:
    in: Log[10, 100]
  wolfram:
    in: Log[10, 100]
    out: "2"
    tex:
      in: \log _{10}(100)
      out: "2"
base-2-via-the-explicit-second-argument:
  epsil:
    in: Log(8, 2)
    out: "3"
  tex:
    in: \log_{2}(8)
    out: "3"
  fullform:
    in: Log[2, 8]
  wolfram:
    in: Log[2, 8]
    out: "3"
    tex:
      in: \log _2(8)
      out: "3"
confirms-the-default-base-is-10:
  epsil:
    in: Log(100) == Log(100, 10)
    out: True
  tex:
    in: \log_{10}(100)=\log_{10}(100)
    out: \top
  traditional:
    in: \log_{10}(100)=\log_{10}(100)
    out: \mathrm{True}
  fullform:
    in: Equal[Log[10, 100], Log[10, 100]]
    back: [Equal, [Log, 100, 10], [Log, 100, 10]]
  wolfram:
    in: (Log[10, 100] == Log[10, 100])
    out: True
    tex:
      in: \log _{10}(100)=\log _{10}(100)
      out: \text{True}
product-rule-log-b-xy-log-b-x-log-b-y:
  epsil:
    in: Log(8 * 4, 2) == Log(8, 2) + Log(4, 2)
    out: True
  tex:
    in: \log_{2}(8\times4)=\log_{2}(8)+\log_{2}(4)
    out: \top
  traditional:
    in: \log_{2}(8\times4)=\log_{2}(8)+\log_{2}(4)
    out: \mathrm{True}
  fullform:
    in: Equal[Log[2, Times[8, 4]], Plus[Log[2, 8], Log[2, 4]]]
  wolfram:
    in: (Log[2, Times[8, 4]] == Plus[Log[2, 8], Log[2, 4]])
    out: True
    tex:
      in: \log _2(8\ 4)=\log _2(8)+\log _2(4)
      out: \text{True}
power-rule-log-b-x-k-k-log-b-x:
  epsil:
    in: Log(2 ^ 5, 2) == 5 * Log(2, 2)
    out: True
  tex:
    in: \log_{2}(2^5)=5\log_{2}(2)
    out: \top
  traditional:
    in: \log_{2}(2^5)=5\log_{2}(2)
    out: \mathrm{True}
  fullform:
    in: Equal[Log[2, Power[2, 5]], Times[5, Log[2, 2]]]
  wolfram:
    in: (Log[2, Power[2, 5]] == Times[5, Log[2, 2]])
    out: True
    tex:
      in: \log _2\left(2^5\right)=5 \log _2(2)
      out: \text{True}
log-10-0-infty:
  epsil:
    in: Log(0)
    out: NegativeInfinity
  tex:
    in: \log_{10}(0)
    out: -\infty
  fullform:
    in: Log[10, 0]
    back: [Log, 0, 10]
  wolfram:
    in: Log[10, 0]
    out: -Infinity
    tex:
      in: \log _{10}(0)
      out: -\infty
a-negative-argument-stays-symbolic-with-the:
  epsil:
    in: Log(-5)
    out: Log(-5, 10)
  tex:
    in: \log_{10}(-5)
    out: \log_{10}(-5)
  fullform:
    in: Log[10, -5]
    back: [Log, -5, 10]
  wolfram:
    in: Log[10, -5]
    out: (I*Pi + Log[5])/Log[10]
    tex:
      in: \log _{10}(-5)
      out: \frac{\log (5)+i \pi }{\log (10)}
