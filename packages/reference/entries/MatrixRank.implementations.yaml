    in: MatrixRank[List[List[1, 2], List[2, 4]]]
    out: "1"
    tex:
      in: \text{MatrixRank}\left[\left( \begin{array}{cc}  1 & 2 \\  2 & 4 \\ \end{array} \right)\right]
      out: "1"
