row-rank-equals-column-rank:
  epsil:
    in: |-
      MatrixRank([[1, 2, 3], [4, 5, 6], [7, 8, 9]]) == MatrixRank(Transpose([
                                                                              [
                                                                                1,
                                                                                2,
                                                                                3,
                                                                              ],
                                                                              [
                                                                                4,
                                                                                5,
                                                                                6,
                                                                              ],
                                                                              [
                                                                                7,
                                                                                8,
                                                                                9,
                                                                              ],
                                                                            ]))
    out: True
  tex:
    in: \operatorname{rank}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack, \bigl\lbrack7, 8, 9\bigr\rbrack\bigr\rbrack)=\operatorname{rank}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack, \bigl\lbrack7, 8, 9\bigr\rbrack\bigr\rbrack^T)
    out: \top
  traditional:
    in: \operatorname{rank}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack, \bigl\lbrack7, 8, 9\bigr\rbrack\bigr\rbrack)=\operatorname{rank}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack, \bigl\lbrack7, 8, 9\bigr\rbrack\bigr\rbrack^T)
    out: \mathrm{True}
  fullform:
    in: Equal[MatrixRank[List[List[1, 2, 3], List[4, 5, 6], List[7, 8, 9]]], MatrixRank[Transpose[List[List[1, 2, 3], List[4, 5, 6], List[7, 8, 9]]]]]
  wolfram:
    in: (MatrixRank[List[List[1, 2, 3], List[4, 5, 6], List[7, 8, 9]]] == MatrixRank[Transpose[List[List[1, 2, 3], List[4, 5, 6], List[7, 8, 9]]]])
    out: True
    tex:
      in: \text{MatrixRank}\left[\left( \begin{array}{ccc}  1 & 2 & 3 \\  4 & 5 & 6 \\  7 & 8 & 9 \\ \end{array} \right)\right]=\text{MatrixRank}\left[\left( \begin{array}{ccc}  1 & 2 & 3 \\  4 & 5 & 6 \\  7 & 8 & 9 \\ \end{array} \right)^T\right]
      out: \text{True}
