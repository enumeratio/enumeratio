matrixrank-list-list-1-0-list-0-1:
  wolfram:
    in: MatrixRank[List[List[1, 0], List[0, 1]]]
    out: "2"
    tex:
      in: \text{MatrixRank}\left[\left( \begin{array}{cc}  1 & 0 \\  0 & 1 \\ \end{array} \right)\right]
      out: "2"
matrixrank-list-list-1-2-list-2-4:
