name: Scan
domain: Collections
signature: Scan(xs, f)
summary: The running combination of $f$ over a collection, one result per element.
signatures:
  - call: Scan(xs, f)
    description: $[f(x_1), f(f(x_1), x_2), \ldots]$ — same length as $xs$, the partial folds of $f$ with no seed.
  - call: Scan(xs, f, init)
    description: as above, but folding from $init$ — still same length as $xs$ (the seed is not itself an output element).
seeAlso:
  - Fold
