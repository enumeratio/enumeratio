- id: square-5
  expr: [Square, 5]
  expected: 25
- id: same-result-for-x-and-x
  expr: [Square, -5]
  expected: 25
  caption: Same result for x and -x
- id: square-2-over-3
  expr: [Square, [Rational, 2, 3]]
  expected: [Rational, 4, 9]
- id: canonicalizes-to-x-2
  expr: [Square, x]
  expected: [Power, x, 2]
  caption: Canonicalizes to $x^2$
- id: threads-element-wise-over-a-list
  expr: [Square, [List, 2, 3, -4]]
  expected: [List, 4, 9, 16]
  caption: Threads element-wise over a list
- id: even-function-x-2-x-2
  expr: [Equal, [Square, -5], [Square, 5]]
  expected: True
  category: Properties
  caption: "Even function: $(-x)^2 = x^2$"
- id: 1-i-2-2i-squaring-a-complex-number-needn-t-stay
  expr: [Equal, [Square, [Complex, 1, 1]], [Complex, 0, 2]]
  expected: True
  category: Properties
  caption: $(1+i)^2 = 2i$ -- squaring a complex number needn't stay real
- id: the-area-of-a-3-3-square-tile
  expr: [Square, 3]
  expected: 9
  category: Applications
  caption: The area of a 3×3 square tile
- id: infinity-squared-stays-infinite-rather-than
  expr: [Square, PositiveInfinity]
  expected: PositiveInfinity
  category: Possible issues
  caption: Infinity squared stays infinite rather than erroring
