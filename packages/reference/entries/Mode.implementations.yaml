mode-list-1-2-2-3:
  epsil:
    in: Mode([1, 2, 2, 3])
    out: "2"
  tex:
    in: \mathrm{Mode}(\bigl\lbrack1, 2, 2, 3\bigr\rbrack)
    out: "2"
  fullform:
    in: First[Commonest[List[1, 2, 2, 3]]]
    back: [First, [Commonest, [List, 1, 2, 2, 3]]]
  wolfram:
    in: First[Commonest[List[1, 2, 2, 3]]]
    out: "2"
    tex:
      in: \text{First}[\text{Commonest}[\{1,2,2,3\}]]
      out: "2"
the-mode-occurs-exactly-as-many-times-as-the:
  epsil:
    in: Count([1, 2, 2, 3], Mode([1, 2, 2, 3])) == 2
    out: True
  tex:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 2, 3\bigr\rbrack, \mathrm{Mode}(\bigl\lbrack1, 2, 2, 3\bigr\rbrack))=2
    out: \top
  traditional:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 2, 3\bigr\rbrack, \mathrm{Mode}(\bigl\lbrack1, 2, 2, 3\bigr\rbrack))=2
    out: \mathrm{True}
  fullform:
    in: Equal[Count[List[1, 2, 2, 3], First[Commonest[List[1, 2, 2, 3]]]], 2]
    back: [Equal, [Count, [List, 1, 2, 2, 3], [First, [Commonest, [List, 1, 2, 2, 3]]]], 2]
  wolfram:
    in: (Count[List[1, 2, 2, 3], First[Commonest[List[1, 2, 2, 3]]]] == 2)
    out: True
    tex:
      in: \text{Count}[\{1,2,2,3\},\text{First}[\text{Commonest}[\{1,2,2,3\}]]]=2
      out: \text{True}
with-a-tie-for-most-frequent-mode-returns-just:
  epsil:
    in: Mode([1, 1, 2, 2, 3])
    out: "1"
  tex:
    in: \mathrm{Mode}(\bigl\lbrack1, 1, 2, 2, 3\bigr\rbrack)
    out: "1"
  fullform:
    in: First[Commonest[List[1, 1, 2, 2, 3]]]
    back: [First, [Commonest, [List, 1, 1, 2, 2, 3]]]
  wolfram:
    in: First[Commonest[List[1, 1, 2, 2, 3]]]
    note: Wolfram's Commonest returns every tied mode, [1, 2], here.
mode-list-1-2-3-3-2-3:
  epsil:
    in: Mode([1, 2, 3, 3, 2, 3])
    out: "3"
  tex:
    in: \mathrm{Mode}(\bigl\lbrack1, 2, 3, 3, 2, 3\bigr\rbrack)
    out: "3"
  fullform:
    in: First[Commonest[List[1, 2, 3, 3, 2, 3]]]
    back: [First, [Commonest, [List, 1, 2, 3, 3, 2, 3]]]
  wolfram:
    in: First[Commonest[List[1, 2, 3, 3, 2, 3]]]
exact-rationals:
  epsil:
    in: Mode([1 / 2, 1, 1 / 2])
    out: 1 / 2
  tex:
    in: \mathrm{Mode}(\bigl\lbrack\frac{1}{2}, 1, \frac{1}{2}\bigr\rbrack)
    out: \frac{1}{2}
  fullform:
    in: First[Commonest[List[Rational[1, 2], 1, Rational[1, 2]]]]
    back: [First, [Commonest, [List, [Rational, 1, 2], 1, [Rational, 1, 2]]]]
  wolfram:
    in: First[Commonest[List[Rational[1, 2], 1, Rational[1, 2]]]]
symbols-and-numbers-mixed-three-way-tie-wolfram:
  epsil:
    in: Mode([b, a, c, 2, a, b, 1, 2])
    out: b
  tex:
    in: \mathrm{Mode}(\bigl\lbrack b, a, c, 2, a, b, 1, 2\bigr\rbrack)
    out: b
  fullform:
    in: First[Commonest[List[b, a, c, 2, a, b, 1, 2]]]
    back: [First, [Commonest, [List, b, a, c, 2, a, b, 1, 2]]]
empty-data-has-no-mode-compute-engine-returns:
  epsil:
    in: Mode([])
    out: "`NaN`"
  tex:
    in: \mathrm{Mode}(\bigl\lbrack \bigr\rbrack)
    out: \operatorname{NaN}
  fullform:
    in: First[Commonest[List[]]]
    back: [First, [Commonest, [List]]]
  wolfram:
    in: First[Commonest[List[]]]
    note: Wolfram's Commonest[{}] is the empty list {}.
