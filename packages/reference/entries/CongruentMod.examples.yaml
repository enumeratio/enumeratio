- id: 5-congruent-2-mod-3
  expr: [CongruentMod, 5, 2, 3]
  expected: True
  caption: $5 \equiv 2 \pmod 3$ since $3 \mid (5-2)$
- id: 5-not-congruent-1-mod-3
  expr: [CongruentMod, 5, 1, 3]
  expected: False
  category: Scope
- id: 7-congruent-7-mod-any
  expr: [CongruentMod, 7, 7, 5]
  expected: True
  category: Scope
  caption: A value is always congruent to itself, mod anything
- id: 7-congruent-1-mod-3
  expr: [CongruentMod, 7, 1, 3]
  expected: True
  category: Scope
- id: exact-past-double-precision
  expr: [CongruentMod, { num: "12345678901234567891" }, 2, 7]
  expected: True
  category: Scope
  caption: Exact for arbitrary-precision integers, past double precision
- id: exact-past-double-precision-false
  expr: [CongruentMod, { num: "12345678901234567891" }, 3, 7]
  expected: False
  category: Scope
