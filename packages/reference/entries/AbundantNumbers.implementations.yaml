the-first-five-abundant-numbers:
  epsil:
    in: Take(AbundantNumbers, 5)
    out: "[12, 18, 20, 24, 30]"
  tex:
    in: \mathrm{Take}(\mathrm{AbundantNumbers}, 5)
    out: \bigl\lbrack12, 18, 20, 24, 30\bigr\rbrack
  fullform:
    in: Take[AbundantNumbers, 5]
12-is-abundant:
  epsil:
    in: 12 in AbundantNumbers
    out: True
  tex:
    in: 12\in\mathrm{AbundantNumbers}
    out: \top
  traditional:
    in: 12\in\mathrm{AbundantNumbers}
    out: \mathrm{True}
  fullform:
    in: Element[12, AbundantNumbers]
28-is-perfect-not-abundant:
  epsil:
    in: 28 in AbundantNumbers
    out: False
  tex:
    in: 28\in\mathrm{AbundantNumbers}
    out: \bot
  traditional:
    in: 28\in\mathrm{AbundantNumbers}
    out: \mathrm{False}
  fullform:
    in: Element[28, AbundantNumbers]
