threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: Binomial([2, 3, 5, 7, 11], 3)
    out: "[0, 1, 10, 35, 165]"
  tex:
    in: \binom{\bigl\lbrack2, 3, 5, 7, 11\bigr\rbrack}{3}
    out: \bigl\lbrack0, 1, 10, 35, 165\bigr\rbrack
  fullform:
    in: Binomial[List[2, 3, 5, 7, 11], 3]
  wolfram:
    in: Binomial[List[2, 3, 5, 7, 11], 3]
    out: "{0, 1, 10, 35, 165}"
    tex:
      in: \binom{\{2,3,5,7,11\}}{3}
      out: \{0,1,10,35,165\}
  sympy:
    in: "[binomial(2, 3), binomial(3, 3), binomial(5, 3), binomial(7, 3), binomial(11, 3)]"
    out: "[0, 1, 10, 35, 165]"
  sage:
    in: "[binomial(2, 3), binomial(3, 3), binomial(5, 3), binomial(7, 3), binomial(11, 3)]"
  oscar:
    in: binomial(ZZ([2, 3, 5, 7, 11]), ZZ(3))
  julia:
    in: "[binomial(ZZ(2), ZZ(3)), binomial(ZZ(3), ZZ(3)), binomial(ZZ(5), ZZ(3)), binomial(ZZ(7), ZZ(3)), binomial(ZZ(11), ZZ(3))]"
    out: "[0, 1, 10, 35, 165]"
  mathlib4:
    in: (Nat.choose [2, 3, 5, 7, 11] 3)
  rust:
    in: binomial(list(vec![n(2), n(3), n(5), n(7), n(11)]), n(3))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Binomial is Listable and threads over the list; the Rust crate takes scalars only.
half-integer-arguments-evaluate-exactly-through:
  epsil:
    in: Binomial(9 / 2, 7 / 2)
    out: 9 / 2
  tex:
    in: \binom{\frac{9}{2}}{\frac{7}{2}}
    out: \frac{9}{2}
  fullform:
    in: Binomial[Rational[9, 2], Rational[7, 2]]
  wolfram:
    in: Binomial[Rational[9, 2], Rational[7, 2]]
    out: 9/2
    tex:
      in: \binom{\frac{9}{2}}{\frac{7}{2}}
      out: \frac{9}{2}
  sympy:
    in: binomial(Rational(9, 2), Rational(7, 2))
    out: 9/2
  sage:
    in: binomial((9/2), (7/2))
  oscar:
    in: binomial(ZZ((9 // 2)), ZZ((7 // 2)))
  julia:
    in: binomial(ZZ((9 // 2)), ZZ((7 // 2)))
    out: "AssertionError: denominator(x) == 1"
    verdict: error
    kind: domain
    note: Nemo's ZZ is integers only; it can't hold a half-integer argument. Ours evaluates a half-integer Binomial exactly through the Gamma function.
  mathlib4:
    in: "(Nat.choose ((9 : ℚ) / 2) ((7 : ℚ) / 2))"
  rust:
    in: binomial(rational(n(9), n(2)), rational(n(7), n(2)))
    out: "panic: an integer, not 9/2"
    verdict: error
    kind: domain
    note: compute-engine's Binomial extends to non-integer arguments via Gamma; the Rust crate takes integers only.
