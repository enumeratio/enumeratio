symmetry-doesn-t-hold-across-mismatched-n:
  epsil:
    in: Binomial(2, 6) == Binomial(-18, 2)
    out: False
  tex:
    in: \binom{2}{6}=\binom{-18}{2}
    out: \bot
  traditional:
    in: \binom{2}{6}=\binom{-18}{2}
    out: \mathrm{False}
  fullform:
    in: Equal[Binomial[2, 6], Binomial[-18, 2]]
  wolfram:
    in: (Binomial[2, 6] == Binomial[-18, 2])
  sympy:
    in: enumeratio_equal(binomial(2, 6), binomial(-18, 2))
    out: False
  sage:
    in: bool(binomial(2, 6) == binomial(-18, 2))
  oscar:
    in: (binomial(ZZ(2), ZZ(6)) == binomial(ZZ(-18), ZZ(2)))
  julia:
    in: (binomial(ZZ(2), ZZ(6)) == binomial(ZZ(-18), ZZ(2)))
  mathlib4:
    in: (decide ((Nat.choose 2 6) = (Nat.choose (-18) 2)))
  rust:
    in: equal(binomial(n(2), n(6)), binomial(n(-18), n(2)))
    out: "true"
    verdict: disagree
    kind: domain
    note: num-integer's binomial assumes non-negative arguments; compute-engine extends Binomial to negative ones, so the two sides of this resampled comparison genuinely differ.
not-pascal-s-rule-across-mismatched-n:
  epsil:
    in: Binomial(-23, 2) + Binomial(-2, 3) == Binomial(-20, 6)
    out: False
  tex:
    in: \binom{-23}{2}+\binom{-2}{3}=\binom{-20}{6}
    out: \bot
  traditional:
    in: \binom{-23}{2}+\binom{-2}{3}=\binom{-20}{6}
    out: \mathrm{False}
  fullform:
    in: Equal[Plus[Binomial[-23, 2], Binomial[-2, 3]], Binomial[-20, 6]]
  wolfram:
    in: (Plus[Binomial[-23, 2], Binomial[-2, 3]] == Binomial[-20, 6])
  sympy:
    in: enumeratio_equal((binomial(-23, 2) + binomial(-2, 3)), binomial(-20, 6))
    out: False
  sage:
    in: bool((binomial(-23, 2) + binomial(-2, 3)) == binomial(-20, 6))
  oscar:
    in: ((binomial(ZZ(-23), ZZ(2)) + binomial(ZZ(-2), ZZ(3))) == binomial(ZZ(-20), ZZ(6)))
  julia:
    in: ((binomial(ZZ(-23), ZZ(2)) + binomial(ZZ(-2), ZZ(3))) == binomial(ZZ(-20), ZZ(6)))
  mathlib4:
    in: (decide (((Nat.choose (-23) 2) + (Nat.choose (-2) 3)) = (Nat.choose (-20) 6)))
  rust:
    in: equal((binomial(n(-23), n(2)) + binomial(n(-2), n(3))), binomial(n(-20), n(6)))
    out: "true"
    verdict: disagree
    kind: domain
    note: num-integer's binomial assumes non-negative arguments; compute-engine extends Binomial to negative ones, so the two sides of this resampled comparison genuinely differ.
