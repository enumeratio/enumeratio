sum-of-squares-along-a-row-sum-k-binom-n-k-2:
  epsil:
    in: Sum(Binomial(6, k) ^ 2, (k, 0, 6)) == Binomial(12, 6)
    out: True
  tex:
    in: \sum_{k=0}^6\binom{6}{k}^2=\binom{12}{6}
    out: \top
  traditional:
    in: \sum_{k=0}^6\binom{6}{k}^2=\binom{12}{6}
    out: \mathrm{True}
  fullform:
    in: Equal[Sum[Power[Binomial[6, k], 2], List[k, 0, 6]], Binomial[12, 6]]
  wolfram:
    in: (Sum[Power[Binomial[6, k], 2], List[k, 0, 6]] == Binomial[12, 6])
vandermonde-s-identity-sum-k-binom-m-k-binom-n-r:
  epsil:
    in: Sum(Binomial(5, k) * Binomial(4, 3 - k), (k, 0, 3)) == Binomial(9, 3)
    out: True
  tex:
    in: \sum_{k=0}^3\binom{5}{k}\binom{4}{3-k}=\binom{9}{3}
    out: \top
  traditional:
    in: \sum_{k=0}^3\binom{5}{k}\binom{4}{3-k}=\binom{9}{3}
    out: \mathrm{True}
  fullform:
    in: Equal[Sum[Times[Binomial[5, k], Binomial[4, Subtract[3, k]]], List[k, 0, 3]], Binomial[9, 3]]
  wolfram:
    in: (Sum[Times[Binomial[5, k], Binomial[4, Subtract[3, k]]], List[k, 0, 3]] == Binomial[9, 3])
