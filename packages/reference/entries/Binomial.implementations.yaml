the-factorial-form-binom-n-k-frac-n-k-n-k-see:
  epsil:
    in: Binomial(7, 3) == 7! / (3! * 4!)
    out: True
  tex:
    in: \binom{7}{3}=\frac{7!}{3!\times4!}
    out: \top
  traditional:
    in: \binom{7}{3}=\frac{7!}{3!\times4!}
    out: \mathrm{True}
  fullform:
    in: Equal[Binomial[7, 3], Divide[Factorial[7], Times[Factorial[3], Factorial[4]]]]
  wolfram:
    in: (Binomial[7, 3] == Divide[Factorial[7], Times[Factorial[3], Factorial[4]]])
  sympy:
    in: enumeratio_equal(binomial(7, 3), (S(factorial(7)) / (factorial(3) * factorial(4))))
    out: True
  sage:
    in: bool(binomial(7, 3) == (factorial(7) / (factorial(3) * factorial(4))))
  oscar:
    in: (binomial(ZZ(7), ZZ(3)) == (factorial(ZZ(7)) // (factorial(ZZ(3)) * factorial(ZZ(4)))))
  julia:
    in: (binomial(ZZ(7), ZZ(3)) == (factorial(ZZ(7)) // (factorial(ZZ(3)) * factorial(ZZ(4)))))
    out: "true"
  mathlib4:
    in: "(decide ((Nat.choose 7 3) = (((Nat.factorial 7) : ℚ) / ((Nat.factorial 3) * (Nat.factorial 4)))))"
  rust:
    in: equal(binomial(n(7), n(3)), (factorial(n(7)) / (factorial(n(3)) * factorial(n(4)))))
    out: "true"
the-probability-of-exactly-3-heads-in-10-fair:
  epsil:
    in: Binomial(10, 3) / 2 ^ 10
    out: 15 / 128
  tex:
    in: \frac{\binom{10}{3}}{2^{10}}
    out: \frac{15}{128}
  fullform:
    in: Divide[Binomial[10, 3], Power[2, 10]]
  wolfram:
    in: Divide[Binomial[10, 3], Power[2, 10]]
  sympy:
    in: (S(binomial(10, 3)) / (S(2)**10))
    out: 15/128
  sage:
    in: (binomial(10, 3) / ((2)^10))
  oscar:
    in: (binomial(ZZ(10), ZZ(3)) // (big(2)^10))
  julia:
    in: (binomial(ZZ(10), ZZ(3)) // (big(2)^10))
    out: "0.1171875"
  mathlib4:
    in: "(((Nat.choose 10 3) : ℚ) / (2 ^ 10))"
  rust:
    in: (binomial(n(10), n(3)) / power(n(2), n(10)))
    out: 15/128
both-arguments-negative-integers-the-limiting:
  epsil:
    in: Binomial(-3, -5)
    out: "6"
  tex:
    in: \binom{-3}{-5}
    out: "6"
  fullform:
    in: Binomial[-3, -5]
  wolfram:
    in: Binomial[-3, -5]
  sympy:
    in: binomial(-3, -5)
    out: "0"
    verdict: disagree
    kind: convention
    note: compute-engine and Wolfram take binom(-3, -5) = 6 by the limit through Γ; SymPy gives 0.
  sage:
    in: binomial(-3, -5)
  oscar:
    in: binomial(ZZ(-3), ZZ(-5))
  julia:
    in: binomial(ZZ(-3), ZZ(-5))
    out: "0"
    verdict: disagree
    kind: convention
    note: Nemo's binomial follows the combinatorial C(n,k)=0 convention outside 0≤k≤n; ours extends through the reflection identities (Wolfram's convention), giving 6 — see the mapping's note.
  mathlib4:
    in: (Nat.choose (-3) (-5))
  rust:
    in: binomial(n(-3), n(-5))
    out: "1"
    verdict: disagree
    kind: convention
    note: compute-engine and Wolfram take binom(-3, -5) = 6 by the limit through Γ; num-integer's binomial isn't defined for negative arguments.
