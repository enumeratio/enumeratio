a-gaussian-integer-n-binom-1-i-5-frac-1-i-12:
  epsil:
    in: Binomial(1 + i, 5)
    out: -1 / 12 + -1 / 12 * i
  tex:
    in: \binom{1+i}{5}
    out: -\frac{1}{12}-\frac{1}{12}i
  fullform:
    in: Binomial[Complex[1, 1], 5]
  wolfram:
    in: Binomial[Complex[1, 1], 5]
  sympy:
    in: binomial((1 + 1*I), 5)
    out: -1/12 - I/12
  sage:
    in: binomial((1 + 1*I), 5)
  oscar:
    in: binomial(ZZ(complex(1, 1)), ZZ(5))
  julia:
    in: binomial(ZZ(complex(1, 1)), ZZ(5))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: Nemo's ZZ is rational integers only, no Gaussian integers; ours extends Binomial to a complex n through the Gamma function.
