symmetry-binom-n-k-binom-n-n-k:
  wolfram:
    in: (Binomial[10, 3] == Binomial[10, 7])
    out: True
    tex:
      in: \binom{10}{3}=\binom{10}{7}
      out: \text{True}
  sage:
    in: bool(binomial(10, 3) == binomial(10, 7))
    out: True
  julia:
    in: (binomial(ZZ(10), ZZ(3)) == binomial(ZZ(10), ZZ(7)))
    out: "true"
  mathlib4:
    in: (decide ((Nat.choose 10 3) = (Nat.choose 10 7)))
    out: "true"
  oscar:
    in: (binomial(ZZ(10), ZZ(3)) == binomial(ZZ(10), ZZ(7)))
    out: "true"
  rust:
    in: equal(binomial(n(10), n(3)), binomial(n(10), n(7)))
    out: "true"
  sympy:
    in: enumeratio_equal(binomial(10, 3), binomial(10, 7))
    out: True
pascal-s-rule-binom-n-1-k-1-binom-n-1-k-binom-n:
  wolfram:
    in: (Plus[Binomial[9, 2], Binomial[9, 3]] == Binomial[10, 3])
    out: True
    tex:
      in: \binom{9}{2}+\binom{9}{3}=\binom{10}{3}
      out: \text{True}
  sage:
    in: bool((binomial(9, 2) + binomial(9, 3)) == binomial(10, 3))
    out: True
  julia:
    in: ((binomial(ZZ(9), ZZ(2)) + binomial(ZZ(9), ZZ(3))) == binomial(ZZ(10), ZZ(3)))
    out: "true"
  mathlib4:
    in: (decide (((Nat.choose 9 2) + (Nat.choose 9 3)) = (Nat.choose 10 3)))
    out: "true"
  oscar:
    in: ((binomial(ZZ(9), ZZ(2)) + binomial(ZZ(9), ZZ(3))) == binomial(ZZ(10), ZZ(3)))
    out: "true"
  rust:
    in: equal((binomial(n(9), n(2)) + binomial(n(9), n(3))), binomial(n(10), n(3)))
    out: "true"
  sympy:
    in: enumeratio_equal((binomial(9, 2) + binomial(9, 3)), binomial(10, 3))
    out: True
row-sums-give-sum-k-binom-n-k-2-n-here-at-n-4:
  wolfram:
    in: (Plus[Binomial[4, 0], Binomial[4, 1], Binomial[4, 2], Binomial[4, 3], Binomial[4, 4]] == Power[2, 4])
    out: True
    tex:
      in: \binom{4}{0}+\binom{4}{1}+\binom{4}{2}+\binom{4}{3}+\binom{4}{4}=2^4
      out: \text{True}
  sage:
    in: bool((binomial(4, 0) + binomial(4, 1) + binomial(4, 2) + binomial(4, 3) + binomial(4, 4)) == (2^4))
    out: True
  julia:
    in: ((binomial(ZZ(4), ZZ(0)) + binomial(ZZ(4), ZZ(1)) + binomial(ZZ(4), ZZ(2)) + binomial(ZZ(4), ZZ(3)) + binomial(ZZ(4), ZZ(4))) == (big(2)^4))
    out: "true"
  mathlib4:
    in: (decide (((Nat.choose 4 0) + (Nat.choose 4 1) + (Nat.choose 4 2) + (Nat.choose 4 3) + (Nat.choose 4 4)) = (2 ^ 4)))
    out: "true"
  oscar:
    in: ((binomial(ZZ(4), ZZ(0)) + binomial(ZZ(4), ZZ(1)) + binomial(ZZ(4), ZZ(2)) + binomial(ZZ(4), ZZ(3)) + binomial(ZZ(4), ZZ(4))) == (big(2)^4))
    out: "true"
  rust:
    in: equal((binomial(n(4), n(0)) + binomial(n(4), n(1)) + binomial(n(4), n(2)) + binomial(n(4), n(3)) + binomial(n(4), n(4))), power(n(2), n(4)))
    out: "true"
  sympy:
    in: enumeratio_equal((binomial(4, 0) + binomial(4, 1) + binomial(4, 2) + binomial(4, 3) + binomial(4, 4)), (2**4))
    out: True
