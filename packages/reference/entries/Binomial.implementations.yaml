a-negative-k-also-gives-0:
  wolfram:
    in: Binomial[5, -1]
    out: "0"
    tex:
      in: \binom{5}{-1}
      out: "0"
  sage:
    in: binomial(5, -1)
    out: "0"
  julia:
    in: binomial(ZZ(5), ZZ(-1))
    out: "0"
  mathlib4:
    in: (Nat.choose 5 (-1))
    out: failed to synthesize instance of type class
    verdict: error
    kind: domain
    note: The Mathlib mapping is over Nat, which has no negative numbers; compute-engine extends Binomial to this argument.
  oscar:
    in: binomial(ZZ(5), ZZ(-1))
    out: "0"
  rust:
    in: binomial(n(5), n(-1))
    out: "1"
    verdict: disagree
    kind: domain
    note: num-integer's binomial assumes non-negative arguments; compute-engine extends Binomial to negative ones.
  sympy:
    in: binomial(5, -1)
    out: "0"
