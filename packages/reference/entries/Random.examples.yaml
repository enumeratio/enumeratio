- id: a-permutation-of-4-seeded
  expr: [Last, [List, [SeedRandom, 7], [Random, [Permutations, 4]]]]
  expected: [List, 1, 2, 3, 4]
  caption: one permutation of $\{1, 2, 3, 4\}$, drawn uniformly by index from the collection; seeded, so it is the same every time
- id: a-count-draws-that-many
  expr: [Length, [Last, [List, [SeedRandom, 1], [Random, [IntegerPartitions, 10], 3]]]]
  expected: 3
  category: Scope
  caption: a count after the domain draws that many elements
- id: randominteger-is-random-over-a-range
  expr:
    [
      Equal,
      [Last, [List, [SeedRandom, 5], [RandomInteger, [List, 10, 20]]]],
      [Last, [List, [SeedRandom, 5], [Random, [Range, 10, 20]]]],
    ]
  expected: True
  category: Properties & Relations
  caption: "[[RandomInteger]] is its Wolfram spelling over a [[Range]]: the same draw from the same stream"
