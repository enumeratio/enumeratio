with-an-explicit-tolerance-recovers-a-classic:
  epsil:
    in: Rationalize(Pi, 0.01) == 22 / 7
    out: True
  tex:
    in: \mathrm{Rationalize}(\pi, 0.01)=\frac{22}{7}
    out: \top
  traditional:
    in: \mathrm{Rationalize}(\pi, 0.01)=\frac{22}{7}
    out: \mathrm{True}
  fullform:
    in: Equal[Rationalize[Pi, 0.01], Rational[22, 7]]
  wolfram:
    in: (Rationalize[Pi, 0.01] == Rational[22, 7])
    out: True
    tex:
      in: \text{Rationalize}[\pi ,0.01]=\frac{22}{7}
      out: \text{True}
