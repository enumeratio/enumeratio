threads-over-a-matrix-entry-by-entry:
  epsil:
    in: -[[1, -2], [3, 4]]
    out: "[[-1, 2], [-3, -4]]"
  tex:
    in: -\bigl\lbrack\bigl\lbrack1, -2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack
    out: \bigl\lbrack\bigl\lbrack-1, 2\bigr\rbrack, \bigl\lbrack-3, -4\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minus[List[List[1, -2], List[3, 4]]]
  wolfram:
    in: Minus[List[List[1, -2], List[3, 4]]]
  sympy:
    in: "[[(-1), (--2)], [(-3), (-4)]]"
    out: "[[-1, 2], [-3, -4]]"
  mpmath:
    in: "[[(-1), (--2)], [(-3), (-4)]]"
    out: "[[-1, 2], [-3, -4]]"
  sage:
    in: "[[(-1), (--2)], [(-3), (-4)]]"
    out: "[[-1, 2], [-3, -4]]"
  oscar:
    in: (-([[1, -2], [3, 4]]))
    out: "[[-1, 2], [-3, -4]]"
  julia:
    in: "[[(-(1)), (-(-2))], [(-(3)), (-(4))]]"
    out: "[[-1, 2], [-3, -4]]"
  mathlib4:
    in: (-([[1, (-2)], [3, 4]]))
    out: failed to synthesize instance of type class
    verdict: error
    kind: threading
    note: compute-engine's Negate is Listable and threads over the (nested) list; Mathlib's negation takes scalars only.
  rust:
    in: (-(list(vec![list(vec![n(1), n(-2)]), list(vec![n(3), n(4)])])))
    out: "panic: negating [[1, -2], [3, 4]]"
    verdict: error
    kind: threading
    note: compute-engine's Negate is Listable and threads over the list; the Rust crates take scalars only.
