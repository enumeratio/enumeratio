threads-element-wise-over-a-list:
  epsil:
    in: -[1, -2, 3]
    out: "[-1, 2, -3]"
  tex:
    in: -\bigl\lbrack1, -2, 3\bigr\rbrack
    out: \bigl\lbrack-1, 2, -3\bigr\rbrack
  fullform:
    in: Minus[List[1, -2, 3]]
  wolfram:
    in: Minus[List[1, -2, 3]]
    out: "{-1, 2, -3}"
    tex:
      in: -\{1,-2,3\}
      out: \{-1,2,-3\}
  sympy:
    in: "[(-1), (--2), (-3)]"
    out: "[-1, 2, -3]"
  mpmath:
    in: "[(-1), (--2), (-3)]"
    out: "[-1, 2, -3]"
  sage:
    in: "[(-1), (--2), (-3)]"
    out: "[-1, 2, -3]"
  oscar:
    in: (-([1, -2, 3]))
    out: "[-1, 2, -3]"
  julia:
    in: "[(-(1)), (-(-2)), (-(3))]"
    out: "[-1, 2, -3]"
  mathlib4:
    in: (-([1, (-2), 3]))
    out: "[-1, 2, -3]"
  rust:
    in: (-(list(vec![n(1), n(-2), n(3)])))
    out: "panic: negating [1, -2, 3]"
    verdict: error
    kind: threading
    note: compute-engine's Negate is Listable and threads over the list; the Rust crates take scalars.
double-negation-cancels-x-x:
  epsil:
    in: --x
    out: x
  tex:
    in: --x
    out: x
  fullform:
    in: Minus[Minus[x]]
  wolfram:
    in: Minus[Minus[x]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[-(-x)-x],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[-\left(-\frac{7}{3}\right)-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[-\left(-\left(-\frac{11}{5}\right)\right)--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[-\left(-\frac{13}{4}\right)-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
  sympy:
    in: (-(-Symbol("x")))
    out: True
  sage:
    in: (-(-SR.var("x")))
    out: True
distributes-over-a-sum-a-b-a-b:
  epsil:
    in: -(a + b) == -a - b
    out: True
  tex:
    in: -(a+b)=-a-b
    out: \top
  traditional:
    in: -(a+b)=-a-b
    out: \mathrm{True}
  fullform:
    in: Equal[Minus[Plus[a, b]], Plus[Minus[a], Minus[b]]]
  wolfram:
    in: (Minus[Plus[a, b]] == Plus[Minus[a], Minus[b]])
    out: True
    tex:
      in: -(a+b)=-a-b
      out: \text{True}
  sympy:
    in: enumeratio_equal((-(Symbol("a") + Symbol("b"))), ((-Symbol("a")) + (-Symbol("b"))))
    out: True
  sage:
    in: bool((-(SR.var("a") + SR.var("b"))) == ((-SR.var("a")) + (-SR.var("b"))))
    out: True
