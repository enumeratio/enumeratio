neg-3-over-4:
  wolfram:
    in: Minus[Rational[3, 4]]
    out: -3/4
    tex:
      in: -\frac{3}{4}
      out: -\frac{3}{4}
  sage:
    in: (-(3/4))
    out: -3/4
  julia:
    in: (-((3 // 4)))
    out: "-0.75"
  mathlib4:
    in: "(-(((3 : ℚ) / 4)))"
    out: -3/4
  oscar:
    in: (-((3 // 4)))
    out: "-0.75"
  rust:
    in: (-(rational(n(3), n(4))))
    out: -3/4
  sympy:
    in: (-Rational(3, 4))
    out: -3/4
threads-element-wise-over-a-list:
  wolfram:
    in: Minus[List[1, -2, 3]]
    out: "{-1, 2, -3}"
    tex:
      in: -\{1,-2,3\}
      out: \{-1,2,-3\}
  sage:
    in: (-[1, -2, 3])
    out: "TypeError: bad operand type for unary -: 'list'"
    verdict: error
    kind: threading
    note: compute-engine's Negate is Listable and threads over the list; Sage's takes scalars only.
  julia:
    in: (-([1, -2, 3]))
    out: "[-1, 2, -3]"
  mathlib4:
    in: (-([1, (-2), 3]))
    out: "[-1, 2, -3]"
  oscar:
    in: (-([1, -2, 3]))
    out: "[-1, 2, -3]"
  rust:
    in: (-(list(vec![n(1), n(-2), n(3)])))
    out: "panic: negating [1, -2, 3]"
    verdict: error
    kind: threading
    note: compute-engine's Negate is Listable and threads over the list; the Rust crates take scalars.
  sympy:
    in: (-[1, -2, 3])
    out: "TypeError: bad operand type for unary -: 'list'"
    verdict: error
    kind: threading
    note: compute-engine's Negate threads over (or pools) the list; SymPy's takes scalars.
recording-a-42-50-charge-as-a-negative-balance:
  wolfram:
    in: Minus[42.5]
    out: "-42.5"
