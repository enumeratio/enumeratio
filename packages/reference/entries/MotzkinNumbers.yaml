name: MotzkinNumbers
domain: Collections
signature: MotzkinNumbers
summary: The Motzkin numbers $1, 1, 2, 4, 9, 21, …$ as a lazy indexed collection.
signatures:
  - call: MotzkinNumbers
    description: The number of Motzkin paths of length $n$, an infinite indexed collection.
details:
  - 'A lazy indexed collection: $Count(MotzkinNumbers) = +\infty$, and $At(MotzkinNumbers, k)$ unranks term $k-1$ via $M(n) = \left((2n+1)M(n-1) + 3(n-1)M(n-2)\right)/(n+2)$, bigint throughout -- $At(MotzkinNumbers, 1) = M_0 = 1$.'
  - "OEIS A001006, starting exactly at its offset-0 term: $1, 1, 2, 4, 9, 21, 51, …$."
  - "Membership goes through [[Element]]: $Element(9, MotzkinNumbers)$ is true, $Element(6, MotzkinNumbers)$ is false."
enumerate:
  expr: Take(MotzkinNumbers, 20)
seeAlso:
  - Count
  - At
  - Element
  - CatalanNumbers
catalog:
  - system: oeis
    identity: A001006
    url: https://oeis.org/A001006
  - system: sympy
    identity: motzkin.find_first_n_motzkins
    note: |-
      the motzkin(n) FUNCTION itself is off by one term from the standard/OEIS A001006 indexing (confirmed live,
      sympy 1.11.1: motzkin(0..10) = 1,1,1,2,4,9,21,51,127,323,835 — an extra leading 1); find_first_n_motzkins(k) gives
      the correct first k terms matching ours exactly. No WL builtin either (see wolfram-refs.sql) — this is new information.
  - system: wikipedia
    identity: Motzkin number
    url: https://en.wikipedia.org/wiki/Motzkin_number
    relation: conceptual
