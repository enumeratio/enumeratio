name: HeptagonalNumbers
domain: Collections
signature: HeptagonalNumbers
summary: The heptagonal numbers $1, 7, 18, 34, …$ — $n(5n-3)/2$ — dots in a heptagon.
signatures:
  - call: HeptagonalNumbers
    description: $n(5n-3)/2$ for $n = 1, 2, 3, …$.
details:
  - 'A lazy indexed collection: $Count(HeptagonalNumbers) = +\infty$, and $At(HeptagonalNumbers, k) = k(5k-3)/2$ unranks in closed form -- $At(HeptagonalNumbers, 5) = 55$.'
  - OEIS A000566.
  - Membership goes through [[Element]] by inverting the closed form exactly -- $Element(55, HeptagonalNumbers)$ is true, $Element(54, HeptagonalNumbers)$ is false.
  - The $k$-gonal case $k=7$ of [[PolygonalNumbers]].
enumerate:
  expr: Take(HeptagonalNumbers, 20)
seeAlso:
  - PolygonalNumbers
  - HexagonalNumbers
  - OctagonalNumbers
  - Count
  - At
  - Element
catalog:
  - system: oeis
    identity: A000566
    url: https://oeis.org/A000566
  - system: sage
    identity: sage.combinat.combinat.polygonal_number(7, n)
    url: https://doc.sagemath.org/html/en/reference/combinat/sage/combinat/combinat.html
    note: s=7 fixed for the heptagonal case; their n = our r
  - system: wolfram
    identity: PolygonalNumber
    url: https://reference.wolfram.com/language/ref/PolygonalNumber.html
    note: r=7 fixed for the heptagonal case; PolygonalNumber(7,r) — their n = our r
