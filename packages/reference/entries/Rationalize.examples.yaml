- id: rationalize-0p1
  expr: [Rationalize, 0.1]
  expected: [Rational, 1, 10]
- id: an-exact-integer-is-returned-unchanged
  expr: [Rationalize, 2]
  expected: 2
  caption: An exact integer is returned unchanged
- id: rationalize-2p5
  expr: [Rationalize, 2.5]
  expected: [Rational, 5, 2]
- id: recognizes-a-float-that-is-to-machine-precision
  expr: [Rationalize, 0.3333333333333333]
  expected: [Rational, 1, 3]
  caption: Recognizes a float that is, to machine precision, a simple fraction
- id: with-an-explicit-tolerance-recovers-a-classic
  expr: [Equal, [Rationalize, Pi, 0.01], [Rational, 22, 7]]
  expected: True
  category: Properties
  caption: "With an explicit tolerance, recovers a classic approximation: 22/7 is within 0.01 of π"
- id: milu-zu-chongzhi-s-5th-century-approximation-of
  expr: [Rationalize, Pi, 0.000001]
  expected: [Rational, 355, 113]
  category: Neat examples
  caption: Milü, Zu Chongzhi's 5th-century approximation of π, accurate to six decimal places
- id: recovers-a-simple-fraction-from-a-decimal
  expr: [Rationalize, 0.75]
  expected: [Rational, 3, 4]
  category: Applications
  caption: Recovers a simple fraction from a decimal measurement
- id: without-enough-repeating-digits-to-reach-machine
  expr: [Rationalize, 0.333333]
  expected: [Rational, 333333, 1000000]
  category: Possible issues
  caption: Without enough repeating digits to reach machine precision, it just returns the exact decimal as a fraction rather than snapping to 1/3
- id: a-loose-tolerance-can-snap-to-something-far
  expr: [Rationalize, 0.1, 0.5]
  expected: 0
  category: Possible issues
  caption: A loose tolerance can snap to something far simpler -- 0 is within 0.5 of 0.1
- id: rationalize-6p75
  expr: [Rationalize, 6.75]
  expected: [Rational, 27, 4]
- id: a-second-argument-sets-the-tolerance
  expr: [Rationalize, Pi, 0.01]
  expected: [Rational, 22, 7]
  caption: A second argument sets the tolerance
- id: any-exact-numeric-expression-to-any-tolerance
  expr: [Rationalize, [Exp, [Sqrt, 2]], [Power, 2, -12]]
  expected: [Rational, 218, 53]
  category: Scope
  caption: Any exact numeric expression, to any tolerance
- id: rationalize-sqrt-2-0p001
  expr: [Rationalize, [Sqrt, 2], 0.001]
  expected: [Rational, 41, 29]
  category: Scope
- id: rationalize-neg-0p125
  expr: [Rationalize, -0.125]
  expected: [Rational, -1, 8]
  category: Scope
- id: the-rational-with-the-smallest-denominator
  expr: [Rationalize, Pi, 0.001]
  expected: [Rational, 201, 64]
  category: Scope
  caption: The rational with the smallest denominator within 0.001 of $\pi$ -- $201/64$, not compute-engine's own closer-but-larger-denominator continued-fraction convergent $333/106$
- id: a-tolerance-finer-than-a-double
  expr: [Rationalize, Pi, 1e-16]
  expected: [Rational, 245850922, 78256779]
  category: Scope
  caption: A tolerance finer than a double can resolve is still honoured -- the simplest fraction within $10^{-16}$ of $\pi$ itself, not of $N(\pi)$, which is already $1.2 \times 10^{-16}$ away
- id: rationalizes-every-approximate-number-inside-an
  expr: [Rationalize, [Add, 1.2, [Multiply, 6.7, x]]]
  expected: [Add, [Multiply, [Rational, 67, 10], x], [Rational, 6, 5]]
  category: Scope
  caption: Rationalizes every approximate number inside an expression
- id: threads-element-wise-over-a-list-compute-engine
  expr: [Rationalize, [List, 0.5, 0.25, 0.2]]
  expected: [List, [Rational, 1, 2], [Rational, 1, 4], [Rational, 1, 5]]
  category: Scope
  caption: Threads element-wise over a list; compute-engine's own Rationalize takes only a single real
- id: a-zero-tolerance-gives-the-exact-rational-the
  expr: [Rationalize, [N, Pi], 0]
  expected: [Rational, 884279719003555, 281474976710656]
  category: Scope
  caption: A zero tolerance gives the exact rational the machine double denotes -- $N(\pi)$'s own dyadic value, $884279719003555/2^{48}$, not merely a rational within some epsilon of it
- id: recognizes-a-ratio-of-consecutive-fibonacci
  expr: [Rationalize, 0.618034, 0.0001]
  expected: [Rational, 55, 89]
  category: Applications
  caption: Recognizes a ratio of consecutive Fibonacci numbers in a decimal approximation of $1/\varphi$
- id: without-a-tolerance-a-float-with-no-simple
  expr: [Rationalize, [N, Pi]]
  expected: [Rational, 80143857, 25510582]
  category: Possible issues
  caption: Without a tolerance, a float with no simple fraction nearby still becomes a fraction with a large denominator
- id: a-zero-tolerance-still-returns-an-exact-integer
  expr: [Rationalize, 2, 0]
  expected: 2
  role: test
  caption: A zero tolerance still returns an exact integer unchanged
- id: a-tolerance-still-routes-to-search-not-the-exact
  expr: [Rationalize, 0.1, 0.01]
  expected: [Rational, 1, 10]
  role: test
  caption: With a nonzero tolerance, still routes to a tolerance search rather than the exact dyadic form
- role: test
  id: an-already-exact-value-unchanged-with-tolerance
  expr: [Rationalize, [Rational, 1, 3], 0.1]
  expected: [Rational, 1, 3]
  caption: An already-exact value is returned unchanged even with a tolerance given
