threads-element-wise-over-a-list:
  epsil:
    in: Floor([1.2, -1.2, 3.7])
    out: "[1, -2, 3]"
  tex:
    in: \lfloor\bigl\lbrack1.2, -1.2, 3.7\bigr\rbrack\rfloor
    out: \bigl\lbrack1, -2, 3\bigr\rbrack
  wolfram:
    in: Floor[List[1.2, -1.2, 3.7]]
    out: "{1, -2, 3}"
    tex:
      in: \lfloor \{1.2,-1.2,3.7\}\rfloor
      out: \{1,-2,3\}
  sympy:
    in: floor([1.2, -1.2, 3.7])
    out: "AttributeError: 'list' object has no attribute 'is_Number'"
    verdict: error
    kind: threading
    note: compute-engine's Floor threads over (or pools) the list; SymPy's takes scalars.
  sage:
    in: floor([1.2, -1.2, 3.7])
    out: "TypeError: unable to convert [1.20000000000000, -1.20000000000000, 3.70000000000000] to a symbolic expression"
    verdict: error
    kind: threading
    note: compute-engine's Floor is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: floor(list(vec![x(1.2), x(-1.2), x(3.7)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Floor is Listable and threads over the list; the Rust crates take scalars.
for-a-non-integer-x-lceil-x-rceil-lfloor-x:
  epsil:
    in: Floor(7 / 2) + 1 == Ceil(7 / 2)
    out: True
  tex:
    in: \lfloor\frac{7}{2}\rfloor+1=\lceil\frac{7}{2}\rceil
    out: \top
  traditional:
    in: \lfloor\frac{7}{2}\rfloor+1=\lceil\frac{7}{2}\rceil
    out: \mathrm{True}
  wolfram:
    in: (Plus[Floor[Rational[7, 2]], 1] == Ceiling[Rational[7, 2]])
    back: Unreadable
    out: True
    tex:
      in: \left\lfloor \frac{7}{2}\right\rfloor +1=\left\lceil \frac{7}{2}\right\rceil
      out: \text{True}
  sympy:
    in: enumeratio_equal((floor(Rational(7, 2)) + 1), ceiling(Rational(7, 2)))
    out: True
  sage:
    in: bool((floor((7/2)) + 1) == ceil((7/2)))
    out: True
  rust:
    in: equal((floor(rational(n(7), n(2))) + n(1)), ceil(rational(n(7), n(2))))
    out: "true"
lfloor-x-rfloor-lceil-x-rceil:
  epsil:
    in: Floor(-7 / 2) == -Ceil(7 / 2)
    out: True
  tex:
    in: \lfloor-\frac{7}{2}\rfloor=-\lceil\frac{7}{2}\rceil
    out: \top
  traditional:
    in: \lfloor-\frac{7}{2}\rfloor=-\lceil\frac{7}{2}\rceil
    out: \mathrm{True}
  wolfram:
    in: (Floor[Rational[-7, 2]] == Minus[Ceiling[Rational[7, 2]]])
    back: Unreadable
    out: True
    tex:
      in: \left\lfloor -\frac{7}{2}\right\rfloor =-\left\lceil \frac{7}{2}\right\rceil
      out: \text{True}
  sympy:
    in: enumeratio_equal(floor(Rational(-7, 2)), (-ceiling(Rational(7, 2))))
    out: True
  sage:
    in: bool(floor((-7/2)) == (-ceil((7/2))))
    out: True
  rust:
    in: equal(floor(rational(n(-7), n(2))), (-(ceil(rational(n(7), n(2))))))
    out: "true"
