floor-7-over-2:
  wolfram:
    in: Floor[Rational[7, 2]]
    out: "3"
    tex:
      in: \left\lfloor \frac{7}{2}\right\rfloor
      out: "3"
  sage:
    in: floor((7/2))
    out: "3"
  rust:
    in: floor(rational(n(7), n(2)))
    out: "3"
  sympy:
    in: floor(Rational(7, 2))
    out: "3"
