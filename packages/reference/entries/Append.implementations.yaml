append-list-1-2-3-4:
  epsil:
    in: Append([1, 2, 3], 4)
    out: "[1, 2, 3, 4]"
  tex:
    in: \mathrm{Append}(\bigl\lbrack1, 2, 3\bigr\rbrack, 4)
    out: \bigl\lbrack1, 2, 3, 4\bigr\rbrack
  fullform:
    in: Append[List[1, 2, 3], 4]
  wolfram:
    in: Append[List[1, 2, 3], 4]
    out: "{1, 2, 3, 4}"
    tex:
      in: \text{Append}[\{1,2,3\},4]
      out: \{1,2,3,4\}
append-c-x-join-c-x-see-join:
  epsil:
    in: Append([1, 2, 3], 4) == Join([1, 2, 3], [4])
    out: True
  tex:
    in: \mathrm{Append}(\bigl\lbrack1, 2, 3\bigr\rbrack, 4)=\mathrm{Join}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Append}(\bigl\lbrack1, 2, 3\bigr\rbrack, 4)=\mathrm{Join}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: Equal[Append[List[1, 2, 3], 4], Join[List[1, 2, 3], List[4]]]
  wolfram:
    in: (Append[List[1, 2, 3], 4] == Join[List[1, 2, 3], List[4]])
    out: True
    tex:
      in: \text{Append}[\{1,2,3\},4]=\text{Join}[\{1,2,3\},\{4\}]
      out: \text{True}
appending-a-list-nests-it-as-a-single-element:
  epsil:
    in: Append([1, 2, 3], [9])
    out: "[1, 2, 3, [9]]"
  tex:
    in: \mathrm{Append}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack9\bigr\rbrack)
    out: \bigl\lbrack1, 2, 3, \bigl\lbrack9\bigr\rbrack\bigr\rbrack
  fullform:
    in: Append[List[1, 2, 3], List[9]]
  wolfram:
    in: Append[List[1, 2, 3], List[9]]
    out: "{1, 2, 3, {9}}"
    tex:
      in: \text{Append}[\{1,2,3\},\{9\}]
      out: \{1,2,3,\{9\}\}
a-set-as-well-as-a-list:
  epsil:
    in: Append({1, 2, 3}, 4)
    out: "{1, 2, 3, 4}"
  tex:
    in: \mathrm{Append}(\lbrace1, 2, 3\rbrace, 4)
    out: \lbrace1, 2, 3, 4\rbrace
  fullform:
    in: Append[Union[List[1, 2, 3]], 4]
    back: [Append, [Union, [List, 1, 2, 3]], 4]
  wolfram:
    in: Append[Union[List[1, 2, 3]], 4]
    out: "{1, 2, 3, 4}"
    tex:
      in: \text{Append}[\text{Union}[\{1,2,3\}],4]
      out: \{1,2,3,4\}
append-list-a-b-c-d-x:
  epsil:
    in: Append([a, b, c, d], x)
    out: "[a, b, c, d, x]"
  tex:
    in: \mathrm{Append}(\bigl\lbrack a, b, c, d\bigr\rbrack, x)
    out: \bigl\lbrack a, b, c, d, x\bigr\rbrack
  fullform:
    in: Append[List[a, b, c, d], x]
onto-the-empty-list:
  epsil:
    in: Append([], x)
    out: "[x]"
  tex:
    in: \mathrm{Append}(\bigl\lbrack \bigr\rbrack, x)
    out: \bigl\lbrack x\bigr\rbrack
  fullform:
    in: Append[List[], x]
a-lazy-range-is-materialised-first:
  epsil:
    in: Append(Range(1, 3), 4)
    out: "[1, 2, 3, 4]"
  tex:
    in: \mathrm{Append}(1..3, 4)
    out: \bigl\lbrack1, 2, 3, 4\bigr\rbrack
  fullform:
    in: Append[Range[1, 3], 4]
  wolfram:
    in: Append[Range[1, 3], 4]
any-head-not-just-a-list:
  epsil:
    in: Append(f(a, b), c)
    out: f(a, b, c)
  tex:
    in: \mathrm{Append}(f(a, b), c)
    out: f(a, b, c)
  fullform:
    in: Append[f[a, b], c]
adding-a-row-to-a-matrix:
  epsil:
    in: Append([[1, 2], [3, 4]], [5, 6])
    out: "[[1, 2], [3, 4], [5, 6]]"
  tex:
    in: \mathrm{Append}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, \bigl\lbrack5, 6\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack, \bigl\lbrack5, 6\bigr\rbrack\bigr\rbrack
  fullform:
    in: Append[List[List[1, 2], List[3, 4]], List[5, 6]]
  wolfram:
    in: Append[List[List[1, 2], List[3, 4]], List[5, 6]]
appending-adds-exactly-one-element-see-length:
  epsil:
    in: Length(Append([1, 2, 3], 4)) == Length([1, 2, 3]) + 1
    out: True
  tex:
    in: \mathrm{Length}(\mathrm{Append}(\bigl\lbrack1, 2, 3\bigr\rbrack, 4))=\mathrm{Length}(\bigl\lbrack1, 2, 3\bigr\rbrack)+1
    out: \top
  traditional:
    in: \mathrm{Length}(\mathrm{Append}(\bigl\lbrack1, 2, 3\bigr\rbrack, 4))=\mathrm{Length}(\bigl\lbrack1, 2, 3\bigr\rbrack)+1
    out: \mathrm{True}
  fullform:
    in: Equal[Length[Append[List[1, 2, 3], 4]], Plus[Length[List[1, 2, 3]], 1]]
  wolfram:
    in: (Length[Append[List[1, 2, 3], 4]] == Plus[Length[List[1, 2, 3]], 1])
