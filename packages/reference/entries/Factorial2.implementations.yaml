negative-even-arguments-hit-a-pole-in-the:
  epsil:
    in: Factorial2(-2)
    out: "`NaN`"
  tex:
    in: (-2)!!
    out: \operatorname{NaN}
  wolfram:
    in: Factorial2[-2]
    out: ComplexInfinity
    tex:
      in: (-2)\text{!!}
      out: \text{ComplexInfinity}
    verdict: disagree
    kind: undefined-form
    note: The pole at a negative even argument is NaN here and ComplexInfinity in Wolfram.
