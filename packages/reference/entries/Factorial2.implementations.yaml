splits-an-ordinary-factorial-into-even-and-odd:
  epsil:
    in: 8! == Factorial2(8) * Factorial2(7)
    out: True
  tex:
    in: 8!=8!!\times7!!
    out: \top
  traditional:
    in: 8!=8!!\times7!!
    out: \mathrm{True}
  wolfram:
    in: (Factorial[8] == Times[Factorial2[8], Factorial2[7]])
    back: Unreadable
    out: True
    tex:
      in: 8!=8\text{!!} 7\text{!!}
      out: \text{True}
