even-double-factorials-2n-2-n-n:
  epsil:
    in: Factorial2(10) == 2 ^ 5 * 5!
    out: True
  tex:
    in: 10!!=2^5\times5!
    out: \top
  traditional:
    in: 10!!=2^5\times5!
    out: \mathrm{True}
  wolfram:
    in: (Factorial2[10] == Times[Power[2, 5], Factorial[5]])
    back: Unreadable
odd-double-factorials-2n-1-frac-2n-2-n-n:
  epsil:
    in: Factorial2(9) == 10! / (2 ^ 5 * 5!)
    out: True
  tex:
    in: 9!!=(10!)(2^5\times5!)^{-1}
    out: \top
  traditional:
    in: 9!!=(10!)(2^5\times5!)^{-1}
    out: \mathrm{True}
  wolfram:
    in: (Factorial2[9] == Divide[Factorial[10], Times[Power[2, 5], Factorial[5]]])
    back: Unreadable
