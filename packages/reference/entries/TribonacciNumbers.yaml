name: TribonacciNumbers
domain: Collections
signature: TribonacciNumbers
summary: The tribonacci numbers $0, 0, 1, 1, 2, 4, 7, …$ as a lazy indexed collection.
signatures:
  - call: TribonacciNumbers
    description: $T_n = T_{n-1} + T_{n-2} + T_{n-3}$, $T_0 = 0$, $T_1 = 0$, $T_2 = 1$, an infinite indexed collection.
details:
  - 'A lazy indexed collection: $Count(TribonacciNumbers) = +\infty$, and $At(TribonacciNumbers, 1) = T_0 = 0$.'
  - "OEIS A000073, starting exactly at its offset-0 term: $0, 0, 1, 1, 2, 4, 7, 13, …$."
  - "Membership goes through [[Element]]: $Element(24, TribonacciNumbers)$ is true, $Element(6, TribonacciNumbers)$ is false."
enumerate:
  expr: Take(TribonacciNumbers, 20)
seeAlso:
  - Count
  - At
  - Element
  - FibonacciNumbers
catalog:
  - system: oeis
    identity: A000073
    url: https://oeis.org/A000073
  - system: sympy
    identity: tribonacci
    url: https://docs.sympy.org/latest/modules/functions/combinatorial.html#sympy.functions.combinatorial.numbers.tribonacci
    note: |-
      sympy's T0=0,T1=1,T2=1,T3=2,... (one term ahead of ours); ours repeats the leading 0 (T0=0,T1=0,T2=1,T3=1,...)
      so tribonacci_numbers(n) [ours] = sympy tribonacci(n-1) for n>=1
grades: []
carrier: Numeric
unbounded: true
