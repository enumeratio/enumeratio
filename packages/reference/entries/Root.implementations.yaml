the-cube-root-of-27:
  wolfram:
    in: Power[27, Divide[1, 3]]
    out: "3"
    tex:
      in: 27^{\frac{1}{3}}
      out: "3"
root-16-4:
  wolfram:
    in: Power[16, Divide[1, 4]]
    out: "2"
    tex:
      in: 16^{\frac{1}{4}}
      out: "2"
odd-roots-of-a-negative-number-stay-real:
  wolfram:
    in: Power[-8, Divide[1, 3]]
    out: 2*(-1)^(1/3)
    tex:
      in: (-8)^{\frac{1}{3}}
      out: 2 \sqrt[3]{-1}
    verdict: disagree
    kind: convention
    note: Wolfram's $(-8)^{1/3}$ is the principal complex root, $1 + \sqrt{3}\,i$; its real root is $\mathrm{Surd}[-8, 3] = -2$.
stays-symbolic-when-x-isn-t-a-perfect-power:
  wolfram:
    in: Power[2, Divide[1, 3]]
    out: 2^(1/3)
    tex:
      in: 2^{\frac{1}{3}}
      out: \sqrt[3]{2}
a-negative-index-gives-the-reciprocal-root-x-1-n:
  wolfram:
    in: Power[16, Divide[1, -2]]
    out: 1/4
    tex:
      in: 16^{-\frac{1}{2}}
      out: \frac{1}{4}
sqrt-n-x-n-x-for-a-perfect-nth-power:
  wolfram:
    in: (Power[Power[8, Divide[1, 3]], 3] == 8)
    out: True
    tex:
      in: \left(8^{\frac{1}{3}}\right)^3=8
      out: \text{True}
root-x-2-agrees-with-sqrt:
  wolfram:
    in: (Power[16, Divide[1, 2]] == Sqrt[16])
    out: True
    tex:
      in: 16^{\frac{1}{2}}=\sqrt{16}
      out: \text{True}
the-edge-length-of-a-cube-with-volume-1000:
  wolfram:
    in: Power[1000, Divide[1, 3]]
    out: "10"
    tex:
      in: 1000^{\frac{1}{3}}
      out: "10"
an-even-root-of-a-negative-non-perfect-power:
  wolfram:
    in: Power[-8, Divide[1, 2]]
    out: (2*I)*Sqrt[2]
    tex:
      in: (-8)^{\frac{1}{2}}
      out: 2 i \sqrt{2}
