the-cube-root-of-27:
  epsil:
    in: Root(27, 3)
    out: "3"
  tex:
    in: \sqrt[3]{27}
    out: "3"
  fullform:
    in: Power[27, Divide[1, 3]]
    back: [Power, 27, [Divide, 1, 3]]
  wolfram:
    in: Power[27, Divide[1, 3]]
    out: "3"
    tex:
      in: 27^{\frac{1}{3}}
      out: "3"
root-16-4:
  epsil:
    in: Root(16, 4)
    out: "2"
  tex:
    in: \sqrt[4]{16}
    out: "2"
  fullform:
    in: Power[16, Divide[1, 4]]
    back: [Power, 16, [Divide, 1, 4]]
  wolfram:
    in: Power[16, Divide[1, 4]]
    out: "2"
    tex:
      in: 16^{\frac{1}{4}}
      out: "2"
odd-roots-of-a-negative-number-stay-real:
  epsil:
    in: Root(-8, 3)
    out: "-2"
  tex:
    in: \sqrt[3]{-8}
    out: "-2"
  fullform:
    in: Power[-8, Divide[1, 3]]
    back: [Power, -8, [Divide, 1, 3]]
  wolfram:
    in: Power[-8, Divide[1, 3]]
    out: 2*(-1)^(1/3)
    tex:
      in: (-8)^{\frac{1}{3}}
      out: 2 \sqrt[3]{-1}
    verdict: disagree
    kind: convention
    note: Wolfram's $(-8)^{1/3}$ is the principal complex root, $1 + \sqrt{3}\,i$; its real root is $\mathrm{Surd}[-8, 3] = -2$.
stays-symbolic-when-x-isn-t-a-perfect-power:
  epsil:
    in: Root(2, 3)
    out: Root(2, 3)
  tex:
    in: \sqrt[3]{2}
    out: \sqrt[3]{2}
  fullform:
    in: Power[2, Divide[1, 3]]
    back: [Power, 2, [Divide, 1, 3]]
  wolfram:
    in: Power[2, Divide[1, 3]]
    out: 2^(1/3)
    tex:
      in: 2^{\frac{1}{3}}
      out: \sqrt[3]{2}
a-negative-index-gives-the-reciprocal-root-x-1-n:
  epsil:
    in: Root(16, -2)
    out: 1 / 4
  tex:
    in: \sqrt[-2]{16}
    out: \frac{1}{4}
  fullform:
    in: Power[16, Divide[1, -2]]
    back: [Power, 16, [Divide, 1, -2]]
  wolfram:
    in: Power[16, Divide[1, -2]]
    out: 1/4
    tex:
      in: 16^{-\frac{1}{2}}
      out: \frac{1}{4}
sqrt-n-x-n-x-for-a-perfect-nth-power:
  epsil:
    in: Root(8, 3) ^ 3 == 8
    out: True
  tex:
    in: \sqrt[3]{8}^3=8
    out: \top
  traditional:
    in: \sqrt[3]{8}^3=8
    out: \mathrm{True}
  fullform:
    in: Equal[Power[Power[8, Divide[1, 3]], 3], 8]
    back: [Equal, [Power, [Power, 8, [Divide, 1, 3]], 3], 8]
  wolfram:
    in: (Power[Power[8, Divide[1, 3]], 3] == 8)
    out: True
    tex:
      in: \left(8^{\frac{1}{3}}\right)^3=8
      out: \text{True}
root-x-2-agrees-with-sqrt:
  epsil:
    in: Root(16, 2) == Sqrt(16)
    out: True
  tex:
    in: \sqrt{16}=\sqrt{16}
    out: \top
  traditional:
    in: \sqrt{16}=\sqrt{16}
    out: \mathrm{True}
  fullform:
    in: Equal[Power[16, Divide[1, 2]], Sqrt[16]]
    back: [Equal, [Power, 16, [Divide, 1, 2]], [Sqrt, 16]]
  wolfram:
    in: (Power[16, Divide[1, 2]] == Sqrt[16])
    out: True
    tex:
      in: 16^{\frac{1}{2}}=\sqrt{16}
      out: \text{True}
