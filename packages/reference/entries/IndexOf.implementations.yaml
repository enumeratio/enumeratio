indexof-list-1-2-3-2:
  wolfram:
    in: First[FirstPosition[List[1, 2, 3], 2, List[0]]]
    out: "2"
    tex:
      in: \text{First}[\text{FirstPosition}[\{1,2,3\},2,\{0\}]]
      out: "2"
