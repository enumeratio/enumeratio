at-c-indexof-c-v-v-whenever-v-occurs-in-c-see-at:
  wolfram:
    in: (Part[List[10, 20, 30], First[FirstPosition[List[10, 20, 30], 20, List[0]]]] == 20)
    out: True
    tex:
      in: \{10,20,30\}[[\text{First}[\text{FirstPosition}[\{10,20,30\},20,\{0\}]]]]=20
      out: \text{True}
indexof-reports-only-the-first-occurrence-see:
  wolfram:
    in: First[FirstPosition[List[1, 2, 3, 2], 2, List[0]]]
    note: Wolfram's Position gives every occurrence, [[2], [4]]; IndexOf keeps only the first.
