threads-element-wise-over-a-list:
  epsil:
    in: Ceil([1.2, -1.2, 3.7])
    out: "[2, -1, 4]"
  tex:
    in: \lceil\bigl\lbrack1.2, -1.2, 3.7\bigr\rbrack\rceil
    out: \bigl\lbrack2, -1, 4\bigr\rbrack
  fullform:
    in: Ceiling[List[1.2, -1.2, 3.7]]
  wolfram:
    in: Ceiling[List[1.2, -1.2, 3.7]]
    out: "{2, -1, 4}"
    tex:
      in: \lceil \{1.2,-1.2,3.7\}\rceil
      out: \{2,-1,4\}
  sympy:
    in: ceiling([1.2, (-1.2), 3.7])
    out: "AttributeError: 'list' object has no attribute 'is_Number'"
    verdict: error
    kind: threading
    note: compute-engine's Ceil threads over (or pools) the list; SymPy's takes scalars.
  sage:
    in: ceil([1.2, (-1.2), 3.7])
    out: "TypeError: unable to convert [1.20000000000000, -1.20000000000000, 3.70000000000000] to a symbolic expression"
    verdict: error
    kind: threading
    note: compute-engine's Ceil is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: ceil(list(vec![x(1.2), x(-1.2), x(3.7)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Ceil is Listable and threads over the list; the Rust crates take scalars.
lceil-x-rceil-lfloor-x-rfloor-1-for-non-integer:
  epsil:
    in: Ceil(7 / 2) == Floor(7 / 2) + 1
    out: True
  tex:
    in: \lceil\frac{7}{2}\rceil=\lfloor\frac{7}{2}\rfloor+1
    out: \top
  traditional:
    in: \lceil\frac{7}{2}\rceil=\lfloor\frac{7}{2}\rfloor+1
    out: \mathrm{True}
  fullform:
    in: Equal[Ceiling[Rational[7, 2]], Plus[Floor[Rational[7, 2]], 1]]
  wolfram:
    in: (Ceiling[Rational[7, 2]] == Plus[Floor[Rational[7, 2]], 1])
    out: True
    tex:
      in: \left\lceil \frac{7}{2}\right\rceil =\left\lfloor \frac{7}{2}\right\rfloor +1
      out: \text{True}
  sympy:
    in: enumeratio_equal(ceiling(Rational(7, 2)), (floor(Rational(7, 2)) + 1))
    out: True
  sage:
    in: bool(ceil((7/2)) == (floor((7/2)) + 1))
    out: True
  rust:
    in: equal(ceil(rational(n(7), n(2))), (floor(rational(n(7), n(2))) + n(1)))
    out: "true"
floor-and-ceil-agree-exactly-on-integers:
  epsil:
    in: Ceil(5) == Floor(5)
    out: True
  tex:
    in: \lceil5\rceil=\lfloor5\rfloor
    out: \top
  traditional:
    in: \lceil5\rceil=\lfloor5\rfloor
    out: \mathrm{True}
  fullform:
    in: Equal[Ceiling[5], Floor[5]]
  wolfram:
    in: (Ceiling[5] == Floor[5])
    out: True
    tex:
      in: \lceil 5\rceil =\lfloor 5\rfloor
      out: \text{True}
  sympy:
    in: enumeratio_equal(ceiling(5), floor(5))
    out: True
  mpmath:
    in: almosteq(ceil(5), floor(5), 1e-20)
    out: True
  sage:
    in: bool(ceil(5) == floor(5))
    out: True
  rust:
    in: equal(ceil(n(5)), floor(n(5)))
    out: "true"
