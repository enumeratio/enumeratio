ceil-7-over-2:
  wolfram:
    in: Ceiling[Rational[7, 2]]
    out: "4"
    tex:
      in: \left\lceil \frac{7}{2}\right\rceil
      out: "4"
  sage:
    in: ceil((7/2))
    out: "4"
  rust:
    in: ceil(rational(n(7), n(2)))
    out: "4"
  sympy:
    in: ceiling(Rational(7, 2))
    out: "4"
ceil-3p2:
  wolfram:
    in: Ceiling[3.2]
    out: "4"
    tex:
      in: \lceil 3.2\rceil
      out: "4"
  sage:
    in: ceil(3.2)
    out: "4"
  rust:
    in: ceil(x(3.2))
    out: "4.0"
  mpmath:
    in: ceil(3.2)
    out: "4.0"
  sympy:
    in: ceiling(3.2)
    out: "4"
integers-pass-through-unchanged:
