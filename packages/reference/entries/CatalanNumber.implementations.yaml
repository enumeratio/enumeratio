threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: CatalanNumber([1, 2, 3, 4])
    out: "[1, 2, 5, 14]"
  tex:
    in: \mathrm{CatalanNumber}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack)
    out: \bigl\lbrack1, 2, 5, 14\bigr\rbrack
  fullform:
    in: CatalanNumber[List[1, 2, 3, 4]]
  wolfram:
    in: CatalanNumber[List[1, 2, 3, 4]]
    out: "{1, 2, 5, 14}"
    tex:
      in: C_{\{1,2,3,4\}}
      out: \{1,2,5,14\}
  sympy:
    in: catalan([1, 2, 3, 4])
    out: "AttributeError: 'list' object has no attribute 'is_Integer'"
    verdict: error
    kind: threading
    note: compute-engine's CatalanNumber is Listable and threads over the list; SymPy's takes scalars only.
  sage:
    in: catalan_number([1, 2, 3, 4])
  julia:
    in: Combinatorics.catalannum([1, 2, 3, 4])
    out: "MethodError: no method matching catalannum(::Vector{Int64}) The function `catalannum` exists, but no"
    verdict: error
    kind: threading
    note: compute-engine's CatalanNumber is Listable and threads over the list; Nemo/Combinatorics.jl takes scalars only.
  mathlib4:
    in: (catalan [1, 2, 3, 4])
