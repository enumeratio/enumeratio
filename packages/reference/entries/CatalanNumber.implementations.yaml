threads-element-wise-over-a-list-as-wolfram-s:
  wolfram:
    in: CatalanNumber[List[1, 2, 3, 4]]
    out: "{1, 2, 5, 14}"
    tex:
      in: C_{\{1,2,3,4\}}
      out: \{1,2,5,14\}
  sympy:
    in: catalan([1, 2, 3, 4])
    out: "AttributeError: 'list' object has no attribute 'is_Integer'"
    verdict: error
    kind: threading
    note: compute-engine's CatalanNumber is Listable and threads over the list; SymPy's takes scalars only.
half-integer-arguments-evaluate-exactly-through:
  wolfram:
    in: CatalanNumber[Rational[5, 2]]
    out: 1024/(105*Pi)
    tex:
      in: C_{\frac{5}{2}}
      out: \frac{1024}{105 \pi }
  sympy:
    in: catalan(Rational(5, 2))
    out: catalan(5/2)
