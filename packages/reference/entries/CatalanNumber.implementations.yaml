catalannumber-neg-1-is-neg-1:
  epsil:
    in: CatalanNumber(-1)
    out: "-1"
  tex:
    in: \mathrm{CatalanNumber}(-1)
    out: "-1"
  traditional:
    in: C_{-1}
    out: "-1"
  fullform:
    in: CatalanNumber[-1]
  wolfram:
    in: CatalanNumber[-1]
    note: Checked against an actual Wolfram kernel (see combinatorics.oracle.json) -- CatalanNumber[-1] = -1. The alternative Gamma-ratio limit Gamma(2n+1)/(Gamma(n+1) Gamma(n+2)) -- what SymPy's and Sage's own catalan/catalan_number give -- disagrees, at -1/2; this entry follows the verified Wolfram kernel output.
  sympy:
    in: catalan(-1)
    out: -1/2
    verdict: disagree
    kind: convention
    note: compute-engine and Wolfram take C(-1) = -1; SymPy's Γ formula gives the limit -1/2.
  sage:
    in: catalan_number(-1)
  julia:
    in: Combinatorics.catalannum(-1)
    out: "DomainError with -1: n must be nonnegative"
    verdict: error
    kind: domain
    note: Combinatorics.jl's catalannum takes nonnegative integers; compute-engine's CatalanNumber continues through Γ (and to negative integers, as Wolfram's does).
  mathlib4:
    in: (catalan (-1))
