segner-s-recurrence-c-n-1-sum-i-0-n-c-i-c-n-i:
  epsil:
    in: CatalanNumber(4) == Sum(CatalanNumber(i) * CatalanNumber(3 - i), (i, 0, 3))
    out: True
  tex:
    in: \mathrm{CatalanNumber}(4)=\sum_{i=0}^3\mathrm{CatalanNumber}(i)\mathrm{CatalanNumber}(3-i)
    out: \top
  traditional:
    in: C_{4}=\sum_{i=0}^3C_{i}C_{3-i}
    out: \mathrm{True}
  fullform:
    in: Equal[CatalanNumber[4], Sum[Times[CatalanNumber[i], CatalanNumber[Subtract[3, i]]], List[i, 0, 3]]]
  wolfram:
    in: (CatalanNumber[4] == Sum[Times[CatalanNumber[i], CatalanNumber[Subtract[3, i]]], List[i, 0, 3]])
