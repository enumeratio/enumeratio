closed-form-c-n-frac-1-n-1-binom-2n-n-here-at-n:
  wolfram:
    in: Divide[Binomial[Times[2, 5], 5], Plus[5, 1]]
    out: "42"
    tex:
      in: \frac{\binom{2\ 5}{5}}{5+1}
      out: "42"
  sage:
    in: (binomial((2 * 5), 5) / (5 + 1))
    out: "42"
  julia:
    in: (binomial(ZZ((2 * 5)), ZZ(5)) // (5 + 1))
    out: "42.0"
  mathlib4:
    in: "(((Nat.choose (2 * 5) 5) : ℚ) / (5 + 1))"
    out: "42"
  oscar:
    in: (binomial(ZZ((2 * 5)), ZZ(5)) // (5 + 1))
    out: "42.0"
  rust:
    in: (binomial((n(2) * n(5)), n(5)) / (n(5) + n(1)))
    out: "42"
  sympy:
    in: (S(binomial((2 * 5), 5)) / (5 + 1))
    out: "42"
equivalently-c-n-binom-2n-n-binom-2n-n-1:
  wolfram:
    in: Subtract[Binomial[10, 5], Binomial[10, 6]]
    out: "42"
    tex:
      in: \binom{10}{5}-\binom{10}{6}
      out: "42"
  sage:
    in: (binomial(10, 5) - binomial(10, 6))
    out: "42"
  julia:
    in: (binomial(ZZ(10), ZZ(5)) - binomial(ZZ(10), ZZ(6)))
    out: "42"
  mathlib4:
    in: ((Nat.choose 10 5) - (Nat.choose 10 6))
    out: "42"
  oscar:
    in: (binomial(ZZ(10), ZZ(5)) - binomial(ZZ(10), ZZ(6)))
    out: "42"
  rust:
    in: (binomial(n(10), n(5)) - binomial(n(10), n(6)))
    out: "42"
  sympy:
    in: (binomial(10, 5) - binomial(10, 6))
    out: "42"
the-consecutive-ratio-is-frac-c-n-1-c-n-frac-2:
  wolfram:
    in: Divide[CatalanNumber[6], CatalanNumber[5]]
    out: 22/7
    tex:
      in: \frac{C_6}{C_5}
      out: \frac{22}{7}
  sage:
    in: (catalan_number(6) / catalan_number(5))
    out: 22/7
  julia:
    in: (Combinatorics.catalannum(6) // Combinatorics.catalannum(5))
    out: "3.142857142857143"
  mathlib4:
    in: "(((catalan 6) : ℚ) / (catalan 5))"
    out: 22/7
  sympy:
    in: (S(catalan(6)) / catalan(5))
    out: 22/7
