- id: a-3-3-matrix
  caption: A 3×3 matrix
  category: Bars
  vdom:
    tag: notatio-bar-chart-3d
    attributes:
      data: "[[1,2,3],[2,4,3],[3,1,5]]"
- id: a-single-row
  caption: A single row
  category: Bars
  notes: A flat list is one row of bars — the 3-D counterpart of a plain BarChart.
  vdom:
    tag: notatio-bar-chart-3d
    attributes:
      data: "[3,1,4,1,5,9,2,6]"
      label: digits of π
- id: labelled-categories
  caption: Labelled categories
  category: Bars
  notes: col-labels and row-labels take comma-separated categories, drawn just outside the near floor edges.
  vdom:
    tag: notatio-bar-chart-3d
    attributes:
      data: "[[4,2,3],[1,5,2]]"
      col-labels: a,b,c
      row-labels: x,y
- id: tighter-packing-steeper-view
  caption: Tighter packing, steeper view
  category: Bars
  notes: gap is the space between neighbouring bars as a fraction of a cell; at 0 the bars touch.
  vdom:
    tag: notatio-bar-chart-3d
    attributes:
      data: "[[1,2,3,4],[2,3,4,5],[3,4,5,6],[4,5,6,7]]"
      gap: "0.05"
      elevation: "45"
      azimuth: "40"
- id: negative-values
  caption: Negative values
  category: Bars
  notes: When the data straddles zero, the zero plane sits inside the cube and negative bars hang beneath it.
  vdom:
    tag: notatio-bar-chart-3d
    attributes:
      data: "[[-2,1,3],[2,-1,1]]"
- id: a-pinned-height-scale
  caption: A pinned height scale
  category: Bars
  notes: zrange pins the height scale so several charts can be compared; axes="false" drops the projected axis box.
  vdom:
    tag: notatio-bar-chart-3d
    attributes:
      data: "[[1,2],[2,3]]"
      zrange: 0,10
      axes: "false"
