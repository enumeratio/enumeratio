- id: height-grid
  caption: A height grid
  category: Surfaces
  notes: "`data[j][i]` is the height at the *i*-th x and *j*-th y sample; each cell becomes one projected quad, shaded by its mean height."
  expr: [ListPlot3D, [List, [List, 0, 1, 2, 3], [List, 1, 3, 4, 3], [List, 2, 4, 6, 4], [List, 1, 2, 3, 2]]]
- id: ridge-different-angle
  caption: A ridge, from a different angle
  category: Surfaces
  notes: "`azimuth` rotates about the vertical axis; `elevation` tilts the view above the floor."
  expr:
    [
      ListPlot3D,
      [
        List,
        [List, 0, 0, 0, 0, 0],
        [List, 0, 1, 2, 1, 0],
        [List, 0, 2, 5, 2, 0],
        [List, 0, 1, 2, 1, 0],
        [List, 0, 0, 0, 0, 0],
      ],
      [Tuple, Azimuth, 55],
      [Tuple, Elevation, 35],
      [Tuple, Label, "'a ridge'"],
    ]
- id: wireframe
  caption: Wireframe
  category: Surfaces
  notes: "`wireframe` draws the quad outlines unfilled -- useful when the mesh matters more than the shading."
  expr:
    [
      ListPlot3D,
      [List, [List, 0, 1, 2, 3], [List, 1, 3, 4, 3], [List, 2, 4, 6, 4], [List, 1, 2, 3, 2]],
      [Tuple, Wireframe, True],
    ]
- id: hole-in-surface
  caption: A hole in the surface
  category: Surfaces
  notes: "A missing sample (an empty string, since the schema has no `null`) is a hole: the four quads that touch it are skipped, rather than drawing a spike through zero."
  expr:
    [
      ListPlot3D,
      [
        List,
        [List, 0, 0, 0, 0, 0],
        [List, 0, 1, 2, 1, 0],
        [List, 0, 2, "''", 2, 0],
        [List, 0, 1, 2, 1, 0],
        [List, 0, 0, 0, 0, 0],
      ],
    ]
- id: scatter-3d
  caption: A 3-D scatter
  category: Point clouds
  notes: Markers are drawn back-to-front, shrinking and fading with distance -- the only depth cue an orthographic view has.
  expr:
    [
      ListPlot3D,
      [
        List,
        [List, 0, 0, 0],
        [List, 1, 0, 1],
        [List, 0, 1, 1],
        [List, 1, 1, 0],
        [List, 0.5, 0.5, 2],
        [List, 0.2, 0.8, 0.4],
        [List, 0.8, 0.2, 1.6],
      ],
      [Tuple, Type, "'points'"],
    ]
- id: scatter-no-depth-cue
  caption: Without depth cueing
  category: Point clouds
  notes: '`depth-cue="0"` draws every marker at the same size and opacity; `size` sets the near-marker radius.'
  expr:
    [
      ListPlot3D,
      [
        List,
        [List, 0, 0, 0],
        [List, 1, 0, 1],
        [List, 0, 1, 1],
        [List, 1, 1, 0],
        [List, 0.5, 0.5, 2],
        [List, 0.2, 0.8, 0.4],
        [List, 0.8, 0.2, 1.6],
      ],
      [Tuple, Type, "'points'"],
      [Tuple, DepthCue, 0],
      [Tuple, Size, 5],
    ]
- id: scattered-triples-surfaced
  caption: Scattered triples, surfaced
  category: Point clouds
  notes: Given triples, the surface form bins them onto an *n*x*n* grid -- each cell the mean z of the points that land in it, a cell with no points a hole -- and meshes that.
  expr:
    [
      ListPlot3D,
      [
        List,
        [List, 0, 0, 1],
        [List, 1, 0, 2],
        [List, 2, 0, 1],
        [List, 0, 1, 2],
        [List, 1, 1, 4],
        [List, 2, 1, 2],
        [List, 0, 2, 1],
        [List, 1, 2, 2],
        [List, 2, 2, 1],
        [List, 0.4, 0.4, 1.5],
        [List, 1.6, 1.4, 3],
      ],
      [Tuple, N, 3],
    ]
