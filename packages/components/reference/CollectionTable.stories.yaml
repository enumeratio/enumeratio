- id: subsets-4-with-glyph
  caption: Subsets(4), every subset drawn
  category: Basic
  notes: Sixteen rows, in the binary (Gray-free) order the kernel unranks. Sort by `Length` to group by size; filter `Length(_) == 2` for the six pairs -- the count goes exact at once, since sixteen rows scan in a millisecond. The `Sum` column is any expression over the row, not just a head.
  expr:
    [
      CollectionTable,
      [Subsets, 4],
      [Tuple, Columns, "'Length, Sum'"],
      [Tuple, Glyph, "'subset'"],
      [Tuple, PageSize, 10],
    ]
- id: symmetric-group-5-statistics
  caption: SymmetricGroup(5), the classical statistics
  category: Basic
  notes: The 44 derangements of five, picked out of 120 by the filter, each with its `Descents` number, `MajorIndex`, `Inversions` count and `Cycles` count. Clear the filter to see all 120; sort by `Inversions` to see that it and `MajorIndex` are equidistributed but not equal; add `Peaks`, `Excedances` or `LeftToRightMaxima` as further columns.
  expr:
    [
      CollectionTable,
      [SymmetricGroup, 5],
      [Tuple, Columns, "'Descents, MajorIndex, Inversions, CycleCount, FixedPoints'"],
      [Tuple, Glyph, "'permutation'"],
      [Tuple, Filter, "'FixedPoints(_) == 0'"],
    ]
- id: symmetric-group-12-paging
  caption: SymmetricGroup(12) -- scrolling without materialising
  category: Basic
  notes: 479,001,600 permutations. The table opens on page one million (`page` and `page-size` give its first row) -- `At` unranks the rows in view directly, and only those. Scroll, or type a row number into the jump field. Sorting a collection this large keeps the best rows over a scan and says how far it has looked; a filter scans twenty thousand rows at a time and offers to continue.
  expr:
    [
      CollectionTable,
      [SymmetricGroup, 12],
      [Tuple, Columns, "'Descents, Inversions'"],
      [Tuple, Glyph, "'permutation'"],
      [Tuple, Page, "'1000000'"],
      [Tuple, PageSize, 10],
    ]
- id: symmetric-group-20-beyond-2-53
  caption: SymmetricGroup(20)
  category: Beyond 2⁵³
  notes: 2,432,902,008,176,640,000 rows -- past Number.MAX_SAFE_INTEGER, so the count is shown as the approximation it is, and the rows are still exact. Row numbers are bigints; type 2432902008176640000 into the jump field for the last permutation. `readonly` hides the editors.
  expr:
    [
      CollectionTable,
      [SymmetricGroup, 20],
      [Tuple, Columns, "'Descents, CycleCount'"],
      [Tuple, PageSize, 10],
      [Tuple, Readonly, True],
    ]
- id: symmetric-group-25-last-row
  caption: SymmetricGroup(25), jumped to its last row
  category: Beyond 2⁵³
  notes: 15,511,210,043,330,985,984,000,000 permutations. `scroll-position` is the exact row number, past anything a double holds, so the table opens on the last permutation and the scrollbar is scaled -- wheel and arrow keys move by row.
  expr:
    [
      CollectionTable,
      [SymmetricGroup, 25],
      [Tuple, Columns, "'Descents, CycleCount'"],
      [Tuple, ScrollPosition, "'15511210043330985984000000'"],
      [Tuple, Readonly, True],
    ]
- id: non-negative-integers-endless
  caption: NonNegativeIntegers, scrolling without end
  category: Beyond 2⁵³
  notes: An infinite set with no `At`, so the table walks it and keeps the window it has walked. The count is infinite, the scrollbar grows a runway as you reach the end, and a far jump walks forward within a budget rather than freeze. A filter over it, `Mod(_, 1000) == 7`, is a lower bound that grows as the scan goes; sorting it declines, and says why.
  expr: [CollectionTable, NonNegativeIntegers, [Tuple, Columns, "'Sqrt, Mod(_, 7)'"], [Tuple, Readonly, True]]
- id: integer-partitions-8-ferrers
  caption: IntegerPartitions(8) as Ferrers diagrams
  category: Other carriers
  notes: Partitions unrank in reverse-lexicographic order. The partition statistics come from @enumeratio/statistics, where each is a definition over the part list; filter `IsSelfConjugate(_) == 1` for the two self-conjugate partitions of 8, or `Length(_) == 3` for the five into three parts.
  expr:
    [
      CollectionTable,
      [IntegerPartitions, 8],
      [Tuple, Columns, "'Length, LargestPart, DistinctParts, DurfeeSquare, Crank'"],
      [Tuple, Glyph, "'partition'"],
      [Tuple, PageSize, 10],
    ]
- id: dyck-paths-4-step-words
  caption: DyckPaths(4) as step words
  category: Other carriers
  notes: Fourteen paths (Catalan), as up/down words drawn as mountain ranges. `Height`, `Area`, `Returns` (touches of the axis) and `Hills` are Dyck-path statistics; sort by `Returns` to see the Narayana-like split, or filter `Returns(_) == 1` for the five primitive paths.
  expr:
    [
      CollectionTable,
      [DyckPaths, 4],
      [Tuple, Columns, "'Height, Area, Returns, Hills'"],
      [Tuple, Glyph, "'dyck'"],
      [Tuple, PageSize, 14],
    ]
- id: set-partitions-4-blocks
  caption: SetPartitions(4), blocks as pills
  category: Other carriers
  notes: Fifteen set partitions (Bell). The element is the block list; the glyph converts it to the restricted-growth string the set-partition figure draws. `Length` counts blocks -- sort by it to walk from one block to four -- and `Max(Map(Length, _))` is the largest block.
  expr:
    [
      CollectionTable,
      [SetPartitions, 4],
      [Tuple, Columns, "'Length, Max(Map(Length, _))'"],
      [Tuple, Glyph, "'set-partition'"],
      [Tuple, PageSize, 15],
    ]
