- id: rational-function
  caption: A rational function
  category: Poles and zeros
  notes: Two poles at ±i, clipped at the ceiling, and the hue running once round each.
  expr: [ComplexPlot3D, [Divide, 1, [Add, [Power, z, 2], 1]]]
- id: zeros-too
  caption: Zeros too
  category: Poles and zeros
  notes: The cube roots of unity are the three dimples; the poles are the two spikes. Reading the colour wheel round a point gives its order, and the direction of the winding says which.
  expr:
    [
      ComplexPlot3D,
      [Divide, [Add, [Power, z, 3], -1], [Add, [Power, z, 2], 1]],
      [Tuple, z, [Complex, -2, -2], [Complex, 2, 2]],
      [Tuple, Samples, 60],
    ]
- id: gamma-function
  caption: The gamma function
  category: Special functions
  notes: Poles at 0, −1, −2, …, each a spike; to the right the surface climbs as the factorials do.
  expr:
    [
      ComplexPlot3D,
      [Gamma, z],
      [Tuple, z, [Complex, -4, -3], [Complex, 4, 3]],
      [Tuple, Samples, 60],
      [Tuple, MaxHeight, 6],
    ]
- id: riemann-zeta
  caption: The Riemann zeta function
  category: Special functions
  notes: The pole at z = 1, and up the critical line the first non-trivial zeros at ½ + 14.13i, ½ + 21.02i, ½ + 25.01i -- the dimples every hue winds round.
  expr: [ComplexPlot3D, [Zeta, z], [Tuple, z, -2, [Complex, 3, 30]], [Tuple, Samples, 70], [Tuple, MaxHeight, 3]]
- id: dense-rational-surface
  caption: A dense rational surface
  category: GPU evaluation
  notes: The rational function again at 160 samples a side, so the spikes come to a point and the hue is continuous across each face.
  expr:
    [
      ComplexPlot3D,
      [Divide, [Add, [Power, z, 3], -1], [Add, [Power, z, 2], 1]],
      [Tuple, Gpu, 160],
      [Tuple, MaxHeight, 3],
    ]
- id: essential-singularity
  caption: An essential singularity
  category: GPU evaluation
  notes: "Exp(1/z) near the origin: the surface climbs to the ceiling on the right and falls to the floor on the left, and between them every hue passes infinitely often."
  expr:
    [
      ComplexPlot3D,
      [Power, ExponentialE, [Divide, 1, z]],
      [Tuple, z, [Complex, -1, -1], [Complex, 1, 1]],
      [Tuple, Gpu, 200],
      [Tuple, MaxHeight, 3],
      [Tuple, Elevation, 30],
    ]
- id: trigamma-function
  caption: The trigamma function
  category: GPU evaluation
  notes: "PolyGamma(1, z) through the analytic kernels on the GPU: double poles at 0, −1, −2, …, so the hue winds twice round each spike."
  expr:
    [
      ComplexPlot3D,
      [PolyGamma, 1, z],
      [Tuple, z, [Complex, -4, -2], [Complex, 2, 2]],
      [Tuple, Gpu, 160],
      [Tuple, MaxHeight, 5],
    ]
- id: through-an-expression
  caption: Through an expression, corner-to-corner
  category: As an expression
  notes: "The head is the component: an evaluated `ComplexPlot3D(f, (z, a + b i, c + d i))` draws itself, the iterator's complex corners becoming the `domain` -- the same picture as the first story, written the other way."
  expr: [ComplexPlot3D, [Divide, 1, [Add, [Power, z, 2], 1]], [Tuple, z, [Complex, -2, -2], [Complex, 2, 2]]]
- id: argument-on-the-sinebow-gradient
  caption: The argument on the sinebow gradient
  category: Color
  notes: Faces take arg f(z) on the gradient; `phase`, the hue wheel, by default.
  expr:
    [
      ComplexPlot3D,
      [Divide, 1, [Add, [Power, z, 2], 1]],
      [Tuple, z, [Complex, -2, -2], [Complex, 2, 2]],
      [Tuple, ColorFunction, "'Sinebow'"],
    ]
