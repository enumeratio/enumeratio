digitcount-2-147:
  epsil:
    in: DigitCount(2_147)
    out: "[1, 1, 0, 1, 0, 0, 1, 0, 0, 0]"
  tex:
    in: \mathrm{DigitCount}(2\,147)
    out: \bigl\lbrack1, 1, 0, 1, 0, 0, 1, 0, 0, 0\bigr\rbrack
  fullform:
    in: DigitCount[2147]
  wolfram:
    in: DigitCount[2147]
    out: "{1, 1, 0, 1, 0, 0, 1, 0, 0, 0}"
    tex:
      in: \text{DigitCount}[2147]
      out: \{1,1,0,1,0,0,1,0,0,0\}
