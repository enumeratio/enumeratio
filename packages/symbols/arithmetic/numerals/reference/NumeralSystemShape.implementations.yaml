4-and-6-share-a-factor-so-this-is-not-a:
  epsil:
    in: NumeralSystemShape(ResidueNumerals([4, 6]))
    out: |-
      {
        "Bijective" -> False,
        "Integers" -> Range(0, 23),
        "Digits" -> [Range(0, 3), Range(0, 5)],
        "Width" -> 2,
      }
  tex:
    in: \mathrm{NumeralSystemShape}(\mathrm{ResidueNumerals}(\bigl\lbrack4, 6\bigr\rbrack))
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \bot), \mathrm{KeyValuePair}(\text{Integers}, 0..23), \mathrm{KeyValuePair}(\text{Digits}, \bigl\lbrack0..3, 0..5\bigr\rbrack), \mathrm{KeyValuePair}(\text{Width}, 2))
  traditional:
    in: \mathrm{NumeralSystemShape}(\mathrm{ResidueNumerals}(\bigl\lbrack4, 6\bigr\rbrack))
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \mathrm{False}), \mathrm{KeyValuePair}(\text{Integers}, 0..23), \mathrm{KeyValuePair}(\text{Digits}, \bigl\lbrack0..3, 0..5\bigr\rbrack), \mathrm{KeyValuePair}(\text{Width}, 2))
numeralsystemshape-zeckendorfnumerals:
  epsil:
    in: NumeralSystemShape(ZeckendorfNumerals)
    out: |-
      {
        "Bijective" -> True,
        "Integers" -> NonNegativeIntegers,
        "Digits" -> Range(0, 1),
        "Rule" -> "no two adjacent ones",
      }
  tex:
    in: \mathrm{NumeralSystemShape}(\mathrm{ZeckendorfNumerals})
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \top), \mathrm{KeyValuePair}(\text{Integers}, \mathbb{N}), \mathrm{KeyValuePair}(\text{Digits}, 0..1), \mathrm{KeyValuePair}(\text{Rule}, \text{no two adjacent ones}))
  traditional:
    in: \mathrm{NumeralSystemShape}(\mathrm{ZeckendorfNumerals})
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \mathrm{True}), \mathrm{KeyValuePair}(\text{Integers}, \mathbb{N}), \mathrm{KeyValuePair}(\text{Digits}, 0..1), \mathrm{KeyValuePair}(\text{Rule}, \text{no two adjacent ones}))
ordinary-base-2-in-the-same-shape-every-other:
  epsil:
    in: NumeralSystemShape(PositionalNumerals(2))
    out: |-
      {
        "Bijective" -> True,
        "Integers" -> NonNegativeIntegers,
        "Digits" -> Range(0, 1),
      }
  tex:
    in: \mathrm{NumeralSystemShape}(\mathrm{PositionalNumerals}(2))
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \top), \mathrm{KeyValuePair}(\text{Integers}, \mathbb{N}), \mathrm{KeyValuePair}(\text{Digits}, 0..1))
  traditional:
    in: \mathrm{NumeralSystemShape}(\mathrm{PositionalNumerals}(2))
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \mathrm{True}), \mathrm{KeyValuePair}(\text{Integers}, \mathbb{N}), \mathrm{KeyValuePair}(\text{Digits}, 0..1))
every-integer-negatives-included-with-no-sign:
  epsil:
    in: NumeralSystemShape(BalancedNumerals(3))
    out: '{"Bijective" -> True, "Integers" -> Integers, "Digits" -> Range(-1, 1)}'
  tex:
    in: \mathrm{NumeralSystemShape}(\mathrm{BalancedNumerals}(3))
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \top), \mathrm{KeyValuePair}(\text{Integers}, \mathbb{Z}), \mathrm{KeyValuePair}(\text{Digits}, (-1)..1))
  traditional:
    in: \mathrm{NumeralSystemShape}(\mathrm{BalancedNumerals}(3))
    out: \mathrm{Dictionary}(\mathrm{KeyValuePair}(\text{Bijective}, \mathrm{True}), \mathrm{KeyValuePair}(\text{Integers}, \mathbb{Z}), \mathrm{KeyValuePair}(\text{Digits}, (-1)..1))
