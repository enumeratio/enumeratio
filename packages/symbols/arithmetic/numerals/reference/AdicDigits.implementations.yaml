adicdigits-adicnumeral-10-third-6:
  epsil:
    in: AdicDigits(AdicNumeral(10, 1 / 3), 6)
    out: "[7, 6, 6, 6, 6, 6]"
  tex:
    in: \mathrm{AdicDigits}(\mathrm{AdicNumeral}(10, \frac{1}{3}), 6)
    out: \bigl\lbrack7, 6, 6, 6, 6, 6\bigr\rbrack
  fullform:
    in: AdicDigits[AdicNumeral[10, Rational[1, 3]], 6]
  sage:
    in: list((Qp(10, 60)(QQ((1/3)))).unit_part().expansion())[:6]
    out: "ValueError: p must be prime"
    verdict: error
    kind: domain
    note: Base 10 is composite; Sage's Qp is prime-p only, so this demo example (not scanned as role test) has no counterpart there.
