an-empty-digit-list-is-left-unevaluated-rather:
  epsil:
    in: FromDigits([])
    out: FromDigits([])
  tex:
    in: \mathrm{FromDigits}(\bigl\lbrack \bigr\rbrack)
    out: \mathrm{FromDigits}(\bigl\lbrack \bigr\rbrack)
  fullform:
    in: FromDigits[List[]]
  wolfram:
    in: FromDigits[List[]]
    out: "0"
    tex:
      in: \text{FromDigits}[\{\}]
      out: "0"
    verdict: disagree
    kind: domain
    note: An empty digit list is left unevaluated here; Wolfram reads it as 0.
