fromdigits-inverts-integerdigits:
  epsil:
    in: FromDigits(IntegerDigits(58_127)) == 58_127
    out: True
  tex:
    in: \mathrm{FromDigits}(\mathrm{IntegerDigits}(58\,127))=58\,127
    out: \top
  traditional:
    in: \mathrm{FromDigits}(\mathrm{IntegerDigits}(58\,127))=58\,127
    out: \mathrm{True}
  fullform:
    in: Equal[FromDigits[IntegerDigits[58127]], 58127]
  wolfram:
    in: (FromDigits[IntegerDigits[58127]] == 58127)
    out: True
    tex:
      in: \text{FromDigits}[\text{IntegerDigits}[58127]]=58127
      out: \text{True}
