adicvaluation-adicnumeral-5-75:
  epsil:
    in: AdicValuation(AdicNumeral(5, 75))
    out: "2"
  tex:
    in: \mathrm{AdicValuation}(\mathrm{AdicNumeral}(5, 75))
    out: "2"
  traditional:
    in: v_{5}(75)
    out: "2"
  fullform:
    in: AdicValuation[AdicNumeral[5, 75]]
  sage:
    in: (Qp(5, 60)(QQ(75))).valuation()
    out: "2"
  rust:
    in: adic_valuation(adic(n(5), n(75)))
    out: "2"
the-valuation-of-zero-is-positive-infinity:
  epsil:
    in: AdicValuation(AdicNumeral(5, 0))
    out: PositiveInfinity
  tex:
    in: \mathrm{AdicValuation}(\mathrm{AdicNumeral}(5, 0))
    out: \infty
  traditional:
    in: v_{5}(0)
    out: \infty
  fullform:
    in: AdicValuation[AdicNumeral[5, 0]]
  sage:
    in: (Qp(5, 60)(QQ(0))).valuation()
    out: +Infinity
    verdict: disagree
    kind: convention
    note: Sage's exact zero has an unbounded (+Infinity) valuation too, spelled differently than our PositiveInfinity — a printed-form difference, not a value disagreement.
  rust:
    in: adic_valuation(adic(n(5), n(0)))
    out: PositiveInfinity
adicnorm-adicnumeral-5-75:
  epsil:
    in: AdicNorm(AdicNumeral(5, 75))
    out: 1 / 25
  tex:
    in: \mathrm{AdicNorm}(\mathrm{AdicNumeral}(5, 75))
    out: \frac{1}{25}
  traditional:
    in: \left|75\right|_{5}
    out: \frac{1}{25}
  fullform:
    in: AdicNorm[AdicNumeral[5, 75]]
  rust:
    in: adic_norm(adic(n(5), n(75)))
    out: 1/25
