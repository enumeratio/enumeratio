adicexpansion-adicnumeral-10-1-over-3-8:
  epsil:
    in: AdicExpansion(AdicNumeral(10, 1 / 3), 8)
    out: '"…66666667"'
  tex:
    in: \mathrm{AdicExpansion}(\mathrm{AdicNumeral}(10, \frac{1}{3}), 8)
    out: \text{…66666667}
the-same-1-3-2-adically:
  epsil:
    in: AdicExpansion(AdicNumeral(2, 1 / 3), 8)
    out: '"…10101011"'
  tex:
    in: \mathrm{AdicExpansion}(\mathrm{AdicNumeral}(2, \frac{1}{3}), 8)
    out: \text{…10101011}
7-25-2-5-2-1-5-1:
  epsil:
    in: AdicExpansion(AdicNumeral(5, 7 / 25), 8)
    out: '"0.12"'
  tex:
    in: \mathrm{AdicExpansion}(\mathrm{AdicNumeral}(5, \frac{7}{25}), 8)
    out: \text{0.12}
as-a-list-least-significant-first:
  epsil:
    in: AdicDigits(AdicNumeral(10, 1 / 3), 6)
    out: "[7, 6, 6, 6, 6, 6]"
  tex:
    in: \mathrm{AdicDigits}(\mathrm{AdicNumeral}(10, \frac{1}{3}), 6)
    out: \bigl\lbrack7, 6, 6, 6, 6, 6\bigr\rbrack
a-plain-non-negative-integer-terminates-with-no:
  epsil:
    in: AdicExpansion(AdicNumeral(10, 42))
    out: '"42"'
  tex:
    in: \mathrm{AdicExpansion}(\mathrm{AdicNumeral}(10, 42))
    out: \text{42}
1-is-the-all-9s-repeating-tail-since-1-999-in-z:
  epsil:
    in: AdicExpansion(AdicNumeral(10, -1), 6)
    out: '"…999999"'
  tex:
    in: \mathrm{AdicExpansion}(\mathrm{AdicNumeral}(10, -1), 6)
    out: \text{…999999}
digits-at-or-above-10-print-bracketed-as-in-15:
  epsil:
    in: AdicExpansion(AdicNumeral(16, -1), 3)
    out: '"…[15][15][15]"'
  tex:
    in: \mathrm{AdicExpansion}(\mathrm{AdicNumeral}(16, -1), 3)
    out: \text{…[15][15][15]}
digits-run-least-significant-first-1-s-first:
  epsil:
    in: AdicDigits(AdicNumeral(10, -1), 4)
    out: "[9, 9, 9, 9]"
  tex:
    in: \mathrm{AdicDigits}(\mathrm{AdicNumeral}(10, -1), 4)
    out: \bigl\lbrack9, 9, 9, 9\bigr\rbrack
