name: OstrowskiNumerals
domain: Numeral systems
signature: OstrowskiNumerals(quotients)
summary: "Ostrowski numeration: the numeral system a continued fraction's partial quotients define, with a ceiling rule — a digit may reach its bound only if the one below it is zero — that forbids carries. All quotients equal to 1 gives the golden ratio and reduces to [[ZeckendorfNumerals]]."
signatures:
  - call: OstrowskiNumerals(quotients)
    description: the system for partial quotients $a_1, a_2, \dots$
    library: enumeratio-numerals
    type: (list<integer>) -> value
seeAlso:
  - IntegerDigits
  - ZeckendorfNumerals
  - Ostrowski
