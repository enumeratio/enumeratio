6667-3-1-1-3-is-a-10-adic-integer:
  epsil:
    in: AdicNumeral(10, 1 / 3) * 3
    out: AdicNumeral(10, 1)
  tex:
    in: 3\mathrm{AdicNumeral}(10, \frac{1}{3})
    out: \mathrm{AdicNumeral}(10, 1)
  fullform:
    in: Times[AdicNumeral[10, Rational[1, 3]], 3]
  sage:
    in: (Qp(10, 60)(QQ((1/3))) * 3)
    out: "ValueError: p must be prime"
    verdict: error
    kind: domain
    note: Sage's Qp is p-adic only; our composite (10-adic) numerals have no counterpart there.
  rust:
    in: (adic(n(10), rational(n(1), n(3))) * n(3))
    out: "panic: the adic crate takes a prime base, not 10"
    verdict: error
    kind: domain
    note: The adic crate is p-adic only; our composite (10-adic) numerals have no counterpart there.
999-1-0-carrying-forever:
  epsil:
    in: AdicNumeral(10, -1) + 1
    out: AdicNumeral(10, 0)
  tex:
    in: \mathrm{AdicNumeral}(10, -1)+1
    out: \mathrm{AdicNumeral}(10, 0)
  fullform:
    in: Plus[AdicNumeral[10, -1], 1]
  sage:
    in: (Qp(10, 60)(QQ(-1)) + 1)
    out: "ValueError: p must be prime"
    verdict: error
    kind: domain
    note: Sage's Qp is p-adic only; our composite (10-adic) numerals have no counterpart there.
  rust:
    in: (adic(n(10), n(-1)) + n(1))
    out: "panic: the adic crate takes a prime base, not 10"
    verdict: error
    kind: domain
    note: The adic crate is p-adic only; our composite (10-adic) numerals have no counterpart there.
capped-the-representative-modulo-10-8:
  epsil:
    in: AdicNumeral(10, 1 / 3, 8)
    out: AdicNumeral(10, 66_666_667, 8)
  tex:
    in: \mathrm{AdicNumeral}(10, \frac{1}{3}, 8)
    out: \mathrm{AdicNumeral}(10, 66\,666\,667, 8)
  fullform:
    in: AdicNumeral[10, Rational[1, 3], 8]
prime-base-q-5-is-a-field-so-the-point-moves:
  epsil:
    in: AdicNumeral(5, 3) / 5
    out: AdicNumeral(5, 3 / 5)
  tex:
    in: \frac{\mathrm{AdicNumeral}(5, 3)}{5}
    out: \mathrm{AdicNumeral}(5, \frac{3}{5})
  fullform:
    in: Divide[AdicNumeral[5, 3], 5]
  sage:
    in: (Qp(5, 60)(QQ(3)) / 5)
    out: 3*5^-1 + O(5^59)
    verdict: disagree
    kind: shape
    note: A textual mismatch, not a value one — our expected is the structured AdicNumeral(5, 3/5), printed differently than Sage's own Qp repr. AdicValuation(...) on both sides agrees (see AdicValuation.examples.yaml).
  rust:
    in: (adic(n(5), n(3)) / n(5))
    out: '["AdicNumeral",5,["Rational",3,5]]'
dividing-by-zero-stays-complexinfinity:
  epsil:
    in: AdicNumeral(5, -1) / 0
    out: ComplexInfinity
  tex:
    in: \frac{\mathrm{AdicNumeral}(5, -1)}{0}
    out: \tilde\infty
  fullform:
    in: Divide[AdicNumeral[5, -1], 0]
  sage:
    in: (Qp(5, 60)(QQ(-1)) / 0)
    out: "ZeroDivisionError: cannot divide by zero"
    verdict: error
    kind: convention
    note: We decline gracefully to ComplexInfinity, same as anywhere else in the engine; Sage's Qp raises on division by the literal zero instead.
  rust:
    in: (adic(n(5), n(-1)) / n(0))
    out: "panic: Error during QAdic<EAdic> division: DivideByZero"
    verdict: error
    kind: domain
    note: The adic crate's own division panics on a zero divisor; compute-engine answers ComplexInfinity, same as dividing anything else by zero.
composite-base-2-is-not-a-unit-of-z-10-so-this:
  epsil:
    in: AdicNumeral(10, 3) / 2
    out: 1 / 2 * AdicNumeral(10, 3)
  tex:
    in: \frac{\mathrm{AdicNumeral}(10, 3)}{2}
    out: \frac{\mathrm{AdicNumeral}(10, 3)}{2}
  fullform:
    in: Divide[AdicNumeral[10, 3], 2]
  sage:
    in: (Qp(10, 60)(QQ(3)) / 2)
    out: "ValueError: p must be prime"
    verdict: error
    kind: domain
    note: Sage's Qp is p-adic only; our composite (10-adic) numerals have no counterpart there.
  rust:
    in: (adic(n(10), n(3)) / n(2))
    out: "panic: the adic crate takes a prime base, not 10"
    verdict: error
    kind: domain
    note: The adic crate is p-adic only; our composite (10-adic) numerals have no counterpart there.
adding-two-capped-numerals-keeps-only-the-weaker:
  epsil:
    in: AdicNumeral(10, 1 / 3, 8) + AdicNumeral(10, 1 / 3, 5)
    out: AdicNumeral(10, 33_334, 5)
  tex:
    in: \mathrm{AdicNumeral}(10, \frac{1}{3}, 8)+\mathrm{AdicNumeral}(10, \frac{1}{3}, 5)
    out: \mathrm{AdicNumeral}(10, 33\,334, 5)
  fullform:
    in: Plus[AdicNumeral[10, Rational[1, 3], 8], AdicNumeral[10, Rational[1, 3], 5]]
multiplying-by-p-2-raises-the-absolute-precision:
  epsil:
    in: AdicNumeral(5, 3, 6) * 25
    out: AdicNumeral(5, 75, 8)
  tex:
    in: 25\mathrm{AdicNumeral}(5, 3, 6)
    out: \mathrm{AdicNumeral}(5, 75, 8)
  fullform:
    in: Times[AdicNumeral[5, 3, 6], 25]
a-negative-power-inverts-exactly-3-1-1-3-in-z-10:
  epsil:
    in: AdicNumeral(10, 3) ^ -1
    out: AdicNumeral(10, 1 / 3)
  tex:
    in: \frac{1}{\mathrm{AdicNumeral}(10, 3)}
    out: \mathrm{AdicNumeral}(10, \frac{1}{3})
  fullform:
    in: Power[AdicNumeral[10, 3], -1]
  sage:
    in: ((Qp(10, 60)(QQ(3)))^-1)
    out: "ValueError: p must be prime"
    verdict: error
    kind: domain
    note: Sage's Qp is p-adic only; our composite (10-adic) numerals have no counterpart there.
  rust:
    in: power(adic(n(10), n(3)), n(-1))
    out: "panic: the adic crate takes a prime base, not 10"
    verdict: error
    kind: domain
    note: The adic crate works over a single prime base; compute-engine's AdicNumeral takes any base b ≥ 2 and mixes them symbolically.
numerals-over-different-bases-never-combine-and:
  epsil:
    in: AdicNumeral(7, 2) + AdicNumeral(5, 2)
    out: AdicNumeral(7, 2) + AdicNumeral(5, 2)
  tex:
    in: \mathrm{AdicNumeral}(7, 2)+\mathrm{AdicNumeral}(5, 2)
    out: \mathrm{AdicNumeral}(7, 2)+\mathrm{AdicNumeral}(5, 2)
  fullform:
    in: Plus[AdicNumeral[7, 2], AdicNumeral[5, 2]]
  sage:
    in: (Qp(7, 60)(QQ(2)) + Qp(5, 60)(QQ(2)))
    out: "TypeError: unsupported operand parent(s) for +: '7-adic Field with capped relative precision 60' and '5-adic Fi"
    verdict: error
    kind: domain
    note: Different bases never combine on our side either (the call stays unevaluated); Sage's two Qp fields are separate parents and its + raises instead.
  rust:
    in: (adic(n(7), n(2)) + adic(n(5), n(2)))
    out: "panic: MixedCharacteristic"
    verdict: error
    kind: domain
    note: The adic crate works over a single prime base; compute-engine's AdicNumeral takes any base b ≥ 2 and mixes them symbolically.
the-exact-zero-has-infinite-valuation:
  epsil:
    in: AdicValuation(AdicNumeral(10, 0))
    out: PositiveInfinity
  tex:
    in: \mathrm{AdicValuation}(\mathrm{AdicNumeral}(10, 0))
    out: \infty
  traditional:
    in: v_{10}(0)
    out: \infty
  fullform:
    in: AdicValuation[AdicNumeral[10, 0]]
  sage:
    in: (Qp(10, 60)(QQ(0))).valuation()
    out: "ValueError: p must be prime"
    verdict: error
    kind: domain
    note: Sage's Qp is p-adic only; our composite (10-adic) numerals have no counterpart there.
  rust:
    in: adic_valuation(adic(n(10), n(0)))
    out: "panic: the adic crate takes a prime base, not 10"
    verdict: error
    kind: domain
    note: The adic crate works over a single prime base; compute-engine's AdicNumeral takes any base b ≥ 2 and mixes them symbolically.
a-capped-zero-is-only-o-b-prec-so-its-valuation:
  epsil:
    in: AdicValuation(AdicNumeral(10, 0, 8))
    out: "8"
  tex:
    in: \mathrm{AdicValuation}(\mathrm{AdicNumeral}(10, 0, 8))
    out: "8"
  traditional:
    in: v_{10}(0)
    out: "8"
  fullform:
    in: AdicValuation[AdicNumeral[10, 0, 8]]
