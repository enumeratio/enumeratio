    in: DigitSum(58_127)
    out: "23"
  tex:
    in: \mathrm{DigitSum}(58\,127)
    out: "23"
  fullform:
    in: DigitSum[58127]
  wolfram:
    in: DigitSum[58127]
    out: "23"
    tex:
      in: \text{Total}[\text{IntegerDigits}[58127]]
      out: "23"
