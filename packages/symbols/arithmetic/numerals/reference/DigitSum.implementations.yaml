digit-sum-n-mod-9-the-basis-of-the-classic:
  epsil:
    in: DigitSum(58_127) % 9 == 58_127 % 9
    out: True
  tex:
    in: \mathrm{DigitSum}(58\,127)\bmod9=58\,127\bmod9
    out: \top
  traditional:
    in: \mathrm{DigitSum}(58\,127)\bmod9=58\,127\bmod9
    out: \mathrm{True}
  fullform:
    in: Equal[Mod[DigitSum[58127], 9], Mod[58127, 9]]
  wolfram:
    in: (Mod[DigitSum[58127], 9] == Mod[58127, 9])
    out: True
    tex:
      in: (\text{Total}[\text{IntegerDigits}[58127]] \bmod 9)=(58127 \bmod 9)
      out: \text{True}
