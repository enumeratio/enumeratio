quotient-17-5:
  epsil:
    in: Quotient(17, 5)
    out: "3"
  tex:
    in: \mathrm{Quotient}(17, 5)
    out: "3"
  wolfram:
    in: Quotient[17, 5]
    out: "3"
    tex:
      in: \text{Quotient}[17,5]
      out: "3"
the-floor-not-truncation:
  epsil:
    in: Quotient(-7, 2)
    out: "-4"
  tex:
    in: \mathrm{Quotient}(-7, 2)
    out: "-4"
  wolfram:
    in: Quotient[-7, 2]
    out: "-4"
    tex:
      in: \text{Quotient}[-7,2]
      out: "-4"
7-5i-2-i-3-8-0-6i-rounded:
  epsil:
    in: Quotient(7 + 5i, 2 + i)
    out: 4 + i
  tex:
    in: \mathrm{Quotient}(7+5i, 2+i)
    out: 4+i
  wolfram:
    in: Quotient[Complex[7, 5], Complex[2, 1]]
    out: 4 + I
    tex:
      in: \text{Quotient}[7+5 i,2+i]
      out: 4+i
2-5-2-5i-rounds-to-even-in-each-part:
  epsil:
    in: Quotient(5 + 5i, 2)
    out: 2 + 2i
  tex:
    in: \mathrm{Quotient}(5+5i, 2)
    out: 2+2i
  wolfram:
    in: Quotient[Complex[5, 5], 2]
    out: 2 + 2*I
    tex:
      in: \text{Quotient}[5+5 i,2]
      out: 2+2 i
the-remainder-takes-the-sign-of-n:
  epsil:
    in: Quotient(17, -5)
    out: "-4"
  tex:
    in: \mathrm{Quotient}(17, -5)
    out: "-4"
  wolfram:
    in: Quotient[17, -5]
m-n-quotient-m-n-mod-m-n-see-mod:
  epsil:
    in: 5 * Quotient(17, 5) + 17 % 5
    out: "17"
  tex:
    in: 5\mathrm{Quotient}(17, 5)+17\bmod5
    out: "17"
  wolfram:
    in: Plus[Times[5, Quotient[17, 5]], Mod[17, 5]]
real-arguments-lfloor-7-5-2-rfloor:
  epsil:
    in: Quotient(7.5, 2)
    out: "3"
  tex:
    in: \mathrm{Quotient}(7.5, 2)
    out: "3"
  wolfram:
    in: Quotient[7.5, 2]
rational-arguments-lfloor-21-2-rfloor:
  epsil:
    in: Quotient(7 / 2, 1 / 3)
    out: "10"
  tex:
    in: \mathrm{Quotient}(\frac{7}{2}, \frac{1}{3})
    out: "10"
  wolfram:
    in: Quotient[Rational[7, 2], Rational[1, 3]]
quotient-m-n-d-is-lfloor-m-d-n-rfloor-so-m-n-q:
  epsil:
    in: Quotient(17, 5, 3)
    out: "2"
  tex:
    in: \mathrm{Quotient}(17, 5, 3)
    out: "2"
  wolfram:
    in: Quotient[17, 5, 3]
listable-threads-over-a-list:
  epsil:
    in: Quotient([10, 20, 30], 7)
    out: "[1, 2, 4]"
  tex:
    in: \mathrm{Quotient}(\bigl\lbrack10, 20, 30\bigr\rbrack, 7)
    out: \bigl\lbrack1, 2, 4\bigr\rbrack
  wolfram:
    in: Quotient[List[10, 20, 30], 7]
