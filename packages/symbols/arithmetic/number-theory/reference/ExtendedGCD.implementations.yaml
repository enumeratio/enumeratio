confirms-the-coefficients-above-satisfy-2x-3y:
  epsil:
    in: 2 * -1 + 3 * 1
    out: "1"
  tex:
    in: -2\times1+3\times1
    out: "1"
  fullform:
    in: Plus[Times[2, -1], Times[3, 1]]
  wolfram:
    in: Plus[Times[2, -1], Times[3, 1]]
    out: "1"
    tex:
      in: 2 (-1)+3\ 1
      out: "1"
  sympy:
    in: ((2 * (-1)) + (3 * 1))
    out: "1"
  mpmath:
    in: ((2 * (-1)) + (3 * 1))
    out: "1"
  sage:
    in: ((2 * (-1)) + (3 * 1))
    out: "1"
  oscar:
    in: ((2 * -1) + (3 * 1))
    out: "1"
  julia:
    in: ((2 * -1) + (3 * 1))
    out: "1"
  mathlib4:
    in: ((2 * (-1)) + (3 * 1))
    out: "1"
  rust:
    in: ((n(2) * n(-1)) + (n(3) * n(1)))
    out: "1"
any-number-of-arguments-folding-pairwise-6-times:
  epsil:
    in: ExtendedGCD(6, 15, 30)
    out: (3, -2, 1, 0)
  tex:
    in: \mathrm{ExtendedGCD}(6, 15, 30)
    out: (3,-2,1,0)
  fullform:
    in: ExtendedGCD[6, 15, 30]
  wolfram:
    in: ExtendedGCD[6, 15, 30]
    note: "Same values: ours is the flat Tuple (g, x₁, x₂, x₃), Wolfram's is {g, {x₁, x₂, x₃}}."
gaussian-integers-by-euclid-with-the-rounded:
  epsil:
    in: ExtendedGCD(7 + 2i, 3 + -5 * i)
    out: (1, -1 + -2 * i, -2 + 2i)
  tex:
    in: \mathrm{ExtendedGCD}(7+2i, 3-5i)
    out: (1,-1-2i,-2+2i )
  fullform:
    in: ExtendedGCD[Complex[7, 2], Complex[3, -5]]
  wolfram:
    in: ExtendedGCD[Complex[7, 2], Complex[3, -5]]
    out: "{1, {-1 - 2*I, -2 + 2*I}}"
    tex:
      in: \text{ExtendedGCD}[7+2 i,3-5 i]
      out: \{1,\{-1-2 i,-2+2 i\}\}
    verdict: disagree
    kind: shape
    note: Bézout coefficients are not unique; in about one case in a thousand Wolfram returns another valid pair.
