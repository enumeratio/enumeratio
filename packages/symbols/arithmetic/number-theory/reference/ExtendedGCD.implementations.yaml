extendedgcd-2-3:
  epsil:
    in: ExtendedGCD(2, 3)
    out: (1, -1, 1)
  tex:
    in: \mathrm{ExtendedGCD}(2, 3)
    out: (1,-1,1)
  fullform:
    in: ExtendedGCD[2, 3]
  wolfram:
    in: ExtendedGCD[2, 3]
    out: "{1, {-1, 1}}"
    tex:
      in: \text{ExtendedGCD}[2,3]
      out: \{1,\{-1,1\}\}
    verdict: disagree
    kind: shape
    note: "Same values: ours is the flat Tuple (g, a, b), Wolfram's is {g, {a, b}}."
