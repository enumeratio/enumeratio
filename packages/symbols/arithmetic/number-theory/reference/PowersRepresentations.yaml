name: PowersRepresentations
domain: Number theory
signature: PowersRepresentations(n, k, p)
summary: The ways to write $n$ as a sum of $k$ non-negative $p$th powers, as non-decreasing lists.
signatures:
  - call: PowersRepresentations(n, k, p)
    description: every non-decreasing $(x_1 \le \dots \le x_k)$ with $\sum x_i^p = n$
    library: enumeratio-number-theory
details:
  - Lexicographic order. See [[SquaresR]] for just the count, at $p=2$.
seeAlso:
  - SquaresR
