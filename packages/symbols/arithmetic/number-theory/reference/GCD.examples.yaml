- id: 0-is-absorbed-every-integer-divides-it-so-gcd-0
  expr: [GCD, 0, 5]
  expected: 5
  category: Possible issues
  caption: '0 is absorbed: every integer divides it, so $\gcd(0,n)=n$'
- id: signs-are-discarded-before-computing-the-gcd
  expr: [GCD, -12, 9, 57]
