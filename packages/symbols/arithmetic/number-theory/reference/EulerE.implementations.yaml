listable-odd-indices-vanish:
  epsil:
    in: EulerE([0, 1, 2, 3, 4])
    out: "[1, 0, -1, 0, 5]"
  tex:
    in: \mathrm{EulerE}(\bigl\lbrack0, 1, 2, 3, 4\bigr\rbrack)
    out: \bigl\lbrack1, 0, -1, 0, 5\bigr\rbrack
  wolfram:
    in: EulerE[List[0, 1, 2, 3, 4]]
the-euler-polynomial-e-2-x-x-2-x:
  epsil:
    in: EulerE(2, x)
    out: x ^ 2 - x
  tex:
    in: \mathrm{EulerE}(2, x)
    out: x^2-x
e-4-x-x-4-2x-3-x:
  epsil:
    in: EulerE(4, x)
    out: x ^ 4 - 2 * x ^ 3 + x
  tex:
    in: \mathrm{EulerE}(4, x)
    out: x^4-2x^3+x
e-n-2-n-e-n-frac-12-and-e-3-0:
  epsil:
    in: EulerE(3, 1 / 2)
    out: "0"
  tex:
    in: \mathrm{EulerE}(3, \frac{1}{2})
    out: "0"
  wolfram:
    in: EulerE[3, Rational[1, 2]]
