name: StirlingS1
domain: Combinatorics
signature: StirlingS1(n, k)
summary: The signed Stirling number of the first kind, relating falling factorials to powers of n.
signatures:
  - call: StirlingS1(n, k)
    description: the signed Stirling number of the first kind $s(n, k)$.
details:
  - 'Coefficients relating falling factorials to ordinary powers: $(x)_n = \sum_{k} s(n, k)\, x^k$.'
  - $|s(n, k)|$ counts the permutations of n elements with exactly k cycles.
  - $s(n, n) = 1$ and $s(n, 0) = 0$ for $n > 0$, with the boundary case $s(0, 0) = 1$.
  - 'The unsigned values in each row sum to $n!$: $\sum_k |s(n, k)| = n!$'
  - $s(n, 1) = (-1)^{n-1}(n-1)!$.
  - Threads element-wise over a list of $n$, as Wolfram's Listable heads do.
examples:
  - id: stirlings1-5-2
    expr: [StirlingS1, 5, 2]
    expected: -50
  - id: stirlings1-4-2
    expr: [StirlingS1, 4, 2]
    expected: 11
  - id: s-n-n-is-always-1
    expr: [StirlingS1, 3, 3]
    expected: 1
    caption: s(n, n) is always 1
  - id: s-n-0-is-0-for-n-0
    expr: [StirlingS1, 5, 0]
    expected: 0
    caption: s(n, 0) is 0 for n > 0
  - id: the-unsigned-values-in-a-row-sum-to-n
    expr: [Equal, [Sum, [Abs, [StirlingS1, 4, k]], [Tuple, k, 0, 4]], [Factorial, 4]]
    expected: True
    category: Properties
    caption: The unsigned values in a row sum to $n!$
  - id: the-number-of-permutations-of-5-elements-with
    expr: [StirlingS1, 5, 3]
    expected: 35
    category: Applications
    caption: The number of permutations of 5 elements with exactly 3 cycles is $|s(5, 3)| = 35$
  - id: the-empty-case-s-0-0-1-by-convention-distinct
    expr: [StirlingS1, 0, 0]
    expected: 1
    category: Possible issues
    caption: The empty case $s(0, 0) = 1$ by convention, distinct from $s(n, 0) = 0$ for $n > 0$
  - id: s-n-1-1-n-1-n-1-so-s-10-1-9
    expr: [StirlingS1, 10, 1]
    expected: -362880
    category: Neat examples
    caption: $s(n, 1) = (-1)^{n-1}(n-1)!$, so $s(10, 1) = -9!$
  - id: threads-element-wise-over-a-list-as-wolfram-s
    expr: [StirlingS1, [List, 2, 4, 6], 2]
    expected: [List, 1, 11, 274]
    category: Scope
    caption: Threads element-wise over a list, as Wolfram's Listable heads do
  - id: stirlings1-20-10
    expr: [StirlingS1, 20, 10]
    expected: 381922055502195
  - id: exact-for-large-n
    expr: [StirlingS1, 50, 2]
    expected: { num: "27246193725912647616517114941876245307260051542398468096e+8" }
    category: Scope
    caption: Exact for large n
  - id: the-signed-row-sum-vanishes-for-n-ge-2
    expr: [Sum, [StirlingS1, 6, k], [Tuple, k, 0, 6]]
    expected: 0
    category: Properties
    caption: The signed row sum vanishes for $n \ge 2$
  - id: s-n-n-1-binom-n-2
    expr: [Equal, [StirlingS1, 6, 5], [Negate, [Binomial, 6, 2]]]
    expected: True
    category: Properties
    caption: $s(n, n-1) = -\binom{n}{2}$
  - id: the-generating-property-sum-k-s-n-k-x-k-x-x-1-x
    expr:
      [
        Equal,
        [Sum, [Multiply, [StirlingS1, 4, k], [Power, x, k]], [Tuple, k, 0, 4]],
        [Expand, [Multiply, x, [Subtract, x, 1], [Subtract, x, 2], [Subtract, x, 3]]],
      ]
    expected: True
    category: Properties
    caption: 'The generating property: $\sum_k s(n, k)\,x^k = x(x-1)\cdots(x-n+1)$'
  - id: k-n-is-0
    expr: [StirlingS1, 5, 6]
    expected: 0
    category: Possible issues
    caption: $k > n$ is 0
seeAlso:
  - Binomial
  - Stirling
