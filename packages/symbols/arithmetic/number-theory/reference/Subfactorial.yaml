name: Subfactorial
domain: Combinatorics
signature: Subfactorial(n)
summary: 'The number of derangements of n objects: permutations that leave no element in its original position.'
signatures:
  - call: Subfactorial(n)
    description: the number of derangements $D_n$ of n objects.
details:
  - Closed form $D_n = n! \sum_{k=0}^{n} \frac{(-1)^k}{k!}$, so $D_n$ is n! divided by e and rounded to the nearest integer.
  - 'Recurrence: $D_n = n\,D_{n-1} + (-1)^n$, with $D_0 = 1$.'
  - Also satisfies the two-term recurrence $D_{n+1} = n\,(D_n + D_{n-1})$.
  - 'The classic hat-check problem: $D_n$ counts the ways n people can have their hats returned so nobody gets their own.'
  - compute-engine leaves negative arguments unevaluated rather than extending Subfactorial analytically.
examples:
  - id: subfactorial-0
    expr: [Subfactorial, 0]
    expected: 1
  - id: a-single-object-can-t-be-deranged
    expr: [Subfactorial, 1]
    expected: 0
    caption: A single object can't be deranged
  - id: subfactorial-4
    expr: [Subfactorial, 4]
    expected: 9
  - id: subfactorial-5
    expr: [Subfactorial, 5]
    expected: 44
  - id: recurrence-d-n-n-d-n-1-1-n
    expr: [Equal, [Subfactorial, 4], [Add, [Multiply, 4, [Subfactorial, 3]], [Power, -1, 4]]]
    expected: True
    category: Properties
    caption: 'Recurrence: $D_n = n D_{n-1} + (-1)^n$'
  - id: the-hat-check-problem-the-number-of-ways-6
    expr: [Subfactorial, 6]
    expected: 265
    category: Applications
    caption: 'The hat-check problem: the number of ways 6 people can have their hats returned so nobody gets their own'
  - id: a-negative-argument-is-left-unevaluated
    expr: [Subfactorial, -1]
    expected: [Subfactorial, -1]
    category: Possible issues
    caption: A negative argument is left unevaluated
  - id: threads-element-wise-over-a-list-as-wolfram-s
    expr: [Subfactorial, [List, 1, 2, 3, 4]]
    expected: [List, 0, 1, 2, 9]
    category: Scope
    caption: Threads element-wise over a list, as Wolfram's Listable heads do
  - id: subfactorial-20
    expr: [Subfactorial, 20]
    expected: {num: '895014631192902121'}
  - id: exact-for-large-n
    expr: [Subfactorial, 48]
    expected: {num: '4566824330931624695767452273778667071025042534230906772538913'}
    category: Scope
    caption: Exact for large n
  - id: real-arguments-evaluate-as-frac-gamma-n-1-1-e
    expr: [Subfactorial, 4.5]
    expected: [Complex, 19.255831840742534, 0.15717912296461525]
    category: Scope
    caption: Real arguments evaluate as $\frac{\Gamma(n+1, -1)}{e}$ (complex off the integers)
  - id: complex-arguments-evaluate-as-frac-gamma-n-1-1-e
    expr: [Subfactorial, [Complex, 1.6, 1]]
    expected: [Complex, 0.2968304581777118, 0.2842085472519699]
    category: Scope
    caption: Complex arguments evaluate as $\frac{\Gamma(n+1, -1)}{e}$ too
  - id: threads-over-a-matrix-element-wise
    expr: [Subfactorial, [List, [List, 2, 0], [List, 0, 2]]]
    expected: [List, [List, 1, 1], [List, 1, 1]]
    category: Scope
    caption: Threads over a matrix element-wise
  - id: d-n-is-frac-n-e-rounded-to-the-nearest-integer
    expr: [Equal, [Subfactorial, 10], [Round, [Divide, [Factorial, 10], ExponentialE]]]
    expected: True
    category: Properties
    caption: $D_n$ is $\frac{n!}{e}$ rounded to the nearest integer
  - id: two-term-recurrence-d-n-1-n-d-n-d-n-1
    expr: [Equal, [Subfactorial, 6], [Multiply, 5, [Add, [Subfactorial, 5], [Subfactorial, 4]]]]
    expected: True
    category: Properties
    caption: 'Two-term recurrence: $D_{n+1} = n\,(D_n + D_{n-1})$'
seeAlso:
  - Factorial
