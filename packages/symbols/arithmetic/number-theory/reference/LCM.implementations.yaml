1-3i-i-3-i-associates-share-their-multiples:
  epsil:
    in: LCM(3 + i, -1 + 3i)
    out: 3 + i
  tex:
    in: \operatorname{lcm}(3+i, -1+3i)
    out: 3+i
  fullform:
    in: LCM[Complex[3, 1], Complex[-1, 3]]
  wolfram:
    in: LCM[Complex[3, 1], Complex[-1, 3]]
    out: 3 + I
    tex:
      in: \text{lcm}(3+i,-1+3 i)
      out: 3+i
  sympy:
    in: lcm((3 + 1*I), (-1 + 3*I))
    out: -1 + 3*I
    verdict: disagree
    kind: convention
    note: Gaussian lcm is defined up to a unit; SymPy picks a different associate.
  sage:
    in: lcm((3 + 1*I), (-1 + 3*I))
    out: "1"
    verdict: inconclusive
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so LCM over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
  oscar:
    in: lcm(ZZ(complex(3, 1)), ZZ(complex(-1, 3)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to the Oscar mapping as a complex number in the Complex{Int} type, not an element of ℤ[i], so LCM over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
  julia:
    in: lcm(ZZ(complex(3, 1)), ZZ(complex(-1, 3)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to the Julia (Nemo) mapping as a complex number in the Complex{Int} type, not an element of ℤ[i], so LCM over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
