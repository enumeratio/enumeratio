    out: \bigl\lbrack12, 84, 120\bigr\rbrack
  fullform:
    in: LCM[12, List[3, 7, 40]]
  wolfram:
    in: LCM[12, List[3, 7, 40]]
  sympy:
    in: "[lcm(12, 3), lcm(12, 7), lcm(12, 40)]"
    out: "[12, 84, 120]"
  sage:
    in: "[lcm(12, 3), lcm(12, 7), lcm(12, 40)]"
    out: "[12, 84, 120]"
  oscar:
    in: lcm(ZZ(12), ZZ([3, 7, 40]))
    out: "MethodError: no method matching (::ZZRing)(::Vector{Int64}) The object of type `ZZRing` exists, but "
    verdict: error
    kind: threading
    note: compute-engine's LCM is Listable and threads over the list; Oscar's lcm takes scalars only.
  julia:
    in: "[lcm(ZZ(12), ZZ(3)), lcm(ZZ(12), ZZ(7)), lcm(ZZ(12), ZZ(40))]"
    out: "[12, 84, 120]"
  mathlib4:
    in: (Int.lcm 12 [3, 7, 40])
    out: "Application type mismatch: The argument"
    verdict: error
    kind: threading
    note: compute-engine's LCM is Listable and threads over the list; Mathlib's Int.lcm takes scalars only.
  rust:
    in: lcm(n(12), list(vec![n(3), n(7), n(40)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's LCM is Listable and threads over the list; the Rust crates take scalars only.
a-large-integer-against-a-negative-rational:
  epsil:
    in: LCM(20!, 10 ^ -1 - 2)
    out: 2_432_902_008_176_640_000
  tex:
    in: \operatorname{lcm}(20!, \frac{1}{10}-2)
    out: 2\,432\,902\,008\,176\,640\,000
  fullform:
    in: LCM[Factorial[20], Plus[Power[10, -1], -2]]
  wolfram:
    in: LCM[Factorial[20], Plus[Power[10, -1], -2]]
  sympy:
    in: lcm(factorial(20), ((S(10)**-1) + -2))
    out: "2432902008176640000"
  sage:
    in: lcm(factorial(20), (((10)^-1) + -2))
    out: "2432902008176640000"
  oscar:
    in: lcm(ZZ(factorial(ZZ(20))), ZZ(((big(10)^-1) + -2)))
    out: "InexactError: BigInt(-1.8999999999999999999999999999999999999999999999999999999999999999999999999999"
    verdict: error
    kind: domain
    note: compute-engine extends LCM to rationals here, giving lcm(20!, 19)/gcd(1, 10) = 20!; Oscar's ZZ conversion only accepts integers, so the rational operand is a domain gap in the mapping, not a bug on either side.
  julia:
    in: lcm(ZZ(factorial(ZZ(20))), ZZ(((big(10)^-1) + -2)))
    out: "InexactError: BigInt(-1.8999999999999999999999999999999999999999999999999999999999999999999999999999"
    verdict: error
    kind: domain
    note: compute-engine extends LCM to rationals (here 20!/1 and -19/10, giving lcm(20!, 19)/gcd(1, 10) = 20! since 19 | 20!); Nemo's ZZ conversion only accepts integers, so the rational operand is a domain gap in the mapping, not a bug on either side.
  mathlib4:
    in: (Int.lcm (Nat.factorial 20) ((10 ^ (-1)) + (-2)))
    out: failed to synthesize instance of type class
    verdict: error
    kind: domain
    note: compute-engine extends LCM to rationals here (20!/1 and -19/10, giving lcm(20!, 19)/gcd(1, 10) = 20! since 19 | 20!); Mathlib's Int.lcm accepts integers only, so the rational operand is a domain gap in the mapping.
  rust:
    in: lcm(factorial(n(20)), (power(n(10), n(-1)) + n(-2)))
    out: "panic: an integer, not 2.43290200817664e18"
    verdict: error
    kind: domain
    note: compute-engine extends LCM to rationals (here 20!/1 and -19/10, giving lcm(20!, 19)/gcd(1, 10) = 20! since 19 | 20!); the harness's `n()` wrapper only accepts integers, so the rational operand is a domain gap in the mapping, not a bug on either side (same gap as the Julia/Nemo row above).
