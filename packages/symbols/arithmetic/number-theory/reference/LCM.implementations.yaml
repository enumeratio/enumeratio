gcd-a-b-cdot-lcm-a-b-ab-see-gcd:
  epsil:
    in: GCD(27, 81) * LCM(27, 81) == 27 * 81
    out: True
  tex:
    in: \gcd(27, 81)\operatorname{lcm}(27, 81)=27\times81
    out: \top
  traditional:
    in: \gcd(27, 81)\operatorname{lcm}(27, 81)=27\times81
    out: \mathrm{True}
  fullform:
    in: Equal[Times[GCD[27, 81], LCM[27, 81]], Times[27, 81]]
  wolfram:
    in: (Times[GCD[27, 81], LCM[27, 81]] == Times[27, 81])
    out: True
    tex:
      in: \gcd (27,81) \text{lcm}(27,81)=27\ 81
      out: \text{True}
  sympy:
    in: enumeratio_equal((gcd(27, 81) * lcm(27, 81)), (27 * 81))
    out: True
  sage:
    in: bool((gcd(27, 81) * lcm(27, 81)) == (27 * 81))
    out: True
  oscar:
    in: ((gcd(ZZ(27), ZZ(81)) * lcm(ZZ(27), ZZ(81))) == (27 * 81))
    out: "true"
  julia:
    in: ((gcd(ZZ(27), ZZ(81)) * lcm(ZZ(27), ZZ(81))) == (27 * 81))
    out: "true"
  mathlib4:
    in: (decide (((Int.gcd 27 81) * (Int.lcm 27 81)) = (27 * 81)))
    out: "true"
  rust:
    in: equal((gcd(n(27), n(81)) * lcm(n(27), n(81))), (n(27) * n(81)))
    out: "true"
