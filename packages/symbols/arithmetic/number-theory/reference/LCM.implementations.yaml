gaussian-primes-of-norm-41-and-13-the-lcm-is-the:
  epsil:
    in: LCM(-4 + 5i, 2 + 3i)
    out: 23 + 2i
  tex:
    in: \operatorname{lcm}(-4+5i, 2+3i)
    out: 23+2i
  fullform:
    in: LCM[Complex[-4, 5], Complex[2, 3]]
  wolfram:
    in: LCM[Complex[-4, 5], Complex[2, 3]]
  sympy:
    in: lcm((-4 + 5*I), (2 + 3*I))
    out: -23 - 2*I
    verdict: disagree
    kind: convention
    note: A Gaussian LCM is defined up to a unit; compute-engine normalises it into the first quadrant, as Wolfram does, and SymPy doesn't.
  sage:
    in: lcm((-4 + 5*I), (2 + 3*I))
    out: "1"
    verdict: inconclusive
    kind: domain
    note: compute-engine computes the Gaussian lcm directly; Sage's lcm() doesn't understand Gaussian integers and falls back to the trivial answer 1 in the Symbolic Ring.
  oscar:
    in: lcm(ZZ(complex(-4, 5)), ZZ(complex(2, 3)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: Oscar's ZZ wrapper is rational integers only, no Gaussian integers; compute-engine computes the Gaussian lcm directly.
  julia:
    in: lcm(ZZ(complex(-4, 5)), ZZ(complex(2, 3)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: Nemo's ZZ is rational integers only, no Gaussian integers; ours computes the Gaussian lcm directly.
