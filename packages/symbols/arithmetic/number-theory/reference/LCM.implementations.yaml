lcm-4-6:
  wolfram:
    in: LCM[4, 6]
    out: "12"
    tex:
      in: \text{lcm}(4,6)
      out: "12"
  sage:
    in: lcm(4, 6)
    out: "12"
  julia:
    in: lcm(ZZ(4), ZZ(6))
    out: "12"
  oscar:
    in: lcm(ZZ(4), ZZ(6))
    out: "12"
  mathlib4:
    in: (Int.lcm 4 6)
    out: "12"
  rust:
    in: lcm(n(4), n(6))
    out: "12"
  sympy:
    in: lcm(4, 6)
    out: "12"
lcm-is-variadic-it-accepts-any-number-of:
