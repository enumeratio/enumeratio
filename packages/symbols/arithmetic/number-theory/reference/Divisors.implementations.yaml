the-divisor-count-d-n-equals-sigma-0-n-see:
  wolfram:
    in: (Length[Divisors[20]] == DivisorSigma[0, 20])
    out: True
    tex:
      in: \text{Length}[\text{Divisors}[20]]=\sigma _0(20)
      out: \text{True}
threads-element-wise-over-a-list-as-wolfram-s:
  wolfram:
    in: Divisors[List[4, 6]]
    out: "{{1, 2, 4}, {1, 2, 3, 6}}"
    tex:
      in: \text{Divisors}[\{4,6\}]
      out: \{\{1,2,4\},\{1,2,3,6\}\}
divisors-3-plus-4i:
  wolfram:
    in: Divisors[Complex[3, 4]]
    out: "{1, 2 + I, 3 + 4*I}"
    tex:
      in: \text{Divisors}[3+4 i]
      out: \{1,2+i,3+4 i\}
  sage:
    in: divisors((3 + 4*I))
    out: "[-4*I - 3, 2*I - 1, 1]"
    verdict: disagree
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so Divisors over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
