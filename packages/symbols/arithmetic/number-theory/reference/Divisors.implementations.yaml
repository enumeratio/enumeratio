the-divisor-count-d-n-equals-sigma-0-n-see:
  epsil:
    in: Length(Divisors(20)) == DivisorSigma(0, 20)
    out: True
  tex:
    in: \mathrm{Length}(\mathrm{Divisors}(20))=\mathrm{DivisorSigma}(0, 20)
    out: \top
  traditional:
    in: \mathrm{Length}(\mathrm{Divisors}(20))=\sigma_{0}(20)
    out: \mathrm{True}
  fullform:
    in: Equal[Length[Divisors[20]], DivisorSigma[0, 20]]
  wolfram:
    in: (Length[Divisors[20]] == DivisorSigma[0, 20])
    out: True
    tex:
      in: \text{Length}[\text{Divisors}[20]]=\sigma _0(20)
      out: \text{True}
threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: Divisors([4, 6])
    out: "[[1, 2, 4], [1, 2, 3, 6]]"
  tex:
    in: \mathrm{Divisors}(\bigl\lbrack4, 6\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack1, 2, 4\bigr\rbrack, \bigl\lbrack1, 2, 3, 6\bigr\rbrack\bigr\rbrack
  fullform:
    in: Divisors[List[4, 6]]
  wolfram:
    in: Divisors[List[4, 6]]
    out: "{{1, 2, 4}, {1, 2, 3, 6}}"
    tex:
      in: \text{Divisors}[\{4,6\}]
      out: \{\{1,2,4\},\{1,2,3,6\}\}
  sage:
    in: divisors([4, 6])
divisors-3-plus-4i:
  epsil:
    in: Divisors(3 + 4i)
    out: "[1, 2 + i, 3 + 4i]"
  tex:
    in: \mathrm{Divisors}(3+4i)
    out: \bigl\lbrack1, 2+i, 3+4i\bigr\rbrack
  fullform:
    in: Divisors[Complex[3, 4]]
  wolfram:
    in: Divisors[Complex[3, 4]]
    out: "{1, 2 + I, 3 + 4*I}"
    tex:
      in: \text{Divisors}[3+4 i]
      out: \{1,2+i,3+4 i\}
  sage:
    in: divisors((3 + 4*I))
    out: "[-4*I - 3, 2*I - 1, 1]"
    verdict: disagree
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so Divisors over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
13-2-3i-3-2i-splits-so-it-gains-two-divisors:
  epsil:
    in: Divisors(13, GaussianIntegers -> True)
    out: "[1, 2 + 3i, 3 + 2i, 13]"
  tex:
    in: \mathrm{Divisors}(13, \mathrm{KeyValuePair}(\mathrm{GaussianIntegers}, \top))
    out: \bigl\lbrack1, 2+3i, 3+2i, 13\bigr\rbrack
  traditional:
    in: \mathrm{Divisors}(13, \mathrm{KeyValuePair}(\mathrm{GaussianIntegers}, \mathrm{True}))
    out: \bigl\lbrack1, 2+3i, 3+2i, 13\bigr\rbrack
  fullform:
    in: Divisors[13, KeyValuePair[GaussianIntegers, True]]
