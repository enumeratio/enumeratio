divisors-1-729:
  wolfram:
    in: Divisors[1729]
    out: "{1, 7, 13, 19, 91, 133, 247, 1729}"
    tex:
      in: \text{Divisors}[1729]
      out: \{1,7,13,19,91,133,247,1729\}
  sage:
    in: divisors(1729)
    out: "[1, 7, 13, 19, 91, 133, 247, 1729]"
divisors-20:
