s-n-1-1-n-1-n-1-so-s-10-1-9:
  wolfram:
    in: StirlingS1[10, 1]
    out: "-362880"
    tex:
      in: S_{10}^{(1)}
      out: "-362880"
  sage:
    in: stirling_number1(10, 1)
    out: "362880"
    verdict: disagree
    kind: convention
    note: "Same unsigned-vs-signed convention: s(10,1) = -362880 here, Sage's unsigned stirling_number1 gives 362880."
  julia:
    in: Combinatorics.stirlings1(10, 1)
    out: "362880"
    verdict: disagree
    kind: convention
    note: Combinatorics.jl's stirlings1 is the unsigned Stirling number of the first kind; compute-engine's StirlingS1 is signed, as in Wolfram.
  mathlib4:
    in: (Nat.stirlingFirst 10 1)
    out: "362880"
    verdict: disagree
    kind: convention
    note: Mathlib's Nat.stirlingFirst is the unsigned Stirling number of the first kind; compute-engine's StirlingS1 is signed, as in Wolfram.
threads-element-wise-over-a-list-as-wolfram-s:
