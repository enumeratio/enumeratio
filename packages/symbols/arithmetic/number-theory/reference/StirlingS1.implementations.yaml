the-unsigned-values-in-a-row-sum-to-n:
  epsil:
    in: Sum(Abs(StirlingS1(4, k)), (k, 0, 4)) == 4!
    out: True
  tex:
    in: \sum_{k=0}^4\vert\mathrm{StirlingS1}(4, k)\vert=4!
    out: \top
  traditional:
    in: \sum_{k=0}^4\vert s(4, k)\vert=4!
    out: \mathrm{True}
  fullform:
    in: Equal[Sum[Abs[StirlingS1[4, k]], List[k, 0, 4]], Factorial[4]]
  wolfram:
    in: (Sum[Abs[StirlingS1[4, k]], List[k, 0, 4]] == Factorial[4])
    out: True
    tex:
      in: \sum _{k=0}^4 \left| S_4^{(k)}\right| =4!
      out: \text{True}
