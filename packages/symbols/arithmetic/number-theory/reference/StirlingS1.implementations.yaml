exact-for-large-n:
  epsil:
    in: StirlingS1(50, 2)
    out: 2_724_619_372_591_264_761_651_711_494_187_624_530_726_005_154_239_846_809_600_000_000
  tex:
    in: \mathrm{StirlingS1}(50, 2)
    out: 2\,724\,619\,372\,591\,264\,761\,651\,711\,494\,187\,624\,530\,726\,005\,154\,239\,846\,809\,600\,000\,000
  traditional:
    in: s(50, 2)
    out: 2\,724\,619\,372\,591\,264\,761\,651\,711\,494\,187\,624\,530\,726\,005\,154\,239\,846\,809\,600\,000\,000
  fullform:
    in: StirlingS1[50, 2]
  wolfram:
    in: StirlingS1[50, 2]
  sage:
    in: stirling_number1(50, 2)
  mathlib4:
    in: (Nat.stirlingFirst 50 2)
  julia:
    in: Combinatorics.stirlings1(50, 2)
    out: "OverflowError: 21 is too large to look up in the table; consider using `factorial(big(21))` instead"
    verdict: error
    kind: domain
    note: Combinatorics.jl computes StirlingS1 in Int64, which overflows here; compute-engine is exact.
