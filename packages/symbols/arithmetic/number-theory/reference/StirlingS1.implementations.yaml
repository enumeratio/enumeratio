s-n-n-1-binom-n-2:
  epsil:
    in: StirlingS1(6, 5) == -Binomial(6, 2)
    out: True
  tex:
    in: \mathrm{StirlingS1}(6, 5)=-\binom{6}{2}
    out: \top
  traditional:
    in: s(6, 5)=-\binom{6}{2}
    out: \mathrm{True}
  fullform:
    in: Equal[StirlingS1[6, 5], Minus[Binomial[6, 2]]]
  wolfram:
    in: (StirlingS1[6, 5] == Minus[Binomial[6, 2]])
  sage:
    in: bool(stirling_number1(6, 5) == (-binomial(6, 2)))
  julia:
    in: (Combinatorics.stirlings1(big(6), 5) == (-(binomial(ZZ(6), ZZ(2)))))
    out: "false"
    verdict: disagree
    kind: convention
    note: Combinatorics.jl's stirlings1 is the unsigned Stirling number of the first kind; compute-engine's StirlingS1 is signed, as in Wolfram.
  mathlib4:
    in: (decide ((Nat.stirlingFirst 6 5) = (-((Nat.choose 6 2)))))
the-generating-property-sum-k-s-n-k-x-k-x-x-1-x:
  epsil:
    in: |-
      Sum(StirlingS1(4, k) * x ^ k, (k, 0, 4)) == Expand(x * (x - 1) * (x - 2) * (x -
                                                                                  3))
    out: True
    back:
      [
        Equal,
        [Sum, [Multiply, [StirlingS1, 4, k], [Power, x, k]], [Tuple, k, 0, 4]],
        [Expand, [Multiply, [Multiply, [Multiply, x, [Subtract, x, 1]], [Subtract, x, 2]], [Subtract, x, 3]]],
      ]
  tex:
    in: \sum_{k=0}^4\mathrm{StirlingS1}(4, k)x^{k}=\mathrm{Expand}(x\times(x-1)(x-2)(x-3))
    out: \top
  traditional:
    in: \sum_{k=0}^4s(4, k)x^{k}=\mathrm{Expand}(x\times(x-1)(x-2)(x-3))
    out: \mathrm{True}
  fullform:
    in: Equal[Sum[Times[StirlingS1[4, k], Power[x, k]], List[k, 0, 4]], Expand[Times[x, Subtract[x, 1], Subtract[x, 2], Subtract[x, 3]]]]
