the-unsigned-values-in-a-row-sum-to-n:
  wolfram:
    in: (Sum[Abs[StirlingS1[4, k]], List[k, 0, 4]] == Factorial[4])
    out: True
    tex:
      in: \sum _{k=0}^4 \left| S_4^{(k)}\right| =4!
      out: \text{True}
