threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: StirlingS1([2, 4, 6], 2)
    out: "[1, 11, 274]"
  tex:
    in: \mathrm{StirlingS1}(\bigl\lbrack2, 4, 6\bigr\rbrack, 2)
    out: \bigl\lbrack1, 11, 274\bigr\rbrack
  fullform:
    in: StirlingS1[List[2, 4, 6], 2]
  wolfram:
    in: StirlingS1[List[2, 4, 6], 2]
    out: "{1, 11, 274}"
    tex:
      in: S_{\{2,4,6\}}^{(2)}
      out: \{1,11,274\}
  sage:
    in: stirling_number1([2, 4, 6], 2)
  mathlib4:
    in: (Nat.stirlingFirst [2, 4, 6] 2)
  julia:
    in: Combinatorics.stirlings1([2, 4, 6], 2)
    out: "MethodError: no method matching stirlings1(::Vector{Int64}, ::Int64) The function `stirlings1` exist"
    verdict: error
    kind: threading
    note: compute-engine's StirlingS1 is Listable and threads over the list; Nemo/Combinatorics.jl takes scalars only.
