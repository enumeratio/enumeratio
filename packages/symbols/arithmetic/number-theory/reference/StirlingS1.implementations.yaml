stirlings1-5-2:
  epsil:
    in: StirlingS1(5, 2)
    out: "-50"
  tex:
    in: \mathrm{StirlingS1}(5, 2)
    out: "-50"
  traditional:
    in: s(5, 2)
    out: "-50"
  fullform:
    in: StirlingS1[5, 2]
  wolfram:
    in: StirlingS1[5, 2]
    out: "-50"
    tex:
      in: S_5^{(2)}
      out: "-50"
  sage:
    in: stirling_number1(5, 2)
    out: "50"
    verdict: disagree
    kind: convention
    note: Signed here (s(5,2) = -50); Sage's stirling_number1 is unsigned by definition and returns 50 -- documented in mappings.ts, not a bug.
  julia:
    in: Combinatorics.stirlings1(big(5), 2)
    out: "50"
    verdict: disagree
    kind: convention
    note: Combinatorics.jl's stirlings1 is the unsigned Stirling number of the first kind; compute-engine's StirlingS1 is signed, as in Wolfram.
  mathlib4:
    in: (Nat.stirlingFirst 5 2)
    out: "50"
    verdict: disagree
    kind: convention
    note: Mathlib's Nat.stirlingFirst is the unsigned Stirling number of the first kind; compute-engine's StirlingS1 is signed, as in Wolfram.
