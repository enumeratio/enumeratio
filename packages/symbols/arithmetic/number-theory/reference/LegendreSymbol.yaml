name: LegendreSymbol
domain: Number theory
signature: LegendreSymbol(n, p)
summary: "The Legendre symbol (n/p): whether n is a quadratic residue mod the odd prime p."
signatures:
  - call: LegendreSymbol(n, p)
    description: the Legendre symbol $\left(\frac{n}{p}\right)$.
details:
  - 1 if $n$ is a nonzero quadratic residue mod $p$, $-1$ if it is a nonresidue, 0 if $p\mid n$.
  - Defined only for an odd prime $p$; compute-engine leaves the call symbolic for any other $p$.
  - The prime case of [[JacobiSymbol]] and [[KroneckerSymbol]] — all three agree wherever the domains overlap.
examples:
  - id: 2-is-a-quadratic-residue-mod-7-32-2-mod-7
    expr: [LegendreSymbol, 2, 7]
    expected: 1
    caption: "2 is a quadratic residue mod 7: 3² ≡ 2 (mod 7)"
  - id: 3-is-not-a-quadratic-residue-mod-7
    expr: [LegendreSymbol, 3, 7]
    expected: -1
    caption: 3 is not a quadratic residue mod 7
  - id: 0-when-p-divides-n
    expr: [LegendreSymbol, 14, 7]
    expected: 0
    caption: 0 when p divides n
  - id: 1-is-a-residue-mod-p-exactly-when-p-equiv-1-pmod
    expr: [LegendreSymbol, -1, 13]
    expected: 1
    category: Properties
    caption: $-1$ is a residue mod $p$ exactly when $p\equiv1\pmod4$
  - id: euler-s-criterion-a-p-equiv-a-p-1-2-pmod-p-here
    expr: [Equal, [LegendreSymbol, 3, 7], [Subtract, [PowerMod, 3, 3, 7], 7]]
    expected: True
    category: Properties
    caption: "Euler's criterion: $(a/p)\\equiv a^{(p-1)/2}\\pmod p$, here $3^3\\equiv6\\equiv-1$. See [[PowerMod]]"
  - id: listable-in-n-the-residues-mod-7-are-1-2-4
    expr: [LegendreSymbol, [List, 1, 2, 3, 4, 5, 6], 7]
    expected: [List, 1, 1, -1, 1, -1, -1]
    category: Scope
    caption: "Listable in $n$: the residues mod 7 are 1, 2, 4"
  - id: 9-is-not-prime-so-the-call-stays-symbolic-see
    expr: [LegendreSymbol, 2, 9]
    expected: [LegendreSymbol, 2, 9]
    category: Possible issues
    caption: 9 is not prime, so the call stays symbolic; see [[JacobiSymbol]]
seeAlso:
  - JacobiSymbol
  - KroneckerSymbol
