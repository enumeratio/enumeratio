l-n-2-5f-n-2-4-1-n-here-at-n-10-see-fibonacci:
  epsil:
    in: LucasL(10) ^ 2 - 5 * Fibonacci(10) ^ 2
    out: "4"
  tex:
    in: \mathrm{LucasL}(10)^2-5\mathrm{Fibonacci}(10)^2
    out: "4"
  traditional:
    in: L_{10}^2-5F_{10}^2
    out: "4"
  fullform:
    in: Subtract[Power[LucasL[10], 2], Times[5, Power[Fibonacci[10], 2]]]
  wolfram:
    in: Subtract[Power[LucasL[10], 2], Times[5, Power[Fibonacci[10], 2]]]
  sympy:
    in: (((lucas(10))**2) - (5 * ((fibonacci(10))**2)))
    out: "4"
  sage:
    in: (((lucas_number2(10, 1, -1))^2) - (5 * ((fibonacci(10))^2)))
  julia:
    in: ((big(Combinatorics.lucasnum(10))^2) - (5 * (big(BigInt(fibonacci(ZZ(10))))^2)))
    out: "4"
l-n-f-n-1-f-n-1-here-at-n-6:
  epsil:
    in: LucasL(6) == Fibonacci(5) + Fibonacci(7)
    out: True
  tex:
    in: \mathrm{LucasL}(6)=\mathrm{Fibonacci}(5)+\mathrm{Fibonacci}(7)
    out: \top
  traditional:
    in: L_{6}=F_{5}+F_{7}
    out: \mathrm{True}
  fullform:
    in: Equal[LucasL[6], Plus[Fibonacci[5], Fibonacci[7]]]
  wolfram:
    in: (LucasL[6] == Plus[Fibonacci[5], Fibonacci[7]])
    out: True
    tex:
      in: L_6=F_5+F_7
      out: \text{True}
  sympy:
    in: enumeratio_equal(lucas(6), (fibonacci(5) + fibonacci(7)))
    out: True
  sage:
    in: bool(lucas_number2(6, 1, -1) == (fibonacci(5) + fibonacci(7)))
    out: True
  julia:
    in: (Combinatorics.lucasnum(6) == (BigInt(fibonacci(ZZ(5))) + BigInt(fibonacci(ZZ(7)))))
    out: "true"
conversely-f-n-frac-l-n-1-l-n-1-5:
  epsil:
    in: Fibonacci(6) == (LucasL(5) + LucasL(7)) / 5
    out: True
  tex:
    in: \mathrm{Fibonacci}(6)=\frac{\mathrm{LucasL}(5)+\mathrm{LucasL}(7)}{5}
    out: \top
  traditional:
    in: F_{6}=\frac{L_{5}+L_{7}}{5}
    out: \mathrm{True}
  fullform:
    in: Equal[Fibonacci[6], Divide[Plus[LucasL[5], LucasL[7]], 5]]
  wolfram:
    in: (Fibonacci[6] == Divide[Plus[LucasL[5], LucasL[7]], 5])
    out: True
    tex:
      in: F_6=\frac{L_5+L_7}{5}
      out: \text{True}
  sympy:
    in: enumeratio_equal(fibonacci(6), (S((lucas(5) + lucas(7))) / 5))
    out: True
  sage:
    in: bool(fibonacci(6) == ((lucas_number2(5, 1, -1) + lucas_number2(7, 1, -1)) / 5))
    out: True
  julia:
    in: (BigInt(fibonacci(ZZ(6))) == ((Combinatorics.lucasnum(5) + Combinatorics.lucasnum(7)) // 5))
    out: "true"
a-cassini-style-identity-l-n-1-l-n-1-l-n-2-5-1-n:
  epsil:
    in: LucasL(4) * LucasL(6) - LucasL(5) ^ 2
    out: "5"
  tex:
    in: \mathrm{LucasL}(4)\mathrm{LucasL}(6)-\mathrm{LucasL}(5)^2
    out: "5"
  traditional:
    in: L_{4}L_{6}-L_{5}^2
    out: "5"
  fullform:
    in: Subtract[Times[LucasL[4], LucasL[6]], Power[LucasL[5], 2]]
  wolfram:
    in: Subtract[Times[LucasL[4], LucasL[6]], Power[LucasL[5], 2]]
    out: "5"
    tex:
      in: L_4 L_6-\left(L_5\right){}^2
      out: "5"
  sympy:
    in: ((lucas(4) * lucas(6)) - ((lucas(5))**2))
    out: "5"
  sage:
    in: ((lucas_number2(4, 1, -1) * lucas_number2(6, 1, -1)) - ((lucas_number2(5, 1, -1))^2))
    out: "5"
  julia:
    in: ((Combinatorics.lucasnum(4) * Combinatorics.lucasnum(6)) - (big(Combinatorics.lucasnum(5))^2))
    out: "5"
