  sympy:
    in: lucas(2.3333333333333335)
    out: lucas(2.33333333333333)
    verdict: inconclusive
    kind: domain
    note: SymPy's lucas takes an integer index only and leaves a real one symbolic; ours extends to real nu via the closed form in the caption.
