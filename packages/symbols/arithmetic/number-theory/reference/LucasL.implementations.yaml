    in: LucasL(15) / LucasL(14)
    out: 1_364 / 843
  tex:
    in: \frac{\mathrm{LucasL}(15)}{\mathrm{LucasL}(14)}
    out: \frac{1\,364}{843}
  traditional:
    in: \frac{L_{15}}{L_{14}}
    out: \frac{1\,364}{843}
  fullform:
    in: Divide[LucasL[15], LucasL[14]]
  wolfram:
    in: Divide[LucasL[15], LucasL[14]]
    out: 1364/843
    tex:
      in: \frac{L_{15}}{L_{14}}
      out: \frac{1364}{843}
  sympy:
    in: (S(lucas(15)) / lucas(14))
    out: 1364/843
