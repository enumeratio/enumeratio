an-odd-negative-index-flips-the-sign-l-11-l-11:
  epsil:
    in: LucasL(-11)
    out: "-199"
  tex:
    in: \mathrm{LucasL}(-11)
    out: "-199"
  traditional:
    in: L_{-11}
    out: "-199"
  fullform:
    in: LucasL[-11]
  wolfram:
    in: LucasL[-11]
  sympy:
    in: lucas(-11)
    out: "-199"
  sage:
    in: lucas_number2(-11, 1, -1)
  julia:
    in: Combinatorics.lucasnum(-11)
    out: "DomainError with -11: n must be nonnegative"
    verdict: error
    kind: domain
    note: Combinatorics.jl's lucasnum declines a negative index; ours extends via LucasL(-n) = (-1)^n LucasL(n).
a-real-index-uses-l-nu-varphi-nu-cos-pi-nu:
  epsil:
    in: LucasL(2.333_333_333_333_333_5)
    out: 3.236_211_879_491_621_3
  tex:
    in: \mathrm{LucasL}(2.333\,333\,333\,333\,333\,5)
    out: 3.236\,211\,879\,491\,621\,3
  traditional:
    in: L_{2.333\,333\,333\,333\,333\,5}
    out: 3.236\,211\,879\,491\,621\,3
  fullform:
    in: LucasL[2.3333333333333335]
  wolfram:
    in: LucasL[2.3333333333333335]
  sympy:
    in: lucas(2.3333333333333335)
    out: lucas(2.33333333333333)
    verdict: inconclusive
    kind: domain
    note: SymPy's lucas takes integers and stays symbolic; compute-engine continues L_ν to real ν.
  sage:
    in: lucas_number2(2.3333333333333335, 1, -1)
  julia:
    in: Combinatorics.lucasnum(2.3333333333333335)
    out: "MethodError: no method matching lucasnum(::Float64) The function `lucasnum` exists, but no method is"
    verdict: error
    kind: domain
    note: Combinatorics.jl's lucasnum is Int-only; ours extends LucasL to a real index ν through φ^ν and cos(πν), as with Fibonacci.
