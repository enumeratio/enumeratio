a-negative-argument-is-left-unevaluated:
  epsil:
    in: BellNumber(-1)
    out: BellNumber(-1)
  tex:
    in: \mathrm{BellNumber}(-1)
    out: \mathrm{BellNumber}(-1)
  traditional:
    in: B_{-1}
    out: B_{-1}
  fullform:
    in: BellB[-1]
  wolfram:
    in: BellB[-1]
    out: BellB[-1]
    tex:
      in: B_{-1}
      out: B_{-1}
  sympy:
    in: bell(-1)
    out: "ValueError: a non-negative integer expected"
    verdict: error
    kind: undefined-form
    note: "Both decline BellNumber here: compute-engine leaves it unevaluated, SymPy raises."
  sage:
    in: bell_number(-1)
    out: "ArithmeticError: Bell numbers not defined for negative indices"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["BellNumber", -1] and Sage raises an error.'
  oscar:
    in: bell(-1)
    out: "DomainError with -1: Argument must be non-negative"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["BellNumber", -1] and Oscar raises an error.'
  julia:
    in: bell(ZZ(-1))
    out: "DomainError with -1: Argument must be non-negative"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["BellNumber", -1] and Nemo/Combinatorics.jl raises an error.'
threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: BellNumber([1, 2, 3, 4])
    out: "[1, 2, 5, 15]"
  tex:
    in: \mathrm{BellNumber}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack)
    out: \bigl\lbrack1, 2, 5, 15\bigr\rbrack
  fullform:
    in: BellB[List[1, 2, 3, 4]]
  wolfram:
    in: BellB[List[1, 2, 3, 4]]
    out: "{1, 2, 5, 15}"
    tex:
      in: B_{\{1,2,3,4\}}
      out: \{1,2,5,15\}
  sympy:
    in: "[bell(1), bell(2), bell(3), bell(4)]"
    out: "[1, 2, 5, 15]"
  sage:
    in: "[bell_number(1), bell_number(2), bell_number(3), bell_number(4)]"
    out: "[1, 2, 5, 15]"
  oscar:
    in: bell([1, 2, 3, 4])
    out: "MethodError: no method matching bell(::Vector{Int64}) The function `bell` exists, but no method is d"
    verdict: error
    kind: threading
    note: compute-engine's BellNumber is Listable and threads over the list; Oscar's bare bell function takes scalars only.
  julia:
    in: "[bell(ZZ(1)), bell(ZZ(2)), bell(ZZ(3)), bell(ZZ(4))]"
    out: "[1, 2, 5, 15]"
