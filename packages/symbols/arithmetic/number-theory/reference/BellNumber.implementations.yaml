touchard-s-congruence-b-p-n-equiv-b-n-b-n-1-pmod:
  epsil:
    in: BellNumber(9) % 7 == (BellNumber(2) + BellNumber(3)) % 7
    out: True
  tex:
    in: \mathrm{BellNumber}(9)\bmod7=(\mathrm{BellNumber}(2)+\mathrm{BellNumber}(3))\bmod7
    out: \top
  traditional:
    in: B_{9}\bmod7=(B_{2}+B_{3})\bmod7
    out: \mathrm{True}
  fullform:
    in: Equal[Mod[BellB[9], 7], Mod[Plus[BellB[2], BellB[3]], 7]]
  wolfram:
    in: (Mod[BellB[9], 7] == Mod[Plus[BellB[2], BellB[3]], 7])
  sympy:
    in: enumeratio_equal((bell(9) % 7), ((bell(2) + bell(3)) % 7))
    out: True
  sage:
    in: bool((bell_number(9) % 7) == ((bell_number(2) + bell_number(3)) % 7))
    out: True
  oscar:
    in: (mod(bell(9), 7) == mod((bell(2) + bell(3)), 7))
    out: "true"
  julia:
    in: (mod(bell(ZZ(9)), 7) == mod((bell(ZZ(2)) + bell(ZZ(3))), 7))
    out: "true"
a-zero-modulus-inside-a-congruence-check-is-nan:
  epsil:
    in: BellNumber(9) % 23 == (BellNumber(4) + BellNumber(5)) % 0
    out: False
  tex:
    in: \mathrm{BellNumber}(9)\bmod23=(\mathrm{BellNumber}(4)+\mathrm{BellNumber}(5))\bmod0
    out: \bot
  traditional:
    in: B_{9}\bmod23=(B_{4}+B_{5})\bmod0
    out: \mathrm{False}
  fullform:
    in: Equal[Mod[BellB[9], 23], Mod[Plus[BellB[4], BellB[5]], 0]]
  wolfram:
    in: (Mod[BellB[9], 23] == Mod[Plus[BellB[4], BellB[5]], 0])
  sympy:
    in: enumeratio_equal((bell(9) % 23), ((bell(4) + bell(5)) % 0))
  sage:
    in: bool((bell_number(9) % 23) == ((bell_number(4) + bell_number(5)) % 0))
    out: "ZeroDivisionError: Integer modulo by zero"
    verdict: error
    kind: undefined-form
    note: "Both decline: compute-engine answers NaN for a zero modulus (see Mod), and Sage's % raises ZeroDivisionError: Integer modulo by zero; the same divergence as Mod's own zero-modulus example, reached here through a BellNumber congruence."
  oscar:
    in: (mod(bell(9), 23) == mod((bell(4) + bell(5)), 0))
    out: "DivideError: integer division error"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "NaN" for a zero modulus; Oscar''s mod raises the same DivideError as Julia''s, reached here through a BellNumber congruence.'
  julia:
    in: (mod(bell(ZZ(9)), 23) == mod((bell(ZZ(4)) + bell(ZZ(5))), 0))
    out: "DivideError: integer division error"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "NaN" for a zero modulus (see [[Mod]]), Julia''s mod raises DivideError -- same divergence as Mod''s own zero-modulus example, reached here through a BellNumber congruence.'
