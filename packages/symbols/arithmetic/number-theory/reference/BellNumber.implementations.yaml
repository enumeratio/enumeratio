recurrence-b-n-1-sum-k-0-n-binom-n-k-b-k-here-at:
  epsil:
    in: |-
      BellNumber(5) == Binomial(4, 0) * BellNumber(0) + Binomial(4, 1) * BellNumber(1) +
                       Binomial(4, 2) * BellNumber(2) + Binomial(4, 3) * BellNumber(3) + Binomial(4, 4) *
                                                           BellNumber(4)
    out: True
  tex:
    in: \mathrm{BellNumber}(5)=\binom{4}{0}\mathrm{BellNumber}(0)+\binom{4}{1}\mathrm{BellNumber}(1)+\binom{4}{2}\mathrm{BellNumber}(2)+\binom{4}{3}\mathrm{BellNumber}(3)+\binom{4}{4}\mathrm{BellNumber}(4)
    out: \top
  traditional:
    in: B_{5}=\binom{4}{0}B_{0}+\binom{4}{1}B_{1}+\binom{4}{2}B_{2}+\binom{4}{3}B_{3}+\binom{4}{4}B_{4}
    out: \mathrm{True}
  fullform:
    in: Equal[BellB[5], Plus[Times[Binomial[4, 0], BellB[0]], Times[Binomial[4, 1], BellB[1]], Times[Binomial[4, 2], BellB[2]], Times[Binomial[4, 3], BellB[3]], Times[Binomial[4, 4], BellB[4]]]]
  wolfram:
    in: (BellB[5] == Plus[Times[Binomial[4, 0], BellB[0]], Times[Binomial[4, 1], BellB[1]], Times[Binomial[4, 2], BellB[2]], Times[Binomial[4, 3], BellB[3]], Times[Binomial[4, 4], BellB[4]]])
    out: True
    tex:
      in: B_5=\binom{4}{0} B_0+\binom{4}{1} B_1+\binom{4}{2} B_2+\binom{4}{3} B_3+\binom{4}{4} B_4
      out: \text{True}
  sympy:
    in: enumeratio_equal(bell(5), ((binomial(4, 0) * bell(0)) + (binomial(4, 1) * bell(1)) + (binomial(4, 2) * bell(2)) + (binomial(4, 3) * bell(3)) + (binomial(4, 4) * bell(4))))
    out: True
  sage:
    in: bool(bell_number(5) == ((binomial(4, 0) * bell_number(0)) + (binomial(4, 1) * bell_number(1)) + (binomial(4, 2) * bell_number(2)) + (binomial(4, 3) * bell_number(3)) + (binomial(4, 4) * bell_number(4))))
    out: True
  oscar:
    in: (bell(5) == ((binomial(ZZ(4), ZZ(0)) * bell(0)) + (binomial(ZZ(4), ZZ(1)) * bell(1)) + (binomial(ZZ(4), ZZ(2)) * bell(2)) + (binomial(ZZ(4), ZZ(3)) * bell(3)) + (binomial(ZZ(4), ZZ(4)) * bell(4))))
    out: "true"
  julia:
    in: (bell(ZZ(5)) == ((binomial(ZZ(4), ZZ(0)) * bell(ZZ(0))) + (binomial(ZZ(4), ZZ(1)) * bell(ZZ(1))) + (binomial(ZZ(4), ZZ(2)) * bell(ZZ(2))) + (binomial(ZZ(4), ZZ(3)) * bell(ZZ(3))) + (binomial(ZZ(4), ZZ(4)) * bell(ZZ(4)))))
    out: "true"
