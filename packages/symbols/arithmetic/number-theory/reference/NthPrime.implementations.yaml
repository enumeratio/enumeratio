primepi-and-nthprime-are-inverses-pi-p-n-n:
  epsil:
    in: PrimePi(NthPrime(100)) == 100
    out: True
  tex:
    in: \mathrm{PrimePi}(\mathrm{NthPrime}(100))=100
    out: \top
  traditional:
    in: \pi(p_{100})=100
    out: \mathrm{True}
  fullform:
    in: Equal[PrimePi[Prime[100]], 100]
  wolfram:
    in: (PrimePi[Prime[100]] == 100)
    out: True
    tex:
      in: \pi \left(p_{100}\right)=100
      out: \text{True}
