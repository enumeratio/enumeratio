threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: NthPrime([1, 3, 4, 10])
    out: "[2, 5, 7, 29]"
  tex:
    in: \mathrm{NthPrime}(\bigl\lbrack1, 3, 4, 10\bigr\rbrack)
    out: \bigl\lbrack2, 5, 7, 29\bigr\rbrack
  fullform:
    in: Prime[List[1, 3, 4, 10]]
  wolfram:
    in: Prime[List[1, 3, 4, 10]]
    out: "{2, 5, 7, 29}"
    tex:
      in: p_{\{1,3,4,10\}}
      out: \{2,5,7,29\}
