    out: True
  tex:
    in: \mathrm{Fibonacci}(10)=\mathrm{Fibonacci}(9)+\mathrm{Fibonacci}(8)
    out: \top
  traditional:
    in: F_{10}=F_{9}+F_{8}
    out: \mathrm{True}
  wolfram:
    in: (Fibonacci[10] == Plus[Fibonacci[9], Fibonacci[8]])
    back: Unreadable
    out: True
    tex:
      in: F_{10}=F_9+F_8
      out: \text{True}
  sympy:
    in: enumeratio_equal(fibonacci(10), (fibonacci(9) + fibonacci(8)))
    out: True
  sage:
    in: bool(fibonacci(10) == (fibonacci(9) + fibonacci(8)))
    out: True
  oscar:
    in: (fibonacci(10) == (fibonacci(9) + fibonacci(8)))
    out: "true"
  julia:
    in: (fibonacci(10) == (fibonacci(9) + fibonacci(8)))
    out: "true"
  mathlib4:
    in: (decide ((Nat.fib 10) = ((Nat.fib 9) + (Nat.fib 8))))
    out: "true"
