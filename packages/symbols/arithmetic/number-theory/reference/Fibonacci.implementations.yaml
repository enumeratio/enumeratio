the-defining-recurrence-f-10-f-9-f-8:
  wolfram:
    in: (Fibonacci[10] == Plus[Fibonacci[9], Fibonacci[8]])
    out: True
    tex:
      in: F_{10}=F_9+F_8
      out: \text{True}
  sage:
    in: bool(fibonacci(10) == (fibonacci(9) + fibonacci(8)))
    out: True
  julia:
    in: (fibonacci(10) == (fibonacci(9) + fibonacci(8)))
    out: "true"
  mathlib4:
    in: (decide ((Nat.fib 10) = ((Nat.fib 9) + (Nat.fib 8))))
    out: "true"
  oscar:
    in: (fibonacci(10) == (fibonacci(9) + fibonacci(8)))
    out: "true"
  sympy:
    in: enumeratio_equal(fibonacci(10), (fibonacci(9) + fibonacci(8)))
    out: True
cassini-s-identity-f-n-1-f-n-1-f-n-2-1-n-here-at:
  wolfram:
    in: Subtract[Times[Fibonacci[5], Fibonacci[7]], Power[Fibonacci[6], 2]]
    out: "1"
    tex:
      in: F_5 F_7-\left(F_6\right){}^2
      out: "1"
  sage:
    in: ((fibonacci(5) * fibonacci(7)) - (fibonacci(6)^2))
    out: "1"
  julia:
    in: ((fibonacci(5) * fibonacci(7)) - (big(fibonacci(6))^2))
    out: "1"
  mathlib4:
    in: (((Nat.fib 5) * (Nat.fib 7)) - ((Nat.fib 6) ^ 2))
    out: "1"
  oscar:
    in: ((fibonacci(5) * fibonacci(7)) - (big(fibonacci(6))^2))
    out: "1"
  sympy:
    in: ((fibonacci(5) * fibonacci(7)) - (fibonacci(6)**2))
    out: "1"
gcd-f-12-f-18-f-gcd-12-18:
  wolfram:
    in: (GCD[Fibonacci[12], Fibonacci[18]] == Fibonacci[GCD[12, 18]])
    out: True
    tex:
      in: \gcd \left(F_{12},F_{18}\right)=F_{\gcd (12,18)}
      out: \text{True}
  sage:
    in: bool(gcd(fibonacci(12), fibonacci(18)) == fibonacci(gcd(12, 18)))
    out: True
  julia:
    in: (gcd(ZZ(fibonacci(12)), ZZ(fibonacci(18))) == fibonacci(gcd(ZZ(12), ZZ(18))))
    out: "true"
  mathlib4:
    in: (decide ((Int.gcd (Nat.fib 12) (Nat.fib 18)) = (Nat.fib (Int.gcd 12 18))))
    out: "true"
  oscar:
    in: (gcd(ZZ(fibonacci(12)), ZZ(fibonacci(18))) == fibonacci(gcd(ZZ(12), ZZ(18))))
    out: "true"
  sympy:
    in: enumeratio_equal(gcd(fibonacci(12), fibonacci(18)), fibonacci(gcd(12, 18)))
    out: True
negative-indices-are-supported-via-f-n-1-n-1-f-n:
  wolfram:
    in: Fibonacci[-5]
    out: "5"
    tex:
      in: F_{-5}
      out: "5"
  sage:
    in: fibonacci(-5)
    out: "5"
  julia:
    in: fibonacci(-5)
    out: "5"
  mathlib4:
    in: (Nat.fib (-5))
    out: failed to synthesize instance of type class
    verdict: error
    kind: domain
    note: The Mathlib mapping is over Nat, which has no negative numbers; compute-engine extends Fibonacci to this argument.
  oscar:
    in: fibonacci(-5)
    out: "5"
  sympy:
    in: fibonacci(-5)
    out: "5"
consecutive-ratios-f-n-1-f-n-converge-to-the:
  wolfram:
    in: Divide[Fibonacci[20], Fibonacci[19]]
    out: 6765/4181
    tex:
      in: \frac{F_{20}}{F_{19}}
      out: \frac{6765}{4181}
  sage:
    in: (fibonacci(20) / fibonacci(19))
    out: 6765/4181
  julia:
    in: (fibonacci(20) // fibonacci(19))
    out: "1.6180339631667064"
  mathlib4:
    in: "(((Nat.fib 20) : ℚ) / (Nat.fib 19))"
    out: 6765/4181
  oscar:
    in: (fibonacci(20) // fibonacci(19))
    out: "1.6180339631667064"
  sympy:
    in: (S(fibonacci(20)) / fibonacci(19))
    out: 6765/4181
threads-element-wise-over-a-list-as-wolfram-s:
  wolfram:
    in: Fibonacci[List[1, 2, 3, 4]]
    out: "{1, 1, 2, 3}"
    tex:
      in: F_{\{1,2,3,4\}}
      out: \{1,1,2,3\}
  sympy:
    in: fibonacci([1, 2, 3, 4])
    out: "AttributeError: 'list' object has no attribute 'is_Integer'"
    verdict: error
    kind: threading
    note: compute-engine's Fibonacci is Listable and threads over the list; SymPy's takes scalars only.
