gcd-f-12-f-18-f-gcd-12-18:
  epsil:
    in: GCD(Fibonacci(12), Fibonacci(18)) == Fibonacci(GCD(12, 18))
    out: True
  tex:
    in: \gcd(\mathrm{Fibonacci}(12), \mathrm{Fibonacci}(18))=\mathrm{Fibonacci}(\gcd(12, 18))
    out: \top
  traditional:
    in: \gcd(F_{12}, F_{18})=F_{\gcd(12, 18)}
    out: \mathrm{True}
  wolfram:
    in: (GCD[Fibonacci[12], Fibonacci[18]] == Fibonacci[GCD[12, 18]])
    back: Unreadable
    out: True
    tex:
      in: \gcd \left(F_{12},F_{18}\right)=F_{\gcd (12,18)}
      out: \text{True}
  sympy:
    in: enumeratio_equal(gcd(fibonacci(12), fibonacci(18)), fibonacci(gcd(12, 18)))
    out: True
  sage:
    in: bool(gcd(fibonacci(12), fibonacci(18)) == fibonacci(gcd(12, 18)))
    out: True
  oscar:
    in: (gcd(ZZ(fibonacci(12)), ZZ(fibonacci(18))) == fibonacci(gcd(ZZ(12), ZZ(18))))
    out: "true"
  julia:
    in: (gcd(ZZ(fibonacci(12)), ZZ(fibonacci(18))) == fibonacci(gcd(ZZ(12), ZZ(18))))
    out: "true"
  mathlib4:
    in: (decide ((Int.gcd (Nat.fib 12) (Nat.fib 18)) = (Nat.fib (Int.gcd 12 18))))
    out: "true"
