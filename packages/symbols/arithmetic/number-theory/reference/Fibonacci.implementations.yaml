threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: Fibonacci([1, 2, 3, 4])
    out: "[1, 1, 2, 3]"
  tex:
    in: \mathrm{Fibonacci}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack)
    out: \bigl\lbrack1, 1, 2, 3\bigr\rbrack
  wolfram:
    in: Fibonacci[List[1, 2, 3, 4]]
    out: "{1, 1, 2, 3}"
    tex:
      in: F_{\{1,2,3,4\}}
      out: \{1,1,2,3\}
  sympy:
    in: "[fibonacci(1), fibonacci(2), fibonacci(3), fibonacci(4)]"
    out: "AttributeError: 'list' object has no attribute 'is_Integer'"
    verdict: error
    kind: threading
    note: compute-engine's Fibonacci is Listable and threads over the list; SymPy's takes scalars only.
  sage:
    in: "[fibonacci(1), fibonacci(2), fibonacci(3), fibonacci(4)]"
  oscar:
    in: fibonacci([1, 2, 3, 4])
  julia:
    in: fibonacci([1, 2, 3, 4])
  mathlib4:
    in: (Nat.fib [1, 2, 3, 4])
