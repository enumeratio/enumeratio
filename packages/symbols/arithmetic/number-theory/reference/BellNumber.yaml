name: BellNumber
domain: Combinatorics
signature: BellNumber(n)
summary: The nth Bell number, counting the ways to partition a set of n elements.
signatures:
  - call: BellNumber(n)
    description: the nth Bell number $B_n$, the number of partitions of an n-element set.
  - call: BellNumber(n, x)
    description: the Bell (Touchard) polynomial $B_n(x) = \sum_k S(n,k)\,x^k$, exact for a nonnegative integer n.
    library: enumeratio-number-theory
details:
  - Recurrence $B_{n+1} = \sum_{k=0}^{n} \binom{n}{k}\, B_k$, built from [[Binomial]] and the lower Bell numbers.
  - Generating function $\sum_{n} B_n \frac{t^n}{n!} = e^{e^t - 1}$.
  - Equals the sum of Stirling numbers of the second kind over all block counts, $B_n = \sum_{k=0}^{n} S(n, k)$.
  - Also arise as the nth moment of a Poisson distribution with mean 1.
  - compute-engine requires a nonnegative integer argument; a negative n is left unevaluated.
  - The two-argument form $B_n(x)$ is the Bell (Touchard) polynomial; $B_n(1) = B_n$.
examples:
  - id: bellnumber-0
    expr: [BellNumber, 0]
    expected: 1
  - id: bellnumber-1
    expr: [BellNumber, 1]
    expected: 1
  - id: bellnumber-3
    expr: [BellNumber, 3]
    expected: 5
  - id: bellnumber-5
    expr: [BellNumber, 5]
    expected: 52
  - id: bellnumber-10
    expr: [BellNumber, 10]
    expected: 115975
  - id: recurrence-b-n-1-sum-k-0-n-binom-n-k-b-k-here-at
    expr: [Equal, [BellNumber, 5], [Add, [Multiply, [Binomial, 4, 0], [BellNumber, 0]], [Multiply, [Binomial, 4, 1], [BellNumber, 1]], [Multiply, [Binomial, 4, 2], [BellNumber, 2]], [Multiply, [Binomial, 4, 3], [BellNumber, 3]], [Multiply, [Binomial, 4, 4], [BellNumber, 4]]]]
    expected: True
    category: Properties
    caption: 'Recurrence: $B_{n+1} = \sum_{k=0}^n \binom{n}{k} B_k$, here at $n = 4$'
  - id: the-number-of-ways-to-partition-a-4-element-set
    expr: [BellNumber, 4]
    expected: 15
    category: Applications
    caption: The number of ways to partition a 4-element set into non-empty, unlabeled subsets
  - id: a-negative-argument-is-left-unevaluated
    expr: [BellNumber, -1]
    expected: [BellNumber, -1]
    category: Possible issues
    caption: A negative argument is left unevaluated
  - id: threads-element-wise-over-a-list-as-wolfram-s
    expr: [BellNumber, [List, 1, 2, 3, 4]]
    expected: [List, 1, 2, 5, 15]
    category: Scope
    caption: Threads element-wise over a list, as Wolfram's Listable heads do
  - id: exact-for-large-n
    expr: [BellNumber, 30]
    expected: {num: '846749014511809332450147'}
    category: Scope
    caption: Exact for large n
  - id: the-two-argument-form-gives-the-bell-touchard
    expr: [BellNumber, 5, x]
    expected: [Add, [Power, x, 5], [Multiply, 10, [Power, x, 4]], [Multiply, 25, [Power, x, 3]], [Multiply, 15, [Power, x, 2]], x]
    category: Scope
    caption: The two-argument form gives the Bell (Touchard) polynomial $\sum_k S(n, k)\,x^k$
  - id: the-bell-polynomial-at-a-real-point-b-20-0-5
    expr: [BellNumber, 20, 0.5]
    expected: 270190131940.15192
    category: Scope
    caption: The Bell polynomial at a real point, $B_{20}(0.5)$
  - id: the-bell-polynomial-at-1-is-the-bell-number-b-n
    expr: [BellNumber, 5, 1]
    expected: 52
    category: Properties
    caption: 'The Bell polynomial at 1 is the Bell number: $B_n(1) = B_n$'
  - id: dobinski-s-formula-b-n-frac-1-e-sum-k-ge-0-frac
    expr: [Divide, [Sum, [Divide, [Power, k, 5], [Factorial, k]], [Tuple, k, 0, PositiveInfinity]], ExponentialE]
    expected: 52
    aspirational: true
    category: Properties
    caption: Dobinski's formula $B_n = \frac{1}{e}\sum_{k \ge 0} \frac{k^n}{k!}$; the infinite sum is left unevaluated
  - id: touchard-s-congruence-b-p-n-equiv-b-n-b-n-1-pmod
    expr: [Equal, [Mod, [BellNumber, 9], 7], [Mod, [Add, [BellNumber, 2], [BellNumber, 3]], 7]]
    expected: True
    category: Properties
    caption: Touchard's congruence $B_{p+n} \equiv B_n + B_{n+1} \pmod p$, here $p = 7$, $n = 2$
seeAlso:
  - StirlingS1
