same-inverse-relation-viewed-from-primepi-s-side:
  epsil:
    in: PrimePi(NthPrime(50)) == 50
    out: True
  tex:
    in: \mathrm{PrimePi}(\mathrm{NthPrime}(50))=50
    out: \top
  traditional:
    in: \pi(p_{50})=50
    out: \mathrm{True}
  fullform:
    in: Equal[PrimePi[Prime[50]], 50]
  wolfram:
    in: (PrimePi[Prime[50]] == 50)
    out: True
    tex:
      in: \pi \left(p_{50}\right)=50
      out: \text{True}
threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: PrimePi([10, 100])
    out: "[4, 25]"
  tex:
    in: \mathrm{PrimePi}(\bigl\lbrack10, 100\bigr\rbrack)
    out: \bigl\lbrack4, 25\bigr\rbrack
  fullform:
    in: PrimePi[List[10, 100]]
  wolfram:
    in: PrimePi[List[10, 100]]
    out: "{4, 25}"
    tex:
      in: \pi (\{10,100\})
      out: \{4,25\}
  sympy:
    in: "[primepi(10), primepi(100)]"
    out: "[4, 25]"
  sage:
    in: "[prime_pi(10), prime_pi(100)]"
  mathlib4:
    in: (Nat.primeCounting [10, 100])
  rust:
    in: prime_pi(list(vec![n(10), n(100)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's PrimePi is Listable and threads over the list; the Rust crate takes scalars only.
rational-arguments-the-primes-up-to-7-2-are-2:
  epsil:
    in: PrimePi(7 / 2)
    out: "2"
  tex:
    in: \mathrm{PrimePi}(\frac{7}{2})
    out: "2"
  traditional:
    in: \pi(\frac{7}{2})
    out: "2"
  fullform:
    in: PrimePi[Rational[7, 2]]
  wolfram:
    in: PrimePi[Rational[7, 2]]
  sympy:
    in: primepi(Rational(7, 2))
    out: "2"
  sage:
    in: prime_pi((7/2))
  mathlib4:
    in: "(Nat.primeCounting ((7 : ℚ) / 2))"
  rust:
    in: prime_pi(rational(n(7), n(2)))
    out: "panic: an integer, not 7/2"
    verdict: error
    kind: domain
    note: The Rust adapter takes integers here; compute-engine's PrimePi extends past them.
