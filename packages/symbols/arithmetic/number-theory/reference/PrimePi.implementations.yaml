same-inverse-relation-viewed-from-primepi-s-side:
  wolfram:
    in: (PrimePi[Prime[50]] == 50)
    out: True
    tex:
      in: \pi \left(p_{50}\right)=50
      out: \text{True}
threads-element-wise-over-a-list-as-wolfram-s:
  wolfram:
    in: PrimePi[List[10, 100]]
    out: "{4, 25}"
    tex:
      in: \pi (\{10,100\})
      out: \{4,25\}
  sympy:
    in: primepi([10, 100])
    out: "AttributeError: 'list' object has no attribute 'is_real'"
    verdict: error
    kind: threading
    note: compute-engine's PrimePi is Listable and threads over the list; SymPy's takes scalars only.
  rust:
    in: prime_pi(list(vec![n(10), n(100)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's PrimePi is Listable and threads over the list; the Rust crate takes scalars only.
