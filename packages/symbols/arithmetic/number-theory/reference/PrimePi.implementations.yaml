listable-threads-over-a-list:
  epsil:
    in: PrimePi([3, 5, 17, 25])
    out: "[2, 3, 7, 9]"
  tex:
    in: \mathrm{PrimePi}(\bigl\lbrack3, 5, 17, 25\bigr\rbrack)
    out: \bigl\lbrack2, 3, 7, 9\bigr\rbrack
  fullform:
    in: PrimePi[List[3, 5, 17, 25]]
  wolfram:
    in: PrimePi[List[3, 5, 17, 25]]
  sympy:
    in: "[primepi(3), primepi(5), primepi(17), primepi(25)]"
    out: "[2, 3, 7, 9]"
  sage:
    in: "[prime_pi(3), prime_pi(5), prime_pi(17), prime_pi(25)]"
  mathlib4:
    in: (Nat.primeCounting [3, 5, 17, 25])
  rust:
    in: prime_pi(list(vec![n(3), n(5), n(17), n(25)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's PrimePi is Listable and threads over the list; the Rust crates take scalars only.
