no-primes-are-1:
  wolfram:
    in: PrimePi[1]
    out: "0"
    tex:
      in: \pi (1)
      out: "0"
  sage:
    in: prime_pi(1)
    out: "0"
  mathlib4:
    in: (Nat.primeCounting 1)
    out: "0"
  rust:
    in: prime_pi(n(1))
    out: "0"
  sympy:
    in: primepi(1)
    out: "0"
