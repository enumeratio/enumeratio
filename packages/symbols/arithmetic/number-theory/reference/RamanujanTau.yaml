name: RamanujanTau
domain: Number theory
signature: RamanujanTau(n)
summary: "Ramanujan's tau function: the coefficients of the discriminant modular form $\\Delta(q) = q\\prod_{k\\ge1}(1-q^k)^{24}$."
signatures:
  - call: RamanujanTau(n)
    description: the coefficient of $q^n$ in $\Delta(q)$
    library: enumeratio-number-theory
details:
  - 'Multiplicative: $\tau(mn)=\tau(m)\tau(n)$ for coprime $m,n$.'
  - Computed by truncated power-series multiplication of $\prod(1-q^k)^{24}$, exactly, not from a closed form.
examples:
  - id: ramanujantau-2
    expr: [RamanujanTau, 2]
    expected: -24
  - id: ramanujantau-5
    expr: [RamanujanTau, 5]
    expected: 4830
  - id: listable
    expr: [RamanujanTau, [List, 1, 2, 3, 4, 5, 6]]
    expected: [List, 1, -24, 252, -1472, 4830, -6048]
    category: Scope
    caption: Listable
  - id: ramanujantau-12
    expr: [RamanujanTau, 12]
    expected: -370944
    category: Scope
  - id: multiplicative-tau-6-tau-2-tau-3
    expr: [Multiply, [RamanujanTau, 2], [RamanujanTau, 3]]
    expected: -6048
    category: Properties
    caption: 'Multiplicative: $\tau(6) = \tau(2)\tau(3)$'
seeAlso:
  - PartitionsQ
