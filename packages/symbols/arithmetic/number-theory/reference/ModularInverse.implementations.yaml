the-same-as-powermod-with-exponent-1:
  epsil:
    in: ModularInverse(3, 7) == PowerMod(3, -1, 7)
    out: True
  tex:
    in: \mathrm{ModularInverse}(3, 7)=\mathrm{PowerMod}(3, -1, 7)
    out: \top
  traditional:
    in: \left(3^{-1}\bmod 7\right)=\left(\frac{1}{3}\bmod 7\right)
    out: \mathrm{True}
  fullform:
    in: Equal[ModularInverse[3, 7], PowerMod[3, -1, 7]]
  wolfram:
    in: (ModularInverse[3, 7] == PowerMod[3, -1, 7])
  sage:
    in: bool(inverse_mod(3, 7) == power_mod(3, -1, 7))
a-cdot-a-1-equiv-1-modulo-the-mersenne-prime-2:
  epsil:
    in: 12_345 * ModularInverse(12_345, 2 ^ 61 - 1) % (2 ^ 61 - 1)
    out: "1"
  tex:
    in: 12\,345\mathrm{ModularInverse}(12\,345, 2^{61}-1)\bmod(2^{61}-1)
    out: "1"
  traditional:
    in: 12\,345\left(12\,345^{-1}\bmod 2^{61}-1\right)\bmod(2^{61}-1)
    out: "1"
  fullform:
    in: Mod[Times[12345, ModularInverse[12345, Subtract[Power[2, 61], 1]]], Subtract[Power[2, 61], 1]]
  wolfram:
    in: Mod[Times[12345, ModularInverse[12345, Subtract[Power[2, 61], 1]]], Subtract[Power[2, 61], 1]]
  sage:
    in: ((12345 * inverse_mod(12345, (((2)^61) - 1))) % (((2)^61) - 1))
2-i-6-4i-8-14i-equiv-1-pmod-7:
  epsil:
    in: ModularInverse(2 + i, 7)
    out: 6 + 4i
  tex:
    in: \mathrm{ModularInverse}(2+i, 7)
    out: 6+4i
  traditional:
    in: \left(2+i^{-1}\bmod 7\right)
    out: 6+4i
  fullform:
    in: ModularInverse[Complex[2, 1], 7]
  wolfram:
    in: ModularInverse[Complex[2, 1], 7]
    out: 6 + 4*I
    tex:
      in: \text{ModularInverse}[2+i,7]
      out: 6+4 i
  sage:
    in: inverse_mod((2 + 1*I), 7)
    out: -3*I - 1
    verdict: disagree
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so ModularInverse over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
modularinverse-11-plus-neg-7-times-i-7-plus-4i:
  epsil:
    in: ModularInverse(11 - 7i, 7 + 4i)
    out: -1 + 2i
  tex:
    in: \mathrm{ModularInverse}(11-7i, 7+4i)
    out: -1+2i
  traditional:
    in: \left(11-7i^{-1}\bmod 7+4i\right)
    out: -1+2i
  fullform:
    in: ModularInverse[Complex[11, -7], Complex[7, 4]]
  wolfram:
    in: ModularInverse[Complex[11, -7], Complex[7, 4]]
    out: -1 + 2*I
    tex:
      in: \text{ModularInverse}[11-7 i,7+4 i]
      out: -1+2 i
  sage:
    in: inverse_mod((11 + -7*I), (7 + 4*I))
    out: "28"
    verdict: inconclusive
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so ModularInverse over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
gcd-2-4-2-no-inverse:
  epsil:
    in: ModularInverse(2, 4)
    out: ModularInverse(2, 4)
  tex:
    in: \mathrm{ModularInverse}(2, 4)
    out: \mathrm{ModularInverse}(2, 4)
  traditional:
    in: \left(2^{-1}\bmod 4\right)
    out: \left(2^{-1}\bmod 4\right)
  fullform:
    in: ModularInverse[2, 4]
  wolfram:
    in: ModularInverse[2, 4]
    out: ModularInverse[2, 4]
    tex:
      in: \text{ModularInverse}[2,4]
      out: \text{ModularInverse}[2,4]
  sage:
    in: inverse_mod(2, 4)
    out: "ZeroDivisionError: inverse of Mod(2, 4) does not exist"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["ModularInverse", 2, 4] and Sage raises an error.'
