2-i-6-4i-8-14i-equiv-1-pmod-7:
  epsil:
    in: ModularInverse(2 + i, 7)
    out: 6 + 4i
  tex:
    in: \mathrm{ModularInverse}(2+i, 7)
    out: 6+4i
  traditional:
    in: \left((2+i)^{-1}\bmod 7\right)
    out: 6+4i
  fullform:
    in: ModularInverse[Complex[2, 1], 7]
  wolfram:
    in: ModularInverse[Complex[2, 1], 7]
    out: 6 + 4*I
    tex:
      in: \text{ModularInverse}[2+i,7]
      out: 6+4 i
  sage:
    in: inverse_mod((2 + 1*I), 7)
    out: -3*I - 1
    verdict: disagree
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so ModularInverse over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
modularinverse-11-plus-neg-7-times-i-7-plus-4i:
