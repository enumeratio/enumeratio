listable-threads-over-a-list:
  epsil:
    in: ModularInverse([2, 3, 4], 11)
    out: "[6, 4, 3]"
  tex:
    in: \mathrm{ModularInverse}(\bigl\lbrack2, 3, 4\bigr\rbrack, 11)
    out: \bigl\lbrack6, 4, 3\bigr\rbrack
  fullform:
    in: ModularInverse[List[2, 3, 4], 11]
  wolfram:
    in: ModularInverse[List[2, 3, 4], 11]
  sage:
    in: inverse_mod([2, 3, 4], 11)
    out: "TypeError: unable to coerce <class 'list'> to an integer"
    verdict: error
    kind: threading
    note: compute-engine's ModularInverse is Listable and threads over the list; Sage's inverse_mod() takes a scalar only and raises a TypeError trying to coerce the list.
the-same-as-powermod-with-exponent-1:
  epsil:
    in: ModularInverse(3, 7) == PowerMod(3, -1, 7)
    out: True
  tex:
    in: \mathrm{ModularInverse}(3, 7)=\mathrm{PowerMod}(3, -1, 7)
    out: \top
  traditional:
    in: \left(3^{-1}\bmod 7\right)=\left(\frac{1}{3}\bmod 7\right)
    out: \mathrm{True}
  fullform:
    in: Equal[ModularInverse[3, 7], PowerMod[3, -1, 7]]
  wolfram:
    in: (ModularInverse[3, 7] == PowerMod[3, -1, 7])
  sage:
    in: bool(inverse_mod(3, 7) == power_mod(3, -1, 7))
    out: True
