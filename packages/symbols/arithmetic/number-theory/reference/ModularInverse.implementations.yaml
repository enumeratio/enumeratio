    out: -1+2i
  traditional:
    in: \left((11-7i)^{-1}\bmod 7+4i\right)
    out: -1+2i
  fullform:
    in: ModularInverse[Complex[11, -7], Complex[7, 4]]
  wolfram:
    in: ModularInverse[Complex[11, -7], Complex[7, 4]]
    out: -1 + 2*I
    tex:
      in: \text{ModularInverse}[11-7 i,7+4 i]
      out: -1+2 i
