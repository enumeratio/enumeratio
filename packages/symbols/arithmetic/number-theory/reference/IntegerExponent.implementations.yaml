2000-5-3-cdot-16:
  epsil:
    in: IntegerExponent(2_000, 5)
    out: "3"
  tex:
    in: \mathrm{IntegerExponent}(2\,000, 5)
    out: "3"
  traditional:
    in: v_{5}(2\,000)
    out: "3"
  fullform:
    in: IntegerExponent[2000, 5]
  wolfram:
    in: IntegerExponent[2000, 5]
    out: "3"
    tex:
      in: \text{IntegerExponent}[2000,5]
      out: "3"
  sympy:
    in: multiplicity(5, 2000)
    out: "3"
