base-1-has-no-well-defined-p-adic-valuation-so:
  epsil:
    in: IntegerExponent(10, 1)
    out: IntegerExponent(10, 1)
  tex:
    in: \mathrm{IntegerExponent}(10, 1)
    out: \mathrm{IntegerExponent}(10, 1)
  traditional:
    in: v_{1}(10)
    out: v_{1}(10)
  fullform:
    in: IntegerExponent[10, 1]
  wolfram:
    in: IntegerExponent[10, 1]
  sympy:
    in: multiplicity(1, 10)
    out: "ValueError: factor must be > 1"
    verdict: error
    kind: undefined-form
    note: "Both decline: compute-engine leaves IntegerExponent(10, 1) unevaluated, SymPy raises."
