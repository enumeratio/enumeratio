2000-5-3-cdot-16:
  wolfram:
    in: IntegerExponent[2000, 5]
    out: "3"
    tex:
      in: \text{IntegerExponent}[2000,5]
      out: "3"
  sympy:
    in: multiplicity(5, 2000)
    out: "3"
base-10-by-default:
  wolfram:
    in: IntegerExponent[2000]
    out: "3"
    tex:
      in: \text{IntegerExponent}[2000]
      out: "3"
integerexponent-0-5:
  wolfram:
    in: IntegerExponent[0, 5]
    out: Infinity
    tex:
      in: \text{IntegerExponent}[0,5]
      out: \infty
  sympy:
    in: multiplicity(5, 0)
    out: "ValueError: no such integer exists: multiplicity of 0 is not-defined"
    verdict: error
    kind: domain
    note: compute-engine answers ∞ for the multiplicity of p in 0; SymPy's multiplicity declines.
integerexponent-2-pow-10-times-3-pow-4-2:
  sympy:
    in: multiplicity(2, ((2**10) * (3**4)))
    out: "10"
composite-base-1728-2-6-3-3-so-6-3-divides-it:
  sympy:
    in: multiplicity(6, 1728)
    out: "3"
gaussian-integers-8i-i-cdot-i-3-1-i-6:
  sympy:
    in: multiplicity((1 + 1*I), (0 + 8*I))
    out: "ValueError: expecting ints or fractions, got 1 + I and 8*I"
    verdict: error
    kind: domain
    note: SymPy's multiplicity only takes plain integers or fractions; ours supports Gaussian-integer valuation deliberately (see this head's Scope examples).
legendre-s-formula-lfloor-100-7-rfloor-lfloor:
  sympy:
    in: multiplicity(7, factorial(100))
    out: "16"
base-1-has-no-well-defined-p-adic-valuation-so:
  sympy:
    in: multiplicity(1, 10)
    out: "ValueError: factor must be > 1"
    verdict: error
    kind: undefined-form
    note: Both decline at base 1 -- ours stays unevaluated (see the caption), SymPy's multiplicity raises.
