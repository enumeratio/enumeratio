gaussian-integers-8i-i-cdot-i-3-1-i-6:
  epsil:
    in: IntegerExponent(8i, 1 + i)
    out: "6"
  tex:
    in: \mathrm{IntegerExponent}(8i, 1+i)
    out: "6"
  traditional:
    in: v_{1+i}(8i)
    out: "6"
  fullform:
    in: IntegerExponent[Complex[0, 8], Complex[1, 1]]
  wolfram:
    in: IntegerExponent[Complex[0, 8], Complex[1, 1]]
  sympy:
    in: multiplicity((1 + 1*I), (0 + 8*I))
    out: "ValueError: expecting ints or fractions, got 1 + I and 8*I"
    verdict: error
    kind: domain
    note: compute-engine's IntegerExponent takes Gaussian integers; SymPy's multiplicity takes integers and fractions only.
