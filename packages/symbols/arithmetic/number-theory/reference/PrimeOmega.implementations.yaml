completely-additive-omega-mn-omega-m-omega-n-for:
  epsil:
    in: PrimeOmega(24 * 40) == PrimeOmega(24) + PrimeOmega(40)
    out: True
  tex:
    in: \mathrm{PrimeOmega}(24\times40)=\mathrm{PrimeOmega}(24)+\mathrm{PrimeOmega}(40)
    out: \top
  traditional:
    in: \Omega(24\times40)=\Omega(24)+\Omega(40)
    out: \mathrm{True}
  fullform:
    in: Equal[PrimeOmega[Times[24, 40]], Plus[PrimeOmega[24], PrimeOmega[40]]]
  wolfram:
    in: (PrimeOmega[Times[24, 40]] == Plus[PrimeOmega[24], PrimeOmega[40]])
    out: True
    tex:
      in: \Omega (24\ 40)=\Omega (24)+\Omega (40)
      out: \text{True}
omega-n-ge-nu-n-always-here-8-2-3-gives-omega-3:
  epsil:
    in: PrimeOmega(8) >= PrimeNu(8)
    out: True
  tex:
    in: \mathrm{PrimeOmega}(8)\ge\mathrm{PrimeNu}(8)
    out: \top
  traditional:
    in: \Omega(8)\ge\omega(8)
    out: \mathrm{True}
  fullform:
    in: GreaterEqual[PrimeOmega[8], PrimeNu[8]]
  wolfram:
    in: GreaterEqual[PrimeOmega[8], PrimeNu[8]]
    out: True
    tex:
      in: \Omega (8)\geq \nu (8)
      out: \text{True}
