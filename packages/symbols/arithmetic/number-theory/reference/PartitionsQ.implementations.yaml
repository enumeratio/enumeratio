the-partitions-of-10-into-distinct-parts:
  epsil:
    in: PartitionsQ(10)
    out: "10"
  tex:
    in: \mathrm{PartitionsQ}(10)
    out: "10"
  fullform:
    in: PartitionsQ[10]
  wolfram:
    in: PartitionsQ[10]
the-empty-partition:
  epsil:
    in: PartitionsQ(0)
    out: "1"
  tex:
    in: \mathrm{PartitionsQ}(0)
    out: "1"
  fullform:
    in: PartitionsQ[0]
  wolfram:
    in: PartitionsQ[0]
exact-for-large-n:
  epsil:
    in: PartitionsQ(100)
    out: 444_793
  tex:
    in: \mathrm{PartitionsQ}(100)
    out: 444\,793
  fullform:
    in: PartitionsQ[100]
  wolfram:
    in: PartitionsQ[100]
threads-over-a-list:
  epsil:
    in: PartitionsQ([1, 2, 3, 4, 5, 6, 7, 8])
    out: "[1, 1, 2, 2, 3, 4, 5, 6]"
  tex:
    in: \mathrm{PartitionsQ}(\bigl\lbrack1, 2, 3, 4, 5, 6, 7, 8\bigr\rbrack)
    out: \bigl\lbrack1, 1, 2, 2, 3, 4, 5, 6\bigr\rbrack
  fullform:
    in: PartitionsQ[List[1, 2, 3, 4, 5, 6, 7, 8]]
  wolfram:
    in: PartitionsQ[List[1, 2, 3, 4, 5, 6, 7, 8]]
counts-the-distinctpartitions-family:
  epsil:
    in: PartitionsQ(10) == Count(DistinctPartitions(10))
    out: True
  tex:
    in: \mathrm{PartitionsQ}(10)=\mathrm{Count}(\mathrm{DistinctPartitions}(10))
    out: \top
  traditional:
    in: \mathrm{PartitionsQ}(10)=\mathrm{Count}(\mathrm{DistinctPartitions}(10))
    out: \mathrm{True}
  fullform:
    in: Equal[PartitionsQ[10], Count[DistinctPartitions[10]]]
euler-as-many-partitions-into-odd-parts-as-into:
  epsil:
    in: PartitionsQ(12) == Count(IntegerPartitions(12, All, [1, 3, 5, 7, 9, 11]))
    out: True
  tex:
    in: \mathrm{PartitionsQ}(12)=\mathrm{Count}(\mathrm{IntegerPartitions}(12, \mathrm{All}, \bigl\lbrack1, 3, 5, 7, 9, 11\bigr\rbrack))
    out: \top
  traditional:
    in: \mathrm{PartitionsQ}(12)=\mathrm{Count}(\mathrm{IntegerPartitions}(12, \mathrm{All}, \bigl\lbrack1, 3, 5, 7, 9, 11\bigr\rbrack))
    out: \mathrm{True}
  fullform:
    in: Equal[PartitionsQ[12], Count[IntegerPartitions[12, AllTrue, List[1, 3, 5, 7, 9, 11]]]]
  wolfram:
    in: (PartitionsQ[12] == Count[IntegerPartitions[12, AllTrue, List[1, 3, 5, 7, 9, 11]]])
