recurrence-d-n-n-d-n-1-1-n:
  epsil:
    in: Subfactorial(4) == 4 * Subfactorial(3) + (-1) ^ 4
    out: True
  tex:
    in: \mathrm{Subfactorial}(4)=4\mathrm{Subfactorial}(3)+(-1)^4
    out: \top
  traditional:
    in: "{!}4=4{!}3+(-1)^4"
    out: \mathrm{True}
  fullform:
    in: Equal[Subfactorial[4], Plus[Times[4, Subfactorial[3]], Power[-1, 4]]]
  wolfram:
    in: (Subfactorial[4] == Plus[Times[4, Subfactorial[3]], Power[-1, 4]])
    out: True
    tex:
      in: \text{Subfactorial}[4]=4 \text{Subfactorial}[3]+(-1)^4
      out: \text{True}
