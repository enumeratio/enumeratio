d-n-is-frac-n-e-rounded-to-the-nearest-integer:
  epsil:
    in: Subfactorial(10) == Round(10! / ExponentialE)
    out: True
  tex:
    in: \mathrm{Subfactorial}(10)=\mathrm{round}(\frac{10!}{e})
    out: \top
  traditional:
    in: '{!}10=\mathrm{round}(\frac{10!}{e})'
    out: \mathrm{True}
  fullform:
    in: Equal[Subfactorial[10], Round[Divide[Factorial[10], E]]]
  wolfram:
    in: (Subfactorial[10] == Round[Divide[Factorial[10], E]])
two-term-recurrence-d-n-1-n-d-n-d-n-1:
  epsil:
    in: Subfactorial(6) == 5 * (Subfactorial(5) + Subfactorial(4))
    out: True
  tex:
    in: \mathrm{Subfactorial}(6)=5(\mathrm{Subfactorial}(5)+\mathrm{Subfactorial}(4))
    out: \top
  traditional:
    in: "{!}6=5({!}5+{!}4)"
    out: \mathrm{True}
  fullform:
    in: Equal[Subfactorial[6], Times[5, Plus[Subfactorial[5], Subfactorial[4]]]]
  wolfram:
    in: (Subfactorial[6] == Times[5, Plus[Subfactorial[5], Subfactorial[4]]])
