lists-aren-t-threaded-element-wise-they-re:
  epsil:
    in: GCD([2, 4], [6, 8])
    out: "2"
  tex:
    in: \gcd(\bigl\lbrack2, 4\bigr\rbrack, \bigl\lbrack6, 8\bigr\rbrack)
    out: "2"
  fullform:
    in: GCD[List[2, 4], List[6, 8]]
  wolfram:
    in: GCD[List[2, 4], List[6, 8]]
    out: "{2, 4}"
    tex:
      in: \gcd (\{2,4\},\{6,8\})
      out: \{2,4\}
    verdict: disagree
    kind: convention
    note: Wolfram's GCD is Listable and threads element-wise ({gcd(2,6), gcd(4,8)}); compute-engine flattens the lists into arguments, gcd(2,4,6,8).
  sympy:
    in: "[gcd([2, 4], 6), gcd([2, 4], 8)]"
    out: "AttributeError: 'int' object has no attribute 'is_commutative'"
    verdict: error
    kind: threading
    note: compute-engine's GCD threads over (or pools) the list; SymPy's takes scalars.
  sage:
    in: "[gcd([2, 4], 6), gcd([2, 4], 8)]"
    out: "TypeError: unable to call gcd with [2, 4]"
    verdict: error
    kind: threading
    note: compute-engine's GCD pools the elements of list arguments; Sage's gcd takes scalars only.
  oscar:
    in: gcd(ZZ([2, 4]), ZZ([6, 8]))
    out: "MethodError: no method matching (::ZZRing)(::Vector{Int64}) The object of type `ZZRing` exists, but "
    verdict: error
    kind: threading
    note: compute-engine's GCD pools the elements of list arguments; Oscar's gcd takes scalars only.
  julia:
    in: gcd(ZZ([2, 4]), ZZ([6, 8]))
    out: "MethodError: no method matching (::ZZRing)(::Vector{Int64}) The object of type `ZZRing` exists, but "
    verdict: error
    kind: threading
    note: compute-engine's GCD pools the elements of list arguments; Nemo/Combinatorics.jl's gcd takes scalars only.
  mathlib4:
    in: (Int.gcd [2, 4] [6, 8])
    out: "Application type mismatch: The argument"
    verdict: error
    kind: threading
    note: compute-engine's GCD pools the elements of list arguments; Mathlib's gcd takes scalars only.
  rust:
    in: gcd(list(vec![n(2), n(4)]), list(vec![n(6), n(8)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's GCD is Listable and threads over the list; the Rust crates take scalars.
commutative-gcd-a-b-gcd-b-a:
  epsil:
    in: GCD(12, 18) == GCD(18, 12)
    out: True
  tex:
    in: \gcd(12, 18)=\gcd(18, 12)
    out: \top
  traditional:
    in: \gcd(12, 18)=\gcd(18, 12)
    out: \mathrm{True}
  fullform:
    in: Equal[GCD[12, 18], GCD[18, 12]]
  wolfram:
    in: (GCD[12, 18] == GCD[18, 12])
    out: True
    tex:
      in: \gcd (12,18)=\gcd (18,12)
      out: \text{True}
  sympy:
    in: enumeratio_equal(gcd(12, 18), gcd(18, 12))
    out: True
  sage:
    in: bool(gcd(12, 18) == gcd(18, 12))
    out: True
  oscar:
    in: (gcd(ZZ(12), ZZ(18)) == gcd(ZZ(18), ZZ(12)))
    out: "true"
  julia:
    in: (gcd(ZZ(12), ZZ(18)) == gcd(ZZ(18), ZZ(12)))
    out: "true"
  mathlib4:
    in: (decide ((Int.gcd 12 18) = (Int.gcd 18 12)))
    out: "true"
  rust:
    in: equal(gcd(n(12), n(18)), gcd(n(18), n(12)))
    out: "true"
gcd-a-b-cdot-lcm-a-b-ab-see-lcm:
  epsil:
    in: GCD(12, 18) * LCM(12, 18) == 12 * 18
    out: True
  tex:
    in: \gcd(12, 18)\operatorname{lcm}(12, 18)=12\times18
    out: \top
  traditional:
    in: \gcd(12, 18)\operatorname{lcm}(12, 18)=12\times18
    out: \mathrm{True}
  fullform:
    in: Equal[Times[GCD[12, 18], LCM[12, 18]], Times[12, 18]]
  wolfram:
    in: (Times[GCD[12, 18], LCM[12, 18]] == Times[12, 18])
    out: True
    tex:
      in: \gcd (12,18) \text{lcm}(12,18)=12\ 18
      out: \text{True}
  sympy:
    in: enumeratio_equal((gcd(12, 18) * lcm(12, 18)), (12 * 18))
    out: True
  sage:
    in: bool((gcd(12, 18) * lcm(12, 18)) == (12 * 18))
    out: True
  oscar:
    in: ((gcd(ZZ(12), ZZ(18)) * lcm(ZZ(12), ZZ(18))) == (12 * 18))
    out: "true"
  julia:
    in: ((gcd(ZZ(12), ZZ(18)) * lcm(ZZ(12), ZZ(18))) == (12 * 18))
    out: "true"
  mathlib4:
    in: (decide (((Int.gcd 12 18) * (Int.lcm 12 18)) = (12 * 18)))
    out: "true"
  rust:
    in: equal((gcd(n(12), n(18)) * lcm(n(12), n(18))), (n(12) * n(18)))
    out: "true"
