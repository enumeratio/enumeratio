gaussian-integers-the-associate-in-the-first:
  epsil:
    in: GCD(3 + i, 1 + 3i)
    out: 1 + i
  tex:
    in: \gcd(3+i, 1+3i)
    out: 1+i
  fullform:
    in: GCD[Complex[3, 1], Complex[1, 3]]
  wolfram:
    in: GCD[Complex[3, 1], Complex[1, 3]]
    out: 1 + I
    tex:
      in: \gcd (3+i,1+3 i)
      out: 1+i
  sympy:
    in: gcd((3 + 1*I), (1 + 3*I))
    out: 1 + I
  sage:
    in: gcd((3 + 1*I), (1 + 3*I))
    out: "1"
    verdict: inconclusive
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so GCD over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
  oscar:
    in: gcd(ZZ(complex(3, 1)), ZZ(complex(1, 3)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to the Oscar mapping as a complex number in the Complex{Int} type, not an element of ℤ[i], so GCD over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
  julia:
    in: gcd(ZZ(complex(3, 1)), ZZ(complex(1, 3)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to the Julia (Nemo) mapping as a complex number in the Complex{Int} type, not an element of ℤ[i], so GCD over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
