gaussian-integers-3-2i-i-2-3i-and-10-15i-5-2-3i:
  epsil:
    in: GCD(-3 + 2i, 10 + 15i)
    out: 2 + 3i
  tex:
    in: \gcd(-3+2i, 10+15i)
    out: 2+3i
  fullform:
    in: GCD[Complex[-3, 2], Complex[10, 15]]
  wolfram:
    in: GCD[Complex[-3, 2], Complex[10, 15]]
  sympy:
    in: gcd((-3 + 2*I), (10 + 15*I))
    out: 2 + 3*I
  sage:
    in: gcd((-3 + 2*I), (10 + 15*I))
    out: "1"
    verdict: inconclusive
    kind: domain
    note: compute-engine computes the Gaussian gcd directly; Sage's gcd() doesn't understand Gaussian integers and falls back to the trivial answer 1 in the Symbolic Ring.
  oscar:
    in: gcd(ZZ(complex(-3, 2)), ZZ(complex(10, 15)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: Oscar's ZZ wrapper is rational integers only, no Gaussian integers; compute-engine computes the Gaussian gcd directly.
  julia:
    in: gcd(ZZ(complex(-3, 2)), ZZ(complex(10, 15)))
    out: "MethodError: no method matching (::ZZRing)(::Complex{Int64}) The object of type `ZZRing` exists, but"
    verdict: error
    kind: domain
    note: Nemo's ZZ is rational integers only, no Gaussian integers; ours computes the Gaussian gcd directly.
