    out: \bigl\lbrack1, 2, 3\bigr\rbrack
  fullform:
    in: PrimeNu[List[4, 28, 180]]
  wolfram:
    in: PrimeNu[List[4, 28, 180]]
    out: "{1, 2, 3}"
    tex:
      in: \nu (\{4,28,180\})
      out: \{1,2,3\}
