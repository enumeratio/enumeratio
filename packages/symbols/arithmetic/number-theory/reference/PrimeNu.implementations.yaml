primenu-n-is-the-length-of-factorinteger-n:
  epsil:
    in: PrimeNu(50) == Length(FactorInteger(50))
    out: True
  tex:
    in: \mathrm{PrimeNu}(50)=\mathrm{Length}(\mathrm{FactorInteger}(50))
    out: \top
  traditional:
    in: \omega(50)=\mathrm{Length}(\mathrm{FactorInteger}(50))
    out: \mathrm{True}
  fullform:
    in: Equal[PrimeNu[50], Length[FactorInteger[50]]]
  wolfram:
    in: (PrimeNu[50] == Length[FactorInteger[50]])
    out: True
    tex:
      in: \nu (50)=\text{Length}[\text{FactorInteger}[50]]
      out: \text{True}
threads-element-wise-over-a-list-as-wolfram-s:
