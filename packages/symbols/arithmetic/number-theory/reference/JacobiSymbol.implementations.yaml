completely-multiplicative-in-the-top-argument-a:
  epsil:
    in: JacobiSymbol(3, 7) * JacobiSymbol(5, 7) == JacobiSymbol(3 * 5, 7)
    out: True
  tex:
    in: \mathrm{JacobiSymbol}(3, 7)\mathrm{JacobiSymbol}(5, 7)=\mathrm{JacobiSymbol}(3\times5, 7)
    out: \top
  traditional:
    in: \left(\frac{3}{7}\right)\left(\frac{5}{7}\right)=\left(\frac{3\times5}{7}\right)
    out: \mathrm{True}
  wolfram:
    in: (Times[JacobiSymbol[3, 7], JacobiSymbol[5, 7]] == JacobiSymbol[Times[3, 5], 7])
    back: Unreadable
    out: True
    tex:
      in: \left(\frac{3}{7}\right) \left(\frac{5}{7}\right)=\left(\frac{3\ 5}{7}\right)
      out: \text{True}
threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: JacobiSymbol([2, 3, 5, 7, 11], 3)
    out: "[-1, 0, -1, 1, -1]"
  tex:
    in: \mathrm{JacobiSymbol}(\bigl\lbrack2, 3, 5, 7, 11\bigr\rbrack, 3)
    out: \bigl\lbrack-1, 0, -1, 1, -1\bigr\rbrack
  wolfram:
    in: JacobiSymbol[List[2, 3, 5, 7, 11], 3]
    out: "{-1, 0, -1, 1, -1}"
    tex:
      in: \left(\frac{\{2,3,5,7,11\}}{3}\right)
      out: \{-1,0,-1,1,-1\}
larger-arguments-10-10-1-against-the-1000th:
