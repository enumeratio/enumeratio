sum-d-mid-n-varphi-d-n-checked-over-the-divisors:
  epsil:
    in: Totient(1) + Totient(2) + Totient(3) + Totient(4) + Totient(6) + Totient(12)
    out: "12"
  tex:
    in: \mathrm{Totient}(1)+\mathrm{Totient}(2)+\mathrm{Totient}(3)+\mathrm{Totient}(4)+\mathrm{Totient}(6)+\mathrm{Totient}(12)
    out: "12"
  traditional:
    in: \varphi(1)+\varphi(2)+\varphi(3)+\varphi(4)+\varphi(6)+\varphi(12)
    out: "12"
  wolfram:
    in: Plus[EulerPhi[1], EulerPhi[2], EulerPhi[3], EulerPhi[4], EulerPhi[6], EulerPhi[12]]
    out: "12"
    tex:
      in: \phi (1)+\phi (2)+\phi (3)+\phi (4)+\phi (6)+\phi (12)
      out: "12"
  sympy:
    in: (totient(1) + totient(2) + totient(3) + totient(4) + totient(6) + totient(12))
    out: "12"
  sage:
    in: (euler_phi(1) + euler_phi(2) + euler_phi(3) + euler_phi(4) + euler_phi(6) + euler_phi(12))
    out: "12"
  oscar:
    in: (euler_phi(ZZ(1)) + euler_phi(ZZ(2)) + euler_phi(ZZ(3)) + euler_phi(ZZ(4)) + euler_phi(ZZ(6)) + euler_phi(ZZ(12)))
    out: "12"
  julia:
    in: (euler_phi(ZZ(1)) + euler_phi(ZZ(2)) + euler_phi(ZZ(3)) + euler_phi(ZZ(4)) + euler_phi(ZZ(6)) + euler_phi(ZZ(12)))
    out: "12"
  mathlib4:
    in: ((Nat.totient 1) + (Nat.totient 2) + (Nat.totient 3) + (Nat.totient 4) + (Nat.totient 6) + (Nat.totient 12))
    out: "12"
multiplicative-varphi-mn-varphi-m-varphi-n-when:
  epsil:
    in: Totient(12) == Totient(4) * Totient(3)
    out: True
  tex:
    in: \mathrm{Totient}(12)=\mathrm{Totient}(4)\mathrm{Totient}(3)
    out: \top
  traditional:
    in: \varphi(12)=\varphi(4)\varphi(3)
    out: \mathrm{True}
  wolfram:
    in: (EulerPhi[12] == Times[EulerPhi[4], EulerPhi[3]])
    back: Unreadable
    out: True
    tex:
      in: \phi (12)=\phi (4) \phi (3)
      out: \text{True}
  sympy:
    in: enumeratio_equal(totient(12), (totient(4) * totient(3)))
    out: True
  sage:
    in: bool(euler_phi(12) == (euler_phi(4) * euler_phi(3)))
    out: True
  oscar:
    in: (euler_phi(ZZ(12)) == (euler_phi(ZZ(4)) * euler_phi(ZZ(3))))
    out: "true"
  julia:
    in: (euler_phi(ZZ(12)) == (euler_phi(ZZ(4)) * euler_phi(ZZ(3))))
    out: "true"
  mathlib4:
    in: (decide ((Nat.totient 12) = ((Nat.totient 4) * (Nat.totient 3))))
    out: "true"
