threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: Totient([2, 4, 6])
    out: "[1, 2, 2]"
  tex:
    in: \mathrm{Totient}(\bigl\lbrack2, 4, 6\bigr\rbrack)
    out: \bigl\lbrack1, 2, 2\bigr\rbrack
  wolfram:
    in: EulerPhi[List[2, 4, 6]]
    out: "{1, 2, 2}"
    tex:
      in: \phi (\{2,4,6\})
      out: \{1,2,2\}
  sympy:
    in: "[totient(2), totient(4), totient(6)]"
    out: "AttributeError: 'list' object has no attribute 'is_integer'"
    verdict: error
    kind: threading
    note: compute-engine's Totient is Listable and threads over the list; SymPy's takes scalars only.
  sage:
    in: "[euler_phi(2), euler_phi(4), euler_phi(6)]"
  oscar:
    in: euler_phi(ZZ([2, 4, 6]))
  julia:
    in: euler_phi(ZZ([2, 4, 6]))
  mathlib4:
    in: (Nat.totient [2, 4, 6])
