- role: test
  id: extendedgcd-6-4
  expr: [ExtendedGCD, 6, 4]
  expected: [Tuple, 2, 1, -1]
- role: test
  id: a-real-two-argument-case-stays-unevaluated
  expr: [ExtendedGCD, 2.5, 3]
