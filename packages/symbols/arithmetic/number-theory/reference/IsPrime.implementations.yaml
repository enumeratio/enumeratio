    in: \mathrm{IsPrime}(\frac{1}{2})
    out: \bot
  traditional:
    in: \mathrm{IsPrime}(\frac{1}{2})
    out: \mathrm{False}
  fullform:
    in: PrimeQ[Rational[1, 2]]
  wolfram:
    in: PrimeQ[Rational[1, 2]]
  sympy:
    in: isprime(Rational(1, 2))
    out: "ValueError: 1/2 is not an integer"
    verdict: error
    kind: domain
    note: compute-engine answers False for a non-integer; SymPy's isprime raises.
  sage:
    in: is_prime((1/2))
  oscar:
    in: is_prime(ZZ((1 // 2)))
  julia:
    in: is_prime(ZZ((1 // 2)))
