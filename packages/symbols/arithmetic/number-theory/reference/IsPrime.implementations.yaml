    in: "(decide (Nat.Prime ((1 : ℚ) / 2)))"
  rust:
    in: is_prime(rational(n(1), n(2)))
    out: "panic: an integer, not 1/2"
    verdict: error
    kind: domain
    note: The Rust adapter takes integers here; compute-engine's IsPrime extends past them.
