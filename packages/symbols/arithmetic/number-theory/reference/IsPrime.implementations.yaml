1-is-not-prime-by-definition:
  wolfram:
    in: PrimeQ[1]
    out: False
    tex:
      in: \text{PrimeQ}[1]
      out: \text{False}
  sage:
    in: is_prime(1)
    out: False
  julia:
    in: is_prime(ZZ(1))
    out: "false"
  oscar:
    in: is_prime(ZZ(1))
    out: "false"
  mathlib4:
    in: (decide (Nat.Prime 1))
    out: "false"
  rust:
    in: is_prime(n(1))
    out: "false"
  sympy:
    in: isprime(1)
    out: False
