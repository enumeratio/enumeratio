the-mersenne-prime-2-31-1:
  wolfram:
    in: PrimeQ[Plus[Power[2, 31], -1]]
    out: True
    tex:
      in: \text{PrimeQ}\left[2^{31}-1\right]
      out: \text{True}
  sage:
    in: is_prime(((2^31) + -1))
    out: True
  julia:
    in: is_prime(ZZ(((big(2)^31) + -1)))
    out: "true"
  oscar:
    in: is_prime(ZZ(((big(2)^31) + -1)))
    out: "true"
  mathlib4:
    in: (decide (Nat.Prime ((2 ^ 31) + (-1))))
    out: failed to synthesize instance of type class
    verdict: error
    kind: domain
    note: The Mathlib mapping is over Nat, which has no negative numbers; compute-engine extends IsPrime to this argument.
  rust:
    in: is_prime((power(n(2), n(31)) + n(-1)))
    out: "true"
  sympy:
    in: isprime(((2**31) + (-1)))
    out: True
