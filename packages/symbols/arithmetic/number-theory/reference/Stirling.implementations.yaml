stirling-5-2:
  wolfram:
    in: StirlingS2[5, 2]
    out: "15"
    tex:
      in: \mathcal{S}_5^{(2)}
      out: "15"
  sage:
    in: stirling_number2(5, 2)
    out: "15"
  julia:
    in: Combinatorics.stirlings2(5, 2)
    out: "15"
  mathlib4:
    in: (Nat.stirlingSecond 5 2)
    out: "15"
  sympy:
    in: stirling(5, 2)
    out: "15"
