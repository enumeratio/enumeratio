    out: "0"
  traditional:
    in: \sum_{k=0}^4s(4, k)\left\lbrace\begin{matrix}k\\2\end{matrix}\right\rbrace
    out: "0"
  wolfram:
    in: Sum[Times[StirlingS1[4, k], StirlingS2[k, 2]], List[k, 0, 4]]
