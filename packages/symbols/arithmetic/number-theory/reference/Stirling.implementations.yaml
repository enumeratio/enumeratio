two-blocks-s-n-2-2-n-1-1:
  epsil:
    in: Stirling(10, 2) == 2 ^ 9 - 1
    out: True
  tex:
    in: \mathrm{Stirling}(10, 2)=2^9-1
    out: \top
  traditional:
    in: \left\lbrace\begin{matrix}10\\2\end{matrix}\right\rbrace=2^9-1
    out: \mathrm{True}
  wolfram:
    in: (StirlingS2[10, 2] == Subtract[Power[2, 9], 1])
    back: Unreadable
  sympy:
    in: enumeratio_equal(stirling(10, 2), ((2**9) - 1))
  sage:
    in: bool(stirling_number2(10, 2) == ((2^9) - 1))
  julia:
    in: (Combinatorics.stirlings2(10, 2) == ((big(2)^9) - 1))
  mathlib4:
    in: (decide ((Nat.stirlingSecond 10 2) = ((2 ^ 9) - 1)))
s-n-n-1-binom-n-2-one-block-is-a-pair:
  epsil:
    in: Stirling(6, 5) == Binomial(6, 2)
    out: True
  tex:
    in: \mathrm{Stirling}(6, 5)=\binom{6}{2}
    out: \top
  traditional:
    in: \left\lbrace\begin{matrix}6\\5\end{matrix}\right\rbrace=\binom{6}{2}
    out: \mathrm{True}
  wolfram:
    in: (StirlingS2[6, 5] == Binomial[6, 2])
    back: Unreadable
  sympy:
    in: enumeratio_equal(stirling(6, 5), binomial(6, 2))
  sage:
    in: bool(stirling_number2(6, 5) == binomial(6, 2))
  julia:
    in: (Combinatorics.stirlings2(6, 5) == binomial(ZZ(6), ZZ(2)))
  mathlib4:
    in: (decide ((Nat.stirlingSecond 6 5) = (Nat.choose 6 2)))
explicit-formula-s-n-k-frac-1-k-sum-j-1-k-j:
  epsil:
    in: Stirling(6, 3) == Sum((-1) ^ (3 - j) * Binomial(3, j) * j ^ 6, (j, 0, 3)) / 3!
    out: True
  tex:
    in: \mathrm{Stirling}(6, 3)=\frac{1}{3!}(\sum_{j=0}^3(-1)^{3-j}\binom{3}{j}j^6)
    out: \top
  traditional:
    in: \left\lbrace\begin{matrix}6\\3\end{matrix}\right\rbrace=\frac{1}{3!}(\sum_{j=0}^3(-1)^{3-j}\binom{3}{j}j^6)
    out: \mathrm{True}
  wolfram:
    in: (StirlingS2[6, 3] == Divide[Sum[Times[Power[-1, Subtract[3, j]], Binomial[3, j], Power[j, 6]], List[j, 0, 3]], Factorial[3]])
    back: Unreadable
orthogonality-with-stirlings1-sum-k-s-n-k-s-k-m:
