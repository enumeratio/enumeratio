threads-element-wise-over-a-list-as-wolfram-s:
  sympy:
    in: stirling([2, 4, 6], 2)
    out: "ValueError: [2, 4, 6] is not an integer"
    verdict: error
    kind: threading
    note: compute-engine's Stirling is Listable and threads over the list; SymPy's stirling takes scalars only.
two-blocks-s-n-2-2-n-1-1:
