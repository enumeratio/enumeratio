row-sums-give-the-bell-numbers:
  epsil:
    in: Sum(Stirling(4, k), (k, 0, 4)) == BellNumber(4)
    out: True
  tex:
    in: \sum_{k=0}^4\mathrm{Stirling}(4, k)=\mathrm{BellNumber}(4)
    out: \top
  traditional:
    in: \sum_{k=0}^4\left\lbrace\begin{matrix}4\\k\end{matrix}\right\rbrace=B_{4}
    out: \mathrm{True}
  wolfram:
    in: (Sum[StirlingS2[4, k], List[k, 0, 4]] == BellB[4])
    back: Unreadable
    out: True
    tex:
      in: \sum _{k=0}^4 \mathcal{S}_4^{(k)}=B_4
      out: \text{True}
