    out: \bigl\lbrack\mathrm{True}, \mathrm{True}, \mathrm{False}, \mathrm{True}, \mathrm{False}, \mathrm{True}\bigr\rbrack
  wolfram:
    in: PrimePowerQ[List[2, 4, 6, 9, 10, 16]]
