n-is-squarefree-exactly-when-mu-n-neq-0-see:
  wolfram:
    in: (SquareFreeQ[10] == Not[(MoebiusMu[10] == 0)])
    out: True
    tex:
      in: \text{SquareFreeQ}[10]=(\neg \mu (10)=0)
      out: \text{True}
threads-element-wise-over-a-list:
  wolfram:
    in: SquareFreeQ[List[10, 4, 12]]
    out: SquareFreeQ[{10, 4, 12}]
    tex:
      in: \text{SquareFreeQ}[\{10,4,12\}]
      out: \text{SquareFreeQ}[\{10,4,12\}]
    verdict: disagree
    kind: domain
    note: We thread over a List; Wolfram's SquareFreeQ takes a single number and leaves a list unevaluated.
