n-is-squarefree-exactly-when-mu-n-neq-0-see:
  epsil:
    in: IsSquareFree(10) == !(MoebiusMu(10) == 0)
    out: True
  tex:
    in: \mathrm{IsSquareFree}(10)=\lnot(\mathrm{MoebiusMu}(10)=0)
    out: \top
  traditional:
    in: \mathrm{IsSquareFree}(10)=\lnot(\mu(10)=0)
    out: \mathrm{True}
  fullform:
    in: Equal[SquareFreeQ[10], Not[Equal[MoebiusMu[10], 0]]]
  wolfram:
    in: (SquareFreeQ[10] == Not[(MoebiusMu[10] == 0)])
    out: True
    tex:
      in: \text{SquareFreeQ}[10]=(\neg \mu (10)=0)
      out: \text{True}
threads-element-wise-over-a-list:
  epsil:
    in: IsSquareFree([10, 4, 12])
    out: "[True, False, False]"
  tex:
    in: \mathrm{IsSquareFree}(\bigl\lbrack10, 4, 12\bigr\rbrack)
    out: \bigl\lbrack\top, \bot, \bot\bigr\rbrack
  traditional:
    in: \mathrm{IsSquareFree}(\bigl\lbrack10, 4, 12\bigr\rbrack)
    out: \bigl\lbrack\mathrm{True}, \mathrm{False}, \mathrm{False}\bigr\rbrack
  fullform:
    in: SquareFreeQ[List[10, 4, 12]]
  wolfram:
    in: SquareFreeQ[List[10, 4, 12]]
    out: SquareFreeQ[{10, 4, 12}]
    tex:
      in: \text{SquareFreeQ}[\{10,4,12\}]
      out: \text{SquareFreeQ}[\{10,4,12\}]
    verdict: disagree
    kind: domain
    note: We thread over a List; Wolfram's SquareFreeQ takes a single number and leaves a list unevaluated.
