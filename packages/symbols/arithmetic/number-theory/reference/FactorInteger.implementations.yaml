a-non-integer-real-stays-unevaluated:
  epsil:
    in: FactorInteger(2.5)
    out: FactorInteger(2.5)
  tex:
    in: \mathrm{FactorInteger}(2.5)
    out: \mathrm{FactorInteger}(2.5)
  fullform:
    in: FactorInteger[2.5]
  wolfram:
    in: FactorInteger[2.5]
  sage:
    in: list(factor(2.5))
    out: "[]"
    verdict: disagree
    kind: unevaluated
    note: "Here it's compute-engine that stays symbolic: FactorInteger is restricted to the integers and leaves FactorInteger(2.5) unevaluated, while Sage's factor() silently returns an empty list."
