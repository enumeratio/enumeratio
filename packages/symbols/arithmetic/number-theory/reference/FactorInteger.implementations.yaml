threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: FactorInteger([12, 18])
    out: "[[(2, 2), (3, 1)], [(2, 1), (3, 2)]]"
  tex:
    in: \mathrm{FactorInteger}(\bigl\lbrack12, 18\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack(2,2), (3,1)\bigr\rbrack, \bigl\lbrack(2,1), (3,2)\bigr\rbrack\bigr\rbrack
  fullform:
    in: FactorInteger[List[12, 18]]
  wolfram:
    in: FactorInteger[List[12, 18]]
    out: "{{{2, 2}, {3, 1}}, {{2, 1}, {3, 2}}}"
    tex:
      in: \text{FactorInteger}[\{12,18\}]
      out: \left( \begin{array}{cc}  \{2,2\} & \{3,1\} \\  \{2,1\} & \{3,2\} \\ \end{array} \right)
  sage:
    in: list(factor([12, 18]))
    out: "TypeError: unable to factor [12, 18]"
    verdict: error
    kind: threading
    note: compute-engine's FactorInteger is Listable and threads over the list; Sage's factor() takes a scalar only and raises a TypeError trying to factor the list.
5-i-1-2i-2-i:
  epsil:
    in: FactorInteger(5, GaussianIntegers -> True)
    out: "[(-i, 1), (1 + 2i, 1), (2 + i, 1)]"
  tex:
    in: \mathrm{FactorInteger}(5, \mathrm{KeyValuePair}(\mathrm{GaussianIntegers}, \top))
    out: \bigl\lbrack(-i,1), (1+2i,1), (2+i,1)\bigr\rbrack
  traditional:
    in: \mathrm{FactorInteger}(5, \mathrm{KeyValuePair}(\mathrm{GaussianIntegers}, \mathrm{True}))
    out: \bigl\lbrack(-i,1), (1+2i,1), (2+i,1)\bigr\rbrack
  fullform:
    in: FactorInteger[5, KeyValuePair[GaussianIntegers, True]]
3-4i-2-i-2:
  epsil:
    in: FactorInteger(3 + 4i)
    out: "[(2 + i, 2)]"
  tex:
    in: \mathrm{FactorInteger}(3+4i)
    out: \bigl\lbrack(2+i,2)\bigr\rbrack
  fullform:
    in: FactorInteger[Complex[3, 4]]
  wolfram:
    in: FactorInteger[Complex[3, 4]]
    out: "{{2 + I, 2}}"
    tex:
      in: \text{FactorInteger}[3+4 i]
      out: \left( \begin{array}{cc}  2+i & 2 \\ \end{array} \right)
  sage:
    in: list(factor((3 + 4*I)))
    out: "[(2*I - 1, 2)]"
    verdict: disagree
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so FactorInteger over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
a-21-digit-gaussian-integer-through-its-norm:
  epsil:
    in: FactorInteger(100_000_000_000_000_000_039 + 100_000_000_000_000_000_129i)
    out: |-
      [(-i, 1), (1 + i, 1), (99 + 34i, 1), (1_538 + 213i, 1), (277_789_996_706_096 +
                                                               549_000_467_740_335i, 1)]
  tex:
    in: \mathrm{FactorInteger}(100\,000\,000\,000\,000\,000\,039+100\,000\,000\,000\,000\,000\,129i)
    out: \bigl\lbrack(-i,1), (1+i,1), (99+34i,1), (1\,538+213i,1), (277\,789\,996\,706\,096+549\,000\,467\,740\,335i,1)\bigr\rbrack
  fullform:
    in: FactorInteger[Complex[100000000000000000039, 100000000000000000129]]
    back: [FactorInteger, [Complex, 100000000000000000000, 100000000000000000000]]
  wolfram:
    in: FactorInteger[Complex[100000000000000000039, 100000000000000000129]]
    out: "{{-I, 1}, {1 + I, 1}, {99 + 34*I, 1}, {1538 + 213*I, 1}, {277789996706096 + 549000467740335*I, 1}}"
    tex:
      in: \text{FactorInteger}[100000000000000000039+100000000000000000129 i]
      out: \left( \begin{array}{cc}  -i & 1 \\  1+i & 1 \\  99+34 i & 1 \\  1538+213 i & 1 \\  277789996706096+549000467740335 i & 1 \\ \end{array} \right)
  sage:
    in: list(factor((100000000000000000039 + 100000000000000000129*I)))
    out: "[(-34*I - 99, 1), (I - 1, 1), (213*I + 1538, 1), (-277789996706096*I + 549000467740335, 1)]"
    verdict: disagree
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so FactorInteger over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
