factorinteger-360:
  epsil:
    in: FactorInteger(360)
    out: "[(2, 3), (3, 2), (5, 1)]"
  tex:
    in: \mathrm{FactorInteger}(360)
    out: \bigl\lbrack(2,3), (3,2), (5,1)\bigr\rbrack
  fullform:
    in: FactorInteger[360]
  wolfram:
    in: FactorInteger[360]
    out: "{{2, 3}, {3, 2}, {5, 1}}"
    tex:
      in: \text{FactorInteger}[360]
      out: \left( \begin{array}{cc}  2 & 3 \\  3 & 2 \\  5 & 1 \\ \end{array} \right)
  sage:
    in: list(factor(360))
    out: "[(2, 3), (3, 2), (5, 1)]"
