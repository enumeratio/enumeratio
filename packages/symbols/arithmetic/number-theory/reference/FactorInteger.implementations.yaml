9-12i-3-2-i-2:
  epsil:
    in: FactorInteger(9 + 12i)
    out: "[(2 + i, 2), (3, 1)]"
  tex:
    in: \mathrm{FactorInteger}(9+12i)
    out: \bigl\lbrack(2+i,2), (3,1)\bigr\rbrack
  fullform:
    in: FactorInteger[Complex[9, 12]]
  wolfram:
    in: FactorInteger[Complex[9, 12]]
  sage:
    in: list(factor((9 + 12*I)))
    out: "[(2*I - 1, 2), (3, 1)]"
    verdict: disagree
    kind: convention
    note: A Gaussian factorization is defined up to units; compute-engine normalises the Gaussian prime into the first quadrant as 2 + i, while Sage's factor() returns the associate 2*I - 1.
