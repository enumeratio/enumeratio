multiplying-the-p-e-factors-back-together:
  epsil:
    in: 2 ^ 3 * 3 ^ 2 * 5 == 360
    out: True
  tex:
    in: 2^3\times3^2\times5=360
    out: \top
  traditional:
    in: 2^3\times3^2\times5=360
    out: \mathrm{True}
  fullform:
    in: Equal[Times[Power[2, 3], Power[3, 2], 5], 360]
  wolfram:
    in: (Times[Power[2, 3], Power[3, 2], 5] == 360)
    out: True
    tex:
      in: 2^3 3^2 5=360
      out: \text{True}
  sympy:
    in: enumeratio_equal(((S(2)**3) * (S(3)**2) * 5), 360)
    out: True
  mpmath:
    in: almosteq((((2)**3) * ((3)**2) * 5), 360, 1e-20)
    out: True
  sage:
    in: bool((((2)^3) * ((3)^2) * 5) == 360)
    out: True
  oscar:
    in: (((big(2)^3) * (big(3)^2) * 5) == 360)
    out: "true"
  julia:
    in: (((big(2)^3) * (big(3)^2) * 5) == 360)
    out: "true"
  mathlib4:
    in: (decide (((2 ^ 3) * (3 ^ 2) * 5) = 360))
    out: "true"
  rust:
    in: equal((power(n(2), n(3)) * power(n(3), n(2)) * n(5)), n(360))
    out: "true"
compute-engine-returns-the-trivial-factor-1-1:
  epsil:
    in: FactorInteger(1)
    out: "[(1, 1)]"
  tex:
    in: \mathrm{FactorInteger}(1)
    out: \bigl\lbrack(1,1)\bigr\rbrack
  fullform:
    in: FactorInteger[1]
  wolfram:
    in: FactorInteger[1]
    out: "{{1, 1}}"
    tex:
      in: \text{FactorInteger}[1]
      out: \left( \begin{array}{cc}  1 & 1 \\ \end{array} \right)
  sage:
    in: list(factor(1))
    out: "[]"
    verdict: disagree
    kind: shape
    note: Sage's factor() leaves out the unit — factor(1) is the empty product and factor(-60) has no (-1, 1) term — where FactorInteger lists it explicitly, as Wolfram does.
0-is-represented-as-0-1:
