name: IsPrimePower
domain: Number theory
signature: IsPrimePower(n)
summary: Tests whether $n$ is a positive integer power of a single prime.
signatures:
  - call: IsPrimePower(n)
    description: $n = p^k$ for a prime $p$, $k \ge 1$
    library: enumeratio-number-theory
details:
  - '$1=p^0$ does not count: it has no prime base.'
  - Wolfram's `PrimePowerQ`.
examples:
  - id: 8-2-3
    expr: [IsPrimePower, 8]
    expected: True
    caption: $8=2^3$
  - id: 12-2-2-cdot-3-has-two-distinct-primes
    expr: [IsPrimePower, 12]
    expected: False
    caption: $12=2^2\cdot3$ has two distinct primes
  - id: a-prime-is-its-own-first-power
    expr: [IsPrimePower, 7]
    expected: True
    caption: A prime is its own first power
  - id: 1-is-p-0-which-does-not-count
    expr: [IsPrimePower, 1]
    expected: False
    category: Possible issues
    caption: 1 is $p^0$, which does not count
  - id: listable
    expr: [IsPrimePower, [List, 2, 4, 6, 9, 10, 16]]
    expected: [List, True, True, False, True, False, True]
    category: Scope
    caption: Listable
  - id: large-integers
    expr: [IsPrimePower, [Power, 3, 40]]
    expected: True
    category: Scope
    caption: Large integers
seeAlso:
  - IsPrime
  - FactorInteger
