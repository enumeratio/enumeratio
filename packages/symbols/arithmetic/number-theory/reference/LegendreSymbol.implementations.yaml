euler-s-criterion-a-p-equiv-a-p-1-2-pmod-p-here:
  epsil:
    in: LegendreSymbol(3, 7) == PowerMod(3, 3, 7) - 7
    out: True
  tex:
    in: \mathrm{LegendreSymbol}(3, 7)=\mathrm{PowerMod}(3, 3, 7)-7
    out: \top
  traditional:
    in: \left(\frac{3}{7}\right)=\left(3^3\bmod 7\right)-7
    out: \mathrm{True}
  wolfram:
    in: (JacobiSymbol[3, 7] == Subtract[PowerMod[3, 3, 7], 7])
    back: Unreadable
listable-in-n-the-residues-mod-7-are-1-2-4:
  epsil:
    in: LegendreSymbol([1, 2, 3, 4, 5, 6], 7)
    out: "[1, 1, -1, 1, -1, -1]"
  tex:
    in: \mathrm{LegendreSymbol}(\bigl\lbrack1, 2, 3, 4, 5, 6\bigr\rbrack, 7)
    out: \bigl\lbrack1, 1, -1, 1, -1, -1\bigr\rbrack
  wolfram:
    in: JacobiSymbol[List[1, 2, 3, 4, 5, 6], 7]
    back: [JacobiSymbol, [List, 1, 2, 3, 4, 5, 6], 7]
