2-is-a-quadratic-residue-mod-7-32-2-mod-7:
  epsil:
    in: LegendreSymbol(2, 7)
    out: "1"
  tex:
    in: \mathrm{LegendreSymbol}(2, 7)
    out: "1"
  traditional:
    in: \left(\frac{2}{7}\right)
    out: "1"
  wolfram:
    in: JacobiSymbol[2, 7]
    back: [JacobiSymbol, 2, 7]
    out: "1"
    tex:
      in: \left(\frac{2}{7}\right)
      out: "1"
