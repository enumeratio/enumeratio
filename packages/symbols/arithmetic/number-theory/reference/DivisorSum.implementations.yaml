sigma-2-20-see-divisorsigma:
  epsil:
    in: DivisorSum(20, Function(d ^ 2, d))
    out: "546"
    back: Unreadable
  tex:
    in: \mathrm{DivisorSum}(20, d\mapsto d^2)
    out: "546"
  fullform:
    in: DivisorSum[20, Function[d, Power[d, 2]]]
    back: [DivisorSum, 20, [Function, d, [Power, d, 2]]]
  wolfram:
    in: DivisorSum[20, Function[d, Power[d, 2]]]
    out: "546"
    tex:
      in: \sum _{\unicode{f80d}|20} \unicode{f80d}^2
      out: "546"
