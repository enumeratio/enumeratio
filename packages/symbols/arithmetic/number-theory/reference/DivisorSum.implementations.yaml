    in: DivisorSum(20, Function(d ^ 2, d))
    out: "546"
    back: Unreadable
  tex:
    in: \mathrm{DivisorSum}(20, d\mapsto d^2)
    out: "546"
  fullform:
    in: DivisorSum[20, Function[Power[d, 2], d]]
