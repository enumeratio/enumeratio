name: HermiteDecomposition
domain: Number theory
signature: HermiteDecomposition(m)
summary: $\{u, h\}$ with $u$ unimodular and $u \cdot m = h$ upper triangular in Hermite normal form.
signatures:
  - call: HermiteDecomposition(m)
    description: a unimodular $u$ and $h = u \cdot m$ in Hermite normal form
    library: enumeratio-number-theory
details:
  - $h$ is upper triangular with positive pivots, and every entry above a pivot is reduced into $[0, \text{pivot})$ — the row-reduced convention that makes $h$ unique for a given $m$.
  - '$u \in GL_n(\mathbb{Z})$: $\det u = \pm 1$, so $u$ is invertible over $\mathbb{Z}$, not merely over $\mathbb{Q}$.'
  - Used by [[ProfiniteDecomposition]] to put a matrix over $\hat{\mathbb{Q}}$ into strong-approximation form (Hertogh's Algorithm 8.4).
examples:
  - id: hermitedecomposition-list-list-0-neg-3-list-2-0
    expr: [HermiteDecomposition, [List, [List, 0, -3], [List, 2, 0]]]
    expected: [List, [List, [List, 0, 1], [List, -1, 0]], [List, [List, 2, 0], [List, 0, 3]]]
  - id: hermitedecomposition-list-list-1-2-list-3-4
    expr: [HermiteDecomposition, [List, [List, 1, 2], [List, 3, 4]]]
    expected: [List, [List, [List, -2, 1], [List, 3, -1]], [List, [List, 1, 0], [List, 0, 2]]]
  - id: 3-times-3-det-u-1
    expr: [HermiteDecomposition, [List, [List, 1, 2, 3], [List, 4, 5, 6], [List, 7, 8, 10]]]
    expected:
      [
        List,
        [List, [List, -2, 6, -3], [List, -2, 11, -6], [List, 1, -2, 1]],
        [List, [List, 1, 2, 0], [List, 0, 3, 0], [List, 0, 0, 1]],
      ]
    category: Scope
    caption: $3\times3$, $\det u=-1$
  - id: rectangular-the-column-without-a-pivot-is-left
    expr: [HermiteDecomposition, [List, [List, 2, 3, 5], [List, 7, 11, 13]]]
    expected: [List, [List, [List, 11, -3], [List, -7, 2]], [List, [List, 1, 0, 16], [List, 0, 1, -9]]]
    category: Scope
    caption: "Rectangular: the column without a pivot is left unreduced"
  - id: singular-h-gains-a-zero-row-and-u-is-no-longer
    expr: [HermiteDecomposition, [List, [List, 1, 2], [List, 2, 4]]]
    expected: [List, [List, [List, 1, 0], [List, -2, 1]], [List, [List, 1, 2], [List, 0, 0]]]
    category: Possible issues
    caption: "Singular: $h$ gains a zero row, and $u$ is no longer unique"
  - role: test
    id: another-3-times-3-full-rank-case
    expr: [HermiteDecomposition, [List, [List, 2, 3, 5], [List, 7, 11, 13], [List, 17, 19, 23]]]
    expected:
      [
        List,
        [List, [List, 11, -3, 0], [List, 47, -11, -1], [List, 54, -13, -1]],
        [List, [List, 1, 0, 16], [List, 0, 1, 69], [List, 0, 0, 78]],
      ]
    category: Scope
    caption: Another $3\times3$, full-rank case
seeAlso:
  - ProfiniteDecomposition
  - ExtendedGCD
