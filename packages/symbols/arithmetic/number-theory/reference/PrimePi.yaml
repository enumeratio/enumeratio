name: PrimePi
domain: Number theory
signature: PrimePi(n)
summary: "The prime-counting function: how many primes are ≤ n."
signatures:
  - call: PrimePi(n)
    description: count of primes $\le n$.
details:
  - 'Inverse of [[NthPrime]]: $\pi(p_n)=n$.'
  - Asymptotically $\pi(x)\sim x/\ln x$, the prime number theorem.
  - n need not be an integer or prime itself -- PrimePi(n) counts primes up to whatever real value is given.
  - Threads element-wise over a list, as Wolfram's Listable heads do.
examples:
  - id: no-primes-are-1
    expr: [PrimePi, 1]
    expected: 0
    caption: No primes are ≤ 1
  - id: primepi-2
    expr: [PrimePi, 2]
    expected: 1
  - id: primepi-15
    expr: [PrimePi, 15]
    expected: 6
  - id: primepi-100
    expr: [PrimePi, 100]
    expected: 25
  - id: same-inverse-relation-viewed-from-primepi-s-side
    expr: [Equal, [PrimePi, [NthPrime, 50]], 50]
    expected: True
    category: Properties
    caption: Same inverse relation viewed from PrimePi's side. See [[NthPrime]]
  - id: threads-element-wise-over-a-list-as-wolfram-s
    expr: [PrimePi, [List, 10, 100]]
    expected: [List, 4, 25]
    category: Scope
    caption: Threads element-wise over a list, as Wolfram's Listable heads do
  - id: rational-arguments-the-primes-up-to-7-2-are-2
    expr: [PrimePi, [Rational, 7, 2]]
    expected: 2
    category: Scope
    caption: "Rational arguments: the primes up to $7/2$ are 2 and 3"
  - id: real-arguments
    expr: [PrimePi, 15.25]
    expected: 6
    category: Scope
    caption: Real arguments
  - id: the-primes-below-a-million
    expr: [PrimePi, 1000000]
    expected: 78498
    category: Scope
    caption: The primes below a million
  - id: listable-threads-over-a-list
    expr: [PrimePi, [List, 3, 5, 17, 25]]
    expected: [List, 2, 3, 7, 9]
    category: Scope
    caption: "Listable: threads over a list"
  - id: no-primes-are-a-negative-number
    expr: [PrimePi, -1]
    expected: 0
    category: Possible issues
    caption: No primes are ≤ a negative number
seeAlso:
  - NthPrime
  - NextPrime
