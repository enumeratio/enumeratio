  tex:
    in: \mathrm{HermiteDecomposition}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\bigl\lbrack-2, 1\bigr\rbrack, \bigl\lbrack3, -1\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack1, 0\bigr\rbrack, \bigl\lbrack0, 2\bigr\rbrack\bigr\rbrack\bigr\rbrack
  wolfram:
    in: HermiteDecomposition[List[List[1, 2], List[3, 4]]]
