hermitedecomposition-list-list-0-neg-3-list-2-0:
  epsil:
    in: HermiteDecomposition([[0, -3], [2, 0]])
    out: "[[[0, 1], [-1, 0]], [[2, 0], [0, 3]]]"
  tex:
    in: \mathrm{HermiteDecomposition}(\bigl\lbrack\bigl\lbrack0, -3\bigr\rbrack, \bigl\lbrack2, 0\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\bigl\lbrack0, 1\bigr\rbrack, \bigl\lbrack-1, 0\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack2, 0\bigr\rbrack, \bigl\lbrack0, 3\bigr\rbrack\bigr\rbrack\bigr\rbrack
  wolfram:
    in: HermiteDecomposition[List[List[0, -3], List[2, 0]]]
    out: "{{{0, 1}, {-1, 0}}, {{2, 0}, {0, 3}}}"
    tex:
      in: \text{HermiteDecomposition}\left[\left( \begin{array}{cc}  0 & -3 \\  2 & 0 \\ \end{array} \right)\right]
      out: \left( \begin{array}{cc}  \{0,1\} & \{-1,0\} \\  \{2,0\} & \{0,3\} \\ \end{array} \right)
hermitedecomposition-list-list-1-2-list-3-4:
