the-factorial-form-frac-k-1-k-2-k-3-k-1-k-2-k-3:
  epsil:
    in: Multinomial(3, 4, 5) == 12! / (3! * 4! * 5!)
    out: True
  tex:
    in: \mathrm{Multinomial}(3, 4, 5)=(12!)(3!\times4!\times5!)^{-1}
    out: \top
  traditional:
    in: \binom{12}{3,4,5}=(12!)(3!\times4!\times5!)^{-1}
    out: \mathrm{True}
  fullform:
    in: Equal[Multinomial[3, 4, 5], Divide[Factorial[12], Times[Factorial[3], Factorial[4], Factorial[5]]]]
  wolfram:
    in: (Multinomial[3, 4, 5] == Divide[Factorial[12], Times[Factorial[3], Factorial[4], Factorial[5]]])
