with-two-arguments-it-reduces-to-binomial-binom:
  epsil:
    in: Multinomial(7, 3) == Binomial(10, 3)
    out: True
  tex:
    in: \mathrm{Multinomial}(7, 3)=\binom{10}{3}
    out: \top
  traditional:
    in: \binom{10}{7,3}=\binom{10}{3}
    out: \mathrm{True}
  fullform:
    in: Equal[Multinomial[7, 3], Binomial[10, 3]]
  wolfram:
    in: (Multinomial[7, 3] == Binomial[10, 3])
    out: True
    tex:
      in: (10;7,3)=\binom{10}{3}
      out: \text{True}
orderless-permuting-the-arguments-doesn-t-change:
  epsil:
    in: Multinomial(1, 2, 3) == Multinomial(3, 1, 2)
    out: True
  tex:
    in: \mathrm{Multinomial}(1, 2, 3)=\mathrm{Multinomial}(3, 1, 2)
    out: \top
  traditional:
    in: \binom{6}{1,2,3}=\binom{6}{3,1,2}
    out: \mathrm{True}
  fullform:
    in: Equal[Multinomial[1, 2, 3], Multinomial[3, 1, 2]]
  wolfram:
    in: (Multinomial[1, 2, 3] == Multinomial[3, 1, 2])
    out: True
    tex:
      in: (6;1,2,3)=(6;3,1,2)
      out: \text{True}
