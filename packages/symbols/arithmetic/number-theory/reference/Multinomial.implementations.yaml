    in: Multinomial([2, 3, 5], 3)
    out: "[10, 20, 56]"
  tex:
    in: \mathrm{Multinomial}(\bigl\lbrack2, 3, 5\bigr\rbrack, 3)
    out: \bigl\lbrack10, 20, 56\bigr\rbrack
  fullform:
    in: Multinomial[List[2, 3, 5], 3]
  wolfram:
    in: Multinomial[List[2, 3, 5], 3]
    out: "{10, 20, 56}"
    tex:
      in: (\{2,3,5\}+3;\{2,3,5\},3)
      out: \{10,20,56\}
