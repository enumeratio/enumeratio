adele-with-a-profinite-finite-part:
  epsil:
    in: Adele(3, ProfiniteNumber(2, 7))
    out: Adele(3, ProfiniteNumber(2, 7))
  tex:
    in: \mathrm{Adele}(3, \mathrm{ProfiniteNumber}(2, 7))
    out: \mathrm{Adele}(3, \mathrm{ProfiniteNumber}(2, 7))
  fullform:
    in: Adele[3, ProfiniteNumber[2, 7]]
  sage:
    in: Adeles(QQ)([3], Qhat(2, 7))
    out: (3, 2 mod 7)
principal-adele-of-a-rational:
  epsil:
    in: Adele(2 / 5)
    out: Adele(2 / 5, 2 / 5)
  tex:
    in: \mathrm{Adele}(\frac{2}{5})
    out: \mathrm{Adele}(\frac{2}{5}, \frac{2}{5})
  fullform:
    in: Adele[Rational[2, 5]]
  sage:
    in: Adeles(QQ)((2/5))
    out: (0.4000000000000000?, 2/5)
adding-two-adeles-with-profinite-parts:
  epsil:
    in: Adele(1, ProfiniteNumber(1, 6)) + Adele(2, ProfiniteNumber(2, 9))
    out: Adele(3, ProfiniteNumber(0, 3))
  tex:
    in: \mathrm{Adele}(1, \mathrm{ProfiniteNumber}(1, 6))+\mathrm{Adele}(2, \mathrm{ProfiniteNumber}(2, 9))
    out: \mathrm{Adele}(3, \mathrm{ProfiniteNumber}(0, 3))
  fullform:
    in: Plus[Adele[1, ProfiniteNumber[1, 6]], Adele[2, ProfiniteNumber[2, 9]]]
  sage:
    in: (Adeles(QQ)([1], Qhat(1, 6)) + Adeles(QQ)([2], Qhat(2, 9)))
    out: (3, 0 mod 3)
multiplying-an-adele-by-a-principal-one:
  epsil:
    in: Adele(2, ProfiniteNumber(1, 6)) * Adele(3)
    out: Adele(6, ProfiniteNumber(3, 18))
  tex:
    in: \mathrm{Adele}(2, \mathrm{ProfiniteNumber}(1, 6))\mathrm{Adele}(3)
    out: \mathrm{Adele}(6, \mathrm{ProfiniteNumber}(3, 18))
  fullform:
    in: Times[Adele[2, ProfiniteNumber[1, 6]], Adele[3]]
  sage:
    in: (Adeles(QQ)([2], Qhat(1, 6)) * Adeles(QQ)(3))
    out: (6, 3 mod 18)
negating-an-adele-with-a-profinite-finite-part:
  epsil:
    in: -Adele(3, ProfiniteNumber(2, 7))
    out: Adele(-3, ProfiniteNumber(5, 7))
  tex:
    in: -\mathrm{Adele}(3, \mathrm{ProfiniteNumber}(2, 7))
    out: \mathrm{Adele}(-3, \mathrm{ProfiniteNumber}(5, 7))
  fullform:
    in: Minus[Adele[3, ProfiniteNumber[2, 7]]]
  sage:
    in: (-Adeles(QQ)([3], Qhat(2, 7)))
    out: (-3, 5 mod 7)
