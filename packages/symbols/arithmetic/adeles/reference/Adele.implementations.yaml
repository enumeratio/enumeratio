    out: \mathrm{Adele}(-1, -\frac{5}{2})
  fullform:
    in: Adele[Idele[-1, Rational[-5, 2]]]
  sage:
    in: Adeles(QQ)(Ideles(QQ)([-1], (-5/2)))
    out: (-1, -5/2)
