the-principal-adele-5-at-every-place:
  epsil:
    in: Adele(5)
    out: Adele(5, 5)
  tex:
    in: \mathrm{Adele}(5)
    out: \mathrm{Adele}(5, 5)
  fullform:
    in: Adele[5]
  sage:
    in: Adeles(QQ)(5)
adele-2-profinitenumber-1-6-times-3:
  epsil:
    in: Adele(2, ProfiniteNumber(1, 6)) * 3
    out: Adele(6, ProfiniteNumber(3, 18))
  tex:
    in: 3\mathrm{Adele}(2, \mathrm{ProfiniteNumber}(1, 6))
    out: \mathrm{Adele}(6, \mathrm{ProfiniteNumber}(3, 18))
  fullform:
    in: Times[Adele[2, ProfiniteNumber[1, 6]], 3]
  sage:
    in: (Adeles(QQ)([2], Qhat(1, 6)) * 3)
the-adele-underlying-an-idele:
  epsil:
    in: Adele(Idele(1, 1, [AdicNumeral(3, 2, 2)]))
    out: Adele(1, ProfiniteNumber(11, 18))
  tex:
    in: \mathrm{Adele}(\mathrm{Idele}(1, 1, \bigl\lbrack\mathrm{AdicNumeral}(3, 2, 2)\bigr\rbrack))
    out: \mathrm{Adele}(1, \mathrm{ProfiniteNumber}(11, 18))
  fullform:
    in: Adele[Idele[1, 1, List[AdicNumeral[3, 2, 2]]]]
adding-a-principal-adele-and-one-carrying-pi:
  epsil:
    in: Adele(5) + Adele(Pi, ProfiniteNumber(1, 6))
    out: Adele(5 + Pi, ProfiniteNumber(0, 6))
  tex:
    in: \mathrm{Adele}(5)+\mathrm{Adele}(\pi, \mathrm{ProfiniteNumber}(1, 6))
    out: \mathrm{Adele}(5+\pi, \mathrm{ProfiniteNumber}(0, 6))
  fullform:
    in: Plus[Adele[5], Adele[Pi, ProfiniteNumber[1, 6]]]
  sage:
    in: (Adeles(QQ)(5) + Adeles(QQ)([pi], Qhat(1, 6)))
equal-adeles-need-not-share-a-modulus:
  epsil:
    in: Adele(1, ProfiniteNumber(2, 6)) == Adele(1, ProfiniteNumber(5, 9))
    out: True
  tex:
    in: \mathrm{Adele}(1, \mathrm{ProfiniteNumber}(2, 6))=\mathrm{Adele}(1, \mathrm{ProfiniteNumber}(5, 9))
    out: \top
  traditional:
    in: \mathrm{Adele}(1, \mathrm{ProfiniteNumber}(2, 6))=\mathrm{Adele}(1, \mathrm{ProfiniteNumber}(5, 9))
    out: \mathrm{True}
  fullform:
    in: Equal[Adele[1, ProfiniteNumber[2, 6]], Adele[1, ProfiniteNumber[5, 9]]]
  sage:
    in: bool(Adeles(QQ)([1], Qhat(2, 6)) == Adeles(QQ)([1], Qhat(5, 9)))
unequal-real-parts-are-not-equal:
  epsil:
    in: Adele(2, ProfiniteNumber(2, 6)) == Adele(1, ProfiniteNumber(5, 9))
    out: False
  tex:
    in: \mathrm{Adele}(2, \mathrm{ProfiniteNumber}(2, 6))=\mathrm{Adele}(1, \mathrm{ProfiniteNumber}(5, 9))
    out: \bot
  traditional:
    in: \mathrm{Adele}(2, \mathrm{ProfiniteNumber}(2, 6))=\mathrm{Adele}(1, \mathrm{ProfiniteNumber}(5, 9))
    out: \mathrm{False}
  fullform:
    in: Equal[Adele[2, ProfiniteNumber[2, 6]], Adele[1, ProfiniteNumber[5, 9]]]
  sage:
    in: bool(Adeles(QQ)([2], Qhat(2, 6)) == Adeles(QQ)([1], Qhat(5, 9)))
an-adele-and-a-bare-profinite-don-t-combine:
  epsil:
    in: Adele(1, ProfiniteNumber(2, 6)) + ProfiniteNumber(1, 6)
    out: ProfiniteNumber(1, 6) + Adele(1, ProfiniteNumber(2, 6))
  tex:
    in: \mathrm{Adele}(1, \mathrm{ProfiniteNumber}(2, 6))+\mathrm{ProfiniteNumber}(1, 6)
    out: \mathrm{ProfiniteNumber}(1, 6)+\mathrm{Adele}(1, \mathrm{ProfiniteNumber}(2, 6))
  fullform:
    in: Plus[Adele[1, ProfiniteNumber[2, 6]], ProfiniteNumber[1, 6]]
  sage:
    in: (Adeles(QQ)([1], Qhat(2, 6)) + Qhat(1, 6))
golden-idele-to-adele-1:
