- id: the-principal-adele-5-at-every-place
  expr: [Adele, 5]
  expected: [Adele, 5, 5]
  caption: "the principal adèle: 5 at every place"
- id: adele-2-profinitenumber-1-6-times-3
  expr: [Multiply, [Adele, 2, [ProfiniteNumber, 1, 6]], 3]
  expected: [Adele, 6, [ProfiniteNumber, 3, 18]]
- id: the-adele-underlying-an-idele
  expr: [Adele, [Idele, 1, 1, [List, [AdicNumeral, 3, 2, 2]]]]
  expected: [Adele, 1, [ProfiniteNumber, 11, 18]]
  caption: the adèle underlying an idèle
  category: Scope
- id: adding-a-principal-adele-and-one-carrying-pi
  expr: [Add, [Adele, 5], [Adele, Pi, [ProfiniteNumber, 1, 6]]]
  expected: [Adele, [Add, 5, Pi], [ProfiniteNumber, 0, 6]]
- id: equal-adeles-need-not-share-a-modulus
  expr: [Equal, [Adele, 1, [ProfiniteNumber, 2, 6]], [Adele, 1, [ProfiniteNumber, 5, 9]]]
  expected: True
  caption: equal adèles need not share a modulus
- id: unequal-real-parts-are-not-equal
  expr: [Equal, [Adele, 2, [ProfiniteNumber, 2, 6]], [Adele, 1, [ProfiniteNumber, 5, 9]]]
  expected: False
- id: an-adele-and-a-bare-profinite-don-t-combine
  expr: [Add, [Adele, 1, [ProfiniteNumber, 2, 6]], [ProfiniteNumber, 1, 6]]
  expected: [Add, [ProfiniteNumber, 1, 6], [Adele, 1, [ProfiniteNumber, 2, 6]]]
  caption: an adèle and a bare profinite number do not combine
  category: Possible issues
- id: golden-idele-to-adele-1
  expr: [Adele, [Idele, -1, [Rational, -5, 2]]]
  expected: [Adele, -1, [Rational, -5, 2]]
  caption: an idele's underlying adele forgets the idele structure (-1 at infinity, ['Rational', -5, 2] finite)
  role: test
- id: golden-idele-to-adele-2
  expr: [Adele, [Idele, -1, [Rational, 4, 3]]]
  expected: [Adele, -1, [Rational, 4, 3]]
  caption: an idele's underlying adele forgets the idele structure (-1 at infinity, ['Rational', 4, 3] finite)
  role: test
- id: golden-idele-to-adele-3
  expr: [Adele, [Idele, -1, -1]]
  expected: [Adele, -1, -1]
  caption: an idele's underlying adele forgets the idele structure (-1 at infinity, -1 finite)
  role: test
- id: golden-idele-to-adele-4
  expr: [Adele, [Idele, 1, 2]]
  expected: [Adele, 1, 2]
  caption: an idele's underlying adele forgets the idele structure (1 at infinity, 2 finite)
  role: test
- id: golden-idele-to-adele-5
  expr: [Adele, [Idele, -1, [Rational, -2, 3]]]
  expected: [Adele, -1, [Rational, -2, 3]]
  caption: an idele's underlying adele forgets the idele structure (-1 at infinity, ['Rational', -2, 3] finite)
  role: test
- id: golden-idele-to-adele-6
  expr: [Adele, [Idele, -1, -7]]
  expected: [Adele, -1, -7]
  caption: an idele's underlying adele forgets the idele structure (-1 at infinity, -7 finite)
  role: test
- id: golden-idele-to-adele-7
  expr: [Adele, [Idele, 1, 5]]
  expected: [Adele, 1, 5]
  caption: an idele's underlying adele forgets the idele structure (1 at infinity, 5 finite)
  role: test
- id: golden-idele-to-adele-8
  expr: [Adele, [Idele, 1, [Rational, 5, 4]]]
  expected: [Adele, 1, [Rational, 5, 4]]
  caption: an idele's underlying adele forgets the idele structure (1 at infinity, ['Rational', 5, 4] finite)
  role: test
- id: golden-idele-to-adele-9
  expr: [Adele, [Idele, 1, [Rational, -7, 2]]]
  expected: [Adele, 1, [Rational, -7, 2]]
  caption: an idele's underlying adele forgets the idele structure (1 at infinity, ['Rational', -7, 2] finite)
  role: test
- id: golden-idele-to-adele-10
  expr: [Adele, [Idele, 1, -1]]
  expected: [Adele, 1, -1]
  caption: an idele's underlying adele forgets the idele structure (1 at infinity, -1 finite)
  role: test
- id: adele-with-a-profinite-finite-part
  expr: [Adele, 3, [ProfiniteNumber, 2, 7]]
  expected: [Adele, 3, [ProfiniteNumber, 2, 7]]
  caption: real 3 beside a genuinely profinite (not exact) finite part
  role: test
- id: principal-adele-of-a-rational
  expr: [Adele, [Rational, 2, 5]]
  expected: [Adele, [Rational, 2, 5], [Rational, 2, 5]]
  caption: "the principal adele of a rational: the same value at every place"
  role: test
- id: adding-two-adeles-with-profinite-parts
  expr: [Add, [Adele, 1, [ProfiniteNumber, 1, 6]], [Adele, 2, [ProfiniteNumber, 2, 9]]]
  expected: [Adele, 3, [ProfiniteNumber, 0, 3]]
  caption: real parts add, finite parts add (and the modulus shrinks to the gcd)
  role: test
- id: multiplying-an-adele-by-a-principal-one
  expr: [Multiply, [Adele, 2, [ProfiniteNumber, 1, 6]], [Adele, 3]]
  expected: [Adele, 6, [ProfiniteNumber, 3, 18]]
  caption: multiplying by a principal adele scales both parts
  role: test
- id: negating-an-adele-with-a-profinite-finite-part
  expr: [Negate, [Adele, 3, [ProfiniteNumber, 2, 7]]]
  expected: [Adele, -3, [ProfiniteNumber, 5, 7]]
  caption: negation threads over the real and finite parts separately
  role: test
