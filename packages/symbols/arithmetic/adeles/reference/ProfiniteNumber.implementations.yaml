    in: ProfiniteNumber(6, 20) == ProfiniteNumber(6, 40)
    out: True
  tex:
    in: \mathrm{ProfiniteNumber}(6, 20)=\mathrm{ProfiniteNumber}(6, 40)
    out: \top
  traditional:
    in: \mathrm{ProfiniteNumber}(6, 20)=\mathrm{ProfiniteNumber}(6, 40)
    out: \mathrm{True}
  fullform:
    in: Equal[ProfiniteNumber[6, 20], ProfiniteNumber[6, 40]]
  sage:
    in: bool(Qhat(6, 20) == Qhat(6, 40))
