    in: \mathrm{PowerModList}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \frac{1}{2}, 5)
    out: \bigl\lbrack\bigl\lbrack1, 4\bigr\rbrack, \bigl\lbrack \bigr\rbrack, \bigl\lbrack \bigr\rbrack, \bigl\lbrack2, 3\bigr\rbrack\bigr\rbrack
  fullform:
    in: PowerModList[List[1, 2, 3, 4], Rational[1, 2], 5]
  wolfram:
    in: PowerModList[List[1, 2, 3, 4], Rational[1, 2], 5]
    out: PowerModList[{1, 2, 3, 4}, 1/2, 5]
    tex:
      in: \text{PowerModList}\left[\{1,2,3,4\},\frac{1}{2},5\right]
      out: \text{PowerModList}\left[\{1,2,3,4\},\frac{1}{2},5\right]
    verdict: disagree
    kind: domain
    note: We thread element-wise over a List base; Wolfram's PowerModList doesn't accept a List in the base position and leaves the call unevaluated.
  sage:
    in: enumeratio_power_mod_list([1, 2, 3, 4], (1/2), 5)
    out: "TypeError: unable to coerce <class 'list'> to an integer"
    verdict: error
    kind: threading
    note: compute-engine's PowerModList is Listable and threads over the list; Sage's takes scalars only.
