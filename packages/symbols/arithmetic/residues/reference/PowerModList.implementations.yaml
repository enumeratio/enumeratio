a-product-of-two-21-digit-primes-cannot-be:
  wolfram:
    in: PowerModList[4, Rational[1, 2], Times[Plus[Power[10, 20], 39], Plus[Power[10, 20], 129]]]
    out: "{2, 4888888888888888897106666666666666669130, 5111111111111111119693333333333333335901, 10000000000000000016800000000000000005029}"
    tex:
      in: \text{PowerModList}\left[4,\frac{1}{2},\left(10^{20}+39\right) \left(10^{20}+129\right)\right]
      out: \{2,4888888888888888897106666666666666669130,5111111111111111119693333333333333335901,10000000000000000016800000000000000005029\}
    verdict: disagree
    kind: domain
    note: We decline once factoring the modulus exceeds our budget and leave the call symbolic; Wolfram's kernel factors this 41-digit product of two 21-digit primes within its own budget and returns all four square roots.
  sage:
    in: enumeratio_power_mod_list(4, (1/2), (((10^20) + 39) * ((10^20) + 129)))
    out: "[2, 4888888888888888897106666666666666669130, 5111111111111111119693333333333333335901, 10000000000000000016800000000000000005029]"
    verdict: disagree
    kind: domain
    note: "Same budget decline as the Wolfram row: Sage's Zmod nth_root factors the 41-digit modulus and returns all four square roots where we decline."
