the-multiplicative-order-always-divides-varphi-n:
  wolfram:
    in: (Mod[EulerPhi[7], MultiplicativeOrder[3, 7]] == 0)
    out: True
    tex:
      in: (\phi (7) \bmod \text{ord}_7(3))=0
      out: \text{True}
  sage:
    in: bool((euler_phi(7) % Mod(3, 7).multiplicative_order()) == 0)
    out: True
no-order-exists-when-gcd-a-n-neq-1-here-gcd-10:
  wolfram:
    in: MultiplicativeOrder[10, 22]
    out: MultiplicativeOrder[10, 22]
    tex:
      in: \text{ord}_{22}(10)
      out: \text{ord}_{22}(10)
  sage:
    in: Mod(10, 22).multiplicative_order()
    out: "ArithmeticError: multiplicative order of 10 not defined since it is not a unit modulo 22"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["MultiplicativeOrder", 10, 22] and Sage raises an error.'
the-first-power-of-3-to-reach-pm-1-3-3-27-equiv:
