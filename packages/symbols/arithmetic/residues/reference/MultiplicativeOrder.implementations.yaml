multiplicativeorder-5-8:
  wolfram:
    in: MultiplicativeOrder[5, 8]
    out: "2"
    tex:
      in: \text{ord}_8(5)
      out: "2"
  sage:
    in: Mod(5, 8).multiplicative_order()
    out: "2"
