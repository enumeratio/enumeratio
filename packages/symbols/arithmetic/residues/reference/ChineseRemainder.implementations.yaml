chineseremainder-list-3-4-list-4-5:
  wolfram:
    in: ChineseRemainder[List[3, 4], List[4, 5]]
    out: "19"
    tex:
      in: \text{ChineseRemainder}[\{3,4\},\{4,5\}]
      out: "19"
chineseremainder-list-2-3-5-list-3-5-7:
  wolfram:
    in: ChineseRemainder[List[2, 3, 5], List[3, 5, 7]]
    out: "68"
    tex:
      in: \text{ChineseRemainder}[\{2,3,5\},\{3,5,7\}]
      out: "68"
verifies-the-solution-satisfies-both-congruences:
  wolfram:
    in: And[(Mod[ChineseRemainder[List[3, 4], List[4, 5]], 4] == 3), (Mod[ChineseRemainder[List[3, 4], List[4, 5]], 5] == 4)]
    out: True
    tex:
      in: (\text{ChineseRemainder}[\{3,4\},\{4,5\}] \bmod 4)=3\land (\text{ChineseRemainder}[\{3,4\},\{4,5\}] \bmod 5)=4
      out: \text{True}
no-solution-exists-when-the-remainders-are:
  wolfram:
    in: ChineseRemainder[List[1, 2], List[6, 10]]
    out: ChineseRemainder[{1, 2}, {6, 10}]
    tex:
      in: \text{ChineseRemainder}[\{1,2\},\{6,10\}]
      out: \text{ChineseRemainder}[\{1,2\},\{6,10\}]
a-third-argument-asks-for-the-smallest-solution:
  wolfram:
    in: ChineseRemainder[List[1, 2], List[3, 5], 100]
    out: "112"
    tex:
      in: \text{ChineseRemainder}[\{1,2\},\{3,5\},100]
      out: "112"
