verifies-the-solution-satisfies-both-congruences:
  epsil:
    in: |-
      ChineseRemainder([3, 4], [4, 5]) % 4 == 3 && ChineseRemainder([3, 4], [4, 5]) %
                                                   5 == 4
    out: True
  tex:
    in: \mathrm{ChineseRemainder}(\bigl\lbrack3, 4\bigr\rbrack, \bigl\lbrack4, 5\bigr\rbrack)\bmod4=3\land\mathrm{ChineseRemainder}(\bigl\lbrack3, 4\bigr\rbrack, \bigl\lbrack4, 5\bigr\rbrack)\bmod5=4
    out: \top
  traditional:
    in: \mathrm{ChineseRemainder}(\bigl\lbrack3, 4\bigr\rbrack, \bigl\lbrack4, 5\bigr\rbrack)\bmod4=3\land\mathrm{ChineseRemainder}(\bigl\lbrack3, 4\bigr\rbrack, \bigl\lbrack4, 5\bigr\rbrack)\bmod5=4
    out: \mathrm{True}
  wolfram:
    in: And[(Mod[ChineseRemainder[List[3, 4], List[4, 5]], 4] == 3), (Mod[ChineseRemainder[List[3, 4], List[4, 5]], 5] == 4)]
    back: Unreadable
    out: True
    tex:
      in: (\text{ChineseRemainder}[\{3,4\},\{4,5\}] \bmod 4)=3\land (\text{ChineseRemainder}[\{3,4\},\{4,5\}] \bmod 5)=4
      out: \text{True}
