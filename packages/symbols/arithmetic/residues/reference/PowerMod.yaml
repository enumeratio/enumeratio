name: PowerMod
domain: Modular arithmetic
signature: PowerMod(a, b, m)
summary: "Modular exponentiation: a^b mod m, computed without forming a^b directly."
signatures:
  - call: PowerMod(a, b, m)
    description: modular exponentiation, $a^b \bmod m$.
  - call: PowerMod(a, 1/r, m)
    description: the least $x \ge 0$ with $x^r \equiv a \pmod m$; more generally $s/r$ for $x^r \equiv a^s$
    library: enumeratio-residues
  - call: PowerMod(u/v, b, m)
    description: a rational base, read in $\mathbb{Z}/m$ as $u \cdot v^{-1}$
    library: enumeratio-residues
details:
  - Computed by repeated squaring, without ever forming $a^b$ directly -- efficient even for huge $b$.
  - A negative $b$ gives the modular inverse of $a$ raised to $|b|$, when it exists.
  - The inverse is undefined whenever $\gcd(a,m)\neq1$; compute-engine leaves such calls unevaluated.
  - Equal to $\mathrm{Mod}(a^b, m)$ for positive $b$, just far more efficient. See [[Mod]].
  - A rational exponent $s/r$ gives the least $x$ with $x^r \equiv a^s$ — the first element of [[PowerModList]] — and stays unevaluated when there is none.
  - Threads over lists in any argument.
  - Gaussian integers are reduced as [[Mod]] reduces them; a rational-integer modulus must be positive, and a result that comes out real is reported in $[0, m)$.
examples:
  - id: powermod-2-10-3
    expr: [PowerMod, 2, 10, 3]
    expected: 1
  - id: powermod-3-50-11
    expr: [PowerMod, 3, 50, 11]
    expected: 1
  - id: powermod-3-2-7
    expr: [PowerMod, 3, 2, 7]
    expected: 2
  - id: 3-1-equiv-5-and-5-2-25-equiv-4
    expr: [PowerMod, 3, -2, 7]
    expected: 4
    category: Scope
    caption: $3^{-1} \equiv 5$, and $5^2 = 25 \equiv 4$
  - id: a-square-root-of-3-equiv-1-pmod-2
    expr: [PowerMod, 3, [Rational, 1, 2], 2]
    expected: 1
    category: Scope
    caption: a square root of $3 \equiv 1 \pmod 2$
  - id: threads-over-a-list-of-bases
    expr: [PowerMod, [List, 2, 3, 4], 2, 5]
    expected: [List, 4, 4, 1]
    category: Scope
    caption: threads over a list of bases
  - id: a-negative-exponent-gives-the-modular-inverse
    expr: [PowerMod, 2, -1, 7]
    expected: 4
    caption: A negative exponent gives the modular inverse
  - id: one-step-of-rsa-style-modular-exponentiation-7
    expr: [PowerMod, 7, 13, 33]
    expected: 13
    category: Applications
    caption: 'One step of RSA-style modular exponentiation: $7^{13} \bmod 33$'
  - id: by-definition-a-b-bmod-m-computed-without-ever
    expr: [Equal, [PowerMod, 2, 10, 3], [Mod, [Power, 2, 10], 3]]
    expected: True
    category: Properties
    caption: By definition $a^b \bmod m$, computed without ever forming $a^b$ directly
  - id: no-inverse-exists-when-gcd-a-m-neq-1-here-gcd-2
    expr: [PowerMod, 2, -1, 4]
    expected: [PowerMod, 2, -1, 4]
    category: Possible issues
    caption: No inverse exists when $\gcd(a,m)\neq1$ (here $\gcd(2,4)=2$), so the call is left unevaluated
  - id: exponent-0-evaluates-even-at-a-negative-modulus
    expr: [PowerMod, -2, 0, -14]
    expected: -13
    category: Scope
    caption: $a^0 = 1$ regardless of $a$ or $m$'s sign, so this is $\mathrm{Mod}(1, -14)$ even though $m<0$
  - id: a-nonzero-exponent-at-the-same-negative-modulus
    expr: [PowerMod, -2, 3, -14]
    expected: [PowerMod, -2, 3, -14]
    category: Possible issues
    caption: A nonzero exponent with a negative modulus still declines, as in Wolfram, unlike the exponent-0 case above
  - id: a-rational-exponent-is-a-modular-root-the-least
    expr: [PowerMod, 4, [Rational, 1, 2], 7]
    expected: 2
    category: Scope
    caption: "a rational exponent is a modular root: the least of $2, 5$"
  - id: threads-over-lists-the-period-is-the-order-of-2
    expr: [PowerMod, 2, [List, 10, 11, 12, 13, 14], 5]
    expected: [List, 4, 3, 1, 2, 4]
    category: Scope
    caption: threads over lists; the period is the order of 2 mod 5
  - id: a-301-digit-base
    expr: [PowerMod, [Add, [Power, 10, 300], 1], 7, 5]
    expected: 1
    category: Scope
    caption: a 301-digit base
  - id: a-square-root-of-3-modulo-the-prime-10-30-57
    expr: [PowerMod, 3, [Rational, 1, 2], [Add, [Power, 10, 30], 57]]
    expected: { num: "492767688934650018614948489645" }
    category: Scope
    caption: a square root of 3 modulo the prime $10^{30} + 57$
  - id: a-rational-base-2-cdot-3-1-2-cdot-5-equiv-3-pmod
    expr: [PowerMod, [Rational, 2, 3], 1, 7]
    expected: 3
    category: Scope
    caption: 'a rational base: $2 \cdot 3^{-1} = 2 \cdot 5 \equiv 3 \pmod 7$'
  - id: gaussian-integers-2-i-2-3-4i-equiv-i-pmod-3
    expr: [PowerMod, [Complex, 2, 1], 2, 3]
    expected: [Complex, 0, 1]
    category: Scope
    caption: 'Gaussian integers: $(2+i)^2 = 3 + 4i \equiv i \pmod 3$'
  - id: a-gaussian-modulus-and-an-exponent-of-10-30
    expr: [PowerMod, [Complex, 1, 2], [Power, 10, 30], [Complex, 7, 2]]
    expected: [Complex, 1, 2]
    category: Scope
    caption: a Gaussian modulus, and an exponent of $10^{30}$
  - id: 11-7i-is-a-unit-mod-7-4i-so-it-has-negative
    expr: [PowerMod, [Complex, 11, -7], -4, [Complex, 7, 4]]
    expected: [Complex, -2, -1]
    category: Scope
    caption: $11 - 7i$ is a unit mod $7 + 4i$, so it has negative powers
  - id: euler-s-theorem-a-varphi-m-equiv-1-for-a-coprime
    expr: [PowerMod, 7, [Totient, 19], 19]
    expected: 1
    category: Properties
    caption: "Euler's theorem: $a^{\\varphi(m)} \\equiv 1$ for $a$ coprime to $m$"
  - id: 341-11-cdot-31-passes-fermat-s-test-to-base-2
    expr: [PowerMod, 2, 340, 341]
    expected: 1
    category: Applications
    caption: $341 = 11 \cdot 31$ passes Fermat's test to base 2 — the least pseudoprime
  - id: diffie-hellman-both-parties-reach-the-shared-key
    expr: [Equal, [PowerMod, [PowerMod, 5, 6, 23], 15, 23], [PowerMod, [PowerMod, 5, 15, 23], 6, 23]]
    expected: True
    category: Applications
    caption: 'Diffie–Hellman: both parties reach the shared key $5^{6 \cdot 15} \bmod 23$'
  - id: 2-is-not-a-square-mod-5-so-there-is-no-root
    expr: [PowerMod, 2, [Rational, 1, 2], 5]
    expected: [PowerMod, 2, [Rational, 1, 2], 5]
    category: Possible issues
    caption: 2 is not a square mod 5, so there is no root
  - id: a-square-root-of-3-mod-2-is-1-trivially
    expr: [PowerMod, 3, [Rational, 1, 2], 2]
    expected: 1
    role: test
    category: Scope
  - id: exponent-0-base-minus-4-modulus-minus-2
    expr: [PowerMod, -4, 0, -2]
    expected: -1
    role: test
    category: Scope
    caption: $a^0 = 1$ regardless of $a$ or $m$'s sign
  - id: exponent-0-base-5-modulus-minus-7
    expr: [PowerMod, 5, 0, -7]
    expected: -6
    role: test
    category: Scope
  - id: exponent-0-with-a-positive-modulus
    expr: [PowerMod, 2, 0, 14]
    expected: 1
    role: test
    category: Scope
  - id: a-positive-exponent-at-a-negative-modulus-1-2
    expr: [PowerMod, 1, 2, -2]
    expected: [PowerMod, 1, 2, -2]
    role: test
    category: Possible issues
    caption: A positive exponent still declines at a negative modulus, like Wolfram, unlike Rust's num-bigint
  - id: a-positive-exponent-at-a-negative-modulus-3-2-7
    expr: [PowerMod, 3, 2, -7]
    expected: [PowerMod, 3, 2, -7]
    role: test
    category: Possible issues
  - id: a-positive-exponent-at-a-negative-modulus-341
    expr: [PowerMod, -1, 340, -2]
    expected: [PowerMod, -1, 340, -2]
    role: test
    category: Possible issues
  - id: a-positive-exponent-at-a-negative-modulus-5-1-7
    expr: [PowerMod, 5, 1, -7]
    expected: [PowerMod, 5, 1, -7]
    role: test
    category: Possible issues
  - id: a-negative-exponent-at-a-negative-modulus-2-1-5
    expr: [PowerMod, 2, -1, -5]
    expected: [PowerMod, 2, -1, -5]
    role: test
    category: Possible issues
    caption: A negative exponent declines too, even though an inverse exists and Rust's num-bigint would reduce it into a negative residue
seeAlso:
  - Mod
  - PowerModList
  - ModularInverse
