there-are-varphi-varphi-n-of-them:
  epsil:
    in: Length(PrimitiveRootList(1_009)) == Totient(Totient(1_009))
    out: True
  tex:
    in: \mathrm{Length}(\mathrm{PrimitiveRootList}(1\,009))=\mathrm{Totient}(\mathrm{Totient}(1\,009))
    out: \top
  traditional:
    in: \mathrm{Length}(\mathrm{PrimitiveRootList}(1\,009))=\varphi(\varphi(1\,009))
    out: \mathrm{True}
  wolfram:
    in: (Length[PrimitiveRootList[1009]] == EulerPhi[EulerPhi[1009]])
    back: Unreadable
    out: True
    tex:
      in: \text{Length}[\text{PrimitiveRootList}[1009]]=\phi (\phi (1009))
      out: \text{True}
  sage:
    in: bool((len(enumeratio_primitive_root_list(1009)) if hasattr(enumeratio_primitive_root_list(1009), '__len__') else 0) == euler_phi(euler_phi(1009)))
    out: True
