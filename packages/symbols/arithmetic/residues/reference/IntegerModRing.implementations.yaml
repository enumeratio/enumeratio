listfrom-integermodring-3:
  epsil:
    in: ListFrom(IntegerModRing(3))
    out: "[IntegerMod(0, 3), IntegerMod(1, 3), IntegerMod(2, 3)]"
  tex:
    in: \mathrm{ListFrom}(\mathrm{IntegerModRing}(3))
    out: \bigl\lbrack\mathrm{IntegerMod}(0, 3), \mathrm{IntegerMod}(1, 3), \mathrm{IntegerMod}(2, 3)\bigr\rbrack
  fullform:
    in: ListFrom[IntegerModRing[3]]
count-integermodring-12:
  epsil:
    in: Count(IntegerModRing(12))
    out: "12"
  tex:
    in: \mathrm{Count}(\mathrm{IntegerModRing}(12))
    out: "12"
  fullform:
    in: Count[IntegerModRing[12]]
z-12-z:
  epsil:
    in: QuotientRing(Integers, 12)
    out: IntegerModRing(12)
  tex:
    in: \mathbb{Z}_{12}
    out: \mathrm{IntegerModRing}(12)
  fullform:
    in: QuotientRing[Integers, 12]
integermod-3-5-in-integermodring-5:
  epsil:
    in: IntegerMod(3, 5) in IntegerModRing(5)
    out: True
  tex:
    in: \mathrm{IntegerMod}(3, 5)\in\mathrm{IntegerModRing}(5)
    out: \top
  traditional:
    in: \mathrm{IntegerMod}(3, 5)\in\mathrm{IntegerModRing}(5)
    out: \mathrm{True}
  fullform:
    in: Element[IntegerMod[3, 5], IntegerModRing[5]]
z-5-z:
  epsil:
    in: QuotientRing(Integers, 5)
    out: IntegerModRing(5)
  tex:
    in: \mathbb{Z}_{5}
    out: \mathrm{IntegerModRing}(5)
  fullform:
    in: QuotientRing[Integers, 5]
count-integermodring-5:
  epsil:
    in: Count(IntegerModRing(5))
    out: "5"
  tex:
    in: \mathrm{Count}(\mathrm{IntegerModRing}(5))
    out: "5"
  fullform:
    in: Count[IntegerModRing[5]]
integermod-3-7-not-in-integermodring-5:
