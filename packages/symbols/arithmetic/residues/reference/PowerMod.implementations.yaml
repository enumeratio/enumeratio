11-7i-is-a-unit-mod-7-4i-so-it-has-negative:
  epsil:
    in: PowerMod(11 - 7i, -4, 7 + 4i)
    out: -2 - i
  tex:
    in: \mathrm{PowerMod}(11-7i, -4, 7+4i)
    out: -2-i
  traditional:
    in: \left(\frac{1}{(11-7i)^4}\bmod 7+4i\right)
    out: -2-i
  fullform:
    in: PowerMod[Complex[11, -7], -4, Complex[7, 4]]
  wolfram:
    in: PowerMod[Complex[11, -7], -4, Complex[7, 4]]
    out: PowerMod[11 - 7*I, -4, 7 + 4*I]
    tex:
      in: ((11-7 i)^{-4} \bmod (7+4 i))
      out: ((11-7 i)^{-4} \bmod (7+4 i))
    verdict: disagree
    kind: convention
    note: Wolfram asks for a unit modulo the norm 65 here, not modulo $7 + 4i$, and leaves this unevaluated.
  sage:
    in: power_mod((11 + -7*I), -4, (7 + 4*I))
    out: "TypeError: unsupported operand parent(s) for %: 'Number Field in I with defining polynomial x^2 + 1 with I = 1*"
    verdict: error
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so PowerMod over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
