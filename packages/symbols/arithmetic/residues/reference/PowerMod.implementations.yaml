    in: PowerMod([2, 3, 4], 2, 5)
    out: "[4, 4, 1]"
  tex:
    in: \mathrm{PowerMod}(\bigl\lbrack2, 3, 4\bigr\rbrack, 2, 5)
    out: \bigl\lbrack4, 4, 1\bigr\rbrack
  fullform:
    in: PowerMod[List[2, 3, 4], 2, 5]
  wolfram:
    in: PowerMod[List[2, 3, 4], 2, 5]
  sage:
    in: power_mod([2, 3, 4], 2, 5)
    out: "TypeError: unsupported operand parent(s) for %: '<class 'list'>' and 'Integer Ring'"
    verdict: error
    kind: threading
    note: compute-engine's PowerMod is Listable and threads over the list; Sage's power_mod() takes a scalar only and raises a TypeError on the list.
  rust:
    in: powermod(list(vec![n(2), n(3), n(4)]), n(2), n(5))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's PowerMod is Listable and threads over the list; the Rust crates take scalars only.
