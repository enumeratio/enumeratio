    out: "1"
  tex:
    in: \mathrm{PowerMod}(3, \frac{1}{2}, 2)
    out: "1"
  traditional:
    in: \left(\sqrt{3}\bmod 2\right)
    out: "1"
  fullform:
    in: PowerMod[3, Rational[1, 2], 2]
  wolfram:
    in: PowerMod[3, Rational[1, 2], 2]
  sage:
    in: power_mod(3, (1/2), 2)
    out: "TypeError: no conversion of this rational to integer"
    verdict: error
    kind: domain
    note: compute-engine's PowerMod extends past integer exponents; Sage's power_mod() requires an integer exponent and raises a TypeError on the rational 1/2.
  rust:
    in: powermod(n(3), rational(n(1), n(2)), n(2))
    out: "panic: an integer, not 1/2"
    verdict: error
    kind: domain
    note: The Rust adapter takes integers here; compute-engine's PowerMod extends past them.
threads-over-a-list-of-bases:
