    in: PowerMod(2, -1, 4)
    out: PowerMod(2, -1, 4)
  tex:
    in: \mathrm{PowerMod}(2, -1, 4)
    out: \mathrm{PowerMod}(2, -1, 4)
  traditional:
    in: \left(\frac{1}{2}\bmod 4\right)
    out: \left(\frac{1}{2}\bmod 4\right)
  fullform:
    in: PowerMod[2, -1, 4]
  wolfram:
    in: PowerMod[2, -1, 4]
    out: PowerMod[2, -1, 4]
    tex:
      in: (2^{-1} \bmod 4)
      out: (2^{-1} \bmod 4)
  sage:
    in: power_mod(2, -1, 4)
    out: "ZeroDivisionError: inverse of Mod(2, 4) does not exist"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["PowerMod", 2, -1, 4] and Sage raises an error.'
  rust:
    in: powermod(n(2), n(-1), n(4))
    out: "panic: no modular inverse: base and modulus share a factor"
    verdict: error
    kind: domain
    note: num-bigint's modpow takes a non-negative integer exponent; ours also takes a negative one (an inverse) and a rational one (a root).
exponent-0-evaluates-even-at-a-negative-modulus:
