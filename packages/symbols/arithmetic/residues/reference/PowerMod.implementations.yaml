    in: PowerMod(2, [10, 11, 12, 13, 14], 5)
    out: "[4, 3, 1, 2, 4]"
  tex:
    in: \mathrm{PowerMod}(2, \bigl\lbrack10, 11, 12, 13, 14\bigr\rbrack, 5)
    out: \bigl\lbrack4, 3, 1, 2, 4\bigr\rbrack
  fullform:
    in: PowerMod[2, List[10, 11, 12, 13, 14], 5]
  wolfram:
    in: PowerMod[2, List[10, 11, 12, 13, 14], 5]
    out: "{4, 3, 1, 2, 4}"
    tex:
      in: (2^{\{10,11,12,13,14\}} \bmod 5)
      out: \{4,3,1,2,4\}
  sage:
    in: power_mod(2, [10, 11, 12, 13, 14], 5)
    out: "TypeError: unable to coerce <class 'list'> to an integer"
    verdict: error
    kind: threading
    note: compute-engine's PowerMod is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: powermod(n(2), list(vec![n(10), n(11), n(12), n(13), n(14)]), n(5))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's PowerMod is Listable and threads over the list; the Rust crates take scalars.
