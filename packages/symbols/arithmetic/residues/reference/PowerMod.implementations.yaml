    out: True
  tex:
    in: \mathrm{PowerMod}(\mathrm{PowerMod}(5, 6, 23), 15, 23)=\mathrm{PowerMod}(\mathrm{PowerMod}(5, 15, 23), 6, 23)
    out: \top
  traditional:
    in: \left(\left(5^6\bmod 23\right)^{15}\bmod 23\right)=\left(\left(5^{15}\bmod 23\right)^6\bmod 23\right)
    out: \mathrm{True}
  fullform:
    in: Equal[PowerMod[PowerMod[5, 6, 23], 15, 23], PowerMod[PowerMod[5, 15, 23], 6, 23]]
  wolfram:
    in: (PowerMod[PowerMod[5, 6, 23], 15, 23] == PowerMod[PowerMod[5, 15, 23], 6, 23])
    out: True
    tex:
      in: ((5^6 \bmod 23)^{15} \bmod 23)=((5^{15} \bmod 23)^6 \bmod 23)
      out: \text{True}
  sage:
    in: bool(power_mod(power_mod(5, 6, 23), 15, 23) == power_mod(power_mod(5, 15, 23), 6, 23))
    out: True
  rust:
    in: equal(powermod(powermod(n(5), n(6), n(23)), n(15), n(23)), powermod(powermod(n(5), n(15), n(23)), n(6), n(23)))
    out: "true"
