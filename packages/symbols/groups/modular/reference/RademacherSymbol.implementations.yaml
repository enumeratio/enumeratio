    in: LinkingWithTrefoil["LLRR"]
the-arithmetic-side:
  epsil:
    in: DedekindSum(4, 3)
    out: 1 / 18
  tex:
    in: \mathrm{DedekindSum}(4, 3)
    out: \frac{1}{18}
  traditional:
    in: s(4, 3)
    out: \frac{1}{18}
  fullform:
    in: DedekindSum[4, 3]
phi-on-t-n-just-counts:
  epsil:
    in: RademacherPhi(ModularMatrix(1, 7, 0, 1))
    out: "7"
  tex:
    in: \mathrm{RademacherPhi}(\mathrm{ModularMatrix}(1, 7, 0, 1))
    out: "7"
