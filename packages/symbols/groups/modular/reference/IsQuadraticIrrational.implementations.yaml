isquadraticirrational-sqrt-2:
  epsil:
    in: IsQuadraticIrrational(Sqrt(2))
    out: True
  tex:
    in: \mathrm{IsQuadraticIrrational}(\sqrt{2})
    out: \top
  traditional:
    in: \mathrm{IsQuadraticIrrational}(\sqrt{2})
    out: \mathrm{True}
  wolfram:
    in: QuadraticIrrationalQ[Sqrt[2]]
the-golden-ratio:
  epsil:
    in: IsQuadraticIrrational((1 + Sqrt(5)) / 2)
    out: True
  tex:
    in: \mathrm{IsQuadraticIrrational}(\frac{1+\sqrt{5}}{2})
    out: \top
  traditional:
    in: \mathrm{IsQuadraticIrrational}(\frac{1+\sqrt{5}}{2})
    out: \mathrm{True}
  wolfram:
    in: QuadraticIrrationalQ[Divide[Plus[1, Sqrt[5]], 2]]
a-cube-root-is-algebraic-of-degree-3:
  epsil:
    in: IsQuadraticIrrational(2 ^ (1 / 3))
    out: False
  tex:
    in: \mathrm{IsQuadraticIrrational}(\sqrt[3]{2})
    out: \bot
  traditional:
    in: \mathrm{IsQuadraticIrrational}(\sqrt[3]{2})
    out: \mathrm{False}
  wolfram:
    in: QuadraticIrrationalQ[Power[2, Rational[1, 3]]]
a-rational-is-not-irrational:
  epsil:
    in: IsQuadraticIrrational(3 / 4)
    out: False
  tex:
    in: \mathrm{IsQuadraticIrrational}(\frac{3}{4})
    out: \bot
  traditional:
    in: \mathrm{IsQuadraticIrrational}(\frac{3}{4})
    out: \mathrm{False}
  wolfram:
    in: QuadraticIrrationalQ[Rational[3, 4]]
transcendental:
  epsil:
    in: IsQuadraticIrrational(Pi)
    out: False
  tex:
    in: \mathrm{IsQuadraticIrrational}(\pi)
    out: \bot
  traditional:
    in: \mathrm{IsQuadraticIrrational}(\pi)
    out: \mathrm{False}
  wolfram:
    in: QuadraticIrrationalQ[Pi]
