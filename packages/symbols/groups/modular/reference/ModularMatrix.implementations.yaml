the-group-product:
  epsil:
    in: Dot(ModularMatrix(1, 1, 0, 1), ModularMatrix(1, 0, 1, 1))
    out: ModularMatrix(2, 1, 1, 1)
  tex:
    in: \mathrm{Dot}(\mathrm{ModularMatrix}(1, 1, 0, 1), \mathrm{ModularMatrix}(1, 0, 1, 1))
    out: \mathrm{ModularMatrix}(2, 1, 1, 1)
  traditional:
    in: \mathrm{Dot}(\begin{pmatrix}1&1\\0&1\end{pmatrix}, \begin{pmatrix}1&0\\1&1\end{pmatrix})
    out: \begin{pmatrix}2&1\\1&1\end{pmatrix}
no-division-needed-at-determinant-1:
  epsil:
    in: Inverse(ModularMatrix(1, 1, 0, 1))
    out: ModularMatrix(1, -1, 0, 1)
  tex:
    in: \mathrm{ModularMatrix}(1, 1, 0, 1)^{-1}
    out: \mathrm{ModularMatrix}(1, -1, 0, 1)
  traditional:
    in: \begin{pmatrix}1&1\\0&1\end{pmatrix}^{-1}
    out: \begin{pmatrix}1&-1\\0&1\end{pmatrix}
t-5:
  epsil:
    in: MatrixPower(ModularMatrix(1, 1, 0, 1), 5)
    out: ModularMatrix(1, 5, 0, 1)
  tex:
    in: \mathrm{MatrixPower}(\mathrm{ModularMatrix}(1, 1, 0, 1), 5)
    out: \mathrm{ModularMatrix}(1, 5, 0, 1)
  traditional:
    in: \mathrm{MatrixPower}(\begin{pmatrix}1&1\\0&1\end{pmatrix}, 5)
    out: \begin{pmatrix}1&5\\0&1\end{pmatrix}
words-multiply-their-matrices:
  epsil:
    in: Dot("L", "R")
    out: ModularMatrix(1, 1, 1, 2)
  tex:
    in: \mathrm{Dot}(\text{L}, \text{R})
    out: \mathrm{ModularMatrix}(1, 1, 1, 2)
  traditional:
    in: \mathrm{Dot}(\text{L}, \text{R})
    out: \begin{pmatrix}1&1\\1&2\end{pmatrix}
  wolfram:
    in: Dot["L", "R"]
    out: '"L" . "R"'
    tex:
      in: \text{L}.\text{R}
      out: \text{L}.\text{R}
    verdict: disagree
    kind: domain
    note: Wolfram has no word spelling for a modular-group element; its Dot leaves two strings unevaluated.
the-inverse-of-a-word:
  epsil:
    in: Inverse("L")
    out: ModularMatrix(1, 0, -1, 1)
  tex:
    in: \text{L}^{-1}
    out: \mathrm{ModularMatrix}(1, 0, -1, 1)
  traditional:
    in: \text{L}^{-1}
    out: \begin{pmatrix}1&0\\-1&1\end{pmatrix}
r-3:
  epsil:
    in: MatrixPower("R", 3)
    out: ModularMatrix(1, 3, 0, 1)
  tex:
    in: \mathrm{MatrixPower}(\text{R}, 3)
    out: \mathrm{ModularMatrix}(1, 3, 0, 1)
  traditional:
    in: \mathrm{MatrixPower}(\text{R}, 3)
    out: \begin{pmatrix}1&3\\0&1\end{pmatrix}
negative-powers-are-powers-of-the-inverse:
  epsil:
    in: MatrixPower(ModularMatrix(1, 1, 1, 2), -2)
    out: ModularMatrix(5, -3, -3, 2)
  tex:
    in: \mathrm{MatrixPower}(\mathrm{ModularMatrix}(1, 1, 1, 2), -2)
    out: \mathrm{ModularMatrix}(5, -3, -3, 2)
  traditional:
    in: \mathrm{MatrixPower}(\begin{pmatrix}1&1\\1&2\end{pmatrix}, -2)
    out: \begin{pmatrix}5&-3\\-3&2\end{pmatrix}
the-zeroth-power-is-the-identity:
  epsil:
    in: MatrixPower(ModularMatrix(1, 1, 0, 1), 0)
    out: ModularMatrix(1, 0, 0, 1)
  tex:
    in: \mathrm{MatrixPower}(\mathrm{ModularMatrix}(1, 1, 0, 1), 0)
    out: \mathrm{ModularMatrix}(1, 0, 0, 1)
  traditional:
    in: \mathrm{MatrixPower}(\begin{pmatrix}1&1\\0&1\end{pmatrix}, 0)
    out: \begin{pmatrix}1&0\\0&1\end{pmatrix}
a-plain-integer-matrix-goes-to-compute-engine-s:
  epsil:
    in: MatrixPower([[1, 1], [1, 0]], 10)
    out: "[[89, 55], [55, 34]]"
  tex:
    in: \mathrm{MatrixPower}(\bigl\lbrack\bigl\lbrack1, 1\bigr\rbrack, \bigl\lbrack1, 0\bigr\rbrack\bigr\rbrack, 10)
    out: \bigl\lbrack\bigl\lbrack89, 55\bigr\rbrack, \bigl\lbrack55, 34\bigr\rbrack\bigr\rbrack
