a-nested-list-matrix-works-too:
  epsil:
    in: ModularTrace([[1, 1], [1, 2]])
    out: "3"
  tex:
    in: \mathrm{ModularTrace}(\bigl\lbrack\bigl\lbrack1, 1\bigr\rbrack, \bigl\lbrack1, 2\bigr\rbrack\bigr\rbrack)
    out: "3"
  fullform:
    in: ModularTrace[List[List[1, 1], List[1, 2]]]
the-s-t-round-trip-can-negate:
  epsil:
    in: ModularTrace(ModularFromSTWord(ModularSTWord(ModularMatrix(3, 2, 4, 3))))
    out: "-6"
  tex:
    in: \mathrm{ModularTrace}(\mathrm{ModularFromSTWord}(\mathrm{ModularSTWord}(\mathrm{ModularMatrix}(3, 2, 4, 3))))
    out: "-6"
  traditional:
    in: \mathrm{ModularTrace}(\mathrm{ModularFromSTWord}(\mathrm{ModularSTWord}(\begin{pmatrix}3&2\\4&3\end{pmatrix})))
    out: "-6"
  fullform:
    in: ModularTrace[ModularFromSTWord[ModularSTWord[ModularMatrix[3, 2, 4, 3]]]]
