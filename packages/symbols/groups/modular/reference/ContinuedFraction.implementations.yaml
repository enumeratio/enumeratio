a-floating-point-number-read-as-the-rational-it:
  epsil:
    in: ContinuedFraction(3.245)
    out: "[3, 4, 12, 4]"
  tex:
    in: \mathrm{ContinuedFraction}(3.245)
    out: \bigl\lbrack3, 4, 12, 4\bigr\rbrack
  fullform:
    in: ContinuedFraction[3.245]
  wolfram:
    in: ContinuedFraction[3.245]
  sympy:
    in: list(continued_fraction(3.245))
    out: "ValueError: expecting a rational or quadratic irrational, not 3.24500000000000"
    verdict: error
    kind: domain
    note: SymPy's continued_fraction takes rationals and quadratic irrationals, not floats; compute-engine reads 3.245 exactly.
  sage:
    in: list(continued_fraction(3.245))
    out: "[3, 4, 12, 4]"
