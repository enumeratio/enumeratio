pi-s-famous-convergent:
  epsil:
    in: ContinuedFraction(355 / 113)
    out: "[3, 7, 16]"
  tex:
    in: \mathrm{ContinuedFraction}(\frac{355}{113})
    out: \bigl\lbrack3, 7, 16\bigr\rbrack
  fullform:
    in: ContinuedFraction[Rational[355, 113]]
  wolfram:
    in: ContinuedFraction[Rational[355, 113]]
    out: "{3, 7, 16}"
    tex:
      in: \text{ContinuedFraction}\left[\frac{355}{113}\right]
      out: \{3,7,16\}
  sympy:
    in: list(continued_fraction(Rational(355, 113)))
    out: "[3, 7, 16]"
  sage:
    in: list(continued_fraction((355/113)))
    out: "[3, 7, 16]"
