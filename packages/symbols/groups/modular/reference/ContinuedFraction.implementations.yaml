pi-s-famous-convergent:
  wolfram:
    in: ContinuedFraction[Rational[355, 113]]
    out: "{3, 7, 16}"
    tex:
      in: \text{ContinuedFraction}\left[\frac{355}{113}\right]
      out: \{3,7,16\}
  sage:
    in: list(continued_fraction((355/113)))
    out: "[3, 7, 16]"
  sympy:
    in: list(continued_fraction(Rational(355, 113)))
    out: "[3, 7, 16]"
negative-a-floor-for-a-0-then-positive-terms-3-1:
  wolfram:
    in: ContinuedFraction[Rational[-47, 17]]
    note: Wolfram negates every term instead, giving {-2, -1, -3, -4}.
symbolic-terms-build-the-nested-fraction-left:
  wolfram:
    in:
    note: Wolfram's own FromContinuedFraction[{a,b,c}] combines it into the single ratio (a + (1+ab)c)/(1+bc); we leave the nested a + 1/(b + 1/c) form, matching what a reader would write down term by term.
