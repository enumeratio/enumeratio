varphi-1-overline-1-purely-periodic-so-the:
  epsil:
    in: ContinuedFraction((1 + Sqrt(5)) / 2)
    out: "[1, [1]]"
  tex:
    in: \mathrm{ContinuedFraction}(\frac{1+\sqrt{5}}{2})
    out: \bigl\lbrack1, \bigl\lbrack1\bigr\rbrack\bigr\rbrack
  fullform:
    in: ContinuedFraction[Divide[Plus[1, Sqrt[5]], 2]]
  wolfram:
    in: ContinuedFraction[Divide[Plus[1, Sqrt[5]], 2]]
  sympy:
    in: list(continued_fraction((S((1 + sqrt(5))) / 2)))
    out: "[[1]]"
    verdict: disagree
    kind: shape
    note: "The same expansion: SymPy prints the purely periodic one as [[1]], compute-engine as [1, [1]]."
  sage:
    in: list(continued_fraction(((1 + sqrt(5)) / 2)))
    out: "ValueError: the length is infinite!"
    verdict: error
    kind: unclassified
    note:
