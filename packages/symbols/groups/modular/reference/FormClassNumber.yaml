name: FormClassNumber
domain: The modular group
signature: FormClassNumber(discriminant)
summary: How many classes of indefinite binary quadratic forms a discriminant has. A class is not one reduced form but a CYCLE of them, and that cycle is a periodic continued fraction — which is to say, a closed geodesic.
signatures:
  - call: FormClassNumber(D)
    description: the number of classes
    library: enumeratio-modular
  - call: FormCycle(form)
    description: the class the form lies in, listed
    library: enumeratio-modular
  - call: ReducedForms(D)
    description: every reduced form of that discriminant
    library: enumeratio-modular
  - call: FormAutomorph(form)
    description: the hyperbolic matrix generating the form's stabiliser
    library: enumeratio-modular
  - call: PellSolution(D)
    description: the fundamental $(t, u)$ with $t^2 - Du^2 = 4$
    library: enumeratio-modular
details:
  - Indefinite means $D > 0$ and $D$ is not a perfect square; a square discriminant gives a form that factors, with no cycle
  - $\mathrm{SL}(2,\mathbb{Z})$ acts by $(x,y) \mapsto (px+qy, rx+sy)$ and preserves $D$, so classes live inside one discriminant
  - Gauss's reduction condition is $|\sqrt{D} - 2|a|| < b < \sqrt{D}$, and `FormRho` steps round the cycle
  - A cycle's length is always even, because $\rho$ flips the sign of the leading coefficient
  - The automorph has trace $t > 2$, hence is hyperbolic — so a form class IS one of the closed geodesics [[ModularClasses]] counts
  - A discriminant $\not\equiv 0, 1 \pmod 4$ has no forms at all, and the class number is 0
examples:
  - id: four-classes-of-discriminant-60
    expr: [FormClassNumber, 60]
    expected: 4
    caption: four classes of discriminant 60
  - id: the-action-preserves-the-discriminant
    expr: [FormDiscriminant, [FormAction, [QuadraticForm, 1, 1, -1], [ModularMatrix, 1, 1, 0, 1]]]
    expected: 5
    caption: the action preserves the discriminant
    category: Properties
  - id: 3-2-5-cdot-1-2-4
    expr: [PellSolution, 5]
    expected: [List, 3, 1]
    caption: $3^2 - 5\cdot 1^2 = 4$
    category: Properties
  - id: the-class-read-back-as-a-geodesic
    expr: [ModularWord, [FormAutomorph, [QuadraticForm, 1, 1, -1]]]
    expected: "'LR'"
    caption: the class, read back as a geodesic
    category: Applications
  - id: the-discriminant-of-a-form
    expr: [FormDiscriminant, [QuadraticForm, 1, 1, -1]]
    expected: 5
    caption: the discriminant of a form
    category: Scope
  - id: indefinite-when-d-5
    expr: [IsIndefinite, [QuadraticForm, 1, 1, -1]]
    expected: True
    caption: indefinite when $D=5$
    category: Scope
  - id: definite-when-d-4
    expr: [IsIndefinite, [QuadraticForm, 1, 0, 1]]
    expected: False
    caption: definite when $D=-4$
    category: Scope
  - id: already-reduced
    expr: [IsReducedForm, [QuadraticForm, 1, 1, -1]]
    expected: True
    caption: already reduced
    category: Scope
  - id: evaluate-a-form-at-a-point
    expr: [EvaluateForm, [QuadraticForm, 1, 1, -1], 2, 3]
    expected: 1
    caption: $x^2+xy-y^2$ at $(2,3)$
    category: Scope
  - id: one-class-of-discriminant-5
    expr: [FormClassNumber, 5]
    expected: 1
    caption: one class of discriminant 5
    category: Scope
  - id: two-classes-of-discriminant-12
    expr: [FormClassNumber, 12]
    expected: 2
    caption: two classes of discriminant 12
    category: Scope
  - id: 4-2-12-cdot-1-2-4
    expr: [PellSolution, 12]
    expected: [List, 4, 1]
    caption: $4^2 - 12\cdot 1^2 = 4$
    category: Properties
  - id: the-automorph-fixes-the-form
    expr: [FormAction, [QuadraticForm, 1, 1, -1], [FormAutomorph, [QuadraticForm, 1, 1, -1]]]
    expected: [QuadraticForm, 1, 1, -1]
    caption: the automorph fixes the form
    category: Properties
  - id: the-automorph-is-hyperbolic
    expr: [ModularTrace, [FormAutomorph, [QuadraticForm, 1, 1, -1]]]
    expected: 3
    caption: the automorph is hyperbolic
    category: Properties
  - id: confirmed-by-modularkind
    expr: [ModularKind, [FormAutomorph, [QuadraticForm, 1, 1, -1]]]
    expected: "'Hyperbolic'"
    caption: confirmed by `ModularKind`
    category: Properties
seeAlso:
  - ModularClasses
  - ContinuedFraction
  - RademacherSymbol
