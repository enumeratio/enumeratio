from-a-list-of-terms:
  epsil:
    in: Convergents([3, 7, 15, 1])
    out: "[3, 22 / 7, 333 / 106, 355 / 113]"
  tex:
    in: \mathrm{Convergents}(\bigl\lbrack3, 7, 15, 1\bigr\rbrack)
    out: \bigl\lbrack3, \frac{22}{7}, \frac{333}{106}, \frac{355}{113}\bigr\rbrack
  fullform:
    in: Convergents[List[3, 7, 15, 1]]
  wolfram:
    in: Convergents[List[3, 7, 15, 1]]
the-first-five-convergents-of-pi:
  epsil:
    in: Convergents(Pi, 5)
    out: "[3, 22 / 7, 333 / 106, 355 / 113, 103_993 / 33_102]"
  tex:
    in: \mathrm{Convergents}(\pi, 5)
    out: \bigl\lbrack3, \frac{22}{7}, \frac{333}{106}, \frac{355}{113}, \frac{103\,993}{33\,102}\bigr\rbrack
  fullform:
    in: Convergents[Pi, 5]
  wolfram:
    in: Convergents[Pi, 5]
a-rational-the-last-convergent-is-the-number:
  epsil:
    in: Convergents(47 / 17)
    out: "[2, 3, 11 / 4, 47 / 17]"
  tex:
    in: \mathrm{Convergents}(\frac{47}{17})
    out: \bigl\lbrack2, 3, \frac{11}{4}, \frac{47}{17}\bigr\rbrack
  fullform:
    in: Convergents[Rational[47, 17]]
  wolfram:
    in: Convergents[Rational[47, 17]]
convergents-of-sqrt-2-solve-pell-s-equations-p-2:
  epsil:
    in: Convergents(Sqrt(2), 5)
    out: "[1, 3 / 2, 7 / 5, 17 / 12, 41 / 29]"
  tex:
    in: \mathrm{Convergents}(\sqrt{2}, 5)
    out: \bigl\lbrack1, \frac{3}{2}, \frac{7}{5}, \frac{17}{12}, \frac{41}{29}\bigr\rbrack
  fullform:
    in: Convergents[Sqrt[2], 5]
  wolfram:
    in: Convergents[Sqrt[2], 5]
