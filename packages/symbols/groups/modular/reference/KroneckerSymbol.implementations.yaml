completely-multiplicative-in-n:
  epsil:
    in: KroneckerSymbol(7, 3 * 5) == KroneckerSymbol(7, 3) * KroneckerSymbol(7, 5)
    out: True
  tex:
    in: \mathrm{KroneckerSymbol}(7, 3\times5)=\mathrm{KroneckerSymbol}(7, 3)\mathrm{KroneckerSymbol}(7, 5)
    out: \top
  traditional:
    in: \left(\frac{7}{3\times5}\right)=\left(\frac{7}{3}\right)\left(\frac{7}{5}\right)
    out: \mathrm{True}
  fullform:
    in: Equal[KroneckerSymbol[7, Times[3, 5]], Times[KroneckerSymbol[7, 3], KroneckerSymbol[7, 5]]]
  wolfram:
    in: (KroneckerSymbol[7, Times[3, 5]] == Times[KroneckerSymbol[7, 3], KroneckerSymbol[7, 5]])
    out: True
    tex:
      in: \left(\frac{7}{3\ 5}\right)=\left(\frac{7}{3}\right) \left(\frac{7}{5}\right)
      out: \text{True}
