name: FareyNeighbours
domain: The modular group
signature: FareyNeighbours(p, q, r, s)
summary: Whether $p/q$ and $r/s$ are Farey neighbours — adjacent in some Farey sequence, which is the determinant test $|ps-qr|=1$.
signatures:
  - call: FareyNeighbours(p, q, r, s)
    description: $|ps-qr|=1$
    library: enumeratio-modular
    type: (integer, integer, integer, integer) -> boolean
seeAlso:
  - SternBrocotPath
