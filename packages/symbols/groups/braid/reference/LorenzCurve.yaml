name: LorenzCurve
domain: Braids and knots
signature: LorenzCurve(steps?)
summary: A trajectory of the Lorenz system at its classic parameters, by fourth-order Runge–Kutta, with the initial settling stretch discarded — the attractor whose periodic orbits are the Lorenz knots.
signatures:
  - call: LorenzCurve(steps?)
    description: the sampled points of a trajectory on the attractor
    library: enumeratio-braid
    type: (integer?) -> list
seeAlso:
  - LorenzBraid
  - ParametricCurve
