the-right-handed-trefoil:
  epsil:
    in: JonesPolynomial(Braid(2, [1, 1, 1]))
    out: -t ^ -4 + 1 / t + t ^ -3
  tex:
    in: \mathrm{JonesPolynomial}(\mathrm{Braid}(2, \bigl\lbrack1, 1, 1\bigr\rbrack))
    out: -\frac{1}{t^4}+\frac{1}{t}+\frac{1}{t^3}
  traditional:
    in: V_{\sigma_{1}^{3}}(t)
    out: -\frac{1}{t^4}+\frac{1}{t}+\frac{1}{t^3}
not-yet-an-invariant:
  epsil:
    in: KauffmanBracket(Braid(2, [1]))
    out: -A ^ 3
  tex:
    in: \mathrm{KauffmanBracket}(\mathrm{Braid}(2, \bigl\lbrack1\bigr\rbrack))
    out: -A^3
  traditional:
    in: \langle \sigma_{1}\rangle
    out: -A^3
and-the-writhe-correction-fixes-it:
  epsil:
    in: BracketInvariant(Braid(2, [1]))
    out: "1"
  tex:
    in: \mathrm{BracketInvariant}(\mathrm{Braid}(2, \bigl\lbrack1\bigr\rbrack))
    out: "1"
  traditional:
    in: \mathrm{BracketInvariant}(\sigma_{1})
    out: "1"
the-shortest-knotted-modular-geodesic-by-yet:
  epsil:
    in: JonesPolynomial("LLRLR")
    out: -t ^ -4 + 1 / t + t ^ -3
  tex:
    in: \mathrm{JonesPolynomial}(\text{LLRLR})
    out: -\frac{1}{t^4}+\frac{1}{t}+\frac{1}{t^3}
  traditional:
    in: V_{\text{LLRLR}}(t)
    out: -\frac{1}{t^4}+\frac{1}{t}+\frac{1}{t^3}
the-figure-eight-through-the-braid-it-carries-as:
  epsil:
    in: JonesPolynomial(FigureEightKnot())
    out: t ^ 2 - t + -1 / t + t ^ -2 + 1
  tex:
    in: \mathrm{JonesPolynomial}(\mathrm{FigureEightKnot}())
    out: t^2-t-\frac{1}{t}+\frac{1}{t^2}+1
  traditional:
    in: V_{\mathrm{FigureEightKnot}()}(t)
    out: t^2-t-\frac{1}{t}+\frac{1}{t^2}+1
