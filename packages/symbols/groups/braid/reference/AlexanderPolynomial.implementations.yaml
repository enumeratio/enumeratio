the-trefoil:
  epsil:
    in: AlexanderPolynomial(Braid(2, [1, 1, 1]))
    out: t ^ 2 - t + 1
  tex:
    in: \mathrm{AlexanderPolynomial}(\mathrm{Braid}(2, \bigl\lbrack1, 1, 1\bigr\rbrack))
    out: t^2-t+1
  traditional:
    in: \Delta_{\sigma_{1}^{3}}(t)
    out: t^2-t+1
the-figure-eight-knot:
  epsil:
    in: AlexanderPolynomial(BraidPower(Braid(3, [1, -2]), 2))
    out: t ^ 2 - 3t + 1
  tex:
    in: \mathrm{AlexanderPolynomial}(\mathrm{BraidPower}(\mathrm{Braid}(3, \bigl\lbrack1, -2\bigr\rbrack), 2))
    out: t^2-3t+1
  traditional:
    in: \Delta_{\left(\sigma_{1}\sigma_{2}^{-1}\right)^{2}}(t)
    out: t^2-3t+1
and-under-its-own-name-twistknot-1:
