a-crossing-is-a-brauer-diagram:
  epsil:
    in: Diagram([[1, -2], [2, -1], [3, -3]]) in BrauerAlgebra(3)
    out: True
  tex:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, -2\bigr\rbrack, \bigl\lbrack2, -1\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack\bigr\rbrack)\in\mathrm{BrauerAlgebra}(3)
    out: \top
  traditional:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, -2\bigr\rbrack, \bigl\lbrack2, -1\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack\bigr\rbrack)\in B_{3}
    out: \mathrm{True}
  sage:
    in: enumeratio_element(enumeratio_diagram([[1, -2], [2, -1], [3, -3]]), BrauerAlgebra(3, enumeratio_delta, enumeratio_ring))
    out: True
but-not-a-planar-one:
  epsil:
    in: Diagram([[1, -2], [2, -1], [3, -3]]) in TemperleyLiebAlgebra(3)
    out: False
  tex:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, -2\bigr\rbrack, \bigl\lbrack2, -1\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack\bigr\rbrack)\in\mathrm{TemperleyLiebAlgebra}(3)
    out: \bot
  traditional:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, -2\bigr\rbrack, \bigl\lbrack2, -1\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack\bigr\rbrack)\in\mathrm{TL}_{3}
    out: \mathrm{False}
  sage:
    in: enumeratio_element(enumeratio_diagram([[1, -2], [2, -1], [3, -3]]), TemperleyLiebAlgebra(3, enumeratio_delta, enumeratio_ring))
    out: False
