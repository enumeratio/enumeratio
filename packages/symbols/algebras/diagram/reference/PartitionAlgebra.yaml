name: PartitionAlgebra
domain: Diagram algebras
signature: PartitionAlgebra(n)
summary: '$P_n(\delta)$: every set partition of $2n$ points. The largest of the family — all the others are subalgebras cut out by admitting fewer diagrams. Dimension $B(2n)$, the Bell numbers.'
signatures:
  - call: PartitionAlgebra(n)
    description: the partition algebra on $n$ strands
    library: enumeratio-diagram
  - call: PlanarPartitionAlgebra(n)
    description: only the planar diagrams — dimension $C(2n)$
    library: enumeratio-diagram
details:
  - "Dimension $B(2n)$: 2, 15, 203, 4140 for $n = 1,2,3,4$ — the Bell numbers at even index"
  - Restricting to planar diagrams gives $C(2n)$, the Catalan numbers
  - "[[Basis]] lists the diagrams and [[AlgebraDimension]] answers from the closed form, so the dimension is available well past the point where listing is useful"
  - "[[Element]] tests membership, which is what makes the inclusions checkable"
seeAlso:
  - Diagram
  - BrauerAlgebra
  - TemperleyLiebAlgebra
references:
  - system: wikipedia
    identity: Partition algebra
bindings:
  - origin: mapped
    form: sage
    template: PartitionAlgebra($1, enumeratio_delta, enumeratio_ring)
    arity: 1
    note: Oscar has no diagram algebras; its row checks the dimension against the closed form (oscar/preamble.jl), not against a second implementation.
  - origin: mapped
    form: oscar
    template: EnumeratioDiagramAlgebra(:partition, $1)
    arity: 1
    note: Oscar has no diagram algebras; its row checks the dimension against the closed form (oscar/preamble.jl), not against a second implementation.
catalog:
  - system: oeis
    identity: A000110
    url: https://oeis.org/A000110
    note: cardinality = Bell(n), borrowed from set_partitions
  - system: sage
    identity: sage.combinat.diagram_algebras.PartitionAlgebra(k, q, base_ring, prefix)
    url: https://doc.sagemath.org/html/en/reference/algebras/sage/combinat/diagram_algebras.html
    note: sage's full diagram partition algebra basis = set partitions of a 2k-point set (Bell(2k)); our collection borrows only the one-row Bell(n) basis (identical to set_partitions), a simpler sub-object of the real partition algebra
