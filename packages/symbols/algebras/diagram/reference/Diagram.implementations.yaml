the-cup-cap-squared-closes-one-loop-e-1-2-delta:
  sage:
    in: (enumeratio_diagram([[1, 2], [-1, -2]]) * enumeratio_diagram([[1, 2], [-1, -2]]))
    out: delta*P{{-2, -1}, {1, 2}}
e-1e-2e-1-e-1-with-no-loop-closed:
  sage:
    in: (enumeratio_diagram([[1, 2], [-1, -2], [3, -3]]) * enumeratio_diagram([[2, 3], [-2, -3], [1, -1]]) * enumeratio_diagram([[1, 2], [-1, -2], [3, -3]]))
    out: P{{-3, 3}, {-2, -1}, {1, 2}}
blocks-come-back-in-canonical-order:
  sage:
    in: enumeratio_diagram([[-1, -2], [3, -3], [1, 2]])
    out: P{{-3, 3}, {-2, -1}, {1, 2}}
malformed-the-point-2-is-missing-so-it-is-left:
  sage:
    in: enumeratio_diagram([[1, -1], [2]])
    out: P{{-2}, {-1, 1}, {2}}
    verdict: disagree
    kind: domain
    note: Sage completes a diagram missing a point by adding it as a singleton block; ours leaves a malformed diagram as written.
