the-cup-cap-squared-closes-one-loop-e-1-2-delta:
  epsil:
    in: NonCommutativeMultiply(Diagram([[1, 2], [-1, -2]]), Diagram([[1, 2], [-1, -2]]))
    out: delta * Diagram([[1, 2], [-1, -2]])
  tex:
    in: \mathrm{NonCommutativeMultiply}(\mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack-1, -2\bigr\rbrack\bigr\rbrack), \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack-1, -2\bigr\rbrack\bigr\rbrack))
    out: \delta\mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack-1, -2\bigr\rbrack\bigr\rbrack)
  fullform:
    in: NonCommutativeMultiply[Diagram[List[List[1, 2], List[-1, -2]]], Diagram[List[List[1, 2], List[-1, -2]]]]
  sage:
    in: (enumeratio_diagram([[1, 2], [(-1), (-2)]]) * enumeratio_diagram([[1, 2], [(-1), (-2)]]))
    out: delta*P{{-2, -1}, {1, 2}}
e-1e-2e-1-e-1-with-no-loop-closed:
  epsil:
    in: |-
      NonCommutativeMultiply(
                              Diagram([[1, 2], [-1, -2], [3, -3]]),
                              Diagram([[2, 3], [-2, -3], [1, -1]]),
                              Diagram([[1, 2], [-1, -2], [3, -3]]),
                            )
    out: Diagram([[1, 2], [3, -3], [-1, -2]])
  tex:
    in: \mathrm{NonCommutativeMultiply}(\mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack-1, -2\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack\bigr\rbrack), \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack2, 3\bigr\rbrack, \bigl\lbrack-2, -3\bigr\rbrack, \bigl\lbrack1, -1\bigr\rbrack\bigr\rbrack), \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack-1, -2\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack\bigr\rbrack))
    out: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack, \bigl\lbrack-1, -2\bigr\rbrack\bigr\rbrack)
  fullform:
    in: NonCommutativeMultiply[Diagram[List[List[1, 2], List[-1, -2], List[3, -3]]], Diagram[List[List[2, 3], List[-2, -3], List[1, -1]]], Diagram[List[List[1, 2], List[-1, -2], List[3, -3]]]]
  sage:
    in: (enumeratio_diagram([[1, 2], [(-1), (-2)], [3, (-3)]]) * enumeratio_diagram([[2, 3], [(-2), (-3)], [1, (-1)]]) * enumeratio_diagram([[1, 2], [(-1), (-2)], [3, (-3)]]))
    out: P{{-3, 3}, {-2, -1}, {1, 2}}
blocks-come-back-in-canonical-order:
  epsil:
    in: Diagram([[-1, -2], [3, -3], [1, 2]])
    out: Diagram([[1, 2], [3, -3], [-1, -2]])
  tex:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack-1, -2\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack, \bigl\lbrack1, 2\bigr\rbrack\bigr\rbrack)
    out: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack, \bigl\lbrack-1, -2\bigr\rbrack\bigr\rbrack)
  fullform:
    in: Diagram[List[List[-1, -2], List[3, -3], List[1, 2]]]
  sage:
    in: enumeratio_diagram([[(-1), (-2)], [3, (-3)], [1, 2]])
    out: P{{-3, 3}, {-2, -1}, {1, 2}}
malformed-the-point-2-is-missing-so-it-is-left:
  epsil:
    in: Diagram([[1, -1], [2]])
    out: Diagram([[1, -1], [2]])
  tex:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, -1\bigr\rbrack, \bigl\lbrack2\bigr\rbrack\bigr\rbrack)
    out: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, -1\bigr\rbrack, \bigl\lbrack2\bigr\rbrack\bigr\rbrack)
  fullform:
    in: Diagram[List[List[1, -1], List[2]]]
  sage:
    in: enumeratio_diagram([[1, (-1)], [2]])
    out: P{{-2}, {-1, 1}, {2}}
    verdict: disagree
    kind: domain
    note: Sage completes a diagram missing a point by adding it as a singleton block; ours leaves a malformed diagram as written.
