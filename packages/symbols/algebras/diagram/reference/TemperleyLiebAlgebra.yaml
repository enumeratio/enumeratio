    form: sage
    template: TemperleyLiebAlgebra($1, enumeratio_delta, enumeratio_ring)
    arity: 1
  - origin: mapped
    form: oscar
    template: EnumeratioDiagramAlgebra(:temperley_lieb, $1)
    arity: 1
