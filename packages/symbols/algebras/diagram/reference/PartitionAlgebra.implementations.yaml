a-block-of-three-is-a-partition-diagram-and:
  epsil:
    in: Diagram([[1, 2, -1], [3, -3], [-2]]) in PartitionAlgebra(3)
    out: True
  tex:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2, -1\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack, \bigl\lbrack-2\bigr\rbrack\bigr\rbrack)\in\mathrm{PartitionAlgebra}(3)
    out: \top
  traditional:
    in: \mathrm{Diagram}(\bigl\lbrack\bigl\lbrack1, 2, -1\bigr\rbrack, \bigl\lbrack3, -3\bigr\rbrack, \bigl\lbrack-2\bigr\rbrack\bigr\rbrack)\in P_{3}
    out: \mathrm{True}
  fullform:
    in: Element[Diagram[List[List[1, 2, -1], List[3, -3], List[-2]]], PartitionAlgebra[3]]
  sage:
    in: enumeratio_element(enumeratio_diagram([[1, 2, (-1)], [3, (-3)], [(-2)]]), PartitionAlgebra(3, enumeratio_delta, enumeratio_ring))
    out: True
