    out: a * b * c
  tex:
    in: \mathrm{NonCommutativeMultiply}(a, \mathrm{NonCommutativeMultiply}(b, c))
    out: abc
  fullform:
    in: NonCommutativeMultiply[a, NonCommutativeMultiply[b, c]]
  wolfram:
    in: NonCommutativeMultiply[a, NonCommutativeMultiply[b, c]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[a\text{**}(b\text{**}c)-a b c],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\frac{7}{3}\text{**}\left(\left(-\frac{11}{5}\right)\text{**}\frac{13}{4}\right)-\frac{7}{3} \left(-\frac{11}{5}\right) \frac{13}{4}\right]\right],\text{Chop}\left[N\left[\left(-\frac{17}{6}\right)\text{**}\left(\frac{19}{8}\text{**}\left(-\frac{23}{9}\right)\right)--\frac{17}{6} \frac{19}{8} \left(-\frac{23}{9}\right)\right]\right],\text{Chop}\left[N\left[\frac{7}{3}\text{**}\left(\left(-\frac{11}{5}\right)\text{**}\frac{13}{4}\right)-\frac{7}{3} \left(-\frac{11}{5}\right) \frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: domain
    note: Wolfram's NonCommutativeMultiply is an uninterpreted formal operator with no built-in multiplication table for our basis elements, so it always stays unevaluated. Not testable against Wolfram for this algebraic content.
  sage:
    in: (SR.var("a") * (SR.var("b") * SR.var("c")))
    out: True
