the-canonical-order:
  epsil:
    in: NonCommutativeMultiply(e_1, e_2)
    out: e_1 * e_2
  tex:
    in: \mathrm{NonCommutativeMultiply}(e_1, e_2)
    out: e_1e_2
  fullform:
    in: NonCommutativeMultiply[Subscript[e, 1], Subscript[e, 2]]
  wolfram:
    in: NonCommutativeMultiply[Subscript[e, 1], Subscript[e, 2]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[e_1\text{**}e_2-e_1 e_2\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\frac{7}{3}\text{**}\left(-\frac{11}{5}\right)-\frac{7}{3} \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\frac{13}{4}\text{**}\left(-\frac{17}{6}\right)-\frac{13}{4} \left(-\frac{17}{6}\right)\right]\right],\text{Chop}\left[N\left[\frac{19}{8}\text{**}\left(-\frac{23}{9}\right)-\frac{19}{8} \left(-\frac{23}{9}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: domain
    note: Wolfram's NonCommutativeMultiply is an uninterpreted formal operator with no built-in multiplication table for our basis elements, so it always stays unevaluated. Not testable against Wolfram for this algebraic content.
  sage:
    in: (SR.var("e_1") * SR.var("e_2"))
    out: True
reversing-the-operands-flips-the-sign:
  epsil:
    in: NonCommutativeMultiply(e_2, e_1)
    out: -(e_1 * e_2)
  tex:
    in: \mathrm{NonCommutativeMultiply}(e_2, e_1)
    out: -(e_1e_2)
  fullform:
    in: NonCommutativeMultiply[Subscript[e, 2], Subscript[e, 1]]
  wolfram:
    in: NonCommutativeMultiply[Subscript[e, 2], Subscript[e, 1]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[e_2\text{**}e_1--\left(e_1 e_2\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\left(-\frac{11}{5}\right)\text{**}\frac{7}{3}--\left(\frac{7}{3} \left(-\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\left(-\frac{17}{6}\right)\text{**}\frac{13}{4}--\left(\frac{13}{4} \left(-\frac{17}{6}\right)\right)\right]\right],\text{Chop}\left[N\left[\left(-\frac{23}{9}\right)\text{**}\frac{19}{8}--\left(\frac{19}{8} \left(-\frac{23}{9}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: domain
    note: Wolfram's NonCommutativeMultiply is an uninterpreted formal operator with no built-in multiplication table for our basis elements, so it always stays unevaluated. Not testable against Wolfram for this algebraic content.
  sage:
    in: (SR.var("e_2") * SR.var("e_1"))
    out: False
    verdict: disagree
    kind: domain
    note: Sages symbolic ring multiplication commutes (e_2*e_1 = e_1*e_2 there); it has no built-in notion of our non-commutative Clifford-algebra basis, so it cannot see the sign flip our own algebra requires.
e-1e-2-2-1:
  epsil:
    in: NonCommutativeMultiply(e_1, e_2, e_1, e_2)
    out: "-1"
  tex:
    in: \mathrm{NonCommutativeMultiply}(e_1, e_2, e_1, e_2)
    out: "-1"
  fullform:
    in: NonCommutativeMultiply[Subscript[e, 1], Subscript[e, 2], Subscript[e, 1], Subscript[e, 2]]
  wolfram:
    in: NonCommutativeMultiply[Subscript[e, 1], Subscript[e, 2], Subscript[e, 1], Subscript[e, 2]]
    out: Subscript[e, 1]**Subscript[e, 2]**Subscript[e, 1]**Subscript[e, 2]
    tex:
      in: e_1\text{**}e_2\text{**}e_1\text{**}e_2
      out: e_1\text{**}e_2\text{**}e_1\text{**}e_2
    verdict: disagree
    kind: domain
    note: Wolfram's NonCommutativeMultiply is an uninterpreted formal operator with no built-in multiplication table; it can't know our Clifford-algebra basis products, so it always stays unevaluated. Not testable against Wolfram at all for this content.
  sage:
    in: (SR.var("e_1") * SR.var("e_2") * SR.var("e_1") * SR.var("e_2"))
    out: e_1^2*e_2^2
    verdict: inconclusive
    kind: domain
    note: "Same as the other NonCommutativeMultiply example: Sages symbolic ring has no built-in multiplication table for our basis elements and just multiplies them as ordinary (commuting) symbols."
scalars-the-implied-identity-factor:
  epsil:
    in: CircleTimes(2, 3)
    out: "6"
  tex:
    in: 2\otimes3
    out: "6"
  fullform:
    in: CircleTimes[2, 3]
  wolfram:
    in: CircleTimes[2, 3]
    out: 2 (x) 3
    tex:
      in: 2\otimes 3
      out: 2\otimes 3
    verdict: disagree
    kind: convention
    note: Our CircleTimes commits to a concrete algebra where scalars multiply as usual; Wolfram's builtin CircleTimes is inert notation with no arithmetic rules, so it leaves $2\otimes3$ displayed rather than reduced to 6.
commuting-units-agrees-with-times:
  epsil:
    in: CircleTimes(i_2, i_1)
    out: i_1 * i_2
  tex:
    in: i_2\otimes i_1
    out: i_1i_2
  fullform:
    in: CircleTimes[Subscript[i, 2], Subscript[i, 1]]
  wolfram:
    in: CircleTimes[Subscript[i, 2], Subscript[i, 1]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[i_2\otimes i_1-i_1 i_2\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[-\frac{11}{5}\otimes \frac{7}{3}-\frac{7}{3} \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[-\frac{17}{6}\otimes \frac{13}{4}-\frac{13}{4} \left(-\frac{17}{6}\right)\right]\right],\text{Chop}\left[N\left[-\frac{23}{9}\otimes \frac{19}{8}-\frac{19}{8} \left(-\frac{23}{9}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: domain
    note: Wolfram's NonCommutativeMultiply is an uninterpreted formal operator with no built-in multiplication table for our basis elements, so it always stays unevaluated. Not testable against Wolfram for this algebraic content.
plain-times-declines-both-orders-arrive:
  epsil:
    in: e_2 * e_1
    out: e_1 * e_2
  tex:
    in: e_2e_1
    out: e_1e_2
  fullform:
    in: Times[Subscript[e, 2], Subscript[e, 1]]
  wolfram:
    in: Times[Subscript[e, 2], Subscript[e, 1]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[e_2 e_1-e_1 e_2\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[-\frac{11}{5} \frac{7}{3}-\frac{7}{3} \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[-\frac{17}{6} \frac{13}{4}-\frac{13}{4} \left(-\frac{17}{6}\right)\right]\right],\text{Chop}\left[N\left[-\frac{23}{9} \frac{19}{8}-\frac{19}{8} \left(-\frac{23}{9}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
  sympy:
    in: (Symbol("e_2") * Symbol("e_1"))
    out: True
  sage:
    in: (SR.var("e_2") * SR.var("e_1"))
    out: True
the-quaternion-product-1-2i-3j-4k-2-i-j-3k-13:
  epsil:
    in: |-
      NonCommutativeMultiply(
                              1 + 2f_1 + 3f_2 + 4 * f_1 * f_2,
                              2 - f_1 + f_2 - 3 * f_1 * f_2,
                            )
    out: 10 * f_1 * f_2 - 10f_1 + 9f_2 + 13
  tex:
    in: \mathrm{NonCommutativeMultiply}(1+2f_1+3f_2+4f_1f_2, 2-f_1+f_2-3f_1f_2)
    out: 10f_1f_2-10f_1+9f_2+13
  fullform:
    in: NonCommutativeMultiply[Plus[1, Times[2, Subscript[f, 1]], Times[3, Subscript[f, 2]], Times[4, Subscript[f, 1], Subscript[f, 2]]], Plus[2, Minus[Subscript[f, 1]], Subscript[f, 2], Times[-3, Subscript[f, 1], Subscript[f, 2]]]]
  wolfram:
    in: NonCommutativeMultiply[Plus[1, Times[2, Subscript[f, 1]], Times[3, Subscript[f, 2]], Times[4, Subscript[f, 1], Subscript[f, 2]]], Plus[2, Minus[Subscript[f, 1]], Subscript[f, 2], Times[-3, Subscript[f, 1], Subscript[f, 2]]]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\left(1+2 f_1+3 f_2+4 f_1 f_2\right)\text{**}\left(2-f_1+f_2-3 f_1 f_2\right)-\left(10 f_1 f_2-10 f_1+9 f_2+13\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\left(1+2 \frac{7}{3}+3 \left(-\frac{11}{5}\right)+4 \frac{7}{3} \left(-\frac{11}{5}\right)\right)\text{**}\left(2-\frac{7}{3}-\frac{11}{5}-3 \frac{7}{3} \left(-\frac{11}{5}\right)\right)-\left(10 \frac{7}{3} \left(-\frac{11}{5}\right)-10 \frac{7}{3}+9 \left(-\frac{11}{5}\right)+13\right)\right]\right],\text{Chop}\left[N\left[\left(1+2 \frac{13}{4}+3 \left(-\frac{17}{6}\right)+4 \frac{13}{4} \left(-\frac{17}{6}\right)\right)\text{**}\left(2-\frac{13}{4}-\frac{17}{6}-3 \frac{13}{4} \left(-\frac{17}{6}\right)\right)-\left(10 \frac{13}{4} \left(-\frac{17}{6}\right)-10 \frac{13}{4}+9 \left(-\frac{17}{6}\right)+13\right)\right]\right],\text{Chop}\left[N\left[\left(1+2 \frac{19}{8}+3 \left(-\frac{23}{9}\right)+4 \frac{19}{8} \left(-\frac{23}{9}\right)\right)\text{**}\left(2-\frac{19}{8}-\frac{23}{9}-3 \frac{19}{8} \left(-\frac{23}{9}\right)\right)-\left(10 \frac{19}{8} \left(-\frac{23}{9}\right)-10 \frac{19}{8}+9 \left(-\frac{23}{9}\right)+13\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: domain
    note: Wolfram's NonCommutativeMultiply is an uninterpreted formal operator with no built-in multiplication table for our basis elements, so it always stays unevaluated. Not testable against Wolfram for this algebraic content.
  sage:
    in: ((1 + (2 * SR.var("f_1")) + (3 * SR.var("f_2")) + (4 * SR.var("f_1") * SR.var("f_2"))) * (2 + (-SR.var("f_1")) + SR.var("f_2") + (-3 * SR.var("f_1") * SR.var("f_2"))))
    out: False
    verdict: disagree
    kind: domain
    note: "Same as the other NonCommutativeMultiply examples: Sage multiplies the basis symbols as ordinary commuting variables, with no notion of our quaternion multiplication table."
associative-nested-products-flatten:
