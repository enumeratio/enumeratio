1-i-j-k:
  epsil:
    in: Basis(Quaternions)
    out: "[1, f_1, f_2, f_1 * f_2]"
  tex:
    in: \mathrm{Basis}(\mathrm{Quaternions})
    out: \bigl\lbrack1, f_1, f_2, f_1f_2\bigr\rbrack
the-bicomplex-basis:
  epsil:
    in: Basis(MulticomplexAlgebra(2))
    out: "[1, i_1, i_2, i_1 * i_2]"
  tex:
    in: \mathrm{Basis}(\mathrm{MulticomplexAlgebra}(2))
    out: \bigl\lbrack1, i_1, i_2, i_1i_2\bigr\rbrack
  traditional:
    in: \mathrm{Basis}(\mathbb{C}_{2})
    out: \bigl\lbrack1, i_1, i_2, i_1i_2\bigr\rbrack
an-element-from-a-coefficient-tuple:
  epsil:
    in: Dot([1, 2, 3, 4], Basis(Quaternions))
    out: 4 * f_1 * f_2 + 2f_1 + 3f_2 + 1
  tex:
    in: \mathrm{Dot}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \mathrm{Basis}(\mathrm{Quaternions}))
    out: 4f_1f_2+2f_1+3f_2+1
