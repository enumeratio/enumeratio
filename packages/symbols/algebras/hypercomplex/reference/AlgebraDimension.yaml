name: AlgebraDimension
domain: Hypercomplex algebra
signature: AlgebraDimension(algebra)
summary: The dimension $2^n$ of an algebra on $n$ generators — the number of basis blades.
signatures:
  - call: AlgebraDimension(algebra)
    description: $2^n$ for $n$ generators
    library: enumeratio-hypercomplex
details:
  - Every subset of the generators is one basis blade, so the dimension doubles per generator
  - A separate head from compute-engine's `Dimension`, which is defined for lists and matrices and is deliberately left alone
seeAlso:
  - Basis
  - AlgebraSignature
references:
  - system: wikipedia
    identity: Dimension (vector space)
bindings:
  - origin: mapped
    form: wolfram
    counterpart: false
    note: "Wolfram has no algebra-object type to take a dimension of: `Quaternions` is a domain symbol with no generic dimension function, and `CliffordAlgebra`/`MulticomplexAlgebra` aren't Wolfram heads at all."
    checked:
      version: 15.0.0
      on: 2026-09-27
  - origin: mapped
    form: sage
    template: ($1).dimension()
    arity: 1
  - origin: mapped
    form: oscar
    template: dim($1)
    arity: 1
