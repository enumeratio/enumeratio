ijk-1:
  epsil:
    in: NonCommutativeMultiply(f_1, f_2, f_1 * f_2)
    out: "-1"
  tex:
    in: \mathrm{NonCommutativeMultiply}(f_1, f_2, f_1f_2)
    out: "-1"
  fullform:
    in: NonCommutativeMultiply[Subscript[f, 1], Subscript[f, 2], Times[Subscript[f, 1], Subscript[f, 2]]]
  wolfram:
    in: NonCommutativeMultiply[Subscript[f, 1], Subscript[f, 2], Times[Subscript[f, 1], Subscript[f, 2]]]
    out: Subscript[f, 1]**Subscript[f, 2]**(Subscript[f, 1]*Subscript[f, 2])
    tex:
      in: f_1\text{**}f_2\text{**}\left(f_1 f_2\right)
      out: f_1\text{**}f_2\text{**}\left(f_1 f_2\right)
    verdict: disagree
    kind: domain
    note: "Same as NonCommutativeMultiply generally: Wolfram has no built-in quaternion multiplication table for our basis elements, so the call stays unevaluated regardless of the actual product."
  sage:
    in: (SR.var("f_1") * SR.var("f_2") * (SR.var("f_1") * SR.var("f_2")))
    out: f_1^2*f_2^2
    verdict: inconclusive
    kind: domain
    note: "Same as NonCommutativeMultiply: Sages symbolic ring has no built-in quaternion multiplication table, so it just multiplies the basis symbols as ordinary commuting variables."
k-in-h:
  epsil:
    in: f_1 * f_2 in Quaternions
    out: True
  tex:
    in: f_1f_2\in\mathrm{Quaternions}
    out: \top
  traditional:
    in: f_1f_2\in\mathrm{Quaternions}
    out: \mathrm{True}
  fullform:
    in: Element[Times[Subscript[f, 1], Subscript[f, 2]], Quaternions]
  wolfram:
    in: Element[Times[Subscript[f, 1], Subscript[f, 2]], Quaternions]
  sage:
    in: enumeratio_element((SR.var("f_1") * SR.var("f_2")), SR.var("Quaternions"))
    out: "TypeError: argument of type 'sage.symbolic.expression.Expression' is not a container or iterable"
    verdict: error
    kind: domain
    note: "Same root cause: Quaternions isn't compute-engine-defined, so enumeratio_element gets a bare Sage symbolic variable instead of an iterable domain to test membership against."
a-multicomplex-unit-is-not-a-quaternion:
  epsil:
    in: i_1 in Quaternions
    out: False
  tex:
    in: i_1\in\mathrm{Quaternions}
    out: \bot
  traditional:
    in: i_1\in\mathrm{Quaternions}
    out: \mathrm{False}
  fullform:
    in: Element[Subscript[i, 1], Quaternions]
  wolfram:
    in: Element[Subscript[i, 1], Quaternions]
  sage:
    in: enumeratio_element(SR.var("i_1"), SR.var("Quaternions"))
    out: "TypeError: argument of type 'sage.symbolic.expression.Expression' is not a container or iterable"
    verdict: error
    kind: domain
    note: Same root cause as the other Quaternions/Basis/AlgebraDimension rows.
