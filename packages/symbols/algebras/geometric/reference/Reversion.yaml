name: Reversion
domain: Geometric algebra
signature: Reversion(x)
summary: 'Reversion $\tilde{x}$: reverse the order of generators in every blade of $x$, costing sign $(-1)^{k(k-1)/2}$ per grade $k$.'
signatures:
