name: Dual
domain: Geometric algebra
signature: Dual(x, algebra)
summary: 'The Poincaré dual $!x$ in `algebra`: each blade of $x$ replaced by the blade on the generators it does not contain, signed so $b \wedge {!b} = I$.'
signatures:
  - call: Dual(x, algebra)
    description: $!x$, the Poincaré dual of $x$ in `algebra`
    library: enumeratio-geometric
    type: (number, any) -> number
seeAlso:
  - Pseudoscalar
