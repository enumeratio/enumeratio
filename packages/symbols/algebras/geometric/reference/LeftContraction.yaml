name: LeftContraction
domain: Geometric algebra
signature: LeftContraction(a, b)
summary: 'The left contraction $a \lrcorner b$: the geometric product of $a$ and $b$ at grade $|b|-|a|$, zero when $a$ has the higher grade.'
signatures:
  - call: LeftContraction(a, b)
    description: $a \lrcorner b$, the geometric product of $a$ and $b$ at grade $|b|-|a|$
    library: enumeratio-geometric
    type: (number, number) -> number
seeAlso:
  - RightContraction
  - ScalarProduct
