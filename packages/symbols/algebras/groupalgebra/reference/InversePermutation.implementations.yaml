one-line-word:
  epsil:
    in: InversePermutation([2, 5, 3, 6, 1, 8, 7, 9, 4, 10])
    out: "[5, 1, 3, 9, 2, 4, 7, 6, 8, 10]"
  tex:
    in: \mathrm{InversePermutation}(\bigl\lbrack2, 5, 3, 6, 1, 8, 7, 9, 4, 10\bigr\rbrack)
    out: \bigl\lbrack5, 1, 3, 9, 2, 4, 7, 6, 8, 10\bigr\rbrack
  wolfram:
    in: InversePermutation[List[2, 5, 3, 6, 1, 8, 7, 9, 4, 10]]
cycle-notation:
  epsil:
    in: InversePermutation(Cycles([[1, 2, 5], [4, 6, 8, 9]]))
    out: Cycles([[1, 5, 2], [4, 9, 8, 6]])
  tex:
    in: \mathrm{InversePermutation}(\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2, 5\bigr\rbrack, \bigl\lbrack4, 6, 8, 9\bigr\rbrack\bigr\rbrack))
    out: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 5, 2\bigr\rbrack, \bigl\lbrack4, 9, 8, 6\bigr\rbrack\bigr\rbrack)
  wolfram:
    in: InversePermutation[Cycles[List[List[1, 2, 5], List[4, 6, 8, 9]]]]
