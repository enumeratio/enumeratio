every-element-of-a-permutation-group:
  epsil:
    in: GroupElements(PermutationGroup([Cycles([[1, 9, 6], [3, 7]])]))
    out: |-
      [
        Cycles([]),
        Cycles([[3, 7]]),
        Cycles([[1, 6, 9]]),
        Cycles([[1, 6, 9], [3, 7]]),
        Cycles([[1, 9, 6]]),
        Cycles([[1, 9, 6], [3, 7]]),
      ]
  tex:
    in: \mathrm{GroupElements}(\mathrm{PermutationGroup}(\bigl\lbrack\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack)\bigr\rbrack))
    out: \bigl\lbrack\mathrm{Cycles}(\bigl\lbrack \bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 6, 9\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 6, 9\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack)\bigr\rbrack
  wolfram:
    in: GroupElements[PermutationGroup[List[Cycles[List[List[1, 9, 6], List[3, 7]]]]]]
the-first-three-elements:
  epsil:
    in: GroupElements(PermutationGroup([Cycles([[1, 9, 6], [3, 7]])]), [1, 2, 3])
    out: "[Cycles([]), Cycles([[3, 7]]), Cycles([[1, 6, 9]])]"
  tex:
    in: \mathrm{GroupElements}(\mathrm{PermutationGroup}(\bigl\lbrack\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack)\bigr\rbrack), \bigl\lbrack1, 2, 3\bigr\rbrack)
    out: \bigl\lbrack\mathrm{Cycles}(\bigl\lbrack \bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 6, 9\bigr\rbrack\bigr\rbrack)\bigr\rbrack
  wolfram:
    in: GroupElements[PermutationGroup[List[Cycles[List[List[1, 9, 6], List[3, 7]]]]], List[1, 2, 3]]
the-last-element:
  epsil:
    in: GroupElements(PermutationGroup([Cycles([[1, 9, 6], [3, 7]])]), [-1])
    out: "[Cycles([[1, 9, 6], [3, 7]])]"
  tex:
    in: \mathrm{GroupElements}(\mathrm{PermutationGroup}(\bigl\lbrack\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack)\bigr\rbrack), \bigl\lbrack-1\bigr\rbrack)
    out: \bigl\lbrack\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack)\bigr\rbrack
  wolfram:
    in: GroupElements[PermutationGroup[List[Cycles[List[List[1, 9, 6], List[3, 7]]]]], List[-1]]
