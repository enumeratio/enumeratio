one-line-to-cycles:
  epsil:
    in: PermutationCycles([2, 5, 3, 6, 1, 8, 7, 9, 4, 10])
    out: Cycles([[1, 2, 5], [4, 6, 8, 9]])
  tex:
    in: \mathrm{PermutationCycles}(\bigl\lbrack2, 5, 3, 6, 1, 8, 7, 9, 4, 10\bigr\rbrack)
    out: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2, 5\bigr\rbrack, \bigl\lbrack4, 6, 8, 9\bigr\rbrack\bigr\rbrack)
  fullform:
    in: PermutationCycles[List[2, 5, 3, 6, 1, 8, 7, 9, 4, 10]]
  wolfram:
    in: PermutationCycles[List[2, 5, 3, 6, 1, 8, 7, 9, 4, 10]]
identity-has-no-cycles:
  epsil:
    in: PermutationCycles([1, 2, 3, 4, 5])
    out: Cycles([])
  tex:
    in: \mathrm{PermutationCycles}(\bigl\lbrack1, 2, 3, 4, 5\bigr\rbrack)
    out: \mathrm{Cycles}(\bigl\lbrack \bigr\rbrack)
  fullform:
    in: PermutationCycles[List[1, 2, 3, 4, 5]]
  wolfram:
    in: PermutationCycles[List[1, 2, 3, 4, 5]]
with-a-custom-head:
  epsil:
    in: PermutationCycles([2, 5, 3, 6, 1, 8, 7, 9, 4, 10], head)
    out: head([[1, 2, 5], [3], [4, 6, 8, 9], [7], [10]])
  tex:
    in: \mathrm{PermutationCycles}(\bigl\lbrack2, 5, 3, 6, 1, 8, 7, 9, 4, 10\bigr\rbrack, \mathrm{head})
    out: \mathrm{head}(\bigl\lbrack\bigl\lbrack1, 2, 5\bigr\rbrack, \bigl\lbrack3\bigr\rbrack, \bigl\lbrack4, 6, 8, 9\bigr\rbrack, \bigl\lbrack7\bigr\rbrack, \bigl\lbrack10\bigr\rbrack\bigr\rbrack)
  fullform:
    in: PermutationCycles[List[2, 5, 3, 6, 1, 8, 7, 9, 4, 10], head]
idempotent-on-cycles:
  epsil:
    in: PermutationCycles(Cycles([[1, 3, 5], [2, 4, 6]]))
    out: Cycles([[1, 3, 5], [2, 4, 6]])
  tex:
    in: \mathrm{PermutationCycles}(\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 5\bigr\rbrack, \bigl\lbrack2, 4, 6\bigr\rbrack\bigr\rbrack))
    out: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 5\bigr\rbrack, \bigl\lbrack2, 4, 6\bigr\rbrack\bigr\rbrack)
  fullform:
    in: PermutationCycles[Cycles[List[List[1, 3, 5], List[2, 4, 6]]]]
  wolfram:
    in: PermutationCycles[Cycles[List[List[1, 3, 5], List[2, 4, 6]]]]
