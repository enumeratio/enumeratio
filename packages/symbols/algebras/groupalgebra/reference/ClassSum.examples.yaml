- id: class-sums-are-central
  expr: [IsCentral, [DihedralGroup, 3], [ClassSum, [DihedralGroup, 3], 2]]
  expected: True
  caption: class sums are central
  category: Properties
- id: a-lone-reflection-is-not
  expr: [IsCentral, [DihedralGroup, 3], [GroupBasis, [String, s0]]]
