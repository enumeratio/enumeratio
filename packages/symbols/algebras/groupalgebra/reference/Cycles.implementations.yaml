fixed-points-are-dropped:
  epsil:
    in: Cycles([[1, 3, 2], [5], [4]])
    out: Cycles([[1, 3, 2]])
  tex:
    in: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 2\bigr\rbrack, \bigl\lbrack5\bigr\rbrack, \bigl\lbrack4\bigr\rbrack\bigr\rbrack)
    out: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 2\bigr\rbrack\bigr\rbrack)
  fullform:
    in: Cycles[List[List[1, 3, 2], List[5], List[4]]]
  wolfram:
    in: Cycles[List[List[1, 3, 2], List[5], List[4]]]
applying-a-cycle:
  epsil:
    in: Permute([a, b, c, d], Cycles([[1, 3, 2]]))
    out: "[b, c, a, d]"
  tex:
    in: \mathrm{Permute}(\bigl\lbrack a, b, c, d\bigr\rbrack, \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 2\bigr\rbrack\bigr\rbrack))
    out: \bigl\lbrack b, c, a, d\bigr\rbrack
  fullform:
    in: Permute[List[a, b, c, d], Cycles[List[List[1, 3, 2]]]]
