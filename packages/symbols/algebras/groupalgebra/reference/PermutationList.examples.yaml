- id: cycle-to-image-list
  expr: [PermutationList, [Cycles, [List, [List, 1, 3, 2]]]]
  expected: [List, 3, 1, 2]
  caption: the cycle $(1\,3\,2)$'s image list runs out to its own largest point, 3
- id: padded-to-length
  expr: [PermutationList, [Cycles, [List, [List, 2, 3]]], 5]
  expected: [List, 1, 3, 2, 4, 5]
  caption: points 4 and 5 are fixed, so padding to $n = 5$ just appends them
- id: round-trips-with-permutation-cycles
  expr: [PermutationCycles, [PermutationList, [Cycles, [List, [List, 1, 2, 5], [List, 4, 6, 8, 9]]]]]
  expected: [Cycles, [List, [List, 1, 2, 5], [List, 4, 6, 8, 9]]]
  caption: PermutationList and PermutationCycles undo each other
  category: Properties
