name: GroupOrder
domain: Permutations
signature: GroupOrder(group)
summary: '$|G|$: how many elements a group has. Works over every carrier this package knows — [[CyclicGroup]], [[DihedralGroup]], [[GroupDirectProduct]], [[SymmetricGroup]] and [[PermutationGroup]].'
signatures:
  - call: GroupOrder(group)
    description: the number of elements of `group`
    library: enumeratio-groupalgebra
details:
  - For a `PermutationGroup`, the order comes from a breadth-first closure over its generators, not a stored table
  - '`GroupOrder(SymmetricGroup(n))` is $n!$ without materialising all $n!$ permutations'
examples:
  - id: a-dihedral-group
    expr: [GroupOrder, [DihedralGroup, 100]]
    expected: 200
  - id: a-permutation-group
    expr: [GroupOrder, [PermutationGroup, [List, [Cycles, [List, [List, 1, 9, 6], [List, 3, 7]]]]]]
    expected: 6
    category: Scope
  - id: the-symmetric-group
    expr: [GroupOrder, [SymmetricGroup, 4]]
    expected: 24
    caption: $4!$, without unranking every permutation
    category: Scope
seeAlso:
  - GroupElements
  - PermutationGroup
  - DihedralGroup
  - CyclicGroup
  - SymmetricGroup
