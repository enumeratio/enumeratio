replaces-a-point:
  epsil:
    in: PermutationReplace(2, Cycles([[1, 2, 3]]))
    out: "3"
  tex:
    in: \mathrm{PermutationReplace}(2, \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack\bigr\rbrack))
    out: "3"
  fullform:
    in: PermutationReplace[2, Cycles[List[List[1, 2, 3]]]]
  wolfram:
    in: PermutationReplace[2, Cycles[List[List[1, 2, 3]]]]
replaces-every-entry-of-a-list:
  epsil:
    in: PermutationReplace([1, 2, 3, 4], Cycles([[1, 2, 3]]))
    out: "[2, 3, 1, 4]"
  tex:
    in: \mathrm{PermutationReplace}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack\bigr\rbrack))
    out: \bigl\lbrack2, 3, 1, 4\bigr\rbrack
  fullform:
    in: PermutationReplace[List[1, 2, 3, 4], Cycles[List[List[1, 2, 3]]]]
  wolfram:
    in: PermutationReplace[List[1, 2, 3, 4], Cycles[List[List[1, 2, 3]]]]
conjugates-cycles:
  epsil:
    in: PermutationReplace(Cycles([[1, 2, 3]]), Cycles([[1, 2]]))
    out: Cycles([[1, 3, 2]])
  tex:
    in: \mathrm{PermutationReplace}(\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack\bigr\rbrack))
    out: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 2\bigr\rbrack\bigr\rbrack)
  fullform:
    in: PermutationReplace[Cycles[List[List[1, 2, 3]]], Cycles[List[List[1, 2]]]]
  wolfram:
    in: PermutationReplace[Cycles[List[List[1, 2, 3]]], Cycles[List[List[1, 2]]]]
conjugation-is-canonicalised:
  epsil:
    in: PermutationReplace(Cycles([[1, 2]]), Cycles([[1, 3, 2]]))
    out: Cycles([[1, 3]])
  tex:
    in: \mathrm{PermutationReplace}(\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 2\bigr\rbrack\bigr\rbrack))
    out: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3\bigr\rbrack\bigr\rbrack)
  fullform:
    in: PermutationReplace[Cycles[List[List[1, 2]]], Cycles[List[List[1, 3, 2]]]]
  wolfram:
    in: PermutationReplace[Cycles[List[List[1, 2]]], Cycles[List[List[1, 3, 2]]]]
composition-law:
  epsil:
    in: |-
      PermutationReplace(
                          PermutationReplace(Cycles([[1, 2, 3]]), Cycles([[1, 2]])),
                          Cycles([[1, 2, 3]]),
                        )
    out: Cycles([[1, 3, 2]])
  tex:
    in: \mathrm{PermutationReplace}(\mathrm{PermutationReplace}(\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack\bigr\rbrack), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack\bigr\rbrack)), \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack\bigr\rbrack))
    out: \mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 3, 2\bigr\rbrack\bigr\rbrack)
  fullform:
    in: PermutationReplace[PermutationReplace[Cycles[List[List[1, 2, 3]]], Cycles[List[List[1, 2]]]], Cycles[List[List[1, 2, 3]]]]
  wolfram:
    in: PermutationReplace[PermutationReplace[Cycles[List[List[1, 2, 3]]], Cycles[List[List[1, 2]]]], Cycles[List[List[1, 2, 3]]]]
