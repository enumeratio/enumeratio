a-dihedral-group:
  epsil:
    in: GroupOrder(DihedralGroup(100))
    out: "200"
  tex:
    in: \mathrm{GroupOrder}(\mathrm{DihedralGroup}(100))
    out: "200"
  traditional:
    in: \left|D_{100}\right|
    out: "200"
  wolfram:
    in: GroupOrder[DihedralGroup[100]]
  oscar:
    in: order((enumeratio_dihedral(dihedral_group(PermGroup, 2 * 100), 100)).G)
a-permutation-group:
  epsil:
    in: GroupOrder(PermutationGroup([Cycles([[1, 9, 6], [3, 7]])]))
    out: "6"
  tex:
    in: \mathrm{GroupOrder}(\mathrm{PermutationGroup}(\bigl\lbrack\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack)\bigr\rbrack))
    out: "6"
  traditional:
    in: \left|\mathrm{PermutationGroup}(\bigl\lbrack\mathrm{Cycles}(\bigl\lbrack\bigl\lbrack1, 9, 6\bigr\rbrack, \bigl\lbrack3, 7\bigr\rbrack\bigr\rbrack)\bigr\rbrack)\right|
    out: "6"
  wolfram:
    in: GroupOrder[PermutationGroup[List[Cycles[List[List[1, 9, 6], List[3, 7]]]]]]
the-symmetric-group:
  epsil:
    in: GroupOrder(SymmetricGroup(4))
    out: "24"
  tex:
    in: \mathrm{GroupOrder}(\mathrm{SymmetricGroup}(4))
    out: "24"
  traditional:
    in: \left|\mathrm{SymmetricGroup}(4)\right|
    out: "24"
  wolfram:
    in: GroupOrder[SymmetricGroup[4]]
