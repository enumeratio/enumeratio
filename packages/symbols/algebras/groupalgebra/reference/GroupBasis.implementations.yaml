2-5-7-equiv-1:
  epsil:
    in: GroupProduct(CyclicGroup(6), GroupBasis("\(2)"), GroupBasis("\(5)"))
    out: GroupBasis("1")
  tex:
    in: \mathrm{GroupProduct}(\mathrm{CyclicGroup}(6), \mathrm{GroupBasis}(\text{2}), \mathrm{GroupBasis}(\text{5}))
    out: \mathrm{GroupBasis}(\text{1})
  traditional:
    in: \mathrm{GroupProduct}(C_{6}, \mathrm{GroupBasis}(\text{2}), \mathrm{GroupBasis}(\text{5}))
    out: \mathrm{GroupBasis}(\text{1})
  fullform:
    in: GroupProduct[CyclicGroup[6], GroupBasis[String[2]], GroupBasis[String[5]]]
    back: [GroupProduct, [CyclicGroup, 6], [GroupBasis, [String, 2]], [GroupBasis, [String, 5]]]
  oscar:
    in: enumeratio_product(enumeratio_cyclic(cyclic_group(PermGroup, 6), 6), EnumeratioBasis("2"), EnumeratioBasis("5"))
    out: combination:{"GroupBasis(1)":1}
