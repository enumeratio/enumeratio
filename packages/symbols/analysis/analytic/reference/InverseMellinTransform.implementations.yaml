gamma-to-exp:
  epsil:
    in: InverseMellinTransform(Gamma(s), s, x)
    out: ExponentialE ^ (-x)
  tex:
    in: \mathrm{InverseMellinTransform}(\Gamma(s), s, x)
    out: e^{-x}
  fullform:
    in: InverseMellinTransform[Gamma[s], s, x]
  wolfram:
    in: InverseMellinTransform[Gamma[s], s, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{M}_s^{-1}[\Gamma (s)](x)-e^{-x}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{M}_{\frac{7}{3}}^{-1}\left[\Gamma \left(\frac{7}{3}\right)\right]\left(-\frac{11}{5}\right)-e^{-\left(-\frac{11}{5}\right)}\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{\frac{13}{4}}^{-1}\left[\Gamma \left(\frac{13}{4}\right)\right]\left(-\frac{17}{6}\right)-e^{-\left(-\frac{17}{6}\right)}\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{\frac{19}{8}}^{-1}\left[\Gamma \left(\frac{19}{8}\right)\right]\left(-\frac{23}{9}\right)-e^{-\left(-\frac{23}{9}\right)}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
pi-csc-to-one-over-one-plus-x:
  epsil:
    in: InverseMellinTransform(Pi * Csc(Pi * s), s, x)
    out: 1 / (x + 1)
  tex:
    in: \mathrm{InverseMellinTransform}(\pi\csc(\pi s), s, x)
    out: \frac{1}{x+1}
  fullform:
    in: InverseMellinTransform[Times[Pi, Csc[Times[Pi, s]]], s, x]
  wolfram:
    in: InverseMellinTransform[Times[Pi, Csc[Times[Pi, s]]], s, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{M}_s^{-1}[\pi  \csc (\pi  s)](x)-\frac{1}{x+1}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{M}_{\frac{7}{3}}^{-1}\left[\pi  \csc \left(\pi  \frac{7}{3}\right)\right]\left(-\frac{11}{5}\right)-\frac{1}{-\frac{11}{5}+1}\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{\frac{13}{4}}^{-1}\left[\pi  \csc \left(\pi  \frac{13}{4}\right)\right]\left(-\frac{17}{6}\right)-\frac{1}{-\frac{17}{6}+1}\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{\frac{19}{8}}^{-1}\left[\pi  \csc \left(\pi  \frac{19}{8}\right)\right]\left(-\frac{23}{9}\right)-\frac{1}{-\frac{23}{9}+1}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
pi-csc-over-s-to-log-reciprocal:
  epsil:
    in: InverseMellinTransform(Pi * Csc(Pi * s) / s, s, x)
    out: Ln(1 / x + 1)
  tex:
    in: \mathrm{InverseMellinTransform}(\frac{1}{s}(\pi\csc(\pi s)), s, x)
    out: \ln(\frac{1}{x}+1)
  fullform:
    in: InverseMellinTransform[Divide[Times[Pi, Csc[Times[Pi, s]]], s], s, x]
  wolfram:
    in: InverseMellinTransform[Divide[Times[Pi, Csc[Times[Pi, s]]], s], s, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{M}_s^{-1}\left[\frac{\pi  \csc (\pi  s)}{s}\right](x)-\log \left(\frac{1}{x}+1\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{M}_{\frac{7}{3}}^{-1}\left[\frac{\pi  \csc \left(\pi  \frac{7}{3}\right)}{\frac{7}{3}}\right]\left(-\frac{11}{5}\right)-\log \left(-\frac{1}{\frac{11}{5}}+1\right)\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{\frac{13}{4}}^{-1}\left[\frac{\pi  \csc \left(\pi  \frac{13}{4}\right)}{\frac{13}{4}}\right]\left(-\frac{17}{6}\right)-\log \left(-\frac{1}{\frac{17}{6}}+1\right)\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{\frac{19}{8}}^{-1}\left[\frac{\pi  \csc \left(\pi  \frac{19}{8}\right)}{\frac{19}{8}}\right]\left(-\frac{23}{9}\right)-\log \left(-\frac{1}{\frac{23}{9}}+1\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
shift-gamma-a-plus-s:
  epsil:
    in: InverseMellinTransform(Gamma(a + s), s, x)
    out: ExponentialE ^ (-x) * x ^ a
  tex:
    in: \mathrm{InverseMellinTransform}(\Gamma(a+s), s, x)
    out: \exp(-x)x^{a}
  fullform:
    in: InverseMellinTransform[Gamma[Plus[a, s]], s, x]
  wolfram:
    in: InverseMellinTransform[Gamma[Plus[a, s]], s, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{M}_s^{-1}[\Gamma (a+s)](x)-e^{-x} x^a\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{M}_{-\frac{11}{5}}^{-1}\left[\Gamma \left(\frac{7}{3}-\frac{11}{5}\right)\right]\left(\frac{13}{4}\right)-e^{-\frac{13}{4}} \left(\frac{13}{4}\right)^{\frac{7}{3}}\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{\frac{19}{8}}^{-1}\left[\Gamma \left(-\frac{17}{6}+\frac{19}{8}\right)\right]\left(-\frac{23}{9}\right)-e^{-\left(-\frac{23}{9}\right)} \left(-\frac{23}{9}\right)^{-\frac{17}{6}}\right]\right],\text{Chop}\left[N\left[\mathcal{M}_{-\frac{11}{5}}^{-1}\left[\Gamma \left(\frac{7}{3}-\frac{11}{5}\right)\right]\left(\frac{13}{4}\right)-e^{-\frac{13}{4}} \left(\frac{13}{4}\right)^{\frac{7}{3}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
