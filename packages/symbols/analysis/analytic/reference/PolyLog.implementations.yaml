threads-over-a-list-of-arguments:
  epsil:
    in: PolyLog(2, [0.5, 0.25])
    out: "[0.582_240_526_465_012_5, 0.267_652_639_082_732_5]"
  tex:
    in: \operatorname{Li}_{2}(\bigl\lbrack0.5, 0.25\bigr\rbrack)
    out: \bigl\lbrack0.582\,240\,526\,465\,012\,5, 0.267\,652\,639\,082\,732\,5\bigr\rbrack
  fullform:
    in: PolyLog[2, List[0.5, 0.25]]
  wolfram:
    in: PolyLog[2, List[0.5, 0.25]]
    out: "{0.5822405264650127, 0.2676526390827326}"
    tex:
      in: \text{Li}_2(\{0.5,0.25\})
      out: \{0.582241,0.267653\}
  sympy:
    in: polylog(2, [0.5, 0.25])
    out: "AttributeError: 'list' object has no attribute 'is_number'"
    verdict: error
    kind: threading
    note: compute-engine's PolyLog threads over (or pools) the list; SymPy's takes scalars.
  sage:
    in: polylog(2, [0.5, 0.25])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's PolyLog is Listable and threads over the list; Sage's takes scalars only.
