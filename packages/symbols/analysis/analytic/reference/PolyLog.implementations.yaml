li-2-1-2-pi-2-12-ln-2-2-2:
  wolfram:
    in: (Plus[PolyLog[2, 0.5], Times[0.5, Power[Log[2], 2]]] == Divide[Power[Pi, 2], 12])
    out: True
    tex:
      in: \text{Li}_2(0.5)+0.5 \log ^2(2)=\frac{\pi ^2}{12}
      out: \text{True}
  sage:
    in: bool((polylog(2, 0.5) + (0.5 * (log(2)^2))) == ((pi^2) / 12))
    out: False
    verdict: disagree
    kind: convention
    note: True identity; the left side is a float and the right stays the symbolic Pi^2/12, and Sage's bool() doesn't coerce a float against an unevaluated symbolic constant, so it reports False instead of proving the identity.
  sympy:
    in: enumeratio_equal((polylog(2, 0.5) + (0.5 * (log(2)**2))), (S((pi**2)) / 12))
    out: True
li-1-2-1-zeta-1-2-a-non-integer-order-from:
  wolfram:
    in: PolyLog[0.5, 1]
    out: ComplexInfinity
    tex:
      in: \text{Li}_{0.5}(1)
      out: \text{ComplexInfinity}
    verdict: disagree
    kind: convention
    note: "Li_{1/2}(1): compute-engine continues in s to ζ(1/2); Wolfram treats z = 1 as the branch point for s ≤ 1 and returns ComplexInfinity."
  sage:
    in: polylog(0.5, 1)
    out: NaN + NaN*I
    verdict: inconclusive
    kind: domain
    note: compute-engine continues Li_s(1) = ζ(s) to s = 1/2; Sage's polylog returns NaN there.
  mpmath:
    in: polylog(0.5, 1)
    out: "-1.46035450880958681288949915252"
  sympy:
    in: polylog(0.5, 1)
    out: "-1.46035450880959"
