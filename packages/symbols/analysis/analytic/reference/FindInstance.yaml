name: FindInstance
domain: Relations
signature: FindInstance(expr, vars, domain, n)
summary: n instances of vars that make expr true, over domain -- scoped to a provably correct core rather than Wolfram's full solver.
signatures:
  - call: FindInstance(expr, vars)
    description: one instance of vars satisfying expr. Declined here -- the unstated domain is Wolfram's Complexes, outside this scope. See below.
    library: "@enumeratio/analytic"
  - call: FindInstance(expr, vars, domain)
    description: one instance over domain, which must be Reals or Integers.
    library: "@enumeratio/analytic"
  - call: FindInstance(expr, vars, domain, n)
    description: up to n instances over domain.
    library: "@enumeratio/analytic"
details:
  - "Three provably correct paths, tried in order: a univariate polynomial equation of degree <= 2 with exact integer coefficients, solved by our own quadratic formula -- a COMPLETE real-root enumeration, so when every root fails the rest of the constraints, the conjunction is genuinely infeasible; failing that, compute-engine's [[Solve]] as a best-effort finder for equations it happens to solve (never trusted to prove absence); and a bounded integer search, brute-forced over a box whose edges every variable's simple inequalities in expr imply directly."
  - Every candidate is re-substituted into every original constraint and re-evaluated before being returned -- the actual safety net, independent of which path produced it.
  - An empty result ([]) is only ever returned when infeasibility is proven -- the quadratic route's complete root set, or the bounded search's exhaustive box -- never merely because nothing was found.
  - "Declines (leaves the call unevaluated) on: the unstated default domain (Complexes); any domain but Reals or Integers; more than one variable without a bounded Integers search; a pure inequality over Reals (no equation, so no provable witness); Or; and an integer search whose bounds are not directly implied by expr's own inequalities."
  - Matches Wolfram''s output shape -- a list of rule lists, `{{x -> 1}}` -- via [[Rule]].
examples:
  - id: a-quadratic-with-two-real-roots
    expr: [FindInstance, [Equal, [Power, x, 2], 4], x, Reals]
    expected: [List, [List, [Rule, x, 2]]]
    caption: A quadratic with two real roots -- one instance by default
  - id: both-roots-with-an-explicit-count
    expr: [FindInstance, [Equal, [Power, x, 2], 4], x, Reals, 2]
    expected: [List, [List, [Rule, x, 2]], [List, [Rule, x, -2]]]
    caption: Both roots, with an explicit count
  - id: an-irrational-root-is-exact
    expr: [FindInstance, [Equal, [Power, x, 2], 2], x, Reals]
    expected: [List, [List, [Rule, x, [Sqrt, 2]]]]
    category: Scope
    caption: An irrational root comes back exact, not a decimal approximation
  - id: a-linear-equation
    expr: [FindInstance, [Equal, [Add, [Multiply, 2, x], 3], 7], x, Reals]
    expected: [List, [List, [Rule, x, 2]]]
    category: Scope
    caption: A linear equation
  - id: no-real-root-is-a-proven-empty-result
    expr: [FindInstance, [Equal, [Power, x, 2], -1], x, Reals]
    expected: [List]
    category: Scope
    caption: No real root -- a proven empty result, not a guess
  - id: a-non-integer-root-is-also-proven-empty
    expr: [FindInstance, [Equal, [Power, x, 2], 2], x, Integers]
    expected: [List]
    category: Scope
    caption: The same equation over Integers -- both roots are irrational, so still proven empty
  - id: a-bounded-integer-search
    expr: [FindInstance, [And, [Greater, x, 0], [Less, x, 10]], x, Integers, 3]
    expected: [List, [List, [Rule, x, 1]], [List, [Rule, x, 2]], [List, [Rule, x, 3]]]
    category: Scope
    caption: A bounded integer search -- no equation needed, just inequalities that imply a finite range
  - id: a-multivariate-bounded-integer-search
    expr:
      [
        FindInstance,
        [And, [Equal, [Add, x, y], 5], [Greater, x, 0], [Less, x, 10], [Greater, y, 0], [Less, y, 10]],
        [List, x, y],
        Integers,
        3,
      ]
    expected:
      [List, [List, [Rule, x, 1], [Rule, y, 4]], [List, [Rule, x, 2], [Rule, y, 3]], [List, [Rule, x, 3], [Rule, y, 2]]]
    category: Scope
    caption: A multivariate bounded integer search
  - id: declines-without-an-explicit-domain
    expr: [FindInstance, [Greater, x, 0], x]
    expected: [FindInstance, [Greater, x, 0], x]
    category: Possible issues
    caption: Declines without an explicit domain -- the unstated default is Complexes, outside this scope
  - id: declines-on-a-pure-inequality-over-reals
    expr: [FindInstance, [Greater, x, 0], x, Reals]
    expected: [FindInstance, [Greater, x, 0], x, Reals]
    category: Possible issues
    caption: Declines on a pure inequality over Reals -- infinitely many witnesses and no provable canonical one
seeAlso:
  - Solve
  - Rule
  - Inequality
