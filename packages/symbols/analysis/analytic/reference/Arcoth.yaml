name: Arcoth
domain: Elementary functions
signature: Arcoth(x)
summary: Inverse hyperbolic cotangent, the inverse of Coth.
signatures:
  - call: Arcoth(x)
    description: the value $y$ with $\coth(y) = x$.
details:
  - Stays symbolic at plain evaluation, same as [[Arsinh]]-family functions; wrap in N(...).
seeAlso:
  - Artanh
names:
  wolfram: ArcCoth
