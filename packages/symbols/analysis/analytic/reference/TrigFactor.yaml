name: TrigFactor
domain: Transformations
signature: TrigFactor(expr)
summary: The factoring counterpart of TrigExpand/TrigReduce — rewrites sums and differences of Sin/Cos into products.
signatures:
  - call: TrigFactor(expr)
    description: an identity for `expr`, factored via the sum-to-product/half-angle identities or, for a genuine polynomial in `Sin(x0)`/`Cos(x0)`, via `Factor` after substitution.
    library: "@enumeratio/analytic"
details:
  - "Two independent strategies, tried in order: (1) the four sum-to-product identities ($\\sin a\\pm\\sin b$, $\\cos a\\pm\\cos b$) and the two half-angle identities ($1\\pm\\cos x$), matched structurally (each confirmed against `wolframscript`'s own `TrigFactor`, up to reordering); (2) failing that, if `expr` is a genuine polynomial in `Sin(x0)`/`Cos(x0)` for one common argument `x0` (`Add`/`Subtract`/`Negate`/`Multiply`/an integer `Power` over those two atoms and `x0`-free numeric coefficients), substitute `u = Sin(x0)`, `v = Cos(x0)`, factor the polynomial in `u`, `v` with compute-engine's own `Factor`, and substitute back."
  - The polynomial strategy is provably correct (whatever `Factor` returns for the polynomial IS one, so re-substituting reconstructs the identity) but does not chase the extra trig identities Wolfram's own `TrigFactor` sometimes prefers — e.g. it rewrites $\sin^2x-\cos^2x$ as $-2\sin(\pi/4-x)\sin(\pi/4+x)$ rather than the plain difference-of-squares $(\sin x-\cos x)(\sin x+\cos x)$ this file gives; both are correct identities, just not the same factorization.
  - 'Declined: two DIFFERENT trig arguments mixed together outside the four named pairs (e.g. $\sin a\cos b$), any transcendental other than Sin/Cos, and an argument-dependent (non-integer) exponent.'
examples:
  - id: sin-a-plus-sin-b
    expr: [TrigFactor, [Add, [Sin, a], [Sin, b]]]
    expected:
      [
        Multiply,
        2,
        [Sin, [Multiply, [Rational, 1, 2], [Add, a, b]]],
        [Cos, [Multiply, [Rational, 1, 2], [Add, a, [Negate, b]]]],
      ]
    caption: $\sin a+\sin b = 2\sin(\frac{a+b}2)\cos(\frac{a-b}2)$
  - id: cos-a-minus-cos-b
    expr: [TrigFactor, [Subtract, [Cos, a], [Cos, b]]]
    expected:
      [
        Multiply,
        -2,
        [Sin, [Multiply, [Rational, 1, 2], [Add, a, b]]],
        [Sin, [Multiply, [Rational, 1, 2], [Add, a, [Negate, b]]]],
      ]
    caption: $\cos a-\cos b = -2\sin(\frac{a+b}2)\sin(\frac{a-b}2)$
  - id: one-minus-cos-x
    expr: [TrigFactor, [Subtract, 1, [Cos, x]]]
    expected: [Multiply, 2, [Power, [Sin, [Multiply, [Rational, 1, 2], x]], 2]]
    caption: $1-\cos x = 2\sin^2(x/2)$
  - id: poly-in-sin-cos
    expr: [TrigFactor, [Add, [Power, [Sin, x], 2], [Multiply, 2, [Sin, x], [Cos, x]], [Power, [Cos, x], 2]]]
    expected: [Power, [Add, [Sin, x], [Cos, x]], 2]
    category: Scope
    caption: the polynomial strategy — $\sin^2x+2\sin x\cos x+\cos^2x = (\sin x+\cos x)^2$
primitive: kernel
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/trig-factor.ts
seeAlso:
  - ExpToTrig
  - FunctionExpand
