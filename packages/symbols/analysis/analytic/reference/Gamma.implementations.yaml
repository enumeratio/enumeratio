threads-over-a-list-so-poles-evaluate-concretely:
  wolfram:
    in: Gamma[List[0, -1]]
    out: "{ComplexInfinity, ComplexInfinity}"
    tex:
      in: \Gamma (\{0,-1\})
      out: \{\text{ComplexInfinity},\text{ComplexInfinity}\}
  sage:
    in: gamma([0, -1])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Gamma is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: gamma(list(vec![n(0), n(-1)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Gamma is Listable and threads over the list; the Rust crates take scalars.
  mpmath:
    in: "[gamma(0), gamma((-1))]"
    out: "ValueError: gamma function pole"
    verdict: error
    kind: undefined-form
    note: The list wrapper is incidental -- mpmath's gamma(0) raises before the list is even built. Both decline at the pole (ours answers ComplexInfinity, mpmath raises), same as the single-argument pole example above.
  sympy:
    in: "[gamma(0), gamma((-1))]"
    out: "[zoo, zoo]"
extends-the-factorial-gamma-n-1-n-so-gamma-6-5:
  wolfram:
    in: (Gamma[6] == Factorial[5])
    out: True
    tex:
      in: \Gamma (6)=5!
      out: \text{True}
  sage:
    in: bool(gamma(6) == factorial(5))
    out: True
  rust:
    in: equal(gamma(n(6)), factorial(n(5)))
    out: "true"
  sympy:
    in: enumeratio_equal(gamma(6), factorial(5))
    out: True
functional-equation-gamma-z-1-z-gamma-z-here-at:
  wolfram:
    in: (Gamma[6] == Times[5, Gamma[5]])
    out: True
    tex:
      in: \Gamma (6)=5 \Gamma (5)
      out: \text{True}
  sage:
    in: bool(gamma(6) == (5 * gamma(5)))
    out: True
  rust:
