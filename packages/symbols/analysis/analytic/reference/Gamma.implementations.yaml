    out: True
  rust:
    in: equal(gamma(rational(n(1), n(2))), sqrt(x(std::f64::consts::PI)))
    out: "true"
  sympy:
    in: enumeratio_equal(gamma(Rational(1, 2)), sqrt(pi))
    out: True
the-volume-of-a-unit-4-ball-is-pi-n-2-gamma-n-2:
  wolfram:
    in: (Divide[Power[Pi, 2], Gamma[3]] == Divide[Power[Pi, 2], 2])
    out: True
    tex:
      in: \frac{\pi ^2}{\Gamma (3)}=\frac{\pi ^2}{2}
      out: \text{True}
  sage:
    in: bool(((pi^2) / gamma(3)) == ((pi^2) / 2))
    out: True
  rust:
    in: equal((power(x(std::f64::consts::PI), n(2)) / gamma(n(3))), (power(x(std::f64::consts::PI), n(2)) / n(2)))
    out: "true"
  sympy:
    in: enumeratio_equal((S((pi**2)) / gamma(3)), (S((pi**2)) / 2))
    out: True
squaring-the-reflection-formula-at-z-1-2:
