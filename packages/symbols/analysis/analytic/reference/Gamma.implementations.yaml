a-pole-of-gamma:
  wolfram:
    in: Gamma[0]
    out: ComplexInfinity
    tex:
      in: \Gamma (0)
      out: \text{ComplexInfinity}
  sage:
    in: gamma(0)
    out: Infinity
    verdict: disagree
    kind: undefined-form
    note: The pole is ComplexInfinity here; Sage's gamma(0) spells the same pole 'Infinity' (unsigned), a different notation for the same undefined value.
  rust:
    in: gamma(n(0))
    out: PositiveInfinity
    verdict: disagree
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity", and Rust gives PositiveInfinity.'
  mpmath:
    in: gamma(0)
    out: "ValueError: gamma function pole"
    verdict: error
    kind: undefined-form
    note: "A pole or undefined value: compute-engine answers ComplexInfinity, mpmath gives ValueError: gamma function pole."
  sympy:
    in: gamma(0)
    out: zoo
