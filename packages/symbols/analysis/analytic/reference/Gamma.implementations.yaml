    out: True
  sympy:
    in: enumeratio_equal(gamma(6), (5 * gamma(5)))
    out: True
reflection-formula-gamma-z-gamma-1-z-pi-sin-pi-z:
  wolfram:
    in: (Times[Gamma[Rational[1, 3]], Gamma[Rational[2, 3]]] == Divide[Pi, Sin[Divide[Pi, 3]]])
    out: Gamma[1/3]*Gamma[2/3] == (2*Pi)/Sqrt[3]
    tex:
      in: \Gamma \left(\frac{1}{3}\right) \Gamma \left(\frac{2}{3}\right)=\frac{\pi }{\sin \left(\frac{\pi }{3}\right)}
      out: \Gamma \left(\frac{1}{3}\right) \Gamma \left(\frac{2}{3}\right)=\frac{2 \pi }{\sqrt{3}}
  sage:
    in: bool((gamma((1/3)) * gamma((2/3))) == (pi / sin((pi / 3))))
    out: False
    verdict: disagree
    kind: convention
    note: True by the reflection formula; Sage's bool(a==b) doesn't invoke that identity automatically on unevaluated symbolic Gammas and reports False instead of attempting the proof.
  rust:
    in: equal((gamma(rational(n(1), n(3))) * gamma(rational(n(2), n(3)))), (x(std::f64::consts::PI) / sin((x(std::f64::consts::PI) / n(3)))))
    out: "true"
  sympy:
    in: enumeratio_equal((gamma(Rational(1, 3)) * gamma(Rational(2, 3))), (S(pi) / sin((S(pi) / 3))))
    out: True
gamma-1-2-sqrt-pi:
