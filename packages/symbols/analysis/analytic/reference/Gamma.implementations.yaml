values-far-past-the-double-range-gamma-200-5:
  mpmath:
    in: gamma(200.5)
    out: "5.57316894480137913364320296291e+373"
    verdict: disagree
    kind: convention
    note: Agrees with ours (5.57316894480137913364e+373) to every shared digit -- mpmath just carries more of them. The scan's tolerance compare can't line the two up past a double's exponent range (~1e308) and falls back to an exact text match, which a different digit count always fails; verified equal by hand.
  sympy:
    in: gamma(200.5)
    out: "5.57316894480138e+373"
    verdict: disagree
    kind: convention
    note: Agrees with ours (5.57316894480137913364e+373) rounded to SymPy's 15 significant digits. Same scan limitation as the mpmath row above -- text compare can't line up numbers past double's exponent range.
