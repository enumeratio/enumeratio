    in: LerchPhi(1, -1, 1)
    out: -1 / 12
  tex:
    in: \mathrm{LerchPhi}(1, -1, 1)
    out: -\frac{1}{12}
  traditional:
    in: \Phi(1, -1, 1)
    out: -\frac{1}{12}
  wolfram:
    in: LerchPhi[1, -1, 1]
    out: ComplexInfinity
    tex:
      in: \Phi (1,-1,1)
      out: \text{ComplexInfinity}
    verdict: disagree
    kind: convention
    note: At z = 1 compute-engine continues in s, giving ζ(-1) = -1/12; Wolfram's LerchPhi does not regularise the divergent series at z = 1 and returns ComplexInfinity (though its Zeta[-1] does).
