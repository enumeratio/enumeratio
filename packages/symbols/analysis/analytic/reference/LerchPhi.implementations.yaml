phi-1-3-1-zeta-3-apery-s-constant:
  wolfram:
    in: (LerchPhi[1, 3, 1] == Zeta[3])
    out: True
    tex:
      in: \Phi (1,3,1)=\zeta (3)
      out: \text{True}
  mpmath:
    in: almosteq(lerchphi(1, 3, 1), zeta(3), 1e-20)
    out: True
  sympy:
    in: enumeratio_equal(lerchphi(1, 3, 1), zeta(3))
    out: True
phi-1-2-1-eta-2-pi-2-12-the-alternating-rim-via:
  wolfram:
    in: (LerchPhi[-1, 2, 1] == Divide[Power[Pi, 2], 12])
    out: True
    tex:
      in: \Phi (-1,2,1)=\frac{\pi ^2}{12}
      out: \text{True}
  sympy:
    in: enumeratio_equal(lerchphi((-1), 2, 1), (S((pi**2)) / 12))
    out: True
