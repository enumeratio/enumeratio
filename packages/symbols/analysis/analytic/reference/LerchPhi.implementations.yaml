phi-1-1-1-zeta-1-1-12:
  wolfram:
    in: LerchPhi[1, -1, 1]
    out: ComplexInfinity
    tex:
      in: \Phi (1,-1,1)
      out: \text{ComplexInfinity}
    verdict: disagree
    kind: convention
    note: At z = 1 compute-engine continues in s, giving ζ(-1) = -1/12; Wolfram's LerchPhi does not regularise the divergent series at z = 1 and returns ComplexInfinity (though its Zeta[-1] does).
  mpmath:
    in: lerchphi(1, (-1), 1)
    out: "-0.0833333333333333333333333333333"
  sympy:
    in: lerchphi(1, (-1), 1)
    out: lerchphi(1, -1, 1)
past-the-unit-disk-by-the-integral:
  wolfram:
    in: N[LerchPhi[Complex[1, 2], Complex[3, -1], Complex[4, 2]]]
    out: 0.0020250151909632203 + 0.003327898913888968*I
    tex:
      in: N[\Phi (1+2 i,3-i,4+2 i)]
      out: 0.00202502\, +0.0033279 i
    verdict: disagree
    kind: precision
    note: Wolfram's machine-precision N drifts from the sixth digit here (0.00202501519…); N[LerchPhi[1 + 2 I, 3 - I, 4 + 2 I], 30] agrees with this value, as do mpmath and SymPy.
  mpmath:
    in: (lerchphi(mpc(1, 2), mpc(3, (-1)), mpc(4, 2)))
    out: (0.00202500995700990860053946871764 + 0.00332789753681355880743808908022j)
  sympy:
    in: N(lerchphi((1 + 2*I), (3 + (-1)*I), (4 + 2*I)), 30)
    out: 0.00202500995700990860053946871764 + 0.00332789753681355880743808908022*I
