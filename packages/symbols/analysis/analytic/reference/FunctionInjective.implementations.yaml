a-reciprocal-is-injective-on-its-own-domain:
  epsil:
    in: FunctionInjective(1 / x, x)
    out: True
  tex:
    in: \mathrm{FunctionInjective}(\frac{1}{x}, x)
    out: \top
  traditional:
    in: \mathrm{FunctionInjective}(\frac{1}{x}, x)
    out: \mathrm{True}
  fullform:
    in: FunctionInjective[Divide[1, x], x]
  wolfram:
    in: FunctionInjective[Divide[1, x], x]
    out: True
    tex:
      in: \text{FunctionInjective}\left[\frac{1}{x},x\right]
      out: \text{True}
a-cubic-is-injective:
  epsil:
    in: FunctionInjective(x ^ 3, x)
    out: True
  tex:
    in: \mathrm{FunctionInjective}(x^3, x)
    out: \top
  traditional:
    in: \mathrm{FunctionInjective}(x^3, x)
    out: \mathrm{True}
  fullform:
    in: FunctionInjective[Power[x, 3], x]
  wolfram:
    in: FunctionInjective[Power[x, 3], x]
    out: True
    tex:
      in: \text{FunctionInjective}\left[x^3,x\right]
      out: \text{True}
a-parabola-is-not-injective:
  epsil:
    in: FunctionInjective(x ^ 2, x)
    out: False
  tex:
    in: \mathrm{FunctionInjective}(x^2, x)
    out: \bot
  traditional:
    in: \mathrm{FunctionInjective}(x^2, x)
    out: \mathrm{False}
  fullform:
    in: FunctionInjective[Power[x, 2], x]
  wolfram:
    in: FunctionInjective[Power[x, 2], x]
    out: False
    tex:
      in: \text{FunctionInjective}\left[x^2,x\right]
      out: \text{False}
an-affine-function-is-injective:
  epsil:
    in: FunctionInjective(2x + 1, x)
    out: True
  tex:
    in: \mathrm{FunctionInjective}(2x+1, x)
    out: \top
  traditional:
    in: \mathrm{FunctionInjective}(2x+1, x)
    out: \mathrm{True}
  fullform:
    in: FunctionInjective[Plus[Times[2, x], 1], x]
  wolfram:
    in: FunctionInjective[Plus[Times[2, x], 1], x]
    out: True
    tex:
      in: \text{FunctionInjective}[2 x+1,x]
      out: \text{True}
