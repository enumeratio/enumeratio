even-function-cos-x-cos-x:
  wolfram:
    in: (Cos[Minus[Divide[Pi, 3]]] == Cos[Divide[Pi, 3]])
    out: True
    tex:
      in: \cos \left(-\frac{\pi }{3}\right)=\cos \left(\frac{\pi }{3}\right)
      out: \text{True}
  sage:
    in: bool(cos((-(pi / 3))) == cos((pi / 3)))
    out: True
  rust:
    in: equal(cos((-((x(std::f64::consts::PI) / n(3))))), cos((x(std::f64::consts::PI) / n(3))))
    out: "true"
  sympy:
    in: enumeratio_equal(cos((-(S(pi) / 3))), cos((S(pi) / 3)))
    out: True
co-function-identity-cos-x-sin-pi-2-x:
  wolfram:
    in: (Cos[Divide[Pi, 6]] == Sin[Subtract[Divide[Pi, 2], Divide[Pi, 6]]])
    out: True
    tex:
      in: \cos \left(\frac{\pi }{6}\right)=\sin \left(\frac{\pi }{2}-\frac{\pi }{6}\right)
      out: \text{True}
  sage:
    in: bool(cos((pi / 6)) == sin(((pi / 2) - (pi / 6))))
    out: True
  rust:
    in: equal(cos((x(std::f64::consts::PI) / n(6))), sin(((x(std::f64::consts::PI) / n(2)) - (x(std::f64::consts::PI) / n(6)))))
    out: "true"
  sympy:
    in: enumeratio_equal(cos((S(pi) / 6)), sin(((S(pi) / 2) - (S(pi) / 6))))
    out: True
threads-element-wise-over-a-list:
  wolfram:
    in: Cos[List[0, Divide[Pi, 2], Pi]]
    out: "{1, 0, -1}"
    tex:
      in: \cos \left(\left\{0,\frac{\pi }{2},\pi \right\}\right)
      out: \{1,0,-1\}
  sage:
    in: cos([0, (pi / 2), pi])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Cos is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: cos(list(vec![n(0), (x(std::f64::consts::PI) / n(2)), x(std::f64::consts::PI)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Cos is Listable and threads over the list; the Rust crates take scalars.
  sympy:
    in: cos([0, (S(pi) / 2), pi])
    out: "AttributeError: 'list' object has no attribute 'is_Number'"
    verdict: error
    kind: threading
    note: compute-engine's Cos threads over (or pools) the list; SymPy's takes scalars.
