cos-pi-5-frac-1-sqrt-5-4-related-to-the-golden:
  wolfram:
    in: Cos[Divide[Pi, 5]]
    out: (1 + Sqrt[5])/4
    tex:
      in: \cos \left(\frac{\pi }{5}\right)
      out: \frac{1}{4} \left(1+\sqrt{5}\right)
  sage:
    in: cos((pi / 5))
    out: 1/4*sqrt(5) + 1/4
  rust:
    in: cos((x(std::f64::consts::PI) / n(5)))
    out: "0.8090169943749475"
  sympy:
    in: cos((S(pi) / 5))
    out: 1/4 + sqrt(5)/4
taylor-series-about-0-only-even-powers-appear:
