    in: TrigReduce(Cos(x) ^ 2)
    out: 1 / 2 * Cos(2x) + 1 / 2
  tex:
    in: \mathrm{TrigReduce}(\cos(x)^2)
    out: \frac{\cos(2x)}{2}+\frac{1}{2}
  fullform:
    in: TrigReduce[Power[Cos[x], 2]]
euler-s-formula-cos-x-frac-e-ix-e-ix-2:
  epsil:
    in: TrigToExp(Cos(x))
    out: 1 / 2 * (ExponentialE ^ (i * x) + ExponentialE ^ (-i * x))
  tex:
    in: \mathrm{TrigToExp}(\cos(x))
    out: \frac{1}{2}(\exp(i x)+\exp(-i x))
  fullform:
    in: TrigToExp[Cos[x]]
pi-24-is-past-the-automatic-special-angle-table:
  epsil:
    in: Cos(1 / 24 * Pi)
    out: Cos(1 / 24 * Pi)
  tex:
    in: \cos(\frac{\pi}{24})
    out: \cos(\frac{\pi}{24})
  fullform:
    in: Cos[Times[Rational[1, 24], Pi]]
  wolfram:
    in: Cos[Times[Rational[1, 24], Pi]]
  sympy:
    in: cos((Rational(1, 24) * pi))
    out: sqrt(1/2 - sqrt(2)/4)/2 + sqrt(3)*sqrt(sqrt(2)/4 + 1/2)/2
  mpmath:
    in: cos(((mpf(1)/24) * pi))
    out: "0.991444861373810411144557526929"
  sage:
    in: cos(((1/24) * pi))
  rust:
    in: cos((rational(n(1), n(24)) * x(std::f64::consts::PI)))
    out: "0.9914448613738104"
to-30-significant-digits-every-one-correctly:
  epsil:
    in: N(Cos(1), 30)
    out: 0.540_302_305_868_139_717_400_936_607_443
  tex:
    in: N(\cos(1), 30)
    out: 0.540\,302\,305\,868\,139\,717\,401
  fullform:
    in: N[Cos[1], 30]
  wolfram:
    in: N[Cos[1], 30]
  sympy:
    in: N(cos(1), 30)
    out: "0.540302305868139717400936607443"
  mpmath:
    in: (cos(1))
    out: "0.540302305868139717400936607443"
  sage:
    in: N(cos(1))
  rust:
    in: nf(cos(n(1)))
    out: "0.5403023058681398"
to-1-significant-digit:
  epsil:
    in: N(Cos(1), 1)
    out: "0.5"
  tex:
    in: N(\cos(1), 1)
    out: "0.5"
  fullform:
    in: N[Cos[1], 1]
  wolfram:
    in: N[Cos[1], 1]
  sympy:
    in: N(cos(1), 30)
    out: "0.540302305868139717400936607443"
    verdict: disagree
    kind: precision
    note: "The mapping evaluates at the system's own precision and drops N's digit count, so it prints every digit."
  mpmath:
    in: (cos(1))
    out: "0.540302305868139717400936607443"
    verdict: disagree
    kind: precision
    note: N's digit count is dropped for mpmath, per the mapping's own note -- it always returns full working precision rather than the one digit asked for (same gap as the Rust row above).
  sage:
    in: N(cos(1))
  rust:
    in: nf(cos(n(1)))
    out: "0.5403023058681398"
    verdict: disagree
    kind: precision
    note: N's digit count is dropped for Rust, per the mapping's own note -- it always returns full f64 precision rather than the one digit asked for.
a-huge-10-100-argument-reduces-exactly-mod-2-pi:
  epsil:
    in: N(Cos(10 ^ 100))
    out: -0.928_081_905_074_655_343_456
  tex:
    in: N(\cos(10^{100}))
    out: -0.928\,081\,905\,074\,655\,343\,456
  fullform:
    in: N[Cos[Power[10, 100]]]
  wolfram:
    in: N[Cos[Power[10, 100]]]
  sympy:
    in: N(cos((S(10)**100)), 30)
    out: "-0.928081905074655343456194643777"
  mpmath:
    in: (cos(((10)**100)))
    out: "-0.928081905074655343456194643777"
  sage:
    in: N(cos(((10)^100)))
  rust:
    in: nf(cos(power(n(10), n(100))))
    out: "0.9247242387519338"
    verdict: disagree
    kind: precision
    note: Rust reduces the argument in f64, which can't hold 10^100 exactly; compute-engine reduces it exactly.
