    out: \bigl\lbrack1, 0, -1\bigr\rbrack
  fullform:
    in: Cos[List[0, Divide[Pi, 2], Pi]]
  wolfram:
    in: Cos[List[0, Divide[Pi, 2], Pi]]
    out: "{1, 0, -1}"
    tex:
      in: \cos \left(\left\{0,\frac{\pi }{2},\pi \right\}\right)
      out: \{1,0,-1\}
  sympy:
    in: "[cos(0), cos((S(pi) / 2)), cos(pi)]"
    out: "[1, 0, -1]"
  sage:
    in: "[cos(0), cos((pi / 2)), cos(pi)]"
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Cos is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: cos(list(vec![n(0), (x(std::f64::consts::PI) / n(2)), x(std::f64::consts::PI)]))
    out: "panic: threading: a list where the crate takes a scalar"
