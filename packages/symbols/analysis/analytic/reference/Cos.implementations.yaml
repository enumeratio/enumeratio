cos-pi-over-6:
  wolfram:
    in: Cos[Divide[Pi, 6]]
    out: Sqrt[3]/2
    tex:
      in: \cos \left(\frac{\pi }{6}\right)
      out: \frac{\sqrt{3}}{2}
  sage:
    in: cos((pi / 6))
    out: 1/2*sqrt(3)
  rust:
    in: cos((x(std::f64::consts::PI) / n(6)))
    out: "0.8660254037844387"
  sympy:
    in: cos((S(pi) / 6))
    out: sqrt(3)/2
