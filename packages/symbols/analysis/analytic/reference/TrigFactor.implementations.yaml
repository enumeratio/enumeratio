sin-a-plus-sin-b:
  epsil:
    in: TrigFactor(Sin(a) + Sin(b))
    out: 2 * Sin(1 / 2 * (a + b)) * Cos(1 / 2 * (a - b))
  tex:
    in: \mathrm{TrigFactor}(\sin(a)+\sin(b))
    out: 2\sin(\frac{a+b}{2})\cos(\frac{a-b}{2})
  fullform:
    in: TrigFactor[Plus[Sin[a], Sin[b]]]
  wolfram:
    in: TrigFactor[Plus[Sin[a], Sin[b]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{TrigFactor}[\sin (a)+\sin (b)]-2 \sin \left(\frac{1}{2} (a+b)\right) \cos \left(\frac{1}{2} (a-b)\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{TrigFactor}\left[\sin \left(\frac{7}{3}\right)+\sin \left(-\frac{11}{5}\right)\right]-2 \sin \left(\frac{1}{2} \left(\frac{7}{3}-\frac{11}{5}\right)\right) \cos \left(\frac{1}{2} \left(\frac{7}{3}--\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[\sin \left(\frac{13}{4}\right)+\sin \left(-\frac{17}{6}\right)\right]-2 \sin \left(\frac{1}{2} \left(\frac{13}{4}-\frac{17}{6}\right)\right) \cos \left(\frac{1}{2} \left(\frac{13}{4}--\frac{17}{6}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[\sin \left(\frac{19}{8}\right)+\sin \left(-\frac{23}{9}\right)\right]-2 \sin \left(\frac{1}{2} \left(\frac{19}{8}-\frac{23}{9}\right)\right) \cos \left(\frac{1}{2} \left(\frac{19}{8}--\frac{23}{9}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
cos-a-minus-cos-b:
  epsil:
    in: TrigFactor(Cos(a) - Cos(b))
    out: -2 * Sin(1 / 2 * (a + b)) * Sin(1 / 2 * (a - b))
  tex:
    in: \mathrm{TrigFactor}(\cos(a)-\cos(b))
    out: -2\sin(\frac{a+b}{2})\sin(\frac{a-b}{2})
  fullform:
    in: TrigFactor[Subtract[Cos[a], Cos[b]]]
  wolfram:
    in: TrigFactor[Subtract[Cos[a], Cos[b]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{TrigFactor}[\cos (a)-\cos (b)]--2 \sin \left(\frac{1}{2} (a+b)\right) \sin \left(\frac{1}{2} (a-b)\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{TrigFactor}\left[\cos \left(\frac{7}{3}\right)-\cos \left(-\frac{11}{5}\right)\right]--2 \sin \left(\frac{1}{2} \left(\frac{7}{3}-\frac{11}{5}\right)\right) \sin \left(\frac{1}{2} \left(\frac{7}{3}--\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[\cos \left(\frac{13}{4}\right)-\cos \left(-\frac{17}{6}\right)\right]--2 \sin \left(\frac{1}{2} \left(\frac{13}{4}-\frac{17}{6}\right)\right) \sin \left(\frac{1}{2} \left(\frac{13}{4}--\frac{17}{6}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[\cos \left(\frac{19}{8}\right)-\cos \left(-\frac{23}{9}\right)\right]--2 \sin \left(\frac{1}{2} \left(\frac{19}{8}-\frac{23}{9}\right)\right) \sin \left(\frac{1}{2} \left(\frac{19}{8}--\frac{23}{9}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
one-minus-cos-x:
  epsil:
    in: TrigFactor(1 - Cos(x))
    out: 2 * Sin(1 / 2 * x) ^ 2
  tex:
    in: \mathrm{TrigFactor}(1-\cos(x))
    out: 2\sin(\frac{x}{2})^2
  fullform:
    in: TrigFactor[Subtract[1, Cos[x]]]
  wolfram:
    in: TrigFactor[Subtract[1, Cos[x]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{TrigFactor}[1-\cos (x)]-2 \sin ^2\left(\frac{1}{2} x\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{TrigFactor}\left[1-\cos \left(\frac{7}{3}\right)\right]-2 \sin ^2\left(\frac{1}{2} \frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[1-\cos \left(-\frac{11}{5}\right)\right]-2 \sin ^2\left(\frac{1}{2} \left(-\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[1-\cos \left(\frac{13}{4}\right)\right]-2 \sin ^2\left(\frac{1}{2} \frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
poly-in-sin-cos:
  epsil:
    in: TrigFactor(Sin(x) ^ 2 + 2 * Sin(x) * Cos(x) + Cos(x) ^ 2)
    out: (Sin(x) + Cos(x)) ^ 2
  tex:
    in: \mathrm{TrigFactor}(\sin(x)^2+2\sin(x)\cos(x)+\cos(x)^2)
    out: (\sin(x)+\cos(x))^2
  fullform:
    in: TrigFactor[Plus[Power[Sin[x], 2], Times[2, Sin[x], Cos[x]], Power[Cos[x], 2]]]
  wolfram:
    in: TrigFactor[Plus[Power[Sin[x], 2], Times[2, Sin[x], Cos[x]], Power[Cos[x], 2]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{TrigFactor}\left[\sin ^2(x)+2 \sin (x) \cos (x)+\cos ^2(x)\right]-(\sin (x)+\cos (x))^2\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{TrigFactor}\left[\sin ^2\left(\frac{7}{3}\right)+2 \sin \left(\frac{7}{3}\right) \cos \left(\frac{7}{3}\right)+\cos ^2\left(\frac{7}{3}\right)\right]-\left(\sin \left(\frac{7}{3}\right)+\cos \left(\frac{7}{3}\right)\right)^2\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[\sin ^2\left(-\frac{11}{5}\right)+2 \sin \left(-\frac{11}{5}\right) \cos \left(-\frac{11}{5}\right)+\cos ^2\left(-\frac{11}{5}\right)\right]-\left(\sin \left(-\frac{11}{5}\right)+\cos \left(-\frac{11}{5}\right)\right)^2\right]\right],\text{Chop}\left[N\left[\text{TrigFactor}\left[\sin ^2\left(\frac{13}{4}\right)+2 \sin \left(\frac{13}{4}\right) \cos \left(\frac{13}{4}\right)+\cos ^2\left(\frac{13}{4}\right)\right]-\left(\sin \left(\frac{13}{4}\right)+\cos \left(\frac{13}{4}\right)\right)^2\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
