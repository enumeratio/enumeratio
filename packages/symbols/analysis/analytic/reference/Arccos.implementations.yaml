arccos-1:
  epsil:
    in: Arccos(1)
    out: "0"
  tex:
    in: \arccos(1)
    out: "0"
  wolfram:
    in: ArcCos[1]
    out: "0"
    tex:
      in: \cos ^{-1}(1)
      out: "0"
arccos-1-over-2:
  epsil:
    in: Arccos(1 / 2)
    out: 1 / 3 * Pi
  tex:
    in: \arccos(\frac{1}{2})
    out: \frac{\pi}{3}
  wolfram:
    in: ArcCos[Rational[1, 2]]
    out: Pi/3
    tex:
      in: \cos ^{-1}\left(\frac{1}{2}\right)
      out: \frac{\pi }{3}
arccos-0:
  epsil:
    in: Arccos(0)
    out: 1 / 2 * Pi
  tex:
    in: \arccos(0)
    out: \frac{\pi}{2}
  wolfram:
    in: ArcCos[0]
    out: Pi/2
    tex:
      in: \cos ^{-1}(0)
      out: \frac{\pi }{2}
the-top-of-the-principal-range:
  epsil:
    in: Arccos(-1)
    out: Pi
  tex:
    in: \arccos(-1)
    out: \pi
  wolfram:
    in: ArcCos[-1]
    out: Pi
    tex:
      in: \cos ^{-1}(-1)
      out: \pi
cos-arccos-x-x-on-the-principal-branch:
  epsil:
    in: Cos(Arccos(1 / 2)) == 1 / 2
    out: True
  tex:
    in: \cos(\arccos(\frac{1}{2}))=\frac{1}{2}
    out: \top
  traditional:
    in: \cos(\arccos(\frac{1}{2}))=\frac{1}{2}
    out: \mathrm{True}
  wolfram:
    in: (Cos[ArcCos[Rational[1, 2]]] == Rational[1, 2])
    back: Unreadable
    out: True
    tex:
      in: \cos \left(\cos ^{-1}\left(\frac{1}{2}\right)\right)=\frac{1}{2}
      out: \text{True}
outside-1-1-this-stays-symbolic-same-as-arcsin-n:
  epsil:
    in: Arccos(2)
    out: Arccos(2)
  tex:
    in: \arccos(2)
    out: \arccos(2)
  wolfram:
    in: ArcCos[2]
    out: ArcCos[2]
    tex:
      in: \cos ^{-1}(2)
      out: \cos ^{-1}(2)
a-machine-precision-argument-evaluates:
  epsil:
    in: Arccos(0.4)
    out: 1.159_279_480_727_408_599_85
  tex:
    in: \arccos(0.4)
    out: 1.159\,279\,480\,727\,408\,599\,85
  wolfram:
    in: ArcCos[0.4]
outside-1-1-the-value-is-purely-imaginary:
  epsil:
    in: Arccos(1.5)
    out: 0.962_423_650_119_206_9i
  tex:
    in: \arccos(1.5)
    out: 0.962\,423\,650\,119\,206\,9i
  wolfram:
    in: ArcCos[1.5]
arbitrary-precision-via-n:
  epsil:
    in: N(Arccos(1 / 3))
    out: 1.230_959_417_340_774_682_14
  tex:
    in: N(\arccos(\frac{1}{3}))
    out: 1.230\,959\,417\,340\,774\,682\,14
  wolfram:
    in: N[ArcCos[Rational[1, 3]]]
evaluates-at-a-complex-argument:
  epsil:
    in: Arccos(2.5 + i)
    out: 0.406_172_816_505_511_85 + -1.658_693_298_856_434_7 * i
  tex:
    in: \arccos(2.5+i)
    out: 0.406\,172\,816\,505\,511\,85-1.658\,693\,298\,856\,434\,7i
  wolfram:
    in: ArcCos[Complex[2.5, 1]]
threads-element-wise-over-a-matrix:
  epsil:
    in: Arccos([[1, 1 / Sqrt(2)], [0, 1 / Sqrt(2)]])
    out: "[[0, 1 / 4 * Pi], [1 / 2 * Pi, 1 / 4 * Pi]]"
  tex:
    in: \arccos(\bigl\lbrack\bigl\lbrack1, \frac{1}{2^{1/2}}\bigr\rbrack, \bigl\lbrack0, \frac{1}{2^{1/2}}\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack0, \frac{\pi}{4}\bigr\rbrack, \bigl\lbrack\frac{\pi}{2}, \frac{\pi}{4}\bigr\rbrack\bigr\rbrack
  wolfram:
    in: ArcCos[List[List[1, Divide[1, Sqrt[2]]], List[0, Divide[1, Sqrt[2]]]]]
exact-inverse-of-a-special-value:
  epsil:
    in: Arccos(Sqrt(3) / 2)
    out: 1 / 6 * Pi
  tex:
    in: \arccos(\frac{\sqrt{3}}{2})
    out: \frac{\pi}{6}
  wolfram:
    in: ArcCos[Divide[Sqrt[3], 2]]
arccos-neg-sqrt-2-over-2:
  epsil:
    in: Arccos(-(Sqrt(2) / 2))
    out: 3 / 4 * Pi
  tex:
    in: \arccos(-\frac{\sqrt{2}}{2})
    out: \frac{3\pi}{4}
  wolfram:
    in: ArcCos[Minus[Divide[Sqrt[2], 2]]]
recognizes-cos-pi-5-frac-1-sqrt-5-4:
  epsil:
    in: Arccos((1 + Sqrt(5)) / 4)
    out: 1 / 5 * Pi
  tex:
    in: \arccos(\frac{1+\sqrt{5}}{4})
    out: \frac{\pi}{5}
  wolfram:
    in: ArcCos[Divide[Plus[1, Sqrt[5]], 4]]
interval-arithmetic-decreasing-so-arccos-frac-13:
  epsil:
    in: Arccos(Interval(1 / 3, 1 / 2))
    out: Interval(1 / 3 * Pi, Arccos(1 / 3))
  tex:
    in: \arccos(\mathrm{Interval}(\frac{1}{3}, \frac{1}{2}))
    out: \mathrm{Interval}(\frac{\pi}{3}, \arccos(\frac{1}{3}))
  wolfram:
    in: ArcCos[Interval[List[Rational[1, 3], Rational[1, 2]]]]
uncertainty-propagation-arccos-0-9-pm-0-1-approx:
  epsil:
    in: Arccos(Around(0.9, 0.1))
    out: Around(0.451_026_811_796_262_36, 0.229_415_733_870_561_8)
  tex:
    in: \arccos(\mathrm{Around}(0.9, 0.1))
    out: \mathrm{Around}(0.451\,026\,811\,796\,262\,36, 0.229\,415\,733\,870\,561\,8)
  wolfram:
    in: ArcCos[Around[0.9, 0.1]]
derivative-frac-1-sqrt-1-x-2:
  epsil:
    in: D(Arccos(x), x)
    out: -1 / Sqrt(-x ^ 2 + 1)
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\arccos(x)
    out: -\frac{1}{\sqrt{1-x^2}}
antiderivative:
  epsil:
    in: Integrate(Arccos(x), x)
    out: x * Arccos(x) - Sqrt(-x ^ 2 + 1)
  tex:
    in: \int\!\arccos(x)\, \mathrm{d}x
    out: x\arccos(x)-\sqrt{1-x^2}
reflection-arccos-x-pi-arccos-x:
  epsil:
    in: Arccos(-x)
    out: -Arccos(x) + Pi
  tex:
    in: \arccos(-x)
    out: \pi-\arccos(x)
not-simply-4-4-is-outside-the-principal-range-0:
  epsil:
    in: Arccos(Cos(4))
    out: -4 + 2Pi
  tex:
    in: \arccos(\cos(4))
    out: 2\pi-4
  wolfram:
    in: ArcCos[Cos[4]]
