s-1-2-stays-symbolic-outside-the-depth-2-both:
  epsil:
    in: MultiZetaValue(1, 2)
    out: MultiZetaValue(1, 2)
  tex:
    in: \mathrm{MultiZetaValue}(1, 2)
    out: \mathrm{MultiZetaValue}(1, 2)
  fullform:
    in: MultiZetaValue[1, 2]
  wolfram:
    in: N[Sum[Sum[n1^(-1) n2^(-2), {n2, 1, n1 - 1}], {n1, 2, Infinity}]]
    out: "315188.1291752872"
    tex:
      in: N\left[\sum _{\text{n1}=2}^{\infty } \left(\sum _{\text{n2}=1}^{\text{n1}-1} \frac{1}{\text{n1} \text{n2}^2}\right)\right]
      out: 315188.
    verdict: disagree
    kind: domain
    note: "Expected: s1=1 is outside our depth-2, both-weights->=2 scope, so ours stays symbolic by design (see this entry's own details). The wolfram row's fixed Sum template has no scope gate, so Wolfram happily returns a concrete (if not absolutely-convergent-by-our-standard) number for the same expression."
  mpmath:
    in: "nsum(lambda n1: n1**(-1) * nsum(lambda n2: n2**(-2), [1, n1 - 1]), [2, inf])"
