selects-the-second-branch:
  epsil:
    in: Piecewise([[1, x < 0], [2, x >= 0]])
    out: Piecewise([[1, x < 0], [2, 0 <= x]])
  tex:
    in: \mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack1, x\lt0\bigr\rbrack, \bigl\lbrack2, x\ge0\bigr\rbrack\bigr\rbrack)
    out: \mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack1, x\lt0\bigr\rbrack, \bigl\lbrack2, 0\le x\bigr\rbrack\bigr\rbrack)
  fullform:
    in: Piecewise[List[List[1, Less[x, 0]], List[2, GreaterEqual[x, 0]]]]
  wolfram:
    in: Piecewise[List[List[1, Less[x, 0]], List[2, GreaterEqual[x, 0]]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & x<0 \\  2 & x\geq 0 \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & x<0 \\  2 & 0\leq x \\ \end{array}  \\ \end{array} \right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & \frac{7}{3}<0 \\  2 & \frac{7}{3}\geq 0 \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & \frac{7}{3}<0 \\  2 & 0\leq \frac{7}{3} \\ \end{array}  \\ \end{array} \right)\right]\right],\text{Chop}\left[N\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & -\frac{11}{5}<0 \\  2 & -\frac{11}{5}\geq 0 \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & -\frac{11}{5}<0 \\  2 & 0\leq -\frac{11}{5} \\ \end{array}  \\ \end{array} \right)\right]\right],\text{Chop}\left[N\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & \frac{13}{4}<0 \\  2 & \frac{13}{4}\geq 0 \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  1 & \frac{13}{4}<0 \\  2 & 0\leq \frac{13}{4} \\ \end{array}  \\ \end{array} \right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
evaluated-at-a-concrete-point-below-zero:
  epsil:
    in: ReplaceAll(Piecewise([[1, x < 0], [2, x >= 0]]), Rule(x, -5))
    out: "1"
  tex:
    in: \mathrm{ReplaceAll}(\mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack1, x\lt0\bigr\rbrack, \bigl\lbrack2, x\ge0\bigr\rbrack\bigr\rbrack), \mathrm{Rule}(x, -5))
    out: "1"
  fullform:
    in: ReplaceAll[Piecewise[List[List[1, Less[x, 0]], List[2, GreaterEqual[x, 0]]]], Rule[x, -5]]
    back:
      [ReplaceAll, [Piecewise, [List, [List, 1, [Less, x, 0]], [List, 2, [GreaterEqual, x, 0]]]], [KeyValuePair, x, -5]]
evaluated-at-a-concrete-point-at-or-above-zero:
  epsil:
    in: ReplaceAll(Piecewise([[1, x < 0], [2, x >= 0]]), Rule(x, 5))
    out: "2"
  tex:
    in: \mathrm{ReplaceAll}(\mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack1, x\lt0\bigr\rbrack, \bigl\lbrack2, x\ge0\bigr\rbrack\bigr\rbrack), \mathrm{Rule}(x, 5))
    out: "2"
  fullform:
    in: ReplaceAll[Piecewise[List[List[1, Less[x, 0]], List[2, GreaterEqual[x, 0]]]], Rule[x, 5]]
    back:
      [ReplaceAll, [Piecewise, [List, [List, 1, [Less, x, 0]], [List, 2, [GreaterEqual, x, 0]]]], [KeyValuePair, x, 5]]
falls-through-to-the-explicit-default:
  epsil:
    in: Piecewise([[x ^ 2, x < 0]], 99)
    out: Piecewise([[x ^ 2, x < 0]], 99)
  tex:
    in: \mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack x^2, x\lt0\bigr\rbrack\bigr\rbrack, 99)
    out: \mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack x^2, x\lt0\bigr\rbrack\bigr\rbrack, 99)
  fullform:
    in: Piecewise[List[List[Power[x, 2], Less[x, 0]]], 99]
  wolfram:
    in: Piecewise[List[List[Power[x, 2], Less[x, 0]]], 99]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  x^2 & x<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  x^2 & x<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \left(\frac{7}{3}\right)^2 & \frac{7}{3}<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \left(\frac{7}{3}\right)^2 & \frac{7}{3}<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)\right]\right],\text{Chop}\left[N\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \left(-\frac{11}{5}\right)^2 & -\frac{11}{5}<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \left(-\frac{11}{5}\right)^2 & -\frac{11}{5}<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)\right]\right],\text{Chop}\left[N\left[\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \left(\frac{13}{4}\right)^2 & \frac{13}{4}<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \left(\frac{13}{4}\right)^2 & \frac{13}{4}<0 \\  99 & \text{True} \\ \end{array}  \\ \end{array} \right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
every-clause-eliminated-falls-through-to-default:
