name: RiemannSiegelZ
domain: Special functions
signature: RiemannSiegelZ(t)
summary: The Riemann–Siegel function $Z(t) = e^{i\vartheta(t)}\zeta(\tfrac12 + it)$, real-valued for real $t$ by construction. Provided by `@enumeratio/analytic`.
signatures:
  - call: RiemannSiegelZ(t)
    description: the Riemann–Siegel Z-function.
    library: "@enumeratio/analytic"
details:
  - Reuses [[RiemannSiegelTheta]] and the existing generalized-zeta kernel ([[Zeta]]/[[HurwitzZeta]], `packages/symbols/analysis/analytic/src/hurwitz-zeta.ts`, at $a=1$) — no new zeta evaluation is added here, only the phase rotation onto the real line.
  - Real $t$ only; numeric via `N()` or an inexact $t$, same as [[RiemannSiegelTheta]].
  - The sign of $Z$ on the real line is what [[RiemannZetaZero]]'s zero-finder scans for.
examples:
  - id: riemannsiegelz-1p5
    expr: [RiemannSiegelZ, 1.5]
    expected: -0.595568336782887
  - id: riemannsiegelz-20p5
    expr: [RiemannSiegelZ, 20.5]
    expected: 0.5993287025147513
  - id: z-0-zeta-1-2
    expr: [N, [RiemannSiegelZ, 0]]
    expected: -1.4603545088095868
    category: Properties
    caption: $Z(0) = \zeta(1/2)$
primitive: numeric
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/riemann-siegel.ts
  - origin: mapped
    form: wolfram / mpmath
    environment: external
    note: RiemannSiegelZ[t]; mpmath.siegelz(t).
seeAlso:
  - RiemannSiegelTheta
  - Zeta
  - RiemannZetaZero
