symbolic-arguments-are-left-unevaluated-rather:
  epsil:
    in: JacobiCN(u, m)
    out: JacobiCN(u, m)
  tex:
    in: \mathrm{JacobiCN}(u, m)
    out: \mathrm{JacobiCN}(u, m)
  fullform:
    in: JacobiCN[u, m]
  wolfram:
    in: JacobiCN[u, m]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{cn}(u|m)-\text{cn}(u|m)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{cn}\left(-\frac{11}{5}|\frac{7}{3}\right)-\text{cn}\left(-\frac{11}{5}|\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{cn}\left(-\frac{17}{6}|\frac{13}{4}\right)-\text{cn}\left(-\frac{17}{6}|\frac{13}{4}\right)\right]\right],\text{Chop}\left[N\left[\text{cn}\left(-\frac{23}{9}|\frac{19}{8}\right)-\text{cn}\left(-\frac{23}{9}|\frac{19}{8}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
