m-0-reduces-to-cos-u:
  epsil:
    in: JacobiCN(u, 0)
    out: Cos(u)
  tex:
    in: \mathrm{JacobiCN}(u, 0)
    out: \cos(u)
  fullform:
    in: JacobiCN[u, 0]
  wolfram:
    in: JacobiCN[u, 0]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{cn}(u|0)-\cos (u)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{cn}\left(\left.\frac{7}{3}\right|0\right)-\cos \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{cn}\left(\left.-\frac{11}{5}\right|0\right)-\cos \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{cn}\left(\left.\frac{13}{4}\right|0\right)-\cos \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
