a-second-argument-rounds-to-that-many-decimal:
  epsil:
    in: Round(3.141_59, 2)
    out: 157 / 50
  tex:
    in: \mathrm{round}(3.141\,59, 2)
    out: \frac{157}{50}
  fullform:
    in: Round[3.14159, Power[10, -2]]
    back: [Round, 3.14159, [Power, 10, -2]]
  wolfram:
    in: Round[3.14159, Power[10, Minus[2]]]
    out: 157/50
    tex:
      in: \text{Round}\left[3.14159,10^{-2}\right]
      out: \frac{157}{50}
threads-element-wise-over-a-list:
  epsil:
    in: Round([1.5, -1.5, 2.4])
    out: "[2, -2, 2]"
  tex:
    in: \mathrm{round}(\bigl\lbrack1.5, -1.5, 2.4\bigr\rbrack)
    out: \bigl\lbrack2, -2, 2\bigr\rbrack
  fullform:
    in: Round[List[1.5, -1.5, 2.4]]
  wolfram:
    in: Round[List[1.5, -1.5, 2.4]]
    out: "{2, -2, 2}"
    tex:
      in: \text{Round}[\{1.5,-1.5,2.4\}]
      out: \{2,-2,2\}
a-negative-second-argument-rounds-to-the-nearest:
  epsil:
    in: Round(1_234, -2) == 1_200
    out: True
  tex:
    in: \mathrm{round}(1\,234, -2)=1\,200
    out: \top
  traditional:
    in: \mathrm{round}(1\,234, -2)=1\,200
    out: \mathrm{True}
  fullform:
    in: Equal[Round[1234, Power[10, 2]], 1200]
    back: [Equal, [Round, 1234, [Power, 10, 2]], 1200]
  wolfram:
    in: (Round[1234, Power[10, Minus[-2]]] == 1200)
    out: True
    tex:
      in: \text{Round}\left[1234,10^{-(-2)}\right]=1200
      out: \text{True}
    note: Wolfram reads the second argument as a step to round to a multiple of, so $\mathrm{Round}[1234, -2] = 1234$.
rounding-to-0-decimal-places-matches-the-1:
  epsil:
    in: Round(3.141_59, 0) == Round(3.141_59)
    out: True
  tex:
    in: \mathrm{round}(3.141\,59, 0)=\mathrm{round}(3.141\,59)
    out: \top
  traditional:
    in: \mathrm{round}(3.141\,59, 0)=\mathrm{round}(3.141\,59)
    out: \mathrm{True}
  fullform:
    in: Equal[Round[3.14159, Power[10, 0]], Round[3.14159]]
    back: [Equal, [Round, 3.14159, [Power, 10, 0]], [Round, 3.14159]]
  wolfram:
    in: (Round[3.14159, Power[10, Minus[0]]] == Round[3.14159])
    out: True
    tex:
      in: \text{Round}\left[3.14159,10^{-0}\right]=\text{Round}[3.14159]
      out: \text{True}
    note: Wolfram treats the step literally, so $\mathrm{Round}[3.14159, 0]$ is $\mathrm{Indeterminate}$.
