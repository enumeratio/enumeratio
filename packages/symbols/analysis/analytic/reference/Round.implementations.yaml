rounds-half-away-from-zero-not-banker-s-rounding:
  epsil:
    in: Round(2.5)
    out: "3"
  tex:
    in: \mathrm{round}(2.5)
    out: "3"
  fullform:
    in: Round[2.5]
  wolfram:
    in: Round[2.5]
    out: "2"
    tex:
      in: \text{Round}[2.5]
      out: "2"
    verdict: disagree
    kind: rounding-mode
    note: Wolfram uses round-half-to-even (banker's rounding), so $\mathrm{Round}[2.5] = 2$.
and-by-the-same-convention-2-5-rounds-to-3-not-2:
  epsil:
    in: Round(-2.5)
    out: "-3"
  tex:
    in: \mathrm{round}(-2.5)
    out: "-3"
  fullform:
    in: Round[-2.5]
  wolfram:
    in: Round[-2.5]
    out: "-2"
    tex:
      in: \text{Round}[-2.5]
      out: "-2"
    verdict: disagree
    kind: rounding-mode
    note: Wolfram's half-to-even gives $\mathrm{Round}[-2.5] = -2$.
