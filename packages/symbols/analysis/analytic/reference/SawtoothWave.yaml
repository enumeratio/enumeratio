name: SawtoothWave
domain: Elementary functions
signature: SawtoothWave(x)
summary: "The sawtooth wave: x - floor(x), period 1, range [0, 1)."
signatures:
  - call: SawtoothWave(x)
    description: x - floor(x), unit period, range [0, 1).
    library: "@enumeratio/analytic"
  - call: SawtoothWave({min, max}, x)
    description: the sawtooth rescaled to vary from min to max, unit period.
    library: "@enumeratio/analytic"
    arity: 2
details:
  - Unlike [[FractionalPart]], which keeps the sign of x, SawtoothWave(x) is always in [0, 1) -- SawtoothWave(-1/4) is 3/4, not -1/4.
  - The range form takes the range FIRST, x second -- SawtoothWave({min, max}, x) -- matching Wolfram's own argument order for this family.
examples:
  - id: sawtoothwave-zero
    expr: [SawtoothWave, 0]
    expected: 0
  - id: sawtoothwave-1-3
    expr: [SawtoothWave, [Rational, 1, 3]]
    expected: [Rational, 1, 3]
  - id: sawtoothwave-negative
    expr: [SawtoothWave, [Rational, -1, 4]]
    expected: [Rational, 3, 4]
    category: Scope
    caption: Always nonnegative, unlike [[FractionalPart]]
  - id: sawtoothwave-periodic
    expr: [Equal, [SawtoothWave, [Rational, 1, 3]], [SawtoothWave, [Add, [Rational, 1, 3], 5]]]
    expected: True
    category: Properties
    caption: Period 1
  - id: sawtoothwave-ranged
    expr: [SawtoothWave, [List, 0, 10], [Rational, 1, 2]]
    expected: 5
    category: Scope
    caption: Rescaled to a {min, max} range
