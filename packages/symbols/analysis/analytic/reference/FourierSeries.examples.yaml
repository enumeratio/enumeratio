- id: order-2-series-of-x
  expr: [FourierSeries, x, x, 2]
  expected:
    [
      Add,
      [Multiply, [Complex, 0, -1], [Power, ExponentialE, [Multiply, [Complex, 0, 1], x]]],
      [Multiply, [Complex, 0, [Rational, -1, 2]], [Power, ExponentialE, [Multiply, [Complex, 0, -2], x]]],
      [Multiply, [Complex, 0, [Rational, 1, 2]], [Power, ExponentialE, [Multiply, [Complex, 0, 2], x]]],
      [Multiply, [Complex, 0, 1], [Power, ExponentialE, [Multiply, [Complex, 0, -1], x]]],
    ]
  caption: The order-2 series of the sawtooth $x$ — every $c_k$ nonzero, none of it collapses
- id: order-3-series-of-sin-is-itself
  expr: [FourierSeries, [Sin, x], x, 3]
  expected:
    [
      Add,
      [Multiply, [Complex, 0, [Rational, -1, 2]], [Power, ExponentialE, [Multiply, [Complex, 0, 1], x]]],
      [Multiply, [Complex, 0, [Rational, 1, 2]], [Power, ExponentialE, [Multiply, [Complex, 0, -1], x]]],
    ]
  category: Scope
  caption: $\sin(x)$ is already band-limited to $k = \pm1$, so raising the order past 1 adds nothing
- id: cos-squared-a-sin-cos-polynomial
  expr: [FourierSeries, [Power, [Cos, x], 2], x, 2]
  expected:
    [
      Add,
      [Multiply, [Rational, 1, 4], [Power, ExponentialE, [Multiply, [Complex, 0, -2], x]]],
      [Multiply, [Rational, 1, 4], [Power, ExponentialE, [Multiply, [Complex, 0, 2], x]]],
      [Rational, 1, 2],
    ]
  category: Scope
  caption: $\cos^2(x) = \tfrac12 + \tfrac14 e^{2ix} + \tfrac14 e^{-2ix}$, via the binomial expansion, not integration
- id: order-0-series-of-x-squared-is-its-average
  expr: [FourierSeries, [Power, x, 2], x, 0]
  expected: [Multiply, [Rational, 1, 3], [Power, Pi, 2]]
  category: Scope
  caption: Order 0 is just $c_0$, the average value $\pi^2/3$
- id: declines-a-mixed-polynomial-trig-product
  expr: [FourierSeries, [Multiply, x, [Cos, x]], x, 1]
  expected: [FourierSeries, [Multiply, x, [Cos, x]], x, 1]
  category: Possible issues
  caption: Declines a polynomial-times-trig product like $x\cos(x)$ -- Wolfram has a closed form here, but it falls outside the atoms this covers (see [[FourierCoefficient]])
