implementations:
  - origin: reference
    form: notatio
    environment: engine
    expr:
      [Sum, [Multiply, [Power, _z, n], [Exp, [Multiply, [Negate, _s], [Ln, [Add, n, _a]]]]], [Triple, n, 0, Infinity]]
    note: The defining series, converging for |z| < 1 (and for |z| = 1 with Re(s) > 1); ζ(s, a) is its z = 1 edge and Li_s(z) its a = 1 slice.
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/lerch.ts
    note: The direct series, which covers |z| ≤ 1; z = 1 hands off to HurwitzZeta and inherits its closed forms.
  - origin: compiled
    form: wgsl
    environment: gpu
    source: packages/symbols/analysis/analytic/src/shader.ts:zetaWGSL
    produces: a colour per pixel — complex Φ, domain-coloured
  - origin: mapped
    form: wolfram / mpmath
    environment: external
    note: LerchPhi[z, s, a]; mpmath.lerchphi(z, s, a).
seeAlso:
  - HurwitzZeta
  - Zeta
  - Gamma
  - PolyLog
