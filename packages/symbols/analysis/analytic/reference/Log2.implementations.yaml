same-as-log-z-2:
  epsil:
    in: Log2(8) == Log(8, 2)
    out: True
  tex:
    in: \log_{2}(8)=\log_{2}(8)
    out: \top
  traditional:
    in: \log_{2}(8)=\log_{2}(8)
    out: \mathrm{True}
  fullform:
    in: Equal[Log2[8], Log[2, 8]]
  wolfram:
    in: (Log2[8] == Log[2, 8])
    out: True
    tex:
      in: \log _2(8)=\log _2(8)
      out: \text{True}
a-float-argument-folds-even-for-a-fractional:
  epsil:
    in: Log2(0.5)
    out: "-1"
  tex:
    in: \log_{2}(0.5)
    out: "-1"
  fullform:
    in: Log2[0.5]
  wolfram:
    in: Log2[0.5]
    out: -1.
    tex:
      in: \log _2(0.5)
      out: -1.
an-exact-negative-power-of-2-folds-too-log-2:
  epsil:
    in: Log2(1 / 8)
    out: "-3"
  tex:
    in: \log_{2}(\frac{1}{8})
    out: "-3"
  fullform:
    in: Log2[Rational[1, 8]]
  wolfram:
    in: Log2[Rational[1, 8]]
    out: "-3"
    tex:
      in: \log _2\left(\frac{1}{8}\right)
      out: "-3"
log2-2-pow-10:
  epsil:
    in: Log2(2 ^ 10)
    out: "10"
  tex:
    in: \log_{2}(2^{10})
    out: "10"
  fullform:
    in: Log2[Power[2, 10]]
  wolfram:
    in: Log2[Power[2, 10]]
a-machine-precision-argument-evaluates:
  epsil:
    in: Log2(1.414_2)
    out: 0.499_986_164_421_874_256_467
  tex:
    in: \log_{2}(1.414\,2)
    out: 0.499\,986\,164\,421\,874\,256\,467
  fullform:
    in: Log2[1.4142]
  wolfram:
    in: Log2[1.4142]
a-symbolic-argument-becomes-the-two-argument-log:
  epsil:
    in: Log2(x)
    out: Log(x, 2)
  tex:
    in: \log_{2}(x)
    out: \log_{2}(x)
  fullform:
    in: Log2[x]
  wolfram:
    in:
    note: Wolfram rewrites Log2[x] to Log[x]/Log[2].
an-integer-power-is-pulled-out-2-log-2-3:
  epsil:
    in: Log2(9)
    out: 2 * Log(3, 2)
  tex:
    in: \log_{2}(9)
    out: 2\log_{2}(3)
  fullform:
    in: Log2[9]
  wolfram:
    in: Log2[9]
    note: Wolfram's Log2[9] gives Log[9]/Log[2].
n-log2-9:
