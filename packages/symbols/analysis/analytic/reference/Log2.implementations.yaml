as-with-ln-the-logarithm-of-complex-infinity-is:
  epsil:
    in: Log2(ComplexInfinity)
    out: PositiveInfinity
  tex:
    in: \log_{2}(\tilde\infty)
    out: \infty
  fullform:
    in: Log2[ComplexInfinity]
  wolfram:
    in: Log2[ComplexInfinity]
element-wise-over-a-matrix-including-the-exact:
  epsil:
    in: Log2([[2, 1], [0, 1 / 2]])
    out: "[[1, 0], [NegativeInfinity, -1]]"
  tex:
    in: \log_{2}(\bigl\lbrack\bigl\lbrack2, 1\bigr\rbrack, \bigl\lbrack0, \frac{1}{2}\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack1, 0\bigr\rbrack, \bigl\lbrack-\infty, -1\bigr\rbrack\bigr\rbrack
  fullform:
    in: Log2[List[List[2, 1], List[0, Rational[1, 2]]]]
  wolfram:
    in: Log2[List[List[2, 1], List[0, Rational[1, 2]]]]
interval-arithmetic-log-2-frac-13-2-log-2-3-1:
  epsil:
    in: Log2(Interval(1 / 3, 2))
    out: Interval(Log(1 / 3, 2), 1)
  tex:
    in: \log_{2}(\mathrm{Interval}(\frac{1}{3}, 2))
    out: \mathrm{Interval}(\log_{2}(\frac{1}{3}), 1)
  fullform:
    in: Log2[Interval[List[Rational[1, 3], 2]]]
  wolfram:
    in: Log2[Interval[List[Rational[1, 3], 2]]]
    note: Wolfram writes the lower end as -Log[2, 3], the same value.
uncertainty-propagation-log-2-frac-15-pm-0-01:
  epsil:
    in: Log2(Around(1 / 5, 0.01))
    out: Around(-2.321_928_094_887_362, 0.072_134_752_044_448_18)
  tex:
    in: \log_{2}(\mathrm{Around}(\frac{1}{5}, 0.01))
    out: \mathrm{Around}(-2.321\,928\,094\,887\,362, 0.072\,134\,752\,044\,448\,18)
  fullform:
    in: Log2[Around[Rational[1, 5], 0.01]]
  wolfram:
    in: Log2[Around[Rational[1, 5], 0.01]]
derivative-frac-1-x-ln-2:
  epsil:
    in: D(Log2(x), x)
    out: 1 / (x * Ln(2))
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\log_{2}(x)
    out: \frac{1}{x\ln(2)}
  fullform:
    in: D[Log2[x], x]
