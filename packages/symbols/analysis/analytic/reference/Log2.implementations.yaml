log2-8:
  wolfram:
    in: Log2[8]
    out: "3"
    tex:
      in: \log _2(8)
      out: "3"
log2-1:
  wolfram:
    in: Log2[1]
    out: "0"
    tex:
      in: \log _2(1)
      out: "0"
log2-1-024:
  wolfram:
    in: Log2[1024]
    out: "10"
    tex:
      in: \log _2(1024)
      out: "10"
same-as-log-z-2:
  wolfram:
    in: (Log2[8] == Log[2, 8])
    out: True
    tex:
      in: \log _2(8)=\log _2(8)
      out: \text{True}
a-float-argument-folds-even-for-a-fractional:
  wolfram:
    in: Log2[0.5]
    out: -1.
    tex:
      in: \log _2(0.5)
      out: -1.
an-exact-negative-power-of-2-folds-too-log-2:
  wolfram:
    in: Log2[Rational[1, 8]]
    out: "-3"
    tex:
      in: \log _2\left(\frac{1}{8}\right)
      out: "-3"
a-symbolic-argument-becomes-the-two-argument-log:
  wolfram:
    in:
    note: Wolfram rewrites Log2[x] to Log[x]/Log[2].
an-integer-power-is-pulled-out-2-log-2-3:
  wolfram:
    in: Log2[9]
    note: Wolfram's Log2[9] gives Log[9]/Log[2].
interval-arithmetic-log-2-frac-13-2-log-2-3-1:
  wolfram:
    in: Log2[Interval[List[Rational[1, 3], 2]]]
    note: Wolfram writes the lower end as -Log[2, 3], the same value.
