    form: notatio
    environment: engine
    expr:
      [
        Multiply,
        [Power, 4, [Negate, _s]],
        [Subtract, [HurwitzZeta, _s, [Rational, 1, 4]], [HurwitzZeta, _s, [Rational, 3, 4]]],
