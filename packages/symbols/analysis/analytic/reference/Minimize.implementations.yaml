a-quadratic-s-vertex:
  epsil:
    in: Minimize(x ^ 2, x)
    out: "[0, [Rule(x, 0)]]"
  tex:
    in: \mathrm{Minimize}(x^2, x)
    out: \bigl\lbrack0, \bigl\lbrack\mathrm{Rule}(x, 0)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Power[x, 2], x]
  wolfram:
    in: Minimize[Power[x, 2], x]
    out: "{0, {x -> 0}}"
    tex:
      in: \text{Minimize}\left[x^2,x\right]
      out: \{0,\{x\to 0\}\}
unbounded-below-reports-negative-infinity:
  epsil:
    in: Minimize(x ^ 3, x)
    out: "[NegativeInfinity, [Rule(x, NegativeInfinity)]]"
  tex:
    in: \mathrm{Minimize}(x^3, x)
    out: \bigl\lbrack-\infty, \bigl\lbrack\mathrm{Rule}(x, -\infty)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Power[x, 3], x]
  wolfram:
    in: Minimize[Power[x, 3], x]
    out: "{-Infinity, {x -> -Infinity}}"
    tex:
      in: \text{Minimize}\left[x^3,x\right]
      out: \{-\infty ,\{x\to -\infty \}\}
a-rational-function-s-irrational-point:
  epsil:
    in: Minimize((x - 1) / (x ^ 2 + 1), x)
    out: "[-Sqrt(2) / (1 + (1 - Sqrt(2)) ^ 2), [Rule(x, 1 - Sqrt(2))]]"
  tex:
    in: \mathrm{Minimize}(\frac{x-1}{x^2+1}, x)
    out: \bigl\lbrack-(\sqrt{2})(1+(1-2^{1/2})^2)^{-1}, \bigl\lbrack\mathrm{Rule}(x, 1-2^{1/2})\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Divide[Subtract[x, 1], Plus[Power[x, 2], 1]], x]
  wolfram:
    in: Minimize[Divide[Subtract[x, 1], Plus[Power[x, 2], 1]], x]
    out: "{-(Sqrt[2]/(1 + (1 - Sqrt[2])^2)), {x -> 1 - Sqrt[2]}}"
    tex:
      in: \text{Minimize}\left[\frac{x-1}{x^2+1},x\right]
      out: \left\{-\frac{\sqrt{2}}{1+\left(1-\sqrt{2}\right)^2},\left\{x\to 1-\sqrt{2}\right\}\right\}
    verdict: disagree
    kind: shape
    note: Both sides give the same {value, {x -> argmin}} pair, but the exact irrational argmin is written as a different (equal) radical expression — the structural comparison doesn't verify algebraic equivalence of a value nested inside a List.
a-simple-interval-constraint:
  epsil:
    in: Minimize([x ^ 2, x >= 1], x)
    out: "[1, [Rule(x, 1)]]"
  tex:
    in: \mathrm{Minimize}(\bigl\lbrack x^2, x\ge1\bigr\rbrack, x)
    out: \bigl\lbrack1, \bigl\lbrack\mathrm{Rule}(x, 1)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[List[Power[x, 2], GreaterEqual[x, 1]], x]
  wolfram:
    in: Minimize[List[Power[x, 2], GreaterEqual[x, 1]], x]
    out: "{1, {x -> 1}}"
    tex:
      in: \text{Minimize}\left[\left\{x^2,x\geq 1\right\},x\right]
      out: \{1,\{x\to 1\}\}
log-s-minimum-is-at-its-domain-edge:
  epsil:
    in: Minimize(Ln(x), x)
    out: "[NegativeInfinity, [Rule(x, 0)]]"
  tex:
    in: \mathrm{Minimize}(\ln(x), x)
    out: \bigl\lbrack-\infty, \bigl\lbrack\mathrm{Rule}(x, 0)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Log[x], x]
  wolfram:
    in: Minimize[Log[x], x]
    out: "{-Infinity, {x -> 0}}"
    tex:
      in: \text{Minimize}[\log (x),x]
      out: \{-\infty ,\{x\to 0\}\}
exp-s-infimum-is-not-attained:
  epsil:
    in: Minimize(Exp(x), x)
    out: "[0, [Rule(x, NegativeInfinity)]]"
  tex:
    in: \mathrm{Minimize}(e^{x}, x)
    out: \bigl\lbrack0, \bigl\lbrack\mathrm{Rule}(x, -\infty)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Exp[x], x]
  wolfram:
    in: Minimize[Exp[x], x]
    out: "{0, {x -> -Infinity}}"
    tex:
      in: \text{Minimize}[\exp (x),x]
      out: \{0,\{x\to -\infty \}\}
the-variable-as-a-one-element-list:
  epsil:
    in: Minimize(x ^ 2, [x])
    out: "[0, [Rule(x, 0)]]"
  tex:
    in: \mathrm{Minimize}(x^2, \bigl\lbrack x\bigr\rbrack)
    out: \bigl\lbrack0, \bigl\lbrack\mathrm{Rule}(x, 0)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Power[x, 2], List[x]]
  wolfram:
    in: Minimize[Power[x, 2], List[x]]
    out: "{0, {x -> 0}}"
    tex:
      in: \text{Minimize}\left[x^2,\{x\}\right]
      out: \{0,\{x\to 0\}\}
declines-a-non-exact-critical-point:
  epsil:
    in: Minimize(x ^ 4 - 4 * x ^ 2, x)
    out: "[-4, [Rule(x, -Sqrt(2))]]"
  tex:
    in: \mathrm{Minimize}(x^4-4x^2, x)
    out: \bigl\lbrack-4, \bigl\lbrack\mathrm{Rule}(x, -2^{1/2})\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Subtract[Power[x, 4], Times[4, Power[x, 2]]], x]
  wolfram:
    in: Minimize[Subtract[Power[x, 4], Times[4, Power[x, 2]]], x]
    out: "{-4, {x -> -Sqrt[2]}}"
    tex:
      in: \text{Minimize}\left[x^4-4 x^2,x\right]
      out: \left\{-4,\left\{x\to -\sqrt{2}\right\}\right\}
    verdict: disagree
    kind: shape
    note: Same as a-rational-function-s-irrational-point -- both sides give the same {value, {x -> argmin}} pair (verified against wolframscript), but the structural comparison doesn't verify equality of a value nested inside a Rule inside a List.
a-quartic-with-a-doubled-root:
  epsil:
    in: Minimize(x ^ 4 - 2 * x ^ 2 + 1, x)
    out: "[0, [Rule(x, -1)]]"
  tex:
    in: \mathrm{Minimize}(x^4-2x^2+1, x)
    out: \bigl\lbrack0, \bigl\lbrack\mathrm{Rule}(x, -1)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Plus[Power[x, 4], Times[-2, Power[x, 2]], 1], x]
  wolfram:
    in: Minimize[Plus[Power[x, 4], Times[-2, Power[x, 2]], 1], x]
    out: "{0, {x -> -1}}"
    tex:
      in: \text{Minimize}\left[x^4-2 x^2+1,x\right]
      out: \{0,\{x\to -1\}\}
    verdict: disagree
    kind: shape
    note: Same as a-rational-function-s-irrational-point -- both sides give the identical {value, {x -> argmin}} pair (verified against wolframscript); the structural comparison doesn't verify equality of a value nested inside a Rule inside a List.
a-product-of-two-quadratics:
  epsil:
    in: Minimize((x ^ 2 - 3) * (x ^ 2 - 5), x)
    out: "[-1, [Rule(x, -2)]]"
  tex:
    in: \mathrm{Minimize}((x^2-3)(x^2-5), x)
    out: \bigl\lbrack-1, \bigl\lbrack\mathrm{Rule}(x, -2)\bigr\rbrack\bigr\rbrack
  fullform:
    in: Minimize[Times[Plus[Power[x, 2], -3], Plus[Power[x, 2], -5]], x]
  wolfram:
    in: Minimize[Times[Plus[Power[x, 2], -3], Plus[Power[x, 2], -5]], x]
    out: "{-1, {x -> -2}}"
    tex:
      in: \text{Minimize}\left[\left(x^2-3\right) \left(x^2-5\right),x\right]
      out: \{-1,\{x\to -2\}\}
    verdict: disagree
    kind: shape
    note: Same as a-rational-function-s-irrational-point -- both sides give the identical {value, {x -> argmin}} pair (verified against wolframscript); the structural comparison doesn't verify equality of a value nested inside a Rule inside a List.
declines-an-irreducible-cubic-factor:
  epsil:
    in: Minimize(1 / 4 * x ^ 4 - 1 / 2 * x ^ 2 - x, x)
    out: Minimize(1 / 4 * x ^ 4 - 1 / 2 * x ^ 2 - x, x)
  tex:
    in: \mathrm{Minimize}(\frac{x^4}{4}-\frac{x^2}{2}-x, x)
    out: \mathrm{Minimize}(\frac{x^4}{4}-\frac{x^2}{2}-x, x)
  fullform:
    in: Minimize[Subtract[Subtract[Times[Rational[1, 4], Power[x, 4]], Times[Rational[1, 2], Power[x, 2]]], x], x]
  wolfram:
    in: Minimize[Subtract[Subtract[Times[Rational[1, 4], Power[x, 4]], Times[Rational[1, 2], Power[x, 2]]], x], x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Minimize}\left[\left(\frac{1}{4} x^4-\frac{1}{2} x^2\right)-x,x\right]-\text{Minimize}\left[\left(\frac{1}{4} x^4-\frac{1}{2} x^2\right)-x,x\right]\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Minimize}\left[\left(\frac{1}{4} \left(\frac{7}{3}\right)^4-\frac{1}{2} \left(\frac{7}{3}\right)^2\right)-\frac{7}{3},\frac{7}{3}\right]-\text{Minimize}\left[\left(\frac{1}{4} \left(\frac{7}{3}\right)^4-\frac{1}{2} \left(\frac{7}{3}\right)^2\right)-\frac{7}{3},\frac{7}{3}\right]\right]\right],\text{Chop}\left[N\left[\text{Minimize}\left[\left(\frac{1}{4} \left(-\frac{11}{5}\right)^4-\frac{1}{2} \left(-\frac{11}{5}\right)^2\right)--\frac{11}{5},-\frac{11}{5}\right]-\text{Minimize}\left[\left(\frac{1}{4} \left(-\frac{11}{5}\right)^4-\frac{1}{2} \left(-\frac{11}{5}\right)^2\right)--\frac{11}{5},-\frac{11}{5}\right]\right]\right],\text{Chop}\left[N\left[\text{Minimize}\left[\left(\frac{1}{4} \left(\frac{13}{4}\right)^4-\frac{1}{2} \left(\frac{13}{4}\right)^2\right)-\frac{13}{4},\frac{13}{4}\right]-\text{Minimize}\left[\left(\frac{1}{4} \left(\frac{13}{4}\right)^4-\frac{1}{2} \left(\frac{13}{4}\right)^2\right)-\frac{13}{4},\frac{13}{4}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
declines-more-than-one-variable:
  epsil:
    in: Minimize(x ^ 2 + y ^ 2, [x, y])
    out: Minimize(x ^ 2 + y ^ 2, [x, y])
  tex:
    in: \mathrm{Minimize}(x^2+y^2, \bigl\lbrack x, y\bigr\rbrack)
    out: \mathrm{Minimize}(x^2+y^2, \bigl\lbrack x, y\bigr\rbrack)
  fullform:
    in: Minimize[Plus[Power[x, 2], Power[y, 2]], List[x, y]]
  wolfram:
    in: Minimize[Plus[Power[x, 2], Power[y, 2]], List[x, y]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Minimize}\left[x^2+y^2,\{x,y\}\right]-\text{Minimize}\left[x^2+y^2,\{x,y\}\right]\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Minimize}\left[\left(\frac{7}{3}\right)^2+\left(-\frac{11}{5}\right)^2,\left\{\frac{7}{3},-\frac{11}{5}\right\}\right]-\text{Minimize}\left[\left(\frac{7}{3}\right)^2+\left(-\frac{11}{5}\right)^2,\left\{\frac{7}{3},-\frac{11}{5}\right\}\right]\right]\right],\text{Chop}\left[N\left[\text{Minimize}\left[\left(\frac{13}{4}\right)^2+\left(-\frac{17}{6}\right)^2,\left\{\frac{13}{4},-\frac{17}{6}\right\}\right]-\text{Minimize}\left[\left(\frac{13}{4}\right)^2+\left(-\frac{17}{6}\right)^2,\left\{\frac{13}{4},-\frac{17}{6}\right\}\right]\right]\right],\text{Chop}\left[N\left[\text{Minimize}\left[\left(\frac{19}{8}\right)^2+\left(-\frac{23}{9}\right)^2,\left\{\frac{19}{8},-\frac{23}{9}\right\}\right]-\text{Minimize}\left[\left(\frac{19}{8}\right)^2+\left(-\frac{23}{9}\right)^2,\left\{\frac{19}{8},-\frac{23}{9}\right\}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
declines-sin-s-point-despite-an-exact-value:
  epsil:
    in: Minimize(Sin(x), x)
    out: Minimize(Sin(x), x)
  tex:
    in: \mathrm{Minimize}(\sin(x), x)
    out: \mathrm{Minimize}(\sin(x), x)
  fullform:
    in: Minimize[Sin[x], x]
  wolfram:
    in: Minimize[Sin[x], x]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Minimize}[\sin (x),x]-\text{Minimize}[\sin (x),x]],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Minimize}\left[\sin \left(\frac{7}{3}\right),\frac{7}{3}\right]-\text{Minimize}\left[\sin \left(\frac{7}{3}\right),\frac{7}{3}\right]\right]\right],\text{Chop}\left[N\left[\text{Minimize}\left[\sin \left(-\frac{11}{5}\right),-\frac{11}{5}\right]-\text{Minimize}\left[\sin \left(-\frac{11}{5}\right),-\frac{11}{5}\right]\right]\right],\text{Chop}\left[N\left[\text{Minimize}\left[\sin \left(\frac{13}{4}\right),\frac{13}{4}\right]-\text{Minimize}\left[\sin \left(\frac{13}{4}\right),\frac{13}{4}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
