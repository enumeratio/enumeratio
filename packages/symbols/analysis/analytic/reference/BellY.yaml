name: BellY
domain: Special functions
signature: BellY(n, k, xs)
summary: The partial (incomplete) Bell polynomial $B_{n,k}(x_1, x_2, \dots)$, by its textbook recurrence — built entirely from bigint binomial coefficients and compute-engine's own Add/Multiply, so it works the same for numeric or symbolic $x_i$.
signatures:
  - call: BellY(n, k, xs)
    description: $B_{n,k}(x_1, \dots, x_{n-k+1})$, from the list `xs`.
    library: "@enumeratio/analytic"
details:
  - "Comtet's recurrence: $B_{n,k} = \\sum_{i=1}^{n-k+1} \\binom{n-1}{i-1} x_i B_{n-i,k-1}$, with $B_{0,0}=1$."
  - All-ones arguments give the Stirling numbers of the second kind; $x_j = j!$ gives the (unsigned) Lah numbers — both checked directly against Wolfram's `BellY`.
  - "`xs` must have exactly $n-k+1$ elements, matching Wolfram's own arity requirement."
primitive: kernel
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/bell-y.ts
seeAlso:
  - BellNumber
  - StirlingS2
names:
  wolframIdentity: true
