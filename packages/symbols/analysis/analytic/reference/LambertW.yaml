name: LambertW
domain: Special functions
signature: LambertW(z) / LambertW(z, k)
summary: The Lambert $W$ function (Wolfram's `ProductLog`), the inverse of $w\,e^w$. compute-engine's native `LambertW` already covers the principal ($k=0$) and lower-real ($k=-1$) branches numerically; extended here with exact values at algebraically nice points and every other integer branch.
signatures:
  - call: LambertW(z)
    description: the principal branch $W_0(z)$ — native, extended with exact values.
    library: '@enumeratio/analytic'
  - call: LambertW(z, k)
    description: the $k$-th branch $W_k(z)$, by Halley's iteration from the standard log-log seed (Corless et al. 1996). $k=0$ and $k=-1$ stay on compute-engine's own native handler.
    library: '@enumeratio/analytic'
details:
  - compute-engine's own argument order is $(z, k)$, not Wolfram's $\mathrm{ProductLog}[k, z]$ — checked directly (`LambertW(-0.14, -1)` is the $k=-1$ branch; `LambertW(-1, -0.14)` declines). The existing $k=0$/$-1$ order is kept as-is; the Wolfram crosswalk carries the reversal.
  - Exact values are recognized structurally at $z=0$, $z=e$ (giving $w=1$), $z=-1/e$ (giving $w=-1$), $z = n\,e^n$ for small integer $n$, and $z=-\ln(k)/k$ for small integer $k \ge 2$ (giving $w=-\ln k$, since $e^{-\ln k}=1/k$) — even under plain `evaluate()`, not just `N()`.
  - Every other branch is solved by Halley's method in the complex plane; checked against `wolframscript`'s `N[ProductLog[k, z], 16]` at several points (real and complex $z$, several $k$) to full double precision.
examples:
  - id: lambertw-0
    expr: [LambertW, 0]
    expected: 0
  - id: 1-cdot-e-1-e
    expr: [LambertW, ExponentialE]
    expected: 1
    caption: $1 \cdot e^1 = e$
  - id: the-branch-point-1-e
    expr: [LambertW, [Negate, [Divide, 1, ExponentialE]]]
    expected: -1
    category: Scope
    caption: The branch point $-1/e$
  - id: 2e-2-w-e-w-at-w-2
    expr: [LambertW, [Multiply, 2, [Power, ExponentialE, 2]]]
    expected: 2
    category: Scope
    caption: $2e^2 = w e^w$ at $w = 2$
  - id: ln-2-cdot-e-ln-2-frac-ln-2-2
    expr: [LambertW, [Negate, [Divide, [Ln, 2], 2]]]
    expected: [Negate, [Ln, 2]]
    category: Scope
    caption: $-\ln 2 \cdot e^{-\ln 2} = -\tfrac{\ln 2}{2}$
  - id: a-branch-other-than-0-or-1-checked-against-n
    expr: [N, [LambertW, -0.14, -3]]
    expected: [Complex, -4.645279174278859, -13.812745325218817]
    category: Scope
    caption: A branch other than 0 or -1, checked against `N[ProductLog[-3, -0.14], 16]`
  - id: the-branch-k-1-written-in-compute-engine-s-z-k
    expr: [N, [LambertW, 1, 1]]
    expected: [Complex, -1.5339133197935744, 4.375185153061898]
    category: Scope
    caption: The branch $k = 1$, written in compute-engine's $(z, k)$ order — Wolfram's <code>ProductLog[1, 1]</code>
  - id: the-real-branch-k-1-on-1-e-z-0
    expr: [N, [LambertW, -0.2, -1]]
    expected: {num: '-2.54264135777352642429'}
    category: Scope
    caption: The real branch $k = -1$ on $-1/e < z < 0$
primitive: kernel
implementations:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/lambert-w.ts
    note: Halley's iteration in the complex plane for k ∉ {0, -1}; structural pattern matching for the exact cases.
seeAlso:
  - Exp
  - Ln
