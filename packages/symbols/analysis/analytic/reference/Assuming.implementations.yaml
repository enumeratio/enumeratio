abs-resolves-once-the-sign-is-known:
  epsil:
    in: Assuming(x > 0, Abs(x))
    out: x
  tex:
    in: \mathrm{Assuming}(x\gt0, \vert x\vert)
    out: x
  fullform:
    in: Assuming[Greater[x, 0], Abs[x]]
  wolfram:
    in: Assuming[Greater[x, 0], FullSimplify[Abs[x]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Assuming}[x>0,\text{FullSimplify}[| x| ]]-x],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Assuming}\left[\frac{7}{3}>0,\text{FullSimplify}\left[\left| \frac{7}{3}\right| \right]\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[-\frac{11}{5}>0,\text{FullSimplify}\left[\left| -\frac{11}{5}\right| \right]\right]--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[\frac{13}{4}>0,\text{FullSimplify}\left[\left| \frac{13}{4}\right| \right]\right]-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
sign-of-x-plus-sign-of-y-under-opposite-signs:
  epsil:
    in: Assuming([x > 0, y < 0], Sign(x) + Sign(y))
    out: "0"
  tex:
    in: \mathrm{Assuming}(\begin{cases}x\gt0\\y\lt0\end{cases}, \mathrm{sgn}(x)+\mathrm{sgn}(y))
    out: "0"
  fullform:
    in: Assuming[List[Greater[x, 0], Less[y, 0]], Plus[Sign[x], Sign[y]]]
  wolfram:
    in: Assuming[List[Greater[x, 0], Less[y, 0]], FullSimplify[Plus[Sign[x], Sign[y]]]]
    out: "0"
    tex:
      in: \text{Assuming}[\{x>0,y<0\},\text{FullSimplify}[\text{sgn}(x)+\text{sgn}(y)]]
      out: "0"
the-assumption-does-not-leak:
  epsil:
    in: "[Assuming(z > 0, Sign(z)), Sign(z)]"
    out: "[1, Sign(z)]"
  tex:
    in: \bigl\lbrack\mathrm{Assuming}(z\gt0, \mathrm{sgn}(z)), \mathrm{sgn}(z)\bigr\rbrack
    out: \bigl\lbrack1, \mathrm{sgn}(z)\bigr\rbrack
  fullform:
    in: List[Assuming[Greater[z, 0], Sign[z]], Sign[z]]
  wolfram:
    in: List[Assuming[Greater[z, 0], FullSimplify[Sign[z]]], Sign[z]]
    out: "{1, Sign[z]}"
    tex:
      in: \{\text{Assuming}[z>0,\text{FullSimplify}[\text{sgn}(z)]],\text{sgn}(z)\}
      out: \{1,\text{sgn}(z)\}
