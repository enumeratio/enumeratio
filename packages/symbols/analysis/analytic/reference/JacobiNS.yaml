name: JacobiNS
domain: Special functions
signature: JacobiNS(u, m)
summary: The Jacobi elliptic function $\operatorname{ns}(u,m) = 1/\operatorname{sn}(u,m)$ (Glaisher's notation), in Wolfram/mpmath's $m=k^2$ convention.
signatures:
  - call: JacobiNS(u, m)
    description: the Jacobi elliptic function ns, argument u, parameter m.
    library: "@enumeratio/analytic"
details:
  - $m = k^2$, the same convention [[EllipticK]] / [[EllipticF]] use.
  - $\operatorname{ns}(u,m) = 1/\operatorname{sn}(u,m)$ — [[JacobiSN]] shares this head's numeric kernel and exact-value coverage (m outside [0,1] via the reciprocal- and imaginary-modulus transformations, complex u, a genuinely complex m declined).
  - ns has a pole at u = 0 (sn(0,m) = 0, for any m).
  - Numeric only — a symbolic argument stays unevaluated; a floating-point argument (or `N()`) evaluates directly.
examples:
  - id: a-floating-point-argument-evaluates-directly-to
    expr: [N, [JacobiNS, 0.3, 0.5]]
    expected: 3.4081683817923323
    caption: A floating-point argument evaluates directly to a decimal
  - id: u-0-is-a-pole-for-any-m
    expr: [JacobiNS, 0, m]
    expected: ComplexInfinity
    category: Properties
    caption: u = 0 is a pole, for any m
  - id: m-less-than-0-via-the-imaginary-modulus
    expr: [N, [JacobiNS, 0.3, -2.0]]
    expected: 3.2892206837526348
    category: Scope
    caption: m less than 0, via the imaginary-modulus transformation
  - id: symbolic-arguments-are-left-unevaluated-rather
    expr: [JacobiNS, u, m]
    expected: [JacobiNS, u, m]
    category: Possible issues
    caption: Symbolic arguments are left unevaluated rather than guessed at
seeAlso:
  - JacobiSN
  - JacobiSC
  - JacobiSD
