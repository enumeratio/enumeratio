name: QFactorial
domain: Special functions
signature: QFactorial(n, q)
summary: The q-factorial $[n]_q! = [1]_q [2]_q \cdots [n]_q$, where $[k]_q = 1 + q + \cdots + q^{k-1}$. Provided by `@enumeratio/analytic`.
signatures:
  - call: QFactorial(n, q)
    description: the q-factorial $[n]_q!$.
    library: "@enumeratio/analytic"
details:
  - Built as a product of q-integers $[k]_q$, each a sum of $k$ powers of $q$ — exact boxed arithmetic throughout, so it reduces to a number for numeric $q$ (rational stays rational) and to a genuine polynomial in $q$ that `Expand` can open up for symbolic $q$.
  - At $q = 1$, $[k]_1 = k$ termwise (no division, so no $q \to 1$ limit to take), reducing exactly to $n!$.
examples:
  - id: 1-2-2-2-3-2-1-cdot-3-cdot-7
    expr: [QFactorial, 3, 2]
    expected: 21
    caption: $[1]_2 [2]_2 [3]_2 = 1 \cdot 3 \cdot 7$
  - id: qfactorial-4-2
    expr: [QFactorial, 4, 2]
    expected: 315
  - id: qfactorial-3-1-over-2
    expr: [QFactorial, 3, [Rational, 1, 2]]
    expected: [Rational, 21, 8]
    category: Scope
  - id: at-q-1-it-is-the-ordinary-factorial
    expr: [QFactorial, 5, 1]
    expected: 120
    category: Properties
    caption: At $q = 1$ it is the ordinary factorial
  - id: the-inversion-generating-function-of
    expr: [Expand, [QFactorial, 3, q]]
    expected: [Add, [Power, q, 3], [Multiply, 2, [Power, q, 2]], [Multiply, 2, q], 1]
    category: Applications
    caption: 'The inversion generating function of SymmetricGroup(3): $\sum_\pi q^{\mathrm{inv}(\pi)}$'
primitive: kernel
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/q-series.ts
    note: product of q-integers, built at canonicalization time (not evaluate) so Expand sees the tree to open up.
  - origin: mapped
    form: wolfram
    environment: external
    note: QFactorial[n, q].
seeAlso:
  - QPochhammer
  - QBinomial
  - Factorial
