odd-function-sinh-x-sinh-x:
  epsil:
    in: Sinh(-1) == -Sinh(1)
    out: True
  tex:
    in: \sinh(-1)=-\sinh(1)
    out: \top
  traditional:
    in: \sinh(-1)=-\sinh(1)
    out: \mathrm{True}
  fullform:
    in: Equal[Sinh[Minus[1]], Minus[Sinh[1]]]
  wolfram:
    in: (Sinh[Minus[1]] == Minus[Sinh[1]])
    out: True
    tex:
      in: \sinh (-1)=-\sinh (1)
      out: \text{True}
definition-in-terms-of-exp-sinh-x-frac-e-x-e-x-2:
  epsil:
    in: Sinh(1) == (Exp(1) - Exp(-1)) / 2
    out: True
  tex:
    in: \sinh(1)=\frac{e^{1}-e^{-1}}{2}
    out: \top
  traditional:
    in: \sinh(1)=\frac{e^{1}-e^{-1}}{2}
    out: \mathrm{True}
  fullform:
    in: Equal[Sinh[1], Divide[Subtract[Exp[1], Exp[Minus[1]]], 2]]
  wolfram:
    in: (Sinh[1] == Divide[Subtract[Exp[1], Exp[Minus[1]]], 2])
    out: True
    tex:
      in: \sinh (1)=\frac{\exp (1)-\exp (-1)}{2}
      out: \text{True}
