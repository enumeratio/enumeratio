n-forces-the-numeric-result-that-plain:
  epsil:
    in: N(Sinh(0))
    out: "0"
  tex:
    in: N(\sinh(0))
    out: "0"
  fullform:
    in: N[Sinh[0]]
  wolfram:
    in: N[Sinh[0]]
    out: 0.
    tex:
      in: N[\sinh (0)]
      out: 0.
n-sinh-1:
