taylor-series-about-0:
  epsil:
    in: Series(Sinh(x), x, 0, 5)
    out: 1 / 120 * x ^ 5 + 1 / 6 * x ^ 3 + x + BigO(x ^ 7)
  tex:
    in: \operatorname{Series}(\sinh(x), x, 0, 5)
    out: x+\frac{x^3}{6}+\frac{x^5}{120}+O\left(x^7\right)
  fullform:
    in: Series[Sinh[x], x, 0, 5]
  wolfram:
    in:
    note: Wolfram's Series[Sinh[x], {x, 0, 5}] ends with O[x]^6; compute-engine skips the vanishing even term and reports O(x^7).
the-definition-sinh-x-frac-e-x-e-x-2:
  epsil:
    in: TrigToExp(Sinh(x))
    out: 1 / 2 * (-ExponentialE ^ (-x) + ExponentialE ^ x)
  tex:
    in: \mathrm{TrigToExp}(\sinh(x))
    out: \frac{1}{2}(e^{x}-\exp(-x))
  fullform:
    in: TrigToExp[Sinh[x]]
