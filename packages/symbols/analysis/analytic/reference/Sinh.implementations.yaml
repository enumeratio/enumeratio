sinh-i-pi-2-i-sin-pi-2-i:
  epsil:
    in: Sinh(ImaginaryUnit * (Pi / 2))
    out: i
  tex:
    in: \sinh(\frac{i\pi}{2})
    out: i
  fullform:
    in: Sinh[Times[I, Divide[Pi, 2]]]
  wolfram:
    in: Sinh[Times[I, Divide[Pi, 2]]]
element-wise-over-a-matrix-of-imaginary:
  epsil:
    in: |-
      Sinh([
             [ImaginaryUnit * (1Pi / 3), -(ImaginaryUnit * (1Pi / 3))],
             [0, -(ImaginaryUnit * (1Pi / 6))],
           ])
    out: "[[Sqrt(3) / 2 * i, -(Sqrt(3) / 2) * i], [0, -1 / 2 * i]]"
  tex:
    in: \sinh(\bigl\lbrack\bigl\lbrack\frac{i\times1\pi}{3}, -(i\times1\pi)/3\bigr\rbrack, \bigl\lbrack0, -(i\times1\pi)/6\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\frac{3^{1/2}}{2}i, -\frac{3^{1/2}}{2}i\bigr\rbrack, \bigl\lbrack0, -\frac{1}{2}i\bigr\rbrack\bigr\rbrack
  fullform:
    in: Sinh[List[List[Times[I, Divide[Times[1, Pi], 3]], Minus[Times[I, Divide[Times[1, Pi], 3]]]], List[0, Minus[Times[I, Divide[Times[1, Pi], 6]]]]]]
  wolfram:
    in: Sinh[List[List[Times[I, Divide[Times[1, Pi], 3]], Minus[Times[I, Divide[Times[1, Pi], 3]]]], List[0, Minus[Times[I, Divide[Times[1, Pi], 6]]]]]]
interval-arithmetic-sinh-is-increasing-so-sinh-0:
  epsil:
    in: Sinh(Interval(0, Ln(3)))
    out: Interval(0, 4 / 3)
  tex:
    in: \sinh(\mathrm{Interval}(0, \ln(3)))
    out: \mathrm{Interval}(0, \frac{4}{3})
  fullform:
    in: Sinh[Interval[List[0, Log[3]]]]
  wolfram:
    in: Sinh[Interval[List[0, Log[3]]]]
