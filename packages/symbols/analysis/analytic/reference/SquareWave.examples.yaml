- id: squarewave-zero
  expr: [SquareWave, 0]
  expected: 1
  caption: SquareWave(0) = 1
- id: squarewave-half
  expr: [SquareWave, [Rational, 1, 2]]
  expected: -1
  caption: The high half is half-open, and the default range is {-1, 1}
- id: squarewave-neg-quarter
  expr: [SquareWave, [Rational, -1, 4]]
  expected: -1
- id: squarewave-periodic
  expr: [Equal, [SquareWave, [Rational, 1, 4]], [SquareWave, [Add, [Rational, 1, 4], 2]]]
  expected: True
  category: Properties
  caption: Period 1
- id: squarewave-ranged
  expr: [SquareWave, [List, 0, 10], 0]
  expected: 10
  category: Scope
  caption: Rescaled to a {min, max} range
