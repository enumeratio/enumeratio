element-wise-over-a-matrix-of-imaginary:
  epsil:
    in: |-
      Cosh([
             [ImaginaryUnit * (1Pi / 3), -(ImaginaryUnit * (1Pi / 3))],
             [0, -(ImaginaryUnit * (1Pi / 6))],
           ])
    out: "[[1 / 2, 1 / 2], [1, Sqrt(3) / 2]]"
  tex:
    in: \cosh(\bigl\lbrack\bigl\lbrack\frac{i\times1\pi}{3}, -(i\times1\pi)/3\bigr\rbrack, \bigl\lbrack0, -(i\times1\pi)/6\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\frac{1}{2}, \frac{1}{2}\bigr\rbrack, \bigl\lbrack1, \frac{\sqrt{3}}{2}\bigr\rbrack\bigr\rbrack
  fullform:
    in: Cosh[List[List[Times[I, Divide[Times[1, Pi], 3]], Minus[Times[I, Divide[Times[1, Pi], 3]]]], List[0, Minus[Times[I, Divide[Times[1, Pi], 6]]]]]]
  wolfram:
    in: Cosh[List[List[Times[I, Divide[Times[1, Pi], 3]], Minus[Times[I, Divide[Times[1, Pi], 3]]]], List[0, Minus[Times[I, Divide[Times[1, Pi], 6]]]]]]
