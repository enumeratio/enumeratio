even-function-cosh-x-cosh-x:
  epsil:
    in: Cosh(-1) == Cosh(1)
    out: True
  tex:
    in: \cosh(-1)=\cosh(1)
    out: \top
  traditional:
    in: \cosh(-1)=\cosh(1)
    out: \mathrm{True}
  fullform:
    in: Equal[Cosh[Minus[1]], Cosh[1]]
  wolfram:
    in: (Cosh[Minus[1]] == Cosh[1])
    out: True
    tex:
      in: \cosh (-1)=\cosh (1)
      out: \text{True}
hyperbolic-pythagorean-identity-cosh-2-x-sinh-2:
  epsil:
    in: Cosh(1) ^ 2 - Sinh(1) ^ 2 == 1
    out: True
  tex:
    in: \cosh(1)^2-\sinh(1)^2=1
    out: \top
  traditional:
    in: \cosh(1)^2-\sinh(1)^2=1
    out: \mathrm{True}
  fullform:
    in: Equal[Subtract[Power[Cosh[1], 2], Power[Sinh[1], 2]], 1]
  wolfram:
    in: (Subtract[Power[Cosh[1], 2], Power[Sinh[1], 2]] == 1)
    out: True
    tex:
      in: \cosh ^2(1)-\sinh ^2(1)=1
      out: \text{True}
stays-symbolic-even-at-0-same-as-sinh-wrap-in-n:
