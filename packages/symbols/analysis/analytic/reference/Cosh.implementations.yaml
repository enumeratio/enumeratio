even-function-cosh-x-cosh-x:
  wolfram:
    in: (Cosh[Minus[1]] == Cosh[1])
    out: True
    tex:
      in: \cosh (-1)=\cosh (1)
      out: \text{True}
hyperbolic-pythagorean-identity-cosh-2-x-sinh-2:
  wolfram:
    in: (Subtract[Power[Cosh[1], 2], Power[Sinh[1], 2]] == 1)
    out: True
    tex:
      in: \cosh ^2(1)-\sinh ^2(1)=1
      out: \text{True}
