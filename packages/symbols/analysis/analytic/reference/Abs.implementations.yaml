threads-over-a-matrix-entry-by-entry:
  epsil:
    in: Abs([[1 / 2, -1], [-5 / 3, 1 / 2]])
    out: "[[1 / 2, 1], [5 / 3, 1 / 2]]"
  tex:
    in: \vert\bigl\lbrack\bigl\lbrack\frac{1}{2}, -1\bigr\rbrack, \bigl\lbrack-\frac{5}{3}, \frac{1}{2}\bigr\rbrack\bigr\rbrack\vert
    out: \bigl\lbrack\bigl\lbrack\frac{1}{2}, 1\bigr\rbrack, \bigl\lbrack\frac{5}{3}, \frac{1}{2}\bigr\rbrack\bigr\rbrack
  fullform:
    in: Abs[List[List[Rational[1, 2], -1], List[Rational[-5, 3], Rational[1, 2]]]]
  wolfram:
    in: Abs[List[List[Rational[1, 2], -1], List[Rational[-5, 3], Rational[1, 2]]]]
  sympy:
    in: "[[Abs(Rational(1, 2)), Abs(-1)], [Abs(Rational(-5, 3)), Abs(Rational(1, 2))]]"
    out: "[[1/2, 1], [5/3, 1/2]]"
  mpmath:
    in: "[[fabs((mpf(1)/2)), fabs(-1)], [fabs((mpf(-5)/3)), fabs((mpf(1)/2))]]"
    out: "[[mpf('0.5'), mpf('1.0')], [mpf('1.66666666666666666666666666666673'), mpf('0.5')]]"
  sage:
    in: "[[abs((1/2)), abs(-1)], [abs((-5/3)), abs((1/2))]]"
    out: "[[1/2, 1], [5/3, 1/2]]"
  rust:
    in: abs(list(vec![list(vec![rational(n(1), n(2)), n(-1)]), list(vec![rational(n(-5), n(3)), rational(n(1), n(2))])]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Abs is Listable and threads over the list; the Rust crates take scalars only.
