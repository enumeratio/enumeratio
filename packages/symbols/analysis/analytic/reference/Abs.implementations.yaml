    in: \vert3+4i\vert^2=(3+4i)\overline{3+4i}
    out: \mathrm{True}
  fullform:
    in: Equal[Power[Abs[Complex[3, 4]], 2], Times[Complex[3, 4], Conjugate[Complex[3, 4]]]]
