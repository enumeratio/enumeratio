threads-element-wise-over-a-list:
  wolfram:
    in: Abs[List[-1, 2, -3]]
    out: "{1, 2, 3}"
    tex:
      in: '| \{-1,2,-3\}|'
      out: \{1,2,3\}
  sage:
    in: abs([-1, 2, -3])
    out: "TypeError: bad operand type for abs(): 'list'"
    verdict: error
    kind: threading
    note: compute-engine's Abs is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: abs(list(vec![n(-1), n(2), n(-3)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Abs is Listable and threads over the list; the Rust crates take scalars.
  mpmath:
    in: "[fabs((-1)), fabs(2), fabs((-3))]"
    out: "[mpf('1.0'), mpf('2.0'), mpf('3.0')]"
  sympy:
    in: "[Abs((-1)), Abs(2), Abs((-3))]"
    out: "[1, 2, 3]"
even-function-x-x:
  wolfram:
    in: (Abs[-8] == Abs[8])
    out: True
    tex:
      in: "| -8| =| 8|"
      out: \text{True}
  sage:
    in: bool(abs(-8) == abs(8))
    out: True
  rust:
    in: equal(abs(n(-8)), abs(n(8)))
    out: "true"
  mpmath:
    in: almosteq(fabs((-8)), fabs(8), 1e-20)
    out: True
  sympy:
    in: enumeratio_equal(Abs((-8)), Abs(8))
    out: True
triangle-inequality-a-b-le-a-b:
  wolfram:
    in: LessEqual[Abs[Plus[3, -8]], Plus[Abs[3], Abs[-8]]]
    out: True
    tex:
      in: '| 3-8| \leq | 3| +| -8|'
      out: \text{True}
