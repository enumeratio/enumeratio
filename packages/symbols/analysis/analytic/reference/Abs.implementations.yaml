threads-element-wise-over-a-list:
  epsil:
    in: Abs([-1, 2, -3])
    out: "[1, 2, 3]"
  tex:
    in: \vert\bigl\lbrack-1, 2, -3\bigr\rbrack\vert
    out: \bigl\lbrack1, 2, 3\bigr\rbrack
  fullform:
    in: Abs[List[-1, 2, -3]]
  wolfram:
    in: Abs[List[-1, 2, -3]]
    out: "{1, 2, 3}"
    tex:
      in: '| \{-1,2,-3\}|'
      out: \{1,2,3\}
  sympy:
    in: "[Abs(-1), Abs(2), Abs(-3)]"
    out: "[1, 2, 3]"
  mpmath:
    in: "[fabs(-1), fabs(2), fabs(-3)]"
    out: "[mpf('1.0'), mpf('2.0'), mpf('3.0')]"
  sage:
    in: "[abs(-1), abs(2), abs(-3)]"
    out: "[1, 2, 3]"
  rust:
    in: abs(list(vec![n(-1), n(2), n(-3)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Abs is Listable and threads over the list; the Rust crates take scalars.
even-function-x-x:
  epsil:
    in: Abs(-8) == Abs(8)
    out: True
  tex:
    in: \vert-8\vert=\vert8\vert
    out: \top
  traditional:
    in: \vert-8\vert=\vert8\vert
    out: \mathrm{True}
  fullform:
    in: Equal[Abs[-8], Abs[8]]
  wolfram:
    in: (Abs[-8] == Abs[8])
    out: True
    tex:
      in: "| -8| =| 8|"
      out: \text{True}
  sympy:
    in: enumeratio_equal(Abs(-8), Abs(8))
    out: True
  mpmath:
    in: almosteq(fabs(-8), fabs(8), 1e-20)
    out: True
  sage:
    in: bool(abs(-8) == abs(8))
    out: True
  rust:
    in: equal(abs(n(-8)), abs(n(8)))
    out: "true"
triangle-inequality-a-b-le-a-b:
  epsil:
    in: Abs(3 - 8) <= Abs(3) + Abs(-8)
    out: True
  tex:
    in: \vert3-8\vert\le\vert3\vert+\vert-8\vert
    out: \top
  traditional:
    in: \vert3-8\vert\le\vert3\vert+\vert-8\vert
    out: \mathrm{True}
  fullform:
    in: LessEqual[Abs[Plus[3, -8]], Plus[Abs[3], Abs[-8]]]
  wolfram:
    in: LessEqual[Abs[Plus[3, -8]], Plus[Abs[3], Abs[-8]]]
    out: True
    tex:
      in: '| 3-8| \leq | 3| +| -8|'
      out: \text{True}
