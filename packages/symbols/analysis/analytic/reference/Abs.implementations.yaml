a-complex-radicand-inside-the-subtraction:
  epsil:
    in: Abs(Sqrt(-10) - 2)
    out: Sqrt(14)
  tex:
    in: \vert\sqrt{-10}-2\vert
    out: \sqrt{14}
  fullform:
    in: Abs[Subtract[Sqrt[-10], 2]]
  wolfram:
    in: Abs[Subtract[Sqrt[-10], 2]]
  sympy:
    in: Abs((sqrt(-10) - 2))
  mpmath:
    in: fabs((sqrt(-10) - 2))
  sage:
    in: abs((sqrt(-10) - 2))
    out: abs(sqrt(-10) - 2)
  rust:
    in: abs((sqrt(n(-10)) - n(2)))
    out: NaN
    verdict: inconclusive
    kind: domain
    note: Rust's f64 sqrt inside is real-only and gives NaN, which poisons the whole expression; compute-engine decides the sign symbolically and gives an exact Sqrt.
