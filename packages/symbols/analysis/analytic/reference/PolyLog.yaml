  - id: li-s-1-zeta-s-for-symbolic-s
    expr: [PolyLog, s, 1]
    expected: [Zeta, s]
    category: Properties
    caption: $\operatorname{Li}_s(1) = \zeta(s)$ for symbolic $s$
  - id: frac-d-dx-li-n-x-li-n-1-x-x-today-the-derivative
