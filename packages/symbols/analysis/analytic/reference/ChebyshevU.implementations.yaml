recurrence:
  epsil:
    in: ChebyshevU(4, 1 / 3) - (2 / 3 * ChebyshevU(3, 1 / 3) - ChebyshevU(2, 1 / 3))
    out: "0"
  tex:
    in: \mathrm{ChebyshevU}(4, \frac{1}{3})-(\frac{1}{3}(2\mathrm{ChebyshevU}(3, 1/3))-\mathrm{ChebyshevU}(2, \frac{1}{3}))
    out: "0"
  fullform:
    in: Subtract[ChebyshevU[4, Rational[1, 3]], Subtract[Times[Rational[2, 3], ChebyshevU[3, Rational[1, 3]]], ChebyshevU[2, Rational[1, 3]]]]
  wolfram:
    in: Subtract[ChebyshevU[4, Rational[1, 3]], Subtract[Times[Rational[2, 3], ChebyshevU[3, Rational[1, 3]]], ChebyshevU[2, Rational[1, 3]]]]
    out: "0"
    tex:
      in: U_4\left(\frac{1}{3}\right)-\left(\frac{2}{3} U_3\left(\frac{1}{3}\right)-U_2\left(\frac{1}{3}\right)\right)
      out: "0"
