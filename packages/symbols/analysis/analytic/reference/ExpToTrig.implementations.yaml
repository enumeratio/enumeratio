euler-s-formula:
  epsil:
    in: ExpToTrig(Exp(ImaginaryUnit * x))
    out: i * Sin(x) + Cos(x)
  tex:
    in: \mathrm{ExpToTrig}(\exp(i x))
    out: i\sin(x)+\cos(x)
  fullform:
    in: ExpToTrig[Exp[Times[I, x]]]
  wolfram:
    in: ExpToTrig[Exp[Times[I, x]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{ExpToTrig}[\exp (i x)]-(i \sin (x)+\cos (x))],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ExpToTrig}\left[\exp \left(i \frac{7}{3}\right)\right]-\left(i \sin \left(\frac{7}{3}\right)+\cos \left(\frac{7}{3}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\exp \left(i \left(-\frac{11}{5}\right)\right)\right]-\left(i \sin \left(-\frac{11}{5}\right)+\cos \left(-\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\exp \left(i \frac{13}{4}\right)\right]-\left(i \sin \left(\frac{13}{4}\right)+\cos \left(\frac{13}{4}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-real-exponential-splits-into-hyperbolic-parts:
  epsil:
    in: ExpToTrig(Exp(x))
    out: Sinh(x) + Cosh(x)
  tex:
    in: \mathrm{ExpToTrig}(e^{x})
    out: \sinh(x)+\cosh(x)
  fullform:
    in: ExpToTrig[Exp[x]]
  wolfram:
    in: ExpToTrig[Exp[x]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{ExpToTrig}[\exp (x)]-(\sinh (x)+\cosh (x))],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ExpToTrig}\left[\exp \left(\frac{7}{3}\right)\right]-\left(\sinh \left(\frac{7}{3}\right)+\cosh \left(\frac{7}{3}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\exp \left(-\frac{11}{5}\right)\right]-\left(\sinh \left(-\frac{11}{5}\right)+\cosh \left(-\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\exp \left(\frac{13}{4}\right)\right]-\left(\sinh \left(\frac{13}{4}\right)+\cosh \left(\frac{13}{4}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
recognizes-cosh:
  epsil:
    in: ExpToTrig((Exp(x) + Exp(-x)) / 2)
    out: Cosh(x)
  tex:
    in: \mathrm{ExpToTrig}(\frac{1}{2}(e^{x}+\exp(-x)))
    out: \cosh(x)
  fullform:
    in: ExpToTrig[Divide[Plus[Exp[x], Exp[Minus[x]]], 2]]
  wolfram:
    in: ExpToTrig[Divide[Plus[Exp[x], Exp[Minus[x]]], 2]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{ExpToTrig}\left[\frac{\exp (x)+\exp (-x)}{2}\right]-\cosh (x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ExpToTrig}\left[\frac{\exp \left(\frac{7}{3}\right)+\exp \left(-\frac{7}{3}\right)}{2}\right]-\cosh \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\frac{\exp \left(-\frac{11}{5}\right)+\exp \left(-\left(-\frac{11}{5}\right)\right)}{2}\right]-\cosh \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\frac{\exp \left(\frac{13}{4}\right)+\exp \left(-\frac{13}{4}\right)}{2}\right]-\cosh \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
recognizes-sin:
  epsil:
    in: |-
      ExpToTrig((Exp(ImaginaryUnit * x) - Exp(-(ImaginaryUnit * x))) /
                (2ImaginaryUnit))
    out: Sin(x)
  tex:
    in: \mathrm{ExpToTrig}(\frac{\exp(i x)-\exp(-(i x))}{2i})
    out: \sin(x)
  fullform:
    in: ExpToTrig[Divide[Subtract[Exp[Times[I, x]], Exp[Minus[Times[I, x]]]], Times[2, I]]]
  wolfram:
    in: ExpToTrig[Divide[Subtract[Exp[Times[I, x]], Exp[Minus[Times[I, x]]]], Times[2, I]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{ExpToTrig}\left[\frac{\exp (i x)-\exp (-(i x))}{2 i}\right]-\sin (x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ExpToTrig}\left[\frac{\exp \left(i \frac{7}{3}\right)-\exp \left(-\left(i \frac{7}{3}\right)\right)}{2 i}\right]-\sin \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\frac{\exp \left(i \left(-\frac{11}{5}\right)\right)-\exp \left(-\left(i \left(-\frac{11}{5}\right)\right)\right)}{2 i}\right]-\sin \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{ExpToTrig}\left[\frac{\exp \left(i \frac{13}{4}\right)-\exp \left(-\left(i \frac{13}{4}\right)\right)}{2 i}\right]-\sin \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
