the-cubic:
  epsil:
    in: ChebyshevT(3, x)
    out: 4 * x ^ 3 - 3x
  tex:
    in: \mathrm{ChebyshevT}(3, x)
    out: 4x^3-3x
  fullform:
    in: ChebyshevT[3, x]
the-quartic:
  epsil:
    in: ChebyshevT(4, x)
    out: 8 * x ^ 4 - 8 * x ^ 2 + 1
  tex:
    in: \mathrm{ChebyshevT}(4, x)
    out: 8x^4-8x^2+1
  fullform:
    in: ChebyshevT[4, x]
