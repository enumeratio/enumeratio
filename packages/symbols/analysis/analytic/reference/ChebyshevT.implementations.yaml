pell-identity:
  epsil:
    in: ChebyshevT(4, 3) ^ 2 - 8 * ChebyshevU(3, 3) ^ 2
    out: "1"
  tex:
    in: \mathrm{ChebyshevT}(4, 3)^2-8\mathrm{ChebyshevU}(3, 3)^2
    out: "1"
  fullform:
    in: Subtract[Power[ChebyshevT[4, 3], 2], Times[8, Power[ChebyshevU[3, 3], 2]]]
  wolfram:
    in: Subtract[Power[ChebyshevT[4, 3], 2], Times[8, Power[ChebyshevU[3, 3], 2]]]
    out: "1"
    tex:
      in: T_4(3){}^2-8 U_3(3){}^2
      out: "1"
