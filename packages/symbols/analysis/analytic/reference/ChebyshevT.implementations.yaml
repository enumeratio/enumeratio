parity:
  epsil:
    in: ChebyshevT(5, -1 / 3) == -ChebyshevT(5, 1 / 3)
    out: True
  tex:
    in: \mathrm{ChebyshevT}(5, -\frac{1}{3})=-\mathrm{ChebyshevT}(5, \frac{1}{3})
    out: \top
  traditional:
    in: \mathrm{ChebyshevT}(5, -\frac{1}{3})=-\mathrm{ChebyshevT}(5, \frac{1}{3})
    out: \mathrm{True}
  fullform:
    in: Equal[ChebyshevT[5, Rational[-1, 3]], Minus[ChebyshevT[5, Rational[1, 3]]]]
  wolfram:
    in: (ChebyshevT[5, Rational[-1, 3]] == Minus[ChebyshevT[5, Rational[1, 3]]])
    out: True
    tex:
      in: T_5\left(-\frac{1}{3}\right)=-T_5\left(\frac{1}{3}\right)
      out: \text{True}
