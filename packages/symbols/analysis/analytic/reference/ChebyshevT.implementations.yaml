a-symbolic-order-stays-unevaluated:
  epsil:
    in: ChebyshevT(n, x)
    out: ChebyshevT(n, x)
  tex:
    in: \mathrm{ChebyshevT}(n, x)
    out: \mathrm{ChebyshevT}(n, x)
  fullform:
    in: ChebyshevT[n, x]
cos-n-theta:
  epsil:
    in: ChebyshevT(6, 1 / 2) == Cos(6 * (Pi / 3))
    out: True
  tex:
    in: \mathrm{ChebyshevT}(6, \frac{1}{2})=\cos(\frac{6\pi}{3})
    out: \top
  traditional:
    in: \mathrm{ChebyshevT}(6, \frac{1}{2})=\cos(\frac{6\pi}{3})
    out: \mathrm{True}
  fullform:
    in: Equal[ChebyshevT[6, Rational[1, 2]], Cos[Times[6, Divide[Pi, 3]]]]
  wolfram:
    in: (ChebyshevT[6, Rational[1, 2]] == Cos[Times[6, Divide[Pi, 3]]])
    out: True
    tex:
      in: T_6\left(\frac{1}{2}\right)=\cos \left(6 \frac{\pi }{3}\right)
      out: \text{True}
