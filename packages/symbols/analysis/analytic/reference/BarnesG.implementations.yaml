threads-elementwise-over-an-array:
  epsil:
    in: BarnesG([[1 / 2, 1], [1, 1 / 2]])
    out: "[[BarnesG(1 / 2), 1], [1, BarnesG(1 / 2)]]"
  tex:
    in: \mathrm{BarnesG}(\bigl\lbrack\bigl\lbrack\frac{1}{2}, 1\bigr\rbrack, \bigl\lbrack1, \frac{1}{2}\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\mathrm{BarnesG}(\frac{1}{2}), 1\bigr\rbrack, \bigl\lbrack1, \mathrm{BarnesG}(\frac{1}{2})\bigr\rbrack\bigr\rbrack
  traditional:
    in: \mathrm{BarnesG}(\bigl\lbrack\bigl\lbrack\frac{1}{2}, 1\bigr\rbrack, \bigl\lbrack1, \frac{1}{2}\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack G(\frac{1}{2}), 1\bigr\rbrack, \bigl\lbrack1, G(\frac{1}{2})\bigr\rbrack\bigr\rbrack
  fullform:
    in: BarnesG[List[List[Rational[1, 2], 1], List[1, Rational[1, 2]]]]
  wolfram:
    in: BarnesG[List[List[Rational[1, 2], 1], List[1, Rational[1, 2]]]]
    note: Wolfram also threads, but writes $G(\tfrac12)$ as its closed form $2^{1/24} e^{1/8} \pi^{-1/4} A^{-3/2}$ in Glaisher's constant.
