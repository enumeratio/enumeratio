the-superfactorials-threaded-over-a-list:
  wolfram:
    in: BarnesG[List[1, 2, 3, 4, 5, 6]]
    out: "{1, 1, 1, 2, 12, 288}"
    tex:
      in: G(\{1,2,3,4,5,6\})
      out: \{1,1,1,2,12,288\}
