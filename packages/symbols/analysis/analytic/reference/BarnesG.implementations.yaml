an-exact-non-integer-argument-stays-symbolic:
  epsil:
    in: BarnesG(5 / 2)
    out: BarnesG(5 / 2)
  tex:
    in: \mathrm{BarnesG}(\frac{5}{2})
    out: \mathrm{BarnesG}(\frac{5}{2})
  traditional:
    in: G(\frac{5}{2})
    out: G(\frac{5}{2})
  fullform:
    in: BarnesG[Rational[5, 2]]
  wolfram:
    in: BarnesG[Rational[5, 2]]
    out: (E^(1/8)*Pi^(3/4))/(2^(23/24)*Glaisher^(3/2))
    tex:
      in: G\left(\frac{5}{2}\right)
      out: \frac{\sqrt[8]{e} \pi ^{3/4}}{2^{23/24} A^{3/2}}
    verdict: disagree
    kind: unevaluated
    note: An exact non-integer argument stays symbolic here; Wolfram continues to a closed form in Glaisher's constant.
