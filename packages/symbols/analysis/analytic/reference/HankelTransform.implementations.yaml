    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Assuming}[a>0,\text{FullSimplify}[\mathcal{H}_{r,1}[\exp (-(a r))](s)]]-\frac{s}{\left(a^2+s^2\right)^{\frac{3}{2}}}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Assuming}\left[\frac{7}{3}>0,\text{FullSimplify}\left[\mathcal{H}_{-\frac{11}{5},1}\left[\exp \left(-\left(\frac{7}{3} \left(-\frac{11}{5}\right)\right)\right)\right]\left(\frac{13}{4}\right)\right]\right]-\frac{\frac{13}{4}}{\left(\left(\frac{7}{3}\right)^2+\left(\frac{13}{4}\right)^2\right)^{\frac{3}{2}}}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[-\frac{17}{6}>0,\text{FullSimplify}\left[\mathcal{H}_{\frac{19}{8},1}\left[\exp \left(-\left(-\frac{17}{6} \frac{19}{8}\right)\right)\right]\left(-\frac{23}{9}\right)\right]\right]--\frac{\frac{23}{9}}{\left(\left(-\frac{17}{6}\right)^2+\left(-\frac{23}{9}\right)^2\right)^{\frac{3}{2}}}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[\frac{7}{3}>0,\text{FullSimplify}\left[\mathcal{H}_{-\frac{11}{5},1}\left[\exp \left(-\left(\frac{7}{3} \left(-\frac{11}{5}\right)\right)\right)\right]\left(\frac{13}{4}\right)\right]\right]-\frac{\frac{13}{4}}{\left(\left(\frac{7}{3}\right)^2+\left(\frac{13}{4}\right)^2\right)^{\frac{3}{2}}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: unevaluated
    note: A Hankel-transform closed form that FullSimplify doesn't confirm automatically for a symbolic argument.
