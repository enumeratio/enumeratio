exp-neg-ar-order0:
  epsil:
    in: Assuming(a > 0, HankelTransform(Exp(-(a * r)), r, s))
    out: a / (a ^ 2 + s ^ 2) ^ (3 / 2)
  tex:
    in: \mathrm{Assuming}(a\gt0, \mathrm{HankelTransform}(\exp(-(ar)), r, s))
    out: (a)(\sqrt{a^2+s^2}^{3})^{-1}
  fullform:
    in: Assuming[Greater[a, 0], HankelTransform[Exp[Minus[Times[a, r]]], r, s]]
  wolfram:
    in: Assuming[Greater[a, 0], FullSimplify[HankelTransform[Exp[Minus[Times[a, r]]], r, s]]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Assuming}[a>0,\text{FullSimplify}[\text{HankelTransform}[\exp (-(a r)),r,s]]]-\frac{a}{\left(a^2+s^2\right)^{\frac{3}{2}}}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Assuming}\left[\frac{7}{3}>0,\text{FullSimplify}\left[\text{HankelTransform}\left[\exp \left(-\left(\frac{7}{3} \left(-\frac{11}{5}\right)\right)\right),-\frac{11}{5},\frac{13}{4}\right]\right]\right]-\frac{\frac{7}{3}}{\left(\left(\frac{7}{3}\right)^2+\left(\frac{13}{4}\right)^2\right)^{\frac{3}{2}}}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[-\frac{17}{6}>0,\text{FullSimplify}\left[\text{HankelTransform}\left[\exp \left(-\left(-\frac{17}{6} \frac{19}{8}\right)\right),\frac{19}{8},-\frac{23}{9}\right]\right]\right]--\frac{\frac{17}{6}}{\left(\left(-\frac{17}{6}\right)^2+\left(-\frac{23}{9}\right)^2\right)^{\frac{3}{2}}}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[\frac{7}{3}>0,\text{FullSimplify}\left[\text{HankelTransform}\left[\exp \left(-\left(\frac{7}{3} \left(-\frac{11}{5}\right)\right)\right),-\frac{11}{5},\frac{13}{4}\right]\right]\right]-\frac{\frac{7}{3}}{\left(\left(\frac{7}{3}\right)^2+\left(\frac{13}{4}\right)^2\right)^{\frac{3}{2}}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: unevaluated
    note: A Hankel-transform closed form that FullSimplify doesn't confirm automatically for a symbolic argument.
one-over-r:
  epsil:
    in: HankelTransform(1 / r, r, s)
    out: 1 / s
  tex:
    in: \mathrm{HankelTransform}(\frac{1}{r}, r, s)
    out: \frac{1}{s}
  fullform:
    in: HankelTransform[Divide[1, r], r, s]
  wolfram:
    in: HankelTransform[Divide[1, r], r, s]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{HankelTransform}\left[\frac{1}{r},r,s\right]-\frac{1}{s}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{HankelTransform}\left[\frac{1}{\frac{7}{3}},\frac{7}{3},-\frac{11}{5}\right]--\frac{1}{\frac{11}{5}}\right]\right],\text{Chop}\left[N\left[\text{HankelTransform}\left[\frac{1}{\frac{13}{4}},\frac{13}{4},-\frac{17}{6}\right]--\frac{1}{\frac{17}{6}}\right]\right],\text{Chop}\left[N\left[\text{HankelTransform}\left[\frac{1}{\frac{19}{8}},\frac{19}{8},-\frac{23}{9}\right]--\frac{1}{\frac{23}{9}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
one-over-sqrt-r2-a2:
  epsil:
    in: Assuming(a > 0, HankelTransform(1 / Sqrt(r ^ 2 + a ^ 2), r, s))
    out: ExponentialE ^ (-(a * s)) / s
  tex:
    in: \mathrm{Assuming}(a\gt0, \mathrm{HankelTransform}(\frac{1}{\sqrt{r^2+a^2}}, r, s))
    out: \frac{\exp(-(as))}{s}
  fullform:
    in: Assuming[Greater[a, 0], HankelTransform[Divide[1, Sqrt[Plus[Power[r, 2], Power[a, 2]]]], r, s]]
  wolfram:
    in: Assuming[Greater[a, 0], FullSimplify[HankelTransform[Divide[1, Sqrt[Plus[Power[r, 2], Power[a, 2]]]], r, s]]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Assuming}\left[a>0,\text{FullSimplify}\left[\text{HankelTransform}\left[\frac{1}{\sqrt{r^2+a^2}},r,s\right]\right]\right]-\frac{e^{-(a s)}}{s}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Assuming}\left[\frac{7}{3}>0,\text{FullSimplify}\left[\text{HankelTransform}\left[\frac{1}{\sqrt{\left(-\frac{11}{5}\right)^2+\left(\frac{7}{3}\right)^2}},-\frac{11}{5},\frac{13}{4}\right]\right]\right]-\frac{e^{-\left(\frac{7}{3} \frac{13}{4}\right)}}{\frac{13}{4}}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[-\frac{17}{6}>0,\text{FullSimplify}\left[\text{HankelTransform}\left[\frac{1}{\sqrt{\left(\frac{19}{8}\right)^2+\left(-\frac{17}{6}\right)^2}},\frac{19}{8},-\frac{23}{9}\right]\right]\right]--\frac{e^{-\left(-\frac{17}{6} \left(-\frac{23}{9}\right)\right)}}{\frac{23}{9}}\right]\right],\text{Chop}\left[N\left[\text{Assuming}\left[\frac{7}{3}>0,\text{FullSimplify}\left[\text{HankelTransform}\left[\frac{1}{\sqrt{\left(-\frac{11}{5}\right)^2+\left(\frac{7}{3}\right)^2}},-\frac{11}{5},\frac{13}{4}\right]\right]\right]-\frac{e^{-\left(\frac{7}{3} \frac{13}{4}\right)}}{\frac{13}{4}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: unevaluated
    note: A Hankel-transform closed form that FullSimplify doesn't confirm automatically for a symbolic argument.
exp-neg-ar-order1:
  epsil:
    in: Assuming(a > 0, HankelTransform(Exp(-(a * r)), r, s, 1))
    out: s / (a ^ 2 + s ^ 2) ^ (3 / 2)
  tex:
    in: \mathrm{Assuming}(a\gt0, \mathrm{HankelTransform}(\exp(-(ar)), r, s, 1))
    out: (s)(\sqrt{a^2+s^2}^{3})^{-1}
  fullform:
