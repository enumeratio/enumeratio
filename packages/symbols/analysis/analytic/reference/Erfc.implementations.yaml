erfc-z-2-erfc-z-here-at-z-1:
  epsil:
    in: Erfc(-1) + Erfc(1) == 2
    out: True
  tex:
    in: \mathrm{Erfc}(-1)+\mathrm{Erfc}(1)=2
    out: \top
  traditional:
    in: \operatorname{erfc}(-1)+\operatorname{erfc}(1)=2
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[Erfc[-1], Erfc[1]], 2]
  wolfram:
    in: (Plus[Erfc[-1], Erfc[1]] == 2)
    out: Erfc[-1] + Erfc[1] == 2
    tex:
      in: \text{erfc}(-1)+\text{erfc}(1)=2
      out: \text{erfc}(-1)+\text{erfc}(1)=2
definition-erf-z-erfc-z-1-see-erf:
  epsil:
    in: Erf(2) + Erfc(2) == 1
    out: True
  tex:
    in: \operatorname{erf}(2)+\mathrm{Erfc}(2)=1
    out: \top
  traditional:
    in: \operatorname{erf}(2)+\operatorname{erfc}(2)=1
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[Erf[2], Erfc[2]], 1]
  wolfram:
    in: (Plus[Erf[2], Erfc[2]] == 1)
    out: Erf[2] + Erfc[2] == 1
    tex:
      in: \text{erf}(2)+\text{erfc}(2)=1
      out: \text{erf}(2)+\text{erfc}(2)=1
