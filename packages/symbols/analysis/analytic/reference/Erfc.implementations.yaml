threads-element-wise-over-a-list-as-wolfram-s:
  epsil:
    in: Erfc([0, 1])
    out: "[1, Erfc(1)]"
  tex:
    in: \mathrm{Erfc}(\bigl\lbrack0, 1\bigr\rbrack)
    out: \bigl\lbrack1, \mathrm{Erfc}(1)\bigr\rbrack
  traditional:
    in: \mathrm{Erfc}(\bigl\lbrack0, 1\bigr\rbrack)
    out: \bigl\lbrack1, \operatorname{erfc}(1)\bigr\rbrack
  fullform:
    in: Erfc[List[0, 1]]
  wolfram:
    in: Erfc[List[0, 1]]
    out: "{1, Erfc[1]}"
    tex:
      in: \text{erfc}(\{0,1\})
      out: \{1,\text{erfc}(1)\}
