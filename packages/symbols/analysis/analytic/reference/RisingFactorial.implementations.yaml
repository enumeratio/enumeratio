a-symbolic-base:
  epsil:
    in: RisingFactorial(a, 3)
    out: a * (a + 1) * (a + 2)
  tex:
    in: \mathrm{RisingFactorial}(a, 3)
    out: a\times(a+1)(a+2)
  traditional:
    in: a^{\overline{3}}
    out: a\times(a+1)(a+2)
  fullform:
    in: Pochhammer[a, 3]
    back: [Pochhammer, a, 3]
a-rational-base:
  epsil:
    in: RisingFactorial(1 / 2, 3)
    out: 15 / 8
  tex:
    in: \mathrm{RisingFactorial}(\frac{1}{2}, 3)
    out: \frac{15}{8}
  traditional:
    in: (\frac{1}{2})^{\overline{3}}
    out: \frac{15}{8}
  fullform:
    in: Pochhammer[Rational[1, 2], 3]
    back: [Pochhammer, [Rational, 1, 2], 3]
  wolfram:
    in: Pochhammer[Rational[1, 2], 3]
    out: 15/8
    tex:
      in: \left(\frac{1}{2}\right)_3
      out: \frac{15}{8}
a-symbolic-order-is-pochhammer:
  epsil:
    in: RisingFactorial(a, n)
    out: Pochhammer(a, n)
  tex:
    in: \mathrm{RisingFactorial}(a, n)
    out: \mathrm{Pochhammer}(a, n)
  traditional:
    in: a^{\overline{n}}
    out: \left(a\right)_{n}
  fullform:
    in: Pochhammer[a, n]
    back: [Pochhammer, a, n]
complex-base-and-order:
  epsil:
    in: N(RisingFactorial(2 + 5i, 3 + 2i))
    out: 20.647_407_894_772_527 + 24.047_356_710_232_72i
  tex:
    in: N(\mathrm{RisingFactorial}(2+5i, 3+2i))
    out: 20.647\,407\,894\,772\,527+24.047\,356\,710\,232\,72i
  traditional:
    in: N((2+5i)^{\overline{3+2i}})
    out: 20.647\,407\,894\,772\,527+24.047\,356\,710\,232\,72i
  fullform:
    in: N[Pochhammer[Complex[2, 5], Complex[3, 2]]]
    back: [N, [Pochhammer, [Complex, 2, 5], [Complex, 3, 2]]]
  wolfram:
    in: N[Pochhammer[Complex[2, 5], Complex[3, 2]]]
    out: 20.6474078947724 + 24.047356710232826*I
    tex:
      in: N\left[(2+5 i)_{3+2 i}\right]
      out: 20.6474\, +24.0474 i
agrees-with-pochhammer:
  epsil:
    in: RisingFactorial(4, 3) == Pochhammer(4, 3)
    out: True
  tex:
    in: \mathrm{RisingFactorial}(4, 3)=\mathrm{Pochhammer}(4, 3)
    out: \top
  traditional:
    in: 4^{\overline{3}}=\left(4\right)_{3}
    out: \mathrm{True}
  fullform:
    in: Equal[Pochhammer[4, 3], Pochhammer[4, 3]]
    back: [Equal, [Pochhammer, 4, 3], [Pochhammer, 4, 3]]
  wolfram:
    in: (Pochhammer[4, 3] == Pochhammer[4, 3])
    out: True
    tex:
      in: (4)_3=(4)_3
      out: \text{True}
