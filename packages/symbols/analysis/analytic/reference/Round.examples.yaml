  expr: [Round, 2.6]
  expected: 3
- id: round-5p37
  expr: [Round, 5.37]
  expected: 5
- id: round-neg-3p7
  expr: [Round, -3.7]
  expected: -4
- id: stays-symbolic
  expr: [Round, x]
  expected: [Round, x]
  category: Scope
  caption: Stays symbolic
- id: to-the-nearest-ten
  expr: [Round, 226, -1]
  expected: 230
  category: Scope
  caption: To the nearest ten
- id: an-exact-argument-rounds-to-an-exact-rational
  expr: [Round, [Sqrt, 2], 4]
