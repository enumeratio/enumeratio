  caption: Rounds the real and imaginary parts separately
- id: an-exact-half-rounds-away-from-zero-as-well
  expr: [Round, [Rational, 1, 2]]
  expected: 1
  category: Possible issues
  caption: An exact half rounds away from zero as well
- role: test
  id: idempotent-round-round-x-round-x
  expr: [Round, [Round, x]]
  expected: [Round, x]
  caption: 'Idempotent: $\mathrm{round}(\mathrm{round}(x)) = \mathrm{round}(x)$'
