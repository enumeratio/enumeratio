- id: evaluates-at-an-exact-constant-round-pi-3
  expr: [Round, Pi]
  expected: 3
  category: Scope
  caption: 'Evaluates at an exact constant: $\mathrm{Round}(\pi) = 3$'
- id: 100e-approx-271-83-rounds-to-272
  expr: [Round, [Multiply, 100, ExponentialE]]
