- id: round-7-over-2
  expr: [Round, [Rational, 7, 2]]
  expected: 4
- id: round-3p5
  expr: [Round, 3.5]
  expected: 4
- id: round-3p7
  expr: [Round, 3.7]
  expected: 4
  role: test
- id: integers-pass-through-unchanged
  expr: [Round, 5]
  expected: 5
  caption: Integers pass through unchanged
- id: a-second-argument-rounds-to-that-many-decimal
  expr: [Round, 3.14159, 2]
  expected: [Rational, 157, 50]
  caption: A second argument rounds to that many decimal places
- id: threads-element-wise-over-a-list
  expr: [Round, [List, 1.5, -1.5, 2.4]]
  expected: [List, 2, -2, 2]
  caption: Threads element-wise over a list
- id: a-negative-second-argument-rounds-to-the-nearest
  expr: [Equal, [Round, 1234, -2], 1200]
  expected: True
  category: Properties
  caption: A negative second argument rounds to the nearest power of ten instead -- here, the nearest hundred
- id: rounding-to-0-decimal-places-matches-the-1
  expr: [Equal, [Round, 3.14159, 0], [Round, 3.14159]]
  expected: True
  category: Properties
  caption: Rounding to 0 decimal places matches the 1-argument form
- id: rounding-a-price-to-the-nearest-cent-19-995
  expr: [Round, 19.995, 2]
  expected: 20
  category: Applications
  caption: "Rounding a price to the nearest cent: 19.995 rounds up to 20"
- id: rounds-half-away-from-zero-not-banker-s-rounding
  expr: [Round, 2.5]
  expected: 3
  category: Possible issues
  caption: "Rounds half away from zero, not banker's rounding: 2.5 rounds to 3, not 2"
- id: and-by-the-same-convention-2-5-rounds-to-3-not-2
  expr: [Round, -2.5]
  expected: -3
  category: Possible issues
  caption: ...and by the same convention, -2.5 rounds to -3, not -2
