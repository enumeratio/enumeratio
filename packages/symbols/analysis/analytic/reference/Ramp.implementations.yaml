ramp-negative:
  epsil:
    in: Ramp(-2)
    out: "0"
  tex:
    in: \mathrm{Ramp}(-2)
    out: "0"
  fullform:
    in: Ramp[-2]
  wolfram:
    in: Ramp[-2]
ramp-positive:
  epsil:
    in: Ramp(3)
    out: "3"
  tex:
    in: \mathrm{Ramp}(3)
    out: "3"
  fullform:
    in: Ramp[3]
  wolfram:
    in: Ramp[3]
ramp-zero:
  epsil:
    in: Ramp(0)
    out: "0"
  tex:
    in: \mathrm{Ramp}(0)
    out: "0"
  fullform:
    in: Ramp[0]
  wolfram:
    in: Ramp[0]
ramp-equals-x-times-unitstep:
  epsil:
    in: Ramp(5) == 5 * UnitStep(5)
    out: True
  tex:
    in: \mathrm{Ramp}(5)=5\mathrm{UnitStep}(5)
    out: \top
  traditional:
    in: \mathrm{Ramp}(5)=5\mathrm{UnitStep}(5)
    out: \mathrm{True}
  fullform:
    in: Equal[Ramp[5], Times[5, UnitStep[5]]]
  wolfram:
    in: (Ramp[5] == Times[5, UnitStep[5]])
ramp-derivative:
  epsil:
    in: D(Ramp(x), x)
    out: Piecewise([[0, x < 0], [1, 0 < x]], Indeterminate)
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\mathrm{Ramp}(x)
    out: \mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack0, x\lt0\bigr\rbrack, \bigl\lbrack1, 0\lt x\bigr\rbrack\bigr\rbrack, \mathrm{Indeterminate})
  fullform:
    in: D[Ramp[x], x]
