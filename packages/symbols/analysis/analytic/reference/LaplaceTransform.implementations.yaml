t-cubed:
  epsil:
    in: LaplaceTransform(t ^ 3, t, s)
    out: 6 / s ^ 4
  tex:
    in: \mathrm{LaplaceTransform}(t^3, t, s)
    out: \frac{6}{s^4}
  fullform:
    in: LaplaceTransform[Power[t, 3], t, s]
  wolfram:
    in: LaplaceTransform[Power[t, 3], t, s]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{L}_t\left[t^3\right](s)-\frac{6}{s^4}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{L}_{-\frac{11}{5}}\left[\left(-\frac{11}{5}\right)^3\right]\left(\frac{7}{3}\right)-\frac{6}{\left(\frac{7}{3}\right)^4}\right]\right],\text{Chop}\left[N\left[\mathcal{L}_{-\frac{17}{6}}\left[\left(-\frac{17}{6}\right)^3\right]\left(\frac{13}{4}\right)-\frac{6}{\left(\frac{13}{4}\right)^4}\right]\right],\text{Chop}\left[N\left[\mathcal{L}_{-\frac{23}{9}}\left[\left(-\frac{23}{9}\right)^3\right]\left(\frac{19}{8}\right)-\frac{6}{\left(\frac{19}{8}\right)^4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
exp-at:
  epsil:
    in: LaplaceTransform(ExponentialE ^ (2t), t, s)
    out: 1 / (s - 2)
  tex:
    in: \mathrm{LaplaceTransform}(\exp(2t), t, s)
    out: \frac{1}{s-2}
  fullform:
    in: LaplaceTransform[Power[E, Times[2, t]], t, s]
  wolfram:
    in: LaplaceTransform[Power[E, Times[2, t]], t, s]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{L}_t\left[e^{2 t}\right](s)-\frac{1}{s-2}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{L}_{-\frac{11}{5}}\left[e^{2 \left(-\frac{11}{5}\right)}\right]\left(\frac{7}{3}\right)-\frac{1}{\frac{7}{3}-2}\right]\right],\text{Chop}\left[N\left[\mathcal{L}_{-\frac{17}{6}}\left[e^{2 \left(-\frac{17}{6}\right)}\right]\left(\frac{13}{4}\right)-\frac{1}{\frac{13}{4}-2}\right]\right],\text{Chop}\left[N\left[\mathcal{L}_{-\frac{23}{9}}\left[e^{2 \left(-\frac{23}{9}\right)}\right]\left(\frac{19}{8}\right)-\frac{1}{\frac{19}{8}-2}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
sin-at:
  epsil:
    in: LaplaceTransform(Sin(3t), t, s)
    out: 3 / (s ^ 2 + 9)
  tex:
    in: \mathrm{LaplaceTransform}(\sin(3t), t, s)
    out: \frac{3}{s^2+9}
  fullform:
    in: LaplaceTransform[Sin[Times[3, t]], t, s]
  wolfram:
    in: LaplaceTransform[Sin[Times[3, t]], t, s]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{L}_t[\sin (3 t)](s)-\frac{3}{s^2+9}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{L}_{-\frac{11}{5}}\left[\sin \left(3 \left(-\frac{11}{5}\right)\right)\right]\left(\frac{7}{3}\right)-\frac{3}{\left(\frac{7}{3}\right)^2+9}\right]\right],\text{Chop}\left[N\left[\mathcal{L}_{-\frac{17}{6}}\left[\sin \left(3 \left(-\frac{17}{6}\right)\right)\right]\left(\frac{13}{4}\right)-\frac{3}{\left(\frac{13}{4}\right)^2+9}\right]\right],\text{Chop}\left[N\left[\mathcal{L}_{-\frac{23}{9}}\left[\sin \left(3 \left(-\frac{23}{9}\right)\right)\right]\left(\frac{19}{8}\right)-\frac{3}{\left(\frac{19}{8}\right)^2+9}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
