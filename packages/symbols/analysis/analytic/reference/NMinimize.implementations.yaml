a-quartic-with-two-symmetric-minima:
  epsil:
    in: NMinimize([x ^ 4 - x ^ 2, x >= -2 && x <= 2], x)
    out: "[-0.25, [Rule(x, -0.707_106_778_558_382)]]"
  tex:
    in: \mathrm{NMinimize}(\bigl\lbrack x^4-x^2, x\ge-2\land x\le2\bigr\rbrack, x)
    out: \bigl\lbrack-0.25, \bigl\lbrack\mathrm{Rule}(x, -0.707\,106\,778\,558\,382)\bigr\rbrack\bigr\rbrack
  fullform:
    in: NMinimize[List[Subtract[Power[x, 4], Power[x, 2]], And[GreaterEqual[x, -2], LessEqual[x, 2]]], x]
  wolfram:
    in: NMinimize[List[Subtract[Power[x, 4], Power[x, 2]], And[GreaterEqual[x, -2], LessEqual[x, 2]]], x]
    out: "{-0.25, {x -> -0.7071067810088905}}"
    tex:
      in: \text{NMinimize}\left[\left\{x^4-x^2,x\geq -2\land x\leq 2\right\},x\right]
      out: \{-0.25,\{x\to -0.707107\}\}
    verdict: disagree
    kind: precision
    note: The minimum value (-0.25) agrees exactly; the two argmin values (-0.7071067785... vs -0.7071067810...) are both approximately -1/sqrt(2) but diverge past the 8th digit, a numeric-optimizer precision difference, not a different answer.
declines-without-a-bounded-constraint:
  epsil:
    in: NMinimize(x ^ 2, x)
    out: NMinimize(x ^ 2, x)
  tex:
    in: \mathrm{NMinimize}(x^2, x)
    out: \mathrm{NMinimize}(x^2, x)
  fullform:
    in: NMinimize[Power[x, 2], x]
  wolfram:
    in: NMinimize[Power[x, 2], x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{NMinimize}\left[x^2,x\right]-\text{NMinimize}\left[x^2,x\right]\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{NMinimize}\left[\left(\frac{7}{3}\right)^2,\frac{7}{3}\right]-\text{NMinimize}\left[\left(\frac{7}{3}\right)^2,\frac{7}{3}\right]\right]\right],\text{Chop}\left[N\left[\text{NMinimize}\left[\left(-\frac{11}{5}\right)^2,-\frac{11}{5}\right]-\text{NMinimize}\left[\left(-\frac{11}{5}\right)^2,-\frac{11}{5}\right]\right]\right],\text{Chop}\left[N\left[\text{NMinimize}\left[\left(\frac{13}{4}\right)^2,\frac{13}{4}\right]-\text{NMinimize}\left[\left(\frac{13}{4}\right)^2,\frac{13}{4}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
