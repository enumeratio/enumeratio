a-floating-point-argument-evaluates-directly-to:
  epsil:
    in: N(JacobiAmplitude(0.3, 0.5))
    out: 0.297_794_749_129_830_3
  tex:
    in: N(\mathrm{JacobiAmplitude}(0.3, 0.5))
    out: 0.297\,794\,749\,129\,830\,3
  fullform:
    in: N[JacobiAmplitude[0.3, 0.5]]
  wolfram:
    in: N[JacobiAmplitude[0.3, 0.5]]
u-0-is-0-for-any-m:
  epsil:
    in: JacobiAmplitude(0, m)
    out: "0"
  tex:
    in: \mathrm{JacobiAmplitude}(0, m)
    out: "0"
  fullform:
    in: JacobiAmplitude[0, m]
  wolfram:
    in: JacobiAmplitude[0, m]
    out: "0"
    tex:
      in: \text{am}(0|m)
      out: "0"
m-0-reduces-to-u:
  epsil:
    in: JacobiAmplitude(u, 0)
    out: u
  tex:
    in: \mathrm{JacobiAmplitude}(u, 0)
    out: u
  fullform:
    in: JacobiAmplitude[u, 0]
  wolfram:
    in: JacobiAmplitude[u, 0]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{am}(u|0)-u],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{am}\left(\left.\frac{7}{3}\right|0\right)-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{am}\left(\left.-\frac{11}{5}\right|0\right)--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{am}\left(\left.\frac{13}{4}\right|0\right)-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
