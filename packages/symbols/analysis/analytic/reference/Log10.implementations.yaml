log10-1-000:
  wolfram:
    in: Log10[1000]
    out: "3"
    tex:
      in: \log _{10}(1000)
      out: "3"
log10-1:
  wolfram:
    in: Log10[1]
    out: "0"
    tex:
      in: \log _{10}(1)
      out: "0"
log10-100-000:
  wolfram:
    in: Log10[100000]
    out: "5"
    tex:
      in: \log _{10}(100000)
      out: "5"
same-as-compute-engine-s-default-base-log:
  wolfram:
    in: (Log10[1000] == Log[10, 1000])
    out: True
    tex:
      in: \log _{10}(1000)=\log _{10}(1000)
      out: \text{True}
a-float-argument-folds-even-for-a-fractional:
  wolfram:
    in: Log10[0.001]
    out: -3.
    tex:
      in: \log _{10}(0.001)
      out: -3.
an-exact-negative-power-of-10-folds-too-log-10:
  wolfram:
    in: Log10[Rational[1, 100]]
    out: "-2"
    tex:
      in: \log _{10}\left(\frac{1}{100}\right)
      out: "-2"
a-symbolic-argument-becomes-compute-engine-s:
  wolfram:
    in:
    note: Wolfram rewrites Log10[x] to Log[x]/Log[10].
interval-arithmetic-log-10-frac-13-2-log-10-3:
  wolfram:
    in: Log10[Interval[List[Rational[1, 3], 2]]]
    note: Wolfram writes the lower end as -Log[10, 3], the same value.
