sine-s-period-is-2-pi:
  epsil:
    in: FunctionPeriod(Sin(x), x)
    out: 2Pi
  tex:
    in: \mathrm{FunctionPeriod}(\sin(x), x)
    out: 2\pi
  fullform:
    in: FunctionPeriod[Sin[x], x]
  wolfram:
    in: FunctionPeriod[Sin[x], x]
    out: 2*Pi
    tex:
      in: \text{FunctionPeriod}[\sin (x),x]
      out: 2 \pi
tangent-s-period-is-pi:
  epsil:
    in: FunctionPeriod(Tan(x), x)
    out: Pi
  tex:
    in: \mathrm{FunctionPeriod}(\tan(x), x)
    out: \pi
  fullform:
    in: FunctionPeriod[Tan[x], x]
  wolfram:
    in: FunctionPeriod[Tan[x], x]
    out: Pi
    tex:
      in: \text{FunctionPeriod}[\tan (x),x]
      out: \pi
scaling-the-argument-scales-the-period:
  epsil:
    in: FunctionPeriod(Sin(2x), x)
    out: Pi
  tex:
    in: \mathrm{FunctionPeriod}(\sin(2x), x)
    out: \pi
  fullform:
    in: FunctionPeriod[Sin[Times[2, x]], x]
  wolfram:
    in: FunctionPeriod[Sin[Times[2, x]], x]
    out: Pi
    tex:
      in: \text{FunctionPeriod}[\sin (2 x),x]
      out: \pi
exp-is-not-periodic:
  epsil:
    in: FunctionPeriod(Exp(x), x)
    out: "0"
  tex:
    in: \mathrm{FunctionPeriod}(e^{x}, x)
    out: "0"
  fullform:
    in: FunctionPeriod[Exp[x], x]
  wolfram:
    in: FunctionPeriod[Exp[x], x]
    out: "0"
    tex:
      in: \text{FunctionPeriod}[\exp (x),x]
      out: "0"
a-polynomial-is-not-periodic:
  epsil:
    in: FunctionPeriod(x ^ 2, x)
    out: "0"
  tex:
    in: \mathrm{FunctionPeriod}(x^2, x)
    out: "0"
  fullform:
    in: FunctionPeriod[Power[x, 2], x]
  wolfram:
    in: FunctionPeriod[Power[x, 2], x]
