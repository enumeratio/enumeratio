threads-element-wise-over-a-list:
  epsil:
    in: Ln([1, 2.1, 3.1, 4.1])
    out: |-
      [
        0,
        0.741_937_344_729_377_312_483,
        1.131_402_111_491_100_561_91,
        1.410_986_973_710_262_119_85,
      ]
  tex:
    in: \ln(\bigl\lbrack1, 2.1, 3.1, 4.1\bigr\rbrack)
    out: \bigl\lbrack0, 0.741\,937\,344\,729\,377\,312\,483, 1.131\,402\,111\,491\,100\,561\,91, 1.410\,986\,973\,710\,262\,119\,85\bigr\rbrack
  fullform:
    in: Log[List[1, 2.1, 3.1, 4.1]]
  wolfram:
    in: Log[List[1, 2.1, 3.1, 4.1]]
  sympy:
    in: "[log(1), log(2.1), log(3.1), log(4.1)]"
    out: "[0, 0.741937344729377, 1.13140211149110, 1.41098697371026]"
  mpmath:
    in: "[log(1), log(2.1), log(3.1), log(4.1)]"
    out: "[mpf('0.0'), mpf('0.741937344729377354776816987592111'), mpf('1.13140211149110059056208963437813'), mpf('1.41098697371026203319721877687743')]"
  sage:
    in: "[log(1), log(2.1), log(3.1), log(4.1)]"
  rust:
    in: ln(list(vec![n(1), x(2.1), x(3.1), x(4.1)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Ln is Listable and threads over the list; the Rust crates take scalars only.
