ln-0:
  epsil:
    in: Ln(0)
    out: NegativeInfinity
  tex:
    in: \ln(0)
    out: -\infty
  fullform:
    in: Log[0]
  wolfram:
    in: Log[0]
    out: -Infinity
    tex:
      in: \log (0)
      out: -\infty
  sympy:
    in: log(0)
    out: zoo
    verdict: disagree
    kind: undefined-form
    note: "A pole or undefined value: compute-engine answers NegativeInfinity, SymPy gives zoo."
  mpmath:
    in: log(0)
    out: -inf
  sage:
    in: log(0)
    out: -Infinity
    verdict: disagree
    kind: shape
    note: Both mean the same signed infinity; our symbol prints as 'NegativeInfinity', Sage's log(0) prints as '-Infinity' -- a spelling mismatch the text comparator can't bridge.
  rust:
    in: ln(n(0))
    out: NegativeInfinity
inverse-of-exp-ln-e-x-x:
  epsil:
    in: Ln(Exp(5)) == 5
    out: True
  tex:
    in: \ln(e^{5})=5
    out: \top
  traditional:
    in: \ln(e^{5})=5
    out: \mathrm{True}
  fullform:
    in: Equal[Log[Exp[5]], 5]
  wolfram:
    in: (Log[Exp[5]] == 5)
    out: True
    tex:
      in: \log (\exp (5))=5
      out: \text{True}
  sympy:
    in: enumeratio_equal(log(exp(5)), 5)
    out: True
  mpmath:
    in: almosteq(log(exp(5)), 5, 1e-20)
    out: True
  sage:
    in: bool(log(exp(5)) == 5)
    out: True
  rust:
    in: equal(ln(exp(n(5))), n(5))
    out: "true"
product-rule-ln-ab-ln-a-ln-b:
  epsil:
    in: Ln(2) + Ln(3) == Ln(6)
    out: True
  tex:
    in: \ln(2)+\ln(3)=\ln(6)
    out: \top
  traditional:
    in: \ln(2)+\ln(3)=\ln(6)
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[Log[2], Log[3]], Log[6]]
  wolfram:
    in: (Plus[Log[2], Log[3]] == Log[6])
    out: True
    tex:
      in: \log (2)+\log (3)=\log (6)
      out: \text{True}
  sympy:
    in: enumeratio_equal((log(2) + log(3)), log(6))
    out: True
  mpmath:
    in: almosteq((log(2) + log(3)), log(6), 1e-20)
    out: True
  sage:
    in: bool((log(2) + log(3)) == log(6))
    out: False
    verdict: disagree
    kind: convention
    note: True mathematically; Sage's bool(a==b) on unevaluated symbolic logs doesn't invoke a log-identity simplification by default and reports False rather than attempting the proof.
  rust:
    in: equal((ln(n(2)) + ln(n(3))), ln(n(6)))
    out: "true"
ln-1-i-pi-the-principal-value-past-the-branch:
  epsil:
    in: Ln(-1)
    out: i * Pi
  tex:
    in: \ln(-1)
    out: i\pi
  fullform:
    in: Log[-1]
  wolfram:
    in: Log[-1]
    out: I*Pi
    tex:
      in: \log (-1)
      out: i \pi
  sympy:
    in: log(-1)
    out: I*pi
  mpmath:
    in: log(-1)
    out: (0.0 + 3.14159265358979323846264338328j)
  sage:
    in: log(-1)
    out: I*pi
  rust:
    in: ln(n(-1))
    out: NaN
    verdict: disagree
    kind: domain
    note: Rust's f64 ln is real-only and gives NaN; compute-engine continues into the complex plane.
