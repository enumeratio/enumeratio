    in: Sqrt(Square(3) + Square(4))
    out: "5"
  tex:
    in: \sqrt{3^2+4^2}
    out: "5"
  wolfram:
    in: Sqrt[Plus[(3)^2, (4)^2]]
    back: Unreadable
    out: "5"
    tex:
      in: \sqrt{3^2+4^2}
      out: "5"
  sympy:
    in: sqrt(((3)**2 + (4)**2))
    out: "5"
  mpmath:
    in: sqrt(((3)**2 + (4)**2))
    out: "5.0"
  sage:
    in: sqrt(((3)^2 + (4)^2))
    out: "5"
