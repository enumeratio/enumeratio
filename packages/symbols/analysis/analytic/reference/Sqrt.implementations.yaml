  sympy:
    in: sqrt(2)
    out: sqrt(2)
sqrt-4-over-9:
  wolfram:
    in: Sqrt[Rational[4, 9]]
    out: 2/3
    tex:
      in: \sqrt{\frac{4}{9}}
      out: \frac{2}{3}
  sage:
    in: sqrt((4/9))
    out: 2/3
  rust:
    in: sqrt(rational(n(4), n(9)))
    out: "0.6666666666666666"
  sympy:
    in: sqrt(Rational(4, 9))
    out: 2/3
