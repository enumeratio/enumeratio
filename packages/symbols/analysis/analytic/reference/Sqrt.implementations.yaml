a-perfect-square-radicand-evaluates-exactly-even:
  epsil:
    in: Sqrt(-4)
    out: 2i
  tex:
    in: \sqrt{-4}
    out: 2i
  wolfram:
    in: Sqrt[-4]
    out: 2*I
    tex:
      in: \sqrt{-4}
      out: 2 i
  sympy:
    in: sqrt(-4)
    out: 2*I
  mpmath:
    in: sqrt(-4)
    out: (0.0 + 2.0j)
  sage:
    in: sqrt(-4)
    out: 2*I
  rust:
    in: sqrt(n(-4))
    out: NaN
    verdict: disagree
    kind: domain
    note: Rust's f64 sqrt is real-only and gives NaN; compute-engine continues into the complex plane.
sqrt-x-2-x-for-a-perfect-square-see-square:
  epsil:
    in: Square(Sqrt(16)) == 16
    out: True
  tex:
    in: \sqrt{16}^2=16
    out: \top
  traditional:
    in: \sqrt{16}^2=16
    out: \mathrm{True}
  wolfram:
    in: ((Sqrt[16])^2 == 16)
    back: Unreadable
    out: True
    tex:
      in: \sqrt{16}^2=16
      out: \text{True}
  sympy:
    in: enumeratio_equal((sqrt(16))**2, 16)
    out: True
  mpmath:
    in: almosteq((sqrt(16))**2, 16, 1e-20)
    out: True
  sage:
    in: bool((sqrt(16))^2 == 16)
    out: True
sqrt-x-x-1-2:
  epsil:
    in: Sqrt(16) == 16 ^ (1 / 2)
    out: True
  tex:
    in: \sqrt{16}=\sqrt{16}
    out: \top
  traditional:
    in: \sqrt{16}=\sqrt{16}
    out: \mathrm{True}
  wolfram:
    in: (Sqrt[16] == Power[16, Rational[1, 2]])
    back: Unreadable
    out: True
    tex:
      in: \sqrt{16}=16^{\frac{1}{2}}
      out: \text{True}
  sympy:
    in: enumeratio_equal(sqrt(16), (16**Rational(1, 2)))
    out: True
  sage:
    in: bool(sqrt(16) == (16^(1/2)))
    out: True
  rust:
    in: equal(sqrt(n(16)), power(n(16), rational(n(1), n(2))))
    out: "true"
the-pythagorean-hypotenuse-of-a-3-4-5-triangle:
