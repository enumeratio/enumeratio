    in: Sqrt[16]
    out: "4"
    tex:
      in: \sqrt{16}
      out: "4"
  sage:
    in: sqrt(16)
    out: "4"
  rust:
    in: sqrt(n(16))
    out: "4.0"
  mpmath:
    in: sqrt(16)
    out: "4.0"
  sympy:
    in: sqrt(16)
    out: "4"
stays-symbolic-when-the-radicand-isn-t-a-perfect:
