unitbox-inside-the-box:
  epsil:
    in: UnitBox(0)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(0)
    out: "1"
  fullform:
    in: UnitBox[0]
  wolfram:
    in: UnitBox[0]
unitbox-boundary-1-2:
  epsil:
    in: UnitBox(1 / 2)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(\frac{1}{2})
    out: "1"
  fullform:
    in: UnitBox[Rational[1, 2]]
  wolfram:
    in: UnitBox[Rational[1, 2]]
unitbox-boundary-neg-1-2:
  epsil:
    in: UnitBox(-1 / 2)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(-\frac{1}{2})
    out: "1"
  fullform:
    in: UnitBox[Rational[-1, 2]]
  wolfram:
    in: UnitBox[Rational[-1, 2]]
unitbox-outside-the-box:
  epsil:
    in: UnitBox(1)
    out: "0"
  tex:
    in: \mathrm{UnitBox}(1)
    out: "0"
  fullform:
    in: UnitBox[1]
  wolfram:
    in: UnitBox[1]
unitbox-product-of-two-boxes:
  epsil:
    in: UnitBox(0, 0)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(0, 0)
    out: "1"
  fullform:
    in: UnitBox[0, 0]
  wolfram:
    in: UnitBox[0, 0]
unitbox-derivative-away-from-the-jump:
  epsil:
    in: D(UnitBox(x), x)
    out: Piecewise([[Indeterminate, x == 1 / 2 || x == -1 / 2]], 0)
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\mathrm{UnitBox}(x)
    out: \mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack\mathrm{Indeterminate}, x=1/2\lor x=-1/2\bigr\rbrack\bigr\rbrack, 0)
  fullform:
    in: D[UnitBox[x], x]
