unitbox-inside-the-box:
  epsil:
    in: UnitBox(0)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(0)
    out: "1"
  fullform:
    in: UnitBox[0]
  wolfram:
    in: UnitBox[0]
unitbox-boundary-1-2:
  epsil:
    in: UnitBox(1 / 2)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(\frac{1}{2})
    out: "1"
  fullform:
    in: UnitBox[Rational[1, 2]]
  wolfram:
    in: UnitBox[Rational[1, 2]]
unitbox-boundary-neg-1-2:
  epsil:
    in: UnitBox(-1 / 2)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(-\frac{1}{2})
    out: "1"
  fullform:
    in: UnitBox[Rational[-1, 2]]
  wolfram:
    in: UnitBox[Rational[-1, 2]]
unitbox-outside-the-box:
  epsil:
    in: UnitBox(1)
    out: "0"
  tex:
    in: \mathrm{UnitBox}(1)
    out: "0"
  fullform:
    in: UnitBox[1]
  wolfram:
    in: UnitBox[1]
unitbox-product-of-two-boxes:
  epsil:
    in: UnitBox(0, 0)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(0, 0)
    out: "1"
  fullform:
    in: UnitBox[0, 0]
  wolfram:
    in: UnitBox[0, 0]
unitbox-product-second-at-its-boundary:
  epsil:
    in: UnitBox(0, 1 / 2)
    out: "1"
  tex:
    in: \mathrm{UnitBox}(0, \frac{1}{2})
    out: "1"
  fullform:
    in: UnitBox[0, Rational[1, 2]]
  wolfram:
    in: UnitBox[0, Rational[1, 2]]
unitbox-derivative-away-from-the-jump:
  epsil:
    in: D(UnitBox(x), x)
    out: Piecewise([[Indeterminate, x == 1 / 2 || x == -1 / 2]], 0)
  tex:
    in: \frac{\mathrm{d}\mathrm{UnitBox}(x)}{\mathrm{d}x}
    out: \mathrm{Piecewise}(\bigl\lbrack\bigl\lbrack\mathrm{Indeterminate}, x=1/2\lor x=-1/2\bigr\rbrack\bigr\rbrack, 0)
  fullform:
    in: D[UnitBox[x], x]
  wolfram:
    in: D[UnitBox[x], x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\frac{\partial \Pi (x)}{\partial x}-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \text{Indeterminate} & x=\frac{1}{2}\lor x=-\frac{1}{2} \\  0 & \text{True} \\ \end{array}  \\ \end{array} \right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\frac{\partial }{\partial \frac{7}{3}}\Pi \left(\frac{7}{3}\right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \text{Indeterminate} & \frac{7}{3}=\frac{1}{2}\lor \frac{7}{3}=-\frac{1}{2} \\  0 & \text{True} \\ \end{array}  \\ \end{array} \right)\right]\right],\text{Chop}\left[N\left[\frac{\partial }{\partial -\frac{11}{5}}\Pi \left(-\frac{11}{5}\right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \text{Indeterminate} & -\frac{11}{5}=\frac{1}{2}\lor -\frac{11}{5}=-\frac{1}{2} \\  0 & \text{True} \\ \end{array}  \\ \end{array} \right)\right]\right],\text{Chop}\left[N\left[\frac{\partial }{\partial \frac{13}{4}}\Pi \left(\frac{13}{4}\right)-\left( \begin{array}{cc}  \{ &  \begin{array}{cc}  \text{Indeterminate} & \frac{13}{4}=\frac{1}{2}\lor \frac{13}{4}=-\frac{1}{2} \\  0 & \text{True} \\ \end{array}  \\ \end{array} \right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
