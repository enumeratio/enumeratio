polynomial-terminates-the-ode:
  epsil:
    in: DifferentialRootReduce(x ^ 2 + 3x + 1, x)
    out: |-
      Apply(DifferentialRoot(Function([
                                        Apply(Derivative(y, 3), x2) == 0,
                                        y(0) == 1,
                                        Apply(Derivative(y, 1), 0) == 3,
                                        Apply(Derivative(y, 2), 0) == 2,
                                      ], y, x2)), x)
  tex:
    in: \mathrm{DifferentialRootReduce}(x^2+3x+1, x)
    out: \mathrm{DifferentialRoot}((y, \mathrm{x2})\mapsto\begin{cases}y^{\tripleprime}(\mathrm{x2})=0\\y(0)=1\\y^{\prime}(0)=3\\y^{\doubleprime}(0)=2\end{cases})\lhd x
  fullform:
    in: DifferentialRootReduce[Plus[Power[x, 2], Times[3, x], 1], x]
  wolfram:
    in: DifferentialRootReduce[Plus[Power[x, 2], Times[3, x], 1], x]
    out: DifferentialRoot[Function[{\[FormalY], \[FormalX]}, {(-3 - 2*\[FormalX])*\[FormalY][\[FormalX]] + (1 + 3*\[FormalX] + \[FormalX]^2)*Derivative[1][\[FormalY]][\[FormalX]] == 0, \[FormalY][0] == 1}]][x]
    tex:
      in: \text{DifferentialRootReduce}\left[x^2+3 x+1,x\right]
      out: (x)
    verdict: inconclusive
    kind: unevaluated
    note: Wolfram's own DifferentialRoot object represents the ODE rather than a closed form; FullSimplify can't algebraically compare it against our closed-form answer.
