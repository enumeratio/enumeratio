a-two-term-sum-declines:
  epsil:
    in: DifferentialRootReduce(Exp(x) + Sin(x), x)
    out: DifferentialRootReduce(Exp(x) + Sin(x), x)
  tex:
    in: \mathrm{DifferentialRootReduce}(e^{x}+\sin(x), x)
    out: \mathrm{DifferentialRootReduce}(e^{x}+\sin(x), x)
  fullform:
    in: DifferentialRootReduce[Plus[Exp[x], Sin[x]], x]
  wolfram:
    in: DifferentialRootReduce[Plus[Exp[x], Sin[x]], x]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{DifferentialRootReduce}[\exp (x)+\sin (x),x]-\text{DifferentialRootReduce}[\exp (x)+\sin (x),x]],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{DifferentialRootReduce}\left[\exp \left(\frac{7}{3}\right)+\sin \left(\frac{7}{3}\right),\frac{7}{3}\right]-\text{DifferentialRootReduce}\left[\exp \left(\frac{7}{3}\right)+\sin \left(\frac{7}{3}\right),\frac{7}{3}\right]\right]\right],\text{Chop}\left[N\left[\text{DifferentialRootReduce}\left[\exp \left(-\frac{11}{5}\right)+\sin \left(-\frac{11}{5}\right),-\frac{11}{5}\right]-\text{DifferentialRootReduce}\left[\exp \left(-\frac{11}{5}\right)+\sin \left(-\frac{11}{5}\right),-\frac{11}{5}\right]\right]\right],\text{Chop}\left[N\left[\text{DifferentialRootReduce}\left[\exp \left(\frac{13}{4}\right)+\sin \left(\frac{13}{4}\right),\frac{13}{4}\right]-\text{DifferentialRootReduce}\left[\exp \left(\frac{13}{4}\right)+\sin \left(\frac{13}{4}\right),\frac{13}{4}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
