exponential-order-1:
  epsil:
    in: DifferentialRootReduce(Exp(a * x), x)
    out: |-
      Apply(DifferentialRoot(Function([
                                        -(a * y(x2)) + Apply(Derivative(y, 1), x2) ==
                                        0,
                                        y(0) == 1,
                                      ], y, x2)), x)
  tex:
    in: \mathrm{DifferentialRootReduce}(\exp(ax), x)
    out: \mathrm{DifferentialRoot}((y, \mathrm{x2})\mapsto\begin{cases}y^{\prime}(\mathrm{x2})-ay(\mathrm{x2})=0\\y(0)=1\end{cases})\lhd x
  fullform:
    in: DifferentialRootReduce[Exp[Times[a, x]], x]
  wolfram:
    in: DifferentialRootReduce[Exp[Times[a, x]], x]
    out: DifferentialRoot[Function[{\[FormalY], \[FormalX]}, {-(a*\[FormalY][\[FormalX]]) + Derivative[1][\[FormalY]][\[FormalX]] == 0, \[FormalY][0] == 1}]][x]
    tex:
      in: \text{DifferentialRootReduce}[\exp (a x),x]
      out: (x)
    verdict: inconclusive
    kind: unevaluated
    note: Wolfram's own DifferentialRoot object represents the ODE rather than a closed form; FullSimplify can't algebraically compare it against our closed-form answer.
