name: HeavisideTheta
domain: Elementary functions
signature: HeavisideTheta(x1, x2, …)
summary: "The Heaviside step function: 0 for x < 0, 1 for x > 0, unevaluated at x = 0."
signatures:
  - call: HeavisideTheta(x)
    description: 0 if x < 0, 1 if x > 0, and unevaluated (stays symbolic) at x = 0.
    library: "@enumeratio/analytic"
  - call: HeavisideTheta(x1, x2, …)
    description: the product of the individual steps -- 0 as soon as any argument is negative, unevaluated if none is negative but at least one is exactly 0.
    library: "@enumeratio/analytic"
    arity: 2
details:
  - "Deliberately distinct from compute-engine's own native `Heaviside`, which this package does not touch: `Heaviside(0)` evaluates to 0 there, not Wolfram's convention. `HeavisideTheta` is a separate head so both conventions stay available."
  - Also distinct from [[UnitStep]] (declared in unit-step.ts), which takes the value 1 at exactly 0 rather than staying unevaluated.
  - D(HeavisideTheta(x), x) = DiracDelta(x).
examples:
  - id: heavisidetheta-negative
    expr: [HeavisideTheta, -1]
    expected: 0
  - id: heavisidetheta-positive
    expr: [HeavisideTheta, 1]
    expected: 1
  - id: heavisidetheta-zero-unevaluated
    expr: [HeavisideTheta, 0]
    expected: [HeavisideTheta, 0]
    caption: Unevaluated at exactly 0 -- unlike [[UnitStep]]
  - id: heavisidetheta-product-both-positive
    expr: [HeavisideTheta, 1, 2]
    expected: 1
    category: Scope
    caption: "Several arguments: the product of their steps"
  - id: heavisidetheta-product-one-negative
    expr: [HeavisideTheta, 1, -1]
    expected: 0
    category: Scope
    caption: Zero as soon as any argument is negative
  - id: heavisidetheta-derivative
    expr: [D, [HeavisideTheta, x], x]
    expected: [DiracDelta, x]
    category: Properties
    caption: Derivative is [[DiracDelta]]
