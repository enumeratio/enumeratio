tan-0:
  wolfram:
    in: Tan[0]
    out: "0"
    tex:
      in: \tan (0)
      out: "0"
  sage:
    in: tan(0)
    out: "0"
  rust:
    in: tan(n(0))
    out: "0.0"
  mpmath:
    in: tan(0)
    out: "0.0"
  sympy:
    in: tan(0)
    out: "0"
tan-pi-over-6:
  wolfram:
    in: Tan[Divide[Pi, 6]]
    out: 1/Sqrt[3]
    tex:
      in: \tan \left(\frac{\pi }{6}\right)
      out: \frac{1}{\sqrt{3}}
  sage:
    in: tan((pi / 6))
    out: 1/3*sqrt(3)
  rust:
    in: tan((x(std::f64::consts::PI) / n(6)))
    out: "0.5773502691896257"
  sympy:
    in: tan((S(pi) / 6))
    out: sqrt(3)/3
