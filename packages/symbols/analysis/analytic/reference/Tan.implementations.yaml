tan-x-frac-sin-x-cos-x:
  wolfram:
    in: (Tan[Divide[Pi, 4]] == Divide[Sin[Divide[Pi, 4]], Cos[Divide[Pi, 4]]])
    out: True
    tex:
      in: \tan \left(\frac{\pi }{4}\right)=\frac{\sin \left(\frac{\pi }{4}\right)}{\cos \left(\frac{\pi }{4}\right)}
      out: \text{True}
  sage:
    in: bool(tan((pi / 4)) == (sin((pi / 4)) / cos((pi / 4))))
    out: True
  rust:
    in: equal(tan((x(std::f64::consts::PI) / n(4))), (sin((x(std::f64::consts::PI) / n(4))) / cos((x(std::f64::consts::PI) / n(4)))))
    out: "true"
  sympy:
    in: enumeratio_equal(tan((S(pi) / 4)), (S(sin((S(pi) / 4))) / cos((S(pi) / 4))))
    out: True
odd-function-tan-x-tan-x:
  wolfram:
    in: Tan[Minus[Divide[Pi, 4]]]
    out: "-1"
    tex:
      in: \tan \left(-\frac{\pi }{4}\right)
      out: "-1"
  sage:
    in: tan((-(pi / 4)))
    out: "-1"
  rust:
    in: tan((-((x(std::f64::consts::PI) / n(4)))))
    out: "-0.9999999999999999"
  sympy:
    in: tan((-(S(pi) / 4)))
    out: "-1"
period-pi-not-2-pi-adding-a-half-turn-doesn-t:
  wolfram:
    in: Tan[Plus[Divide[Pi, 4], Pi]]
    out: "1"
    tex:
      in: \tan \left(\frac{\pi }{4}+\pi \right)
      out: "1"
  sage:
    in: tan(((pi / 4) + pi))
    out: "1"
  rust:
    in: tan(((x(std::f64::consts::PI) / n(4)) + x(std::f64::consts::PI)))
    out: "0.9999999999999997"
  sympy:
    in: tan(((S(pi) / 4) + pi))
    out: "1"
threads-element-wise-over-a-list:
  wolfram:
    in: Tan[List[0, Divide[Pi, 4]]]
    out: "{0, 1}"
    tex:
      in: \tan \left(\left\{0,\frac{\pi }{4}\right\}\right)
      out: \{0,1\}
  sage:
    in: tan([0, (pi / 4)])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Tan is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: tan(list(vec![n(0), (x(std::f64::consts::PI) / n(4))]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Tan is Listable and threads over the list; the Rust crates take scalars.
  sympy:
    in: "[tan(0), tan((S(pi) / 4))]"
    out: "[0, 1]"
a-pole-cos-pi-2-0-so-the-ratio-blows-up:
  wolfram:
    in: Tan[Divide[Pi, 2]]
    out: ComplexInfinity
    tex:
      in: \tan \left(\frac{\pi }{2}\right)
      out: \text{ComplexInfinity}
  sage:
    in: tan((pi / 2))
    out: Infinity
    verdict: disagree
    kind: undefined-form
    note: The pole at cos(pi/2)=0 is ComplexInfinity here; Sage spells the same pole 'Infinity' (unsigned), a different notation for the same undefined ratio.
  rust:
    in: tan((x(std::f64::consts::PI) / n(2)))
    out: "1.633123935319537e16"
    verdict: inconclusive
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity", and Rust gives 1.633123935319537e16.'
  sympy:
    in: tan((S(pi) / 2))
    out: zoo
