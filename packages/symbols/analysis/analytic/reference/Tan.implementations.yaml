tan-x-frac-sin-x-cos-x:
  epsil:
    in: Tan(Pi / 4) == Sin(Pi / 4) / Cos(Pi / 4)
    out: True
  tex:
    in: \tan(\frac{\pi}{4})=\frac{\sin(\frac{\pi}{4})}{\cos(\frac{\pi}{4})}
    out: \top
  traditional:
    in: \tan(\frac{\pi}{4})=\frac{\sin(\frac{\pi}{4})}{\cos(\frac{\pi}{4})}
    out: \mathrm{True}
  fullform:
    in: Equal[Tan[Divide[Pi, 4]], Divide[Sin[Divide[Pi, 4]], Cos[Divide[Pi, 4]]]]
  wolfram:
    in: (Tan[Divide[Pi, 4]] == Divide[Sin[Divide[Pi, 4]], Cos[Divide[Pi, 4]]])
    out: True
    tex:
      in: \tan \left(\frac{\pi }{4}\right)=\frac{\sin \left(\frac{\pi }{4}\right)}{\cos \left(\frac{\pi }{4}\right)}
      out: \text{True}
  sage:
    in: bool(tan((pi / 4)) == (sin((pi / 4)) / cos((pi / 4))))
    out: True
  sympy:
    in: enumeratio_equal(tan((S(pi) / 4)), (S(sin((S(pi) / 4))) / cos((S(pi) / 4))))
    out: True
  rust:
    in: equal(tan((x(std::f64::consts::PI) / n(4))), (sin((x(std::f64::consts::PI) / n(4))) / cos((x(std::f64::consts::PI) / n(4)))))
    out: "true"
