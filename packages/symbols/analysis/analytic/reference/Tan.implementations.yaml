threads-element-wise-over-a-list:
  epsil:
    in: Tan([0, Pi / 4])
    out: "[0, 1]"
  tex:
    in: \tan(\bigl\lbrack0, \frac{\pi}{4}\bigr\rbrack)
    out: \bigl\lbrack0, 1\bigr\rbrack
  fullform:
    in: Tan[List[0, Divide[Pi, 4]]]
  wolfram:
    in: Tan[List[0, Divide[Pi, 4]]]
    out: "{0, 1}"
    tex:
      in: \tan \left(\left\{0,\frac{\pi }{4}\right\}\right)
      out: \{0,1\}
  sage:
    in: "[tan(0), tan((pi / 4))]"
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Tan is Listable and threads over the list; Sage's takes scalars only.
  sympy:
    in: "[tan(0), tan((S(pi) / 4))]"
    out: "[0, 1]"
  rust:
    in: tan(list(vec![n(0), (x(std::f64::consts::PI) / n(4))]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Tan is Listable and threads over the list; the Rust crates take scalars.
a-pole-cos-pi-2-0-so-the-ratio-blows-up:
  epsil:
    in: Tan(Pi / 2)
    out: ComplexInfinity
  tex:
    in: \tan(\frac{\pi}{2})
    out: \tilde\infty
  fullform:
    in: Tan[Divide[Pi, 2]]
  wolfram:
    in: Tan[Divide[Pi, 2]]
    out: ComplexInfinity
    tex:
      in: \tan \left(\frac{\pi }{2}\right)
      out: \text{ComplexInfinity}
  sage:
    in: tan((pi / 2))
    out: Infinity
    verdict: disagree
    kind: undefined-form
    note: The pole at cos(pi/2)=0 is ComplexInfinity here; Sage spells the same pole 'Infinity' (unsigned), a different notation for the same undefined ratio.
  sympy:
    in: tan((S(pi) / 2))
    out: zoo
  rust:
    in: tan((x(std::f64::consts::PI) / n(2)))
    out: "1.633123935319537e16"
    verdict: inconclusive
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity", and Rust gives 1.633123935319537e16.'
