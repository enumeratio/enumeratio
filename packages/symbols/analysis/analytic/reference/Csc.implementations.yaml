threads-element-wise-over-a-matrix-with:
  epsil:
    in: Csc([[Pi / 3, Pi], [Pi / 6, -(Pi / 2)]])
    out: "[[2 / 3 * Sqrt(3), ComplexInfinity], [2, -1]]"
  tex:
    in: \csc(\bigl\lbrack\bigl\lbrack\frac{\pi}{3}, \pi\bigr\rbrack, \bigl\lbrack\frac{\pi}{6}, -\pi/2\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\frac{2\sqrt{3}}{3}, \tilde\infty\bigr\rbrack, \bigl\lbrack2, -1\bigr\rbrack\bigr\rbrack
  wolfram:
    in: Csc[List[List[Divide[Pi, 3], Pi], List[Divide[Pi, 6], Minus[Divide[Pi, 2]]]]]
