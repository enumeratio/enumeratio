reciprocal-of-sin-csc-x-frac-1-sin-x:
  epsil:
    in: Csc(Pi / 6) == 1 / Sin(Pi / 6)
    out: True
  tex:
    in: \csc(\frac{\pi}{6})=\frac{1}{\sin(\frac{\pi}{6})}
    out: \top
  traditional:
    in: \csc(\frac{\pi}{6})=\frac{1}{\sin(\frac{\pi}{6})}
    out: \mathrm{True}
  wolfram:
    in: (Csc[Divide[Pi, 6]] == Divide[1, Sin[Divide[Pi, 6]]])
    back: Unreadable
    out: True
    tex:
      in: \csc \left(\frac{\pi }{6}\right)=\frac{1}{\sin \left(\frac{\pi }{6}\right)}
      out: \text{True}
a-pole-sin-0-0:
  epsil:
    in: Csc(0)
    out: ComplexInfinity
  tex:
    in: \csc(0)
    out: \tilde\infty
  wolfram:
    in: Csc[0]
    out: ComplexInfinity
    tex:
      in: \csc (0)
      out: \text{ComplexInfinity}
csc-60-circ-frac-2-sqrt-3-3-exactly:
  epsil:
    in: Csc(Degrees(60))
    out: 2 / 3 * Sqrt(3)
  tex:
    in: \csc(60^{\circ})
    out: \frac{2\sqrt{3}}{3}
  wolfram:
    in: Csc[Times[60, Degree]]
    back: [Csc, [Multiply, 60, Degree]]
