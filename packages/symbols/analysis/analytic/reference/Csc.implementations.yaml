oddness-pulls-the-sign-out-of-a-symbolic:
  epsil:
    in: Csc(-x)
    out: -Csc(x)
  tex:
    in: \csc(-x)
    out: -\csc(x)
derivative-csc-x-cot-x:
  epsil:
    in: D(Csc(x), x)
    out: -(Csc(x) * Cot(x))
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\csc(x)
    out: -(\csc(x)\cot(x))
antiderivative-ln-csc-x-cot-x:
  epsil:
    in: Integrate(Csc(x), x)
    out: -Ln(Abs(Csc(x) + Cot(x)))
  tex:
    in: \int\!\csc(x)\, \mathrm{d}x
    out: -\ln(\vert\csc(x)+\cot(x)\vert)
