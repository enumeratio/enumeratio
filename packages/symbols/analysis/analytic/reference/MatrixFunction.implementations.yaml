the-principal-square-root-of-a-diagonal-matrix:
  epsil:
    in: MatrixFunction(Sqrt, [[4, 0], [0, 9]])
    out: "[[2, 0], [0, 3]]"
  tex:
    in: \mathrm{MatrixFunction}(\mathrm{Sqrt}, \bigl\lbrack\bigl\lbrack4, 0\bigr\rbrack, \bigl\lbrack0, 9\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack2, 0\bigr\rbrack, \bigl\lbrack0, 3\bigr\rbrack\bigr\rbrack
  fullform:
    in: MatrixFunction[Sqrt, List[List[4, 0], List[0, 9]]]
  wolfram:
    in: MatrixFunction[Sqrt, List[List[4, 0], List[0, 9]]]
on-a-diagonal-matrix-f-acts-on-the-diagonal:
  epsil:
    in: MatrixFunction(f, [[a, 0], [0, b]])
    out: "[[f(a), 0], [0, f(b)]]"
  tex:
    in: \mathrm{MatrixFunction}(f, \bigl\lbrack\bigl\lbrack a, 0\bigr\rbrack, \bigl\lbrack0, b\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack f(a), 0\bigr\rbrack, \bigl\lbrack0, f(b)\bigr\rbrack\bigr\rbrack
  fullform:
    in: MatrixFunction[f, List[List[a, 0], List[0, b]]]
with-exp-it-is-matrixexp:
