heavisidetheta-negative:
  epsil:
    in: HeavisideTheta(-1)
    out: "0"
  tex:
    in: \mathrm{HeavisideTheta}(-1)
    out: "0"
  fullform:
    in: HeavisideTheta[-1]
  wolfram:
    in: HeavisideTheta[-1]
heavisidetheta-positive:
  epsil:
    in: HeavisideTheta(1)
    out: "1"
  tex:
    in: \mathrm{HeavisideTheta}(1)
    out: "1"
  fullform:
    in: HeavisideTheta[1]
  wolfram:
    in: HeavisideTheta[1]
heavisidetheta-zero-unevaluated:
  epsil:
    in: HeavisideTheta(0)
    out: HeavisideTheta(0)
  tex:
    in: \mathrm{HeavisideTheta}(0)
    out: \mathrm{HeavisideTheta}(0)
  fullform:
    in: HeavisideTheta[0]
  wolfram:
    in: HeavisideTheta[0]
heavisidetheta-product-both-positive:
  epsil:
    in: HeavisideTheta(1, 2)
    out: "1"
  tex:
    in: \mathrm{HeavisideTheta}(1, 2)
    out: "1"
  fullform:
    in: HeavisideTheta[1, 2]
  wolfram:
    in: HeavisideTheta[1, 2]
heavisidetheta-product-one-negative:
  epsil:
    in: HeavisideTheta(1, -1)
    out: "0"
  tex:
    in: \mathrm{HeavisideTheta}(1, -1)
    out: "0"
  fullform:
    in: HeavisideTheta[1, -1]
  wolfram:
    in: HeavisideTheta[1, -1]
heavisidetheta-derivative:
  epsil:
    in: D(HeavisideTheta(x), x)
    out: DiracDelta(x)
  tex:
    in: \frac{\mathrm{d}\mathrm{HeavisideTheta}(x)}{\mathrm{d}x}
    out: \mathrm{DiracDelta}(x)
  fullform:
    in: D[HeavisideTheta[x], x]
  wolfram:
    in: D[HeavisideTheta[x], x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\frac{\partial \theta (x)}{\partial x}-\delta (x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\frac{\partial }{\partial \frac{7}{3}}\theta \left(\frac{7}{3}\right)-\delta \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\frac{\partial }{\partial -\frac{11}{5}}\theta \left(-\frac{11}{5}\right)-\delta \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\frac{\partial }{\partial \frac{13}{4}}\theta \left(\frac{13}{4}\right)-\delta \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
