arctan-0:
  epsil:
    in: Arctan(0)
    out: "0"
  tex:
    in: \arctan(0)
    out: "0"
  fullform:
    in: ArcTan[0]
  wolfram:
    in: ArcTan[0]
    out: "0"
    tex:
      in: \tan ^{-1}(0)
      out: "0"
arctan-1:
  epsil:
    in: Arctan(1)
    out: 1 / 4 * Pi
  tex:
    in: \arctan(1)
    out: \frac{\pi}{4}
  fullform:
    in: ArcTan[1]
  wolfram:
    in: ArcTan[1]
    out: Pi/4
    tex:
      in: \tan ^{-1}(1)
      out: \frac{\pi }{4}
arctan-sqrt-3:
  epsil:
    in: Arctan(Sqrt(3))
    out: 1 / 3 * Pi
  tex:
    in: \arctan(\sqrt{3})
    out: \frac{\pi}{3}
  fullform:
    in: ArcTan[Sqrt[3]]
  wolfram:
    in: ArcTan[Sqrt[3]]
    out: Pi/3
    tex:
      in: \tan ^{-1}\left(\sqrt{3}\right)
      out: \frac{\pi }{3}
tan-arctan-x-x:
  epsil:
    in: Tan(Arctan(1)) == 1
    out: True
  tex:
    in: \tan(\arctan(1))=1
    out: \top
  traditional:
    in: \tan(\arctan(1))=1
    out: \mathrm{True}
  fullform:
    in: Equal[Tan[ArcTan[1]], 1]
  wolfram:
    in: (Tan[ArcTan[1]] == 1)
    out: True
    tex:
      in: \tan \left(\tan ^{-1}(1)\right)=1
      out: \text{True}
the-horizontal-asymptote-as-x-to-infty:
  epsil:
    in: Arctan(PositiveInfinity)
    out: 1 / 2 * Pi
  tex:
    in: \arctan(\infty)
    out: \frac{\pi}{2}
  fullform:
    in: ArcTan[Infinity]
  wolfram:
    in: ArcTan[Infinity]
    out: Pi/2
    tex:
      in: \tan ^{-1}(\infty )
      out: \frac{\pi }{2}
and-as-x-to-infty:
  epsil:
    in: Arctan(NegativeInfinity)
    out: -1 / 2 * Pi
  tex:
    in: \arctan(-\infty)
    out: -\frac{\pi}{2}
  fullform:
    in: ArcTan[-Infinity]
  wolfram:
    in: ArcTan[-Infinity]
    out: -1/2*Pi
    tex:
      in: \tan ^{-1}(-\infty )
      out: -\frac{\pi }{2}
compute-engine-s-arctan-takes-only-one-argument:
  epsil:
    in: Arctan(1, 1)
    out: Error("unexpected-argument", "1", ErrorTrace(ErrorFrame("Arctan", 2)))
  tex:
    in: \arctan(1, 1)
    out: '{\text{1}}'
  fullform:
    in: ArcTan[1, 1]
  wolfram:
    in: ArcTan[1, 1]
    out: Pi/4
    tex:
      in: \tan ^{-1}(1,1)
      out: \frac{\pi }{4}
    verdict: disagree
    kind: domain
    note: compute-engine's Arctan takes one argument and rejects a second; Wolfram's ArcTan[x, y] is the two-argument arctangent (atan2), here π/4.
a-machine-precision-argument-evaluates:
  epsil:
    in: Arctan(0.5)
    out: 0.463_647_609_000_806_116_214
  tex:
    in: \arctan(0.5)
    out: 0.463\,647\,609\,000\,806\,116\,214
  fullform:
    in: ArcTan[0.5]
  wolfram:
    in: ArcTan[0.5]
arbitrary-precision-via-n:
  epsil:
    in: N(Arctan(1 / 2))
    out: 0.463_647_609_000_806_116_214
  tex:
    in: N(\arctan(\frac{1}{2}))
    out: 0.463\,647\,609\,000\,806\,116\,214
  fullform:
    in: N[ArcTan[Rational[1, 2]]]
  wolfram:
    in: N[ArcTan[Rational[1, 2]]]
evaluates-at-a-complex-argument:
  epsil:
    in: Arctan(2.5 + i)
    out: 1.233_425_855_683_120_4 + 0.123_674_060_459_026_79i
  tex:
    in: \arctan(2.5+i)
    out: 1.233\,425\,855\,683\,120\,4+0.123\,674\,060\,459\,026\,79i
  fullform:
    in: ArcTan[Complex[2.5, 1]]
  wolfram:
    in: ArcTan[Complex[2.5, 1]]
wolfram-s-two-argument-arctan-x-y-is-compute:
  epsil:
    in: Arctan2(-1, -1)
    out: -3 / 4 * Pi
  tex:
    in: \arctan(-1, -1)
    out: -\frac{3\pi}{4}
  fullform:
    in: Arctan2[-1, -1]
arctan2-takes-y-first-the-angle-of-the-point-0-5:
  epsil:
    in: Arctan2(2, 0.5)
    out: 1.325_817_663_668_032_465_06
  tex:
    in: \arctan(2, 0.5)
    out: 1.325\,817\,663\,668\,032\,465\,06
  fullform:
    in: Arctan2[2, 0.5]
arctan-2-sqrt-3-5-pi-12:
  epsil:
    in: Arctan(2 + Sqrt(3))
    out: 5 / 12 * Pi
  tex:
    in: \arctan(2+\sqrt{3})
    out: \frac{5\pi}{12}
  fullform:
    in: ArcTan[Plus[2, Sqrt[3]]]
  wolfram:
    in: ArcTan[Plus[2, Sqrt[3]]]
arctan-2-sqrt-3-pi-12:
  epsil:
    in: Arctan(2 - Sqrt(3))
    out: 1 / 12 * Pi
  tex:
    in: \arctan(2-\sqrt{3})
    out: \frac{\pi}{12}
  fullform:
    in: ArcTan[Subtract[2, Sqrt[3]]]
  wolfram:
    in: ArcTan[Subtract[2, Sqrt[3]]]
arctan-sqrt-2-1-pi-8:
  epsil:
    in: Arctan(Sqrt(2) - 1)
    out: 1 / 8 * Pi
  tex:
    in: \arctan(\sqrt{2}-1)
    out: \frac{\pi}{8}
  fullform:
    in: ArcTan[Subtract[Sqrt[2], 1]]
  wolfram:
    in: ArcTan[Subtract[Sqrt[2], 1]]
arctan-1-over-sqrt-3:
  epsil:
    in: Arctan(1 / Sqrt(3))
    out: 1 / 6 * Pi
  tex:
    in: \arctan(\frac{1}{\sqrt{3}})
    out: \frac{\pi}{6}
  fullform:
    in: ArcTan[Divide[1, Sqrt[3]]]
  wolfram:
    in: ArcTan[Divide[1, Sqrt[3]]]
