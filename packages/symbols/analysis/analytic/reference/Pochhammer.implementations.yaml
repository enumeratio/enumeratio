a-symbolic-base-with-integer-order-expands-to:
  epsil:
    in: Pochhammer(n, 5)
    out: n * (n + 1) * (n + 2) * (n + 3) * (n + 4)
  tex:
    in: \mathrm{Pochhammer}(n, 5)
    out: n\times(n+1)(n+2)(n+3)(n+4)
  traditional:
    in: \left(n\right)_{5}
    out: n\times(n+1)(n+2)(n+3)(n+4)
  wolfram:
    in:
    note: Wolfram keeps Pochhammer[n, 5] unexpanded until FunctionExpand.
