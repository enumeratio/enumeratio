interval-arithmetic-arcsin-frac-13-frac-12:
  epsil:
    in: Arcsin(Interval(-1 / 3, 1 / 2))
    out: Interval(Arcsin(-1 / 3), 1 / 6 * Pi)
  tex:
    in: \arcsin(\mathrm{Interval}(-\frac{1}{3}, \frac{1}{2}))
    out: \mathrm{Interval}(\arcsin(-\frac{1}{3}), \frac{\pi}{6})
  fullform:
    in: ArcSin[Interval[List[Rational[-1, 3], Rational[1, 2]]]]
  wolfram:
    in: ArcSin[Interval[List[Rational[-1, 3], Rational[1, 2]]]]
    note: Wolfram folds the odd argument to $-\arcsin(1/3)$; compute-engine leaves $\arcsin(-1/3)$ as is (oddness normalisation is a separate, still-aspirational rule).
uncertainty-propagation-arcsin-0-9-pm-0-1-approx:
  epsil:
    in: Arcsin(Around(0.9, 0.1))
    out: Around(1.119_769_514_998_634_2, 0.229_415_733_870_561_8)
  tex:
    in: \arcsin(\mathrm{Around}(0.9, 0.1))
    out: \mathrm{Around}(1.119\,769\,514\,998\,634\,2, 0.229\,415\,733\,870\,561\,8)
  fullform:
    in: ArcSin[Around[0.9, 0.1]]
  wolfram:
    in: ArcSin[Around[0.9, 0.1]]
oddness-pulls-the-sign-out-of-a-symbolic:
  epsil:
    in: Arcsin(-x)
    out: -Arcsin(x)
  tex:
    in: \arcsin(-x)
    out: -\arcsin(x)
  fullform:
    in: ArcSin[Minus[x]]
derivative-frac-1-sqrt-1-x-2:
  epsil:
    in: D(Arcsin(x), x)
    out: 1 / Sqrt(-x ^ 2 + 1)
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\arcsin(x)
    out: \frac{1}{\sqrt{1-x^2}}
  fullform:
    in: D[ArcSin[x], x]
antiderivative:
  epsil:
    in: Integrate(Arcsin(x), x)
    out: x * Arcsin(x) + Sqrt(-x ^ 2 + 1)
  tex:
    in: \int\!\arcsin(x)\, \mathrm{d}x
    out: x\arcsin(x)+\sqrt{1-x^2}
  fullform:
    in: Integrate[ArcSin[x], x]
taylor-series-about-0:
  epsil:
    in: Series(Arcsin(x), x, 0, 5)
    out: 3 / 40 * x ^ 5 + 1 / 6 * x ^ 3 + x + BigO(x ^ 7)
  tex:
    in: \operatorname{Series}(\arcsin(x), x, 0, 5)
    out: x+\frac{x^3}{6}+\frac{3x^5}{40}+O\left(x^7\right)
  fullform:
    in: Series[ArcSin[x], x, 0, 5]
  wolfram:
    in:
    note: Wolfram's Series[ArcSin[x], {x, 0, 5}] ends with O[x]^6; compute-engine skips the vanishing even term and reports O(x^7).
as-a-logarithm-arcsin-x-i-ln-ix-sqrt-1-x-2:
  epsil:
    in: TrigToExp(Arcsin(x))
    out: -1 * i * Ln(i * x + Sqrt(-x ^ 2 + 1))
  tex:
    in: \mathrm{TrigToExp}(\arcsin(x))
    out: -i\ln(i x+\sqrt{1-x^2})
  fullform:
    in: TrigToExp[ArcSin[x]]
not-simply-2-2-is-outside-the-principal-range-pi:
