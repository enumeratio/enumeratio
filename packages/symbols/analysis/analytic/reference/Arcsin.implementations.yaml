threads-element-wise-over-a-matrix:
  epsil:
    in: Arcsin([[1, 1 / Sqrt(2)], [0, 1 / Sqrt(2)]])
    out: "[[1 / 2 * Pi, 1 / 4 * Pi], [0, 1 / 4 * Pi]]"
  tex:
    in: \arcsin(\bigl\lbrack\bigl\lbrack1, \frac{1}{2^{1/2}}\bigr\rbrack, \bigl\lbrack0, \frac{1}{2^{1/2}}\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\frac{\pi}{2}, \frac{\pi}{4}\bigr\rbrack, \bigl\lbrack0, \frac{\pi}{4}\bigr\rbrack\bigr\rbrack
  fullform:
    in: ArcSin[List[List[1, Divide[1, Sqrt[2]]], List[0, Divide[1, Sqrt[2]]]]]
  wolfram:
    in: ArcSin[List[List[1, Divide[1, Sqrt[2]]], List[0, Divide[1, Sqrt[2]]]]]
