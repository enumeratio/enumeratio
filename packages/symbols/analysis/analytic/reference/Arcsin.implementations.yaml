arcsin-0:
  epsil:
    in: Arcsin(0)
    out: "0"
  tex:
    in: \arcsin(0)
    out: "0"
  fullform:
    in: ArcSin[0]
  wolfram:
    in: ArcSin[0]
    out: "0"
    tex:
      in: \sin ^{-1}(0)
      out: "0"
arcsin-1-over-2:
  epsil:
    in: Arcsin(1 / 2)
    out: 1 / 6 * Pi
  tex:
    in: \arcsin(\frac{1}{2})
    out: \frac{\pi}{6}
  fullform:
    in: ArcSin[Rational[1, 2]]
  wolfram:
    in: ArcSin[Rational[1, 2]]
    out: Pi/6
    tex:
      in: \sin ^{-1}\left(\frac{1}{2}\right)
      out: \frac{\pi }{6}
the-top-of-the-principal-range:
  epsil:
    in: Arcsin(1)
    out: 1 / 2 * Pi
  tex:
    in: \arcsin(1)
    out: \frac{\pi}{2}
  fullform:
    in: ArcSin[1]
  wolfram:
    in: ArcSin[1]
    out: Pi/2
    tex:
      in: \sin ^{-1}(1)
      out: \frac{\pi }{2}
arcsin-neg-1:
  epsil:
    in: Arcsin(-1)
    out: -1 / 2 * Pi
  tex:
    in: \arcsin(-1)
    out: -\frac{\pi}{2}
  fullform:
    in: ArcSin[-1]
  wolfram:
    in: ArcSin[-1]
    out: -1/2*Pi
    tex:
      in: \sin ^{-1}(-1)
      out: -\frac{\pi }{2}
sin-arcsin-x-x-on-the-principal-branch:
  epsil:
    in: Sin(Arcsin(1 / 2)) == 1 / 2
    out: True
  tex:
    in: \sin(\arcsin(\frac{1}{2}))=\frac{1}{2}
    out: \top
  traditional:
    in: \sin(\arcsin(\frac{1}{2}))=\frac{1}{2}
    out: \mathrm{True}
  fullform:
    in: Equal[Sin[ArcSin[Rational[1, 2]]], Rational[1, 2]]
  wolfram:
    in: (Sin[ArcSin[Rational[1, 2]]] == Rational[1, 2])
    out: True
    tex:
      in: \sin \left(\sin ^{-1}\left(\frac{1}{2}\right)\right)=\frac{1}{2}
      out: \text{True}
co-function-identity-arcsin-x-arccos-x-pi-2:
  epsil:
    in: Arcsin(1 / 2) + Arccos(1 / 2) == Pi / 2
    out: True
  tex:
    in: \arcsin(\frac{1}{2})+\arccos(\frac{1}{2})=\frac{\pi}{2}
    out: \top
  traditional:
    in: \arcsin(\frac{1}{2})+\arccos(\frac{1}{2})=\frac{\pi}{2}
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[ArcSin[Rational[1, 2]], ArcCos[Rational[1, 2]]], Divide[Pi, 2]]
  wolfram:
    in: (Plus[ArcSin[Rational[1, 2]], ArcCos[Rational[1, 2]]] == Divide[Pi, 2])
    out: True
    tex:
      in: \sin ^{-1}\left(\frac{1}{2}\right)+\cos ^{-1}\left(\frac{1}{2}\right)=\frac{\pi }{2}
      out: \text{True}
outside-1-1-reduces-to-the-exact-closed-form:
  epsil:
    in: Arcsin(2)
    out: 1 / 2 * Pi + -1 * i * Ln(2 + Sqrt(3))
  tex:
    in: \arcsin(2)
    out: \frac{\pi}{2}-i\ln(2+\sqrt{3})
  fullform:
    in: ArcSin[2]
  wolfram:
    in: ArcSin[2]
    out: ArcSin[2]
    tex:
      in: \sin ^{-1}(2)
      out: \sin ^{-1}(2)
    note: Wolfram leaves ArcSin[2] unevaluated; its N[ArcSin[2]] is the same principal value, 1.5708 - 1.31696 I, since ArcSin[z] = -I Log[I z + Sqrt[1 - z^2]].
