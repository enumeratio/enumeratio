- id: the-cubic
  expr: [ChebyshevT, 3, x]
  expected: [Add, [Multiply, 4, [Power, x, 3]], [Multiply, -3, x]]
  caption: $T_3(x) = 4x^3 - 3x$
- id: the-quartic
  expr: [ChebyshevT, 4, x]
  expected: [Add, [Multiply, 8, [Power, x, 4]], [Multiply, -8, [Power, x, 2]], 1]
  caption: $T_4(x) = 8x^4 - 8x^2 + 1$
- id: at-an-integer
  expr: [ChebyshevT, 5, 2]
  expected: 362
  caption: At an integer the value is exact
- id: at-a-real
  expr: [ChebyshevT, 5, 0.7]
  expected: -0.6708799999999998
  caption: At a floating-point $x$
- id: at-a-rational
  expr: [ChebyshevT, 5, [Rational, 1, 3]]
  expected: [Rational, 241, 243]
  category: Scope
  caption: At a rational $x$ the value is an exact rational
- id: at-a-complex-argument
  expr: [ChebyshevT, 4, [Complex, 2, 3]]
  expected: [Complex, -911, -1056]
  category: Scope
  caption: At a Gaussian integer
- id: a-symbolic-order-stays-unevaluated
  expr: [ChebyshevT, n, x]
  expected: [ChebyshevT, n, x]
  category: Scope
  caption: A symbolic order stays unevaluated
- id: cos-n-theta
  expr: [Equal, [ChebyshevT, 6, [Rational, 1, 2]], [Cos, [Multiply, 6, [Divide, Pi, 3]]]]
  expected: True
  category: Properties
  caption: $T_n(\cos\theta) = \cos(n\theta)$, here at $\theta = \pi/3$
- id: at-1
  expr: [ChebyshevT, 7, 1]
  expected: 1
  category: Properties
  caption: $T_n(1) = 1$
- id: at-minus-1
  expr: [ChebyshevT, 7, -1]
  expected: -1
  category: Properties
  caption: $T_n(-1) = (-1)^n$
- id: parity
  expr: [Equal, [ChebyshevT, 5, [Rational, -1, 3]], [Negate, [ChebyshevT, 5, [Rational, 1, 3]]]]
  expected: True
  category: Properties
  caption: "Odd degree, odd function: $T_n(-x) = (-1)^n T_n(x)$"
- id: negative-order
  expr: [ChebyshevT, -3, x]
  expected: [Add, [Multiply, 4, [Power, x, 3]], [Multiply, -3, x]]
  category: Properties
  caption: "A negative order folds: $T_{-n} = T_n$"
- id: pell-identity
  expr: [Subtract, [Power, [ChebyshevT, 4, 3], 2], [Multiply, 8, [Power, [ChebyshevU, 3, 3], 2]]]
  expected: 1
  category: Properties
  caption: $T_n(x)^2 - (x^2 - 1)\,U_{n-1}(x)^2 = 1$, here at $x = 3$. See [[ChebyshevU]]
- id: at-t0-0-7
  expr: [N, [ChebyshevT, 0, 0.7]]
  expected: 1
  role: test
- id: at-t1-0-7
  expr: [N, [ChebyshevT, 1, 0.7]]
  expected: 0.7
  role: test
- id: at-t2-0-7
  expr: [N, [ChebyshevT, 2, 0.7]]
  expected: -0.02000000000000013
  role: test
- id: at-t5-0-7
  expr: [N, [ChebyshevT, 5, 0.7]]
  expected: -0.6708799999999998
  role: test
- id: at-t5-2
  expr: [N, [ChebyshevT, 5, 2]]
  expected: 362
  role: test
- id: at-t-5-0-7
  expr: [N, [ChebyshevT, -5, 0.7]]
  expected: -0.6708799999999998
  role: test
- id: at-t4-2-3i
  expr: [N, [ChebyshevT, 4, [Complex, 2, 3]]]
  expected: [Complex, -911, -1056]
  role: test
