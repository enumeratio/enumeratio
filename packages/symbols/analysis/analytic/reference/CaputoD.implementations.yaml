power-x2-alpha-half:
  epsil:
    in: CaputoD(x ^ 2, [x, 0.5])
    out: 1.504_505_556_127_350_098_532 * x ^ 1.5
  tex:
    in: \mathrm{CaputoD}(x^2, \bigl\lbrack x, 0.5\bigr\rbrack)
    out: 1.504\,505\,556\,127\,350\,098\,53x^{1.5}
  fullform:
    in: CaputoD[Power[x, 2], List[x, 0.5]]
  wolfram:
    in: CaputoD[Power[x, 2], List[x, 0.5]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{CaputoD}\left[x^2,\{x,0.5\}\right]-1.50450555612735009853 x^{1.5}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{CaputoD}\left[\left(\frac{7}{3}\right)^2,\left\{\frac{7}{3},0.5\right\}\right]-1.50450555612735009853 \left(\frac{7}{3}\right)^{1.5}\right]\right],\text{Chop}\left[N\left[\text{CaputoD}\left[\left(-\frac{11}{5}\right)^2,\left\{-\frac{11}{5},0.5\right\}\right]-1.50450555612735009853 \left(-\frac{11}{5}\right)^{1.5}\right]\right],\text{Chop}\left[N\left[\text{CaputoD}\left[\left(\frac{13}{4}\right)^2,\left\{\frac{13}{4},0.5\right\}\right]-1.50450555612735009853 \left(\frac{13}{4}\right)^{1.5}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: domain
    note: Same as the other CaputoD example — Wolfram has no native fractional Caputo derivative, so FullSimplify can't reduce the difference and a numeric substitution still leaves CaputoD[...] symbolic.
constant-vanishes:
