exact-order-x-half:
  epsil:
    in: CaputoD(x, [x, 1 / 2])
    out: 2 * Sqrt(x) / Sqrt(Pi)
  tex:
    in: \mathrm{CaputoD}(x, \bigl\lbrack x, \frac{1}{2}\bigr\rbrack)
    out: \frac{2\sqrt{x}}{\sqrt{\pi}}
  fullform:
    in: CaputoD[x, List[x, Rational[1, 2]]]
  wolfram:
    in: CaputoD[x, List[x, Rational[1, 2]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{CaputoD}\left[x,\left\{x,\frac{1}{2}\right\}\right]-\frac{2 \sqrt{x}}{\sqrt{\pi }}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{CaputoD}\left[\frac{7}{3},\left\{\frac{7}{3},\frac{1}{2}\right\}\right]-\frac{2 \sqrt{\frac{7}{3}}}{\sqrt{\pi }}\right]\right],\text{Chop}\left[N\left[\text{CaputoD}\left[-\frac{11}{5},\left\{-\frac{11}{5},\frac{1}{2}\right\}\right]-\frac{2 \sqrt{-\frac{11}{5}}}{\sqrt{\pi }}\right]\right],\text{Chop}\left[N\left[\text{CaputoD}\left[\frac{13}{4},\left\{\frac{13}{4},\frac{1}{2}\right\}\right]-\frac{2 \sqrt{\frac{13}{4}}}{\sqrt{\pi }}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
