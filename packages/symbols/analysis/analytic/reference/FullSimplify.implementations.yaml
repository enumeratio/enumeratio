the-pythagorean-identity:
  epsil:
    in: FullSimplify(Sin(x) ^ 2 + Cos(x) ^ 2)
    out: "1"
  tex:
    in: \mathrm{FullSimplify}(\sin(x)^2+\cos(x)^2)
    out: "1"
  fullform:
    in: FullSimplify[Plus[Power[Sin[x], 2], Power[Cos[x], 2]]]
  wolfram:
    in: FullSimplify[Plus[Power[Sin[x], 2], Power[Cos[x], 2]]]
    out: "1"
    tex:
      in: \text{FullSimplify}\left[\sin ^2(x)+\cos ^2(x)\right]
      out: "1"
recognizes-the-definition-of-sinh:
  epsil:
    in: FullSimplify((Exp(x) - Exp(-x)) / 2)
    out: Sinh(x)
  tex:
    in: \mathrm{FullSimplify}(\frac{1}{2}(e^{x}-\exp(-x)))
    out: \sinh(x)
  fullform:
    in: FullSimplify[Divide[Subtract[Exp[x], Exp[Minus[x]]], 2]]
  wolfram:
    in: FullSimplify[Divide[Subtract[Exp[x], Exp[Minus[x]]], 2]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FullSimplify}\left[\frac{\exp (x)-\exp (-x)}{2}\right]-\sinh (x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FullSimplify}\left[\frac{\exp \left(\frac{7}{3}\right)-\exp \left(-\frac{7}{3}\right)}{2}\right]-\sinh \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{FullSimplify}\left[\frac{\exp \left(-\frac{11}{5}\right)-\exp \left(-\left(-\frac{11}{5}\right)\right)}{2}\right]-\sinh \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{FullSimplify}\left[\frac{\exp \left(\frac{13}{4}\right)-\exp \left(-\frac{13}{4}\right)}{2}\right]-\sinh \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
folds-the-double-angle-product:
  epsil:
    in: FullSimplify(2 * Sin(x) * Cos(x))
    out: Sin(2x)
  tex:
    in: \mathrm{FullSimplify}(2\sin(x)\cos(x))
    out: \sin(2x)
  fullform:
    in: FullSimplify[Times[2, Sin[x], Cos[x]]]
  wolfram:
    in: FullSimplify[Times[2, Sin[x], Cos[x]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{FullSimplify}[2 \sin (x) \cos (x)]-\sin (2 x)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FullSimplify}\left[2 \sin \left(\frac{7}{3}\right) \cos \left(\frac{7}{3}\right)\right]-\sin \left(2 \frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{FullSimplify}\left[2 \sin \left(-\frac{11}{5}\right) \cos \left(-\frac{11}{5}\right)\right]-\sin \left(2 \left(-\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{FullSimplify}\left[2 \sin \left(\frac{13}{4}\right) \cos \left(\frac{13}{4}\right)\right]-\sin \left(2 \frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
the-functional-equation-of-gamma:
  epsil:
    in: FullSimplify(Gamma(x + 1) / Gamma(x))
    out: x
  tex:
    in: \mathrm{FullSimplify}(\frac{\Gamma(x+1)}{\Gamma(x)})
    out: x
  fullform:
    in: FullSimplify[Divide[Gamma[Plus[x, 1]], Gamma[x]]]
  wolfram:
    in: FullSimplify[Divide[Gamma[Plus[x, 1]], Gamma[x]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FullSimplify}\left[\frac{\Gamma (x+1)}{\Gamma (x)}\right]-x\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FullSimplify}\left[\frac{\Gamma \left(\frac{7}{3}+1\right)}{\Gamma \left(\frac{7}{3}\right)}\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{FullSimplify}\left[\frac{\Gamma \left(-\frac{11}{5}+1\right)}{\Gamma \left(-\frac{11}{5}\right)}\right]--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{FullSimplify}\left[\frac{\Gamma \left(\frac{13}{4}+1\right)}{\Gamma \left(\frac{13}{4}\right)}\right]-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
denests-sqrt-5-2-sqrt-6-sqrt-2-sqrt-3:
  epsil:
    in: FullSimplify(Sqrt(2) + Sqrt(3) - Sqrt(5 + 2 * Sqrt(6)))
    out: "0"
  tex:
    in: \mathrm{FullSimplify}((\sqrt{2}+\sqrt{3})-\sqrt{5+2\sqrt{6}})
    out: "0"
  fullform:
    in: FullSimplify[Subtract[Plus[Sqrt[2], Sqrt[3]], Sqrt[Plus[5, Times[2, Sqrt[6]]]]]]
  wolfram:
    in: FullSimplify[Subtract[Plus[Sqrt[2], Sqrt[3]], Sqrt[Plus[5, Times[2, Sqrt[6]]]]]]
the-hyperbolic-pythagorean-identity:
  epsil:
    in: FullSimplify(Cosh(x) ^ 2 - Sinh(x) ^ 2)
    out: "1"
  tex:
    in: \mathrm{FullSimplify}(\cosh(x)^2-\sinh(x)^2)
    out: "1"
  fullform:
    in: FullSimplify[Subtract[Power[Cosh[x], 2], Power[Sinh[x], 2]]]
  wolfram:
    in: FullSimplify[Subtract[Power[Cosh[x], 2], Power[Sinh[x], 2]]]
    out: "1"
    tex:
      in: \text{FullSimplify}\left[\cosh ^2(x)-\sinh ^2(x)\right]
      out: "1"
