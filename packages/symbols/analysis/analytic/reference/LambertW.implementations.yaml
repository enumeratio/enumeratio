lambertw-0:
  epsil:
    in: LambertW(0)
    out: "0"
  tex:
    in: \operatorname{W}(0)
    out: "0"
  fullform:
    in: ProductLog[0]
    back: [ProductLog, 0]
  wolfram:
    in: ProductLog[0]
1-cdot-e-1-e:
  epsil:
    in: LambertW(ExponentialE)
    out: "1"
  tex:
    in: \operatorname{W}(e)
    out: "1"
  fullform:
    in: ProductLog[E]
    back: [ProductLog, ExponentialE]
  wolfram:
    in: ProductLog[E]
the-branch-point-1-e:
  epsil:
    in: LambertW(-(1 / ExponentialE))
    out: "-1"
  tex:
    in: \operatorname{W}(-\frac{1}{e})
    out: "-1"
  fullform:
    in: ProductLog[Minus[Divide[1, E]]]
    back: [ProductLog, [Negate, [Divide, 1, ExponentialE]]]
  wolfram:
    in: ProductLog[Minus[Divide[1, E]]]
2e-2-w-e-w-at-w-2:
  epsil:
    in: LambertW(2 * ExponentialE ^ 2)
    out: "2"
  tex:
    in: \operatorname{W}(2e^{2})
    out: "2"
  fullform:
    in: ProductLog[Times[2, Power[E, 2]]]
    back: [ProductLog, [Multiply, 2, [Power, ExponentialE, 2]]]
  wolfram:
    in: ProductLog[Times[2, Power[E, 2]]]
ln-2-cdot-e-ln-2-frac-ln-2-2:
  epsil:
    in: LambertW(-(Ln(2) / 2))
    out: -Ln(2)
  tex:
    in: \operatorname{W}(-\frac{\ln(2)}{2})
    out: -\ln(2)
  fullform:
    in: ProductLog[Minus[Divide[Log[2], 2]]]
    back: [ProductLog, [Negate, [Divide, [Ln, 2], 2]]]
  wolfram:
    in: ProductLog[Minus[Divide[Log[2], 2]]]
