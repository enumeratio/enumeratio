threads-elementwise-over-an-array-infty-at-the:
  epsil:
    in: LogBarnesG([[4, -1], [0, 3]])
    out: "[[Ln(2), NegativeInfinity], [NegativeInfinity, 0]]"
  tex:
    in: \mathrm{LogBarnesG}(\bigl\lbrack\bigl\lbrack4, -1\bigr\rbrack, \bigl\lbrack0, 3\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\ln(2), -\infty\bigr\rbrack, \bigl\lbrack-\infty, 0\bigr\rbrack\bigr\rbrack
  fullform:
    in: LogBarnesG[List[List[4, -1], List[0, 3]]]
  wolfram:
    in: LogBarnesG[List[List[4, -1], List[0, 3]]]
exact-at-the-integers-ln-g-10-ln:
  epsil:
    in: LogBarnesG(10)
    out: 2 * Ln(14) + 3 * Ln(10) + 9 * Ln(3) + 18 * Ln(2) + Ln(5)
  tex:
    in: \mathrm{LogBarnesG}(10)
    out: 2\ln(14)+3\ln(10)+9\ln(3)+18\ln(2)+\ln(5)
  traditional:
    in: \log G(10)
    out: 2\ln(14)+3\ln(10)+9\ln(3)+18\ln(2)+\ln(5)
  fullform:
    in: LogBarnesG[10]
  wolfram:
    in: LogBarnesG[10]
    note: Wolfram keeps a single logarithm, Log[5056584744960000].
