    in: LogBarnesG(4)
    out: Ln(2)
  tex:
    in: \mathrm{LogBarnesG}(4)
    out: \ln(2)
  traditional:
    in: \log G(4)
    out: \ln(2)
  fullform:
    in: LogBarnesG[4]
