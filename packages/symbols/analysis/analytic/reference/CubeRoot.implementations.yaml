the-cube-root-of-a-perfect-cube:
  epsil:
    in: CubeRoot(8)
    out: "2"
  tex:
    in: \mathrm{CubeRoot}(8)
    out: "2"
  fullform:
    in: CubeRoot[8]
  wolfram:
    in: CubeRoot[8]
the-real-root-of-a-negative-number-not-a-complex:
  epsil:
    in: CubeRoot(-27)
    out: "-3"
  tex:
    in: \mathrm{CubeRoot}(-27)
    out: "-3"
  fullform:
    in: CubeRoot[-27]
  wolfram:
    in: CubeRoot[-27]
at-a-non-perfect-cube-n-forces-the-numeric:
  epsil:
    in: N(CubeRoot(2))
    out: 1.259_921_049_894_873_2
  tex:
    in: N(\mathrm{CubeRoot}(2))
    out: 1.259\,921\,049\,894\,873\,2
  fullform:
    in: N[CubeRoot[2]]
  wolfram:
    in: N[CubeRoot[2]]
threads-element-wise-over-a-list:
  epsil:
    in: CubeRoot([-8, 27])
    out: "[-2, 3]"
  tex:
    in: \mathrm{CubeRoot}(\bigl\lbrack-8, 27\bigr\rbrack)
    out: \bigl\lbrack-2, 3\bigr\rbrack
  fullform:
    in: CubeRoot[List[-8, 27]]
  wolfram:
    in: CubeRoot[List[-8, 27]]
the-same-as-root-with-index-3:
  epsil:
    in: CubeRoot(-64) == Root(-64, 3)
    out: True
  tex:
    in: \mathrm{CubeRoot}(-64)=\sqrt[3]{-64}
    out: \top
  traditional:
    in: \mathrm{CubeRoot}(-64)=\sqrt[3]{-64}
    out: \mathrm{True}
  fullform:
    in: Equal[CubeRoot[-64], Power[-64, Divide[1, 3]]]
    back: [Equal, [CubeRoot, -64], [Power, -64, [Divide, 1, 3]]]
  wolfram:
    in: (CubeRoot[-64] == Power[-64, Divide[1, 3]])
