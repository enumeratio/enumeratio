name: Pochhammer
domain: Combinatorics
signature: Pochhammer(a, n)
summary: The rising factorial (a)_n = a(a+1)(a+2)…(a+n−1).
signatures:
  - call: Pochhammer(a, n)
    description: the rising factorial $(a)_n$.
details:
  - 'Closed form via the Gamma function: $(a)_n = \frac{\Gamma(a+n)}{\Gamma(a)}$.'
  - $(1)_n = n!$, since the rising factorial from 1 just counts up to n.
  - 'Negative order gives the falling reciprocal: $(a)_{-n} = \frac{1}{(a-1)(a-2)\cdots(a-n)}$.'
  - 'Dividing by $k!$ counts multisets: $\binom{n+k-1}{k} = \frac{(n)_k}{k!}$.'
  - If a is a non-positive integer with $|a| < n$, the product picks up a zero factor and vanishes.
  - A building block of hypergeometric series, where it appears in both numerator and denominator terms.
examples:
  - id: 5-6-7
    expr: [Pochhammer, 5, 3]
    expected: 210
    caption: 5 × 6 × 7
  - id: an-empty-product-is-1
    expr: [Pochhammer, 2, 0]
    expected: 1
    caption: An empty product is 1
  - id: 1-5-equals-5
    expr: [Pochhammer, 1, 5]
    expected: 120
    caption: (1)_5 equals 5!
  - id: pochhammer-3-4
    expr: [Pochhammer, 3, 4]
    expected: 360
  - id: 1-n-n-since-the-rising-factorial-from-1-just
    expr: [Equal, [Pochhammer, 1, 5], [Factorial, 5]]
    expected: True
    category: Properties
    caption: $(1)_n = n!$, since the rising factorial from 1 just counts up to n
  - id: negative-order-gives-the-reciprocal-a-n-frac-1-a
    expr: [Pochhammer, 5, -2]
    expected: [Rational, 1, 12]
    category: Properties
    caption: 'Negative order gives the reciprocal: $(a)_{-n} = \frac{1}{(a-1)(a-2)\cdots(a-n)}$, so $(5)_{-2} = \frac{1}{4\cdot3}$'
  - id: dividing-by-k-counts-multisets-binom-n-k-1-k
    expr: [Divide, [Pochhammer, 5, 3], [Factorial, 3]]
    expected: 35
    category: Applications
    caption: 'Dividing by $k!$ counts multisets: $\binom{n+k-1}{k} = \frac{(n)_k}{k!}$, here choosing 3 items from 5 types with repetition'
  - id: if-a-is-a-non-positive-integer-with-a-n-the
    expr: [Pochhammer, -3, 4]
    expected: 0
    category: Possible issues
    caption: "If a is a non-positive integer with $|a| < n$, the product picks up a zero factor: $(-3)(-2)(-1)(0)$"
  - id: threads-element-wise-over-a-list-as-wolfram-s
    expr: [Pochhammer, [List, 2, 3, 4], 2]
    expected: [List, 6, 12, 20]
    category: Scope
    caption: Threads element-wise over a list, as Wolfram's Listable heads do
  - id: 10-11-12-13-14-15
    expr: [Pochhammer, 10, 6]
    expected: 3603600
    caption: 10 × 11 × 12 × 13 × 14 × 15
  - id: a-symbolic-base-with-integer-order-expands-to
    expr: [Pochhammer, n, 5]
    expected: [Multiply, n, [Add, n, 1], [Add, n, 2], [Add, n, 3], [Add, n, 4]]
    category: Scope
    caption: A symbolic base with integer order expands to the product
    divergence:
      wolfram: Wolfram keeps Pochhammer[n, 5] unexpanded until FunctionExpand.
  - id: a-negative-order-expands-to-the-reciprocal
    expr: [Pochhammer, n, -5]
    expected:
      [Divide, 1, [Multiply, [Add, n, -1], [Add, n, -2], [Add, n, -3], [Add, n, -4], [Add, n, -5]]]
    category: Scope
    caption: A negative order expands to the reciprocal falling product
    divergence:
      wolfram: Wolfram keeps Pochhammer[n, -5] unexpanded until FunctionExpand.
  - id: real-base-and-order-evaluate-as-frac-gamma-a-n
    expr: [Pochhammer, 2.4, 8.5]
    expected: { num: "2310224.67324070778057" }
    category: Scope
    caption: Real base and order evaluate as $\frac{\Gamma(a+n)}{\Gamma(a)}$
  - id: a-zero-base-gives-0-for-any-positive-order
    expr: [Pochhammer, 0, 1285]
    expected: 0
    category: Scope
    caption: A zero base gives 0 for any positive order
  - id: a-rational-base-frac-12-cdot-frac-32-cdot-frac
    expr: [Pochhammer, [Rational, 1, 2], 3]
    expected: [Rational, 15, 8]
    category: Scope
    caption: 'A rational base: $\frac12 \cdot \frac32 \cdot \frac52$'
  - id: a-rational-order-evaluates-through-gamma-exactly
    expr: [Pochhammer, [Rational, 3, 2], [Rational, 1, 2]]
    expected: [Divide, 2, [Sqrt, Pi]]
    category: Scope
    caption: 'A rational order evaluates through Gamma, exactly: $\left(\frac32\right)_{1/2} = \frac{\Gamma(2)}{\Gamma(3/2)} = \frac{2}{\sqrt\pi}$'
  - id: complex-base-and-order-evaluate-through-gamma
    expr: [Pochhammer, [Complex, 2, 5], [Complex, 0, 8]]
    expected: [Complex, 0.0000021386822918680963, -0.000014218737711709974]
    category: Scope
    caption: Complex base and order evaluate through Gamma
  - id: order-0-is-the-empty-product-a-0-1
    expr: [Pochhammer, a, 0]
    expected: 1
    category: Properties
    caption: "Order 0 is the empty product: $(a)_0 = 1$"
  - id: a-1-a
    expr: [Pochhammer, a, 1]
    expected: a
    category: Properties
    caption: $(a)_1 = a$
  - id: the-gamma-form-a-n-frac-gamma-a-n-gamma-a-see
    expr: [Equal, [Pochhammer, 4, 3], [Divide, [Gamma, 7], [Gamma, 4]]]
    expected: True
    category: Properties
    caption: The Gamma form $(a)_n = \frac{\Gamma(a+n)}{\Gamma(a)}$. See [[Gamma]]
  - id: rising-and-falling-factorials-x-underline-n-1-n
    expr: [Equal, [FallingFactorial, 5, 3], [Multiply, -1, [Pochhammer, -5, 3]]]
    expected: True
    category: Properties
    caption: 'Rising and falling factorials: $x^{\underline{n}} = (-1)^n\,(-x)_n$'
seeAlso:
  - Factorial
  - Binomial
