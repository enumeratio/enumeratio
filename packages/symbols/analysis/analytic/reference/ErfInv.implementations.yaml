    in: InverseErf[0]
    out: "0"
    tex:
      in: \text{erf}^{-1}(0)
      out: "0"
erfinv-1:
  wolfram:
    in: InverseErf[1]
    out: Infinity
    tex:
      in: \text{erf}^{-1}(1)
      out: \infty
erfinv-neg-1:
  wolfram:
    in: InverseErf[-1]
    out: -Infinity
