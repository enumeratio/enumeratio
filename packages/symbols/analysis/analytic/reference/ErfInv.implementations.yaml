inverse-of-erf-erf-erfinv-x-x-see-erf:
  epsil:
    in: Erf(ErfInv(0.5)) == 0.5
    out: True
  tex:
    in: \operatorname{erf}(\mathrm{ErfInv}(0.5))=0.5
    out: \top
  traditional:
    in: \operatorname{erf}(\operatorname{erf}^{-1}(0.5))=0.5
    out: \mathrm{True}
  fullform:
    in: Equal[Erf[InverseErf[0.5]], 0.5]
  wolfram:
    in: (Erf[InverseErf[0.5]] == 0.5)
    out: True
    tex:
      in: \text{erf}\left(\text{erf}^{-1}(0.5)\right)=0.5
      out: \text{True}
