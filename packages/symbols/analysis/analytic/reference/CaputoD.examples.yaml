- id: power-x2-alpha-half
  expr: [CaputoD, [Power, x, 2], [List, x, 0.5]]
  expected: [Multiply, { num: "1.504505556127350098532" }, [Power, x, 1.5]]
  caption: $D^{0.5}_C\{x^2\} = \frac{\Gamma(3)}{\Gamma(2.5)}x^{1.5}$
- id: constant-vanishes
  expr: [CaputoD, 5, [List, x, 0.5]]
  expected: 0
  caption: a constant's Caputo derivative is 0
- id: integer-edge-case-vanishes
  expr: [CaputoD, x, [List, x, 1.5]]
  expected: 0
  caption: $D^{1.5}_C\{x\} = 0$ — $\beta=1 < n=2$, the classical vanishing case (Wolfram's own `CaputoD` leaves this symbolic rather than reducing it, though it numerically evaluates to 0 — confirmed independently against `mpmath.quad`)
- id: polynomial-linearity
  expr: [CaputoD, [Add, [Power, x, 2], [Multiply, 3, x], 1], [List, x, 0.5]]
  expected:
    [
      Add,
      [Multiply, { num: "1.504505556127350098532" }, [Power, x, 1.5]],
      [Multiply, { num: "3.3851375012865377217" }, [Sqrt, x]],
    ]
  category: Scope
  caption: linearity — the constant term (1) drops out entirely
- id: exact-order-constant-half
  expr: [CaputoD, 5, [List, x, [Rational, 1, 2]]]
  expected: 0
  caption: a constant's Caputo derivative is 0, exact order $\alpha=1/2$
- id: exact-order-x-half
  expr: [CaputoD, x, [List, x, [Rational, 1, 2]]]
  expected: [Divide, [Multiply, 2, [Sqrt, x]], [Sqrt, Pi]]
  caption: $D^{1/2}_C\{x\} = \frac{2\sqrt{x}}{\sqrt{\pi}}$ — exact rational order stays exact
- id: exact-order-x-vanishes
  expr: [CaputoD, x, [List, x, [Rational, 3, 2]]]
  expected: 0
  caption: the exact-order analogue of `integer-edge-case-vanishes` — $\beta=1 < n=2$, still 0 (Wolfram leaves it symbolic)
- id: exact-order-power-x2-half
  expr: [CaputoD, [Power, x, 2], [List, x, [Rational, 1, 2]]]
  expected: [Divide, [Multiply, 8, [Power, x, [Rational, 3, 2]]], [Multiply, 3, [Sqrt, Pi]]]
  caption: $D^{1/2}_C\{x^2\} = \frac{8x^{3/2}}{3\sqrt{\pi}}$ — Wolfram's own `CaputoD[x^2, {x, 1/2}]`, exactly
- id: exact-order-power-x2-three-half
  expr: [CaputoD, [Power, x, 2], [List, x, [Rational, 3, 2]]]
  expected: [Divide, [Multiply, 4, [Sqrt, x]], [Sqrt, Pi]]
  caption: $D^{3/2}_C\{x^2\} = \frac{4\sqrt{x}}{\sqrt{\pi}}$ — past the vanishing boundary ($\beta=2 \not< n=2$)
- id: exact-order-power-x2-third
  expr: [CaputoD, [Power, x, 2], [List, x, [Rational, 1, 3]]]
  expected: [Divide, [Multiply, 2, [Power, x, [Rational, 5, 3]]], [Gamma, [Rational, 8, 3]]]
  caption: $D^{1/3}_C\{x^2\} = \frac{2x^{5/3}}{\Gamma(8/3)}$ — an order that doesn't halve the exponent
- id: exact-order-polynomial-half
  expr: [CaputoD, [Add, [Power, x, 2], [Multiply, 3, x], 1], [List, x, [Rational, 1, 2]]]
  expected:
    [
      Add,
      [Divide, [Multiply, 6, [Sqrt, x]], [Sqrt, Pi]],
      [Divide, [Multiply, 8, [Power, x, [Rational, 3, 2]]], [Multiply, 3, [Sqrt, Pi]]],
    ]
  category: Scope
  caption: linearity holds under an exact order too
