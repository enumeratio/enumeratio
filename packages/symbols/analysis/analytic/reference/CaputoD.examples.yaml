- id: power-x2-alpha-half
  expr: [CaputoD, [Power, x, 2], [List, x, 0.5]]
  expected: [Multiply, { num: "1.504505556127350098532" }, [Power, x, 1.5]]
  caption: $D^{0.5}_C\{x^2\} = \frac{\Gamma(3)}{\Gamma(2.5)}x^{1.5}$
- id: constant-vanishes
  expr: [CaputoD, 5, [List, x, 0.5]]
  expected: 0
  caption: a constant's Caputo derivative is 0
- id: integer-edge-case-vanishes
  expr: [CaputoD, x, [List, x, 1.5]]
  expected: 0
  caption: $D^{1.5}_C\{x\} = 0$ — $\beta=1 < n=2$, the classical vanishing case (Wolfram's own `CaputoD` leaves this symbolic rather than reducing it, though it numerically evaluates to 0 — confirmed independently against `mpmath.quad`)
- id: polynomial-linearity
  expr: [CaputoD, [Add, [Power, x, 2], [Multiply, 3, x], 1], [List, x, 0.5]]
  expected:
    [
      Add,
      [Multiply, { num: "1.504505556127350098532" }, [Power, x, 1.5]],
      [Multiply, { num: "3.3851375012865377217" }, [Sqrt, x]],
    ]
  category: Scope
  caption: linearity — the constant term (1) drops out entirely
