threads-element-wise-over-a-matrix:
  epsil:
    in: Cot([[5 * (Pi / 6), Pi / 2], [3 * (Pi / 2), -(Pi / 6)]])
    out: "[[-Sqrt(3), 0], [0, -Sqrt(3)]]"
  tex:
    in: \cot(\bigl\lbrack\bigl\lbrack\frac{5\pi}{6}, \frac{\pi}{2}\bigr\rbrack, \bigl\lbrack\frac{3\pi}{2}, -\pi/6\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack-\sqrt{3}, 0\bigr\rbrack, \bigl\lbrack0, -\sqrt{3}\bigr\rbrack\bigr\rbrack
  fullform:
    in: Cot[List[List[Times[5, Divide[Pi, 6]], Divide[Pi, 2]], List[Times[3, Divide[Pi, 2]], Minus[Divide[Pi, 6]]]]]
  wolfram:
    in: Cot[List[List[Times[5, Divide[Pi, 6]], Divide[Pi, 2]], List[Times[3, Divide[Pi, 2]], Minus[Divide[Pi, 6]]]]]
