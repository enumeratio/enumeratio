reciprocal-of-tan-cot-x-frac-1-tan-x:
  epsil:
    in: Cot(Pi / 4) == 1 / Tan(Pi / 4)
    out: True
  tex:
    in: \cot(\frac{\pi}{4})=\frac{1}{\tan(\frac{\pi}{4})}
    out: \top
  traditional:
    in: \cot(\frac{\pi}{4})=\frac{1}{\tan(\frac{\pi}{4})}
    out: \mathrm{True}
  fullform:
    in: Equal[Cot[Divide[Pi, 4]], Divide[1, Tan[Divide[Pi, 4]]]]
  wolfram:
    in: (Cot[Divide[Pi, 4]] == Divide[1, Tan[Divide[Pi, 4]]])
    out: True
    tex:
      in: \cot \left(\frac{\pi }{4}\right)=\frac{1}{\tan \left(\frac{\pi }{4}\right)}
      out: \text{True}
pythagorean-identity-1-cot-2-x-csc-2-x:
  epsil:
    in: 1 + Cot(Pi / 6) ^ 2 == Csc(Pi / 6) ^ 2
    out: True
  tex:
    in: 1+\cot(\pi/6)^2=\csc(\pi/6)^2
    out: \top
  traditional:
    in: 1+\cot(\pi/6)^2=\csc(\pi/6)^2
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[1, Power[Cot[Divide[Pi, 6]], 2]], Power[Csc[Divide[Pi, 6]], 2]]
  wolfram:
    in: (Plus[1, Power[Cot[Divide[Pi, 6]], 2]] == Power[Csc[Divide[Pi, 6]], 2])
    out: True
    tex:
      in: 1+\cot ^2\left(\frac{\pi }{6}\right)=\csc ^2\left(\frac{\pi }{6}\right)
      out: \text{True}
