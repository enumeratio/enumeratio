    in: Cot(Interval(-(Pi / 4), Pi / 4))
    out: Union(Interval(NegativeInfinity, -1), Interval(1, PositiveInfinity))
  tex:
    in: \cot(\mathrm{Interval}(-\frac{\pi}{4}, \frac{\pi}{4}))
    out: \lbrack-\infty, -1\rbrack\cup\lbrack1, \infty\rbrack
