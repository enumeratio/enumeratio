cot-pi-over-6:
  epsil:
    in: Cot(Pi / 6)
    out: Sqrt(3)
  tex:
    in: \cot(\frac{\pi}{6})
    out: \sqrt{3}
  fullform:
    in: Cot[Divide[Pi, 6]]
  wolfram:
    in: Cot[Divide[Pi, 6]]
    out: Sqrt[3]
    tex:
      in: \cot \left(\frac{\pi }{6}\right)
      out: \sqrt{3}
