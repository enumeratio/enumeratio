name: Ramp
domain: Elementary functions
signature: Ramp(x)
summary: "The ramp function: x for x >= 0, 0 for x < 0."
signatures:
  - call: Ramp(x)
    description: max(x, 0).
    library: "@enumeratio/analytic"
details:
  - Ramp(x) = x * UnitStep(x) -- continuous, so Ramp(0) = 0 needs no special case.
  - D(Ramp(x), x) = Piecewise({{0, x < 0}, {1, x > 0}}, Indeterminate) -- NOT [[UnitStep]](x), which would be defined (as 1) at x = 0; Ramp's own slope there is undefined.
