- id: symbolic-arguments-are-left-unevaluated-rather
  expr: [JacobiSN, u, m]
  expected: [JacobiSN, u, m]
  category: Possible issues
  caption: Symbolic arguments are left unevaluated rather than guessed at
- id: a-genuinely-complex-m-is-declined
  expr: [N, [JacobiSN, 0.3, [Complex, 0.5, 0.2]]]
  expected: [JacobiSN, 0.3, [Complex, 0.5, 0.2]]
  category: Possible issues
  caption: A genuinely complex m is declined — neither the AGM recursion nor its parameter transforms are verified there
