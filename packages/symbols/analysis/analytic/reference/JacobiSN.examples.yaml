- id: u-0-is-0-for-any-m
  expr: [JacobiSN, 0, m]
  expected: 0
  category: Properties
  caption: u = 0 is 0, for any m
- id: m-0-reduces-to-sin-u
  expr: [JacobiSN, u, 0]
