a-numeric-chain-that-holds:
  epsil:
    in: Inequality(0, LessEqual, 2, Less, 5)
    out: True
  tex:
    in: \mathrm{Inequality}(0, \mathrm{LessEqual}, 2, \mathrm{Less}, 5)
    out: \top
  traditional:
    in: \mathrm{Inequality}(0, \mathrm{LessEqual}, 2, \mathrm{Less}, 5)
    out: \mathrm{True}
  fullform:
    in: Inequality[0, LessEqual, 2, Less, 5]
  wolfram:
    in: Inequality[0, LessEqual, 2, Less, 5]
a-numeric-chain-that-fails:
  epsil:
    in: Inequality(0, LessEqual, 5, Less, 5)
    out: False
  tex:
    in: \mathrm{Inequality}(0, \mathrm{LessEqual}, 5, \mathrm{Less}, 5)
    out: \bot
  traditional:
    in: \mathrm{Inequality}(0, \mathrm{LessEqual}, 5, \mathrm{Less}, 5)
    out: \mathrm{False}
  fullform:
    in: Inequality[0, LessEqual, 5, Less, 5]
  wolfram:
    in: Inequality[0, LessEqual, 5, Less, 5]
a-symbolic-mixed-chain-partially-simplifies:
  epsil:
    in: Inequality(0, LessEqual, x, Less, 5)
    out: 0 <= x && x < 5
  tex:
    in: \mathrm{Inequality}(0, \mathrm{LessEqual}, x, \mathrm{Less}, 5)
    out: 0\le x\land x\lt5
  fullform:
    in: Inequality[0, LessEqual, x, Less, 5]
  wolfram:
    in: Inequality[0, LessEqual, x, Less, 5]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[(0\leq x<5)-(0\leq x\land x<5)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\left(0\leq \frac{7}{3}<5\right)-\left(0\leq \frac{7}{3}\land \frac{7}{3}<5\right)\right]\right],\text{Chop}\left[N\left[\left(0\leq -\frac{11}{5}<5\right)-\left(0\leq -\frac{11}{5}\land -\frac{11}{5}<5\right)\right]\right],\text{Chop}\left[N\left[\left(0\leq \frac{13}{4}<5\right)-\left(0\leq \frac{13}{4}\land \frac{13}{4}<5\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-three-link-chain:
  epsil:
    in: Inequality(1, Less, 2, LessEqual, 2, Less, 10)
    out: True
  tex:
    in: \mathrm{Inequality}(1, \mathrm{Less}, 2, \mathrm{LessEqual}, 2, \mathrm{Less}, 10)
    out: \top
  traditional:
    in: \mathrm{Inequality}(1, \mathrm{Less}, 2, \mathrm{LessEqual}, 2, \mathrm{Less}, 10)
    out: \mathrm{True}
  fullform:
    in: Inequality[1, Less, 2, LessEqual, 2, Less, 10]
  wolfram:
    in: Inequality[1, Less, 2, LessEqual, 2, Less, 10]
equal-and-notequal-are-valid-links-too:
  epsil:
    in: Inequality(0, Less, x, NotEqual, 3)
    out: 0 < x && x != 3
  tex:
    in: \mathrm{Inequality}(0, \mathrm{Less}, x, \mathrm{NotEqual}, 3)
    out: 0\lt x\land x\ne3
  fullform:
    in: Inequality[0, Less, x, Unequal, 3]
  wolfram:
    in: Inequality[0, Less, x, Unequal, 3]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[(0<x\neq 3)-(0<x\land x\neq 3)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\left(0<\frac{7}{3}\neq 3\right)-\left(0<\frac{7}{3}\land \frac{7}{3}\neq 3\right)\right]\right],\text{Chop}\left[N\left[\left(0<-\frac{11}{5}\neq 3\right)-\left(0<-\frac{11}{5}\land -\frac{11}{5}\neq 3\right)\right]\right],\text{Chop}\left[N\left[\left(0<\frac{13}{4}\neq 3\right)-\left(0<\frac{13}{4}\land \frac{13}{4}\neq 3\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-homogeneous-chain-still-goes-through-and:
  epsil:
    in: Inequality(0, Less, x, Less, 5)
    out: 0 < x && x < 5
  tex:
    in: \mathrm{Inequality}(0, \mathrm{Less}, x, \mathrm{Less}, 5)
