polynomials-are-entire:
  epsil:
    in: FunctionAnalytic(x ^ 2, x)
    out: True
  tex:
    in: \mathrm{FunctionAnalytic}(x^2, x)
    out: \top
  traditional:
    in: \mathrm{FunctionAnalytic}(x^2, x)
    out: \mathrm{True}
  fullform:
    in: FunctionAnalytic[Power[x, 2], x]
  wolfram:
    in: FunctionAnalytic[Power[x, 2], x]
    out: True
    tex:
      in: \text{FunctionAnalytic}\left[x^2,x\right]
      out: \text{True}
a-pole-anywhere-in-the-plane-disqualifies-it:
  epsil:
    in: FunctionAnalytic(1 / x, x)
    out: False
  tex:
    in: \mathrm{FunctionAnalytic}(\frac{1}{x}, x)
    out: \bot
  traditional:
    in: \mathrm{FunctionAnalytic}(\frac{1}{x}, x)
    out: \mathrm{False}
  fullform:
    in: FunctionAnalytic[Divide[1, x], x]
  wolfram:
    in: FunctionAnalytic[Divide[1, x], x]
    out: False
    tex:
      in: \text{FunctionAnalytic}\left[\frac{1}{x},x\right]
      out: \text{False}
sqrt-has-a-branch-point:
  epsil:
    in: FunctionAnalytic(Sqrt(x), x)
    out: False
  tex:
    in: \mathrm{FunctionAnalytic}(\sqrt{x}, x)
    out: \bot
  traditional:
    in: \mathrm{FunctionAnalytic}(\sqrt{x}, x)
    out: \mathrm{False}
  fullform:
    in: FunctionAnalytic[Sqrt[x], x]
  wolfram:
    in: FunctionAnalytic[Sqrt[x], x]
    out: False
    tex:
      in: \text{FunctionAnalytic}\left[\sqrt{x},x\right]
      out: \text{False}
sine-is-entire:
  epsil:
    in: FunctionAnalytic(Sin(x), x)
    out: True
  tex:
    in: \mathrm{FunctionAnalytic}(\sin(x), x)
    out: \top
  traditional:
    in: \mathrm{FunctionAnalytic}(\sin(x), x)
    out: \mathrm{True}
  fullform:
    in: FunctionAnalytic[Sin[x], x]
  wolfram:
    in: FunctionAnalytic[Sin[x], x]
    out: True
    tex:
      in: \text{FunctionAnalytic}[\sin (x),x]
      out: \text{True}
