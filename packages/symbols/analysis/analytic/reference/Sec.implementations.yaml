sec-0:
  wolfram:
    in: Sec[0]
    out: "1"
    tex:
      in: \sec (0)
      out: "1"
sec-pi-over-4:
  wolfram:
    in: Sec[Divide[Pi, 4]]
    out: Sqrt[2]
    tex:
      in: \sec \left(\frac{\pi }{4}\right)
      out: \sqrt{2}
sec-pi-over-3:
  wolfram:
    in: Sec[Divide[Pi, 3]]
    out: "2"
    tex:
      in: \sec \left(\frac{\pi }{3}\right)
      out: "2"
sec-pi:
  wolfram:
    in: Sec[Pi]
    out: "-1"
    tex:
      in: \sec (\pi )
      out: "-1"
reciprocal-of-cos-sec-x-frac-1-cos-x:
  wolfram:
    in: (Sec[Divide[Pi, 3]] == Divide[1, Cos[Divide[Pi, 3]]])
    out: True
    tex:
      in: \sec \left(\frac{\pi }{3}\right)=\frac{1}{\cos \left(\frac{\pi }{3}\right)}
      out: \text{True}
pythagorean-identity-1-tan-2-x-sec-2-x:
  wolfram:
    in: (Plus[1, Power[Tan[Divide[Pi, 6]], 2]] == Power[Sec[Divide[Pi, 6]], 2])
    out: True
    tex:
      in: 1+\tan ^2\left(\frac{\pi }{6}\right)=\sec ^2\left(\frac{\pi }{6}\right)
      out: \text{True}
a-pole-cos-pi-2-0:
  wolfram:
    in: Sec[Divide[Pi, 2]]
    out: ComplexInfinity
    tex:
      in: \sec \left(\frac{\pi }{2}\right)
      out: \text{ComplexInfinity}
