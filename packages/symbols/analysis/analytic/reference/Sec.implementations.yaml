  tex:
    in: \sec(\bigl\lbrack\bigl\lbrack\frac{5\pi}{6}, 0\bigr\rbrack, \bigl\lbrack\frac{\pi}{6}, -\pi/4\bigr\rbrack\bigr\rbrack)
