derivative-sec-x-tan-x:
  epsil:
    in: D(Sec(x), x)
    out: Tan(x) * Sec(x)
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\sec(x)
    out: \tan(x)\sec(x)
antiderivative-ln-sec-x-tan-x:
  epsil:
    in: Integrate(Sec(x), x)
    out: Ln(Abs(Tan(x) + Sec(x)))
  tex:
    in: \int\!\sec(x)\, \mathrm{d}x
    out: \ln(\vert\tan(x)+\sec(x)\vert)
