threads-element-wise-over-a-list:
  epsil:
    in: Sin([0, Pi / 2, Pi])
    out: "[0, 1, 0]"
  tex:
    in: \sin(\bigl\lbrack0, \frac{\pi}{2}, \pi\bigr\rbrack)
    out: \bigl\lbrack0, 1, 0\bigr\rbrack
  fullform:
    in: Sin[List[0, Divide[Pi, 2], Pi]]
  wolfram:
    in: Sin[List[0, Divide[Pi, 2], Pi]]
    out: "{0, 1, 0}"
    tex:
      in: \sin \left(\left\{0,\frac{\pi }{2},\pi \right\}\right)
      out: \{0,1,0\}
  sage:
    in: "[sin(0), sin((pi / 2)), sin(pi)]"
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Sin is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: sin(list(vec![n(0), (x(std::f64::consts::PI) / n(2)), x(std::f64::consts::PI)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Sin is Listable and threads over the list; the Rust crates take scalars.
  sympy:
    in: "[sin(0), sin((S(pi) / 2)), sin(pi)]"
    out: "[0, 1, 0]"
