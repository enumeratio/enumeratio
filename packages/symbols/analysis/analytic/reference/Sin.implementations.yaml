exact-value-at-a-special-angle:
  wolfram:
    in: Sin[Divide[Pi, 6]]
    out: 1/2
    tex:
      in: \sin \left(\frac{\pi }{6}\right)
      out: \frac{1}{2}
  sage:
    in: sin((pi / 6))
    out: 1/2
  rust:
    in: sin((x(std::f64::consts::PI) / n(6)))
    out: "0.49999999999999994"
  sympy:
    in: sin((S(pi) / 6))
    out: 1/2
