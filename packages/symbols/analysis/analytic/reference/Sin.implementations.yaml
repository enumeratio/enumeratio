pythagorean-identity-sin-2-x-cos-2-x-1-here-at-x:
  wolfram:
    in: Plus[Power[Sin[Divide[Pi, 6]], 2], Power[Cos[Divide[Pi, 6]], 2]]
    out: "1"
    tex:
      in: \sin ^2\left(\frac{\pi }{6}\right)+\cos ^2\left(\frac{\pi }{6}\right)
      out: "1"
  sage:
    in: ((sin((pi / 6))^2) + (cos((pi / 6))^2))
    out: "1"
  rust:
    in: (power(sin((x(std::f64::consts::PI) / n(6))), n(2)) + power(cos((x(std::f64::consts::PI) / n(6))), n(2)))
    out: "1.0"
  sympy:
    in: ((sin((S(pi) / 6))**2) + (cos((S(pi) / 6))**2))
    out: "1"
odd-function-sin-x-sin-x:
  wolfram:
    in: (Sin[Minus[Divide[Pi, 6]]] == Minus[Sin[Divide[Pi, 6]]])
    out: True
    tex:
      in: \sin \left(-\frac{\pi }{6}\right)=-\sin \left(\frac{\pi }{6}\right)
      out: \text{True}
  sage:
    in: bool(sin((-(pi / 6))) == (-sin((pi / 6))))
    out: True
  rust:
    in: equal(sin((-((x(std::f64::consts::PI) / n(6))))), (-(sin((x(std::f64::consts::PI) / n(6))))))
    out: "true"
  sympy:
    in: enumeratio_equal(sin((-(S(pi) / 6))), (-sin((S(pi) / 6))))
    out: True
period-2-pi-adding-a-full-turn-doesn-t-change:
  wolfram:
    in: Sin[Plus[Divide[Pi, 6], Times[2, Pi]]]
    out: 1/2
    tex:
      in: \sin \left(\frac{\pi }{6}+2 \pi \right)
      out: \frac{1}{2}
  sage:
    in: sin(((pi / 6) + (2 * pi)))
    out: 1/2
  rust:
    in: sin(((x(std::f64::consts::PI) / n(6)) + (n(2) * x(std::f64::consts::PI))))
    out: "0.5"
  sympy:
    in: sin(((S(pi) / 6) + (2 * pi)))
    out: 1/2
threads-element-wise-over-a-list:
  wolfram:
    in: Sin[List[0, Divide[Pi, 2], Pi]]
    out: "{0, 1, 0}"
    tex:
      in: \sin \left(\left\{0,\frac{\pi }{2},\pi \right\}\right)
      out: \{0,1,0\}
  sage:
    in: sin([0, (pi / 2), pi])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Sin is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: sin(list(vec![n(0), (x(std::f64::consts::PI) / n(2)), x(std::f64::consts::PI)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Sin is Listable and threads over the list; the Rust crates take scalars.
  sympy:
    in: sin([0, (S(pi) / 2), pi])
    out: "AttributeError: 'list' object has no attribute 'is_Number'"
    verdict: error
    kind: threading
    note: compute-engine's Sin threads over (or pools) the list; SymPy's takes scalars.
