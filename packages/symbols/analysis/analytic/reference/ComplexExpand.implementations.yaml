sin-x-iy-sin-x-cosh-y-i-cos-x-sinh-y:
  epsil:
    in: ComplexExpand(Sin(x + ImaginaryUnit * y))
    out: i * Cos(x) * Sinh(y) + Sin(x) * Cosh(y)
  tex:
    in: \mathrm{ComplexExpand}(\sin(x+i y))
    out: i\cos(x)\sinh(y)+\sin(x)\cosh(y)
  fullform:
    in: ComplexExpand[Sin[Plus[x, Times[I, y]]]]
  wolfram:
    in: ComplexExpand[Sin[Plus[x, Times[I, y]]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{ComplexExpand}[\sin (x+i y)]-(i \cos (x) \sinh (y)+\sin (x) \cosh (y))],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ComplexExpand}\left[\sin \left(\frac{7}{3}+i \left(-\frac{11}{5}\right)\right)\right]-\left(i \cos \left(\frac{7}{3}\right) \sinh \left(-\frac{11}{5}\right)+\sin \left(\frac{7}{3}\right) \cosh \left(-\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\sin \left(\frac{13}{4}+i \left(-\frac{17}{6}\right)\right)\right]-\left(i \cos \left(\frac{13}{4}\right) \sinh \left(-\frac{17}{6}\right)+\sin \left(\frac{13}{4}\right) \cosh \left(-\frac{17}{6}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\sin \left(\frac{19}{8}+i \left(-\frac{23}{9}\right)\right)\right]-\left(i \cos \left(\frac{19}{8}\right) \sinh \left(-\frac{23}{9}\right)+\sin \left(\frac{19}{8}\right) \cosh \left(-\frac{23}{9}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
polar-form-of-a-complex-exponential:
  epsil:
    in: ComplexExpand(Exp(x + ImaginaryUnit * y))
    out: i * Sin(y) * ExponentialE ^ x + Cos(y) * ExponentialE ^ x
  tex:
    in: \mathrm{ComplexExpand}(\exp(x+i y))
    out: i\sin(y)e^{x}+\cos(y)e^{x}
  fullform:
    in: ComplexExpand[Exp[Plus[x, Times[I, y]]]]
  wolfram:
    in: ComplexExpand[Exp[Plus[x, Times[I, y]]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{ComplexExpand}[\exp (x+i y)]-\left(i \sin (y) e^x+\cos (y) e^x\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ComplexExpand}\left[\exp \left(\frac{7}{3}+i \left(-\frac{11}{5}\right)\right)\right]-\left(i \sin \left(-\frac{11}{5}\right) e^{\frac{7}{3}}+\cos \left(-\frac{11}{5}\right) e^{\frac{7}{3}}\right)\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\exp \left(\frac{13}{4}+i \left(-\frac{17}{6}\right)\right)\right]-\left(i \sin \left(-\frac{17}{6}\right) e^{\frac{13}{4}}+\cos \left(-\frac{17}{6}\right) e^{\frac{13}{4}}\right)\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\exp \left(\frac{19}{8}+i \left(-\frac{23}{9}\right)\right)\right]-\left(i \sin \left(-\frac{23}{9}\right) e^{\frac{19}{8}}+\cos \left(-\frac{23}{9}\right) e^{\frac{19}{8}}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
complexexpand-x-plus-imaginaryunit-times-y-pow-2:
  epsil:
    in: ComplexExpand((x + ImaginaryUnit * y) ^ 2)
    out: x ^ 2 - y ^ 2 + 2i * x * y
  tex:
    in: \mathrm{ComplexExpand}((x+i y)^2)
    out: x^2-y^2+2i xy
  fullform:
    in: ComplexExpand[Power[Plus[x, Times[I, y]], 2]]
  wolfram:
    in: ComplexExpand[Power[Plus[x, Times[I, y]], 2]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{ComplexExpand}\left[(x+i y)^2\right]-\left(x^2-y^2+(2 i) x y\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ComplexExpand}\left[\left(\frac{7}{3}+i \left(-\frac{11}{5}\right)\right)^2\right]-\left(\left(\frac{7}{3}\right)^2-\left(-\frac{11}{5}\right)^2+(2 i) \frac{7}{3} \left(-\frac{11}{5}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\left(\frac{13}{4}+i \left(-\frac{17}{6}\right)\right)^2\right]-\left(\left(\frac{13}{4}\right)^2-\left(-\frac{17}{6}\right)^2+(2 i) \frac{13}{4} \left(-\frac{17}{6}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\left(\frac{19}{8}+i \left(-\frac{23}{9}\right)\right)^2\right]-\left(\left(\frac{19}{8}\right)^2-\left(-\frac{23}{9}\right)^2+(2 i) \frac{19}{8} \left(-\frac{23}{9}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
complexexpand-abs-x-plus-imaginaryunit-times-y:
  epsil:
    in: ComplexExpand(Abs(x + ImaginaryUnit * y))
    out: Sqrt(x ^ 2 + y ^ 2)
  tex:
    in: \mathrm{ComplexExpand}(\vert x+i y\vert)
    out: \sqrt{x^2+y^2}
  fullform:
    in: ComplexExpand[Abs[Plus[x, Times[I, y]]]]
  wolfram:
    in: ComplexExpand[Abs[Plus[x, Times[I, y]]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{ComplexExpand}[| x+i y| ]-\sqrt{x^2+y^2}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{ComplexExpand}\left[\left| \frac{7}{3}+i \left(-\frac{11}{5}\right)\right| \right]-\sqrt{\left(\frac{7}{3}\right)^2+\left(-\frac{11}{5}\right)^2}\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\left| \frac{13}{4}+i \left(-\frac{17}{6}\right)\right| \right]-\sqrt{\left(\frac{13}{4}\right)^2+\left(-\frac{17}{6}\right)^2}\right]\right],\text{Chop}\left[N\left[\text{ComplexExpand}\left[\left| \frac{19}{8}+i \left(-\frac{23}{9}\right)\right| \right]-\sqrt{\left(\frac{19}{8}\right)^2+\left(-\frac{23}{9}\right)^2}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
wolfram-leaves-e-i-pi-5-alone-until-asked-this:
  epsil:
    in: ComplexExpand(Exp(ImaginaryUnit * (Pi / 5)))
    out: 1 / 4 + Sqrt(5) / 4 + Sqrt(2) / 4 * i * Sqrt(5 - Sqrt(5))
  tex:
    in: \mathrm{ComplexExpand}(\exp(\frac{i\pi}{5}))
    out: \frac{1}{4}+\frac{\sqrt{5}}{4}+(\frac{\sqrt{2}}{4}i)\sqrt{5-\sqrt{5}}
  fullform:
    in: ComplexExpand[Exp[Times[I, Divide[Pi, 5]]]]
  wolfram:
    in: ComplexExpand[Exp[Times[I, Divide[Pi, 5]]]]
