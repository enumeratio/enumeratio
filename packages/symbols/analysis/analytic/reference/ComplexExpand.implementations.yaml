sin-x-iy-sin-x-cosh-y-i-cos-x-sinh-y:
  epsil:
    in: ComplexExpand(Sin(x + ImaginaryUnit * y))
    out: i * Cos(x) * Sinh(y) + Sin(x) * Cosh(y)
  tex:
    in: \mathrm{ComplexExpand}(\sin(x+i y))
    out: i\cos(x)\sinh(y)+\sin(x)\cosh(y)
  fullform:
    in: ComplexExpand[Sin[Plus[x, Times[I, y]]]]
polar-form-of-a-complex-exponential:
  epsil:
    in: ComplexExpand(Exp(x + ImaginaryUnit * y))
    out: i * Sin(y) * ExponentialE ^ x + Cos(y) * ExponentialE ^ x
  tex:
    in: \mathrm{ComplexExpand}(\exp(x+i y))
    out: i\sin(y)e^{x}+\cos(y)e^{x}
  fullform:
    in: ComplexExpand[Exp[Plus[x, Times[I, y]]]]
complexexpand-x-plus-imaginaryunit-times-y-pow-2:
  epsil:
    in: ComplexExpand((x + ImaginaryUnit * y) ^ 2)
    out: x ^ 2 - y ^ 2 + 2i * x * y
  tex:
    in: \mathrm{ComplexExpand}((x+i y)^2)
    out: x^2-y^2+2i xy
  fullform:
    in: ComplexExpand[Power[Plus[x, Times[I, y]], 2]]
complexexpand-abs-x-plus-imaginaryunit-times-y:
  epsil:
    in: ComplexExpand(Abs(x + ImaginaryUnit * y))
    out: Sqrt(x ^ 2 + y ^ 2)
  tex:
    in: \mathrm{ComplexExpand}(\vert x+i y\vert)
    out: \sqrt{x^2+y^2}
  fullform:
    in: ComplexExpand[Abs[Plus[x, Times[I, y]]]]
wolfram-leaves-e-i-pi-5-alone-until-asked-this:
  epsil:
    in: ComplexExpand(Exp(ImaginaryUnit * (Pi / 5)))
    out: 1 / 4 + Sqrt(5) / 4 + Sqrt(2) / 4 * i * Sqrt(5 - Sqrt(5))
  tex:
    in: \mathrm{ComplexExpand}(\exp(\frac{i\pi}{5}))
    out: \frac{1}{4}+\frac{\sqrt{5}}{4}+(\frac{\sqrt{2}}{4}i)\sqrt{5-\sqrt{5}}
  fullform:
    in: ComplexExpand[Exp[Times[I, Divide[Pi, 5]]]]
  wolfram:
    in: ComplexExpand[Exp[Times[I, Divide[Pi, 5]]]]
