a-polynomial-is-defined-everywhere:
  epsil:
    in: FunctionDomain(x ^ 2, x)
    out: True
  tex:
    in: \mathrm{FunctionDomain}(x^2, x)
    out: \top
  traditional:
    in: \mathrm{FunctionDomain}(x^2, x)
    out: \mathrm{True}
  fullform:
    in: FunctionDomain[Power[x, 2], x]
  wolfram:
    in: FunctionDomain[Power[x, 2], x]
    out: True
    tex:
      in: \text{FunctionDomain}\left[x^2,x\right]
      out: \text{True}
division-by-zero-excludes-the-origin:
  epsil:
    in: FunctionDomain(1 / x, x)
    out: x < 0 || 0 < x
  tex:
    in: \mathrm{FunctionDomain}(\frac{1}{x}, x)
    out: x\lt0\lor0\lt x
  fullform:
    in: FunctionDomain[Divide[1, x], x]
  wolfram:
    in: FunctionDomain[Divide[1, x], x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionDomain}\left[\frac{1}{x},x\right]-(x<0\lor 0<x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionDomain}\left[\frac{1}{\frac{7}{3}},\frac{7}{3}\right]-\left(\frac{7}{3}<0\lor 0<\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[-\frac{1}{\frac{11}{5}},-\frac{11}{5}\right]-\left(-\frac{11}{5}<0\lor 0<-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\frac{1}{\frac{13}{4}},\frac{13}{4}\right]-\left(\frac{13}{4}<0\lor 0<\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-rational-function-with-two-real-poles:
  epsil:
    in: FunctionDomain(1 / (x ^ 2 - 1), x)
    out: x < -1 || -1 < x < 1 || 1 < x
  tex:
    in: \mathrm{FunctionDomain}(\frac{1}{x^2-1}, x)
    out: x\lt-1\lor-1\lt x\lt1\lor1\lt x
  fullform:
    in: FunctionDomain[Divide[1, Plus[Power[x, 2], -1]], x]
  wolfram:
    in: FunctionDomain[Divide[1, Plus[Power[x, 2], -1]], x]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionDomain}\left[\frac{1}{x^2-1},x\right]-(x<-1\lor -1<x<1\lor 1<x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionDomain}\left[\frac{1}{\left(\frac{7}{3}\right)^2-1},\frac{7}{3}\right]-\left(\frac{7}{3}<-1\lor -1<\frac{7}{3}<1\lor 1<\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\frac{1}{\left(-\frac{11}{5}\right)^2-1},-\frac{11}{5}\right]-\left(-\frac{11}{5}<-1\lor -1<-\frac{11}{5}<1\lor 1<-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\frac{1}{\left(\frac{13}{4}\right)^2-1},\frac{13}{4}\right]-\left(\frac{13}{4}<-1\lor -1<\frac{13}{4}<1\lor 1<\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: undefined-form
    note: "Same Indeterminate-vs-NaN spelling gap as FunctionConvexity/Monotonicity/Sign: fromWolfram maps Wolfram's Indeterminate symbol to our NaN."
an-even-root-needs-a-nonnegative-radicand:
  epsil:
    in: FunctionDomain(Sqrt(x ^ 2 - 1), x)
    out: x <= -1 || 1 <= x
  tex:
    in: \mathrm{FunctionDomain}(\sqrt{x^2-1}, x)
    out: x\le-1\lor1\le x
  fullform:
    in: FunctionDomain[Sqrt[Plus[Power[x, 2], -1]], x]
  wolfram:
    in: FunctionDomain[Sqrt[Plus[Power[x, 2], -1]], x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionDomain}\left[\sqrt{x^2-1},x\right]-(x\leq -1\lor 1\leq x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionDomain}\left[\sqrt{\left(\frac{7}{3}\right)^2-1},\frac{7}{3}\right]-\left(\frac{7}{3}\leq -1\lor 1\leq \frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\sqrt{\left(-\frac{11}{5}\right)^2-1},-\frac{11}{5}\right]-\left(-\frac{11}{5}\leq -1\lor 1\leq -\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\sqrt{\left(\frac{13}{4}\right)^2-1},\frac{13}{4}\right]-\left(\frac{13}{4}\leq -1\lor 1\leq \frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-natural-log-needs-a-positive-argument:
  epsil:
    in: FunctionDomain(Ln(2 - x), x)
    out: x < 2
  tex:
    in: \mathrm{FunctionDomain}(\ln(2-x), x)
    out: x\lt2
  fullform:
    in: FunctionDomain[Log[Subtract[2, x]], x]
  wolfram:
    in: FunctionDomain[Log[Subtract[2, x]], x]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{FunctionDomain}[\log (2-x),x]-(x<2)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionDomain}\left[\log \left(2-\frac{7}{3}\right),\frac{7}{3}\right]-\left(\frac{7}{3}<2\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\log \left(2--\frac{11}{5}\right),-\frac{11}{5}\right]-\left(-\frac{11}{5}<2\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\log \left(2-\frac{13}{4}\right),\frac{13}{4}\right]-\left(\frac{13}{4}<2\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
tangent-s-domain-is-declined:
  epsil:
    in: FunctionDomain(Tan(x), x)
    out: FunctionDomain(Tan(x), x)
  tex:
    in: \mathrm{FunctionDomain}(\tan(x), x)
    out: \mathrm{FunctionDomain}(\tan(x), x)
  fullform:
    in: FunctionDomain[Tan[x], x]
  wolfram:
    in: FunctionDomain[Tan[x], x]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{FunctionDomain}[\tan (x),x]-\text{FunctionDomain}[\tan (x),x]],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionDomain}\left[\tan \left(\frac{7}{3}\right),\frac{7}{3}\right]-\text{FunctionDomain}\left[\tan \left(\frac{7}{3}\right),\frac{7}{3}\right]\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\tan \left(-\frac{11}{5}\right),-\frac{11}{5}\right]-\text{FunctionDomain}\left[\tan \left(-\frac{11}{5}\right),-\frac{11}{5}\right]\right]\right],\text{Chop}\left[N\left[\text{FunctionDomain}\left[\tan \left(\frac{13}{4}\right),\frac{13}{4}\right]-\text{FunctionDomain}\left[\tan \left(\frac{13}{4}\right),\frac{13}{4}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
sqrt-of-a-bounded-quadratic:
  epsil:
    in: FunctionDomain(Sqrt(-x ^ 2 + 4), x)
    out: -2 <= x <= 2
  tex:
    in: \mathrm{FunctionDomain}(\sqrt{4-x^2}, x)
    out: -2\le x\le2
  fullform:
    in: FunctionDomain[Sqrt[Plus[Minus[Power[x, 2]], 4]], x]
  wolfram:
    in: FunctionDomain[Sqrt[Plus[Minus[Power[x, 2]], 4]], x]
a-monomial-with-negative-integer-exponent:
  epsil:
    in: FunctionDomain(x ^ -3, x)
    out: x < 0 || 0 < x
  tex:
    in: \mathrm{FunctionDomain}(\frac{1}{x^3}, x)
    out: x\lt0\lor0\lt x
  fullform:
    in: FunctionDomain[Power[x, -3], x]
  wolfram:
    in: FunctionDomain[Power[x, -3], x]
a-multivariate-expression-declines:
  epsil:
    in: FunctionDomain(x * y, x)
    out: FunctionDomain(x * y, x)
  tex:
    in: \mathrm{FunctionDomain}(xy, x)
    out: \mathrm{FunctionDomain}(xy, x)
  fullform:
    in: FunctionDomain[Times[x, y], x]
  wolfram:
    in: FunctionDomain[Times[x, y], x]
