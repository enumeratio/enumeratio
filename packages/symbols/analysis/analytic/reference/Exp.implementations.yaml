    out: "3"
  tex:
    in: N(e^{1}, 1)
    out: "3"
  fullform:
    in: N[Exp[1], 1]
  wolfram:
    in: N[Exp[1], 1]
  sympy:
    in: N(exp(1), 30)
    out: "2.71828182845904523536028747135"
    verdict: disagree
    kind: precision
    note: "The mapping evaluates at the system's own precision and drops N's digit count, so it prints every digit."
