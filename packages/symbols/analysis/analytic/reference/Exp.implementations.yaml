    in: bool(exp(log(5)) == 5)
    out: True
  rust:
    in: equal(exp(ln(n(5))), n(5))
    out: "true"
e-a-e-b-e-a-b:
  epsil:
    in: Exp(2) * Exp(3) == Exp(5)
    out: True
  tex:
    in: e^{2}e^{3}=e^{5}
    out: \top
  traditional:
    in: e^{2}e^{3}=e^{5}
    out: \mathrm{True}
  fullform:
    in: Equal[Times[Exp[2], Exp[3]], Exp[5]]
  wolfram:
    in: (Times[Exp[2], Exp[3]] == Exp[5])
    out: True
    tex:
      in: \exp (2) \exp (3)=\exp (5)
      out: \text{True}
  sympy:
    in: enumeratio_equal((exp(2) * exp(3)), exp(5))
    out: True
  mpmath:
    in: almosteq((exp(2) * exp(3)), exp(5), 1e-20)
    out: True
  sage:
    in: bool((exp(2) * exp(3)) == exp(5))
    out: True
  rust:
    in: equal((exp(n(2)) * exp(n(3))), exp(n(5)))
    out: "true"
threads-element-wise-over-a-list:
  epsil:
    in: Exp([0, 1])
    out: "[1, ExponentialE]"
  tex:
    in: \exp\bigl\lbrack0, 1\bigr\rbrack
    out: \bigl\lbrack1, e\bigr\rbrack
  fullform:
    in: Exp[List[0, 1]]
  wolfram:
    in: Exp[List[0, 1]]
    out: "{1, E}"
    tex:
      in: \exp (\{0,1\})
      out: \{1,e\}
  sympy:
    in: "[exp(0), exp(1)]"
    out: "[1, E]"
  mpmath:
    in: "[exp(0), exp(1)]"
    out: "[mpf('1.0'), mpf('2.71828182845904523536028747135281')]"
  sage:
    in: "[exp(0), exp(1)]"
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Exp is Listable and threads over the list; Sage's takes scalars only.
  rust:
    in: exp(list(vec![n(0), n(1)]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Exp is Listable and threads over the list; the Rust crates take scalars.
broadcasts-element-wise-giving-begin-pmatrix-1-e:
  epsil:
    in: Exp([[0, 1], [1, 0]])
    out: "[[1, ExponentialE], [ExponentialE, 1]]"
  tex:
    in: \exp\bigl\lbrack\bigl\lbrack0, 1\bigr\rbrack, \bigl\lbrack1, 0\bigr\rbrack\bigr\rbrack
    out: \bigl\lbrack\bigl\lbrack1, e\bigr\rbrack, \bigl\lbracke, 1\bigr\rbrack\bigr\rbrack
  fullform:
    in: Exp[List[List[0, 1], List[1, 0]]]
  wolfram:
    in: Exp[List[List[0, 1], List[1, 0]]]
    note: Wolfram's Exp also maps element-wise over a matrix; it names the matrix exponential MatrixExp, which this library provides too.
  sympy:
    in: "[[exp(0), exp(1)], [exp(1), exp(0)]]"
    out: "[[1, E], [E, 1]]"
  mpmath:
    in: "[[exp(0), exp(1)], [exp(1), exp(0)]]"
    out: "[[mpf('1.0'), mpf('2.71828182845904523536028747135281')], [mpf('2.71828182845904523536028747135281'), mpf('1.0')]]"
  sage:
    in: "[[exp(0), exp(1)], [exp(1), exp(0)]]"
  rust:
    in: exp(list(vec![list(vec![n(0), n(1)]), list(vec![n(1), n(0)])]))
    out: "panic: threading: a list where the crate takes a scalar"
    verdict: error
    kind: threading
    note: compute-engine's Exp of a matrix stays element-wise, threading over the nested list; the Rust crate takes scalars only.
