    in: Exp(Ln(5)) == 5
    out: True
  tex:
    in: \exp(\ln(5))=5
    out: \top
  traditional:
    in: \exp(\ln(5))=5
    out: \mathrm{True}
  fullform:
    in: Equal[Exp[Log[5]], 5]
  wolfram:
    in: (Exp[Log[5]] == 5)
    out: True
    tex:
      in: \exp (\log (5))=5
      out: \text{True}
