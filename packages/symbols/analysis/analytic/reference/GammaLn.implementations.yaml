the-derivative-of-ln-gamma-is-the-digamma:
  epsil:
    in: D(GammaLn(x), x)
    out: Digamma(x)
  tex:
    in: \frac{\mathrm{d}\mathrm{GammaLn}(x)}{\mathrm{d}x}
    out: \mathrm{Digamma}(x)
  traditional:
    in: \frac{\mathrm{d}\log\Gamma(x)}{\mathrm{d}x}
    out: \psi(x)
  fullform:
    in: D[LogGamma[x], x]
  wolfram:
    in: D[LogGamma[x], x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\frac{\partial \text{log$\Gamma $}(x)}{\partial x}-\psi (x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\frac{\partial }{\partial \frac{7}{3}}\text{log$\Gamma $}\left(\frac{7}{3}\right)-\psi \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\frac{\partial }{\partial -\frac{11}{5}}\text{log$\Gamma $}\left(-\frac{11}{5}\right)-\psi \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\frac{\partial }{\partial \frac{13}{4}}\text{log$\Gamma $}\left(\frac{13}{4}\right)-\psi \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
