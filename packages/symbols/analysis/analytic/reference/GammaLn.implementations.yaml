inherits-gamma-s-recurrence-gammaln-z-1-gammaln:
  epsil:
    in: GammaLn(6) == GammaLn(5) + Ln(5)
    out: True
  tex:
    in: \mathrm{GammaLn}(6)=\mathrm{GammaLn}(5)+\ln(5)
    out: \top
  traditional:
    in: \log\Gamma(6)=\log\Gamma(5)+\ln(5)
    out: \mathrm{True}
  fullform:
    in: Equal[LogGamma[6], Plus[LogGamma[5], Log[5]]]
  wolfram:
    in: (LogGamma[6] == Plus[LogGamma[5], Log[5]])
    out: True
    tex:
      in: \text{log$\Gamma $}(6)=\text{log$\Gamma $}(5)+\log (5)
      out: \text{True}
gammaln-1-2-frac-12-ln-pi-from-gamma-1-2-sqrt-pi:
  epsil:
    in: GammaLn(1 / 2) == 1 / 2 * Ln(Pi)
    out: True
  tex:
    in: \mathrm{GammaLn}(\frac{1}{2})=\frac{\ln(\pi)}{2}
    out: \top
  traditional:
    in: \log\Gamma(\frac{1}{2})=\frac{\ln(\pi)}{2}
    out: \mathrm{True}
  fullform:
    in: Equal[LogGamma[Rational[1, 2]], Times[Rational[1, 2], Log[Pi]]]
  wolfram:
    in: (LogGamma[Rational[1, 2]] == Times[Rational[1, 2], Log[Pi]])
    out: True
    tex:
      in: \text{log$\Gamma $}\left(\frac{1}{2}\right)=\frac{1}{2} \log (\pi )
      out: \text{True}
