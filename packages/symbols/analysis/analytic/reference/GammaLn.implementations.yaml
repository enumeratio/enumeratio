defined-as-ln-gamma-z-here-at-z-5:
  epsil:
    in: GammaLn(5) == Ln(Gamma(5))
    out: True
  tex:
    in: \mathrm{GammaLn}(5)=\ln(\Gamma(5))
    out: \top
  traditional:
    in: \log\Gamma(5)=\ln(\Gamma(5))
    out: \mathrm{True}
  fullform:
    in: Equal[LogGamma[5], Log[Gamma[5]]]
  wolfram:
    in: (LogGamma[5] == Log[Gamma[5]])
    out: True
    tex:
      in: \text{log$\Gamma $}(5)=\log (\Gamma (5))
      out: \text{True}
