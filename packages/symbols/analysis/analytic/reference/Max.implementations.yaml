with-no-arguments-compute-engine-returns-nan:
  epsil:
    in: Max()
    out: "`NaN`"
  tex:
    in: \max()
    out: \operatorname{NaN}
  fullform:
    in: Max[]
  wolfram:
    in: Max[]
    out: -Infinity
    tex:
      in: \max ()
      out: -\infty
    verdict: disagree
    kind: convention
    note: Max of nothing is NaN here; Wolfram returns the identity element -Infinity.
  sympy:
    in: enumeratio_max()
    out: -oo
    verdict: disagree
    kind: convention
    note: "The maximum of nothing: SymPy answers −∞, compute-engine NaN."
  sage:
    in: enumeratio_max()
    out: "ValueError: max() iterable argument is empty"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "NaN" and Sage raises an error.'
nan-poisons-the-result-overriding-every-other:
  epsil:
    in: Max(`NaN`, 3)
    out: "`NaN`"
  tex:
    in: \max(\operatorname{NaN}, 3)
    out: \operatorname{NaN}
  fullform:
    in: Max[Indeterminate, 3]
  wolfram:
    in: Max[Indeterminate, 3]
    out: Indeterminate
    tex:
      in: \max (\text{Indeterminate},3)
      out: \text{Indeterminate}
