the-max-of-an-empty-list-is-nan-too:
  epsil:
    in: Max([])
    out: "`NaN`"
  tex:
    in: \max(\bigl\lbrack \bigr\rbrack)
    out: \operatorname{NaN}
  fullform:
    in: Max[List[]]
  wolfram:
    in: Max[List[]]
    note: Wolfram's $\mathrm{Max}[\{\}]$ is the identity element $-\infty$.
  sympy:
    in: enumeratio_max([])
    out: -oo
    verdict: disagree
    kind: convention
    note: Same as the Wolfram row above -- SymPy's max() of an empty sequence also takes the identity element (-infinity); we deliberately return NaN for Max of an empty LIST.
  sage:
    in: enumeratio_max([])
