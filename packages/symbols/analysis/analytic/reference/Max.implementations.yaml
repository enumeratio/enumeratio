max-3-1-4-1-5:
  epsil:
    in: Max(3, 1, 4, 1, 5)
    out: "5"
  tex:
    in: \max(3, 1, 4, 1, 5)
    out: "5"
  fullform:
    in: Max[3, 1, 4, 1, 5]
  wolfram:
    in: Max[3, 1, 4, 1, 5]
    out: "5"
    tex:
      in: \max (3,1,4,1,5)
      out: "5"
  sympy:
    in: enumeratio_max(3, 1, 4, 1, 5)
    out: "5"
  sage:
    in: enumeratio_max(3, 1, 4, 1, 5)
    out: "5"
