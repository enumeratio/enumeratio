nested-lists-are-flattened-into-the-pool:
  epsil:
    in: Max(2, 3, [[1 / 2, -1], [-5 / 3, 1 / 2]])
    out: "3"
  tex:
    in: \max(2, 3, \bigl\lbrack\bigl\lbrack\frac{1}{2}, -1\bigr\rbrack, \bigl\lbrack-\frac{5}{3}, \frac{1}{2}\bigr\rbrack\bigr\rbrack)
    out: "3"
  fullform:
    in: Max[2, 3, List[List[Rational[1, 2], -1], List[Rational[-5, 3], Rational[1, 2]]]]
  wolfram:
    in: Max[2, 3, List[List[Rational[1, 2], -1], List[Rational[-5, 3], Rational[1, 2]]]]
  sympy:
    in: enumeratio_max(2, 3, [[Rational(1, 2), (-1)], [Rational((-5), 3), Rational(1, 2)]])
    out: "3"
  sage:
    in: enumeratio_max(2, 3, [[(1/2), (-1)], [((-5)/3), (1/2)]])
