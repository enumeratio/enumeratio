commutative-order-doesn-t-matter:
  epsil:
    in: Max(3, 7) == Max(7, 3)
    out: True
  tex:
    in: \max(3, 7)=\max(7, 3)
    out: \top
  traditional:
    in: \max(3, 7)=\max(7, 3)
    out: \mathrm{True}
  fullform:
    in: Equal[Max[3, 7], Max[7, 3]]
  wolfram:
    in: (Max[3, 7] == Max[7, 3])
    out: True
    tex:
      in: \max (3,7)=\max (7,3)
      out: \text{True}
  sympy:
    in: enumeratio_equal(enumeratio_max(3, 7), enumeratio_max(7, 3))
    out: True
  sage:
    in: bool(enumeratio_max(3, 7) == enumeratio_max(7, 3))
    out: True
multiple-list-arguments-are-flattened-into-one:
  epsil:
    in: Max([3, 1, 4], [9, 2]) == 9
    out: True
  tex:
    in: \max(\bigl\lbrack3, 1, 4\bigr\rbrack, \bigl\lbrack9, 2\bigr\rbrack)=9
    out: \top
  traditional:
    in: \max(\bigl\lbrack3, 1, 4\bigr\rbrack, \bigl\lbrack9, 2\bigr\rbrack)=9
    out: \mathrm{True}
  fullform:
    in: Equal[Max[List[3, 1, 4], List[9, 2]], 9]
  wolfram:
    in: (Max[List[3, 1, 4], List[9, 2]] == 9)
    out: True
    tex:
      in: \max (\{3,1,4\},\{9,2\})=9
      out: \text{True}
  sympy:
    in: enumeratio_equal(enumeratio_max([3, 1, 4], [9, 2]), 9)
    out: True
  sage:
    in: bool(enumeratio_max([3, 1, 4], [9, 2]) == 9)
    out: True
