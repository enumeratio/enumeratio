binomial-cdf-via-the-regularized-beta-for-x-sim:
  epsil:
    in: BetaRegularized(0.7, 3, 2) == 0.7 ^ 4 + 4 * 0.3 * 0.7 ^ 3
    out: True
    back:
      [
        Equal,
        [BetaRegularized, 0.7000000000000001, 3, 2],
        [
          Add,
          [Power, 0.7000000000000001, 4],
          [Multiply, [Multiply, 4, 0.30000000000000004], [Power, 0.7000000000000001, 3]],
        ],
      ]
  tex:
    in: \operatorname{BetaRegularized}(0.7, 3, 2)=0.7^4+4\times0.3\times0.7^3
    out: \top
  traditional:
    in: I_{0.7}(3, 2)=0.7^4+4\times0.3\times0.7^3
    out: \mathrm{True}
  fullform:
    in: Equal[BetaRegularized[0.7, 3, 2], Plus[Power[0.7, 4], Times[4, 0.3, Power[0.7, 3]]]]
  wolfram:
    in: (BetaRegularized[0.7, 3, 2] == Plus[Power[0.7, 4], Times[4, 0.3, Power[0.7, 3]]])
    out: True
    tex:
      in: I_{0.7}(3,2)=0.7^4+4 0.3 0.7^3
      out: \text{True}
