symmetry-i-x-a-b-i-1-x-b-a-1:
  epsil:
    in: BetaRegularized(0.3, 2, 3) + BetaRegularized(0.7, 3, 2) == 1
    out: True
    back: [Equal, [Add, [BetaRegularized, 0.30000000000000004, 2, 3], [BetaRegularized, 0.7000000000000001, 3, 2]], 1]
  tex:
    in: \operatorname{BetaRegularized}(0.3, 2, 3)+\operatorname{BetaRegularized}(0.7, 3, 2)=1
    out: \top
  traditional:
    in: I_{0.3}(2, 3)+I_{0.7}(3, 2)=1
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[BetaRegularized[0.3, 2, 3], BetaRegularized[0.7, 3, 2]], 1]
  wolfram:
    in: (Plus[BetaRegularized[0.3, 2, 3], BetaRegularized[0.7, 3, 2]] == 1)
    out: True
    tex:
      in: I_{0.3}(2,3)+I_{0.7}(3,2)=1
      out: \text{True}
