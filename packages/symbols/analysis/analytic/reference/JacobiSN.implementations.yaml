u-0-is-0-for-any-m:
  epsil:
    in: JacobiSN(0, m)
    out: "0"
  tex:
    in: \mathrm{JacobiSN}(0, m)
    out: "0"
  fullform:
    in: JacobiSN[0, m]
  wolfram:
    in: JacobiSN[0, m]
    out: "0"
    tex:
      in: \text{sn}(0|m)
      out: "0"
m-0-reduces-to-sin-u:
  epsil:
    in: JacobiSN(u, 0)
    out: Sin(u)
  tex:
    in: \mathrm{JacobiSN}(u, 0)
    out: \sin(u)
  fullform:
    in: JacobiSN[u, 0]
  wolfram:
    in: JacobiSN[u, 0]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{sn}(u|0)-\sin (u)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{sn}\left(\left.\frac{7}{3}\right|0\right)-\sin \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{sn}\left(\left.-\frac{11}{5}\right|0\right)-\sin \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{sn}\left(\left.\frac{13}{4}\right|0\right)-\sin \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
