evaluated-at-a-concrete-n-runs-the-recurrence:
  tex:
    in: N(\mathrm{DifferenceRootReduce}(\mathrm{Fibonacci}(n), n)\lhd20)
    out: 6\,765
  traditional:
    in: N(\mathrm{DifferenceRootReduce}(F_{n}, n)\lhd20)
    out: 6\,765
  fullform:
    in: N[DifferenceRootReduce[Fibonacci[n], n][20]]
    back: Unreadable
a-symbolic-order-declines:
  epsil:
    in: DifferenceRootReduce(Binomial(n, k), n)
    out: DifferenceRootReduce(Binomial(n, k), n)
  tex:
    in: \mathrm{DifferenceRootReduce}(\binom{n}{k}, n)
    out: \mathrm{DifferenceRootReduce}(\binom{n}{k}, n)
  fullform:
