a-symbolic-order-declines:
  epsil:
    in: DifferenceRootReduce(Binomial(n, k), n)
    out: DifferenceRootReduce(Binomial(n, k), n)
  tex:
    in: \mathrm{DifferenceRootReduce}(\binom{n}{k}, n)
    out: \mathrm{DifferenceRootReduce}(\binom{n}{k}, n)
  fullform:
    in: DifferenceRootReduce[Binomial[n, k], n]
  wolfram:
    in: DifferenceRootReduce[Binomial[n, k], n]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{DifferenceRootReduce}[\binom{n}{k},n]-\text{DifferenceRootReduce}[\binom{n}{k},n]],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{DifferenceRootReduce}\left[\binom{-\frac{11}{5}}{\frac{7}{3}},-\frac{11}{5}\right]-\text{DifferenceRootReduce}\left[\binom{-\frac{11}{5}}{\frac{7}{3}},-\frac{11}{5}\right]\right]\right],\text{Chop}\left[N\left[\text{DifferenceRootReduce}\left[\binom{-\frac{17}{6}}{\frac{13}{4}},-\frac{17}{6}\right]-\text{DifferenceRootReduce}\left[\binom{-\frac{17}{6}}{\frac{13}{4}},-\frac{17}{6}\right]\right]\right],\text{Chop}\left[N\left[\text{DifferenceRootReduce}\left[\binom{-\frac{23}{9}}{\frac{19}{8}},-\frac{23}{9}\right]-\text{DifferenceRootReduce}\left[\binom{-\frac{23}{9}}{\frac{19}{8}},-\frac{23}{9}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
