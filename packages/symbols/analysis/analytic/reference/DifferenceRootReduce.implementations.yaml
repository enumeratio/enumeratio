fibonacci-order-2:
  epsil:
    in: DifferenceRootReduce(Fibonacci(n), n)
    out: |-
      Apply(DifferenceRoot(Function([
                                      -y(n2) - y(n2 + 1) + y(n2 + 2) == 0,
                                      y(0) == 0,
                                      y(1) == 1,
                                    ], y, n2)), n)
  tex:
    in: \mathrm{DifferenceRootReduce}(\mathrm{Fibonacci}(n), n)
    out: \mathrm{DifferenceRoot}((y, \mathrm{n2})\mapsto\begin{cases}-y(\mathrm{n2})-y(\mathrm{n2}+1)+y(\mathrm{n2}+2)=0\\y(0)=0\\y(1)=1\end{cases})\lhd n
  traditional:
    in: \mathrm{DifferenceRootReduce}(F_{n}, n)
    out: \mathrm{DifferenceRoot}((y, \mathrm{n2})\mapsto\begin{cases}-y(\mathrm{n2})-y(\mathrm{n2}+1)+y(\mathrm{n2}+2)=0\\y(0)=0\\y(1)=1\end{cases})\lhd n
  fullform:
    in: DifferenceRootReduce[Fibonacci[n], n]
  wolfram:
    in: DifferenceRootReduce[Fibonacci[n], n]
    out: DifferenceRoot[Function[{\[FormalY], \[FormalN]}, {-\[FormalY][\[FormalN]] - \[FormalY][1 + \[FormalN]] + \[FormalY][2 + \[FormalN]] == 0, \[FormalY][0] == 0, \[FormalY][1] == 1}]][n]
    tex:
      in: \text{DifferenceRootReduce}\left[F_n,n\right]
      out: (n)
    verdict: inconclusive
    kind: unevaluated
    note: Wolfram's own DifferenceRoot object represents the recurrence rather than a closed form; FullSimplify can't algebraically compare it against our closed-form answer, and it isn't itself a plain number to substitute into.
factorial-order-1:
  epsil:
    in: DifferenceRootReduce(n!, n)
    out: |-
      Apply(DifferenceRoot(Function(
                                     [(-n2 - 1) * y(n2) + y(n2 + 1) == 0, y(0) == 1],
                                     y,
                                     n2,
                                   )), n)
  tex:
    in: \mathrm{DifferenceRootReduce}(n!, n)
    out: \mathrm{DifferenceRoot}((y, \mathrm{n2})\mapsto\begin{cases}((-1)-\mathrm{n2})y(\mathrm{n2})+y(\mathrm{n2}+1)=0\\y(0)=1\end{cases})\lhd n
  fullform:
    in: DifferenceRootReduce[Factorial[n], n]
  wolfram:
    in: DifferenceRootReduce[Factorial[n], n]
    out: DifferenceRoot[Function[{\[FormalY], \[FormalN]}, {(-1 - \[FormalN])*\[FormalY][\[FormalN]] + \[FormalY][1 + \[FormalN]] == 0, \[FormalY][0] == 1}]][n]
    tex:
      in: \text{DifferenceRootReduce}[n!,n]
      out: (n)
    verdict: inconclusive
    kind: unevaluated
    note: Wolfram's own DifferenceRoot object represents the recurrence rather than a closed form; FullSimplify can't algebraically compare it against our closed-form answer, and it isn't itself a plain number to substitute into.
binomial-anchors-either-side-of-the-pole:
  epsil:
    in: DifferenceRootReduce(Binomial(n, 3), n)
    out: |-
      Apply(DifferenceRoot(Function([
                                      (n2 - 2) * y(n2 + 1) + (-n2 - 1) * y(n2) == 0,
                                      y(-1) == -1,
                                      y(3) == 1,
                                    ], y, n2)), n)
  tex:
    in: \mathrm{DifferenceRootReduce}(\binom{n}{3}, n)
    out: \mathrm{DifferenceRoot}((y, \mathrm{n2})\mapsto\begin{cases}(\mathrm{n2}-2)y(\mathrm{n2}+1)+((-1)-\mathrm{n2})y(\mathrm{n2})=0\\y(-1)=-1\\y(3)=1\end{cases})\lhd n
  fullform:
    in: DifferenceRootReduce[Binomial[n, 3], n]
  wolfram:
    in: DifferenceRootReduce[Binomial[n, 3], n]
    out: DifferenceRoot[Function[{\[FormalY], \[FormalN]}, {(-1 - \[FormalN])*\[FormalY][\[FormalN]] + (-2 + \[FormalN])*\[FormalY][1 + \[FormalN]] == 0, \[FormalY][-1] == -1, \[FormalY][3] == 1}]][n]
    tex:
      in: \text{DifferenceRootReduce}[\binom{n}{3},n]
      out: (n)
    verdict: inconclusive
    kind: unevaluated
    note: Wolfram's own DifferenceRoot object represents the recurrence rather than a closed form; FullSimplify can't algebraically compare it against our closed-form answer, and it isn't itself a plain number to substitute into.
