unittriangle-peak:
  epsil:
    in: UnitTriangle(0)
    out: "1"
  tex:
    in: \mathrm{UnitTriangle}(0)
    out: "1"
  fullform:
    in: UnitTriangle[0]
  wolfram:
    in: UnitTriangle[0]
unittriangle-endpoint:
  epsil:
    in: UnitTriangle(1)
    out: "0"
  tex:
    in: \mathrm{UnitTriangle}(1)
    out: "0"
  fullform:
    in: UnitTriangle[1]
  wolfram:
    in: UnitTriangle[1]
unittriangle-neg-endpoint:
  epsil:
    in: UnitTriangle(-1)
    out: "0"
  tex:
    in: \mathrm{UnitTriangle}(-1)
    out: "0"
  fullform:
    in: UnitTriangle[-1]
  wolfram:
    in: UnitTriangle[-1]
unittriangle-outside:
  epsil:
    in: UnitTriangle(2)
    out: "0"
  tex:
    in: \mathrm{UnitTriangle}(2)
    out: "0"
  fullform:
    in: UnitTriangle[2]
  wolfram:
    in: UnitTriangle[2]
unittriangle-1-3:
  epsil:
    in: UnitTriangle(1 / 3)
    out: 2 / 3
  tex:
    in: \mathrm{UnitTriangle}(\frac{1}{3})
    out: \frac{2}{3}
  fullform:
    in: UnitTriangle[Rational[1, 3]]
  wolfram:
    in: UnitTriangle[Rational[1, 3]]
unittriangle-1-2:
  epsil:
    in: UnitTriangle(1 / 2)
    out: 1 / 2
  tex:
    in: \mathrm{UnitTriangle}(\frac{1}{2})
    out: \frac{1}{2}
  fullform:
    in: UnitTriangle[Rational[1, 2]]
  wolfram:
    in: UnitTriangle[Rational[1, 2]]
unittriangle-same-as-heavisidelambda:
  epsil:
    in: UnitTriangle(1 / 4) == HeavisideLambda(1 / 4)
    out: True
  tex:
    in: \mathrm{UnitTriangle}(\frac{1}{4})=\mathrm{HeavisideLambda}(\frac{1}{4})
    out: \top
  traditional:
    in: \mathrm{UnitTriangle}(\frac{1}{4})=\mathrm{HeavisideLambda}(\frac{1}{4})
    out: \mathrm{True}
  fullform:
    in: Equal[UnitTriangle[Rational[1, 4]], HeavisideLambda[Rational[1, 4]]]
  wolfram:
    in: (UnitTriangle[Rational[1, 4]] == HeavisideLambda[Rational[1, 4]])
