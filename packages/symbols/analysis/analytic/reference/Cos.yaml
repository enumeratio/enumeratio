name: Cos
domain: Elementary functions
signature: Cos(x)
summary: The cosine of x, in radians.
signatures:
  - call: Cos(x)
    description: the cosine of x, in radians.
details:
  - 'Even function: $\cos(-x) = \cos(x)$.'
  - Period $2\pi$.
  - 'Reciprocal of [[Sec]]: $\cos(x) = \frac{1}{\sec(x)}$.'
  - 'Co-function with [[Sin]]: $\cos(x) = \sin(\pi/2 - x)$.'
seeAlso:
  - Sin
  - Tan
  - Sec
  - Arccos
