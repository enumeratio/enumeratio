name: SquareWave
domain: Elementary functions
signature: SquareWave(x)
summary: "The square wave: period 1, value 1 on [0, 1/2) and 0 on [1/2, 1) of each period."
signatures:
  - call: SquareWave(x)
    description: 1 for x - floor(x) in [0, 1/2), 0 for x - floor(x) in [1/2, 1).
    library: "@enumeratio/analytic"
  - call: SquareWave({min, max}, x)
    description: the square wave rescaled to vary between min and max, unit period.
    library: "@enumeratio/analytic"
    arity: 2
details:
  - SquareWave(0) = 1 -- the half-open convention puts the period's left edge in the high half.
  - The range form takes the range FIRST, x second -- SquareWave({min, max}, x) -- matching [[SawtoothWave]] and [[TriangleWave]].
examples:
  - id: squarewave-zero
    expr: [SquareWave, 0]
    expected: 1
    caption: SquareWave(0) = 1
  - id: squarewave-half
    expr: [SquareWave, [Rational, 1, 2]]
    expected: 0
    caption: The high half is half-open -- 0 at exactly 1/2
  - id: squarewave-three-quarters
    expr: [SquareWave, [Rational, 3, 4]]
    expected: 0
  - id: squarewave-periodic
    expr: [Equal, [SquareWave, [Rational, 1, 4]], [SquareWave, [Add, [Rational, 1, 4], 2]]]
    expected: True
    category: Properties
    caption: Period 1
  - id: squarewave-ranged
    expr: [SquareWave, [List, 0, 10], 0]
    expected: 10
    category: Scope
    caption: Rescaled to a {min, max} range
