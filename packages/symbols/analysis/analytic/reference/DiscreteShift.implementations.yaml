discreteshift-one-step:
  epsil:
    in: DiscreteShift(a(n), n)
    out: a(n + 1)
  tex:
    in: \mathrm{DiscreteShift}(a(n), n)
    out: a(n+1)
  fullform:
    in: DiscreteShift[a[n], n]
  wolfram:
    in: DiscreteShift[a[n], n]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\unicode{f4a3}_na(n)-a(n+1)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\unicode{f4a3}_{-\frac{11}{5}}a\left(-\frac{11}{5}\right)-a\left(-\frac{11}{5}+1\right)\right]\right],\text{Chop}\left[N\left[\unicode{f4a3}_{-\frac{17}{6}}a\left(-\frac{17}{6}\right)-a\left(-\frac{17}{6}+1\right)\right]\right],\text{Chop}\left[N\left[\unicode{f4a3}_{-\frac{23}{9}}a\left(-\frac{23}{9}\right)-a\left(-\frac{23}{9}+1\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
discreteshift-h-step:
  epsil:
    in: DiscreteShift(a(n), [n, 2])
    out: a(n + 2)
  tex:
    in: \mathrm{DiscreteShift}(a(n), \bigl\lbrack n, 2\bigr\rbrack)
    out: a(n+2)
  fullform:
    in: DiscreteShift[a[n], List[n, 2]]
  wolfram:
    in: DiscreteShift[a[n], List[n, 2]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\unicode{f4a3}_n^2a(n)-a(n+2)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\unicode{f4a3}_{-\frac{11}{5}}^2a\left(-\frac{11}{5}\right)-a\left(-\frac{11}{5}+2\right)\right]\right],\text{Chop}\left[N\left[\unicode{f4a3}_{-\frac{17}{6}}^2a\left(-\frac{17}{6}\right)-a\left(-\frac{17}{6}+2\right)\right]\right],\text{Chop}\left[N\left[\unicode{f4a3}_{-\frac{23}{9}}^2a\left(-\frac{23}{9}\right)-a\left(-\frac{23}{9}+2\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
