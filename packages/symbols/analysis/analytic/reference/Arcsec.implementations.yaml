arcsec-1:
  epsil:
    in: Arcsec(1)
    out: "0"
  tex:
    in: \mathrm{arcsec}(1)
    out: "0"
  wolfram:
    in: ArcSec[1]
    out: "0"
    tex:
      in: \sec ^{-1}(1)
      out: "0"
arcsec-2:
  epsil:
    in: Arcsec(2)
    out: 1 / 3 * Pi
  tex:
    in: \mathrm{arcsec}(2)
    out: \frac{\pi}{3}
  wolfram:
    in: ArcSec[2]
    out: Pi/3
    tex:
      in: \sec ^{-1}(2)
      out: \frac{\pi }{3}
undoes-sec-sec-arcsec-x-x:
  epsil:
    in: Sec(Arcsec(2)) == 2
    out: True
  tex:
    in: \sec(\mathrm{arcsec}(2))=2
    out: \top
  traditional:
    in: \sec(\mathrm{arcsec}(2))=2
    out: \mathrm{True}
  wolfram:
    in: (Sec[ArcSec[2]] == 2)
    back: Unreadable
    out: True
    tex:
      in: \sec \left(\sec ^{-1}(2)\right)=2
      out: \text{True}
arcsec-sqrt-2-pi-4:
  epsil:
    in: Arcsec(Sqrt(2))
    out: 1 / 4 * Pi
  tex:
    in: \mathrm{arcsec}(\sqrt{2})
    out: \frac{\pi}{4}
  wolfram:
    in: ArcSec[Sqrt[2]]
arcsec-neg-1:
  epsil:
    in: Arcsec(-1)
    out: Pi
  tex:
    in: \mathrm{arcsec}(-1)
    out: \pi
  wolfram:
    in: ArcSec[-1]
arcsec-2-2-pi-3:
  epsil:
    in: Arcsec(-2)
    out: 2 / 3 * Pi
  tex:
    in: \mathrm{arcsec}(-2)
    out: \frac{2\pi}{3}
  wolfram:
    in: ArcSec[-2]
inside-1-1-the-value-is-purely-imaginary:
  epsil:
    in: Arcsec(0.5)
    out: 1.316_957_896_924_816_6i
  tex:
    in: \mathrm{arcsec}(0.5)
    out: 1.316\,957\,896\,924\,816\,6i
  wolfram:
    in: ArcSec[0.5]
arcsec-positiveinfinity:
  epsil:
    in: Arcsec(PositiveInfinity)
    out: 1 / 2 * Pi
  tex:
    in: \mathrm{arcsec}(\infty)
    out: \frac{\pi}{2}
  wolfram:
    in: ArcSec[Infinity]
a-pole-arcsec-0-is-complex-infinity:
  epsil:
    in: Arcsec(0)
    out: ComplexInfinity
  tex:
    in: \mathrm{arcsec}(0)
    out: \tilde\infty
  wolfram:
    in: ArcSec[0]
derivative-for-real-x-1:
  epsil:
    in: D(Arcsec(x), x)
    out: 1 / (Abs(x) * Sqrt(x ^ 2 - 1))
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\mathrm{arcsec}(x)
    out: (\vert x\vert\sqrt{x^2-1})^{-1}
  wolfram:
    in:
    note: Wolfram writes it as 1/(x^2 Sqrt[1 - 1/x^2]), valid for complex x too.
