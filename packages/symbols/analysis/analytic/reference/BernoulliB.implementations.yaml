bernoullib-0:
  wolfram:
    in: BernoulliB[0]
    out: "1"
    tex:
      in: B_0
      out: "1"
  sage:
    in: bernoulli(0)
    out: "1"
  sympy:
    in: bernoulli(0)
    out: "1"
bernoullib-1:
  wolfram:
    in: BernoulliB[1]
    out: -1/2
    tex:
      in: B_1
      out: -\frac{1}{2}
  sage:
    in: bernoulli(1)
    out: -1/2
  sympy:
    in: bernoulli(1)
    out: 1/2
    verdict: disagree
    kind: convention
    note: SymPy (since 1.12) takes B₁ = +1/2; compute-engine keeps B₁ = −1/2, as Wolfram does.
