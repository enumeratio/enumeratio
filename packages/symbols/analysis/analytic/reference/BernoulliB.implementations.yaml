faulhaber-s-formula-recovers-sum-k-0-4-k-2-30:
  wolfram:
    in: Divide[Plus[Times[Binomial[3, 0], BernoulliB[0], Power[5, 3]], Times[Binomial[3, 1], BernoulliB[1], Power[5, 2]], Times[Binomial[3, 2], BernoulliB[2], Power[5, 1]]], 3]
    out: "30"
    tex:
      in: \frac{\binom{3}{0} B_0 5^3+\binom{3}{1} B_1 5^2+\binom{3}{2} B_2 5^1}{3}
      out: "30"
  sage:
    in: (((binomial(3, 0) * bernoulli(0) * (5^3)) + (binomial(3, 1) * bernoulli(1) * (5^2)) + (binomial(3, 2) * bernoulli(2) * (5^1))) / 3)
    out: "30"
  sympy:
    in: (S(((binomial(3, 0) * bernoulli(0) * (5**3)) + (binomial(3, 1) * bernoulli(1) * (5**2)) + (binomial(3, 2) * bernoulli(2) * (5**1)))) / 3)
    out: "55"
    verdict: disagree
    kind: convention
    note: SymPy (since 1.12) takes B₁ = +1/2; compute-engine keeps B₁ = −1/2, as Wolfram does.
bernoulli-numbers-are-only-defined-for-n-ge-0-a:
  wolfram:
    in: BernoulliB[-1]
    out: BernoulliB[-1]
    tex:
      in: B_{-1}
      out: B_{-1}
  sage:
    in: bernoulli(-1)
    out: "OverflowError: can't convert negative value to unsigned long"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["BernoulliB", -1] and Sage raises an error.'
  sympy:
    in: bernoulli((-1))
    out: bernoulli(-1)
    verdict: inconclusive
    kind: undefined-form
    note: "Both decline BernoulliB here: compute-engine leaves it unevaluated, SymPy returns it unevaluated."
threads-element-wise-over-a-list-as-wolfram-s:
  wolfram:
    in: BernoulliB[List[1, 2, 3]]
    out: "{-1/2, 1/6, 0}"
    tex:
      in: B_{\{1,2,3\}}
      out: \left\{-\frac{1}{2},\frac{1}{6},0\right\}
  sympy:
    in: "[bernoulli(1), bernoulli(2), bernoulli(3)]"
    out: "[1/2, 1/6, 0]"
    verdict: disagree
    kind: convention
    note: SymPy's bernoulli(1) is +1/2 (the "B+" convention); ours is -1/2 (the "B-" convention), documented at the top of this head's page.
