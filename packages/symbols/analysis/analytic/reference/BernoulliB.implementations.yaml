    out: BernoulliB(-1)
  tex:
    in: \mathrm{BernoulliB}(-1)
    out: \mathrm{BernoulliB}(-1)
  traditional:
    in: B_{-1}
    out: B_{-1}
  fullform:
    in: BernoulliB[-1]
  wolfram:
    in: BernoulliB[-1]
    out: BernoulliB[-1]
    tex:
      in: B_{-1}
      out: B_{-1}
  sympy:
    in: bernoulli(-1)
    out: bernoulli(-1)
    verdict: inconclusive
    kind: undefined-form
    note: "Both decline BernoulliB here: compute-engine leaves it unevaluated, SymPy returns it unevaluated."
  sage:
    in: bernoulli(-1)
    out: "OverflowError: can't convert negative value to unsigned long"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers ["BernoulliB", -1] and Sage raises an error.'
