zeta-n-frac-b-n-1-n-1-here-zeta-3-frac-1-120-see:
  epsil:
    in: Zeta(-3) == -(BernoulliB(4) / 4)
    out: True
  tex:
    in: \zeta(-3)=-\frac{\mathrm{BernoulliB}(4)}{4}
    out: \top
  traditional:
    in: \zeta(-3)=-\frac{B_{4}}{4}
    out: \mathrm{True}
  fullform:
    in: Equal[Zeta[-3], Minus[Divide[BernoulliB[4], 4]]]
  wolfram:
    in: (Zeta[-3] == Minus[Divide[BernoulliB[4], 4]])
  sympy:
    in: enumeratio_equal(zeta(-3), (-(S(bernoulli(4)) / 4)))
    out: True
  sage:
    in: bool(zeta(-3) == (-(bernoulli(4) / 4)))
the-recurrence-sum-k-0-n-1-binom-n-k-b-k-0-here:
  epsil:
    in: |-
      Binomial(5, 0) * BernoulliB(0) + Binomial(5, 1) * BernoulliB(1) + Binomial(5, 2) *
                                                                        BernoulliB(2) + Binomial(5, 3) *
                                                                           BernoulliB(3) + Binomial(5, 4) *
                                                                              BernoulliB(4)
    out: "0"
  tex:
    in: \binom{5}{0}\mathrm{BernoulliB}(0)+\binom{5}{1}\mathrm{BernoulliB}(1)+\binom{5}{2}\mathrm{BernoulliB}(2)+\binom{5}{3}\mathrm{BernoulliB}(3)+\binom{5}{4}\mathrm{BernoulliB}(4)
    out: "0"
  traditional:
    in: \binom{5}{0}B_{0}+\binom{5}{1}B_{1}+\binom{5}{2}B_{2}+\binom{5}{3}B_{3}+\binom{5}{4}B_{4}
    out: "0"
  fullform:
    in: Plus[Times[Binomial[5, 0], BernoulliB[0]], Times[Binomial[5, 1], BernoulliB[1]], Times[Binomial[5, 2], BernoulliB[2]], Times[Binomial[5, 3], BernoulliB[3]], Times[Binomial[5, 4], BernoulliB[4]]]
  wolfram:
    in: Plus[Times[Binomial[5, 0], BernoulliB[0]], Times[Binomial[5, 1], BernoulliB[1]], Times[Binomial[5, 2], BernoulliB[2]], Times[Binomial[5, 3], BernoulliB[3]], Times[Binomial[5, 4], BernoulliB[4]]]
  sympy:
    in: ((binomial(5, 0) * bernoulli(0)) + (binomial(5, 1) * bernoulli(1)) + (binomial(5, 2) * bernoulli(2)) + (binomial(5, 3) * bernoulli(3)) + (binomial(5, 4) * bernoulli(4)))
    out: "5"
    verdict: disagree
    kind: convention
    note: SymPy (since 1.12) takes B₁ = +1/2; compute-engine and Wolfram take B₁ = -1/2, so the recurrence sums differ.
  sage:
    in: ((binomial(5, 0) * bernoulli(0)) + (binomial(5, 1) * bernoulli(1)) + (binomial(5, 2) * bernoulli(2)) + (binomial(5, 3) * bernoulli(3)) + (binomial(5, 4) * bernoulli(4)))
