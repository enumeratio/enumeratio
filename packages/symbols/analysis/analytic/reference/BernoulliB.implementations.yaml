faulhaber-s-formula-recovers-sum-k-0-4-k-2-30:
  epsil:
    in: |-
      (Binomial(3, 0) * BernoulliB(0) * 5 ^ 3 + Binomial(3, 1) * BernoulliB(1) * 5 ^ 2 +
       Binomial(3, 2) * BernoulliB(2) * 5 ^ 1) / 3
    out: "30"
  tex:
    in: \frac{1}{3}(\binom{3}{0}\mathrm{BernoulliB}(0)\times5^3+\binom{3}{1}\mathrm{BernoulliB}(1)\times5^2+\binom{3}{2}\mathrm{BernoulliB}(2)\times5^1)
    out: "30"
  traditional:
    in: \frac{1}{3}(\binom{3}{0}B_{0}\times5^3+\binom{3}{1}B_{1}\times5^2+\binom{3}{2}B_{2}\times5^1)
    out: "30"
  fullform:
    in: Divide[Plus[Times[Binomial[3, 0], BernoulliB[0], Power[5, 3]], Times[Binomial[3, 1], BernoulliB[1], Power[5, 2]], Times[Binomial[3, 2], BernoulliB[2], Power[5, 1]]], 3]
  wolfram:
    in: Divide[Plus[Times[Binomial[3, 0], BernoulliB[0], Power[5, 3]], Times[Binomial[3, 1], BernoulliB[1], Power[5, 2]], Times[Binomial[3, 2], BernoulliB[2], Power[5, 1]]], 3]
    out: "30"
    tex:
      in: \frac{\binom{3}{0} B_0 5^3+\binom{3}{1} B_1 5^2+\binom{3}{2} B_2 5^1}{3}
      out: "30"
  sympy:
    in: (S(((binomial(3, 0) * bernoulli(0) * (S(5)**3)) + (binomial(3, 1) * bernoulli(1) * (S(5)**2)) + (binomial(3, 2) * bernoulli(2) * (S(5)**1)))) / 3)
    out: "55"
    verdict: disagree
    kind: convention
    note: SymPy (since 1.12) takes B₁ = +1/2; compute-engine keeps B₁ = −1/2, as Wolfram does.
  sage:
    in: (((binomial(3, 0) * bernoulli(0) * ((5)^3)) + (binomial(3, 1) * bernoulli(1) * ((5)^2)) + (binomial(3, 2) * bernoulli(2) * ((5)^1))) / 3)
    out: "30"
bernoulli-numbers-are-only-defined-for-n-ge-0-a:
  epsil:
