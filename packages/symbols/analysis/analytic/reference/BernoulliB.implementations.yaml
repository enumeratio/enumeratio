the-recurrence-sum-k-0-n-1-binom-n-k-b-k-0-here:
  sympy:
    in: ((binomial(5, 0) * bernoulli(0)) + (binomial(5, 1) * bernoulli(1)) + (binomial(5, 2) * bernoulli(2)) + (binomial(5, 3) * bernoulli(3)) + (binomial(5, 4) * bernoulli(4)))
    out: "5"
    verdict: disagree
    kind: convention
    note: The k=1 term flips sign under SymPy's B+ convention (bernoulli(1)=+1/2) versus ours (B-, -1/2), which shifts the recurrence's total. Same root cause as the row above.
