name: JacobiDC
domain: Special functions
signature: JacobiDC(u, m)
summary: The Jacobi elliptic function $\operatorname{dc}(u,m) = \operatorname{dn}(u,m)/\operatorname{cn}(u,m)$ (Glaisher's notation), in Wolfram/mpmath's $m=k^2$ convention.
signatures:
  - call: JacobiDC(u, m)
    description: the Jacobi elliptic function dc, argument u, parameter m.
    library: "@enumeratio/analytic"
details:
  - $m = k^2$, the same convention [[EllipticK]] / [[EllipticF]] use.
  - $\operatorname{dc}(u,m) = \operatorname{dn}(u,m)/\operatorname{cn}(u,m)$ — [[JacobiDN]] and [[JacobiCN]] share this head's numeric kernel and exact-value coverage (m outside [0,1] via the reciprocal- and imaginary-modulus transformations, complex u, a genuinely complex m declined).
  - dc(0,m) = 1, for any m.
  - Numeric only — a symbolic argument stays unevaluated; a floating-point argument (or `N()`) evaluates directly.
examples:
  - id: a-floating-point-argument-evaluates-directly-to
    expr: [N, [JacobiDC, 0.6, 0.4]]
    expected: 1.124780426911555
    caption: A floating-point argument evaluates directly to a decimal
  - id: u-0-is-1-for-any-m
    expr: [JacobiDC, 0, m]
    expected: 1
    category: Properties
    caption: u = 0 is 1, for any m
  - id: m-less-than-0-via-the-imaginary-modulus
    expr: [N, [JacobiDC, 0.3, -0.7]]
    expected: 1.0799397700832252
    category: Scope
    caption: m less than 0, via the imaginary-modulus transformation
  - id: symbolic-arguments-are-left-unevaluated-rather
    expr: [JacobiDC, u, m]
    expected: [JacobiDC, u, m]
    category: Possible issues
    caption: Symbolic arguments are left unevaluated rather than guessed at
seeAlso:
  - JacobiDN
  - JacobiCN
  - JacobiCD
