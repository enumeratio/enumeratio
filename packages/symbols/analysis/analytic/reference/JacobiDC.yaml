name: JacobiDC
domain: Special functions
signature: JacobiDC(u, m)
summary: The Jacobi elliptic function $\operatorname{dc}(u,m) = \operatorname{dn}(u,m)/\operatorname{cn}(u,m)$ (Glaisher's notation), in Wolfram/mpmath's $m=k^2$ convention.
signatures:
  - call: JacobiDC(u, m)
    description: the Jacobi elliptic function dc, argument u, parameter m.
    library: "@enumeratio/analytic"
details:
  - $m = k^2$, the same convention [[EllipticK]] / [[EllipticF]] use.
  - $\operatorname{dc}(u,m) = \operatorname{dn}(u,m)/\operatorname{cn}(u,m)$ — [[JacobiDN]] and [[JacobiCN]] share this head's numeric kernel and exact-value coverage (m outside [0,1] via the reciprocal- and imaginary-modulus transformations, complex u, a genuinely complex m declined).
  - dc(0,m) = 1, for any m.
  - Numeric only — a symbolic argument stays unevaluated; a floating-point argument (or `N()`) evaluates directly.
seeAlso:
  - JacobiDN
  - JacobiCN
  - JacobiCD
