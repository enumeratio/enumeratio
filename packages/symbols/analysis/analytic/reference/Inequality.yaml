name: Inequality
domain: Relations
signature: Inequality(v1, rel1, v2, rel2, v3, ...)
summary: Wolfram's chained-comparison form -- v1 rel1 v2, v2 rel2 v3, ... all at once, letting the relation change partway through the chain (0 <= x < 5).
signatures:
  - call: Inequality(v1, rel1, v2, rel2, v3, ...)
    description: the conjunction of every consecutive link, where each relᵢ is one of Equal, NotEqual, Less, LessEqual, Greater, GreaterEqual.
    library: "@enumeratio/analytic"
details:
  - A chain that uses the SAME relation throughout (0 < x < 5) is already [[Less]] or [[LessEqual]] etc. taking more than two arguments -- see those heads. Inequality exists for a chain that MIXES relations (0 <= x < 5), which compute-engine's own n-ary comparison heads don't represent.
  - Evaluates as the And of its pairwise links, applied through the relation heads compute-engine already ships -- so a fully numeric chain folds all the way to True/False, and a symbolic one is left as And of whatever didn't fold.
  - Round-trips with Wolfram, which prints exactly this shape whenever Reduce, FunctionDomain, or a mixed-relation input (`0 <= x < 5`) produces one -- see packages/wolfram/src/to-wolfram.ts.
  - Declines (leaves the call unevaluated) on a malformed chain -- an even argument count, or something other than one of the six relations in a relation slot.
examples:
  - id: a-numeric-chain-that-holds
    expr: [Inequality, 0, LessEqual, 2, Less, 5]
    expected: True
    caption: A numeric chain that holds -- 0 <= 2 and 2 < 5
  - id: a-numeric-chain-that-fails
    expr: [Inequality, 0, LessEqual, 5, Less, 5]
    expected: False
    caption: A numeric chain that fails -- 0 <= 5 but not 5 < 5
  - id: a-symbolic-mixed-chain-partially-simplifies
    expr: [Inequality, 0, LessEqual, x, Less, 5]
    expected: [And, [LessEqual, 0, x], [Less, x, 5]]
    caption: A symbolic mixed chain simplifies to the And of its links
  - id: a-three-link-chain
    expr: [Inequality, 1, Less, 2, LessEqual, 2, Less, 10]
    expected: True
    category: Scope
    caption: A three-link chain -- 1 < 2, 2 <= 2, and 2 < 10
  - id: equal-and-notequal-are-valid-links-too
    expr: [Inequality, 0, Less, x, NotEqual, 3]
    expected: [And, [Less, 0, x], [NotEqual, x, 3]]
    category: Scope
    caption: Equal and NotEqual are valid links too
  - id: a-homogeneous-chain-still-goes-through-and
    expr: [Inequality, 0, Less, x, Less, 5]
    expected: [And, [Less, 0, x], [Less, x, 5]]
    category: Scope
    caption: A homogeneous chain (same relation throughout) still goes through And here -- write it as Less(0, x, 5) directly for the native n-ary form
  - id: declines-on-a-non-relation-link
    expr: [Inequality, 0, Add, 5]
    expected: [Inequality, 0, Add, 5]
    category: Possible issues
    caption: Declines when a link isn't one of the six relations, rather than guess
seeAlso:
  - Less
  - LessEqual
  - FunctionDomain
