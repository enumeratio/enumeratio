i-x-1-1-x-is-its-own-inverse:
  epsil:
    in: InverseBetaRegularized(s, 1, 1)
    out: s
  tex:
    in: \mathrm{InverseBetaRegularized}(s, 1, 1)
    out: s
  fullform:
    in: InverseBetaRegularized[s, 1, 1]
  wolfram:
    in: InverseBetaRegularized[s, 1, 1]
    out: -2.3333333333333335 + InverseBetaRegularized[2.3333333333333335, 1., 1.] == 0 && 2.2 + InverseBetaRegularized[-2.2, 1., 1.] == 0 && -3.25 + InverseBetaRegularized[3.25, 1., 1.] == 0
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[I_s^{-1}(1,1)-s],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[I_{\frac{7}{3}}^{-1}(1,1)-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[I_{-\frac{11}{5}}^{-1}(1,1)--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[I_{\frac{13}{4}}^{-1}(1,1)-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: I_{2.33333}^{-1}(1.,1.)-2.33333=0\land 2.2\, +I_{-2.2}^{-1}(1.,1.)=0\land I_{3.25}^{-1}(1.,1.)-3.25=0
    verdict: inconclusive
    kind: domain
    note: "Same as ErfInv: the fixed substitution points fall outside InverseBetaRegularized's well-behaved domain, so neither FullSimplify nor the numeric fallback cleanly decides it."
i-x-a-1-x-a-inverts-to-s-1-a:
  epsil:
    in: InverseBetaRegularized(s, a, 1)
    out: s ^ (1 / a)
  tex:
    in: \mathrm{InverseBetaRegularized}(s, a, 1)
    out: \sqrt[a]{s}
  fullform:
    in: InverseBetaRegularized[s, a, 1]
  wolfram:
    in: InverseBetaRegularized[s, a, 1]
    out: (-0.31197762786463623 - 1.3668632967414198*I) + InverseBetaRegularized[-2.2, 2.3333333333333335, 1.] == 0 && (-0.7826477707931614 - 1.133861046204369*I) + InverseBetaRegularized[-2.8333333333333335, 3.25, 1.] == 0 && (-0.3644169686976401 - 1.4390500655775216*I) + InverseBetaRegularized[-2.5555555555555554, 2.375, 1.] == 0
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[I_s^{-1}(a,1)-s^{\frac{1}{a}}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[I_{-\frac{11}{5}}^{-1}\left(\frac{7}{3},1\right)-\left(-\frac{11}{5}\right)^{\frac{1}{\frac{7}{3}}}\right]\right],\text{Chop}\left[N\left[I_{-\frac{17}{6}}^{-1}\left(\frac{13}{4},1\right)-\left(-\frac{17}{6}\right)^{\frac{1}{\frac{13}{4}}}\right]\right],\text{Chop}\left[N\left[I_{-\frac{23}{9}}^{-1}\left(\frac{19}{8},1\right)-\left(-\frac{23}{9}\right)^{\frac{1}{\frac{19}{8}}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: I_{-2.2}^{-1}(2.33333,1.)+(-0.311978-1.36686 i)=0\land I_{-2.83333}^{-1}(3.25,1.)+(-0.782648-1.13386 i)=0\land I_{-2.55556}^{-1}(2.375,1.)+(-0.364417-1.43905 i)=0
    verdict: inconclusive
    kind: domain
    note: "Same as ErfInv: the fixed substitution points fall outside InverseBetaRegularized's well-behaved domain, so neither FullSimplify nor the numeric fallback cleanly decides it."
