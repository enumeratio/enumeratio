    in: N(Arcsch(2))
    out: 0.481_211_825_059_603_447_495
  tex:
    in: N(\mathrm{arcsch}(2))
    out: 0.481\,211\,825\,059\,603\,447\,495
  fullform:
    in: N[ArcCsch[2]]
  wolfram:
    in: N[ArcCsch[2]]
    out: "0.48121182505960347"
    tex:
      in: N\left[\text{csch}^{-1}(2)\right]
      out: "0.481212"
a-pole-at-0:
  epsil:
    in: Arcsch(0)
    out: ComplexInfinity
  tex:
    in: \mathrm{arcsch}(0)
    out: \tilde\infty
  fullform:
    in: ArcCsch[0]
  wolfram:
    in: ArcCsch[0]
arcsch-positiveinfinity:
  epsil:
    in: Arcsch(PositiveInfinity)
    out: "0"
  tex:
    in: \mathrm{arcsch}(\infty)
    out: "0"
  fullform:
    in: ArcCsch[Infinity]
  wolfram:
    in: ArcCsch[Infinity]
a-float-argument-evaluates-directly:
  epsil:
    in: Arcsch(1.5)
    out: 0.625_145_117_250_416_687_636
  tex:
    in: \mathrm{arcsch}(1.5)
    out: 0.625\,145\,117\,250\,416\,687\,636
  fullform:
    in: ArcCsch[1.5]
  wolfram:
    in: ArcCsch[1.5]
as-a-logarithm-arcsch-1-ln-1-sqrt-2:
  epsil:
    in: TrigToExp(Arcsch(1))
    out: Ln(1 + Sqrt(2))
  tex:
    in: \mathrm{TrigToExp}(\mathrm{arcsch}(1))
    out: \ln(1+\sqrt{2})
  fullform:
    in: TrigToExp[ArcCsch[1]]
oddness-pulls-the-sign-out-of-a-symbolic:
  epsil:
    in: Arcsch(-x)
    out: -Arcsch(x)
  tex:
    in: \mathrm{arcsch}(-x)
    out: -\mathrm{arcsch}(x)
  fullform:
    in: ArcCsch[Minus[x]]
derivative-for-real-x-ne-0:
  epsil:
    in: D(Arcsch(x), x)
    out: -1 / (Abs(x) * Sqrt(x ^ 2 + 1))
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\mathrm{arcsch}(x)
    out: -(\vert x\vert\sqrt{x^2+1})^{-1}
  fullform:
    in: D[ArcCsch[x], x]
  wolfram:
    in:
    note: Wolfram writes it as -1/(x^2 Sqrt[1 + 1/x^2]).
