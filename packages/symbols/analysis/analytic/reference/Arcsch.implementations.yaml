as-a-logarithm-arcsch-1-ln-1-sqrt-2:
  epsil:
    in: TrigToExp(Arcsch(1))
    out: Ln(1 + Sqrt(2))
  tex:
    in: \mathrm{TrigToExp}(\mathrm{arcsch}(1))
    out: \ln(1+\sqrt{2})
  fullform:
    in: TrigToExp[ArcCsch[1]]
  wolfram:
    in: TrigToExp[ArcCsch[1]]
oddness-pulls-the-sign-out-of-a-symbolic:
  epsil:
    in: Arcsch(-x)
    out: -Arcsch(x)
  tex:
    in: \mathrm{arcsch}(-x)
    out: -\mathrm{arcsch}(x)
  fullform:
    in: ArcCsch[Minus[x]]
  wolfram:
    in: ArcCsch[Minus[x]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{csch}^{-1}(-x)--\text{csch}^{-1}(x)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{csch}^{-1}\left(-\frac{7}{3}\right)--\text{csch}^{-1}\left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{csch}^{-1}\left(-\left(-\frac{11}{5}\right)\right)--\text{csch}^{-1}\left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{csch}^{-1}\left(-\frac{13}{4}\right)--\text{csch}^{-1}\left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
derivative-for-real-x-ne-0:
  epsil:
    in: D(Arcsch(x), x)
    out: -1 / (Abs(x) * Sqrt(x ^ 2 + 1))
  tex:
    in: \frac{\mathrm{d}\mathrm{arcsch}(x)}{\mathrm{d}x}
    out: -(\vert x\vert\sqrt{x^2+1})^{-1}
  fullform:
    in: D[ArcCsch[x], x]
  wolfram:
    in:
    note: Wolfram writes it as -1/(x^2 Sqrt[1 + 1/x^2]).
