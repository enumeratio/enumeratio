zeta-2-1-zeta-2-pi-2-6-reduces-to-the-ordinary:
  wolfram:
    in: HurwitzZeta[2, 1]
    out: Pi^2/6
    tex:
      in: \zeta (2,1)
      out: \frac{\pi ^2}{6}
  sage:
    in: hurwitz_zeta(2, 1)
    out: 1/6*pi^2
  mpmath:
    in: zeta(2, 1)
    out: "1.64493406684822643647241516665"
  sympy:
    in: zeta(2, 1)
    out: pi**2/6
