pole-at-s-1-for-every-a:
  epsil:
    in: HurwitzZeta(1, 3)
    out: ComplexInfinity
  tex:
    in: \mathrm{HurwitzZeta}(1, 3)
    out: \tilde\infty
  traditional:
    in: \zeta(1, 3)
    out: \tilde\infty
  fullform:
    in: HurwitzZeta[1, 3]
  wolfram:
    in: HurwitzZeta[1, 3]
    out: ComplexInfinity
    tex:
      in: \zeta (1,3)
      out: \text{ComplexInfinity}
  sympy:
    in: zeta(1, 3)
    out: zoo
  mpmath:
    in: zeta(1, 3)
    out: +inf
    verdict: disagree
    kind: undefined-form
    note: "A pole or undefined value: compute-engine answers ComplexInfinity, mpmath gives +inf."
  sage:
    in: hurwitz_zeta(1, 3)
    out: hurwitz_zeta(1, 3)
    verdict: disagree
    kind: undefined-form
    note: The pole is ComplexInfinity here; Sage's hurwitz_zeta(1,3) declines entirely and returns the call unevaluated, a different spelling of the same pole.
zeta-3-7-3-b-4-7-3-4-7813-3240-exact-via-the:
  epsil:
    in: HurwitzZeta(-3, 7 / 3)
    out: -7_813 / 3_240
  tex:
    in: \mathrm{HurwitzZeta}(-3, \frac{7}{3})
    out: -\frac{7\,813}{3\,240}
  traditional:
    in: \zeta(-3, \frac{7}{3})
    out: -\frac{7\,813}{3\,240}
  fullform:
    in: HurwitzZeta[-3, Rational[7, 3]]
  wolfram:
    in: HurwitzZeta[-3, Rational[7, 3]]
    out: HurwitzZeta[-3, 7/3]
    tex:
      in: \zeta \left(-3,\frac{7}{3}\right)
      out: \zeta \left(-3,\frac{7}{3}\right)
    note: Wolfram's $\mathrm{FunctionExpand}$ and machine-precision $N$ agree ($-7813/3240$), but its arbitrary-precision $N[\mathrm{HurwitzZeta}[-3, 7/3], 30]$ is wrong by $1/120$ (a Wolfram numeric-evaluation quirk at nonpositive-integer $s$ with rational $a$); mpmath agrees with us.
  sympy:
    in: zeta(-3, Rational(7, 3))
    out: -7813/3240
  sage:
    in: hurwitz_zeta(-3, (7/3))
    out: -7813/3240
