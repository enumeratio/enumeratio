a-rational-function-with-no-real-poles:
  epsil:
    in: FunctionContinuous((x ^ 2 + 1) ^ -1, x)
    out: True
  tex:
    in: \mathrm{FunctionContinuous}(\frac{1}{x^2+1}, x)
    out: \top
  traditional:
    in: \mathrm{FunctionContinuous}(\frac{1}{x^2+1}, x)
    out: \mathrm{True}
  fullform:
    in: FunctionContinuous[Power[Plus[Power[x, 2], 1], -1], x]
  wolfram:
    in: FunctionContinuous[Power[Plus[Power[x, 2], 1], -1], x]
sqrt-of-an-always-positive-quantity:
