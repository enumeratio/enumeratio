psi-x-is-the-trigamma-psi-1-x:
  epsil:
    in: D(Digamma(x), x)
    out: Trigamma(x)
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\mathrm{Digamma}(x)
    out: \mathrm{Trigamma}(x)
  traditional:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\psi(x)
    out: \mathrm{Trigamma}(x)
  fullform:
    in: D[PolyGamma[x], x]
  wolfram:
    in:
    note: Wolfram writes the derivative as $\mathrm{PolyGamma}[1, x]$; compute-engine names it `Trigamma`.
