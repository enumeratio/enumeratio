beta-2k-e-2k-2-and-beta-2k-1-0:
  epsil:
    in: DirichletBeta([0, -1, -2, -3, -4])
    out: "[1 / 2, 0, -1 / 2, 0, 5 / 2]"
  tex:
    in: \mathrm{DirichletBeta}(\bigl\lbrack0, -1, -2, -3, -4\bigr\rbrack)
    out: \bigl\lbrack\frac{1}{2}, 0, -\frac{1}{2}, 0, \frac{5}{2}\bigr\rbrack
  fullform:
    in: DirichletBeta[List[0, -1, -2, -3, -4]]
  wolfram:
    in: DirichletBeta[List[0, -1, -2, -3, -4]]
    out: "{1/2, 0, -1/2, 0, 5/2}"
    tex:
      in: \beta (\{0,-1,-2,-3,-4\})
      out: \left\{\frac{1}{2},0,-\frac{1}{2},0,\frac{5}{2}\right\}
even-s-ge-4-has-no-closed-form-and-stays:
  epsil:
    in: DirichletBeta(4)
    out: DirichletBeta(4)
  tex:
    in: \mathrm{DirichletBeta}(4)
    out: \mathrm{DirichletBeta}(4)
  traditional:
    in: \beta(4)
    out: \beta(4)
  fullform:
    in: DirichletBeta[4]
  wolfram:
    in: DirichletBeta[4]
    out: (Zeta[4, 1/4]/16 - Zeta[4, 3/4]/16)/16
    tex:
      in: \beta (4)
      out: \frac{1}{16} \left(\frac{\zeta \left(4,\frac{1}{4}\right)}{16}-\frac{\zeta \left(4,\frac{3}{4}\right)}{16}\right)
    verdict: disagree
    kind: unevaluated
    note: Stays symbolic here; Wolfram rewrites it via $\zeta(4, 1/4)$ and $\zeta(4, 3/4)$ instead of a further-reduced number.
