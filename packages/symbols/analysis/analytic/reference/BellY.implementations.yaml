belly-4-2-list-x1-x2-x3:
  epsil:
    in: BellY(4, 2, [x1, x2, x3])
    out: 3 * x2 ^ 2 + 4 * x1 * x3
  tex:
    in: \mathrm{BellY}(4, 2, \bigl\lbrack\mathrm{x1}, \mathrm{x2}, \mathrm{x3}\bigr\rbrack)
    out: 3\mathrm{x2}^2+4\mathrm{x1}\mathrm{x3}
  fullform:
    in: BellY[4, 2, List[x1, x2, x3]]
