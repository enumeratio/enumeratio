- id: sign-neg-3
  expr: [Sign, -3]
  expected: -1
- id: sign-3
  expr: [Sign, 3]
  expected: 1
- id: zero-is-its-own-sign
  expr: [Sign, 0]
  expected: 0
  caption: Zero is its own sign
- id: sign-neg-1-over-2
  expr: [Sign, [Rational, -1, 2]]
  expected: -1
- id: the-unit-complex-number-pointing-the-same
  expr: [Sign, [Complex, 3, 4]]
  expected: [Complex, [Rational, 3, 5], [Rational, 4, 5]]
  caption: The unit complex number pointing the same direction as $3+4i$
- id: threads-element-wise-over-a-list
  expr: [Sign, [List, -3, 0, 7]]
  expected: [List, -1, 0, 1]
  caption: Threads element-wise over a list
- id: sign-z-z-z-see-abs
  expr: [Equal, [Sign, [Complex, 3, 4]], [Divide, [Complex, 3, 4], [Abs, [Complex, 3, 4]]]]
  expected: True
  category: Properties
  caption: $\operatorname{sign}(z) = z/|z|$. See [[Abs]]
- id: x-cdot-sign-x-x-here-at-x-5
  expr: [Equal, [Multiply, -5, [Sign, -5]], [Abs, -5]]
  expected: True
  category: Properties
  caption: $x \cdot \operatorname{sign}(x) = |x|$, here at $x = -5$
- id: tells-you-the-temperature-dropped-but-not-by-how
  expr: [Sign, [Subtract, 70, 95]]
  expected: -1
  category: Applications
  caption: Tells you the temperature dropped, but not by how much -- for that, see [[Abs]]
- id: nan-propagates-rather-than-being-treated-as-0
  expr: [Sign, NaN]
  expected: NaN
  category: Possible issues
  caption: NaN propagates rather than being treated as 0
- id: sign-neg-2p5
  expr: [Sign, -2.5]
  expected: -1
- id: sign-3p14
  expr: [Sign, 3.14]
  expected: 1
- id: a-complex-number-with-approximate-parts
  expr: [Sign, [Complex, 1.4, 2.3]]
  expected: [Complex, { num: "0.5199469468957452168102" }, 0.8541985556144385]
  caption: A complex number with approximate parts
- id: an-exact-complex-argument-comes-back-exact-sign
  expr: [Sign, [Complex, 1, 1]]
  expected: [Complex, [Divide, [Sqrt, 2], 2], [Divide, [Sqrt, 2], 2]]
  category: Scope
  caption: 'An exact complex argument comes back exact: $\mathrm{sign}(1+i) = (1+i)/\sqrt{2}$'
- id: threads-over-a-matrix-entry-by-entry
  expr: [Sign, [List, [List, [Rational, 1, 2], -1], [List, [Rational, -5, 3], [Rational, 1, 2]]]]
  expected: [List, [List, 1, -1], [List, -1, 1]]
  category: Scope
  caption: Threads over a matrix, entry by entry
- id: exact-numeric-constants
  expr: [Sign, Pi]
  expected: 1
  category: Scope
  caption: Exact numeric constants
- id: sign-neg-exponentiale
  expr: [Sign, [Negate, ExponentialE]]
  expected: -1
  category: Scope
- id: sign-imaginaryunit
  expr: [Sign, ImaginaryUnit]
  expected: [Complex, 0, 1]
  category: Scope
- id: sign-positiveinfinity
  expr: [Sign, PositiveInfinity]
  expected: 1
  category: Scope
- id: an-interval-entirely-above-0-has-sign-1
  expr: [Sign, [Interval, 1, 3]]
  expected: 1
  category: Scope
  caption: An [[Interval]] entirely above 0 has sign 1
- id: decides-the-sign-of-the-exact-number-sqrt-2-2-by
  expr: [Sign, [Subtract, [Sqrt, 2], 2]]
  expected: -1
  category: Scope
