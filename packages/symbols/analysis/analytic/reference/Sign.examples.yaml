- id: 2-sqrt-2-is-the-same-certified-decision-the
  expr: [Sign, [Subtract, 2, [Sqrt, 2]]]
  expected: 1
  category: Scope
  caption: $2-\sqrt{2}$ is the same certified decision, the other way
- id: the-sign-of-a-nonzero-complex-number-lies-on-the
  expr: [Equal, [Abs, [Sign, [Complex, 3, 4]]], 1]
  expected: True
  category: Properties
  caption: The sign of a nonzero complex number lies on the unit circle
