name: BarnesG
domain: Special functions
signature: BarnesG(z)
summary: The Barnes G-function $G(z)$, the double-gamma function satisfying $G(z+1) = \Gamma(z)\,G(z)$ with $G(1) = 1$ — so $G(n) = \prod_{k=0}^{n-2} k!$, the superfactorial, at positive integers. Provided by `@enumeratio/analytic`.
signatures:
  - call: BarnesG(z)
    description: the Barnes G-function $G(z)$.
    library: "@enumeratio/analytic"
details:
  - Functional equation $G(z+1) = \Gamma(z)\,G(z)$, the analogue of $\Gamma(z+1) = z\,\Gamma(z)$ one level up; see [[Gamma]].
  - 'At positive integers $G(n) = 0!\,1!\,2!\cdots(n-2)!$ — the superfactorial: $G(1) = G(2) = G(3) = 1$, $G(4) = 2$, $G(5) = 12$, $G(6) = 288$, $G(7) = 34560$. Exact and arbitrarily large.'
  - Zeros at the nonpositive integers $0, -1, -2, \dots$ (where $\Gamma$ has poles); entire, with no poles of its own.
  - "Numeric evaluation exponentiates [[LogBarnesG]]: the asymptotic series for $\\ln G(z+1)$ for large $\\operatorname{Re}(z)$, reached through the functional equation in logarithms. Complex $z$ supported; aligned with Wolfram's $\\mathrm{BarnesG}[z]$."
  - The value itself overflows a double past $|z| \approx 60$ (G(60) $\approx 4.6\times10^{1971}$); use [[LogBarnesG]] there, or stay exact at integers.
examples:
  - id: g-5-0-1-2-3-12
    expr: [BarnesG, 5]
    expected: 12
    caption: $G(5) = 0!\,1!\,2!\,3! = 12$
  - id: g-7-34560
    expr: [BarnesG, 7]
    expected: 34560
    caption: $G(7) = 34560$
  - id: the-superfactorials-threaded-over-a-list
    expr: [BarnesG, [List, 1, 2, 3, 4, 5, 6]]
    expected: [List, 1, 1, 1, 2, 12, 288]
    caption: The superfactorials, threaded over a list
  - id: g-vanishes-at-the-nonpositive-integers
    expr: [BarnesG, 0]
    expected: 0
    category: Properties
    caption: $G$ vanishes at the nonpositive integers
  - id: all-of-them
    expr: [BarnesG, -3]
    expected: 0
    category: Properties
    caption: …all of them
  - id: a-floating-point-argument-evaluates-numerically
    expr: [BarnesG, 2.5]
    expected: 0.9475739010840627
    caption: A floating-point argument evaluates numerically
  - id: an-exact-non-integer-argument-stays-symbolic
    expr: [BarnesG, [Rational, 5, 2]]
    expected: [BarnesG, [Rational, 5, 2]]
    category: Possible issues
    caption: An exact non-integer argument stays symbolic under plain evaluation (use N(); Wolfram's closed form in Glaisher's constant is not reproduced)
  - id: g-10-prod-k-0-8-k-exact
    expr: [BarnesG, 10]
    expected: 5056584744960000
    caption: $G(10) = \prod_{k=0}^{8} k!$, exact
  - id: g-3-0-1-1
    expr: [BarnesG, 3]
    expected: 1
    caption: $G(3) = 0!\,1! = 1$
  - id: g-frac-12-to-machine-precision
    expr: [BarnesG, 0.5]
    expected: 0.6032442812095893
    caption: $G(\tfrac12)$ to machine precision
  - id: complex-arguments
    expr: [BarnesG, [Complex, 1.3, 1]]
    expected: [Complex, 1.4446139350503153, -0.2985488252115687]
    category: Scope
    caption: Complex arguments
  - id: negative-non-integer-arguments-between-the-zeros
    expr: [BarnesG, -2.5]
    expected: 0.07617297965688405
    category: Scope
    caption: Negative non-integer arguments, between the zeros
  - id: threads-elementwise-over-an-array
    expr: [BarnesG, [List, [List, [Rational, 1, 2], 1], [List, 1, [Rational, 1, 2]]]]
    expected: [List, [List, [BarnesG, [Rational, 1, 2]], 1], [List, 1, [BarnesG, [Rational, 1, 2]]]]
    category: Scope
    caption: Threads elementwise over an array
  - id: g-infty-infty
    expr: [BarnesG, PositiveInfinity]
    expected: PositiveInfinity
    category: Scope
    caption: $G(\infty) = \infty$
  - id: interval-arithmetic-g-is-increasing-on-1-17-1-18
    expr: [BarnesG, [Interval, 1.17, 1.18]]
    expected: [Interval, 1.05221632868619, 1.0541936064357]
    category: Scope
    caption: "Interval arithmetic, proven: $G$'s certified derivative keeps one sign on $[1.17, 1.18]$, so the image is its values at the ends, rounded outward"
  - id: uncertainty-propagation-g-2-1-pm-0-01-0-98477-pm
    expr: [BarnesG, [Around, 2.1, 0.01]]
    expected: [Around, 0.9847727243540465, 0.001449505695943639]
    category: Scope
    caption: "Uncertainty propagation: $G(2.1 \\pm 0.01) = 0.98477 \\pm 0.00145$, to first order in $G'$"
  - id: the-hyperfactorial-h-n-gamma-n-1-n-g-n-1-here
    expr: [Divide, [Power, [Gamma, 6], 5], [BarnesG, 6]]
    expected: 86400000
    category: Properties
    caption: 'The hyperfactorial $H(n) = \Gamma(n+1)^n / G(n+1)$: here $120^5/288 = H(5)$'
  - id: to-30-significant-digits-not-yet-the-requested
    expr: [N, [BarnesG, [Rational, 1, 2]], 30]
    expected: { num: "0.603244281209446206191429224535" }
    category: Scope
    caption: To 30 significant digits, past a double's reach
  - role: test
    id: g-1-1
    expr: [BarnesG, 1]
    expected: 1
  - role: test
    id: g-2-1
    expr: [BarnesG, 2]
    expected: 1
  - role: test
    id: g-4-2
    expr: [BarnesG, 4]
    expected: 2
  - role: test
    id: g-6-288
    expr: [BarnesG, 6]
    expected: 288
  - role: test
    id: barnesg-of-a-symbol-stays-symbolic
    expr: [BarnesG, z]
    expected: [BarnesG, z]
  - role: test
    id: n-barnesg-5-over-2
    expr: [N, [BarnesG, [Rational, 5, 2]]]
    expected: { num: "0.947573901083825776884" }
bindings:
  - origin: reference
    form: notatio
    environment: engine
    expr:
      [
        Exp,
        [
          Add,
          [Divide, [Multiply, [Subtract, _z, 1], [Ln, [Multiply, 2, Pi]]], 2],
          [Negate, [Divide, [Multiply, [Subtract, _z, 1], [Add, [Subtract, _z, 1], 1]], 2]],
          [Negate, [Divide, [Multiply, EulerGamma, [Power, [Subtract, _z, 1], 2]], 2]],
          [
            Sum,
            [
              Add,
              [Multiply, k, [Ln, [Add, 1, [Divide, [Subtract, _z, 1], k]]]],
              [Divide, [Power, [Subtract, _z, 1], 2], [Multiply, 2, k]],
              [Negate, [Subtract, _z, 1]],
            ],
            [Triple, k, 1, Infinity],
          ],
        ],
      ]
    note: G = exp(ln G) over the Weierstrass series of [[LogBarnesG]]; see there for what it costs to evaluate.
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/barnes-g.ts
    note: exp of the LogBarnesG kernel; exact superfactorials at the integers come from the head.
  - origin: mapped
    form: wolfram / mpmath
    environment: external
    note: BarnesG[z] and mpmath.barnesg(z), same normalisation.
seeAlso:
  - LogBarnesG
  - Gamma
  - LogGamma
  - Factorial
