identical-to-log2:
  epsil:
    in: Lb(64) == Log2(64)
    out: True
  tex:
    in: \log_{2}(64)=\log_{2}(64)
    out: \top
  traditional:
    in: \log_{2}(64)=\log_{2}(64)
    out: \mathrm{True}
  fullform:
    in: Equal[Log2[64], Log2[64]]
    back: [Equal, [Log2, 64], [Log2, 64]]
  wolfram:
    in: (Log2[64] == Log2[64])
    out: True
    tex:
      in: \log _2(64)=\log _2(64)
      out: \text{True}
same-exact-negative-power-fold-as-log2-lb-frac:
  epsil:
    in: Lb(1 / 8)
    out: "-3"
  tex:
    in: \log_{2}(\frac{1}{8})
    out: "-3"
  fullform:
    in: Log2[Rational[1, 8]]
    back: [Log2, [Rational, 1, 8]]
  wolfram:
    in: Log2[Rational[1, 8]]
    out: "-3"
    tex:
      in: \log _2\left(\frac{1}{8}\right)
      out: "-3"
