same-as-log2-the-logarithm-of-complex-infinity:
  epsil:
    in: Lb(ComplexInfinity)
    out: PositiveInfinity
  tex:
    in: \log_{2}(\tilde\infty)
    out: \infty
  fullform:
    in: Log2[ComplexInfinity]
    back: [Log2, ComplexInfinity]
  wolfram:
    in: Log2[ComplexInfinity]
