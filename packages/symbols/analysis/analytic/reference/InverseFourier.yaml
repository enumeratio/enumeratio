name: InverseFourier
domain: Transforms
signature: InverseFourier(list)
summary: The numeric inverse discrete Fourier transform — [[Fourier]] with the `FourierParameters` sign flipped, $\{a, b\} \to \{-a, -b\}$ (confirmed against wolframscript), so it shares that head's kernel exactly.
signatures:
  - call: InverseFourier(list)
    description: the inverse discrete Fourier transform of a numeric list, or a rectangular numeric matrix.
    library: "@enumeratio/analytic"
  - call: InverseFourier(list, FourierParameters -> {a, b})
    description: equivalent to `Fourier(list, FourierParameters -> {-a, -b})`.
    library: "@enumeratio/analytic"
details:
  - Everything [[Fourier]]'s own details say about numeric-only evaluation, the separable 2D case, and $O(n^2)$ summation applies here too — this head is that same kernel with the parameters negated.
primitive: kernel
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/fourier-transform.ts
seeAlso:
  - Fourier
  - InverseFourierTransform
