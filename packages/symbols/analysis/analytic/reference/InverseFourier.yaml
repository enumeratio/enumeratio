name: InverseFourier
domain: Transforms
signature: InverseFourier(list)
summary: The numeric inverse discrete Fourier transform — [[Fourier]] with the `FourierParameters` sign flipped, $\{a, b\} \to \{-a, -b\}$ (confirmed against wolframscript), so it shares that head's kernel exactly.
signatures:
  - call: InverseFourier(list)
    description: the inverse discrete Fourier transform of a numeric list, or a rectangular numeric matrix.
    library: "@enumeratio/analytic"
  - call: InverseFourier(list, FourierParameters -> {a, b})
    description: equivalent to `Fourier(list, FourierParameters -> {-a, -b})`.
    library: "@enumeratio/analytic"
details:
  - Everything [[Fourier]]'s own details say about numeric-only evaluation, the separable 2D case, and $O(n^2)$ summation applies here too — this head is that same kernel with the parameters negated.
examples:
  - id: inverse-dft-of-1-2-3-4
    expr: [InverseFourier, [List, 1, 2, 3, 4]]
    expected: [List, 5, [Complex, -1, 1], -1, [Complex, -1, -1]]
    caption: The inverse DFT of $\{1, 2, 3, 4\}$ — the conjugate kernel of [[Fourier]]
  - id: round-trips-through-fourier
    expr: [Fourier, [InverseFourier, [List, 1, 2, 3, 4]]]
    expected: [List, 1, 2, 3, 4]
    caption: Round-trips exactly through [[Fourier]]
  - id: a-2x2-matrix
    expr: [InverseFourier, [List, [List, 5, -1], [List, -2, 0]]]
    expected: [List, [List, 1, 2], [List, 3, 4]]
    category: Scope
    caption: The inverse of [[Fourier]]'s $2\times2$ matrix example
  - id: a-custom-fourierparameters
    expr: [InverseFourier, [List, 1, 2, 3, 4], [KeyValuePair, FourierParameters, [List, 1, -1]]]
    expected: [List, 2.5, [Complex, -0.5, -0.5], -0.5, [Complex, -0.5, 0.5]]
    category: Scope
    caption: A custom `FourierParameters -> {1, -1}`, equivalent to `Fourier(list, FourierParameters -> {-1, 1})`
  - id: declines-a-symbolic-list
    expr: [InverseFourier, [List, a, b]]
    expected: [InverseFourier, [List, a, b]]
    category: Possible issues
    caption: Declines a symbolic list, exactly like [[Fourier]]
primitive: kernel
implementations:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/fourier-transform.ts
seeAlso:
  - Fourier
  - InverseFourierTransform
