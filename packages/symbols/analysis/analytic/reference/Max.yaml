name: Max
domain: Arithmetic
signature: Max(a, b, …)
summary: The largest of its arguments.
signatures:
  - call: Max(a, b, …)
    description: the largest of two or more values.
  - call: Max(list)
    description: the largest value in a list.
details:
  - The largest of its arguments, or of a single list argument.
  - Multiple arguments -- lists included -- are flattened into one pool rather than compared pairwise or threaded element-wise. See [[Min]].
  - "Commutative and associative: order and grouping don't matter."
  - 'NaN poisons the result: it beats every other comparison, even $+\infty$.'
  - With no arguments, compute-engine returns NaN rather than $-\infty$, the true identity element.
examples:
  - id: max-3-1-4-1-5
    expr: [Max, 3, 1, 4, 1, 5]
    expected: 5
  - id: also-accepts-a-single-list-argument
    expr: [Max, [List, 3, 1, 4]]
    expected: 4
    caption: Also accepts a single list argument
  - id: max-neg-1-neg-5
    expr: [Max, -1, -5]
    expected: -1
  - id: a-single-argument-is-returned-unchanged
    expr: [Max, 3]
    expected: 3
    caption: A single argument is returned unchanged
  - id: commutative-order-doesn-t-matter
    expr: [Equal, [Max, 3, 7], [Max, 7, 3]]
    expected: True
    category: Properties
    caption: "Commutative: order doesn't matter"
  - id: multiple-list-arguments-are-flattened-into-one
    expr: [Equal, [Max, [List, 3, 1, 4], [List, 9, 2]], 9]
    expected: True
    category: Properties
    caption: Multiple list arguments are flattened into one pool rather than compared pairwise
  - id: the-day-s-high-from-a-handful-of-hourly-readings
    expr: [Max, 68, 72, 65, 80, 74]
    expected: 80
    category: Applications
    caption: The day's high from a handful of hourly readings. See [[Min]]
  - id: with-no-arguments-compute-engine-returns-nan
    expr: [Max]
    expected: NaN
    category: Possible issues
    caption: With no arguments, compute-engine returns NaN rather than $-\infty$, the true identity element
    divergence:
      wolfram: Max of nothing is NaN here; Wolfram returns the identity element -Infinity.
  - id: nan-poisons-the-result-overriding-every-other
    expr: [Max, NaN, 3]
    expected: NaN
    category: Possible issues
    caption: NaN poisons the result, overriding every other argument
  - id: max-9-2
    expr: [Max, 9, 2]
    expected: 9
  - id: max-list-4-1-7-2
    expr: [Max, [List, 4, 1, 7, 2]]
    expected: 7
  - id: max-5p56-neg-4p8-7p3
    expr: [Max, 5.56, -4.8, 7.3]
    expected: 7.3
  - id: nested-lists-are-flattened-into-the-pool
    expr:
      [Max, 2, 3, [List, [List, [Rational, 1, 2], -1], [List, [Rational, -5, 3], [Rational, 1, 2]]]]
    expected: 3
    category: Scope
    caption: Nested lists are flattened into the pool
  - id: exact-numbers-are-compared-numerically
    expr: [Max, [Sqrt, 2], [Rational, 3, 2]]
    expected: [Rational, 3, 2]
    category: Scope
    caption: Exact numbers are compared numerically
  - id: max-1-positiveinfinity
    expr: [Max, 1, PositiveInfinity]
    expected: PositiveInfinity
    category: Scope
  - id: the-numeric-arguments-collapse-to-their-maximum
    expr: [Max, 3, x, 5]
    expected: [Max, 5, x]
    category: Scope
    caption: The numeric arguments collapse to their maximum; symbolic ones stay
  - id: compares-exact-constants-numerically-max-e-pi-2
    expr: [Max, [List, ExponentialE, Pi, 2]]
    expected: Pi
    category: Scope
    caption: 'Compares exact constants numerically: $\max(e, \pi, 2) = \pi$'
  - id: the-max-of-two-intervals-is-the-interval-of
    expr: [Max, [Interval, 1, 3], [Interval, -3, 5]]
    expected: [Interval, 1, 5]
    category: Scope
    caption: The max of two [[Interval]]s is the interval of possible maxima, $[1, 5]$
  - id: idempotent-max-x-x-x
    expr: [Max, x, x]
    expected: x
    category: Properties
    caption: 'Idempotent: $\max(x, x) = x$'
  - id: the-max-of-an-empty-list-is-nan-too
    expr: [Max, [List]]
    expected: NaN
    category: Possible issues
    caption: The max of an empty list is NaN too
    divergence:
      wolfram: Wolfram's $\mathrm{Max}[\{\}]$ is the identity element $-\infty$.
seeAlso:
  - Min
  - Clamp
