name: EllipticTheta
domain: Special functions
signature: EllipticTheta(a, u, q)
summary: The Jacobi theta function $\vartheta_a(u,q)$, $a=1,2,3,4$ (DLMF 20.2), Wolfram's nome convention $|q|<1$.
signatures:
  - call: EllipticTheta(a, u, q)
    description: the a-th Jacobi theta function (a = 1, 2, 3, or 4), argument u, nome q.
    library: "@enumeratio/analytic"
details:
  - $q$ is the nome, $|q| < 1$ — the same convention mpmath's `jtheta(a, u, q)` uses, not the "half-period ratio" $\tau$ some other references parameterize by.
  - Direct q-series (DLMF 20.2.1-20.2.4), term-summed until three consecutive terms fall under $10^{-15}$ or 20000 terms are reached.
  - Declines when $|q| \ge 1$ (the series does not converge there at all), or when $|q|$ is close enough to 1 that convergence isn't reached within that term cap — no modular (Jacobi imaginary) transform is implemented to extend the series further.
  - $a$ must be a concrete integer 1, 2, 3, or 4; any other value (including a symbolic a) stays unevaluated.
  - Verified against mpmath's `jtheta` and a Wolfram kernel at complex u, complex q, AND real negative q.
  - Numeric only — a symbolic u or q stays unevaluated; a floating-point argument (or `N()`) evaluates directly.
seeAlso:
  - EllipticThetaPrime
  - JacobiSN
