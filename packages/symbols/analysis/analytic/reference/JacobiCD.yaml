name: JacobiCD
domain: Special functions
signature: JacobiCD(u, m)
summary: The Jacobi elliptic function $\operatorname{cd}(u,m) = \operatorname{cn}(u,m)/\operatorname{dn}(u,m)$ (Glaisher's notation), in Wolfram/mpmath's $m=k^2$ convention.
signatures:
  - call: JacobiCD(u, m)
    description: the Jacobi elliptic function cd, argument u, parameter m.
    library: "@enumeratio/analytic"
details:
  - $m = k^2$, the same convention [[EllipticK]] / [[EllipticF]] use.
  - $\operatorname{cd}(u,m) = \operatorname{cn}(u,m)/\operatorname{dn}(u,m)$ — [[JacobiCN]] and [[JacobiDN]] share this head's numeric kernel and exact-value coverage (m outside [0,1] via the reciprocal- and imaginary-modulus transformations, complex u, a genuinely complex m declined).
  - cd(0,m) = 1, for any m.
  - Numeric only — a symbolic argument stays unevaluated; a floating-point argument (or `N()`) evaluates directly.
examples:
  - id: a-floating-point-argument-evaluates-directly-to
    expr: [N, [JacobiCD, 0.3, 0.5]]
    expected: 0.9772503364442499
    caption: A floating-point argument evaluates directly to a decimal
  - id: u-0-is-1-for-any-m
    expr: [JacobiCD, 0, m]
    expected: 1
    category: Properties
    caption: u = 0 is 1, for any m
  - id: m-greater-than-1-via-the-reciprocal-modulus
    expr: [N, [JacobiCD, 0.3, 1.5]]
    expected: 1.023633106578735
    category: Scope
    caption: m greater than 1, via the reciprocal-modulus transformation
  - id: symbolic-arguments-are-left-unevaluated-rather
    expr: [JacobiCD, u, m]
    expected: [JacobiCD, u, m]
    category: Possible issues
    caption: Symbolic arguments are left unevaluated rather than guessed at
seeAlso:
  - JacobiCN
  - JacobiDN
  - JacobiDC
