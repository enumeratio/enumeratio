- id: dft-of-1-2-3-4
  expr: [Fourier, [List, 1, 2, 3, 4]]
  expected: [List, 5, [Complex, -1, -1], -1, [Complex, -1, 1]]
  caption: The DFT of $\{1, 2, 3, 4\}$
- id: round-trips-through-inversefourier
  expr: [InverseFourier, [Fourier, [List, 1, 2, 3, 4]]]
  expected: [List, 1, 2, 3, 4]
  caption: Round-trips exactly through [[InverseFourier]]
- id: a-2x2-matrix-the-separable-2d-transform
  expr: [Fourier, [List, [List, 1, 2], [List, 3, 4]]]
  expected: [List, [List, 5, -1], [List, -2, 0]]
  category: Scope
  caption: A $2\times2$ matrix — the separable 2D transform
- id: a-custom-fourierparameters
  expr: [Fourier, [List, 1, 2, 3, 4], [KeyValuePair, FourierParameters, [List, 1, -1]]]
  expected: [List, 10, [Complex, -2, 2], -2, [Complex, -2, -2]]
  category: Scope
  caption: A custom `FourierParameters -> {1, -1}`
- id: declines-a-symbolic-list
  expr: [Fourier, [List, a, b]]
  expected: [Fourier, [List, a, b]]
  category: Possible issues
  caption: Declines a symbolic list, as Wolfram's `Fourier::fftl` does
