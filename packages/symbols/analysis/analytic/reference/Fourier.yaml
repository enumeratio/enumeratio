name: Fourier
domain: Transforms
signature: Fourier(list)
summary: The numeric discrete Fourier transform of a list, or of a rectangular matrix (a separable 2D transform), under Wolfram's default $\mathrm{FourierParameters} \to \{0, 1\}$ — $f_s = \frac{1}{\sqrt n}\sum_r \mathrm{list}_r\, e^{2\pi i (r-1)(s-1)/n}$.
signatures:
  - call: Fourier(list)
    description: the discrete Fourier transform of a numeric list, or a rectangular numeric matrix.
    library: "@enumeratio/analytic"
  - call: Fourier(list, FourierParameters -> {a, b})
    description: the general two-parameter transform $f_s = \sqrt{|b|/n^{1-a}}\sum_r \mathrm{list}_r\, e^{2\pi i b (r-1)(s-1)/n}$.
    library: "@enumeratio/analytic"
details:
  - Always numeric, matching Wolfram exactly — even an all-exact input like `Fourier({0, 0, 0})` comes back as machine floats there, never a symbolic or exact result, so this declines (stays unevaluated) rather than fabricate an exact answer for anything that isn't already a concrete numeric list or matrix.
  - A rectangular matrix gets the 2D transform, separable into the 1D transform along each dimension in turn; both dimensions' `FourierParameters` prefactors are folded into a single multiplication at the end rather than applied one dimension at a time, which avoids the extra rounding two separate `Sqrt`s would otherwise leave in every entry.
  - Direct $O(n^2)$ summation, not an FFT — correct for any $n$ and fast enough at the sizes these heads see in practice; a genuinely large transform would want a radix-2 or Bluestein implementation instead.
  - "Declined: a symbolic entry, an empty list, a ragged nested list, a list more than two levels deep, or an `FourierParameters` option that isn't a 2-element real list."
examples:
  - id: dft-of-1-2-3-4
    expr: [Fourier, [List, 1, 2, 3, 4]]
    expected: [List, 5, [Complex, -1, -1], -1, [Complex, -1, 1]]
    caption: The DFT of $\{1, 2, 3, 4\}$
  - id: round-trips-through-inversefourier
    expr: [InverseFourier, [Fourier, [List, 1, 2, 3, 4]]]
    expected: [List, 1, 2, 3, 4]
    caption: Round-trips exactly through [[InverseFourier]]
  - id: a-2x2-matrix-the-separable-2d-transform
    expr: [Fourier, [List, [List, 1, 2], [List, 3, 4]]]
    expected: [List, [List, 5, -1], [List, -2, 0]]
    category: Scope
    caption: A $2\times2$ matrix — the separable 2D transform
  - id: a-custom-fourierparameters
    expr: [Fourier, [List, 1, 2, 3, 4], [KeyValuePair, FourierParameters, [List, 1, -1]]]
    expected: [List, 10, [Complex, -2, 2], -2, [Complex, -2, -2]]
    category: Scope
    caption: A custom `FourierParameters -> {1, -1}`
  - id: declines-a-symbolic-list
    expr: [Fourier, [List, a, b]]
    expected: [Fourier, [List, a, b]]
    category: Possible issues
    caption: Declines a symbolic list, as Wolfram's `Fourier::fftl` does
primitive: kernel
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/fourier-transform.ts
seeAlso:
  - InverseFourier
  - FourierSeries
  - FourierTransform
