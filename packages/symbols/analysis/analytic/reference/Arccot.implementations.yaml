arccot-1-3-pi-4-on-compute-engine-s-range-0-pi:
  wolfram:
    in: Subtract[Divide[Pi, 2], ArcTan[-1]]
    note: Wolfram's ArcCot[x] = ArcTan[1/x] on (-π/2, π/2], so ArcCot[-1] = -π/4.
