  fullform:
    in: Subtract[Divide[Pi, 2], ArcTan[Minus[Sqrt[3]]]]
    back: [Subtract, [Divide, Pi, 2], [Arctan, [Negate, [Sqrt, 3]]]]
  wolfram:
    in: Subtract[Divide[Pi, 2], ArcTan[Minus[Sqrt[3]]]]
