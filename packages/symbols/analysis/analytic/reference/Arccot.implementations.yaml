derivative-frac-1-1-x-2:
  epsil:
    in: D(Arccot(x), x)
    out: -1 / (x ^ 2 + 1)
  tex:
    in: \frac{\mathrm{d}}{\mathrm{d}x}\mathrm{arcctg}(x)
    out: -\frac{1}{x^2+1}
  fullform:
    in: D[Subtract[Divide[Pi, 2], ArcTan[x]], x]
    back: [D, [Subtract, [Divide, Pi, 2], [Arctan, x]], x]
arccot-sqrt-3-frac-5-pi-6-past-pi-2-not-mirrored:
