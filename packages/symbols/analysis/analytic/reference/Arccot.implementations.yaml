pi-4-numerically-n-forces-the-fold-plain:
  epsil:
    in: N(Arccot(1))
    out: 0.785_398_163_397_448_309_616
  tex:
    in: N(\mathrm{arcctg}(1))
    out: 0.785\,398\,163\,397\,448\,309\,616
  fullform:
    in: N[Subtract[Divide[Pi, 2], ArcTan[1]]]
    back: [N, [Subtract, [Divide, Pi, 2], [Arctan, 1]]]
  wolfram:
    in: N[Subtract[Divide[Pi, 2], ArcTan[1]]]
    out: "0.7853981633974483"
    tex:
      in: N\left[\frac{\pi }{2}-\tan ^{-1}(1)\right]
      out: "0.785398"
undoes-cot-cot-arccot-x-x:
  epsil:
    in: Cot(Arccot(1)) == 1
    out: True
  tex:
    in: \cot(\mathrm{arcctg}(1))=1
    out: \top
  traditional:
    in: \cot(\mathrm{arcctg}(1))=1
    out: \mathrm{True}
  fullform:
    in: Equal[Cot[Subtract[Divide[Pi, 2], ArcTan[1]]], 1]
    back: [Equal, [Cot, [Subtract, [Divide, Pi, 2], [Arctan, 1]]], 1]
  wolfram:
    in: (Cot[Subtract[Divide[Pi, 2], ArcTan[1]]] == 1)
    out: True
    tex:
      in: \cot \left(\frac{\pi }{2}-\tan ^{-1}(1)\right)=1
      out: \text{True}
folds-to-pi-4-exactly-as-arctan-does-at-1:
  epsil:
    in: Arccot(1)
    out: 1 / 4 * Pi
  tex:
    in: \mathrm{arcctg}(1)
    out: \frac{\pi}{4}
  fullform:
    in: Subtract[Divide[Pi, 2], ArcTan[1]]
    back: [Subtract, [Divide, Pi, 2], [Arctan, 1]]
  wolfram:
    in: Subtract[Divide[Pi, 2], ArcTan[1]]
