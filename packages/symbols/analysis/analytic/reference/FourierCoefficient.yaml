name: FourierCoefficient
domain: Transforms
signature: FourierCoefficient(f, x, n)
summary: The $n$-th complex Fourier coefficient of $f$ on $[-\pi, \pi]$, $c_n = \frac{1}{2\pi}\int_{-\pi}^{\pi} f(x)\, e^{-inx}\,dx$, for a concrete integer $n$ — a curated set of closed forms, not compute-engine's `Integrate`.
signatures:
  - call: FourierCoefficient(f, x, n)
    description: $c_n$, for a concrete integer $n$.
    library: "@enumeratio/analytic"
details:
  - "Covered, combined by linearity (a sum, a negation, a constant factor free of $x$):"
  - '- a trig monomial $\cos(x)^p \sin(x)^q$ (nonnegative integer $p, q$ — a plain $\cos(x)$ or $\sin(x)$ is $p=1,q=0$ or $p=0,q=1$), via the exponential binomial expansion $\cos(x) = (E+E^{-1})/2$, $\sin(x) = (E-E^{-1})/(2i)$, $E = e^{ix}$ -- exact, and what covers a "sin/cos polynomial" like $\cos^2(x)$ (checked against Wolfram directly).'
  - '- $\cos(mx)$ / $\sin(mx)$ for a nonzero integer $m$ -- one resonant pair of terms.'
  - "- $x$, $x^2$, $|x|$: the standard sawtooth, parabola, and triangle-wave coefficients."
  - '- $e^{ax}$ for a nonzero real constant $a$: $c_n = (-1)^n \sinh(a\pi)/(\pi(a - in))$.'
  - 'Declined, on purpose: a symbolic order $n$ (Wolfram answers with a `Piecewise` closed form there, which is a materially bigger derivation than any single one of the atoms above and not attempted here); $x^k$ for $k > 2$; a mixed polynomial-times-trig product like $x\cos(x)$; and anything else outside the list -- correctness over coverage.'
  - Deliberately NOT built on compute-engine's own `Integrate`, which probing found both too weak to reach most of these forms (it declines `x^2 * Cos(2x)` outright) and, on one it does answer, silently wrong -- `Integrate(Abs(x) * Exp(-ix), {x, -pi, pi})` comes back exactly half of what an independent numeric quadrature gives.
examples:
  - id: c-2-of-x
    expr: [FourierCoefficient, x, x, 2]
    expected: [Complex, 0, [Rational, 1, 2]]
    caption: $c_2$ of the sawtooth $x$ is $i(-1)^2/2 = i/2$
  - id: c-2-of-cos-squared
    expr: [FourierCoefficient, [Power, [Cos, x], 2], x, 2]
    expected: [Rational, 1, 4]
    category: Scope
    caption: $c_2$ of $\cos^2(x) = \tfrac12+\tfrac12\cos(2x)$ is $1/4$ -- a sin/cos polynomial, via the binomial expansion
  - id: c-0-of-x-squared-is-the-average
    expr: [FourierCoefficient, [Power, x, 2], x, 0]
    expected: [Multiply, [Rational, 1, 3], [Power, Pi, 2]]
    category: Scope
    caption: $c_0$ of $x^2$ is its average value, $\pi^2/3$
  - id: c-0-of-abs-x
    expr: [FourierCoefficient, [Abs, x], x, 0]
    expected: [Multiply, [Rational, 1, 2], Pi]
    category: Scope
    caption: $c_0$ of the triangle wave $|x|$ is $\pi/2$
  - id: c-1-of-abs-x
    expr: [FourierCoefficient, [Abs, x], x, 1]
    expected: [Divide, -2, Pi]
    category: Scope
    caption: $c_1$ of $|x|$ is $-2/\pi$ -- checked against an independent numeric quadrature, since Wolfram's own `Integrate` gets this one wrong by a factor of 2
  - id: c-1-of-exp-x
    expr: [FourierCoefficient, [Exp, x], x, 1]
    expected: [Divide, [Multiply, [Complex, [Rational, -1, 2], [Rational, -1, 2]], [Sinh, Pi]], Pi]
    category: Scope
    caption: $c_1$ of $e^x$, algebraically equal to Wolfram's own $i(-1)^1\sinh(\pi)/((i+1)\pi)$
  - id: declines-a-symbolic-order
    expr: [FourierCoefficient, x, x, n]
    expected: [FourierCoefficient, x, x, n]
    category: Possible issues
    caption: Declines a symbolic order $n$ -- not cheap the way a concrete integer is
  - id: declines-tan-x-no-closed-form-here
    expr: [FourierCoefficient, [Tan, x], x, 1]
    expected: [FourierCoefficient, [Tan, x], x, 1]
    category: Possible issues
    caption: Declines $\tan(x)$ -- it has poles inside $[-\pi, \pi]$, so the defining integral doesn't actually converge, even though Wolfram formally returns 0 by symmetry
primitive: kernel
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/fourier-series.ts
seeAlso:
  - FourierSeries
  - Fourier
