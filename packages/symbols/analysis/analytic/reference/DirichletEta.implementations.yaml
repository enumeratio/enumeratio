threads-elementwise-over-an-array:
  epsil:
    in: DirichletEta([[1 / 2, -1], [0, 1 / 2]])
    out: "[[DirichletEta(1 / 2), 1 / 4], [1 / 2, DirichletEta(1 / 2)]]"
  tex:
    in: \mathrm{DirichletEta}(\bigl\lbrack\bigl\lbrack\frac{1}{2}, -1\bigr\rbrack, \bigl\lbrack0, \frac{1}{2}\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\mathrm{DirichletEta}(\frac{1}{2}), \frac{1}{4}\bigr\rbrack, \bigl\lbrack\frac{1}{2}, \mathrm{DirichletEta}(\frac{1}{2})\bigr\rbrack\bigr\rbrack
  traditional:
    in: \mathrm{DirichletEta}(\bigl\lbrack\bigl\lbrack\frac{1}{2}, -1\bigr\rbrack, \bigl\lbrack0, \frac{1}{2}\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack\eta(\frac{1}{2}), \frac{1}{4}\bigr\rbrack, \bigl\lbrack\frac{1}{2}, \eta(\frac{1}{2})\bigr\rbrack\bigr\rbrack
  fullform:
    in: DirichletEta[List[List[Rational[1, 2], -1], List[0, Rational[1, 2]]]]
  wolfram:
    in: DirichletEta[List[List[Rational[1, 2], -1], List[0, Rational[1, 2]]]]
    note: Wolfram also threads, but rewrites $\eta(\tfrac12)$ as $(1-\sqrt2)\zeta(\tfrac12)$.
