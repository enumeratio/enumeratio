rewriting-in-terms-of-zeta-eta-s-1-2-1-s-zeta-s:
  epsil:
    in: FunctionExpand(DirichletEta(s))
    out: (-2 ^ (-s + 1) + 1) * Zeta(s)
  tex:
    in: \mathrm{FunctionExpand}(\mathrm{DirichletEta}(s))
    out: (1-2^{1-s})\zeta(s)
  traditional:
    in: \mathrm{FunctionExpand}(\eta(s))
    out: (1-2^{1-s})\zeta(s)
  fullform:
    in: FunctionExpand[DirichletEta[s]]
