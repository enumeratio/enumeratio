pole-at-s-1-the-harmonic-series-sum-1-n-diverges:
  wolfram:
    in: Zeta[1]
    out: ComplexInfinity
    tex:
      in: \zeta (1)
      out: \text{ComplexInfinity}
  sage:
    in: zeta(1)
    out: Infinity
    verdict: disagree
    kind: undefined-form
    note: The pole is ComplexInfinity here; Sage's zeta(1) spells the same pole 'Infinity', a different notation for the same divergence.
  mpmath:
    in: zeta(1)
    out: "ValueError: zeta(1) pole"
    verdict: error
    kind: undefined-form
    note: "A pole or undefined value: compute-engine answers ComplexInfinity, mpmath gives ValueError: zeta(1) pole."
  sympy:
    in: zeta(1)
    out: zoo
the-probability-that-two-random-positive:
  wolfram:
    in: (Divide[1, Zeta[2]] == Divide[6, Power[Pi, 2]])
    out: True
    tex:
      in: \frac{1}{\zeta (2)}=\frac{6}{\pi ^2}
      out: \text{True}
  sage:
    in: bool((1 / zeta(2)) == (6 / (pi^2)))
    out: True
  sympy:
    in: enumeratio_equal((S(1) / zeta(2)), (S(6) / (pi**2)))
    out: True
