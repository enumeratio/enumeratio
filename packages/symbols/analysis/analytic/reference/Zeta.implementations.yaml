zeta-s-0-zeta-s-the-n-a-0-term-is-dropped-so:
  epsil:
    in: Zeta(2, 0)
    out: 1 / 6 * Pi ^ 2
  tex:
    in: \zeta(2, 0)
    out: \frac{\pi^2}{6}
  fullform:
    in: Zeta[2, 0]
  wolfram:
    in: Zeta[2, 0]
    out: Pi^2/6
    tex:
      in: \zeta (2,0)
      out: \frac{\pi ^2}{6}
    note: This matches Wolfram's $\mathrm{Zeta}[s, a]$; Wolfram's $\mathrm{HurwitzZeta}[s, 0]$ instead diverges (ComplexInfinity).
  sympy:
    in: zeta(2, 0)
    out: nan
    verdict: inconclusive
    kind: convention
    note: compute-engine's two-argument Zeta follows Wolfram's Zeta[s, a], which drops the a = 0 term; SymPy's zeta(s, 0) is a pole.
  mpmath:
    in: zeta(2, 0)
    out: "ZeroDivisionError: "
    verdict: error
    kind: convention
    note: compute-engine's two-argument Zeta follows Wolfram's Zeta[s, a], which drops the a = 0 term; mpmath's zeta(s, 0) is a pole.
  sage:
    in: hurwitz_zeta(2, 0)
    out: "ValueError: psi2_eval(): pole"
    verdict: error
    kind: convention
    note: compute-engine's two-argument Zeta follows Wolfram's Zeta[s, a], which drops the a = 0 term; Sage's hurwitz_zeta(s, 0) is a pole.
