zeta-1-2-35-12-exactly-but-at-a-negative-a-this:
  mpmath:
    in: (zeta((-1), (-2)))
    out: "-3.08333333333333333333333333333"
    verdict: disagree
    kind: convention
    note: mpmath's zeta(s,a) at a nonpositive integer is the plain Hurwitz continuation (-37/12, via the recursion zeta(s,a)=zeta(s,a+1)+a^-s down to zeta(-1,0)=zeta(-1)). Two-argument Zeta here follows Wolfram's own generalized-zeta convention at Re(a)<=0 instead (35/12), which HurwitzZeta itself does not use -- see evaluateZeta in hurwitz-zeta.ts.
  sympy:
    in: N(zeta((-1), (-2)), 30)
    out: "-3.08333333333333333333333333333"
    verdict: disagree
    kind: convention
    note: Same as the mpmath row -- SymPy's zeta(s,a) is the plain Hurwitz continuation (-37/12); ours follows Wolfram's generalized-zeta convention for Zeta(s,a) at Re(a)<=0 (35/12).
