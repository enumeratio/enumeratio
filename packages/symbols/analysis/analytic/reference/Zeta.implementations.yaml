threads-over-a-list-reducing-every-element-to:
  epsil:
    in: Zeta([-1, -2, -3])
    out: "[-1 / 12, 0, 1 / 120]"
  tex:
    in: \zeta(\bigl\lbrack-1, -2, -3\bigr\rbrack)
    out: \bigl\lbrack-\frac{1}{12}, 0, \frac{1}{120}\bigr\rbrack
  fullform:
    in: Zeta[List[-1, -2, -3]]
  wolfram:
    in: Zeta[List[-1, -2, -3]]
    out: "{-1/12, 0, 1/120}"
    tex:
      in: \zeta (\{-1,-2,-3\})
      out: \left\{-\frac{1}{12},0,\frac{1}{120}\right\}
  sympy:
    in: zeta([-1, -2, -3])
    out: "AttributeError: 'list' object has no attribute 'is_Integer'"
    verdict: error
    kind: threading
    note: compute-engine's Zeta threads over (or pools) the list; SymPy's takes scalars.
  sage:
    in: zeta([-1, -2, -3])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Zeta is Listable and threads over the list; Sage's takes scalars only.
