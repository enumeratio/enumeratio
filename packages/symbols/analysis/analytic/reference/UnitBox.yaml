name: UnitBox
domain: Elementary functions
signature: UnitBox(x1, x2, …)
summary: "The unit box function: 1 inside (-1/2, 1/2), 1/2 exactly at the boundary, 0 outside."
signatures:
  - call: UnitBox(x)
    description: 1 for -1/2 < x < 1/2, 1/2 at x = ±1/2, 0 otherwise.
    library: "@enumeratio/analytic"
  - call: UnitBox(x1, x2, …)
    description: the product of the unit boxes -- 0 as soon as any argument is outside its own [-1/2, 1/2].
    library: "@enumeratio/analytic"
    arity: 2
details:
  - Defined everywhere, including the boundary -- unlike [[HeavisidePi]], the same rectangular pulse shape but left unevaluated at x = ±1/2 rather than given the value 1/2.
  - D(UnitBox(x), x) = DiracDelta(x + 1/2) - DiracDelta(x - 1/2), since UnitBox(x) = HeavisideTheta(x + 1/2) - HeavisideTheta(x - 1/2).
examples:
  - id: unitbox-inside-the-box
    expr: [UnitBox, 0]
    expected: 1
    caption: Inside the box
  - id: unitbox-boundary-1-2
    expr: [UnitBox, [Rational, 1, 2]]
    expected: [Rational, 1, 2]
    caption: 1/2 exactly at the boundary
  - id: unitbox-boundary-neg-1-2
    expr: [UnitBox, [Rational, -1, 2]]
    expected: [Rational, 1, 2]
    caption: 1/2 exactly at the boundary
  - id: unitbox-outside-the-box
    expr: [UnitBox, 1]
    expected: 0
    category: Scope
    caption: Outside the box
  - id: unitbox-product-of-two-boxes
    expr: [UnitBox, 0, 0]
    expected: 1
    category: Scope
    caption: Two arguments -- the product of their unit boxes
  - id: unitbox-derivative
    expr: [D, [UnitBox, x], x]
    expected: [Add, [Negate, [DiracDelta, [Add, x, [Rational, -1, 2]]]], [DiracDelta, [Add, x, [Rational, 1, 2]]]]
    category: Properties
    caption: Derivative in terms of [[DiracDelta]]
