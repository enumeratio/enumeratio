sqrt-of-x-squared-under-x-greater-than-0:
  epsil:
    in: Refine(Sqrt(x ^ 2), x > 0)
    out: x
  tex:
    in: \mathrm{Refine}(\sqrt{x^2}, x\gt0)
    out: x
  fullform:
    in: Refine[Sqrt[Power[x, 2]], Greater[x, 0]]
  wolfram:
    in: Refine[Sqrt[Power[x, 2]], Greater[x, 0]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Refine}\left[\sqrt{x^2},x>0\right]-x\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Refine}\left[\sqrt{\left(\frac{7}{3}\right)^2},\frac{7}{3}>0\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\sqrt{\left(-\frac{11}{5}\right)^2},-\frac{11}{5}>0\right]--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\sqrt{\left(\frac{13}{4}\right)^2},\frac{13}{4}>0\right]-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
sqrt-of-x-squared-under-x-less-than-0:
  epsil:
    in: Refine(Sqrt(x ^ 2), x < 0)
    out: -x
  tex:
    in: \mathrm{Refine}(\sqrt{x^2}, x\lt0)
    out: -x
  fullform:
    in: Refine[Sqrt[Power[x, 2]], Less[x, 0]]
  wolfram:
    in: Refine[Sqrt[Power[x, 2]], Less[x, 0]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Refine}\left[\sqrt{x^2},x<0\right]--x\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Refine}\left[\sqrt{\left(\frac{7}{3}\right)^2},\frac{7}{3}<0\right]--\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\sqrt{\left(-\frac{11}{5}\right)^2},-\frac{11}{5}<0\right]--\left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\sqrt{\left(\frac{13}{4}\right)^2},\frac{13}{4}<0\right]--\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
abs-under-x-greater-than-0:
  epsil:
    in: Refine(Abs(x), x > 0)
    out: x
  tex:
    in: \mathrm{Refine}(\vert x\vert, x\gt0)
    out: x
  fullform:
    in: Refine[Abs[x], Greater[x, 0]]
  wolfram:
    in: Refine[Abs[x], Greater[x, 0]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Refine}[| x| ,x>0]-x],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Refine}\left[\left| \frac{7}{3}\right| ,\frac{7}{3}>0\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\left| -\frac{11}{5}\right| ,-\frac{11}{5}>0\right]--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\left| \frac{13}{4}\right| ,\frac{13}{4}>0\right]-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
sign-under-x-greater-than-0:
  epsil:
    in: Refine(Sign(x), x > 0)
    out: "1"
  tex:
    in: \mathrm{Refine}(\mathrm{sgn}(x), x\gt0)
    out: "1"
  fullform:
    in: Refine[Sign[x], Greater[x, 0]]
  wolfram:
    in: Refine[Sign[x], Greater[x, 0]]
    out: "1"
    tex:
      in: \text{Refine}[\text{sgn}(x),x>0]
      out: "1"
log-of-exp-under-x-real:
  epsil:
    in: Refine(Ln(Exp(x)), x in RealNumbers)
    out: x
  tex:
    in: \mathrm{Refine}(\ln(e^{x}), x\in\mathbb{R})
    out: x
  fullform:
    in: Refine[Log[Exp[x]], Element[x, RealNumbers]]
an-undecidable-inequality-is-left-alone:
  epsil:
    in: Refine(x ^ 2 > 0)
    out: 0 < x ^ 2
  tex:
    in: \mathrm{Refine}(x^2\gt0)
    out: 0\lt x^2
  fullform:
    in: Refine[Greater[Power[x, 2], 0]]
  wolfram:
    in: Refine[Greater[Power[x, 2], 0]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{Refine}\left[x^2>0\right]-\left(0<x^2\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Refine}\left[\left(\frac{7}{3}\right)^2>0\right]-\left(0<\left(\frac{7}{3}\right)^2\right)\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\left(-\frac{11}{5}\right)^2>0\right]-\left(0<\left(-\frac{11}{5}\right)^2\right)\right]\right],\text{Chop}\left[N\left[\text{Refine}\left[\left(\frac{13}{4}\right)^2>0\right]-\left(0<\left(\frac{13}{4}\right)^2\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
