name: Abs
domain: Arithmetic
signature: Abs(x)
summary: "The absolute value or magnitude of x: $|x|$, its distance from 0."
signatures:
  - call: Abs(x)
    description: the absolute value $|x|$ of a real x, or the modulus of a complex number.
details:
  - For a real number, $|x| = x$ if $x \ge 0$ and $|x| = -x$ if $x < 0$.
  - For a complex number $a+bi$, $|a+bi| = \sqrt{a^2+b^2}$, its distance from the origin.
  - Always non-negative, with $|x| = 0$ exactly at $x = 0$.
  - Satisfies the triangle inequality $|a+b| \le |a| + |b|$.
  - compute-engine doesn't factor constants out of a symbolic argument -- $|-3x|$ stays as written rather than simplifying to $3|x|$.
examples:
  - id: abs-neg-5
    expr: [Abs, -5]
    expected: 5
  - id: abs-5
    expr: [Abs, 5]
    expected: 5
  - id: 0-is-the-only-value-with-x-0
    expr: [Abs, 0]
    expected: 0
    caption: 0 is the only value with $|x| = 0$
  - id: abs-neg-7-over-2
    expr: [Abs, [Rational, -7, 2]]
    expected: [Rational, 7, 2]
  - id: the-modulus-of-a-complex-number-3-4i-sqrt-3-2-4
    expr: [Abs, [Complex, 3, 4]]
    expected: 5
    caption: 'The modulus of a complex number: $|3+4i| = \sqrt{3^2+4^2}$'
  - id: threads-element-wise-over-a-list
    expr: [Abs, [List, -1, 2, -3]]
    expected: [List, 1, 2, 3]
    caption: Threads element-wise over a list
  - id: even-function-x-x
    expr: [Equal, [Abs, -8], [Abs, 8]]
    expected: True
    category: Properties
    caption: "Even function: $|-x| = |x|$"
  - id: triangle-inequality-a-b-le-a-b
    expr: [LessEqual, [Abs, [Add, 3, -8]], [Add, [Abs, 3], [Abs, -8]]]
    expected: True
    category: Properties
    caption: 'Triangle inequality: $|a+b| \le |a| + |b|$'
  - id: the-gap-between-two-temperatures-70-and-95
    expr: [Abs, [Subtract, 70, 95]]
    expected: 25
    category: Applications
    caption: The gap between two temperatures, 70° and 95°, regardless of which is higher
  - id: doesn-t-factor-constants-out-of-a-symbolic
    expr: [Abs, [Multiply, -3, x]]
    expected: [Abs, [Multiply, -3, x]]
    category: Possible issues
    caption: "Doesn't factor constants out of a symbolic argument: $|-3x|$ stays as written rather than reducing to $3|x|$"
  - id: abs-neg-2p5
    expr: [Abs, -2.5]
    expected: 2.5
  - id: the-modulus-of-a-complex-number-with-approximate
    expr: [Abs, [Complex, 1.4, 2.3]]
    expected: { num: "2.69258240356725201563" }
    caption: The modulus of a complex number with approximate parts
  - id: threads-over-a-matrix-entry-by-entry
    expr: [Abs, [List, [List, [Rational, 1, 2], -1], [List, [Rational, -5, 3], [Rational, 1, 2]]]]
    expected: [List, [List, [Rational, 1, 2], 1], [List, [Rational, 5, 3], [Rational, 1, 2]]]
    category: Scope
    caption: Threads over a matrix, entry by entry
  - id: exact-numeric-constants
    expr: [Abs, [Negate, Pi]]
    expected: Pi
    category: Scope
    caption: Exact numeric constants
  - id: an-exact-complex-number-gives-an-exact-radical
    expr: [Abs, [Complex, 1, 1]]
    expected: [Sqrt, 2]
    category: Scope
    caption: An exact complex number gives an exact radical
  - id: abs-imaginaryunit
    expr: [Abs, ImaginaryUnit]
    expected: 1
    category: Scope
  - id: e-i-pi-3-lies-on-the-unit-circle
    expr: [Abs, [Exp, [Multiply, ImaginaryUnit, [Divide, Pi, 3]]]]
    expected: 1
    category: Scope
    caption: $e^{i\pi/3}$ lies on the unit circle
  - id: abs-negativeinfinity
    expr: [Abs, NegativeInfinity]
    expected: PositiveInfinity
    category: Scope
  - id: complex-infinity-has-infinite-magnitude-in-every
    expr: [Abs, ComplexInfinity]
    expected: PositiveInfinity
    category: Scope
    caption: Complex infinity has infinite magnitude in every direction
  - id: an-interval-maps-to-the-interval-of-absolute
    expr: [Abs, [Interval, -3, 5]]
    expected: [Interval, 0, 5]
    category: Scope
    caption: An [[Interval]] maps to the interval of absolute values, $[0, 5]$
  - id: decides-the-sign-of-an-exact-numeric-expression
    expr: [Abs, [Subtract, [Sqrt, 2], 2]]
    expected: [Add, 2, [Negate, [Sqrt, 2]]]
    category: Scope
    caption: Decides the sign of an exact numeric expression and gives $2-\sqrt{2}$
  - id: z-2-z-bar-z
    expr:
      [
        Equal,
        [Power, [Abs, [Complex, 3, 4]], 2],
        [Multiply, [Complex, 3, 4], [Conjugate, [Complex, 3, 4]]],
      ]
    expected: True
    category: Properties
    caption: $|z|^2 = z\bar{z}$
  - id: multiplicative-ab-a-b
    expr:
      [
        Equal,
        [Abs, [Multiply, [Complex, 1, 2], [Complex, 3, -1]]],
        [Multiply, [Abs, [Complex, 1, 2]], [Abs, [Complex, 3, -1]]],
      ]
    expected: True
    category: Properties
    caption: 'Multiplicative: $|ab| = |a|\,|b|$'
  - id: the-distance-between-the-points-1-i-and-4-5i-of
    expr: [Abs, [Subtract, [Complex, 1, 1], [Complex, 4, 5]]]
    expected: 5
    category: Applications
    caption: The distance between the points $1+i$ and $4+5i$ of the complex plane
seeAlso:
  - Sign
  - Chop
