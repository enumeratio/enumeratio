an-odd-degree-polynomial-is-onto:
  epsil:
    in: FunctionSurjective(x ^ 3, x, Reals)
    out: True
  tex:
    in: \mathrm{FunctionSurjective}(x^3, x, \mathrm{Reals})
    out: \top
  traditional:
    in: \mathrm{FunctionSurjective}(x^3, x, \mathrm{Reals})
    out: \mathrm{True}
  fullform:
    in: FunctionSurjective[Power[x, 3], x, Reals]
  wolfram:
    in: FunctionSurjective[Power[x, 3], x, Reals]
    out: True
    tex:
      in: \text{FunctionSurjective}\left[x^3,x,\mathbb{R}\right]
      out: \text{True}
exp-misses-the-non-positive-reals:
  epsil:
    in: FunctionSurjective(Exp(x), x, Reals)
    out: False
  tex:
    in: \mathrm{FunctionSurjective}(e^{x}, x, \mathrm{Reals})
    out: \bot
  traditional:
    in: \mathrm{FunctionSurjective}(e^{x}, x, \mathrm{Reals})
    out: \mathrm{False}
  fullform:
    in: FunctionSurjective[Exp[x], x, Reals]
  wolfram:
    in: FunctionSurjective[Exp[x], x, Reals]
    out: False
    tex:
      in: \text{FunctionSurjective}[\exp (x),x,\mathbb{R}]
      out: \text{False}
log-is-onto-the-reals:
  epsil:
    in: FunctionSurjective(Ln(x), x, Reals)
    out: True
  tex:
    in: \mathrm{FunctionSurjective}(\ln(x), x, \mathrm{Reals})
    out: \top
  traditional:
    in: \mathrm{FunctionSurjective}(\ln(x), x, \mathrm{Reals})
    out: \mathrm{True}
  fullform:
    in: FunctionSurjective[Log[x], x, Reals]
  wolfram:
    in: FunctionSurjective[Log[x], x, Reals]
    out: True
    tex:
      in: \text{FunctionSurjective}[\log (x),x,\mathbb{R}]
      out: \text{True}
a-reciprocal-never-hits-zero:
  epsil:
    in: FunctionSurjective(1 / x, x, Reals)
    out: False
  tex:
    in: \mathrm{FunctionSurjective}(\frac{1}{x}, x, \mathrm{Reals})
    out: \bot
  traditional:
    in: \mathrm{FunctionSurjective}(\frac{1}{x}, x, \mathrm{Reals})
    out: \mathrm{False}
  fullform:
    in: FunctionSurjective[Divide[1, x], x, Reals]
  wolfram:
    in: FunctionSurjective[Divide[1, x], x, Reals]
    out: False
    tex:
      in: \text{FunctionSurjective}\left[\frac{1}{x},x,\mathbb{R}\right]
      out: \text{False}
