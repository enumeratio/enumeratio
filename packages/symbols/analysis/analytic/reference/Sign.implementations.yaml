      in: \text{sgn}(70-95)
      out: "-1"
  sage:
    in: sign((70 - 95))
    out: "-1"
  mpmath:
    in: sign((70 - 95))
    out: "-1.0"
  sympy:
    in: sign((70 - 95))
    out: "-1"
