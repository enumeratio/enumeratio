the-unit-complex-number-pointing-the-same:
  epsil:
    in: Sign(3 + 4i)
    out: 3 / 5 + 4 / 5 * i
  tex:
    in: \mathrm{sgn}(3+4i)
    out: \frac{3}{5}+\frac{4}{5}i
  wolfram:
    in: Sign[Complex[3, 4]]
    out: 3/5 + (4*I)/5
    tex:
      in: \text{sgn}(3+4 i)
      out: \frac{3}{5}+\frac{4 i}{5}
  sympy:
    in: sign((3 + 4*I))
    out: sign(3 + 4*I)
  mpmath:
    in: sign(mpc(3, 4))
    out: (0.6 + 0.8j)
  sage:
    in: sign((3 + 4*I))
    out: sgn(4*I + 3)
    verdict: disagree
    kind: domain
    note: A Gaussian integer here goes to Sage as a complex number in the symbolic ring, not an element of ℤ[i], so Sign over the Gaussian integers is not reached; mapping it to ℤ[i] is a follow-up.
threads-element-wise-over-a-list:
  epsil:
    in: Sign([-3, 0, 7])
    out: "[-1, 0, 1]"
  tex:
    in: \mathrm{sgn}(\bigl\lbrack-3, 0, 7\bigr\rbrack)
    out: \bigl\lbrack-1, 0, 1\bigr\rbrack
  wolfram:
    in: Sign[List[-3, 0, 7]]
    out: "{-1, 0, 1}"
    tex:
      in: \text{sgn}(\{-3,0,7\})
      out: \{-1,0,1\}
  sympy:
    in: "[sign(-3), sign(0), sign(7)]"
    out: "AttributeError: 'list' object has no attribute 'is_Mul'"
    verdict: error
    kind: threading
    note: compute-engine's Sign threads over (or pools) the list; SymPy's takes scalars.
  mpmath:
    in: "[sign(-3), sign(0), sign(7)]"
  sage:
    in: "[sign(-3), sign(0), sign(7)]"
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's Sign is Listable and threads over the list; Sage's takes scalars only.
sign-z-z-z-see-abs:
  epsil:
    in: Sign(3 + 4i) == (3 + 4i) / Abs(3 + 4i)
    out: True
  tex:
    in: \mathrm{sgn}(3+4i)=\frac{3+4i}{\vert3+4i\vert}
    out: \top
  traditional:
    in: \mathrm{sgn}(3+4i)=\frac{3+4i}{\vert3+4i\vert}
    out: \mathrm{True}
  wolfram:
    in: (Sign[Complex[3, 4]] == Divide[Complex[3, 4], Abs[Complex[3, 4]]])
    back: Unreadable
    out: True
    tex:
      in: \text{sgn}(3+4 i)=\frac{3+4 i}{| 3+4 i| }
      out: \text{True}
  sympy:
    in: enumeratio_equal(sign((3 + 4*I)), (S((3 + 4*I)) / Abs((3 + 4*I))))
    out: True
  sage:
    in: bool(sign((3 + 4*I)) == ((3 + 4*I) / abs((3 + 4*I))))
    out: True
x-cdot-sign-x-x-here-at-x-5:
  epsil:
    in: -5 * Sign(-5) == Abs(-5)
    out: True
  tex:
    in: -5\mathrm{sgn}(-5)=\vert-5\vert
    out: \top
  traditional:
    in: -5\mathrm{sgn}(-5)=\vert-5\vert
    out: \mathrm{True}
  wolfram:
    in: (Times[-5, Sign[-5]] == Abs[-5])
    back: Unreadable
    out: True
    tex:
      in: -5 \text{sgn}(-5)=| -5|
      out: \text{True}
  sympy:
    in: enumeratio_equal((-5 * sign(-5)), Abs(-5))
    out: True
  mpmath:
    in: almosteq((-5 * sign(-5)), fabs(-5), 1e-20)
    out: True
  sage:
    in: bool((-5 * sign(-5)) == abs(-5))
    out: True
