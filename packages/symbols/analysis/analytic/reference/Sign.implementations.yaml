the-sign-of-a-nonzero-complex-number-lies-on-the:
  epsil:
    in: Abs(Sign(3 + 4i)) == 1
    out: True
  tex:
    in: \vert\mathrm{sgn}(3+4i)\vert=1
    out: \top
  traditional:
    in: \vert\mathrm{sgn}(3+4i)\vert=1
    out: \mathrm{True}
  wolfram:
    in: (Abs[Sign[Complex[3, 4]]] == 1)
    back: Unreadable
  sympy:
    in: enumeratio_equal(Abs(sign((3 + 4*I))), 1)
  mpmath:
    in: almosteq(fabs(sign(mpc(3, 4))), 1, 1e-20)
  sage:
    in: bool(abs(sign((3 + 4*I))) == 1)
