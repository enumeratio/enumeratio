sign-neg-3:
  wolfram:
    in: Sign[-3]
    out: "-1"
    tex:
      in: \text{sgn}(-3)
      out: "-1"
  sage:
    in: sign(-3)
    out: "-1"
  mpmath:
    in: sign(-3)
    out: "-1.0"
  sympy:
    in: sign(-3)
    out: "-1"
sign-3:
  wolfram:
    in: Sign[3]
    out: "1"
    tex:
      in: \text{sgn}(3)
      out: "1"
  sage:
    in: sign(3)
    out: "1"
  mpmath:
    in: sign(3)
    out: "1.0"
  sympy:
    in: sign(3)
    out: "1"
zero-is-its-own-sign:
