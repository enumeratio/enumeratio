dft-of-1-2-3-4:
  wolfram:
    in: "Fourier[{1, 2, 3, 4}]"
    out: "{5. + 0.*I, -1. - 1.*I, -1. + 0.*I, -1. + 1.*I}"
round-trips-through-inversefourier:
  wolfram:
    in: "InverseFourier[Fourier[{1, 2, 3, 4}]]"
    out: "{1., 2., 3., 4.}"
a-2x2-matrix-the-separable-2d-transform:
  wolfram:
    in: "Fourier[{{1, 2}, {3, 4}}]"
    out: "{{5., -1.}, {-2., 0.}}"
a-custom-fourierparameters:
  wolfram:
    in: "Fourier[{1, 2, 3, 4}, FourierParameters -> {1, -1}]"
    out: "{10. + 0.*I, -2. + 2.*I, -2. + 0.*I, -2. - 2.*I}"
declines-a-symbolic-list:
  wolfram:
    in: "Fourier[{a, b}]"
    out: "Fourier[{a, b}]"
    note: 'Wolfram raises `Fourier::fftl` ("... is not a nonempty list or rectangular array of numeric quantities") and returns the call unevaluated -- the same decline we make.'
