threads-over-a-list-each-element-exact-so-each:
  epsil:
    in: PolyGamma(1, [1, 2])
    out: "[PolyGamma(1, 1), PolyGamma(1, 2)]"
  tex:
    in: \mathrm{PolyGamma}(1, \bigl\lbrack1, 2\bigr\rbrack)
    out: \bigl\lbrack\mathrm{PolyGamma}(1, 1), \mathrm{PolyGamma}(1, 2)\bigr\rbrack
  traditional:
    in: \mathrm{PolyGamma}(1, \bigl\lbrack1, 2\bigr\rbrack)
    out: \bigl\lbrack\psi^{(1)}(1), \psi^{(1)}(2)\bigr\rbrack
  fullform:
    in: PolyGamma[1, List[1, 2]]
  wolfram:
    in: PolyGamma[1, List[1, 2]]
    out: "{Pi^2/6, -1 + Pi^2/6}"
    tex:
      in: \psi ^{(1)}(\{1,2\})
      out: \left\{\frac{\pi ^2}{6},\frac{\pi ^2}{6}-1\right\}
  sympy:
    in: polygamma(1, [1, 2])
    out: "AttributeError: 'list' object has no attribute 'is_Integer'"
    verdict: error
    kind: threading
    note: compute-engine's PolyGamma threads over (or pools) the list; SymPy's takes scalars.
  mpmath:
    in: psi(1, [1, 2])
  sage:
    in: psi(1, [1, 2])
    out: "TypeError: cannot coerce arguments: no canonical coercion from <class 'list'> to Symbolic Ring"
    verdict: error
    kind: threading
    note: compute-engine's PolyGamma is Listable and threads over the list; Sage's takes scalars only.
