psi-1-zeta-2-pi-2-6:
  wolfram:
    in: (PolyGamma[1, 1] == Zeta[2])
    out: True
    tex:
      in: \psi ^{(1)}(1)=\zeta (2)
      out: \text{True}
  sage:
    in: bool(psi(1, 1) == zeta(2))
    out: True
  mpmath:
    in: almosteq(psi(1, 1), zeta(2), 1e-20)
    out: True
  sympy:
    in: enumeratio_equal(polygamma(1, 1), zeta(2))
    out: True
psi-1-2-zeta-3-apery-s-constant-doubled-and:
  wolfram:
    in: (PolyGamma[2, 1] == Times[-2, Zeta[3]])
    out: PolyGamma[2, 1] == -2*Zeta[3]
    tex:
      in: \psi ^{(2)}(1)=-2 \zeta (3)
      out: \psi ^{(2)}(1)=-2 \zeta (3)
  sage:
    in: bool(psi(2, 1) == (-2 * zeta(3)))
    out: True
  mpmath:
    in: almosteq(psi(2, 1), (-2 * zeta(3)), 1e-20)
    out: True
  sympy:
    in: enumeratio_equal(polygamma(2, 1), (-2 * zeta(3)))
    out: True
psi-1-2-pi-2-2:
  wolfram:
    in: (PolyGamma[1, Rational[1, 2]] == Divide[Power[Pi, 2], 2])
    out: True
    tex:
      in: \psi ^{(1)}\left(\frac{1}{2}\right)=\frac{\pi ^2}{2}
      out: \text{True}
  sage:
    in: bool(psi(1, (1/2)) == ((pi^2) / 2))
    out: True
  sympy:
    in: enumeratio_equal(polygamma(1, Rational(1, 2)), (S((pi**2)) / 2))
    out: True
recurrence-at-m-1-z-1-psi-z-psi-z-1-z-2:
  wolfram:
    in: (Subtract[PolyGamma[1, 1], PolyGamma[1, 2]] == 1)
    out: True
    tex:
      in: \psi ^{(1)}(1)-\psi ^{(1)}(2)=1
      out: \text{True}
  sage:
    in: bool((psi(1, 1) - psi(1, 2)) == 1)
    out: True
  mpmath:
    in: almosteq((psi(1, 1) - psi(1, 2)), 1, 1e-20)
    out: True
  sympy:
    in: enumeratio_equal((polygamma(1, 1) - polygamma(1, 2)), 1)
    out: True
