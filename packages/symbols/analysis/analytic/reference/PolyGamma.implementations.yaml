    out: \tilde\infty
  fullform:
    in: PolyGamma[1, 0]
  wolfram:
    in: PolyGamma[1, 0]
    out: ComplexInfinity
    tex:
      in: \psi ^{(1)}(0)
      out: \text{ComplexInfinity}
  sympy:
    in: polygamma(1, 0)
    out: zoo
  mpmath:
    in: psi(1, 0)
    out: "ZeroDivisionError: "
    verdict: error
    kind: undefined-form
    note: "A pole or undefined value: compute-engine answers ComplexInfinity, mpmath gives ZeroDivisionError: ."
