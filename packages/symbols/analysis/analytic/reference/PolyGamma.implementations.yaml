a-pole-of-gamma-still-a-pole-after:
  wolfram:
    in: PolyGamma[1, 0]
    out: ComplexInfinity
    tex:
      in: \psi ^{(1)}(0)
      out: \text{ComplexInfinity}
  sage:
    in: psi(1, 0)
    out: "ValueError: psi2_eval(): pole"
    verdict: error
    kind: undefined-form
    note: 'Both decline: compute-engine answers "ComplexInfinity" and Sage raises an error.'
  mpmath:
    in: psi(1, 0)
    out: "ZeroDivisionError: "
    verdict: error
    kind: undefined-form
    note: "A pole or undefined value: compute-engine answers ComplexInfinity, mpmath gives ZeroDivisionError: ."
  sympy:
    in: polygamma(1, 0)
    out: zoo
