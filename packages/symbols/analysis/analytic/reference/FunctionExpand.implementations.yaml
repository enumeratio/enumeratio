eta-s-1-2-1-s-zeta-s:
  epsil:
    in: FunctionExpand(DirichletEta(s))
    out: (-2 ^ (-s + 1) + 1) * Zeta(s)
  tex:
    in: \mathrm{FunctionExpand}(\mathrm{DirichletEta}(s))
    out: (1-2^{1-s})\zeta(s)
  traditional:
    in: \mathrm{FunctionExpand}(\eta(s))
    out: (1-2^{1-s})\zeta(s)
  fullform:
    in: FunctionExpand[DirichletEta[s]]
  wolfram:
    in: FunctionExpand[DirichletEta[s]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionExpand}[\eta (s)]-\left(-2^{-s+1}+1\right) \zeta (s)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionExpand}\left[\eta \left(\frac{7}{3}\right)\right]-\left(-2^{-\frac{7}{3}+1}+1\right) \zeta \left(\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\eta \left(-\frac{11}{5}\right)\right]-\left(-2^{-\left(-\frac{11}{5}\right)+1}+1\right) \zeta \left(-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\eta \left(\frac{13}{4}\right)\right]-\left(-2^{-\frac{13}{4}+1}+1\right) \zeta \left(\frac{13}{4}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
beta-s-4-s-zeta-s-frac-14-zeta-s-frac-34:
  epsil:
    in: FunctionExpand(DirichletBeta(s))
    out: (-Zeta(s, 3 / 4) + Zeta(s, 1 / 4)) * 4 ^ (-s)
  tex:
    in: \mathrm{FunctionExpand}(\mathrm{DirichletBeta}(s))
    out: \frac{\zeta(s, \frac{1}{4})-\zeta(s, \frac{3}{4})}{4^{s}}
  traditional:
    in: \mathrm{FunctionExpand}(\beta(s))
    out: \frac{\zeta(s, \frac{1}{4})-\zeta(s, \frac{3}{4})}{4^{s}}
  fullform:
    in: FunctionExpand[DirichletBeta[s]]
  wolfram:
    in: FunctionExpand[DirichletBeta[s]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionExpand}[\beta (s)]-\left(-\zeta \left(s,\frac{3}{4}\right)+\zeta \left(s,\frac{1}{4}\right)\right) 4^{-s}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionExpand}\left[\beta \left(\frac{7}{3}\right)\right]-\left(-\zeta \left(\frac{7}{3},\frac{3}{4}\right)+\zeta \left(\frac{7}{3},\frac{1}{4}\right)\right) 4^{-\frac{7}{3}}\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\beta \left(-\frac{11}{5}\right)\right]-\left(-\zeta \left(-\frac{11}{5},\frac{3}{4}\right)+\zeta \left(-\frac{11}{5},\frac{1}{4}\right)\right) 4^{-\left(-\frac{11}{5}\right)}\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\beta \left(\frac{13}{4}\right)\right]-\left(-\zeta \left(\frac{13}{4},\frac{3}{4}\right)+\zeta \left(\frac{13}{4},\frac{1}{4}\right)\right) 4^{-\frac{13}{4}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
g-frac-12-in-glaisher-s-constant:
  epsil:
    in: FunctionExpand(BarnesG(1 / 2))
    out: 1 / Root(Pi, 4) * Root(2, 24) * ConstGlaisher ^ (-3 / 2) * Root(ExponentialE, 8)
  tex:
    in: \mathrm{FunctionExpand}(\mathrm{BarnesG}(\frac{1}{2}))
    out: \frac{\sqrt[24]{2}\sqrt{\mathrm{ConstGlaisher}}^{-3}\sqrt[8]{e}}{\sqrt[4]{\pi}}
  traditional:
    in: \mathrm{FunctionExpand}(G(\frac{1}{2}))
    out: \frac{\sqrt[24]{2}\sqrt{\mathrm{ConstGlaisher}}^{-3}\sqrt[8]{e}}{\sqrt[4]{\pi}}
  fullform:
    in: FunctionExpand[BarnesG[Rational[1, 2]]]
  wolfram:
    in: FunctionExpand[BarnesG[Rational[1, 2]]]
radicals-past-the-automatic-special-angle-table:
  epsil:
    in: FunctionExpand(Sin(Pi / 15))
    out: 1 / 8 * (-Sqrt(15) + Sqrt(3) + Sqrt(10 + 2 * Sqrt(5)))
  tex:
    in: \mathrm{FunctionExpand}(\sin(\frac{\pi}{15}))
    out: \frac{1}{8}(-\sqrt{15}+\sqrt{3}+\sqrt{10+2\sqrt{5}})
  fullform:
    in: FunctionExpand[Sin[Divide[Pi, 15]]]
  wolfram:
    in: FunctionExpand[Sin[Divide[Pi, 15]]]
