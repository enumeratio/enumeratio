a-rising-factorial-with-an-integer-length:
  epsil:
    in: FunctionExpand(Pochhammer(x, 3))
    out: x * (x + 1) * (x + 2)
  tex:
    in: \mathrm{FunctionExpand}(\mathrm{Pochhammer}(x, 3))
    out: x\times(x+1)(x+2)
  traditional:
    in: \mathrm{FunctionExpand}(\left(x\right)_{3})
    out: x\times(x+1)(x+2)
  fullform:
    in: FunctionExpand[Pochhammer[x, 3]]
  wolfram:
    in: FunctionExpand[Pochhammer[x, 3]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionExpand}\left[(x)_3\right]-x (x+1) (x+2)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionExpand}\left[\left(\frac{7}{3}\right)_3\right]-\frac{7}{3} \left(\frac{7}{3}+1\right) \left(\frac{7}{3}+2\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\left(-\frac{11}{5}\right)_3\right]--\frac{11}{5} \left(-\frac{11}{5}+1\right) \left(-\frac{11}{5}+2\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\left(\frac{13}{4}\right)_3\right]-\frac{13}{4} \left(\frac{13}{4}+1\right) \left(\frac{13}{4}+2\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
binom-n2-frac-n-n-1-2:
  epsil:
    in: FunctionExpand(Binomial(n, 2))
    out: n * (n - 1) / 2
  tex:
    in: \mathrm{FunctionExpand}(\binom{n}{2})
    out: \frac{n\times(n-1)}{2}
  fullform:
    in: FunctionExpand[Binomial[n, 2]]
  wolfram:
    in: FunctionExpand[Binomial[n, 2]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionExpand}[\binom{n}{2}]-\frac{n (n-1)}{2}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionExpand}\left[\binom{\frac{7}{3}}{2}\right]-\frac{\frac{7}{3} \left(\frac{7}{3}-1\right)}{2}\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\binom{-\frac{11}{5}}{2}\right]--\frac{\frac{11}{5} \left(-\frac{11}{5}-1\right)}{2}\right]\right],\text{Chop}\left[N\left[\text{FunctionExpand}\left[\binom{\frac{13}{4}}{2}\right]-\frac{\frac{13}{4} \left(\frac{13}{4}-1\right)}{2}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
