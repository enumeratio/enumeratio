zeta-2-via-euler-maclaurin:
  epsil:
    in: NSum(n ^ -2, [n, 1, PositiveInfinity])
    out: 1.644_934_066_848_228_2
  tex:
    in: \mathrm{NSum}(\frac{1}{n^2}, \bigl\lbrack n, 1, \infty\bigr\rbrack)
    out: 1.644\,934\,066\,848\,228\,2
  fullform:
    in: NSum[Power[n, -2], List[n, 1, Infinity]]
the-alternating-harmonic-series:
