    in: \mathrm{NSum}(\frac{(-1)^{n+1}}{n}, \bigl\lbrack n, 1, \infty\bigr\rbrack)
    out: 0.693\,147\,180\,559\,945\,4
  fullform:
    in: NSum[Divide[Power[-1, Plus[n, 1]], n], List[n, 1, Infinity]]
