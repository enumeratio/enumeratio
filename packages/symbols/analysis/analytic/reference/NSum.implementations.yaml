    in: NSum(n, [n, 1, 5])
    out: "15"
  tex:
    in: \mathrm{NSum}(n, \bigl\lbrack n, 1, 5\bigr\rbrack)
    out: "15"
  fullform:
    in: NSum[n, List[n, 1, 5]]
  wolfram:
    in: NSum[n, List[n, 1, 5]]
    out: 15.
    tex:
      in: \text{NSum}[n,\{n,1,5\}]
      out: 15.
declines-the-harmonic-series:
  epsil:
    in: NSum(1 / n, [n, 1, PositiveInfinity])
    out: NSum(1 / n, [n, 1, PositiveInfinity])
  tex:
    in: \mathrm{NSum}(\frac{1}{n}, \bigl\lbrack n, 1, \infty\bigr\rbrack)
    out: \mathrm{NSum}(\frac{1}{n}, \bigl\lbrack n, 1, \infty\bigr\rbrack)
  fullform:
    in: NSum[Divide[1, n], List[n, 1, Infinity]]
  wolfram:
    in: NSum[Divide[1, n], List[n, 1, Infinity]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{NSum}\left[\frac{1}{n},\{n,1,\infty \}\right]-\text{NSum}\left[\frac{1}{n},\{n,1,\infty \}\right]\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{NSum}\left[\frac{1}{\frac{7}{3}},\left\{\frac{7}{3},1,\infty \right\}\right]-\text{NSum}\left[\frac{1}{\frac{7}{3}},\left\{\frac{7}{3},1,\infty \right\}\right]\right]\right],\text{Chop}\left[N\left[\text{NSum}\left[-\frac{1}{\frac{11}{5}},\left\{-\frac{11}{5},1,\infty \right\}\right]-\text{NSum}\left[-\frac{1}{\frac{11}{5}},\left\{-\frac{11}{5},1,\infty \right\}\right]\right]\right],\text{Chop}\left[N\left[\text{NSum}\left[\frac{1}{\frac{13}{4}},\left\{\frac{13}{4},1,\infty \right\}\right]-\text{NSum}\left[\frac{1}{\frac{13}{4}},\left\{\frac{13}{4},1,\infty \right\}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
declines-a-series-whose-terms-grow:
  epsil:
    in: NSum(n, [n, 1, PositiveInfinity])
    out: NSum(n, [n, 1, PositiveInfinity])
  tex:
    in: \mathrm{NSum}(n, \bigl\lbrack n, 1, \infty\bigr\rbrack)
    out: \mathrm{NSum}(n, \bigl\lbrack n, 1, \infty\bigr\rbrack)
  fullform:
    in: NSum[n, List[n, 1, Infinity]]
  wolfram:
    in: NSum[n, List[n, 1, Infinity]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{NSum}[n,\{n,1,\infty \}]-\text{NSum}[n,\{n,1,\infty \}]],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{NSum}\left[\frac{7}{3},\left\{\frac{7}{3},1,\infty \right\}\right]-\text{NSum}\left[\frac{7}{3},\left\{\frac{7}{3},1,\infty \right\}\right]\right]\right],\text{Chop}\left[N\left[\text{NSum}\left[-\frac{11}{5},\left\{-\frac{11}{5},1,\infty \right\}\right]-\text{NSum}\left[-\frac{11}{5},\left\{-\frac{11}{5},1,\infty \right\}\right]\right]\right],\text{Chop}\left[N\left[\text{NSum}\left[\frac{13}{4},\left\{\frac{13}{4},1,\infty \right\}\right]-\text{NSum}\left[\frac{13}{4},\left\{\frac{13}{4},1,\infty \right\}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
