bonnet-recurrence:
  epsil:
    in: |-
      4 * LegendrePolynomial(4, 3) == 7 * 3 * LegendrePolynomial(3, 3) - 3 *
                                                                         LegendrePolynomial(2, 3)
    out: True
  tex:
    in: 4\mathrm{LegendrePolynomial}(4, 3)=7\times3\mathrm{LegendrePolynomial}(3, 3)-3\mathrm{LegendrePolynomial}(2, 3)
    out: \top
  traditional:
    in: 4\mathrm{LegendrePolynomial}(4, 3)=7\times3\mathrm{LegendrePolynomial}(3, 3)-3\mathrm{LegendrePolynomial}(2, 3)
    out: \mathrm{True}
  fullform:
    in: Equal[Times[4, LegendreP[4, 3]], Subtract[Times[7, 3, LegendreP[3, 3]], Times[3, LegendreP[2, 3]]]]
  wolfram:
    in: (Times[4, LegendreP[4, 3]] == Subtract[Times[7, 3, LegendreP[3, 3]], Times[3, LegendreP[2, 3]]])
    out: True
    tex:
      in: 4 P_4(3)=7\ 3 P_3(3)-3 P_2(3)
      out: \text{True}
