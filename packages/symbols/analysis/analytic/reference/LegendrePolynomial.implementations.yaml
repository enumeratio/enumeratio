the-quadratic:
  epsil:
    in: LegendrePolynomial(2, x)
    out: 3 / 2 * x ^ 2 + -1 / 2
  tex:
    in: \mathrm{LegendrePolynomial}(2, x)
    out: \frac{3x^2}{2}-\frac{1}{2}
  fullform:
    in: LegendreP[2, x]
the-cubic:
  epsil:
    in: LegendrePolynomial(3, x)
    out: 5 / 2 * x ^ 3 + -3 / 2 * x
  tex:
    in: \mathrm{LegendrePolynomial}(3, x)
    out: \frac{5x^3}{2}-\frac{3x}{2}
  fullform:
    in: LegendreP[3, x]
the-quartic:
  epsil:
