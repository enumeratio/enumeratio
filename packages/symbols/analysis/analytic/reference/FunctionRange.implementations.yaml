a-parabola-s-range-is-bounded-below:
  epsil:
    in: FunctionRange(x ^ 2, x, y)
    out: 0 <= y
  tex:
    in: \mathrm{FunctionRange}(x^2, x, y)
    out: 0\le y
  fullform:
    in: FunctionRange[Power[x, 2], x, y]
  wolfram:
    in: FunctionRange[Power[x, 2], x, y]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionRange}\left[x^2,x,y\right]-(0\leq y)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionRange}\left[\left(\frac{7}{3}\right)^2,\frac{7}{3},-\frac{11}{5}\right]-\left(0\leq -\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\left(\frac{13}{4}\right)^2,\frac{13}{4},-\frac{17}{6}\right]-\left(0\leq -\frac{17}{6}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\left(\frac{19}{8}\right)^2,\frac{19}{8},-\frac{23}{9}\right]-\left(0\leq -\frac{23}{9}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-reciprocal-never-reaches-zero:
  epsil:
    in: FunctionRange(1 / x, x, y)
    out: y < 0 || 0 < y
  tex:
    in: \mathrm{FunctionRange}(\frac{1}{x}, x, y)
    out: y\lt0\lor0\lt y
  fullform:
    in: FunctionRange[Divide[1, x], x, y]
  wolfram:
    in: FunctionRange[Divide[1, x], x, y]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionRange}\left[\frac{1}{x},x,y\right]-(y<0\lor 0<y)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionRange}\left[\frac{1}{\frac{7}{3}},\frac{7}{3},-\frac{11}{5}\right]-\left(-\frac{11}{5}<0\lor 0<-\frac{11}{5}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\frac{1}{\frac{13}{4}},\frac{13}{4},-\frac{17}{6}\right]-\left(-\frac{17}{6}<0\lor 0<-\frac{17}{6}\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\frac{1}{\frac{19}{8}},\frac{19}{8},-\frac{23}{9}\right]-\left(-\frac{23}{9}<0\lor 0<-\frac{23}{9}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
sine-s-range-is-the-unit-interval:
  epsil:
    in: FunctionRange(Sin(x), x, y)
    out: -1 <= y <= 1
  tex:
    in: \mathrm{FunctionRange}(\sin(x), x, y)
    out: -1\le y\le1
  fullform:
    in: FunctionRange[Sin[x], x, y]
  wolfram:
    in: FunctionRange[Sin[x], x, y]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{FunctionRange}[\sin (x),x,y]-(-1\leq y\leq 1)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionRange}\left[\sin \left(\frac{7}{3}\right),\frac{7}{3},-\frac{11}{5}\right]-\left(-1\leq -\frac{11}{5}\leq 1\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\sin \left(\frac{13}{4}\right),\frac{13}{4},-\frac{17}{6}\right]-\left(-1\leq -\frac{17}{6}\leq 1\right)\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\sin \left(\frac{19}{8}\right),\frac{19}{8},-\frac{23}{9}\right]-\left(-1\leq -\frac{23}{9}\leq 1\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
exp-s-range-is-the-positive-reals:
