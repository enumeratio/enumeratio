      out: \text{True}
a-quadratic-denominator-is-declined:
  epsil:
    in: FunctionRange(1 / (x ^ 2 - 1), x, y)
    out: FunctionRange(1 / (x ^ 2 - 1), x, y)
  tex:
    in: \mathrm{FunctionRange}(\frac{1}{x^2-1}, x, y)
    out: \mathrm{FunctionRange}(\frac{1}{x^2-1}, x, y)
  fullform:
    in: FunctionRange[Divide[1, Plus[Power[x, 2], -1]], x, y]
  wolfram:
    in: FunctionRange[Divide[1, Plus[Power[x, 2], -1]], x, y]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FunctionRange}\left[\frac{1}{x^2-1},x,y\right]-\text{FunctionRange}\left[\frac{1}{x^2-1},x,y\right]\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FunctionRange}\left[\frac{1}{\left(\frac{7}{3}\right)^2-1},\frac{7}{3},-\frac{11}{5}\right]-\text{FunctionRange}\left[\frac{1}{\left(\frac{7}{3}\right)^2-1},\frac{7}{3},-\frac{11}{5}\right]\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\frac{1}{\left(\frac{13}{4}\right)^2-1},\frac{13}{4},-\frac{17}{6}\right]-\text{FunctionRange}\left[\frac{1}{\left(\frac{13}{4}\right)^2-1},\frac{13}{4},-\frac{17}{6}\right]\right]\right],\text{Chop}\left[N\left[\text{FunctionRange}\left[\frac{1}{\left(\frac{19}{8}\right)^2-1},\frac{19}{8},-\frac{23}{9}\right]-\text{FunctionRange}\left[\frac{1}{\left(\frac{19}{8}\right)^2-1},\frac{19}{8},-\frac{23}{9}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
