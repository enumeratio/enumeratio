name: SloaneA
domain: Special functions
signature: SloaneA(id, n)
summary: The $n$-th term of an OEIS sequence, `id` a quoted A-number — scoped to the specific sequences Fungrim's own `SloaneA` identities cite, each aliased to a head that already computes it. Provided by `@enumeratio/analytic`.
signatures:
  - call: SloaneA(id, n)
    description: the $n$-th term of OEIS sequence `id`.
    library: "@enumeratio/analytic"
details:
  - "A general OEIS lookup is out of reach — most sequences have no closed form at all — so this aliases exactly the A-numbers Fungrim's identities use: A000045 ([[Fibonacci]]), A000040 (the primes, via `PrimeNumber`), A000720 (`PrimePi`), A000041 (`NPartition`), A000110 (`BellNumber`), A000142 (`Factorial`), A027641/A027642 (the numerator/denominator of [[BernoulliB]]), and A000793 (Landau's function $g(n)$, the largest order of an element of $S_n$ — computed directly, since compute-engine's `LandauG` is a symbolic stub with no numeric evaluator)."
  - An id this package does not carry stays symbolic rather than guessing (e.g. A060691, which Fungrim cites only inside a derivative formula for AGM's Taylor coefficients, not as an equation for the sequence's value).
examples:
  - id: a000045-is-the-fibonacci-numbers-the-10th-is-55
    expr: [SloaneA, "'A000045'", 10]
    expected: 55
    caption: "A000045 is the Fibonacci numbers: the 10th is 55"
  - id: a000793-landau-s-function-g-10-30
    expr: [SloaneA, "'A000793'", 10]
    expected: 30
    caption: "A000793, Landau's function: $g(10) = 30$"
  - id: an-oeis-id-outside-the-declared-alias-table
    expr: [SloaneA, "'A060691'", 5]
    expected: [SloaneA, "'A060691'", 5]
    category: Possible issues
    caption: An OEIS id outside the declared alias table stays symbolic
  - id: a000040-5-11-the-5th-prime
    expr: [SloaneA, "'A000040'", 5]
    expected: 11
    category: Scope
    caption: A000040(5) = 11, the 5th prime.
    group: oeis-lookup
  - id: a000041-10-42-the-number-of-partitions-of-10
    expr: [SloaneA, "'A000041'", 10]
    expected: 42
    category: Scope
    caption: A000041(10) = 42, the number of partitions of 10.
    group: oeis-lookup
  - id: a000110-5-52-the-5th-bell-number
    expr: [SloaneA, "'A000110'", 5]
    expected: 52
    category: Scope
    caption: A000110(5) = 52, the 5th Bell number.
    group: oeis-lookup
  - id: a000142-5-120-5
    expr: [SloaneA, "'A000142'", 5]
    expected: 120
    category: Scope
    caption: A000142(5) = 120 = 5!.
    group: oeis-lookup
  - id: a000720-20-8-pi-20-the-prime-counting-function
    expr: [SloaneA, "'A000720'", 20]
    expected: 8
    category: Scope
    caption: 'A000720(20) = 8: $\pi(20)$, the prime-counting function.'
    group: oeis-lookup
  - id: a027641-12-691-b-12-s-numerator
    expr: [SloaneA, "'A027641'", 12]
    expected: -691
    category: Scope
    caption: A027641(12) = −691, $B_{12}$'s numerator.
    group: bernoulli-fraction
  - id: a027642-12-2730-b-12-s-denominator
    expr: [SloaneA, "'A027642'", 12]
    expected: 2730
    category: Scope
    caption: A027642(12) = 2730, $B_{12}$'s denominator.
    group: bernoulli-fraction
  - id: a000793-15-105-landau-s-function-g-15
    expr: [SloaneA, "'A000793'", 15]
    expected: 105
    category: Scope
    caption: A000793(15) = 105, Landau's function $g(15)$.
    group: oeis-lookup
primitive: numeric
bindings:
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/sloane-a.ts
seeAlso:
  - Fibonacci
  - BellNumber
  - BernoulliB
