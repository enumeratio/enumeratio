a-list-number-by-number:
  epsil:
    in: N([Pi, ExponentialE, Sqrt(2)], 5)
    out: "[3.141_6, 2.718_3, 1.414_2]"
  tex:
    in: N(\bigl\lbrack\pi, e, \sqrt{2}\bigr\rbrack, 5)
    out: \bigl\lbrack3.141\,6, 2.718\,3, 1.414\,2\bigr\rbrack
  fullform:
    in: N[List[Pi, E, Sqrt[2]], 5]
  wolfram:
    in: N[List[Pi, E, Sqrt[2]], 5]
  sympy:
    in: N([pi, E, sqrt(2)], 30)
  sage:
    in: N([pi, e, sqrt(2)])
  rust:
    in: nf(list(vec![x(std::f64::consts::PI), x(std::f64::consts::E), sqrt(n(2))]))
an-exact-tie-rounds-to-the-even-digit-0-125:
  epsil:
    in: N(1 / 8, 2)
    out: "0.12"
  tex:
    in: N(\frac{1}{8}, 2)
    out: "0.12"
  fullform:
    in: N[Rational[1, 8], 2]
  wolfram:
    in: N[Rational[1, 8], 2]
  sympy:
    in: N(Rational(1, 8), 30)
  sage:
    in: N((1/8))
  oscar:
    in: ((1 // 8))
  rust:
    in: nf(rational(n(1), n(8)))
  julia:
    in: ((1 // 8))
    out: "0.125"
    verdict: disagree
    kind: rounding-mode
    note: N's digit count is dropped for Julia — it's numeric already, per the mapping's own note. At this exact tie the untruncated 0.125 differs from our round-half-to-even N(1/8, 2) = 0.12.
