    in: 9 * Beta(4, 6) * Binomial(8, 3) == 1
    out: True
  tex:
    in: 9\mathrm{B}(4, 6)\binom{8}{3}=1
    out: \top
  traditional:
    in: 9\mathrm{B}(4, 6)\binom{8}{3}=1
    out: \mathrm{True}
  wolfram:
    in: (Times[9, Times[Beta[4, 6], Binomial[8, 3]]] == 1)
    back: Unreadable
    out: True
    tex:
      in: 9 (B(4,6) \binom{8}{3})=1
      out: \text{True}
