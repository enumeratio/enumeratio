symmetric-b-a-b-b-b-a:
  epsil:
    in: Beta(2, 5) == Beta(5, 2)
    out: True
  tex:
    in: \mathrm{B}(2, 5)=\mathrm{B}(5, 2)
    out: \top
  traditional:
    in: \mathrm{B}(2, 5)=\mathrm{B}(5, 2)
    out: \mathrm{True}
  wolfram:
    in: (Beta[2, 5] == Beta[5, 2])
    back: Unreadable
    out: True
    tex:
      in: B(2,5)=B(5,2)
      out: \text{True}
ties-to-binomial-b-k-1-n-k-1-frac-1-n-1-binom-n:
