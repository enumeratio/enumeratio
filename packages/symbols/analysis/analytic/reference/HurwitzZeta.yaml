implementations:
  - origin: reference
    form: notatio
    environment: engine
    expr: [Sum, [Exp, [Multiply, [Negate, _s], [Ln, [Add, n, _a]]]], [Triple, n, 0, Infinity]]
    note: The Dirichlet series, on the principal branch — written exp(−s·ln(n+a)) so the wildcards arrive in the head's own order. It converges only for Re(s) > 1; everywhere else ζ(s, a) is its analytic continuation, which is what the kernel computes.
  - origin: native
    form: typescript
    environment: engine
    source: packages/symbols/analysis/analytic/src/hurwitz-zeta.ts
    note: "Euler–Maclaurin in double precision — the fast path, and all a double holds. Asked for more digits than that, N() leaves it: at an integer s ≥ 2 with real a > 0 it takes ζ(n, a) = (−1)ⁿψ⁽ⁿ⁻¹⁾(a)/(n−1)! through compute-engine's PolyGamma, and otherwise (real s ≠ 1, real a > 0) it evaluates the SAME Euler–Maclaurin written as an expression — a finite Sum over Power, Pochhammer and BernoulliB, which compute-engine carries to whatever precision was asked for (packages/symbols/analysis/analytic/src/precise.ts)."
  - origin: compiled
    form: wgsl
    environment: gpu
    source: packages/symbols/analysis/analytic/src/shader.ts:zetaWGSL
    produces: a colour per pixel — complex ζ(s, a), domain-coloured
  - origin: mapped
    form: wolfram / mpmath
    environment: external
    note: HurwitzZeta[s, a]; mpmath.zeta(s, a).
seeAlso:
  - Zeta
  - BernoulliB
  - Gamma
  - Digamma
