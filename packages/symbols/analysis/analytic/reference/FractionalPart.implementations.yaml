fractionalpart-2p5:
  epsil:
    in: FractionalPart(2.5)
    out: "0.5"
  tex:
    in: \mathrm{FractionalPart}(2.5)
    out: "0.5"
  fullform:
    in: FractionalPart[2.5]
  wolfram:
    in: FractionalPart[2.5]
fractionalpart-7-over-2:
  epsil:
    in: FractionalPart(7 / 2)
    out: 1 / 2
  tex:
    in: \mathrm{FractionalPart}(\frac{7}{2})
    out: \frac{1}{2}
  fullform:
    in: FractionalPart[Rational[7, 2]]
  wolfram:
    in: FractionalPart[Rational[7, 2]]
keeps-the-sign-of-x-unlike-compute-engine-s:
  epsil:
    in: FractionalPart(-7 / 2)
    out: -1 / 2
  tex:
    in: \mathrm{FractionalPart}(-\frac{7}{2})
    out: -\frac{1}{2}
  fullform:
    in: FractionalPart[Rational[-7, 2]]
  wolfram:
    in: FractionalPart[Rational[-7, 2]]
exact-numeric-arguments-stay-exact:
  epsil:
    in: FractionalPart(Pi)
    out: -3 + Pi
  tex:
    in: \mathrm{FractionalPart}(\pi)
    out: \pi-3
  fullform:
    in: FractionalPart[Pi]
  wolfram:
    in: FractionalPart[Pi]
threads-element-wise-over-a-list:
  epsil:
    in: FractionalPart([7 / 2, -1 / 3])
    out: "[1 / 2, -1 / 3]"
  tex:
    in: \mathrm{FractionalPart}(\bigl\lbrack\frac{7}{2}, -\frac{1}{3}\bigr\rbrack)
    out: \bigl\lbrack\frac{1}{2}, -\frac{1}{3}\bigr\rbrack
  fullform:
    in: FractionalPart[List[Rational[7, 2], Rational[-1, 3]]]
  wolfram:
    in: FractionalPart[List[Rational[7, 2], Rational[-1, 3]]]
zero-exactly-on-the-integers:
  epsil:
    in: FractionalPart(5)
    out: "0"
  tex:
    in: \mathrm{FractionalPart}(5)
    out: "0"
  fullform:
    in: FractionalPart[5]
  wolfram:
    in: FractionalPart[5]
