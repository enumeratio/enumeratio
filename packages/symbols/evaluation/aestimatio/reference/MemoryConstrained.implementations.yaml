in-process-the-call-simply-does-not-reduce-see:
  wolfram:
    in: MemoryConstrained[Plus[1, 2], 1000000]
    out: "3"
    tex:
      in: \text{MemoryConstrained}[1+2,1000000]
      out: "3"
    verdict: disagree
    kind: unevaluated
    note: Wolfram enforces the cap in-kernel and evaluates to 3.
