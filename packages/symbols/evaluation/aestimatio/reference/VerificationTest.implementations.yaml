input-matches-expected:
  epsil:
    in: VerificationTest(2 + 3, 5)
    out: |-
      TestResultObject(
                        ("Outcome", "Success"),
                        ("Input", 5),
                        ("ExpectedOutput", 5),
                        ("ActualOutput", 5),
                        ("AbsoluteTimeUsed", 0),
                      )
  tex:
    in: \mathrm{VerificationTest}(2+3, 5)
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Success}), (\text{Input},5), (\text{ExpectedOutput},5), (\text{ActualOutput},5), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Plus[2, 3], 5]
  wolfram:
    in: VerificationTest[Plus[2, 3], 5]
    out: TestObject[<|"Outcome" -> "Success", "Input" -> HoldForm[2 + 3], "ExpectedOutput" -> HoldForm[5], "ActualOutput" -> HoldForm[5]|>]
    tex:
      in: \text{VerificationTest}[2+3,5]
      out: \text{TestObject}[\unicode{f113}\text{Outcome}\to \text{Success},\text{Input}\to 2+3,\text{ExpectedOutput}\to 5,\text{ActualOutput}\to 5\unicode{f114}]
    verdict: disagree
    kind: convention
    note: Wolfram returns a TestObject over an Association with Input held unevaluated; ours is a TestResultObject of rules with Input evaluated. The Outcome is the same.
input-evaluates-but-does-not-match-expected:
  epsil:
    in: VerificationTest(2 + 3, 6)
    out: |-
      TestResultObject(
                        ("Outcome", "Failure"),
                        ("Input", 5),
                        ("ExpectedOutput", 6),
                        ("ActualOutput", 5),
                        ("AbsoluteTimeUsed", 0),
                      )
  tex:
    in: \mathrm{VerificationTest}(2+3, 6)
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Failure}), (\text{Input},5), (\text{ExpectedOutput},6), (\text{ActualOutput},5), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Plus[2, 3], 6]
  wolfram:
    in: VerificationTest[Plus[2, 3], 6]
    out: TestObject[<|"Outcome" -> "Failure", "Input" -> HoldForm[2 + 3], "ExpectedOutput" -> HoldForm[6], "ActualOutput" -> HoldForm[5]|>]
    tex:
      in: \text{VerificationTest}[2+3,6]
      out: \text{TestObject}[\unicode{f113}\text{Outcome}\to \text{Failure},\text{Input}\to 2+3,\text{ExpectedOutput}\to 6,\text{ActualOutput}\to 5\unicode{f114}]
    verdict: disagree
    kind: convention
    note: Wolfram returns a TestObject over an Association with Input held unevaluated; ours is a TestResultObject of rules with Input evaluated. The Outcome is the same.
memoryconstraint-in-process-is-an-error-not-a:
  epsil:
    in: VerificationTest(2 + 3, 5, MemoryConstraint -> 1_000_000)
    out: |-
      TestResultObject(
                        ("Outcome", "Error"),
                        ("Input", 5),
                        ("ExpectedOutput", 5),
                        ("ActualOutput", Missing),
                        ("AbsoluteTimeUsed", 0),
                      )
  tex:
    in: \mathrm{VerificationTest}(2+3, 5, \mathrm{KeyValuePair}(\mathrm{MemoryConstraint}, 1\,000\,000))
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Error}), (\text{Input},5), (\text{ExpectedOutput},5), (\text{ActualOutput},\mathrm{Missing}), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Plus[2, 3], 5, KeyValuePair[MemoryConstraint, 1000000]]
one-argument-a-predicate-that-evaluates-to-true:
  epsil:
    in: VerificationTest(2 > 1)
    out: |-
      TestResultObject(
                        ("Outcome", "Success"),
                        ("Input", 1 < 2),
                        ("ExpectedOutput", Missing),
                        ("ActualOutput", True),
                        ("AbsoluteTimeUsed", 0),
                      )
  tex:
    in: \mathrm{VerificationTest}(2\gt1)
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Success}), (\text{Input},1\lt2), (\text{ExpectedOutput},\mathrm{Missing}), (\text{ActualOutput},\top), (\text{AbsoluteTimeUsed},0))
  traditional:
    in: \mathrm{VerificationTest}(2\gt1)
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Success}), (\text{Input},1\lt2), (\text{ExpectedOutput},\mathrm{Missing}), (\text{ActualOutput},\mathrm{True}), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Greater[2, 1]]
  wolfram:
    in: VerificationTest[Greater[2, 1]]
one-argument-succeeds-whenever-input-evaluates:
  epsil:
    in: VerificationTest(1 + 1)
    out: |-
      TestResultObject(
                        ("Outcome", "Success"),
                        ("Input", 2),
                        ("ExpectedOutput", Missing),
                        ("ActualOutput", 2),
                        ("AbsoluteTimeUsed", 0),
                      )
  tex:
    in: \mathrm{VerificationTest}(1+1)
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Success}), (\text{Input},2), (\text{ExpectedOutput},\mathrm{Missing}), (\text{ActualOutput},2), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Plus[1, 1]]
  wolfram:
    in: VerificationTest[Plus[1, 1]]
    note: Wolfram's one-argument form tests that input evaluates to True, so VerificationTest[1 + 1] is a Failure there.
a-symbolic-computation-checked-against-its:
  epsil:
    in: VerificationTest(Expand((x + 1) ^ 2), x ^ 2 + 2x + 1)
    out: |-
      TestResultObject(
                        ("Outcome", "Success"),
                        ("Input", Expand((x + 1) ^ 2)),
                        ("ExpectedOutput", x ^ 2 + 2x + 1),
                        ("ActualOutput", x ^ 2 + 2x + 1),
                        ("AbsoluteTimeUsed", 0),
                      )
  tex:
    in: \mathrm{VerificationTest}(\mathrm{Expand}((x+1)^2), x^2+2x+1)
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Success}), (\text{Input},\mathrm{Expand}((x+1)^2)), (\text{ExpectedOutput},x^2+2x+1), (\text{ActualOutput},x^2+2x+1), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Expand[Power[Plus[x, 1], 2]], Plus[Power[x, 2], Times[2, x], 1]]
a-testid-is-carried-into-the-result:
  epsil:
    in: VerificationTest(1 / 0, ComplexInfinity, TestID -> "pole")
    out: |-
      TestResultObject(
                        ("Outcome", "Success"),
                        ("Input", ComplexInfinity),
                        ("ExpectedOutput", ComplexInfinity),
                        ("ActualOutput", ComplexInfinity),
                        ("AbsoluteTimeUsed", 0),
                        ("TestID", "pole"),
                      )
  tex:
    in: \mathrm{VerificationTest}(\frac{1}{0}, \tilde\infty, \mathrm{KeyValuePair}(\mathrm{TestID}, \text{pole}))
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Success}), (\text{Input},\tilde\infty), (\text{ExpectedOutput},\tilde\infty), (\text{ActualOutput},\tilde\infty), (\text{AbsoluteTimeUsed},0), (\text{TestID},\text{pole}))
  fullform:
    in: VerificationTest[Divide[1, 0], ComplexInfinity, KeyValuePair[TestID, "pole"]]
the-default-comparison-is-structural:
  epsil:
    in: VerificationTest(x ^ 2 + 2x + 1, (x + 1) ^ 2)
    out: |-
      TestResultObject(
                        ("Outcome", "Failure"),
                        ("Input", x ^ 2 + 2x + 1),
                        ("ExpectedOutput", (x + 1) ^ 2),
                        ("ActualOutput", x ^ 2 + 2x + 1),
                        ("AbsoluteTimeUsed", 0),
                      )
  tex:
    in: \mathrm{VerificationTest}(x^2+2x+1, (x+1)^2)
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Failure}), (\text{Input},x^2+2x+1), (\text{ExpectedOutput},(x+1)^2), (\text{ActualOutput},x^2+2x+1), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Plus[Power[x, 2], Times[2, x], 1], Power[Plus[x, 1], 2]]
a-sametest-with-a-tolerance-22-7-3-14-0-01:
  epsil:
    in: VerificationTest(22 / 7, 3.14, SameTest -> Function(Abs(a - b) < 0.01, a, b))
    out: |-
      TestResultObject(
                        ("Outcome", "Success"),
                        ("Input", 22 / 7),
                        ("ExpectedOutput", 3.14),
                        ("ActualOutput", 22 / 7),
                        ("AbsoluteTimeUsed", 0),
                      )
    back: Unreadable
  tex:
    in: \mathrm{VerificationTest}(\frac{22}{7}, 3.14, \mathrm{KeyValuePair}(\mathrm{SameTest}, (a, b)\mapsto\vert a-b\vert\lt0.01))
    out: \mathrm{TestResultObject}((\text{Outcome},\text{Success}), (\text{Input},\frac{22}{7}), (\text{ExpectedOutput},3.14), (\text{ActualOutput},\frac{22}{7}), (\text{AbsoluteTimeUsed},0))
  fullform:
    in: VerificationTest[Divide[22, 7], 3.14, KeyValuePair[SameTest, Function[Less[Abs[Subtract[a, b]], 0.01], a, b]]]
