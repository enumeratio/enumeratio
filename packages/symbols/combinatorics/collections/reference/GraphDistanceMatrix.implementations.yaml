a-3-cycle:
  epsil:
    in: GraphDistanceMatrix(CycleGraph(3))
    out: "[[0, 1, 1], [1, 0, 1], [1, 1, 0]]"
  tex:
    in: \mathrm{GraphDistanceMatrix}(\mathrm{CycleGraph}(3))
    out: \bigl\lbrack\bigl\lbrack0, 1, 1\bigr\rbrack, \bigl\lbrack1, 0, 1\bigr\rbrack, \bigl\lbrack1, 1, 0\bigr\rbrack\bigr\rbrack
  fullform:
    in: GraphDistanceMatrix[CycleGraph[3]]
  wolfram:
    in: GraphDistanceMatrix[CycleGraph[3]]
unreachable-pair-is-infinite:
  epsil:
    in: |-
      GraphDistanceMatrix(Graph([1, 2, 3, 4], [
                                                UndirectedEdge(1, 2),
                                                UndirectedEdge(3, 4),
                                              ]))
    out: |-
      [
        [0, 1, PositiveInfinity, PositiveInfinity],
        [1, 0, PositiveInfinity, PositiveInfinity],
        [PositiveInfinity, PositiveInfinity, 0, 1],
        [PositiveInfinity, PositiveInfinity, 1, 0],
      ]
  tex:
    in: \mathrm{GraphDistanceMatrix}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack))
    out: \bigl\lbrack\bigl\lbrack0, 1, \infty, \infty\bigr\rbrack, \bigl\lbrack1, 0, \infty, \infty\bigr\rbrack, \bigl\lbrack\infty, \infty, 0, 1\bigr\rbrack, \bigl\lbrack\infty, \infty, 1, 0\bigr\rbrack\bigr\rbrack
  fullform:
    in: GraphDistanceMatrix[Graph[List[1, 2, 3, 4], List[UndirectedEdge[1, 2], UndirectedEdge[3, 4]]]]
  wolfram:
    in: GraphDistanceMatrix[Graph[List[1, 2, 3, 4], List[UndirectedEdge[1, 2], UndirectedEdge[3, 4]]]]
weighted-matrix-summed-weight:
  epsil:
    in: |-
      GraphDistanceMatrix(Graph([1, 2, 3], [
                                             UndirectedEdge(1, 2),
                                             UndirectedEdge(2, 3),
                                           ], EdgeWeight -> [5, 7]))
    out: "[[0, 5, 12], [5, 0, 7], [12, 7, 0]]"
  tex:
    in: \mathrm{GraphDistanceMatrix}(\mathrm{Graph}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3)\bigr\rbrack, \mathrm{KeyValuePair}(\mathrm{EdgeWeight}, \bigl\lbrack5, 7\bigr\rbrack)))
    out: \bigl\lbrack\bigl\lbrack0, 5, 12\bigr\rbrack, \bigl\lbrack5, 0, 7\bigr\rbrack, \bigl\lbrack12, 7, 0\bigr\rbrack\bigr\rbrack
  fullform:
    in: GraphDistanceMatrix[Graph[List[1, 2, 3], List[UndirectedEdge[1, 2], UndirectedEdge[2, 3]], KeyValuePair[EdgeWeight, List[5, 7]]]]
