cases-wildcard-keeps-everything:
  epsil:
    in: Cases([1, a, 2, b], _)
    out: "[1, a, 2, b]"
  tex:
    in: \mathrm{Cases}(\bigl\lbrack1, a, 2, b\bigr\rbrack, \operatorname{\_})
    out: \bigl\lbrack1, a, 2, b\bigr\rbrack
cases-literal-value:
  epsil:
    in: Cases([1, 2, 1, 3, 1], 1)
    out: "[1, 1, 1]"
  tex:
    in: \mathrm{Cases}(\bigl\lbrack1, 2, 1, 3, 1\bigr\rbrack, 1)
    out: \bigl\lbrack1, 1, 1\bigr\rbrack
  wolfram:
    in: Cases[List[1, 2, 1, 3, 1], 1]
cases-structural-pattern:
  epsil:
    in: Cases([[1], 2, [3]], [_a])
    out: "[[1], [3]]"
  tex:
    in: \mathrm{Cases}(\bigl\lbrack\bigl\lbrack1\bigr\rbrack, 2, \bigl\lbrack3\bigr\rbrack\bigr\rbrack, \bigl\lbrack\operatorname{\_a}\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack1\bigr\rbrack, \bigl\lbrack3\bigr\rbrack\bigr\rbrack
cases-count-agree-on-length:
  epsil:
    in: Length(Cases([1, 2, 1, 3, 1], 1)) == Count([1, 2, 1, 3, 1], 1)
    out: True
  tex:
    in: \mathrm{Length}(\mathrm{Cases}(\bigl\lbrack1, 2, 1, 3, 1\bigr\rbrack, 1))=\mathrm{Count}(\bigl\lbrack1, 2, 1, 3, 1\bigr\rbrack, 1)
    out: \top
  traditional:
    in: \mathrm{Length}(\mathrm{Cases}(\bigl\lbrack1, 2, 1, 3, 1\bigr\rbrack, 1))=\mathrm{Count}(\bigl\lbrack1, 2, 1, 3, 1\bigr\rbrack, 1)
    out: \mathrm{True}
  wolfram:
    in: (Length[Cases[List[1, 2, 1, 3, 1], 1]] == Count[List[1, 2, 1, 3, 1], 1])
    back: Unreadable
cases-typed-pattern-not-typed-here:
  epsil:
    in: Length(Cases([1, a, 2, b], _Integer))
    out: "4"
  tex:
    in: \mathrm{Length}(\mathrm{Cases}(\bigl\lbrack1, a, 2, b\bigr\rbrack, \operatorname{\_Integer}))
    out: "4"
  wolfram:
    in:
    note: Wolfram's `_Integer` pattern only matches integers, here 2 (1 and 2).
