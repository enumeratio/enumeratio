path-5-has-diameter-4:
  epsil:
    in: |-
      GraphDiameter(Graph([1, 2, 3, 4, 5], [
                                             UndirectedEdge(1, 2),
                                             UndirectedEdge(2, 3),
                                             UndirectedEdge(3, 4),
                                             UndirectedEdge(4, 5),
                                           ]))
    out: "4"
  tex:
    in: \mathrm{GraphDiameter}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4, 5\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 4), \mathrm{UndirectedEdge}(4, 5)\bigr\rbrack))
    out: "4"
  wolfram:
    in: GraphDiameter[Graph[List[1, 2, 3, 4, 5], List[UndirectedEdge[1, 2], UndirectedEdge[2, 3], UndirectedEdge[3, 4], UndirectedEdge[4, 5]]]]
disconnected-graph-has-infinite-diameter:
  epsil:
    in: GraphDiameter(Graph([1, 2, 3, 4], [UndirectedEdge(1, 2), UndirectedEdge(3, 4)]))
    out: PositiveInfinity
  tex:
    in: \mathrm{GraphDiameter}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack))
    out: \infty
  wolfram:
    in: GraphDiameter[Graph[List[1, 2, 3, 4], List[UndirectedEdge[1, 2], UndirectedEdge[3, 4]]]]
