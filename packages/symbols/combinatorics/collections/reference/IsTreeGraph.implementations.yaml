a-star-is-a-tree:
  epsil:
    in: IsTreeGraph(StarGraph(5))
    out: True
  tex:
    in: \mathrm{IsTreeGraph}(\mathrm{StarGraph}(5))
    out: \top
  traditional:
    in: \mathrm{IsTreeGraph}(\mathrm{StarGraph}(5))
    out: \mathrm{True}
  wolfram:
    in: TreeGraphQ[StarGraph[5]]
a-cycle-is-not-a-tree:
  epsil:
    in: IsTreeGraph(CycleGraph(4))
    out: False
  tex:
    in: \mathrm{IsTreeGraph}(\mathrm{CycleGraph}(4))
    out: \bot
  traditional:
    in: \mathrm{IsTreeGraph}(\mathrm{CycleGraph}(4))
    out: \mathrm{False}
  wolfram:
    in: TreeGraphQ[CycleGraph[4]]
a-disconnected-forest-is-not-a-tree:
  epsil:
    in: IsTreeGraph(Graph([1, 2, 3, 4], [UndirectedEdge(1, 2), UndirectedEdge(3, 4)]))
    out: False
  tex:
    in: \mathrm{IsTreeGraph}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack))
    out: \bot
  traditional:
    in: \mathrm{IsTreeGraph}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack))
    out: \mathrm{False}
  wolfram:
    in: TreeGraphQ[Graph[List[1, 2, 3, 4], List[UndirectedEdge[1, 2], UndirectedEdge[3, 4]]]]
