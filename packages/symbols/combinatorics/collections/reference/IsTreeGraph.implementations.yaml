a-disconnected-forest-is-not-a-tree:
  epsil:
    in: IsTreeGraph(Graph([1, 2, 3, 4], [UndirectedEdge(1, 2), UndirectedEdge(3, 4)]))
    out: False
  tex:
    in: \mathrm{IsTreeGraph}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack))
    out: \bot
  traditional:
    in: \mathrm{IsTreeGraph}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack))
    out: \mathrm{False}
  fullform:
    in: TreeGraphQ[Graph[List[1, 2, 3, 4], List[UndirectedEdge[1, 2], UndirectedEdge[3, 4]]]]
  wolfram:
    in: TreeGraphQ[Graph[List[1, 2, 3, 4], List[UndirectedEdge[1, 2], UndirectedEdge[3, 4]]]]
