a-star-is-a-tree:
  epsil:
    in: IsTreeGraph(StarGraph(5))
    out: True
  tex:
    in: \mathrm{IsTreeGraph}(\mathrm{StarGraph}(5))
    out: \top
  traditional:
    in: \mathrm{IsTreeGraph}(\mathrm{StarGraph}(5))
    out: \mathrm{True}
  fullform:
    in: TreeGraphQ[StarGraph[5]]
  wolfram:
    in: TreeGraphQ[StarGraph[5]]
