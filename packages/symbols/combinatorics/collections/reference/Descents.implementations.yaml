only-3-1:
  epsil:
    in: Descents([3, 1, 2])
    out: "1"
  tex:
    in: \mathrm{Descents}(\bigl\lbrack3, 1, 2\bigr\rbrack)
    out: "1"
every-step-falls:
  epsil:
    in: Descents([3, 2, 1])
    out: "2"
  tex:
    in: \mathrm{Descents}(\bigl\lbrack3, 2, 1\bigr\rbrack)
    out: "2"
descents-and-ascents-partition-the-n-1-steps:
  epsil:
    in: Descents([3, 1, 2]) + Ascents([3, 1, 2]) == 2
    out: True
  tex:
    in: \mathrm{Descents}(\bigl\lbrack3, 1, 2\bigr\rbrack)+\mathrm{Ascents}(\bigl\lbrack3, 1, 2\bigr\rbrack)=2
    out: \top
  traditional:
    in: \mathrm{Descents}(\bigl\lbrack3, 1, 2\bigr\rbrack)+\mathrm{Ascents}(\bigl\lbrack3, 1, 2\bigr\rbrack)=2
    out: \mathrm{True}
