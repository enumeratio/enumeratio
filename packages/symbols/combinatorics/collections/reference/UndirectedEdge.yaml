name: UndirectedEdge
domain: Collections
signature: UndirectedEdge(u, v)
summary: An undirected edge between two vertices — the edge head [[Graph]] holds in its edge list.
signatures:
  - call: UndirectedEdge(u, v)
    description: an edge between $u$ and $v$, undirected — [[VertexDegree]] and the connectivity
      heads count it toward both endpoints and traverse it in either direction, regardless of
      which argument is which.
    library: enumeratio-collections
details:
  - Inert, like [[Graph]] itself — it holds exactly as written; nothing here evaluates it away.
  - "Wolfram prints this infix as $u \\leftrightarrow v$ (`u <-> v`); notatio has no infix form for
    it yet, so it round-trips through call-form syntax, `UndirectedEdge(u, v)`, which Wolfram
    accepts as equivalent input."
examples:
  - id: an-edge-between-1-and-2
    expr: [UndirectedEdge, 1, 2]
    expected: [UndirectedEdge, 1, 2]
    caption: An edge between 1 and 2
seeAlso:
  - DirectedEdge
  - Graph
