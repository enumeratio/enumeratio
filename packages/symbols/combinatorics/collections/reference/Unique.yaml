name: Unique
domain: Collections
signature: Unique(xs)
summary: The elements of a collection, each kept once, in first-occurrence order.
signatures:
  - call: Unique(xs)
    description: $xs$ with every repeat of an element dropped, keeping the first occurrence.
  - call: Unique(xs, test)
    description: as above, but two elements count as duplicates when $test$ holds for them, not just when they're structurally equal.
    library: enumeratio-collections
