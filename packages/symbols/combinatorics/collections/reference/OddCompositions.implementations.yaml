count-oddcompositions-6:
  epsil:
    in: Count(OddCompositions(6))
    out: "8"
  tex:
    in: \mathrm{Count}(\mathrm{OddCompositions}(6))
    out: "8"
  fullform:
    in: Count[OddCompositions[6]]
first-element-of-oddcompositions-6:
  epsil:
    in: OddCompositions(6)[1]
    out: "[1, 1, 1, 1, 1, 1]"
  tex:
    in: \mathrm{OddCompositions}(6)[1]
    out: \bigl\lbrack1, 1, 1, 1, 1, 1\bigr\rbrack
  fullform:
    in: Part[OddCompositions[6], 1]
every-element-of-oddcompositions-6:
  epsil:
    in: Take(OddCompositions(6), 8)
    out: |-
      [
        [1, 1, 1, 1, 1, 1],
        [1, 1, 1, 3],
        [1, 1, 3, 1],
        [1, 3, 1, 1],
        [1, 5],
        [3, 1, 1, 1],
        [3, 3],
        [5, 1],
      ]
  tex:
    in: \mathrm{Take}(\mathrm{OddCompositions}(6), 8)
    out: \bigl\lbrack\bigl\lbrack1, 1, 1, 1, 1, 1\bigr\rbrack, \bigl\lbrack1, 1, 1, 3\bigr\rbrack, \bigl\lbrack1, 1, 3, 1\bigr\rbrack, \bigl\lbrack1, 3, 1, 1\bigr\rbrack, \bigl\lbrack1, 5\bigr\rbrack, \bigl\lbrack3, 1, 1, 1\bigr\rbrack, \bigl\lbrack3, 3\bigr\rbrack, \bigl\lbrack5, 1\bigr\rbrack\bigr\rbrack
  fullform:
    in: Take[OddCompositions[6], 8]
