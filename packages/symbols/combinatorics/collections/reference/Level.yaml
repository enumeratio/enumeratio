name: Level
domain: Collections
signature: Level(expr, n) / Level(expr, {n}) / Level(expr, {n1, n2})
summary: Every subexpression of expr at the given level(s) — level 0 is expr itself.
signatures:
  - call: Level(expr, n)
    description: levels 1 through n
    library: enumeratio-collections
  - call: Level(expr, {n})
    description: level n alone
    library: enumeratio-collections
  - call: Level(expr, {n1, n2})
    description: levels n1 through n2
    library: enumeratio-collections
  - call: Level(expr, PositiveInfinity)
    description: every level, all the way to the leaves
    library: enumeratio-collections
  - call: Level(expr, {-1})
    description: every leaf, regardless of depth — Wolfram's own "leaves" shorthand
    library: enumeratio-collections
details:
  - Only `{-1}` (and bare `-1`) is supported among negative levels — Wolfram's general negative-level-from-the-leaves counting (`{-2}`, `{-3, -1}`, …) is left undone.
  - No 4th-argument predicate form, and no Heads option.
examples:
  - id: level-expr-1-gives-the-top-level-operands
    expr: [Level, [List, 1, [List, 2, 3], 4], 1]
    expected: [List, 1, [List, 2, 3], 4]
  - id: level-expr-0-is-just-expr-itself
    expr: [Level, [List, 1, [List, 2, 3]], [List, 0]]
    expected: [List, [List, 1, [List, 2, 3]]]
    category: Scope
  - id: level-expr-2-gives-levels-1-and-2-together
    expr: [Level, [List, 1, [List, 2, 3], 4], 2]
    expected: [List, 1, [List, 2, 3], 2, 3, 4]
    category: Scope
  - id: level-expr-1-gives-every-leaf
    expr: [Level, [List, 1, [List, 2, 3], 4], [List, -1]]
    expected: [List, 1, 2, 3, 4]
    category: Scope
    caption: "{-1} is Wolfram's own leaves shorthand"
  - id: level-expr-infinity-reaches-every-level
    expr: [Level, [List, 1, [List, 2, [List, 3]]], PositiveInfinity]
    expected: [List, 1, [List, 2, [List, 3]], 2, [List, 3], 3]
    category: Scope
seeAlso:
  - MapIndexed
  - Pick
