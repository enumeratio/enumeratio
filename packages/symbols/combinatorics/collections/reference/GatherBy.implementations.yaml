grouped-by-residue-mod-3:
  epsil:
    in: GatherBy([1, 2, 3, 4, 5, 6, 7], Function(_1 % 3))
    out: "[[1, 4, 7], [2, 5], [3, 6]]"
  tex:
    in: \mathrm{GatherBy}(\bigl\lbrack1, 2, 3, 4, 5, 6, 7\bigr\rbrack, ()\mapsto\operatorname{\_1}\bmod3)
    out: \bigl\lbrack\bigl\lbrack1, 4, 7\bigr\rbrack, \bigl\lbrack2, 5\bigr\rbrack, \bigl\lbrack3, 6\bigr\rbrack\bigr\rbrack
  fullform:
    in: GatherBy[List[1, 2, 3, 4, 5, 6, 7], Function[Mod[Slot[1], 3]]]
  wolfram:
    in: GatherBy[List[1, 2, 3, 4, 5, 6, 7], Function[Mod[Slot[1], 3]]]
grouped-by-absolute-value:
  epsil:
    in: GatherBy([-2, 1, 2, -1, 3], Abs)
    out: "[[-2, 2], [1, -1], [3]]"
  tex:
    in: \mathrm{GatherBy}(\bigl\lbrack-2, 1, 2, -1, 3\bigr\rbrack, \mathrm{Abs})
    out: \bigl\lbrack\bigl\lbrack-2, 2\bigr\rbrack, \bigl\lbrack1, -1\bigr\rbrack, \bigl\lbrack3\bigr\rbrack\bigr\rbrack
  fullform:
    in: GatherBy[List[-2, 1, 2, -1, 3], Abs]
  wolfram:
    in: GatherBy[List[-2, 1, 2, -1, 3], Abs]
pairs-grouped-by-their-last-element:
  epsil:
    in: GatherBy([[a, 1], [b, 2], [c, 1]], Last)
    out: "[[[a, 1], [c, 1]], [[b, 2]]]"
  tex:
    in: \mathrm{GatherBy}(\bigl\lbrack\bigl\lbrack a, 1\bigr\rbrack, \bigl\lbrack b, 2\bigr\rbrack, \bigl\lbrack c, 1\bigr\rbrack\bigr\rbrack, \mathrm{Last})
    out: \bigl\lbrack\bigl\lbrack\bigl\lbrack a, 1\bigr\rbrack, \bigl\lbrack c, 1\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack b, 2\bigr\rbrack\bigr\rbrack\bigr\rbrack
  fullform:
    in: GatherBy[List[List[a, 1], List[b, 2], List[c, 1]], Last]
