    in: VertexCount(CompleteKaryTree(3, 2))
    out: "7"
  tex:
    in: \mathrm{VertexCount}(\mathrm{CompleteKaryTree}(3, 2))
    out: "7"
  fullform:
    in: VertexCount[CompleteKaryTree[3, 2]]
