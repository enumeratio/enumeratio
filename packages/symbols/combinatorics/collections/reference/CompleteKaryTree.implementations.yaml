edge-list-of-a-3-level-binary-tree:
  epsil:
    in: EdgeList(CompleteKaryTree(3, 2))
    out: |-
      [
        UndirectedEdge(1, 2),
        UndirectedEdge(1, 3),
        UndirectedEdge(2, 4),
        UndirectedEdge(2, 5),
        UndirectedEdge(3, 6),
        UndirectedEdge(3, 7),
      ]
  tex:
    in: \mathrm{EdgeList}(\mathrm{CompleteKaryTree}(3, 2))
    out: \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(1, 3), \mathrm{UndirectedEdge}(2, 4), \mathrm{UndirectedEdge}(2, 5), \mathrm{UndirectedEdge}(3, 6), \mathrm{UndirectedEdge}(3, 7)\bigr\rbrack
  fullform:
    in: EdgeList[CompleteKaryTree[3, 2]]
  wolfram:
    in: EdgeList[CompleteKaryTree[3, 2]]
