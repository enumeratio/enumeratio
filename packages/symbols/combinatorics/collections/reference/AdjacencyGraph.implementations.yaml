symmetric-matrix-is-undirected:
  epsil:
    in: EdgeList(AdjacencyGraph([[0, 1, 1], [1, 0, 0], [1, 0, 0]]))
    out: "[UndirectedEdge(1, 2), UndirectedEdge(1, 3)]"
  tex:
    in: \mathrm{EdgeList}(\mathrm{AdjacencyGraph}(\bigl\lbrack\bigl\lbrack0, 1, 1\bigr\rbrack, \bigl\lbrack1, 0, 0\bigr\rbrack, \bigl\lbrack1, 0, 0\bigr\rbrack\bigr\rbrack))
    out: \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(1, 3)\bigr\rbrack
  fullform:
    in: EdgeList[AdjacencyGraph[List[List[0, 1, 1], List[1, 0, 0], List[1, 0, 0]]]]
  wolfram:
    in: EdgeList[AdjacencyGraph[List[List[0, 1, 1], List[1, 0, 0], List[1, 0, 0]]]]
asymmetric-matrix-is-directed:
  epsil:
    in: EdgeList(AdjacencyGraph([[0, 1], [0, 0]]))
    out: "[DirectedEdge(1, 2)]"
  tex:
    in: \mathrm{EdgeList}(\mathrm{AdjacencyGraph}(\bigl\lbrack\bigl\lbrack0, 1\bigr\rbrack, \bigl\lbrack0, 0\bigr\rbrack\bigr\rbrack))
    out: \bigl\lbrack\mathrm{DirectedEdge}(1, 2)\bigr\rbrack
  fullform:
    in: EdgeList[AdjacencyGraph[List[List[0, 1], List[0, 0]]]]
  wolfram:
    in: EdgeList[AdjacencyGraph[List[List[0, 1], List[0, 0]]]]
