binary-tree-on-seven-vertices:
  epsil:
    in: KaryTree(7, 2)
    out: |-
      Graph([1, 2, 3, 4, 5, 6, 7], [
                                     UndirectedEdge(1, 2),
                                     UndirectedEdge(1, 3),
                                     UndirectedEdge(2, 4),
                                     UndirectedEdge(2, 5),
                                     UndirectedEdge(3, 6),
                                     UndirectedEdge(3, 7),
                                   ])
  tex:
    in: \mathrm{KaryTree}(7, 2)
    out: \mathrm{Graph}(\bigl\lbrack1, 2, 3, 4, 5, 6, 7\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(1, 3), \mathrm{UndirectedEdge}(2, 4), \mathrm{UndirectedEdge}(2, 5), \mathrm{UndirectedEdge}(3, 6), \mathrm{UndirectedEdge}(3, 7)\bigr\rbrack)
  fullform:
    in: KaryTree[7, 2]
  wolfram:
    in: KaryTree[7, 2]
