- id: distance-along-a-path-graph
  expr: [GraphDistance, [PathGraph, 5], 1, 5]
  expected: 4
- id: unreachable-is-infinite
  expr: [GraphDistance, [Graph, [List, 1, 2, 3, 4], [List, [DirectedEdge, 1, 2], [UndirectedEdge, 3, 4]]], 4, 1]
  expected: PositiveInfinity
  caption: No directed path back, so the distance is infinite
- id: unreachable-against-a-longer-directed-chain
  expr:
    [
      GraphDistance,
      [Graph, [List, 1, 2, 3, 4], [List, [DirectedEdge, 1, 2], [DirectedEdge, 2, 3], [UndirectedEdge, 3, 4]]],
      4,
      1,
    ]
  expected: PositiveInfinity
  role: test
- id: weighted-distance-is-summed-weight-not-hop-count
  expr:
    [
      GraphDistance,
      [
        Graph,
        [List, 1, 2, 3],
        [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 2, 3]],
        [KeyValuePair, EdgeWeight, [List, 5, 7]],
      ],
      1,
      3,
    ]
  expected: 12
  caption: With EdgeWeight given, the distance is the summed weight along the path (5 + 7), not the 2-edge hop count
