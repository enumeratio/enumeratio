name: UpTo
domain: Collections
signature: UpTo(n)
summary: A count specification meaning at most n, taking fewer when fewer are available.
signatures:
  - call: UpTo(n)
    description: at most $n$ — never an error for asking for more than a collection holds. Never evaluated on its own — read by [[Take]], [[Partition]] and [[Ordering]].
    library: enumeratio-collections
details:
  - 'Never reduces by itself: a count specification other heads read, not a value.'
  - In [[Take]], takes at most n elements with no error when fewer are available.
  - In [[Partition]], allows a shorter final chunk instead of dropping the ragged remainder.
  - In [[Ordering]], the same clamping a plain integer count already gives — at most n positions, fewer if the collection is shorter.
examples:
  - id: asking-for-up-to-5-of-3-elements-takes-all-3
    expr: [Take, [List, 1, 2, 3], [UpTo, 5]]
    expected: [List, 1, 2, 3]
    caption: Asking for up to 5 of 3 elements takes all 3, with no error
  - id: when-enough-elements-are-available-exactly-n-is
    expr: [Take, [List, 1, 2, 3, 4, 5, 6], [UpTo, 2]]
    expected: [List, 1, 2]
    caption: When enough elements are available, exactly n is taken
  - id: in-partition-a-shorter-final-chunk-is-allowed
    expr: [Partition, [List, 1, 2, 3, 4, 5, 6], [UpTo, 4]]
    expected: [List, [List, 1, 2, 3, 4], [List, 5, 6]]
    category: Scope
    caption: In [[Partition]], a shorter final chunk is allowed
  - id: in-ordering-at-most-6-positions-of-a-5-element
    expr: [Ordering, [List, 2, 6, 1, 9, 2], [UpTo, 6]]
    expected: [List, 3, 1, 5, 2, 4]
    category: Scope
    caption: In [[Ordering]], at most 6 positions of a 5-element list
seeAlso:
  - Partition
  - Ordering
  - Span
