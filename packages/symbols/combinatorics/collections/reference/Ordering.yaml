name: Ordering
domain: Collections
signature: Ordering(collection)
summary: The permutation of indices that would sort the collection into increasing order.
signatures:
  - call: Ordering(collection)
    description: the permutation of indices that sorts the collection into increasing order.
  - call: Ordering(collection, n)
    description: just the first `n` indices of the full ordering; a negative `n` takes the last `|n|` (the largest elements); `{m, n}` takes positions `m` through `n` of the full ordering; `UpTo(n)` caps at `n` without erroring on a shorter collection.
    library: enumeratio-collections
  - call: Ordering(collection, All, Greater)
    description: every index, ordered descending rather than ascending.
    library: enumeratio-collections
details:
  - "$c[[Ordering(c)]] = Sort(c)$: applying the permutation at those positions recovers [[Sort]]'s result."
  - Ties break in favor of earlier position, i.e. it's a stable ordering.
  - Symbols order alphabetically by name, matching Wolfram's canonical ordering.
  - A second argument $n$ takes just the first $n$ indices of the full ordering; see the signatures above for the negative-count, $\{m, n\}$, and $UpTo$ forms.
seeAlso:
  - Sort
  - UpTo
