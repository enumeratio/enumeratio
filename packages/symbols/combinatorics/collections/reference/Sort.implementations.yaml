sort-list-3-1-2:
  epsil:
    in: Sort([3, 1, 2])
    out: "[1, 2, 3]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack)
    out: \bigl\lbrack1, 2, 3\bigr\rbrack
  fullform:
    in: Sort[List[3, 1, 2]]
  wolfram:
    in: Sort[List[3, 1, 2]]
    out: "{1, 2, 3}"
    tex:
      in: \text{Sort}[\{3,1,2\}]
      out: \{1,2,3\}
sort-list-4-2-5-1-3:
  epsil:
    in: Sort([4, 2, 5, 1, 3])
    out: "[1, 2, 3, 4, 5]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack4, 2, 5, 1, 3\bigr\rbrack)
    out: \bigl\lbrack1, 2, 3, 4, 5\bigr\rbrack
  fullform:
    in: Sort[List[4, 2, 5, 1, 3]]
  wolfram:
    in: Sort[List[4, 2, 5, 1, 3]]
    out: "{1, 2, 3, 4, 5}"
    tex:
      in: \text{Sort}[\{4,2,5,1,3\}]
      out: \{1,2,3,4,5\}
sort-is-idempotent-sorting-an-already-sorted:
  epsil:
    in: Sort(Sort([3, 1, 2])) == Sort([3, 1, 2])
    out: True
  tex:
    in: \mathrm{Sort}(\mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack))=\mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Sort}(\mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack))=\mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: Equal[Sort[Sort[List[3, 1, 2]]], Sort[List[3, 1, 2]]]
  wolfram:
    in: (Sort[Sort[List[3, 1, 2]]] == Sort[List[3, 1, 2]])
    out: True
    tex:
      in: \text{Sort}[\text{Sort}[\{3,1,2\}]]=\text{Sort}[\{3,1,2\}]
      out: \text{True}
sort-c-at-c-ordering-c-see-ordering-and-at:
  epsil:
    in: Sort([3, 1, 2]) == [3, 1, 2][Ordering([3, 1, 2])]
    out: True
  tex:
    in: \mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack)=\bigl\lbrack3, 1, 2\bigr\rbrack[\mathrm{Ordering}(\bigl\lbrack3, 1, 2\bigr\rbrack)]
    out: \top
  traditional:
    in: \mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack)=\bigl\lbrack3, 1, 2\bigr\rbrack[\mathrm{Ordering}(\bigl\lbrack3, 1, 2\bigr\rbrack)]
    out: \mathrm{True}
  fullform:
    in: Equal[Sort[List[3, 1, 2]], Part[List[3, 1, 2], Ordering[List[3, 1, 2]]]]
  wolfram:
    in: (Sort[List[3, 1, 2]] == Part[List[3, 1, 2], Ordering[List[3, 1, 2]]])
    out: True
    tex:
      in: \text{Sort}[\{3,1,2\}]=\{3,1,2\}[[\text{Ordering}[\{3,1,2\}]]]
      out: \text{True}
a-custom-comparator-sorts-in-a-different-order:
  epsil:
    in: Sort([3, 1, 2], Function(_1 > _2))
    out: "[3, 2, 1]"
    back: Unreadable
  tex:
    in: \mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack, ()\mapsto\operatorname{\_1}\gt\operatorname{\_2})
    out: \bigl\lbrack3, 2, 1\bigr\rbrack
  fullform:
    in: Sort[List[3, 1, 2], Function[Greater[Slot[1], Slot[2]]]]
  wolfram:
    in: Sort[List[3, 1, 2], Function[Greater[Slot[1], Slot[2]]]]
    out: "{3, 2, 1}"
    tex:
      in: \text{Sort}[\{3,1,2\},\text{$\#$1}>\text{$\#$2}\&]
      out: \{3,2,1\}
a-list-of-strings-sorts-lexicographically:
  epsil:
    in: Sort([banana, apple, cherry])
    out: "[apple, banana, cherry]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack\mathrm{banana}, \mathrm{apple}, \mathrm{cherry}\bigr\rbrack)
    out: \bigl\lbrack\mathrm{apple}, \mathrm{banana}, \mathrm{cherry}\bigr\rbrack
  fullform:
    in: Sort[List[banana, apple, cherry]]
  wolfram:
    in: Sort[List[banana, apple, cherry]]
    out: "{apple, banana, cherry}"
    tex:
      in: \text{Sort}[\{\text{banana},\text{apple},\text{cherry}\}]
      out: \{\text{apple},\text{banana},\text{cherry}\}
symbols-sort-alphabetically:
  epsil:
    in: Sort([d, b, c, a])
    out: "[a, b, c, d]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack d, b, c, a\bigr\rbrack)
    out: \bigl\lbrack a, b, c, d\bigr\rbrack
  fullform:
    in: Sort[List[d, b, c, a]]
  wolfram:
    in: Sort[List[d, b, c, a]]
    out: "{a, b, c, d}"
    tex:
      in: \text{Sort}[\{d,b,c,a\}]
      out: \{a,b,c,d\}
integers-rationals-and-floats-together-sort-by:
  epsil:
    in: Sort([3 / 2, 1, 0.5, -2])
    out: "[-2, 0.5, 1, 3 / 2]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack\frac{3}{2}, 1, 0.5, -2\bigr\rbrack)
    out: \bigl\lbrack-2, 0.5, 1, \frac{3}{2}\bigr\rbrack
  fullform:
    in: Sort[List[Rational[3, 2], 1, 0.5, -2]]
  wolfram:
    in: Sort[List[Rational[3, 2], 1, 0.5, -2]]
exact-numeric-constants-sort-by-their-value:
  epsil:
    in: Sort([Pi, ExponentialE, 2, 3, 1, Sqrt(2)])
    out: "[1, Sqrt(2), 2, ExponentialE, 3, Pi]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack\pi, e, 2, 3, 1, \sqrt{2}\bigr\rbrack)
    out: \bigl\lbrack1, \sqrt{2}, 2, e, 3, \pi\bigr\rbrack
  fullform:
    in: Sort[List[Pi, E, 2, 3, 1, Sqrt[2]]]
  wolfram:
    in: Sort[List[Pi, E, 2, 3, 1, Sqrt[2]]]
    note: "Wolfram's default canonical order puts explicit numbers before symbolic ones: {1, 2, 3, Sqrt[2], E, Pi}; Sort[…, Less] gives this numeric order."
less-as-the-ordering-function-sorts-by-numeric:
  epsil:
    in: Sort([Pi, ExponentialE, 2, 3, 1, Sqrt(2)], Less)
    out: "[1, Sqrt(2), 2, ExponentialE, 3, Pi]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack\pi, e, 2, 3, 1, \sqrt{2}\bigr\rbrack, \mathrm{Less})
    out: \bigl\lbrack1, \sqrt{2}, 2, e, 3, \pi\bigr\rbrack
  fullform:
    in: Sort[List[Pi, E, 2, 3, 1, Sqrt[2]], Less]
  wolfram:
    in: Sort[List[Pi, E, 2, 3, 1, Sqrt[2]], Less]
a-named-ordering-function-greater-sorts-in:
  epsil:
    in: Sort([4, 1, 3, 2, 2], Greater)
    out: "[4, 3, 2, 2, 1]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack4, 1, 3, 2, 2\bigr\rbrack, \mathrm{Greater})
    out: \bigl\lbrack4, 3, 2, 2, 1\bigr\rbrack
  fullform:
    in: Sort[List[4, 1, 3, 2, 2], Greater]
  wolfram:
    in: Sort[List[4, 1, 3, 2, 2], Greater]
sorting-pairs-by-their-second-element-with-a:
  epsil:
    in: Sort([[a, 2], [c, 1], [d, 3]], Function(_1[2] < _2[2]))
    out: "[[c, 1], [a, 2], [d, 3]]"
    back: Unreadable
  tex:
    in: \mathrm{Sort}(\bigl\lbrack\bigl\lbrack a, 2\bigr\rbrack, \bigl\lbrack c, 1\bigr\rbrack, \bigl\lbrack d, 3\bigr\rbrack\bigr\rbrack, ()\mapsto\operatorname{\_1}[2]\lt\operatorname{\_2}[2])
    out: \bigl\lbrack\bigl\lbrack c, 1\bigr\rbrack, \bigl\lbrack a, 2\bigr\rbrack, \bigl\lbrack d, 3\bigr\rbrack\bigr\rbrack
  fullform:
    in: Sort[List[List[a, 2], List[c, 1], List[d, 3]], Function[Less[Part[Slot[1], 2], Part[Slot[2], 2]]]]
  wolfram:
    in: Sort[List[List[a, 2], List[c, 1], List[d, 3]], Function[Less[Part[Slot[1], 2], Part[Slot[2], 2]]]]
    out: "{{c, 1}, {a, 2}, {d, 3}}"
    tex:
      in: \text{Sort}\left[\left( \begin{array}{cc}  a & 2 \\  c & 1 \\  d & 3 \\ \end{array} \right),\text{$\#$1}[[2]]<\text{$\#$2}[[2]]\&\right]
      out: \left( \begin{array}{cc}  c & 1 \\  a & 2 \\  d & 3 \\ \end{array} \right)
sorts-the-arguments-of-any-head-not-just-a-list:
  epsil:
    in: Sort(f(b, a, c))
    out: f(a, b, c)
  tex:
    in: \mathrm{Sort}(f(b, a, c))
    out: f(a, b, c)
  fullform:
    in: Sort[f[b, a, c]]
  wolfram:
    in: Sort[f[b, a, c]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Sort}[f(b,a,c)]-f(a,b,c)],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Sort}\left[f\left(-\frac{11}{5},\frac{7}{3},\frac{13}{4}\right)\right]-f\left(\frac{7}{3},-\frac{11}{5},\frac{13}{4}\right)\right]\right],\text{Chop}\left[N\left[\text{Sort}\left[f\left(-\frac{23}{9},\frac{19}{8},\frac{7}{3}\right)\right]-f\left(\frac{19}{8},-\frac{23}{9},\frac{7}{3}\right)\right]\right],\text{Chop}\left[N\left[\text{Sort}\left[f\left(-\frac{17}{6},\frac{13}{4},\frac{19}{8}\right)\right]-f\left(\frac{13}{4},-\frac{17}{6},\frac{19}{8}\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
the-result-doesn-t-depend-on-the-input-order:
  epsil:
    in: Sort(Reverse([3, 1, 2])) == Sort([3, 1, 2])
    out: True
  tex:
    in: \mathrm{Sort}(\mathrm{Reverse}(\bigl\lbrack3, 1, 2\bigr\rbrack))=\mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Sort}(\mathrm{Reverse}(\bigl\lbrack3, 1, 2\bigr\rbrack))=\mathrm{Sort}(\bigl\lbrack3, 1, 2\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: Equal[Sort[Reverse[List[3, 1, 2]]], Sort[List[3, 1, 2]]]
  wolfram:
    in: (Sort[Reverse[List[3, 1, 2]]] == Sort[List[3, 1, 2]])
the-empty-list-sorts-to-itself:
  epsil:
    in: Sort([])
    out: "[]"
  tex:
    in: \mathrm{Sort}(\bigl\lbrack\bigr\rbrack)
    out: \bigl\lbrack\bigr\rbrack
  fullform:
    in: Sort[List[]]
  wolfram:
    in: Sort[List[]]
sort-association-orders-by-value:
  epsil:
    in: Sort(Association(Rule(a, 4), Rule(b, 1), Rule(c, 3)))
    out: Association(Rule(b, 1), Rule(c, 3), Rule(a, 4))
  tex:
    in: \mathrm{Sort}(\mathrm{Association}(\mathrm{Rule}(a, 4), \mathrm{Rule}(b, 1), \mathrm{Rule}(c, 3)))
    out: \mathrm{Association}(\mathrm{Rule}(b, 1), \mathrm{Rule}(c, 3), \mathrm{Rule}(a, 4))
  fullform:
    in: Sort[Association[Rule[a, 4], Rule[b, 1], Rule[c, 3]]]
  wolfram:
    in: Sort[Association[Rule[a, 4], Rule[b, 1], Rule[c, 3]]]
    out: <|b -> 1, c -> 3, a -> 4|>
    tex:
      in: \text{Sort}[\text{Association}[a\to 4,b\to 1,c\to 3]]
      out: \unicode{f113}b\to 1,c\to 3,a\to 4\unicode{f114}
