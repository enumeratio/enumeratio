count-palindromiccompositions-6:
  epsil:
    in: Count(PalindromicCompositions(6))
    out: "8"
  tex:
    in: \mathrm{Count}(\mathrm{PalindromicCompositions}(6))
    out: "8"
  fullform:
    in: Count[PalindromicCompositions[6]]
first-element-of-palindromiccompositions-6:
  epsil:
    in: PalindromicCompositions(6)[1]
    out: "[1, 1, 2, 1, 1]"
  tex:
    in: \mathrm{PalindromicCompositions}(6)[1]
    out: \bigl\lbrack1, 1, 2, 1, 1\bigr\rbrack
  fullform:
    in: Part[PalindromicCompositions[6], 1]
every-element-of-palindromiccompositions-6:
  epsil:
    in: Take(PalindromicCompositions(6), 8)
    out: |-
      [
        [1, 1, 2, 1, 1],
        [2, 2, 2],
        [1, 4, 1],
        [6],
        [1, 1, 1, 1, 1, 1],
        [1, 2, 2, 1],
        [2, 1, 1, 2],
        [3, 3],
      ]
  tex:
    in: \mathrm{Take}(\mathrm{PalindromicCompositions}(6), 8)
    out: \bigl\lbrack\bigl\lbrack1, 1, 2, 1, 1\bigr\rbrack, \bigl\lbrack2, 2, 2\bigr\rbrack, \bigl\lbrack1, 4, 1\bigr\rbrack, \bigl\lbrack6\bigr\rbrack, \bigl\lbrack1, 1, 1, 1, 1, 1\bigr\rbrack, \bigl\lbrack1, 2, 2, 1\bigr\rbrack, \bigl\lbrack2, 1, 1, 2\bigr\rbrack, \bigl\lbrack3, 3\bigr\rbrack\bigr\rbrack
  fullform:
    in: Take[PalindromicCompositions[6], 8]
