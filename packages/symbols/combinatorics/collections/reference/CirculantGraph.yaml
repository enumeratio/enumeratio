name: CirculantGraph
domain: Collections
signature: CirculantGraph(n, connections)
summary: The circulant graph on n vertices arranged in a circle, joined by one or more fixed offsets.
signatures:
  - call: CirculantGraph(n, k)
    description: vertex i joined to i +/- k (mod n), for a single offset k.
    library: enumeratio-collections
  - call: CirculantGraph(n, {k1, k2, …})
    description: the union of the connection sets for every offset given.
    library: enumeratio-collections
details:
  - Each vertex has degree 2 per offset, except an offset of exactly n/2 (n even), which gives only one edge per vertex (i and i + n/2 are each other's only match at that offset).
examples:
  - id: single-offset-is-2-regular
    expr: [VertexDegree, [CirculantGraph, 8, 2], 1]
    expected: 2
  - id: two-offsets-union
    expr: [EdgeCount, [CirculantGraph, 10, [List, 1, 3]]]
    expected: 20
seeAlso:
  - CycleGraph
  - HararyGraph
