  wolfram:
    in: First[List[1, 2, 3], 99]
first-of-association-is-first-value:
  epsil:
    in: First(Association(Rule(1, a), Rule(2, b), Rule(3, c)))
    out: a
  tex:
    in: \mathrm{First}(\mathrm{Association}(\mathrm{Rule}(1, a), \mathrm{Rule}(2, b), \mathrm{Rule}(3, c)))
    out: a
  fullform:
    in: First[Association[Rule[1, a], Rule[2, b], Rule[3, c]]]
  wolfram:
    in: First[Association[Rule[1, a], Rule[2, b], Rule[3, c]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{First}[\text{Association}[1\to a,2\to b,3\to c]]-a],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{7}{3},2\to -\frac{11}{5},3\to \frac{13}{4}\right]\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to -\frac{17}{6},2\to \frac{19}{8},3\to -\frac{23}{9}\right]\right]--\frac{17}{6}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{7}{3},2\to -\frac{11}{5},3\to \frac{13}{4}\right]\right]-\frac{7}{3}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
first-of-empty-association-falls-through:
  epsil:
    in: First(Association(), 99)
