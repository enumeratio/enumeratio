first-list-1-2-3:
  epsil:
    in: First([1, 2, 3])
    out: "1"
  tex:
    in: \mathrm{First}(\bigl\lbrack1, 2, 3\bigr\rbrack)
    out: "1"
  fullform:
    in: First[List[1, 2, 3]]
  wolfram:
    in: First[List[1, 2, 3]]
    out: "1"
    tex:
      in: \text{First}[\{1,2,3\}]
      out: "1"
first-list-10-20-30:
  epsil:
    in: First([10, 20, 30])
    out: "10"
  tex:
    in: \mathrm{First}(\bigl\lbrack10, 20, 30\bigr\rbrack)
    out: "10"
  fullform:
    in: First[List[10, 20, 30]]
  wolfram:
    in: First[List[10, 20, 30]]
    out: "10"
    tex:
      in: \text{First}[\{10,20,30\}]
      out: "10"
first-c-at-c-1-see-at:
  epsil:
    in: First([1, 2, 3]) == [1, 2, 3][1]
    out: True
  tex:
    in: \mathrm{First}(\bigl\lbrack1, 2, 3\bigr\rbrack)=\bigl\lbrack1, 2, 3\bigr\rbrack[1]
    out: \top
  traditional:
    in: \mathrm{First}(\bigl\lbrack1, 2, 3\bigr\rbrack)=\bigl\lbrack1, 2, 3\bigr\rbrack[1]
    out: \mathrm{True}
  fullform:
    in: Equal[First[List[1, 2, 3]], Part[List[1, 2, 3], 1]]
  wolfram:
    in: (First[List[1, 2, 3]] == Part[List[1, 2, 3], 1])
    out: True
    tex:
      in: \text{First}[\{1,2,3\}]=\{1,2,3\}[[1]]
      out: \text{True}
an-empty-collection-has-no-first-element-compute:
  epsil:
    in: First([])
    out: Missing
  tex:
    in: \mathrm{First}(\bigl\lbrack\bigr\rbrack)
    out: \mathrm{Missing}
  fullform:
    in: First[List[]]
  wolfram:
    in: First[List[]]
    out: First[{}]
    tex:
      in: \text{First}[\{\}]
      out: \text{First}[\{\}]
    verdict: disagree
    kind: undefined-form
    note: First of an empty list is the symbol Missing here; Wolfram leaves First[{}] unevaluated (with a First::nofirst message).
a-second-argument-supplies-a-default-for-an:
  epsil:
    in: First([], 99)
    out: "99"
  tex:
    in: \mathrm{First}(\bigl\lbrack\bigr\rbrack, 99)
    out: "99"
  fullform:
    in: First[List[], 99]
  wolfram:
    in: First[List[], 99]
first-list-a-b-c:
  epsil:
    in: First([a, b, c])
    out: a
  tex:
    in: \mathrm{First}(\bigl\lbrack a, b, c\bigr\rbrack)
    out: a
  fullform:
    in: First[List[a, b, c]]
  wolfram:
    in: First[List[a, b, c]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{First}[\{a,b,c\}]-a],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{First}\left[\left\{\frac{7}{3},-\frac{11}{5},\frac{13}{4}\right\}\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\left\{-\frac{17}{6},\frac{19}{8},-\frac{23}{9}\right\}\right]--\frac{17}{6}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\left\{\frac{7}{3},-\frac{11}{5},\frac{13}{4}\right\}\right]-\frac{7}{3}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
of-a-matrix-the-first-row:
  epsil:
    in: First([[a, b], [c, d]])
    out: "[a, b]"
  tex:
    in: \mathrm{First}(\bigl\lbrack\bigl\lbrack a, b\bigr\rbrack, \bigl\lbrack c, d\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack a, b\bigr\rbrack
  fullform:
    in: First[List[List[a, b], List[c, d]]]
  wolfram:
    in: First[List[List[a, b], List[c, d]]]
    out: "{a, b}"
    tex:
      in: \text{First}\left[\left( \begin{array}{cc}  a & b \\  c & d \\ \end{array} \right)\right]
      out: \{a,b\}
a-lazy-range-works-too:
  epsil:
    in: First(Range(5, 10))
    out: "5"
  tex:
    in: \mathrm{First}(5..10)
    out: "5"
  fullform:
    in: First[Range[5, 10]]
  wolfram:
    in: First[Range[5, 10]]
any-expression-not-just-a-list-the-first-term-of:
  epsil:
    in: First(a ^ 2 + b ^ 2)
    out: a ^ 2
  tex:
    in: \mathrm{First}(a^2+b^2)
    out: a^2
  fullform:
    in: First[Plus[Power[a, 2], Power[b, 2]]]
  wolfram:
    in: First[Plus[Power[a, 2], Power[b, 2]]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{First}\left[a^2+b^2\right]-a^2\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{First}\left[\left(\frac{7}{3}\right)^2+\left(-\frac{11}{5}\right)^2\right]-\left(\frac{7}{3}\right)^2\right]\right],\text{Chop}\left[N\left[\text{First}\left[\left(\frac{13}{4}\right)^2+\left(-\frac{17}{6}\right)^2\right]-\left(\frac{13}{4}\right)^2\right]\right],\text{Chop}\left[N\left[\text{First}\left[\left(\frac{19}{8}\right)^2+\left(-\frac{23}{9}\right)^2\right]-\left(\frac{19}{8}\right)^2\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-default-is-ignored-when-the-collection-has-a:
  epsil:
    in: First([a, b], x)
    out: a
  tex:
    in: \mathrm{First}(\bigl\lbrack a, b\bigr\rbrack, x)
    out: a
  fullform:
    in: First[List[a, b], x]
  wolfram:
    in: First[List[a, b], x]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{First}[\{a,b\},x]-a],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{First}\left[\left\{\frac{7}{3},-\frac{11}{5}\right\},\frac{13}{4}\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\left\{-\frac{17}{6},\frac{19}{8}\right\},-\frac{23}{9}\right]--\frac{17}{6}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\left\{\frac{7}{3},-\frac{11}{5}\right\},\frac{13}{4}\right]-\frac{7}{3}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
first-default-ignored-when-nonempty:
  epsil:
    in: First([1, 2, 3], 99)
    out: "1"
  tex:
    in: \mathrm{First}(\bigl\lbrack1, 2, 3\bigr\rbrack, 99)
    out: "1"
