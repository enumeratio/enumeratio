  tex:
    in: \mathrm{First}(\mathrm{Association}(), 99)
    out: "99"
  fullform:
    in: First[Association[], 99]
  wolfram:
    in: First[Association[], 99]
first-of-nonempty-association-ignores-default:
  epsil:
    in: First(Association(Rule(1, a), Rule(2, b)), 99)
    out: a
  tex:
    in: \mathrm{First}(\mathrm{Association}(\mathrm{Rule}(1, a), \mathrm{Rule}(2, b)), 99)
    out: a
  fullform:
    in: First[Association[Rule[1, a], Rule[2, b]], 99]
  wolfram:
    in: First[Association[Rule[1, a], Rule[2, b]], 99]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{First}[\text{Association}[1\to a,2\to b],99]-a],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{7}{3},2\to -\frac{11}{5}\right],99\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{13}{4},2\to -\frac{17}{6}\right],99\right]-\frac{13}{4}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{19}{8},2\to -\frac{23}{9}\right],99\right]-\frac{19}{8}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
