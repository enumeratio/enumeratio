edge-count-of-k4:
  epsil:
    in: EdgeCount(CompleteGraph(4))
    out: "6"
  tex:
    in: \mathrm{EdgeCount}(\mathrm{CompleteGraph}(4))
    out: "6"
  fullform:
    in: EdgeCount[CompleteGraph[4]]
  wolfram:
    in: EdgeCount[CompleteGraph[4]]
edge-count-of-a-triangle:
  epsil:
    in: |-
      EdgeCount(Graph([
                        UndirectedEdge(1, 2),
                        UndirectedEdge(2, 3),
                        UndirectedEdge(3, 1),
                      ]))
    out: "3"
  tex:
    in: \mathrm{EdgeCount}(\mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 1)\bigr\rbrack))
    out: "3"
  fullform:
    in: EdgeCount[Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3], UndirectedEdge[3, 1]]]]
  wolfram:
    in: EdgeCount[Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3], UndirectedEdge[3, 1]]]]
