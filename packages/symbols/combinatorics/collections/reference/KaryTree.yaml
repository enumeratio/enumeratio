name: KaryTree
domain: Collections
signature: KaryTree(n) / KaryTree(n, k)
summary: The k-ary tree on n vertices, in breadth-first (heap) layout — sized by vertex count, not depth.
signatures:
  - call: KaryTree(n)
    description: the binary (k = 2) tree on n vertices
    library: enumeratio-collections
  - call: KaryTree(n, k)
    description: the k-ary tree on n vertices
    library: enumeratio-collections
details:
  - Vertex i's parent is ⌊(i - 2) / k⌋ + 1 — the same heap layout [[CompleteKaryTree]] uses, but sized by VERTEX COUNT rather than level count, so the last level need not be full.
  - NOT the same thing as our KAryTrees DOMAIN (the combinatorial family of every n-node k-ary tree shape, for ranking/enumeration) or [[CompleteKaryTree]] (a LEVEL count, always perfectly filled) — three different heads that happen to share a name fragment.
examples:
  - id: binary-tree-on-seven-vertices
    expr: [KaryTree, 7, 2]
    expected:
      [
        Graph,
        [List, 1, 2, 3, 4, 5, 6, 7],
        [
          List,
          [UndirectedEdge, 1, 2],
          [UndirectedEdge, 1, 3],
          [UndirectedEdge, 2, 4],
          [UndirectedEdge, 2, 5],
          [UndirectedEdge, 3, 6],
          [UndirectedEdge, 3, 7],
        ],
      ]
  - id: default-k-is-2
    expr: [KaryTree, 5]
    expected:
      [
        Graph,
        [List, 1, 2, 3, 4, 5],
        [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 1, 3], [UndirectedEdge, 2, 4], [UndirectedEdge, 2, 5]],
      ]
    category: Scope
    caption: The default k = 2, the same binary tree KaryTree(5, 2) builds
seeAlso:
  - CompleteKaryTree
