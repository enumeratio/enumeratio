name: VertexInDegree
domain: Collections
signature: VertexInDegree(g, v)
summary: The number of edges of a [[Graph]] pointing INTO a vertex.
signatures:
  - call: VertexInDegree(g)
    description: every vertex's in-degree, in VertexList(g) order.
    library: enumeratio-collections
  - call: VertexInDegree(g, v)
    description: just v's in-degree.
    library: enumeratio-collections
details:
  - An undirected edge counts toward BOTH endpoints' in-degree and out-degree (it's bidirectional), so on an all-undirected graph VertexInDegree = VertexOutDegree = VertexDegree; on an all-directed graph VertexInDegree + VertexOutDegree = VertexDegree instead, since a directed edge counts only once, at whichever end it actually touches.
examples:
  - id: directed-edge-counts-once-at-the-head
    expr: [VertexInDegree, [Graph, [List, 1, 2, 3], [List, [DirectedEdge, 1, 2], [DirectedEdge, 3, 2]]], 2]
    expected: 2
seeAlso:
  - VertexOutDegree
  - VertexDegree
