fibonacci:
  epsil:
    in: GeneratingFunction(Fibonacci(n), n, x)
    out: x / (-x ^ 2 - x + 1)
  tex:
    in: \mathrm{GeneratingFunction}(\mathrm{Fibonacci}(n), n, x)
    out: (x)(-x^2-x+1)^{-1}
  traditional:
    in: \mathrm{GeneratingFunction}(F_{n}, n, x)
    out: (x)(-x^2-x+1)^{-1}
  fullform:
    in: GeneratingFunction[Fibonacci[n], n, x]
  wolfram:
    in: GeneratingFunction[Fibonacci[n], n, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{G}_n\left[F_n\right](x)-\frac{x}{-x^2-x+1}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{G}_{\frac{7}{3}}\left[F_{\frac{7}{3}}\right]\left(-\frac{11}{5}\right)--\frac{\frac{11}{5}}{-\left(-\frac{11}{5}\right)^2--\frac{11}{5}+1}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{13}{4}}\left[F_{\frac{13}{4}}\right]\left(-\frac{17}{6}\right)--\frac{\frac{17}{6}}{-\left(-\frac{17}{6}\right)^2--\frac{17}{6}+1}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{19}{8}}\left[F_{\frac{19}{8}}\right]\left(-\frac{23}{9}\right)--\frac{\frac{23}{9}}{-\left(-\frac{23}{9}\right)^2--\frac{23}{9}+1}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
catalan-numbers:
  epsil:
    in: GeneratingFunction(CatalanNumber(n), n, x)
    out: (-Sqrt(-4 * x + 1) + 1) / (2x)
  tex:
    in: \mathrm{GeneratingFunction}(\mathrm{CatalanNumber}(n), n, x)
    out: \frac{1-\sqrt{1-4x}}{2x}
  traditional:
    in: \mathrm{GeneratingFunction}(C_{n}, n, x)
    out: \frac{1-\sqrt{1-4x}}{2x}
  fullform:
    in: GeneratingFunction[CatalanNumber[n], n, x]
  wolfram:
    in: GeneratingFunction[CatalanNumber[n], n, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{G}_n\left[C_n\right](x)-\frac{-\sqrt{-4 x+1}+1}{2 x}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{G}_{\frac{7}{3}}\left[C_{\frac{7}{3}}\right]\left(-\frac{11}{5}\right)-\frac{-\sqrt{-4 \left(-\frac{11}{5}\right)+1}+1}{2 \left(-\frac{11}{5}\right)}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{13}{4}}\left[C_{\frac{13}{4}}\right]\left(-\frac{17}{6}\right)-\frac{-\sqrt{-4 \left(-\frac{17}{6}\right)+1}+1}{2 \left(-\frac{17}{6}\right)}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{19}{8}}\left[C_{\frac{19}{8}}\right]\left(-\frac{23}{9}\right)-\frac{-\sqrt{-4 \left(-\frac{23}{9}\right)+1}+1}{2 \left(-\frac{23}{9}\right)}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
