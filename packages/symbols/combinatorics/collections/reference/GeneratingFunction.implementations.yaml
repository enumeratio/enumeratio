fixed-k-binomial:
  epsil:
    in: GeneratingFunction(Binomial(n, 3), n, x)
    out: x ^ 3 / (x ^ 4 - 4 * x ^ 3 + 6 * x ^ 2 - 4x + 1)
  tex:
    in: \mathrm{GeneratingFunction}(\binom{n}{3}, n, x)
    out: \frac{x^3}{x^4-4x^3+6x^2-4x+1}
  fullform:
    in: GeneratingFunction[Binomial[n, 3], n, x]
  wolfram:
    in: GeneratingFunction[Binomial[n, 3], n, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{G}_n[\binom{n}{3}](x)-\frac{x^3}{x^4-4 x^3+6 x^2-4 x+1}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{G}_{\frac{7}{3}}\left[\binom{\frac{7}{3}}{3}\right]\left(-\frac{11}{5}\right)-\frac{\left(-\frac{11}{5}\right)^3}{\left(-\frac{11}{5}\right)^4-4 \left(-\frac{11}{5}\right)^3+6 \left(-\frac{11}{5}\right)^2-4 \left(-\frac{11}{5}\right)+1}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{13}{4}}\left[\binom{\frac{13}{4}}{3}\right]\left(-\frac{17}{6}\right)-\frac{\left(-\frac{17}{6}\right)^3}{\left(-\frac{17}{6}\right)^4-4 \left(-\frac{17}{6}\right)^3+6 \left(-\frac{17}{6}\right)^2-4 \left(-\frac{17}{6}\right)+1}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{19}{8}}\left[\binom{\frac{19}{8}}{3}\right]\left(-\frac{23}{9}\right)-\frac{\left(-\frac{23}{9}\right)^3}{\left(-\frac{23}{9}\right)^4-4 \left(-\frac{23}{9}\right)^3+6 \left(-\frac{23}{9}\right)^2-4 \left(-\frac{23}{9}\right)+1}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
geometric:
  epsil:
    in: GeneratingFunction(2 ^ n, n, x)
    out: 1 / (-2 * x + 1)
  tex:
    in: \mathrm{GeneratingFunction}(2^{n}, n, x)
    out: \frac{1}{1-2x}
  fullform:
    in: GeneratingFunction[Power[2, n], n, x]
  wolfram:
    in: GeneratingFunction[Power[2, n], n, x]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\mathcal{G}_n\left[2^n\right](x)-\frac{1}{-2 x+1}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\mathcal{G}_{\frac{7}{3}}\left[2^{\frac{7}{3}}\right]\left(-\frac{11}{5}\right)-\frac{1}{-2 \left(-\frac{11}{5}\right)+1}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{13}{4}}\left[2^{\frac{13}{4}}\right]\left(-\frac{17}{6}\right)-\frac{1}{-2 \left(-\frac{17}{6}\right)+1}\right]\right],\text{Chop}\left[N\left[\mathcal{G}_{\frac{19}{8}}\left[2^{\frac{19}{8}}\right]\left(-\frac{23}{9}\right)-\frac{1}{-2 \left(-\frac{23}{9}\right)+1}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
