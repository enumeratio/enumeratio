a-rectangular-nesting-is-an-array:
  epsil:
    in: IsArray([[1, 2], [3, 4]])
    out: True
  tex:
    in: \mathrm{IsArray}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{IsArray}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: IsArray[List[List[1, 2], List[3, 4]]]
  wolfram:
    in: ArrayQ[List[List[1, 2], List[3, 4]]]
a-ragged-nesting-is-not-an-array:
  epsil:
    in: IsArray([[1, 2], [3]])
    out: False
  tex:
    in: \mathrm{IsArray}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3\bigr\rbrack\bigr\rbrack)
    out: \bot
  traditional:
    in: \mathrm{IsArray}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3\bigr\rbrack\bigr\rbrack)
    out: \mathrm{False}
  fullform:
    in: IsArray[List[List[1, 2], List[3]]]
  wolfram:
    in: ArrayQ[List[List[1, 2], List[3]]]
a-flat-list-is-a-rank-1-array:
  epsil:
    in: IsArray([1, 2, 3])
    out: True
  tex:
    in: \mathrm{IsArray}(\bigl\lbrack1, 2, 3\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{IsArray}(\bigl\lbrack1, 2, 3\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: IsArray[List[1, 2, 3]]
  wolfram:
    in: ArrayQ[List[1, 2, 3]]
a-non-list-is-not-an-array:
  epsil:
    in: IsArray(3)
    out: False
  tex:
    in: \mathrm{IsArray}(3)
    out: \bot
  traditional:
    in: \mathrm{IsArray}(3)
    out: \mathrm{False}
  fullform:
    in: IsArray[3]
  wolfram:
    in: ArrayQ[3]
a-test-function-must-hold-of-every-leaf:
  epsil:
    in: IsArray([[2, 4], [6, 8]], IsEven)
    out: True
  tex:
    in: \mathrm{IsArray}(\bigl\lbrack\bigl\lbrack2, 4\bigr\rbrack, \bigl\lbrack6, 8\bigr\rbrack\bigr\rbrack, \mathrm{IsEven})
    out: \top
  traditional:
    in: \mathrm{IsArray}(\bigl\lbrack\bigl\lbrack2, 4\bigr\rbrack, \bigl\lbrack6, 8\bigr\rbrack\bigr\rbrack, \mathrm{IsEven})
    out: \mathrm{True}
  fullform:
    in: IsArray[List[List[2, 4], List[6, 8]], EvenQ]
  wolfram:
    in: ArrayQ[List[List[2, 4], List[6, 8]], EvenQ]
