symbolic-data:
  epsil:
    in: GeometricMean([a, b])
    out: Sqrt(a * b)
  tex:
    in: \mathrm{GeometricMean}(\bigl\lbrack a, b\bigr\rbrack)
    out: \sqrt{ab}
  fullform:
    in: GeometricMean[List[a, b]]
  wolfram:
    in: GeometricMean[List[a, b]]
    out: True
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{GeometricMean}[\{a,b\}]-\sqrt{a b}\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{GeometricMean}\left[\left\{\frac{7}{3},-\frac{11}{5}\right\}\right]-\sqrt{\frac{7}{3} \left(-\frac{11}{5}\right)}\right]\right],\text{Chop}\left[N\left[\text{GeometricMean}\left[\left\{\frac{13}{4},-\frac{17}{6}\right\}\right]-\sqrt{\frac{13}{4} \left(-\frac{17}{6}\right)}\right]\right],\text{Chop}\left[N\left[\text{GeometricMean}\left[\left\{\frac{19}{8},-\frac{23}{9}\right\}\right]-\sqrt{\frac{19}{8} \left(-\frac{23}{9}\right)}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
