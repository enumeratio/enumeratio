any-list-1-3-5-function-1-mod-2-eq-0:
  epsil:
    in: Any([1, 3, 5], Function(_1 % 2 == 0))
    out: False
    back: Unreadable
  tex:
    in: \mathrm{Any}(\bigl\lbrack1, 3, 5\bigr\rbrack, ()\mapsto\operatorname{\_1}\bmod2=0)
    out: \bot
  traditional:
    in: \mathrm{Any}(\bigl\lbrack1, 3, 5\bigr\rbrack, ()\mapsto\operatorname{\_1}\bmod2=0)
    out: \mathrm{False}
  fullform:
    in: AnyTrue[List[1, 3, 5], Function[Equal[Mod[Slot[1], 2], 0]]]
  wolfram:
    in: AnyTrue[List[1, 3, 5], Function[(Mod[Slot[1], 2] == 0)]]
    out: False
    tex:
      in: \text{AnyTrue}[\{1,3,5\},(\text{$\#$1} \bmod 2)=0\&]
      out: \text{False}
any-list-1-3-6-function-1-mod-2-eq-0:
  epsil:
    in: Any([1, 3, 6], Function(_1 % 2 == 0))
    out: True
    back: Unreadable
  tex:
    in: \mathrm{Any}(\bigl\lbrack1, 3, 6\bigr\rbrack, ()\mapsto\operatorname{\_1}\bmod2=0)
    out: \top
  traditional:
    in: \mathrm{Any}(\bigl\lbrack1, 3, 6\bigr\rbrack, ()\mapsto\operatorname{\_1}\bmod2=0)
    out: \mathrm{True}
  fullform:
    in: AnyTrue[List[1, 3, 6], Function[Equal[Mod[Slot[1], 2], 0]]]
  wolfram:
    in: AnyTrue[List[1, 3, 6], Function[(Mod[Slot[1], 2] == 0)]]
    out: True
    tex:
      in: \text{AnyTrue}[\{1,3,6\},(\text{$\#$1} \bmod 2)=0\&]
      out: \text{True}
a-named-predicate:
  epsil:
    in: Any([4, 6, 7], IsPrime)
    out: True
  tex:
    in: \mathrm{Any}(\bigl\lbrack4, 6, 7\bigr\rbrack, \mathrm{IsPrime})
    out: \top
  traditional:
    in: \mathrm{Any}(\bigl\lbrack4, 6, 7\bigr\rbrack, \mathrm{IsPrime})
    out: \mathrm{True}
  fullform:
    in: AnyTrue[List[4, 6, 7], PrimeQ]
  wolfram:
    in: AnyTrue[List[4, 6, 7], PrimeQ]
any-list-1-2-3-function-1-gt-2:
  epsil:
    in: Any([1, 2, 3], Function(_1 > 2))
    out: True
    back: Unreadable
  tex:
    in: \mathrm{Any}(\bigl\lbrack1, 2, 3\bigr\rbrack, ()\mapsto\operatorname{\_1}\gt2)
    out: \top
  traditional:
    in: \mathrm{Any}(\bigl\lbrack1, 2, 3\bigr\rbrack, ()\mapsto\operatorname{\_1}\gt2)
    out: \mathrm{True}
  fullform:
    in: AnyTrue[List[1, 2, 3], Function[Greater[Slot[1], 2]]]
  wolfram:
    in: AnyTrue[List[1, 2, 3], Function[Greater[Slot[1], 2]]]
without-a-predicate-tests-the-elements:
  epsil:
    in: Any([False, True])
    out: True
  tex:
    in: \mathrm{Any}(\bigl\lbrack\bot, \top\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Any}(\bigl\lbrack\mathrm{False}, \mathrm{True}\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: AnyTrue[List[False, True]]
  wolfram:
    in: AnyTrue[List[False, True]]
    note: AnyTrue needs a test; $\mathrm{AnyTrue}[\{False, True\}]$ stays unevaluated.
a-level-argument-tests-the-elements-at-depth-2:
  epsil:
    in: Any([[1, 2], [3, -4]], Function(_1 < 0), 2)
    out: True
    back: Unreadable
  tex:
    in: \mathrm{Any}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, -4\bigr\rbrack\bigr\rbrack, ()\mapsto\operatorname{\_1}\lt0, 2)
    out: \top
  traditional:
    in: \mathrm{Any}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, -4\bigr\rbrack\bigr\rbrack, ()\mapsto\operatorname{\_1}\lt0, 2)
    out: \mathrm{True}
  fullform:
    in: AnyTrue[List[List[1, 2], List[3, -4]], Function[Less[Slot[1], 0]], 2]
  wolfram:
    in: AnyTrue[List[List[1, 2], List[3, -4]], Function[Less[Slot[1], 0]], 2]
always-false-on-an-empty-list:
  epsil:
    in: Any([], IsEven)
    out: False
  tex:
    in: \mathrm{Any}(\bigl\lbrack \bigr\rbrack, \mathrm{IsEven})
    out: \bot
  traditional:
    in: \mathrm{Any}(\bigl\lbrack \bigr\rbrack, \mathrm{IsEven})
    out: \mathrm{False}
  fullform:
    in: AnyTrue[List[], EvenQ]
  wolfram:
    in: AnyTrue[List[], EvenQ]
some-element-passes-exactly-when-not-every:
  epsil:
    in: Any([1, 3, 5], IsEven) == !All([1, 3, 5], IsOdd)
    out: True
  tex:
    in: \mathrm{Any}(\bigl\lbrack1, 3, 5\bigr\rbrack, \mathrm{IsEven})=\lnot\mathrm{All}(\bigl\lbrack1, 3, 5\bigr\rbrack, \mathrm{IsOdd})
    out: \top
  traditional:
    in: \mathrm{Any}(\bigl\lbrack1, 3, 5\bigr\rbrack, \mathrm{IsEven})=\lnot\mathrm{All}(\bigl\lbrack1, 3, 5\bigr\rbrack, \mathrm{IsOdd})
    out: \mathrm{True}
  fullform:
    in: Equal[AnyTrue[List[1, 3, 5], EvenQ], Not[AllTrue[List[1, 3, 5], OddQ]]]
  wolfram:
    in: (AnyTrue[List[1, 3, 5], EvenQ] == Not[AllTrue[List[1, 3, 5], OddQ]])
