count-alternatingpermutations-4:
  epsil:
    in: Count(AlternatingPermutations(4))
    out: "5"
  tex:
    in: \mathrm{Count}(\mathrm{AlternatingPermutations}(4))
    out: "5"
  fullform:
    in: Count[AlternatingPermutations[4]]
first-element-of-alternatingpermutations-4:
  epsil:
    in: AlternatingPermutations(4)[1]
    out: "[1, 4, 2, 3]"
  tex:
    in: \mathrm{AlternatingPermutations}(4)[1]
    out: \bigl\lbrack1, 4, 2, 3\bigr\rbrack
  fullform:
    in: Part[AlternatingPermutations[4], 1]
every-element-of-alternatingpermutations-4:
  epsil:
    in: Take(AlternatingPermutations(4), 5)
    out: "[[1, 4, 2, 3], [2, 4, 1, 3], [3, 4, 1, 2], [1, 3, 2, 4], [2, 3, 1, 4]]"
  tex:
    in: \mathrm{Take}(\mathrm{AlternatingPermutations}(4), 5)
    out: \bigl\lbrack\bigl\lbrack1, 4, 2, 3\bigr\rbrack, \bigl\lbrack2, 4, 1, 3\bigr\rbrack, \bigl\lbrack3, 4, 1, 2\bigr\rbrack, \bigl\lbrack1, 3, 2, 4\bigr\rbrack, \bigl\lbrack2, 3, 1, 4\bigr\rbrack\bigr\rbrack
  fullform:
    in: Take[AlternatingPermutations[4], 5]
