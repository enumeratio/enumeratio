positions-2-through-4-2-4-in-wolfram:
  epsil:
    in: "[a, b, c, d, f][Span(2, 4)]"
    out: "[b, c, d]"
  tex:
    in: \bigl\lbrack a, b, c, d, f\bigr\rbrack[\mathrm{Span}(2, 4)]
    out: \bigl\lbrack b, c, d\bigr\rbrack
every-other-element-through-the-last-1-1-2:
  epsil:
    in: "[a, b, c, d, f][Span(1, -1, 2)]"
    out: "[a, c, f]"
  tex:
    in: \bigl\lbrack a, b, c, d, f\bigr\rbrack[\mathrm{Span}(1, -1, 2)]
    out: \bigl\lbrack a, c, f\bigr\rbrack
a-negative-step-walks-backwards-1-1-1:
  epsil:
    in: "[a, b, c, d, f][Span(-1, 1, -1)]"
    out: "[f, d, c, b, a]"
  tex:
    in: \bigl\lbrack a, b, c, d, f\bigr\rbrack[\mathrm{Span}(-1, 1, -1)]
    out: \bigl\lbrack f, d, c, b, a\bigr\rbrack
negative-bounds-the-last-two-elements:
  epsil:
    in: "[a, b, c, d, f][Span(-2, -1)]"
    out: "[d, f]"
  tex:
    in: \bigl\lbrack a, b, c, d, f\bigr\rbrack[\mathrm{Span}(-2, -1)]
    out: \bigl\lbrack d, f\bigr\rbrack
spans-at-two-levels-cut-out-a-submatrix:
  epsil:
    in: "[[1, 2, 3], [4, 5, 6], [7, 8, 9]][Span(2, 3), Span(1, 2)]"
    out: "[[4, 5], [7, 8]]"
  tex:
    in: \bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack, \bigl\lbrack7, 8, 9\bigr\rbrack\bigr\rbrack[\mathrm{Span}(2, 3), \mathrm{Span}(1, 2)]
    out: \bigl\lbrack\bigl\lbrack4, 5\bigr\rbrack, \bigl\lbrack7, 8\bigr\rbrack\bigr\rbrack
  wolfram:
    in: Part[List[List[1, 2, 3], List[4, 5, 6], List[7, 8, 9]], Span[2, 3], Span[1, 2]]
