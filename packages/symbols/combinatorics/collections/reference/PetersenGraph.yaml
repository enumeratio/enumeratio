name: PetersenGraph
domain: Collections
signature: PetersenGraph()
summary: The Petersen graph — the standard 10-vertex, 15-edge, 3-regular example graph.
signatures:
  - call: PetersenGraph()
    description: outer 5-cycle (vertices 1-5), inner pentagram (6-10, step 2), and the 5 spokes joining $i$ to $i + 5$.
    library: enumeratio-collections
details:
  - 3-regular, non-bipartite (girth 5, so it has odd cycles), and connected — every property a reader would reach for this graph to demonstrate.
examples:
  - id: petersen-is-3-regular
    expr: [VertexDegree, [PetersenGraph]]
    expected: [List, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3]
    caption: Every vertex has degree 3
  - id: petersen-is-not-bipartite
    expr: [IsBipartiteGraph, [PetersenGraph]]
    expected: False
    caption: Its girth is 5 (odd), so it is not bipartite
seeAlso:
  - CycleGraph
  - IsBipartiteGraph
