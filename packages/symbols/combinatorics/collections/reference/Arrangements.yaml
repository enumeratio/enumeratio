name: Arrangements
domain: Collections
signature: Arrangements(n, k)
summary: Ordered selections of $k$ distinct elements from $\{1, …, n\}$ — the $k$-permutations of $n$.
signatures:
  - call: Arrangements(n, k)
    description: Ordered selections of $k$ distinct elements from $\{1, …, n\}$ — the $k$-permutations of $n$
    library: enumeratio-collections
details:
  - Count is the falling factorial $n^{\underline{k}} = n!/(n-k)!$.
  - Each element is a length-$k$ one-line word with distinct entries from $\{1, …, n\}$.
seeAlso:
  - SymmetricGroup
  - Subsets
  - Binomial
