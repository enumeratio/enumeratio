idempotent-clamping-an-already-clamped-value:
  epsil:
    in: Clamp(Clamp(5, 0, 3), 0, 3) == Clamp(5, 0, 3)
    out: True
  tex:
    in: \mathrm{Clamp}(\mathrm{Clamp}(5, 0, 3), 0, 3)=\mathrm{Clamp}(5, 0, 3)
    out: \top
  traditional:
    in: \mathrm{Clamp}(\mathrm{Clamp}(5, 0, 3), 0, 3)=\mathrm{Clamp}(5, 0, 3)
    out: \mathrm{True}
  fullform:
    in: Equal[Clip[Clip[5, List[0, 3]], List[0, 3]], Clip[5, List[0, 3]]]
  wolfram:
    in: (Clip[Clip[5, List[0, 3]], List[0, 3]] == Clip[5, List[0, 3]])
    out: True
    tex:
      in: \text{Clip}[\text{Clip}[5,\{0,3\}],\{0,3\}]=\text{Clip}[5,\{0,3\}]
      out: \text{True}
