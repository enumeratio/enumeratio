    in: Clamp(5, 0, 3)
    out: "3"
  tex:
    in: \mathrm{Clamp}(5, 0, 3)
    out: "3"
  fullform:
    in: Clip[5, List[0, 3]]
  wolfram:
    in: Clip[5, List[0, 3]]
    out: "3"
    tex:
      in: \text{Clip}[5,\{0,3\}]
      out: "3"
