for-an-odd-length-list-the-median-is-the-middle:
  epsil:
    in: Median([5, 3, 1, 4, 2]) == Sort([5, 3, 1, 4, 2])[3]
    out: True
  tex:
    in: \mathrm{median}(\bigl\lbrack5, 3, 1, 4, 2\bigr\rbrack)=\mathrm{Sort}(\bigl\lbrack5, 3, 1, 4, 2\bigr\rbrack)[3]
    out: \top
  traditional:
    in: \mathrm{median}(\bigl\lbrack5, 3, 1, 4, 2\bigr\rbrack)=\mathrm{Sort}(\bigl\lbrack5, 3, 1, 4, 2\bigr\rbrack)[3]
    out: \mathrm{True}
  wolfram:
    in: (Median[List[5, 3, 1, 4, 2]] == Part[Sort[List[5, 3, 1, 4, 2]], 3])
    back: Unreadable
    out: True
    tex:
      in: \text{Median}[\{5,3,1,4,2\}]=\text{Sort}[\{5,3,1,4,2\}][[3]]
      out: \text{True}
