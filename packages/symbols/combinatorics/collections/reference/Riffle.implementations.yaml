x-between-consecutive-elements:
  epsil:
    in: Riffle([a, b, c], x)
    out: "[a, x, b, x, c]"
  tex:
    in: \mathrm{Riffle}(\bigl\lbrack a, b, c\bigr\rbrack, x)
    out: \bigl\lbrack a, x, b, x, c\bigr\rbrack
  fullform:
    in: Riffle[List[a, b, c], x]
  wolfram:
    in: Riffle[List[a, b, c], x]
    out: "{a, x, b, x, c}"
    tex:
      in: \text{Riffle}[\{a,b,c\},x]
      out: \{a,x,b,x,c\}
interleave-two-lists-of-the-same-length:
  epsil:
    in: Riffle([a, b, c], [x, y, z])
    out: "[a, x, b, y, c, z]"
  tex:
    in: \mathrm{Riffle}(\bigl\lbrack a, b, c\bigr\rbrack, \bigl\lbrack x, y, z\bigr\rbrack)
    out: \bigl\lbrack a, x, b, y, c, z\bigr\rbrack
  fullform:
    in: Riffle[List[a, b, c], List[x, y, z]]
  wolfram:
    in: Riffle[List[a, b, c], List[x, y, z]]
    out: "{a, x, b, y, c, z}"
    tex:
      in: \text{Riffle}[\{a,b,c\},\{x,y,z\}]
      out: \{a,x,b,y,c,z\}
a-list-one-shorter-goes-strictly-between-the:
  epsil:
    in: Riffle([a, b, c], [x, y])
    out: "[a, x, b, y, c]"
  tex:
    in: \mathrm{Riffle}(\bigl\lbrack a, b, c\bigr\rbrack, \bigl\lbrack x, y\bigr\rbrack)
    out: \bigl\lbrack a, x, b, y, c\bigr\rbrack
  fullform:
    in: Riffle[List[a, b, c], List[x, y]]
  wolfram:
    in: Riffle[List[a, b, c], List[x, y]]
    out: "{a, x, b, y, c}"
    tex:
      in: \text{Riffle}[\{a,b,c\},\{x,y\}]
      out: \{a,x,b,y,c\}
every-3rd-element-of-the-result-is-x:
  epsil:
    in: Riffle([1, 2, 3, 4, 5, 6, 7], x, 3)
    out: "[1, 2, x, 3, 4, x, 5, 6, x, 7]"
  tex:
    in: \mathrm{Riffle}(\bigl\lbrack1, 2, 3, 4, 5, 6, 7\bigr\rbrack, x, 3)
    out: \bigl\lbrack1, 2, x, 3, 4, x, 5, 6, x, 7\bigr\rbrack
  fullform:
    in: Riffle[List[1, 2, 3, 4, 5, 6, 7], x, 3]
  wolfram:
    in: Riffle[List[1, 2, 3, 4, 5, 6, 7], x, 3]
    out: "{1, 2, x, 3, 4, x, 5, 6, x, 7}"
    tex:
      in: \text{Riffle}[\{1,2,3,4,5,6,7\},x,3]
      out: \{1,2,x,3,4,x,5,6,x,7\}
a-single-element-has-nothing-to-separate:
  epsil:
    in: Riffle([a], x)
    out: "[a]"
  tex:
    in: \mathrm{Riffle}(\bigl\lbrack a\bigr\rbrack, x)
    out: \bigl\lbrack a\bigr\rbrack
  fullform:
    in: Riffle[List[a], x]
  wolfram:
    in: Riffle[List[a], x]
    out: "{a}"
    tex:
      in: \text{Riffle}[\{a\},x]
      out: \{a\}
