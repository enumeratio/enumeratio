name: FromCharacterCode
domain: Collections
signature: FromCharacterCode(n) / FromCharacterCode({n1, n2, …})
summary: The character(s) with the given Unicode code point(s) — the inverse of ToCharacterCode.
signatures:
  - call: FromCharacterCode(n)
    description: the single character with code point n
    library: enumeratio-collections
  - call: FromCharacterCode({n1, n2, …})
    description: the string built from each code point, in order
    library: enumeratio-collections
details:
  - Code points, not UTF-16 units — see [[ToCharacterCode]].
examples:
  - id: from-character-code-of-a-single-code-point
    expr: [FromCharacterCode, 65]
    expected: "'A'"
  - id: inverts-tocharactercode
    expr: [FromCharacterCode, [ToCharacterCode, [String, hello]]]
    expected: "'hello'"
    category: Scope
  - id: round-trips-a-non-ascii-string-emoji-astral
    expr: [FromCharacterCode, [ToCharacterCode, [String, a😀b→c]]]
    expected: "'a😀b→c'"
    category: Scope
    caption: round-trips an emoji (astral) and an arrow (BMP) through code points
seeAlso:
  - ToCharacterCode
