geometric:
  epsil:
    in: FindSequenceFunction([1, 2, 4, 8, 16], n)
    out: 2 ^ n
  tex:
    in: \mathrm{FindSequenceFunction}(\bigl\lbrack1, 2, 4, 8, 16\bigr\rbrack, n)
    out: 2^{n}
  fullform:
    in: FindSequenceFunction[List[1, 2, 4, 8, 16], n]
  wolfram:
    in: FindSequenceFunction[List[1, 2, 4, 8, 16], n]
    out: False
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FindSequenceFunction}[\{1,2,4,8,16\},n]-2^n\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,2,4,8,16\},\frac{7}{3}\right]-2^{\frac{7}{3}}\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,2,4,8,16\},-\frac{11}{5}\right]-2^{-\frac{11}{5}}\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,2,4,8,16\},\frac{13}{4}\right]-2^{\frac{13}{4}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{False}
    verdict: disagree
    kind: convention
    note: Wolfram's FindSequenceFunction indexes its returned formula from n=1; ours from n=0. 2^(n-1) at n=1..5 and 2^n at n=0..4 are the same sequence under that index shift, not a disagreement about the sequence itself.
polynomial:
  epsil:
    in: FindSequenceFunction([1, 4, 9, 16, 25], n)
    out: n ^ 2 + 2n + 1
  tex:
    in: \mathrm{FindSequenceFunction}(\bigl\lbrack1, 4, 9, 16, 25\bigr\rbrack, n)
    out: n^2+2n+1
  fullform:
    in: FindSequenceFunction[List[1, 4, 9, 16, 25], n]
  wolfram:
    in: FindSequenceFunction[List[1, 4, 9, 16, 25], n]
    out: False
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FindSequenceFunction}[\{1,4,9,16,25\},n]-\left(n^2+2 n+1\right)\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,4,9,16,25\},\frac{7}{3}\right]-\left(\left(\frac{7}{3}\right)^2+2 \frac{7}{3}+1\right)\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,4,9,16,25\},-\frac{11}{5}\right]-\left(\left(-\frac{11}{5}\right)^2+2 \left(-\frac{11}{5}\right)+1\right)\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,4,9,16,25\},\frac{13}{4}\right]-\left(\left(\frac{13}{4}\right)^2+2 \frac{13}{4}+1\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{False}
    verdict: disagree
    kind: convention
    note: Same n-indexing convention difference as the geometric example (n=1-based there, n=0-based here) — the fitted closed forms describe the same sequence shifted by one index.
catalan-numbers:
  epsil:
    in: FindSequenceFunction([1, 1, 2, 5, 14, 42, 132], n)
    out: CatalanNumber(n)
  tex:
    in: \mathrm{FindSequenceFunction}(\bigl\lbrack1, 1, 2, 5, 14, 42, 132\bigr\rbrack, n)
    out: \mathrm{CatalanNumber}(n)
  traditional:
    in: \mathrm{FindSequenceFunction}(\bigl\lbrack1, 1, 2, 5, 14, 42, 132\bigr\rbrack, n)
    out: C_{n}
  fullform:
    in: FindSequenceFunction[List[1, 1, 2, 5, 14, 42, 132], n]
  wolfram:
    in: FindSequenceFunction[List[1, 1, 2, 5, 14, 42, 132], n]
    out: False
    tex:
      in: \text{Module}\left[\left\{d=\text{Quiet}\left[\text{TimeConstrained}\left[\text{FullSimplify}\left[\text{FindSequenceFunction}[\{1,1,2,5,14,42,132\},n]-C_n\right],10,\text{$\$$Aborted}\right]\right]\right\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,1,2,5,14,42,132\},\frac{7}{3}\right]-C_{\frac{7}{3}}\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,1,2,5,14,42,132\},-\frac{11}{5}\right]-C_{-\frac{11}{5}}\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,1,2,5,14,42,132\},\frac{13}{4}\right]-C_{\frac{13}{4}}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{False}
    verdict: disagree
    kind: convention
    note: Same n-indexing convention difference as the geometric example — Wolfram's FindSequenceFunction and ours anchor the sequence's first term at different n.
factorial:
  epsil:
    in: FindSequenceFunction([1, 1, 2, 6, 24, 120], n)
    out: n!
  tex:
    in: \mathrm{FindSequenceFunction}(\bigl\lbrack1, 1, 2, 6, 24, 120\bigr\rbrack, n)
    out: n!
  fullform:
    in: FindSequenceFunction[List[1, 1, 2, 6, 24, 120], n]
  wolfram:
    in: FindSequenceFunction[List[1, 1, 2, 6, 24, 120], n]
    out: False
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{FindSequenceFunction}[\{1,1,2,6,24,120\},n]-n!],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,1,2,6,24,120\},\frac{7}{3}\right]-\frac{7}{3}!\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,1,2,6,24,120\},-\frac{11}{5}\right]-\left(-\frac{11}{5}\right)!\right]\right],\text{Chop}\left[N\left[\text{FindSequenceFunction}\left[\{1,1,2,6,24,120\},\frac{13}{4}\right]-\frac{13}{4}!\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{False}
    verdict: disagree
    kind: convention
    note: Same n-indexing convention difference as the geometric example — the closed forms agree once one accounts for the index shift.
