letters-a-through-e:
  epsil:
    in: CharacterRange("\(a)", "\(e)")
    out: '["a", "b", "c", "d", "e"]'
  tex:
    in: \mathrm{CharacterRange}(\text{a}, \text{e})
    out: \bigl\lbrack\text{a}, \text{b}, \text{c}, \text{d}, \text{e}\bigr\rbrack
  fullform:
    in: CharacterRange[String[a], String[e]]
  wolfram:
    in: CharacterRange["a", "e"]
by-code-point:
  epsil:
    in: CharacterRange(97, 101)
    out: '["a", "b", "c", "d", "e"]'
  tex:
    in: \mathrm{CharacterRange}(97, 101)
    out: \bigl\lbrack\text{a}, \text{b}, \text{c}, \text{d}, \text{e}\bigr\rbrack
  fullform:
    in: CharacterRange[97, 101]
  wolfram:
    in: CharacterRange[97, 101]
