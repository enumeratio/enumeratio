name: Prepend
domain: Collections
signature: Prepend(collection, value)
summary: The collection with value added as its first element.
signatures:
  - call: Prepend(collection, value)
    description: the collection with `value` added as its first element.
    library: enumeratio-collections
  - call: Prepend(association, rule)
    description: '`association` with `rule` (or a list of rules) inserted at the front; a prepended key displaces any later entry for the same key.'
    library: enumeratio-collections
details:
  - $Prepend(c, x) = Join(\{x\}, c)$. See [[Join]].
  - Complements [[Append]] at the other end of a collection.
examples:
  - id: prepend-list-a-b-c-d-x
    expr: [Prepend, [List, a, b, c, d], x]
    expected: [List, x, a, b, c, d]
  - id: prepend-c-x-join-x-c-see-join
    expr: [Equal, [Prepend, [List, 1, 2, 3], 0], [Join, [List, 0], [List, 1, 2, 3]]]
    expected: True
    category: Properties
    caption: $Prepend(c, x) = Join(\{x\}, c)$. See [[Join]]
  - id: a-rule-inserted-at-the-front-of-an-association
    expr: [Prepend, [Association, [Rule, 1, a], [Rule, 2, b]], [Rule, 3, d]]
    expected: [Association, [Rule, 3, d], [Rule, 1, a], [Rule, 2, b]]
    category: Scope
    caption: A rule inserted at the front of an association
  - id: several-rules-prepended-at-once
    expr: [Prepend, [Association, [Rule, 1, a], [Rule, 2, b]], [List, [Rule, 3, d], [Rule, 4, e]]]
    expected: [Association, [Rule, 3, d], [Rule, 4, e], [Rule, 1, a], [Rule, 2, b]]
    category: Scope
    caption: Several rules prepended at once
seeAlso:
  - Append
  - Join
