three-by-three:
  epsil:
    in: HilbertMatrix(3)
    out: "[[1, 1 / 2, 1 / 3], [1 / 2, 1 / 3, 1 / 4], [1 / 3, 1 / 4, 1 / 5]]"
  tex:
    in: \mathrm{HilbertMatrix}(3)
    out: \bigl\lbrack\bigl\lbrack1, \frac{1}{2}, \frac{1}{3}\bigr\rbrack, \bigl\lbrack\frac{1}{2}, \frac{1}{3}, \frac{1}{4}\bigr\rbrack, \bigl\lbrack\frac{1}{3}, \frac{1}{4}, \frac{1}{5}\bigr\rbrack\bigr\rbrack
  fullform:
    in: HilbertMatrix[3]
  wolfram:
    in: HilbertMatrix[3]
rectangular:
  epsil:
    in: HilbertMatrix([2, 3])
    out: "[[1, 1 / 2, 1 / 3], [1 / 2, 1 / 3, 1 / 4]]"
  tex:
    in: \mathrm{HilbertMatrix}(\bigl\lbrack2, 3\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack1, \frac{1}{2}, \frac{1}{3}\bigr\rbrack, \bigl\lbrack\frac{1}{2}, \frac{1}{3}, \frac{1}{4}\bigr\rbrack\bigr\rbrack
  fullform:
    in: HilbertMatrix[List[2, 3]]
  wolfram:
    in: HilbertMatrix[List[2, 3]]
