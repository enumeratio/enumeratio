    in: Ordering([2, 6, 1, 9, 1, 2, 3], 4)
    out: "[3, 5, 1, 6]"
  tex:
    in: \mathrm{Ordering}(\bigl\lbrack2, 6, 1, 9, 1, 2, 3\bigr\rbrack, 4)
    out: \bigl\lbrack3, 5, 1, 6\bigr\rbrack
  wolfram:
    in: Ordering[List[2, 6, 1, 9, 1, 2, 3], 4]
ordering-list-2-6-1-9-1-2-3:
