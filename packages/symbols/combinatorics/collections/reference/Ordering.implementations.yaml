ordering-list-3-1-2:
  epsil:
    in: Ordering([3, 1, 2])
    out: "[2, 3, 1]"
  tex:
    in: \mathrm{Ordering}(\bigl\lbrack3, 1, 2\bigr\rbrack)
    out: \bigl\lbrack2, 3, 1\bigr\rbrack
  wolfram:
    in: Ordering[List[3, 1, 2]]
    out: "{2, 3, 1}"
    tex:
      in: \text{Ordering}[\{3,1,2\}]
      out: \{2,3,1\}
ties-break-in-favor-of-the-earlier-position-both:
  epsil:
    in: Ordering([2, 1, 2, 1])
    out: "[2, 4, 1, 3]"
  tex:
    in: \mathrm{Ordering}(\bigl\lbrack2, 1, 2, 1\bigr\rbrack)
    out: \bigl\lbrack2, 4, 1, 3\bigr\rbrack
  wolfram:
    in: Ordering[List[2, 1, 2, 1]]
    out: "{2, 4, 1, 3}"
    tex:
      in: \text{Ordering}[\{2,1,2,1\}]
      out: \{2,4,1,3\}
a-second-argument-takes-just-the-first-n-indices:
