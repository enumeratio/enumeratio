count-binarypalindromes-4:
  epsil:
    in: Count(BinaryPalindromes(4))
    out: "4"
  tex:
    in: \mathrm{Count}(\mathrm{BinaryPalindromes}(4))
    out: "4"
  fullform:
    in: Count[BinaryPalindromes[4]]
first-element-of-binarypalindromes-4:
  epsil:
    in: BinaryPalindromes(4)[1]
    out: "[0, 0, 0, 0]"
  tex:
    in: \mathrm{BinaryPalindromes}(4)[1]
    out: \bigl\lbrack0, 0, 0, 0\bigr\rbrack
  fullform:
    in: Part[BinaryPalindromes[4], 1]
every-element-of-binarypalindromes-4:
  epsil:
    in: Take(BinaryPalindromes(4), 4)
    out: "[[0, 0, 0, 0], [0, 1, 1, 0], [1, 0, 0, 1], [1, 1, 1, 1]]"
  tex:
    in: \mathrm{Take}(\mathrm{BinaryPalindromes}(4), 4)
    out: \bigl\lbrack\bigl\lbrack0, 0, 0, 0\bigr\rbrack, \bigl\lbrack0, 1, 1, 0\bigr\rbrack, \bigl\lbrack1, 0, 0, 1\bigr\rbrack, \bigl\lbrack1, 1, 1, 1\bigr\rbrack\bigr\rbrack
  fullform:
    in: Take[BinaryPalindromes[4], 4]
