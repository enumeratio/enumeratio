    in: \mathrm{SemistandardTableaux}(3, 2)[1]
    out: \bigl\lbrack\bigl\lbrack1, 1\bigr\rbrack, \bigl\lbrack2\bigr\rbrack\bigr\rbrack
  fullform:
    in: Part[SemistandardTableaux[3, 2], 1]
every-element-of-semistandardtableaux-3-2:
