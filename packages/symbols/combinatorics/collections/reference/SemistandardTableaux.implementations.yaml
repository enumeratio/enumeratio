    in: Take(SemistandardTableaux(3, 2), 6)
    out: |-
      [
        [[1, 1], [2]],
        [[1, 2], [2]],
        [[1, 1, 1]],
        [[1, 1, 2]],
        [[1, 2, 2]],
        [[2, 2, 2]],
      ]
  tex:
    in: \mathrm{Take}(\mathrm{SemistandardTableaux}(3, 2), 6)
