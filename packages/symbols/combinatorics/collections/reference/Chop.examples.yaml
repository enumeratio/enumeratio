- id: values-not-near-zero-pass-through-unchanged
  expr: [Chop, 1.2]
  expected: 1.2
  caption: Values not near zero pass through unchanged
- id: values-smaller-than-about-10-10-collapse-to
  expr: [Chop, 1e-11]
  expected: 0
  caption: Values smaller than about $10^{-10}$ collapse to exactly 0
- id: negative-values-chop-the-same-way
  expr: [Chop, -1e-11]
  expected: 0
  caption: Negative values chop the same way
- id: chops-the-real-and-imaginary-parts-independently
  expr: [Chop, [Complex, 1e-12, 3]]
  expected: [Complex, 0, 3]
  caption: Chops the real and imaginary parts independently
- id: cleans-up-the-floating-point-residue-from
  expr: [Chop, [Subtract, [Multiply, 3, [N, [Divide, 1, 3]]], 1]]
  expected: 0
  category: Applications
  caption: Cleans up the floating-point residue from computing $3\times(1/3)-1$ numerically
- id: only-the-value-s-own-magnitude-matters-this
  expr: [Chop, [Add, 1, 1e-12]]
  expected: 1.000000000001
  category: Possible issues
  caption: Only the value's own magnitude matters -- this stays as is since it isn't close to 0, even though it's close to the integer 1
- id: a-hard-cutoff-at-about-10-10-a-value-just-above
  expr: [Chop, 1.0000000001e-10]
  expected: 1.0000000001e-10
  category: Possible issues
  caption: "A hard cutoff at about $10^{-10}$: a value just above the threshold survives untouched"
- id: threads-element-wise-over-a-list
  expr: [Chop, [List, 1.2, 1e-11, 3.5]]
  expected: [List, 1.2, 0, 3.5]
  category: Scope
  caption: Threads element-wise over a list
- id: a-negligible-imaginary-part-is-dropped-leaving-a
  expr: [Chop, [Add, 1, [Complex, 0, 1e-14]]]
  expected: 1
  category: Scope
  caption: A negligible imaginary part is dropped, leaving a real number
- id: stays-symbolic
  expr: [Chop, x]
  expected: [Chop, x]
  category: Scope
  caption: Stays symbolic
- id: exact-numbers-not-near-zero-pass-through
  expr: [Chop, [Rational, 1, 3]]
  expected: [Rational, 1, 3]
  category: Scope
  caption: Exact numbers not near zero pass through
- id: a-second-argument-sets-the-tolerance-here
  expr: [Chop, 0.001, 0.01]
  expected: 0
  category: Scope
  caption: A second argument sets the tolerance, here chopping anything below 0.01
- id: and-a-tighter-tolerance-keeps-a-value-the
  expr: [Chop, 1e-15, 1e-20]
  expected: 1e-15
  category: Scope
  caption: ...and a tighter tolerance keeps a value the default would chop
- id: an-exact-small-number-is-chopped-too
  expr: [Chop, [Power, 10, -20]]
  expected: 0
  category: Possible issues
  caption: An exact small number is chopped too
- id: chop-0p001-0p0001-keeps-a-value-inside-the
  expr: [Chop, 0.001, 0.0001]
  expected: 0.001
  role: test
  caption: A tighter tolerance keeps a value the default second-argument threshold would chop
- id: chop-1e-15-with-the-default-tolerance
  expr: [Chop, 1e-15]
  expected: 0
  role: test
- id: chops-parts-independently-with-a-tolerance
  expr: [Chop, [Complex, 0.005, 3], 0.01]
  expected: [Complex, 0, 3]
  role: test
  caption: With an explicit tolerance, still chops the real and imaginary parts independently
