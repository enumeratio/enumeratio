the-length-of-the-array-s-shape:
  epsil:
    in: |-
      Rank([[[1, 2], [3, 4]], [[5, 6], [7, 8]]]) == Length(Shape([
                                                                   [[1, 2], [3, 4]],
                                                                   [[5, 6], [7, 8]],
                                                                 ]))
    out: True
  tex:
    in: \mathrm{Rank}(\bigl\lbrack\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack5, 6\bigr\rbrack, \bigl\lbrack7, 8\bigr\rbrack\bigr\rbrack\bigr\rbrack)=\mathrm{Length}(\mathrm{Shape}(\bigl\lbrack\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack5, 6\bigr\rbrack, \bigl\lbrack7, 8\bigr\rbrack\bigr\rbrack\bigr\rbrack))
    out: \top
  traditional:
    in: \mathrm{Rank}(\bigl\lbrack\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack5, 6\bigr\rbrack, \bigl\lbrack7, 8\bigr\rbrack\bigr\rbrack\bigr\rbrack)=\mathrm{Length}(\mathrm{Shape}(\bigl\lbrack\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack5, 6\bigr\rbrack, \bigl\lbrack7, 8\bigr\rbrack\bigr\rbrack\bigr\rbrack))
    out: \mathrm{True}
  wolfram:
    in: (ArrayDepth[List[List[List[1, 2], List[3, 4]], List[List[5, 6], List[7, 8]]]] == Length[Dimensions[List[List[List[1, 2], List[3, 4]], List[List[5, 6], List[7, 8]]]]])
    back: Unreadable
    out: True
    tex:
      in: \text{ArrayDepth}\left[\left( \begin{array}{cc}  \{1,2\} & \{3,4\} \\  \{5,6\} & \{7,8\} \\ \end{array} \right)\right]=\text{Length}\left[\text{Dimensions}\left[\left( \begin{array}{cc}  \{1,2\} & \{3,4\} \\  \{5,6\} & \{7,8\} \\ \end{array} \right)\right]\right]
      out: \text{True}
