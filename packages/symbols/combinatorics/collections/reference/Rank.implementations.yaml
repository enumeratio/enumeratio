the-length-of-the-array-s-shape:
  wolfram:
    in: (ArrayDepth[List[List[List[1, 2], List[3, 4]], List[List[5, 6], List[7, 8]]]] == Length[Dimensions[List[List[List[1, 2], List[3, 4]], List[List[5, 6], List[7, 8]]]]])
    out: True
    tex:
      in: \text{ArrayDepth}\left[\left( \begin{array}{cc}  \{1,2\} & \{3,4\} \\  \{5,6\} & \{7,8\} \\ \end{array} \right)\right]=\text{Length}\left[\text{Dimensions}\left[\left( \begin{array}{cc}  \{1,2\} & \{3,4\} \\  \{5,6\} & \{7,8\} \\ \end{array} \right)\right]\right]
      out: \text{True}
