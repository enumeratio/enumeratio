name: ReIm
domain: Collections
signature: ReIm(z)
summary: "{Re(z), Im(z)} — threads over a list the way Wolfram's Listable ReIm does."
signatures:
  - call: ReIm(z)
    description: the pair {Re(z), Im(z)}
    library: enumeratio-collections
details:
  - "Listable: ReIm({z1, z2}) is {ReIm(z1), ReIm(z2)}, not a single flattened pair."
examples:
  - id: real-and-imaginary-parts
    expr: [ReIm, [Complex, 3, 4]]
    expected: [List, 3, 4]
  - id: threads-over-a-list
    expr: [ReIm, [List, [Complex, 1, 2], [Complex, 3, 4]]]
    expected: [List, [List, 1, 2], [List, 3, 4]]
    category: Scope
seeAlso:
  - NumberQ
