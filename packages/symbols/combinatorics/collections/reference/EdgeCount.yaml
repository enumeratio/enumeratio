name: EdgeCount
domain: Collections
signature: EdgeCount(g)
summary: How many edges a [[Graph]] has.
signatures:
  - call: EdgeCount(g)
    description: $|E(g)|$.
    library: enumeratio-collections
examples:
  - id: edge-count-of-k4
    expr: [EdgeCount, [CompleteGraph, 4]]
    expected: 6
    caption: $K_4$ has $\binom{4}{2} = 6$ edges
  - id: edge-count-of-a-triangle
    expr: [EdgeCount, [Graph, [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 2, 3], [UndirectedEdge, 3, 1]]]]
    expected: 3
    role: test
seeAlso:
  - VertexCount
  - EdgeList
