- id: count-alternatingpermutations-4
  expr: [Count, [AlternatingPermutations, 4]]
  expected: 5
  category: Basic
  caption: $Count(AlternatingPermutations(4)) = 5$
- id: first-element-of-alternatingpermutations-4
  expr: [At, [AlternatingPermutations, 4], 1]
  expected: [List, 1, 4, 2, 3]
  category: Basic
  caption: The first element in enumeration order
- id: every-element-of-alternatingpermutations-4
