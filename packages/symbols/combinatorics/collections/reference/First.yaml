name: First
domain: Collections
signature: First(collection)
summary: The first element of a collection.
signatures:
  - call: First(collection)
    description: the first element of the collection.
  - call: First(collection, default)
    description: "`default` when the collection is empty, instead of the first element."
    library: enumeratio-collections
  - call: First(expr)
    description: the first operand of any expression, not just a collection.
    library: enumeratio-collections
details:
  - $First(c) = At(c, 1)$. See [[At]].
  - Positional indexing from the front (index 1) and back (negative indices).
  - On an empty collection with no default given, returns the symbol $Missing$ rather than raising an error.
  - A second argument supplies a default for an empty collection, instead of $Missing$.
  - Works on the operands of any expression, not just a collection's elements.
examples:
  - id: first-list-1-2-3
    expr: [First, [List, 1, 2, 3]]
    expected: 1
  - id: first-list-10-20-30
    expr: [First, [List, 10, 20, 30]]
    expected: 10
  - id: first-c-at-c-1-see-at
    expr: [Equal, [First, [List, 1, 2, 3]], [At, [List, 1, 2, 3], 1]]
    expected: True
    category: Properties
    caption: $First(c) = At(c, 1)$. See [[At]]
  - id: an-empty-collection-has-no-first-element-compute
    expr: [First, [List]]
    expected: Missing
    category: Possible issues
    caption: An empty collection has no first element; compute-engine returns the symbol $Missing$
  - id: a-second-argument-supplies-a-default-for-an
    expr: [First, [List], 99]
    expected: 99
    category: Scope
    caption: A second argument supplies a default for an empty collection
  - id: first-list-a-b-c
    expr: [First, [List, a, b, c]]
    expected: a
  - id: of-a-matrix-the-first-row
    expr: [First, [List, [List, a, b], [List, c, d]]]
    expected: [List, a, b]
    category: Scope
    caption: Of a matrix, the first row
  - id: a-lazy-range-works-too
    expr: [First, [Range, 5, 10]]
    expected: 5
    category: Scope
    caption: A lazy [[Range]] works too
  - id: any-expression-not-just-a-list-the-first-term-of
    expr: [First, [Add, [Power, a, 2], [Power, b, 2]]]
    expected: [Power, a, 2]
    category: Scope
    caption: "Any expression, not just a list: the first term of a sum"
  - id: a-default-is-ignored-when-the-collection-has-a
    expr: [First, [List, a, b], x]
    expected: a
    category: Scope
    caption: A default is ignored when the collection has a first element
seeAlso:
  - Last
  - At
