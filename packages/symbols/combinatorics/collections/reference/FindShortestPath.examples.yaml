- id: shortest-path-along-a-path-graph
  expr: [FindShortestPath, [PathGraph, 5], 1, 5]
  expected: [List, 1, 2, 3, 4, 5]
- id: no-path-back-against-directed-edges
  expr:
    [
      FindShortestPath,
      [Graph, [List, 1, 2, 3, 4], [List, [DirectedEdge, 1, 2], [DirectedEdge, 2, 3], [UndirectedEdge, 3, 4]]],
      4,
      1,
    ]
  expected: [List]
  caption: Directed edges block the way back
- id: a-path-crossing-both-directed-and-undirected
  expr:
    [
      FindShortestPath,
      [Graph, [List, 1, 2, 3, 4], [List, [DirectedEdge, 1, 2], [DirectedEdge, 2, 3], [UndirectedEdge, 3, 4]]],
      1,
      4,
    ]
  expected: [List, 1, 2, 3, 4]
  role: test
  caption: A shortest path that crosses both directed and undirected edges
- id: a-weighted-shortcut-loses-to-three-cheaper-hops
  expr:
    [
      FindShortestPath,
      [
        Graph,
        [List, 1, 2, 3, 4],
        [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 2, 3], [UndirectedEdge, 3, 4], [UndirectedEdge, 1, 4]],
        [KeyValuePair, EdgeWeight, [List, 1, 1, 1, 10]],
      ],
      1,
      4,
    ]
  expected: [List, 1, 2, 3, 4]
  caption: With EdgeWeight given, Dijkstra picks the three cheap hops (total 3) over the direct but expensive edge (10) — plain hop-count BFS would take the direct edge instead
