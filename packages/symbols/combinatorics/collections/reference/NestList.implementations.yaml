nestlist-f-x-3:
  epsil:
    in: NestList(f, x, 3)
    out: "[x, f(x), f(f(x)), f(f(f(x)))]"
  tex:
    in: \mathrm{NestList}(f, x, 3)
    out: \bigl\lbrack x, f(x), f(f(x)), f(f(f(x)))\bigr\rbrack
  fullform:
    in: NestList[f, x, 3]
powers-of-2:
  epsil:
    in: NestList(Function(2 * _1), 1, 5)
    out: "[1, 2, 4, 8, 16, 32]"
  tex:
    in: \mathrm{NestList}(()\mapsto2\operatorname{\_1}, 1, 5)
    out: \bigl\lbrack1, 2, 4, 8, 16, 32\bigr\rbrack
  fullform:
    in: NestList[Function[Times[2, Slot[1]]], 1, 5]
  wolfram:
    in: NestList[Function[Times[2, Slot[1]]], 1, 5]
3-is-a-primitive-root-mod-7-its-powers-visit:
  epsil:
    in: NestList(Function(3 * _1 % 7), 1, 6)
    out: "[1, 3, 2, 6, 4, 5, 1]"
  tex:
    in: \mathrm{NestList}(()\mapsto3\operatorname{\_1}\bmod7, 1, 6)
    out: \bigl\lbrack1, 3, 2, 6, 4, 5, 1\bigr\rbrack
  fullform:
    in: NestList[Function[Mod[Times[3, Slot[1]], 7]], 1, 6]
  wolfram:
    in: NestList[Function[Mod[Times[3, Slot[1]], 7]], 1, 6]
newton-iterates-converging-to-sqrt-2:
  epsil:
    in: NestList(Function((_1 + 2 / _1) / 2), 1, 3)
    out: "[1, 3 / 2, 17 / 12, 577 / 408]"
  tex:
    in: \mathrm{NestList}(()\mapsto\frac{\operatorname{\_1}+\frac{2}{\operatorname{\_1}}}{2}, 1, 3)
    out: \bigl\lbrack1, \frac{3}{2}, \frac{17}{12}, \frac{577}{408}\bigr\rbrack
  fullform:
    in: NestList[Function[Divide[Plus[Slot[1], Divide[2, Slot[1]]], 2]], 1, 3]
  wolfram:
    in: NestList[Function[Divide[Plus[Slot[1], Divide[2, Slot[1]]], 2]], 1, 3]
zero-steps-just-the-seed:
  epsil:
    in: NestList(f, x, 0)
    out: "[x]"
  tex:
    in: \mathrm{NestList}(f, x, 0)
    out: \bigl\lbrack x\bigr\rbrack
  fullform:
    in: NestList[f, x, 0]
