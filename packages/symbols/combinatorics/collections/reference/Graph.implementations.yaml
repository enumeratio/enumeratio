edgeweight-option-is-held-exactly:
  epsil:
    in: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3)], EdgeWeight -> [5, 7])
    out: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3)], (EdgeWeight, [5, 7]))
  tex:
    in: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3)\bigr\rbrack, \mathrm{KeyValuePair}(\mathrm{EdgeWeight}, \bigl\lbrack5, 7\bigr\rbrack))
    out: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3)\bigr\rbrack, \operatorname{Tuple}(\mathrm{EdgeWeight},\bigl\lbrack5, 7\bigr\rbrack))
  fullform:
    in: Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3]], Rule[EdgeWeight, List[5, 7]]]
  wolfram:
    in: Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3]], Rule[EdgeWeight, List[5, 7]]]
    out: Indeterminate
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[-\text{Graph}[\{1\unicode{f3d4}2,2\unicode{f3d4}3\},\{\text{EdgeWeight},\{5,7\}\}]],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[-\text{Graph}\left[\{1\unicode{f3d4}2,2\unicode{f3d4}3\},\left\{\frac{7}{3},\{5,7\}\right\}\right]\right]\right],\text{Chop}\left[N\left[-\text{Graph}\left[\{1\unicode{f3d4}2,2\unicode{f3d4}3\},\left\{-\frac{11}{5},\{5,7\}\right\}\right]\right]\right],\text{Chop}\left[N\left[-\text{Graph}\left[\{1\unicode{f3d4}2,2\unicode{f3d4}3\},\left\{\frac{13}{4},\{5,7\}\right\}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{Indeterminate}
    verdict: inconclusive
    kind: shape
    note: "The symbolic-agreement probe (#342) tries FullSimplify on a numeric DIFFERENCE of the two sides, which only makes sense for a scalar -- a Graph isn't one, so -Graph[...] and N[-Graph[...]] are themselves meaningless and the probe can't come back anything but Indeterminate. Needs a real (structural) Graph comparison, not this lane's mechanism to add."
