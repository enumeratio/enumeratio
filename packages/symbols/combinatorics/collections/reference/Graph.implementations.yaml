a-triangle-vertices-inferred:
  epsil:
    in: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3), UndirectedEdge(3, 1)])
    out: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3), UndirectedEdge(3, 1)])
  tex:
    in: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 1)\bigr\rbrack)
    out: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 1)\bigr\rbrack)
  fullform:
    in: Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3], UndirectedEdge[3, 1]]]
  wolfram:
    in: Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3], UndirectedEdge[3, 1]]]
an-isolated-vertex-needs-the-explicit-form:
  epsil:
    in: VertexList(Graph([1, 2, 3], [UndirectedEdge(1, 2)]))
    out: "[1, 2, 3]"
  tex:
    in: \mathrm{VertexList}(\mathrm{Graph}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2)\bigr\rbrack))
    out: \bigl\lbrack1, 2, 3\bigr\rbrack
  fullform:
    in: VertexList[Graph[List[1, 2, 3], List[UndirectedEdge[1, 2]]]]
  wolfram:
    in: VertexList[Graph[List[1, 2, 3], List[UndirectedEdge[1, 2]]]]
the-1-arg-form-is-not-normalized-to-2-arg:
  epsil:
    in: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3)])
    out: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3)])
  tex:
    in: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3)\bigr\rbrack)
    out: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3)\bigr\rbrack)
  fullform:
    in: Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3]]]
  wolfram:
    in: Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3]]]
edgeweight-option-is-held-exactly:
  epsil:
    in: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3)], EdgeWeight -> [5, 7])
    out: Graph([UndirectedEdge(1, 2), UndirectedEdge(2, 3)], (EdgeWeight, [5, 7]))
  tex:
    in: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3)\bigr\rbrack, \mathrm{KeyValuePair}(\mathrm{EdgeWeight}, \bigl\lbrack5, 7\bigr\rbrack))
    out: \mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3)\bigr\rbrack, (\mathrm{EdgeWeight},\bigl\lbrack5, 7\bigr\rbrack))
  fullform:
    in: Graph[List[UndirectedEdge[1, 2], UndirectedEdge[2, 3]], KeyValuePair[EdgeWeight, List[5, 7]]]
