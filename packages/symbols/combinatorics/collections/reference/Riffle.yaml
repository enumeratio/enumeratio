name: Riffle
domain: Collections
signature: Riffle(list, x)
summary: Interleave a separator (or a second list) between the elements of a list.
signatures:
  - call: Riffle(list, x)
    description: $x$ between every consecutive pair of elements; if $x$ is itself a $List$, its elements are used in turn (and, once list and x run the same length, a trailing one too).
    library: enumeratio-collections
  - call: Riffle(list, x, n)
    description: a separator every $n$ elements, rather than between every pair.
    library: enumeratio-collections
seeAlso:
  - Join
  - Partition
