name: ConnectedComponents
domain: Collections
signature: ConnectedComponents(g)
summary: The weakly-connected components of a [[Graph]] — direction is ignored.
signatures:
  - call: ConnectedComponents(g)
    description: each component's vertices, largest component first.
    library: enumeratio-collections
details:
  - Ignores edge direction — a directed graph's components are the same as its underlying
    undirected graph's.
examples:
  - id: two-triangles-two-components
    expr:
      [
        ConnectedComponents,
        [
          Graph,
          [List, 1, 2, 3, 4, 5, 6],
          [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 2, 3], [UndirectedEdge, 4, 5]],
        ],
      ]
    expected: [List, [List, 1, 2, 3], [List, 4, 5], [List, 6]]
    caption: Two connected pieces and an isolated vertex
seeAlso:
  - IsConnectedGraph
  - Graph
