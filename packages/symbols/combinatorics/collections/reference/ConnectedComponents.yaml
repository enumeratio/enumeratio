name: ConnectedComponents
domain: Collections
signature: ConnectedComponents(g)
summary: The strongly-connected components of a [[Graph]], respecting edge direction.
signatures:
  - call: ConnectedComponents(g)
    description: each component's vertices, largest component first.
    library: enumeratio-collections
details:
  - "Respects edge direction (kernel-verified): a directed edge only counts toward mutual reachability one way, so `Graph({1,2,3}, {1->2, 2->1, 2->3})` gives two components, `{1, 2}` (a 2-cycle) and `{3}` (reachable but never reached from), even though the graph is a single WEAKLY connected piece. An undirected edge counts both ways, so a purely undirected graph's components are its ordinary (weakly) connected pieces."
  - "[[IsConnectedGraph]] and [[IsTreeGraph]] test weak connectivity instead — direction ignored — since a directed tree (edges pointing away from a root) is weakly connected but never strongly connected. The two heads deliberately disagree on a directed graph."
  - Vertex order WITHIN a component is this implementation's own traversal order, not a claim about matching Wolfram's.
seeAlso:
  - IsConnectedGraph
  - Graph
