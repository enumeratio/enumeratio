name: Clamp
domain: Arithmetic
signature: Clamp(x, lower, upper)
summary: Constrains x to the range [lower, upper].
signatures:
  - call: Clamp(x, lower, upper)
    description: x if it's already in $[\mathrm{lower}, \mathrm{upper}]$, else the nearer bound.
  - call: Clamp(x)
    description: x clamped to the default range $[-1, 1]$, Wolfram's Clip[x].
    library: enumeratio-collections
  - call: Clamp(x, lower, upper, vLower, vUpper)
    description: "Wolfram's Clip[x, {lower, upper}, {vLower, vUpper}]: a replacement value outside the range, rather than the nearer bound."
    library: enumeratio-collections
details:
  - 'Constrains a value to $[\mathrm{lower}, \mathrm{upper}]$: below lower it returns lower, above upper it returns upper, otherwise x unchanged.'
  - A 1-argument $\mathrm{Clamp}(x)$ defaults to $[-1, 1]$, matching Wolfram's Clip[x].
  - "Idempotent: clamping an already-clamped value changes nothing."
  - Doesn't validate that lower $\le$ upper; with the bounds swapped it just falls through whichever comparison fires first.
examples:
  - id: clamp-5-0-3
    expr: [Clamp, 5, 0, 3]
    expected: 3
  - id: clamp-neg-1-0-3
    expr: [Clamp, -1, 0, 3]
    expected: 0
  - id: values-already-inside-the-range-pass-through
    expr: [Clamp, 2, 0, 3]
    expected: 2
    caption: Values already inside the range pass through unchanged
  - id: idempotent-clamping-an-already-clamped-value
    expr: [Equal, [Clamp, [Clamp, 5, 0, 3], 0, 3], [Clamp, 5, 0, 3]]
    expected: True
    category: Properties
    caption: "Idempotent: clamping an already-clamped value changes nothing"
  - id: capping-a-percentage-like-value-at-100
    expr: [Clamp, 112, 0, 100]
    expected: 100
    category: Applications
    caption: Capping a percentage-like value at 100
  - id: no-validation-that-lower-upper-with-the-bounds
    expr: [Clamp, 5, 3, 0]
    expected: 0
    category: Possible issues
    caption: No validation that lower ≤ upper -- with the bounds swapped, this just falls through the upper-bound check
  - id: a-symbolic-value-is-left-unevaluated-rather-than
    expr: [Clamp, x, 0, 3]
    expected: [Clamp, x, 0, 3]
    category: Possible issues
    caption: A symbolic value is left unevaluated rather than assumed to already lie in range
  - id: a-1-argument-clamp-x-clamps-to-the-default-range
    expr: [Clamp, 1.5]
    expected: 1
    category: Scope
    caption: A 1-argument $\mathrm{Clamp}(x)$ clamps to the default range $[-1, 1]$
  - id: threads-element-wise-over-a-list
    expr: [Clamp, [List, -2, 0.5, 3], 0, 1]
    expected: [List, 0, 0.5, 1]
    category: Scope
    caption: Threads element-wise over a list
  - id: exact-numeric-constants-are-compared-numerically
    expr: [Clamp, Pi, 0, 3]
    expected: 3
    category: Scope
    caption: Exact numeric constants are compared numerically
  - id: clamp-7-over-2-1-3
    expr: [Clamp, [Rational, 7, 2], 1, 3]
    expected: 3
    category: Scope
  - id: infinities-clamp-to-the-nearer-bound
    expr: [Clamp, PositiveInfinity, 0, 3]
    expected: 3
    category: Scope
    caption: Infinities clamp to the nearer bound
  - id: wolfram-s-clip-x-min-max-v-min-v-max-returns
    expr: [Clamp, 5, 0, 3, -1, 10]
    expected: 10
    category: Scope
    caption: Wolfram's $\mathrm{Clip}[x, \{min, max\}, \{v_{min}, v_{max}\}]$ returns replacement values outside the range -- here 10 above it
seeAlso:
  - Min
  - Max
