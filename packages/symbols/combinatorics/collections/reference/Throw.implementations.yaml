throw-aborts-to-the-nearest-catch:
  epsil:
    in: Catch(Throw(abandoned))
    out: abandoned
  tex:
    in: \mathrm{Catch}(\mathrm{Throw}(\mathrm{abandoned}))
    out: \mathrm{abandoned}
  fullform:
    in: Catch[Throw[abandoned]]
  wolfram:
    in: Catch[Throw[abandoned]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Catch}[\text{Throw}[\text{abandoned}]]-\text{abandoned}],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Catch}\left[\text{Throw}\left[\frac{7}{3}\right]\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{Catch}\left[\text{Throw}\left[-\frac{11}{5}\right]\right]--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{Catch}\left[\text{Throw}\left[\frac{13}{4}\right]\right]-\frac{13}{4}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
a-tag-mismatch-propagates-past-a-catch:
  epsil:
    in: Catch(Catch(Throw(deep, x), y), x)
    out: deep
  tex:
    in: \mathrm{Catch}(\mathrm{Catch}(\mathrm{Throw}(\mathrm{deep}, x), y), x)
    out: \mathrm{deep}
  fullform:
    in: Catch[Catch[Throw[deep, x], y], x]
  wolfram:
    in: Catch[Catch[Throw[deep, x], y], x]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Catch}[\text{Catch}[\text{Throw}[\text{deep},x],y],x]-\text{deep}],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Catch}\left[\text{Catch}\left[\text{Throw}\left[\frac{7}{3},-\frac{11}{5}\right],\frac{13}{4}\right],-\frac{11}{5}\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{Catch}\left[\text{Catch}\left[\text{Throw}\left[-\frac{17}{6},\frac{19}{8}\right],-\frac{23}{9}\right],\frac{19}{8}\right]--\frac{17}{6}\right]\right],\text{Chop}\left[N\left[\text{Catch}\left[\text{Catch}\left[\text{Throw}\left[\frac{7}{3},-\frac{11}{5}\right],\frac{13}{4}\right],-\frac{11}{5}\right]-\frac{7}{3}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
