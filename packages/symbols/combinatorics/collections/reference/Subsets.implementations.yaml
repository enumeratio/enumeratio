2-4-subsets:
  epsil:
    in: Count(Subsets(4))
    out: "16"
  tex:
    in: \mathrm{Count}(\mathrm{Subsets}(4))
    out: "16"
  wolfram:
    in: Count[Subsets[4]]
the-empty-subset:
  epsil:
    in: Subsets(3)[1]
    out: "[]"
  tex:
    in: \mathrm{Subsets}(3)[1]
    out: \bigl\lbrack \bigr\rbrack
  wolfram:
    in: Part[Subsets[3], 1]
