sorted-by-absolute-value:
  epsil:
    in: SortBy([-3, 1, -2], Abs)
    out: "[1, -2, -3]"
  tex:
    in: \mathrm{SortBy}(\bigl\lbrack-3, 1, -2\bigr\rbrack, \mathrm{Abs})
    out: \bigl\lbrack1, -2, -3\bigr\rbrack
  wolfram:
    in: SortBy[List[-3, 1, -2], Abs]
pairs-sorted-by-their-last-element:
  epsil:
    in: SortBy([[a, 2], [c, 1], [d, 3]], Last)
    out: "[[c, 1], [a, 2], [d, 3]]"
  tex:
    in: \mathrm{SortBy}(\bigl\lbrack\bigl\lbrack a, 2\bigr\rbrack, \bigl\lbrack c, 1\bigr\rbrack, \bigl\lbrack d, 3\bigr\rbrack\bigr\rbrack, \mathrm{Last})
    out: \bigl\lbrack\bigl\lbrack c, 1\bigr\rbrack, \bigl\lbrack a, 2\bigr\rbrack, \bigl\lbrack d, 3\bigr\rbrack\bigr\rbrack
sorted-by-the-square-of-each-element:
  epsil:
    in: SortBy([4, -5, 1, 3, -2], Function(_1 ^ 2))
    out: "[1, -2, 3, 4, -5]"
  tex:
    in: \mathrm{SortBy}(\bigl\lbrack4, -5, 1, 3, -2\bigr\rbrack, ()\mapsto\operatorname{\_1}^2)
    out: \bigl\lbrack1, -2, 3, 4, -5\bigr\rbrack
  wolfram:
    in: SortBy[List[4, -5, 1, 3, -2], Function[Power[Slot[1], 2]]]
sorting-by-x-gives-descending-order:
  epsil:
    in: SortBy([3, 1, 2], Negate)
    out: "[3, 2, 1]"
  tex:
    in: \mathrm{SortBy}(\bigl\lbrack3, 1, 2\bigr\rbrack, \mathrm{Negate})
    out: \bigl\lbrack3, 2, 1\bigr\rbrack
  wolfram:
    in: SortBy[List[3, 1, 2], Minus]
