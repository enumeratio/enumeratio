name: EdgeList
domain: Collections
signature: EdgeList(g)
summary: The edges of a [[Graph]], as declared, in order.
signatures:
  - call: EdgeList(g)
    description: every edge of $g$ ([[UndirectedEdge]]/[[DirectedEdge]]), in declaration order.
    library: enumeratio-collections
examples:
  - id: edges-of-a-mixed-graph
    expr: [EdgeList, [Graph, [List, [UndirectedEdge, 2, 1], [DirectedEdge, 1, 3]]]]
    expected: [List, [UndirectedEdge, 2, 1], [DirectedEdge, 1, 3]]
    caption: Edges of a mixed undirected/directed graph
seeAlso:
  - Graph
  - VertexList
  - EdgeCount
