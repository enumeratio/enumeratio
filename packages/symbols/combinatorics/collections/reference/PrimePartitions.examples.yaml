- id: count-primepartition-12
  expr: [Count, [PrimePartitions, 12]]
  expected: 7
  category: Basic
  caption: $Count(PrimePartitions(12)) = 7$
- id: first-element-of-primepartition-12
  expr: [At, [PrimePartitions, 12], 1]
  expected: [List, 7, 5]
  category: Basic
  caption: The first element in enumeration order
- id: every-element-of-primepartition-12
  role: test
  expr: [Take, [PrimePartitions, 12], 7]
  expected:
    [
      List,
      [List, 7, 5],
      [List, 7, 3, 2],
      [List, 5, 5, 2],
      [List, 5, 3, 2, 2],
      [List, 3, 3, 3, 3],
      [List, 3, 3, 2, 2, 2],
      [List, 2, 2, 2, 2, 2, 2],
    ]
