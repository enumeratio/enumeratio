    in: Count(KBracelets(5, 2)) == Count(BinaryBracelets(5))
    out: True
  tex:
    in: \mathrm{Count}(\mathrm{KBracelets}(5, 2))=\mathrm{Count}(\mathrm{BinaryBracelets}(5))
    out: \top
  traditional:
    in: \mathrm{Count}(\mathrm{KBracelets}(5, 2))=\mathrm{Count}(\mathrm{BinaryBracelets}(5))
    out: \mathrm{True}
  fullform:
    in: Equal[Count[KBracelets[5, 2]], Count[BinaryBracelets[5]]]
