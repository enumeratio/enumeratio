shortest-path-along-a-path-graph:
  epsil:
    in: FindShortestPath(PathGraph(5), 1, 5)
    out: "[1, 2, 3, 4, 5]"
  tex:
    in: \mathrm{FindShortestPath}(\mathrm{PathGraph}(5), 1, 5)
    out: \bigl\lbrack1, 2, 3, 4, 5\bigr\rbrack
  fullform:
    in: FindShortestPath[enumeratio`PathGraph[5], 1, 5]
no-path-back-against-directed-edges:
  epsil:
    in: |-
      FindShortestPath(Graph([1, 2, 3, 4], [
                                             DirectedEdge(1, 2),
                                             DirectedEdge(2, 3),
                                             UndirectedEdge(3, 4),
                                           ]), 4, 1)
    out: "[]"
  tex:
    in: \mathrm{FindShortestPath}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{DirectedEdge}(1, 2), \mathrm{DirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack), 4, 1)
    out: \bigl\lbrack \bigr\rbrack
  fullform:
    in: FindShortestPath[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], DirectedEdge[2, 3], UndirectedEdge[3, 4]]], 4, 1]
  wolfram:
    in: FindShortestPath[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], DirectedEdge[2, 3], UndirectedEdge[3, 4]]], 4, 1]
a-path-crossing-both-directed-and-undirected:
  epsil:
    in: |-
      FindShortestPath(Graph([1, 2, 3, 4], [
                                             DirectedEdge(1, 2),
                                             DirectedEdge(2, 3),
                                             UndirectedEdge(3, 4),
                                           ]), 1, 4)
    out: "[1, 2, 3, 4]"
  tex:
    in: \mathrm{FindShortestPath}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{DirectedEdge}(1, 2), \mathrm{DirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack), 1, 4)
    out: \bigl\lbrack1, 2, 3, 4\bigr\rbrack
  fullform:
    in: FindShortestPath[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], DirectedEdge[2, 3], UndirectedEdge[3, 4]]], 1, 4]
  wolfram:
    in: FindShortestPath[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], DirectedEdge[2, 3], UndirectedEdge[3, 4]]], 1, 4]
a-weighted-shortcut-loses-to-three-cheaper-hops:
  epsil:
    in: |-
      FindShortestPath(Graph([1, 2, 3, 4], [
                                             UndirectedEdge(1, 2),
                                             UndirectedEdge(2, 3),
                                             UndirectedEdge(3, 4),
                                             UndirectedEdge(1, 4),
                                           ], EdgeWeight -> [1, 1, 1, 10]), 1, 4)
    out: "[1, 2, 3, 4]"
  tex:
    in: \mathrm{FindShortestPath}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{UndirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 4), \mathrm{UndirectedEdge}(1, 4)\bigr\rbrack, \mathrm{KeyValuePair}(\mathrm{EdgeWeight}, \bigl\lbrack1, 1, 1, 10\bigr\rbrack)), 1, 4)
    out: \bigl\lbrack1, 2, 3, 4\bigr\rbrack
  fullform:
    in: FindShortestPath[Graph[List[1, 2, 3, 4], List[UndirectedEdge[1, 2], UndirectedEdge[2, 3], UndirectedEdge[3, 4], UndirectedEdge[1, 4]], KeyValuePair[EdgeWeight, List[1, 1, 1, 10]]], 1, 4]
