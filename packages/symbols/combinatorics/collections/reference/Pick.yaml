name: Pick
domain: Collections
signature: Pick(list, sel) / Pick(list, sel, patt)
summary: Elements of list whose corresponding element of sel matches patt (default True).
signatures:
  - call: Pick(list, sel)
    description: elements of list where the corresponding sel element is True
    library: enumeratio-collections
  - call: Pick(list, sel, patt)
    description: elements of list where the corresponding sel element matches patt
    library: enumeratio-collections
details:
  - list and sel must be the same length.
  - Matching uses the same wildcard grammar as [[MatchQ]].
seeAlso:
  - Level
  - MatchQ
