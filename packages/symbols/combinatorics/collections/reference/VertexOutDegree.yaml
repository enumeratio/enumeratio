name: VertexOutDegree
domain: Collections
signature: VertexOutDegree(g, v)
summary: The number of edges of a [[Graph]] leaving a vertex.
signatures:
  - call: VertexOutDegree(g)
    description: every vertex's out-degree, in VertexList(g) order.
    library: enumeratio-collections
  - call: VertexOutDegree(g, v)
    description: just v's out-degree.
    library: enumeratio-collections
details:
  - See [[VertexInDegree]] for how undirected edges are handled -- the two heads are symmetric.
examples:
  - id: directed-edge-counts-once-at-the-tail
    expr: [VertexOutDegree, [Graph, [List, 1, 2, 3], [List, [DirectedEdge, 1, 2], [DirectedEdge, 1, 3]]], 1]
    expected: 2
  - id: undirected-edge-ignored-on-a-mixed-graph
    expr:
      [
        VertexOutDegree,
        [Graph, [List, 1, 2, 3], [List, [DirectedEdge, 1, 2], [UndirectedEdge, 2, 3], [DirectedEdge, 3, 1]]],
      ]
    expected: [List, 1, 0, 1]
seeAlso:
  - VertexInDegree
  - VertexDegree
