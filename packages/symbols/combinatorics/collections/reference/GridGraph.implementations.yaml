    out: "12"
  tex:
    in: \mathrm{VertexCount}(\mathrm{GridGraph}(\bigl\lbrack3, 4\bigr\rbrack))
    out: "12"
  fullform:
    in: VertexCount[GridGraph[List[3, 4]]]
  wolfram:
    in: VertexCount[GridGraph[List[3, 4]]]
