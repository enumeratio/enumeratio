    in: Partition([[11, 12, 13], [21, 22, 23], [31, 32, 33]], [2, 2], 1)
    out: |-
      [
        [[[11, 12], [21, 22]], [[12, 13], [22, 23]]],
        [[[21, 22], [31, 32]], [[22, 23], [32, 33]]],
      ]
  tex:
    in: \mathrm{Partition}(\bigl\lbrack\bigl\lbrack11, 12, 13\bigr\rbrack, \bigl\lbrack21, 22, 23\bigr\rbrack, \bigl\lbrack31, 32, 33\bigr\rbrack\bigr\rbrack, \bigl\lbrack2, 2\bigr\rbrack, 1)
