partition-list-1-2-3-4-5-6-2:
  epsil:
    in: Partition([1, 2, 3, 4, 5, 6], 2)
    out: "[[1, 2], [3, 4], [5, 6]]"
  tex:
    in: \mathrm{Partition}(\bigl\lbrack1, 2, 3, 4, 5, 6\bigr\rbrack, 2)
    out: \bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack, \bigl\lbrack5, 6\bigr\rbrack\bigr\rbrack
  fullform:
    in: Partition[List[1, 2, 3, 4, 5, 6], 2]
  wolfram:
    in: Partition[List[1, 2, 3, 4, 5, 6], 2]
    out: "{{1, 2}, {3, 4}, {5, 6}}"
    tex:
      in: \text{Partition}[\{1,2,3,4,5,6\},2]
      out: \left( \begin{array}{cc}  1 & 2 \\  3 & 4 \\  5 & 6 \\ \end{array} \right)
a-third-offset-argument-produces-overlapping:
  epsil:
    in: Partition([1, 2, 3, 4, 5, 6], 3, 1)
    out: "[[1, 2, 3], [2, 3, 4], [3, 4, 5], [4, 5, 6]]"
  tex:
    in: \mathrm{Partition}(\bigl\lbrack1, 2, 3, 4, 5, 6\bigr\rbrack, 3, 1)
    out: \bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack2, 3, 4\bigr\rbrack, \bigl\lbrack3, 4, 5\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack\bigr\rbrack
  fullform:
    in: Partition[List[1, 2, 3, 4, 5, 6], 3, 1]
  wolfram:
    in: Partition[List[1, 2, 3, 4, 5, 6], 3, 1]
    out: "{{1, 2, 3}, {2, 3, 4}, {3, 4, 5}, {4, 5, 6}}"
    tex:
      in: \text{Partition}[\{1,2,3,4,5,6\},3,1]
      out: \left( \begin{array}{ccc}  1 & 2 & 3 \\  2 & 3 & 4 \\  3 & 4 & 5 \\  4 & 5 & 6 \\ \end{array} \right)
