even-cycle-is-bipartite:
  epsil:
    in: IsBipartiteGraph(CycleGraph(6))
    out: True
  tex:
    in: \mathrm{IsBipartiteGraph}(\mathrm{CycleGraph}(6))
    out: \top
  traditional:
    in: \mathrm{IsBipartiteGraph}(\mathrm{CycleGraph}(6))
    out: \mathrm{True}
  wolfram:
    in: BipartiteGraphQ[CycleGraph[6]]
odd-cycle-is-not:
  epsil:
    in: IsBipartiteGraph(CycleGraph(5))
    out: False
  tex:
    in: \mathrm{IsBipartiteGraph}(\mathrm{CycleGraph}(5))
    out: \bot
  traditional:
    in: \mathrm{IsBipartiteGraph}(\mathrm{CycleGraph}(5))
    out: \mathrm{False}
  wolfram:
    in: BipartiteGraphQ[CycleGraph[5]]
a-self-loop-is-never-bipartite:
  epsil:
    in: IsBipartiteGraph(Graph([UndirectedEdge(1, 1)]))
    out: False
  tex:
    in: \mathrm{IsBipartiteGraph}(\mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 1)\bigr\rbrack))
    out: \bot
  traditional:
    in: \mathrm{IsBipartiteGraph}(\mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 1)\bigr\rbrack))
    out: \mathrm{False}
  wolfram:
    in: BipartiteGraphQ[Graph[List[UndirectedEdge[1, 1]]]]
