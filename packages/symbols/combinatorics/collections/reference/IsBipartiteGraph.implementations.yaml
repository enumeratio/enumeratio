even-cycle-is-bipartite:
  epsil:
    in: IsBipartiteGraph(CycleGraph(6))
    out: True
  tex:
    in: \mathrm{IsBipartiteGraph}(\mathrm{CycleGraph}(6))
    out: \top
  traditional:
    in: \mathrm{IsBipartiteGraph}(\mathrm{CycleGraph}(6))
    out: \mathrm{True}
  fullform:
    in: BipartiteGraphQ[CycleGraph[6]]
  wolfram:
    in: BipartiteGraphQ[CycleGraph[6]]
