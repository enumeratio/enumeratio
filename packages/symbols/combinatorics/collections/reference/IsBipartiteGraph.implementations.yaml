a-self-loop-is-never-bipartite:
  epsil:
    in: IsBipartiteGraph(Graph([UndirectedEdge(1, 1)]))
    out: False
  tex:
    in: \mathrm{IsBipartiteGraph}(\mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 1)\bigr\rbrack))
    out: \bot
  traditional:
    in: \mathrm{IsBipartiteGraph}(\mathrm{Graph}(\bigl\lbrack\mathrm{UndirectedEdge}(1, 1)\bigr\rbrack))
    out: \mathrm{False}
  fullform:
    in: BipartiteGraphQ[Graph[List[UndirectedEdge[1, 1]]]]
  wolfram:
    in: BipartiteGraphQ[Graph[List[UndirectedEdge[1, 1]]]]
