prints-a-list-as-notatio-source:
  epsil:
    in: ToString([1, 2, 3])
    out: '"[1, 2, 3]"'
  tex:
    in: \mathrm{ToString}(\bigl\lbrack1, 2, 3\bigr\rbrack)
    out: \text{[1, 2, 3]}
  fullform:
    in: ToString[List[1, 2, 3]]
  wolfram:
    in: ToString[List[1, 2, 3]]
prints-an-arithmetic-expression:
  epsil:
    in: ToString(x + 1)
    out: '"x + 1"'
  tex:
    in: \mathrm{ToString}(x+1)
    out: \text{x + 1}
  fullform:
    in: ToString[Plus[x, 1]]
  wolfram:
    in: ToString[Plus[x, 1]]
    out: '"1 + x"'
    tex:
      in: \text{ToString}[x+1]
      out: \text{1 + x}
    verdict: disagree
    kind: convention
    note: Wolfram's default term order for Plus prints the integer first ("1 + x"); ours prints the variable first ("x + 1"). Same expression, different default ordering convention.
