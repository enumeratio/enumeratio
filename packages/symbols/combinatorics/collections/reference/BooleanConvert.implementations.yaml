default-form-is-dnf:
  epsil:
    in: BooleanConvert(p && (b || r))
    out: b && p || p && r
  tex:
    in: \mathrm{BooleanConvert}(p\land(b\lor r))
    out: b\land p\lor p\land r
  fullform:
    in: BooleanConvert[And[p, Or[b, r]]]
cnf-distributes-or-over-and:
  epsil:
    in: BooleanConvert(p || b && r, "\(CNF)")
    out: (b || p) && (p || r)
    back: [BooleanConvert, [Or, p, [And, b, r]], [String, "''", CNF]]
  tex:
    in: \mathrm{BooleanConvert}(p\lor b\land r, \text{\mathrm{CNF}})
    out: (b\lor p)\land(p\lor r)
  fullform:
    in: BooleanConvert[Or[p, And[b, r]], String[CNF]]
nnf-pushes-not-to-the-leaves-not-distributed:
  epsil:
    in: BooleanConvert(Implies(p, b), "\(NNF)")
    out: b || !p
    back: [BooleanConvert, [Implies, p, b], [String, "''", NNF]]
  tex:
    in: \mathrm{BooleanConvert}(p\implies b, \text{\mathrm{NNF}})
    out: b\lor\lnot p
  fullform:
    in: BooleanConvert[Implies[p, b], String[NNF]]
a-tautological-clause-drops-out-of-cnf:
  epsil:
    in: BooleanConvert(p || !p, "\(CNF)")
    out: True
    back: [BooleanConvert, [Or, p, [Not, p]], [String, "''", CNF]]
  tex:
    in: \mathrm{BooleanConvert}(p\lor\lnot p, \text{\mathrm{CNF}})
    out: \top
  traditional:
    in: \mathrm{BooleanConvert}(p\lor\lnot p, \text{\mathrm{CNF}})
    out: \mathrm{True}
  fullform:
    in: BooleanConvert[Or[p, Not[p]], String[CNF]]
an-unimplemented-form-stays-unevaluated:
  epsil:
    in: BooleanConvert(p, "\(ESOP)")
    out: BooleanConvert(p, "\(ESOP)")
    back: [BooleanConvert, p, [String, "''", ESOP]]
  tex:
    in: \mathrm{BooleanConvert}(p, \text{\mathrm{ESOP}})
    out: \mathrm{BooleanConvert}(p, \text{\mathrm{ESOP}})
  fullform:
    in: BooleanConvert[p, String[ESOP]]
