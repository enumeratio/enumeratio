default-form-is-dnf:
  epsil:
    in: BooleanConvert(p && (b || r))
    out: b && p || p && r
  tex:
    in: \mathrm{BooleanConvert}(p\land(b\lor r))
    out: b\land p\lor p\land r
  fullform:
    in: BooleanConvert[And[p, Or[b, r]]]
  wolfram:
    in: BooleanConvert[And[p, Or[b, r]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{BooleanConvert}[p\land (b\lor r)]-((b\land p)\lor (p\land r))],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{BooleanConvert}\left[-\frac{11}{5}\land \left(\frac{7}{3}\lor \frac{13}{4}\right)\right]-\left(\left(\frac{7}{3}\land -\frac{11}{5}\right)\lor \left(-\frac{11}{5}\land \frac{13}{4}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{BooleanConvert}\left[\frac{19}{8}\land \left(-\frac{17}{6}\lor -\frac{23}{9}\right)\right]-\left(\left(-\frac{17}{6}\land \frac{19}{8}\right)\lor \left(\frac{19}{8}\land -\frac{23}{9}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{BooleanConvert}\left[-\frac{11}{5}\land \left(\frac{7}{3}\lor \frac{13}{4}\right)\right]-\left(\left(\frac{7}{3}\land -\frac{11}{5}\right)\lor \left(-\frac{11}{5}\land \frac{13}{4}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
cnf-distributes-or-over-and:
  epsil:
    in: BooleanConvert(p || b && r, "CNF")
    out: (b || p) && (p || r)
  tex:
    in: \mathrm{BooleanConvert}(p\lor b\land r, \text{CNF})
    out: (b\lor p)\land(p\lor r)
  fullform:
    in: BooleanConvert[Or[p, And[b, r]], "CNF"]
  wolfram:
    in: BooleanConvert[Or[p, And[b, r]], "CNF"]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{BooleanConvert}[p\lor (b\land r),\text{CNF}]-((b\lor p)\land (p\lor r))],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{BooleanConvert}\left[-\frac{11}{5}\lor \left(\frac{7}{3}\land \frac{13}{4}\right),\text{CNF}\right]-\left(\left(\frac{7}{3}\lor -\frac{11}{5}\right)\land \left(-\frac{11}{5}\lor \frac{13}{4}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{BooleanConvert}\left[\frac{19}{8}\lor \left(-\frac{17}{6}\land -\frac{23}{9}\right),\text{CNF}\right]-\left(\left(-\frac{17}{6}\lor \frac{19}{8}\right)\land \left(\frac{19}{8}\lor -\frac{23}{9}\right)\right)\right]\right],\text{Chop}\left[N\left[\text{BooleanConvert}\left[-\frac{11}{5}\lor \left(\frac{7}{3}\land \frac{13}{4}\right),\text{CNF}\right]-\left(\left(\frac{7}{3}\lor -\frac{11}{5}\right)\land \left(-\frac{11}{5}\lor \frac{13}{4}\right)\right)\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
nnf-pushes-not-to-the-leaves-not-distributed:
  epsil:
    in: BooleanConvert(Implies(p, b), "NNF")
    out: b || !p
  tex:
    in: \mathrm{BooleanConvert}(p\implies b, \text{NNF})
    out: b\lor\lnot p
  fullform:
    in: BooleanConvert[Implies[p, b], "NNF"]
a-tautological-clause-drops-out-of-cnf:
  epsil:
    in: BooleanConvert(p || !p, "CNF")
    out: True
  tex:
    in: \mathrm{BooleanConvert}(p\lor\lnot p, \text{CNF})
    out: \top
  traditional:
    in: \mathrm{BooleanConvert}(p\lor\lnot p, \text{CNF})
    out: \mathrm{True}
  fullform:
    in: BooleanConvert[Or[p, Not[p]], "CNF"]
  wolfram:
    in: BooleanConvert[Or[p, Not[p]], "CNF"]
    out: True
    tex:
      in: \text{BooleanConvert}[p\lor \neg p,\text{CNF}]
      out: \text{True}
an-unimplemented-form-stays-unevaluated:
  epsil:
    in: BooleanConvert(p, "ESOP")
    out: BooleanConvert(p, "ESOP")
  tex:
    in: \mathrm{BooleanConvert}(p, \text{ESOP})
    out: \mathrm{BooleanConvert}(p, \text{ESOP})
  fullform:
    in: BooleanConvert[p, "ESOP"]
  wolfram:
    in: BooleanConvert[p, "ESOP"]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{BooleanConvert}[p,\text{ESOP}]-\text{BooleanConvert}[p,\text{ESOP}]],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{BooleanConvert}\left[\frac{7}{3},\text{ESOP}\right]-\text{BooleanConvert}\left[\frac{7}{3},\text{ESOP}\right]\right]\right],\text{Chop}\left[N\left[\text{BooleanConvert}\left[-\frac{11}{5},\text{ESOP}\right]-\text{BooleanConvert}\left[-\frac{11}{5},\text{ESOP}\right]\right]\right],\text{Chop}\left[N\left[\text{BooleanConvert}\left[\frac{13}{4},\text{ESOP}\right]-\text{BooleanConvert}\left[\frac{13}{4},\text{ESOP}\right]\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
