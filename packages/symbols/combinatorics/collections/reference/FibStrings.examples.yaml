  role: test
  expr: [Take, [FibStrings, 4], 8]
  expected:
    [
      List,
      [List, 0, 0, 0, 0],
      [List, 0, 0, 0, 1],
      [List, 0, 0, 1, 0],
      [List, 0, 1, 0, 0],
      [List, 0, 1, 0, 1],
      [List, 1, 0, 0, 0],
      [List, 1, 0, 0, 1],
      [List, 1, 0, 1, 0],
    ]
