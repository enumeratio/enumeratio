incidence-matrix-of-a-mixed-graph:
  epsil:
    in: IncidenceMatrix(Graph([1, 2, 3], [UndirectedEdge(1, 2), DirectedEdge(2, 3)]))
    out: "[[1, 0], [1, -1], [0, 1]]"
  tex:
    in: \mathrm{IncidenceMatrix}(\mathrm{Graph}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack\mathrm{UndirectedEdge}(1, 2), \mathrm{DirectedEdge}(2, 3)\bigr\rbrack))
    out: \bigl\lbrack\bigl\lbrack1, 0\bigr\rbrack, \bigl\lbrack1, -1\bigr\rbrack, \bigl\lbrack0, 1\bigr\rbrack\bigr\rbrack
  fullform:
    in: IncidenceMatrix[Graph[List[1, 2, 3], List[UndirectedEdge[1, 2], DirectedEdge[2, 3]]]]
  wolfram:
    in: IncidenceMatrix[Graph[List[1, 2, 3], List[UndirectedEdge[1, 2], DirectedEdge[2, 3]]]]
