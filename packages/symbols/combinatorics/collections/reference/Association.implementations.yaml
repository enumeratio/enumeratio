length-counts-the-key-value-pairs:
  epsil:
    in: Length(Association(Rule(1, 2), Rule(3, 4)))
    out: "2"
  tex:
    in: \mathrm{Length}(\mathrm{Association}(\mathrm{Rule}(1, 2), \mathrm{Rule}(3, 4)))
    out: "2"
  fullform:
    in: Length[Association[Rule[1, 2], Rule[3, 4]]]
    back: [Length, [Association, [KeyValuePair, 1, 2], [KeyValuePair, 3, 4]]]
  wolfram:
    in: Length[Association[Rule[1, 2], Rule[3, 4]]]
first-is-the-first-value-not-the-first-rule:
  epsil:
    in: First(Association(Rule(1, a), Rule(2, b)))
    out: a
  tex:
    in: \mathrm{First}(\mathrm{Association}(\mathrm{Rule}(1, a), \mathrm{Rule}(2, b)))
    out: a
  fullform:
    in: First[Association[Rule[1, a], Rule[2, b]]]
    back: [First, [Association, [KeyValuePair, 1, a], [KeyValuePair, 2, b]]]
  wolfram:
    in: First[Association[Rule[1, a], Rule[2, b]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{First}[\text{Association}[1\to a,2\to b]]-a],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{7}{3},2\to -\frac{11}{5}\right]\right]-\frac{7}{3}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{13}{4},2\to -\frac{17}{6}\right]\right]-\frac{13}{4}\right]\right],\text{Chop}\left[N\left[\text{First}\left[\text{Association}\left[1\to \frac{19}{8},2\to -\frac{23}{9}\right]\right]-\frac{19}{8}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
last-is-the-last-value:
  epsil:
    in: Last(Association(Rule(1, a), Rule(2, b)))
    out: b
  tex:
    in: \mathrm{Last}(\mathrm{Association}(\mathrm{Rule}(1, a), \mathrm{Rule}(2, b)))
    out: b
  fullform:
    in: Last[Association[Rule[1, a], Rule[2, b]]]
    back: [Last, [Association, [KeyValuePair, 1, a], [KeyValuePair, 2, b]]]
  wolfram:
    in: Last[Association[Rule[1, a], Rule[2, b]]]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Last}[\text{Association}[1\to a,2\to b]]-b],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Last}\left[\text{Association}\left[1\to \frac{7}{3},2\to -\frac{11}{5}\right]\right]--\frac{11}{5}\right]\right],\text{Chop}\left[N\left[\text{Last}\left[\text{Association}\left[1\to \frac{13}{4},2\to -\frac{17}{6}\right]\right]--\frac{17}{6}\right]\right],\text{Chop}\left[N\left[\text{Last}\left[\text{Association}\left[1\to \frac{19}{8},2\to -\frac{23}{9}\right]\right]--\frac{23}{9}\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
join-merges-keys-a-later-value-for-a-repeated:
  epsil:
    in: Join(Association(Rule(a, b)), Association(Rule(c, d), Rule(a, f)))
    out: Association(Rule(a, f), Rule(c, d))
  tex:
    in: \mathrm{Join}(\mathrm{Association}(\mathrm{Rule}(a, b)), \mathrm{Association}(\mathrm{Rule}(c, d), \mathrm{Rule}(a, f)))
    out: \mathrm{Association}(\mathrm{Rule}(a, f), \mathrm{Rule}(c, d))
  fullform:
    in: Join[Association[Rule[a, b]], Association[Rule[c, d], Rule[a, f]]]
    back: [Join, [Association, [KeyValuePair, a, b]], [Association, [KeyValuePair, c, d], [KeyValuePair, a, f]]]
  wolfram:
    in: Join[Association[Rule[a, b]], Association[Rule[c, d], Rule[a, f]]]
    out: <|a -> f, c -> d|>
    tex:
      in: \text{Join}[\text{Association}[a\to b],\text{Association}[c\to d,a\to f]]
      out: \unicode{f113}a\to f,c\to d\unicode{f114}
sort-orders-the-entries-by-value:
  epsil:
    in: Sort(Association(Rule(a, 4), Rule(b, 1), Rule(c, 3)))
    out: Association(Rule(b, 1), Rule(c, 3), Rule(a, 4))
  tex:
    in: \mathrm{Sort}(\mathrm{Association}(\mathrm{Rule}(a, 4), \mathrm{Rule}(b, 1), \mathrm{Rule}(c, 3)))
    out: \mathrm{Association}(\mathrm{Rule}(b, 1), \mathrm{Rule}(c, 3), \mathrm{Rule}(a, 4))
  fullform:
    in: Sort[Association[Rule[a, 4], Rule[b, 1], Rule[c, 3]]]
    back: [Sort, [Association, [KeyValuePair, a, 4], [KeyValuePair, b, 1], [KeyValuePair, c, 3]]]
  wolfram:
    in: Sort[Association[Rule[a, 4], Rule[b, 1], Rule[c, 3]]]
    out: <|b -> 1, c -> 3, a -> 4|>
    tex:
      in: \text{Sort}[\text{Association}[a\to 4,b\to 1,c\to 3]]
      out: \unicode{f113}b\to 1,c\to 3,a\to 4\unicode{f114}
