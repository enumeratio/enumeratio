nest-f-x-3:
  epsil:
    in: Nest(f, x, 3)
    out: f(f(f(x)))
  tex:
    in: \mathrm{Nest}(f, x, 3)
    out: f(f(f(x)))
  fullform:
    in: Nest[f, x, 3]
repeated-squaring-2-2-2-2:
  epsil:
    in: Nest(Function(_1 ^ 2), 2, 3)
    out: "256"
    back: Unreadable
  tex:
    in: \mathrm{Nest}(()\mapsto\operatorname{\_1}^2, 2, 3)
    out: "256"
  fullform:
    in: Nest[Function[Power[Slot[1], 2]], 2, 3]
  wolfram:
    in: Nest[Function[Power[Slot[1], 2]], 2, 3]
zero-applications-leave-x-alone:
  epsil:
    in: Nest(f, x, 0)
    out: x
  tex:
    in: \mathrm{Nest}(f, x, 0)
    out: x
  fullform:
    in: Nest[f, x, 0]
nest-function-2-times-1-1-10:
  epsil:
    in: Nest(Function(2 * _1), 1, 10)
    out: 1_024
    back: Unreadable
  tex:
    in: \mathrm{Nest}(()\mapsto2\operatorname{\_1}, 1, 10)
    out: 1\,024
  fullform:
    in: Nest[Function[Times[2, Slot[1]]], 1, 10]
  wolfram:
    in: Nest[Function[Times[2, Slot[1]]], 1, 10]
three-newton-steps-toward-sqrt-2:
  epsil:
    in: Nest(Function((_1 + 2 / _1) / 2), 1, 3)
    out: 577 / 408
    back: Unreadable
  tex:
    in: \mathrm{Nest}(()\mapsto\frac{\operatorname{\_1}+\frac{2}{\operatorname{\_1}}}{2}, 1, 3)
    out: \frac{577}{408}
  fullform:
    in: Nest[Function[Divide[Plus[Slot[1], Divide[2, Slot[1]]], 2]], 1, 3]
  wolfram:
    in: Nest[Function[Divide[Plus[Slot[1], Divide[2, Slot[1]]], 2]], 1, 3]
