standard-range:
  epsil:
    in: PascalBinomial(5, 2)
    out: "10"
  tex:
    in: \mathrm{PascalBinomial}(5, 2)
    out: "10"
  wolfram:
    in: PascalBinomial[5, 2]
negative-n:
  epsil:
    in: PascalBinomial(-1, 3)
    out: "-1"
  tex:
    in: \mathrm{PascalBinomial}(-1, 3)
    out: "-1"
  wolfram:
    in: PascalBinomial[-1, 3]
