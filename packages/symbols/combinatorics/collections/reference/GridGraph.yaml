name: GridGraph
domain: Collections
signature: GridGraph(dims)
summary: A rectangular (or higher-dimensional) grid graph.
signatures:
  - call: GridGraph(dims)
    description: the Cartesian product of paths of the given lengths — `GridGraph({m, n})` is
      an $m \times n$ grid. Vertices are numbered 1-based, row-major.
    library: enumeratio-collections
examples:
  - id: a-3-by-4-grid
    expr: [VertexCount, [GridGraph, [List, 3, 4]]]
    expected: 12
    caption: A 3x4 grid has 12 vertices
  - id: edge-count-of-a-3-by-4-grid
    expr: [EdgeCount, [GridGraph, [List, 3, 4]]]
    expected: 17
    caption: "$m(n-1) + n(m-1) = 3 \\cdot 3 + 4 \\cdot 2 = 17$ edges"
seeAlso:
  - HypercubeGraph
  - CompleteGraph
