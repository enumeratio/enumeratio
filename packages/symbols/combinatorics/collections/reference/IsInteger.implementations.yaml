a-plain-integer:
  epsil:
    in: IsInteger(4)
    out: True
  tex:
    in: \mathrm{IsInteger}(4)
    out: \top
  traditional:
    in: \mathrm{IsInteger}(4)
    out: \mathrm{True}
  fullform:
    in: IntegerQ[4]
  wolfram:
    in: IntegerQ[4]
a-rational-is-not-an-integer:
  epsil:
    in: IsInteger(1 / 2)
    out: False
  tex:
    in: \mathrm{IsInteger}(\frac{1}{2})
    out: \bot
  traditional:
    in: \mathrm{IsInteger}(\frac{1}{2})
    out: \mathrm{False}
  fullform:
    in: IntegerQ[Rational[1, 2]]
  wolfram:
    in: IntegerQ[Rational[1, 2]]
a-free-symbol-is-false:
  epsil:
    in: IsInteger(x)
    out: False
  tex:
    in: \mathrm{IsInteger}(x)
    out: \bot
  traditional:
    in: \mathrm{IsInteger}(x)
    out: \mathrm{False}
  fullform:
    in: IntegerQ[x]
a-negative-integer:
  epsil:
    in: IsInteger(-3)
    out: True
  tex:
    in: \mathrm{IsInteger}(-3)
    out: \top
  traditional:
    in: \mathrm{IsInteger}(-3)
    out: \mathrm{True}
  fullform:
    in: IntegerQ[-3]
  wolfram:
    in: IntegerQ[-3]
