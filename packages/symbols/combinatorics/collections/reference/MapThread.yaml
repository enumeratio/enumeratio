name: MapThread
domain: Collections
signature: MapThread(f, {{a1, …}, {b1, …}, …})
summary: f applied across the CORRESPONDING elements of each list, not each list in turn.
signatures:
  - call: MapThread(f, lists)
    description: "{f(a1, b1, …), f(a2, b2, …), …} for lists = {{a1, a2, …}, {b1, b2, …}, …}"
    library: enumeratio-collections
details:
  - Every row of lists must be the same length; a ragged input is left unevaluated.
  - The 3-argument Wolfram form (a level spec) isn't implemented — only the top level threads.
seeAlso:
  - MapIndexed
  - Through
names:
  wolframIdentity: true
