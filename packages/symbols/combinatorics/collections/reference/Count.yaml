name: Count
domain: Collections
signature: Count(collection, value)
summary: The number of elements equal to value in the collection.
signatures:
  - call: Count(collection, value)
    description: the number of elements equal to `value`.
  - call: Count(collection, value, level)
    description: matches counted down to `level` (levels 1 through `level`), or — with `level` written as $\{level\}$ — at that level only.
    library: enumeratio-collections
details:
  - A value absent from the collection counts as 0.
  - Tests exact equality against a fixed value — not a Wolfram-style typed pattern like `_Integer`.
  - See [[Length]] for the total element count, and [[IndexOf]] for a single matching position.
  - A bare integer level spec counts matches at every level from 1 through it; $\{level\}$ counts that level only.
examples:
  - id: count-list-1-2-2-3-2-2
    expr: [Count, [List, 1, 2, 2, 3, 2], 2]
    expected: 3
  - id: count-list-1-2-2-3-2-4-2
    expr: [Count, [List, 1, 2, 2, 3, 2, 4], 2]
    expected: 3
  - id: a-value-absent-from-the-collection-counts-as-0
    expr: [Count, [List, 1, 2, 3], 9]
    expected: 0
    caption: A value absent from the collection counts as 0
  - id: count-tests-exact-equality-a-typed-pattern-like
    expr: [Count, [List, 1, a, 2, b], _Integer]
    expected: 0
    category: Possible issues
    caption: Count tests exact equality; a typed pattern like `_Integer` matches nothing
  - id: count-list-a-b-a-a-b-c-b-b
    expr: [Count, [List, a, b, a, a, b, c, b], b]
    expected: 3
  - id: the-value-can-itself-be-a-list
    expr: [Count, [List, [List, 1, 2], [List, 1, 2], 3], [List, 1, 2]]
    expected: 2
    category: Scope
    caption: The value can itself be a list
  - id: a-predicate-counts-the-elements-satisfying-it
    expr: [Count, [List, 1, 2, 3, 4], [Function, [Greater, _1, 2]]]
    expected: 2
    category: Scope
    caption: A predicate counts the elements satisfying it, like Wolfram's pattern test $\_?(\# > 2 \&)$
  - id: only-top-level-elements-are-compared-by-default
    expr: [Count, [List, [List, a, a, b], b, [List, a, b, a]], b]
    expected: 1
    category: Scope
    caption: Only top-level elements are compared by default
  - id: a-bare-level-spec-counts-matches-down-through
    expr: [Count, [List, [List, a, a, b], b, [List, a, b, a]], b, 2]
    expected: 3
    category: Scope
    caption: A bare level spec counts matches down through level 2
  - id: 2-counts-matches-at-level-2-only
    expr: [Count, [List, [List, a, a, b], b, [List, a, b, a]], b, [List, 2]]
    expected: 2
    category: Scope
    caption: $\{2\}$ counts matches at level 2 only
  - id: count-tests-exact-equality-so-a-pattern-like
    expr: [Count, [List, a, 2, a, a, 1, c, b, 3, 3], _Integer]
    expected: 0
    category: Possible issues
    caption: Count tests exact equality, so a pattern like $\_Integer$ matches nothing
  - id: the-counts-of-the-distinct-values-add-up-to-the
    expr:
      [
        Equal,
        [
          Add,
          [Count, [List, 1, 2, 2, 3, 3, 3], 1],
          [Count, [List, 1, 2, 2, 3, 3, 3], 2],
          [Count, [List, 1, 2, 2, 3, 3, 3], 3],
        ],
        [Length, [List, 1, 2, 2, 3, 3, 3]],
      ]
    expected: True
    category: Properties
    caption: The counts of the distinct values add up to the [[Length]]
seeAlso:
  - Length
  - IndexOf
