count-carlitzcompositions-5:
  epsil:
    in: Count(CarlitzCompositions(5))
    out: "7"
  tex:
    in: \mathrm{Count}(\mathrm{CarlitzCompositions}(5))
    out: "7"
  fullform:
    in: Count[CarlitzCompositions[5]]
first-element-of-carlitzcompositions-5:
  epsil:
    in: CarlitzCompositions(5)[1]
    out: "[1, 3, 1]"
  tex:
    in: \mathrm{CarlitzCompositions}(5)[1]
    out: \bigl\lbrack1, 3, 1\bigr\rbrack
  fullform:
    in: Part[CarlitzCompositions[5], 1]
every-element-of-carlitzcompositions-5:
  epsil:
    in: Take(CarlitzCompositions(5), 7)
    out: "[[1, 3, 1], [1, 4], [2, 1, 2], [2, 3], [3, 2], [4, 1], [5]]"
  tex:
    in: \mathrm{Take}(\mathrm{CarlitzCompositions}(5), 7)
    out: \bigl\lbrack\bigl\lbrack1, 3, 1\bigr\rbrack, \bigl\lbrack1, 4\bigr\rbrack, \bigl\lbrack2, 1, 2\bigr\rbrack, \bigl\lbrack2, 3\bigr\rbrack, \bigl\lbrack3, 2\bigr\rbrack, \bigl\lbrack4, 1\bigr\rbrack, \bigl\lbrack5\bigr\rbrack\bigr\rbrack
  fullform:
    in: Take[CarlitzCompositions[5], 7]
