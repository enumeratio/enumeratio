values-not-near-zero-pass-through-unchanged:
  epsil:
    in: Chop(1.2)
    out: "1.2"
  tex:
    in: \mathrm{chop}(1.2)
    out: "1.2"
  wolfram:
    in: Chop[1.2]
    out: "1.2"
    tex:
      in: \text{Chop}[1.2]
      out: "1.2"
values-smaller-than-about-10-10-collapse-to:
  epsil:
    in: Chop(e-11)
    out: "0"
  tex:
    in: \mathrm{chop}(10^{-11})
    out: "0"
  wolfram:
    in: Chop[1*^-11]
    out: 1/100000000000
    tex:
      in: \text{Chop}\left[\frac{1}{100000000000}\right]
      out: \frac{1}{100000000000}
negative-values-chop-the-same-way:
  epsil:
    in: Chop(-e-11)
    out: "0"
  tex:
    in: \mathrm{chop}(-10^{-11})
    out: "0"
  wolfram:
    in: Chop[-1*^-11]
    out: -1/100000000000
    tex:
      in: \text{Chop}\left[-\frac{1}{100000000000}\right]
      out: -\frac{1}{100000000000}
chops-the-real-and-imaginary-parts-independently:
  epsil:
    in: Chop(e-12 + 3i)
    out: 3i
  tex:
    in: \mathrm{chop}(10^{-12}+3i)
    out: 3i
  wolfram:
    in: Chop[Complex[1*^-12, 3]]
    out: 1/1000000000000 + 3*I
    tex:
      in: \text{Chop}\left[\frac{1}{1000000000000}+3 i\right]
      out: \frac{1}{1000000000000}+3 i
cleans-up-the-floating-point-residue-from:
  epsil:
    in: Chop(3 * N(1 / 3) - 1)
    out: "0"
  tex:
    in: \mathrm{chop}(3N(\frac{1}{3})-1)
    out: "0"
  wolfram:
    in: Chop[Subtract[Times[3, N[Divide[1, 3]]], 1]]
    out: "0"
    tex:
      in: \text{Chop}\left[3 N\left[\frac{1}{3}\right]-1\right]
      out: "0"
only-the-value-s-own-magnitude-matters-this:
  epsil:
    in: Chop(1 + e-12)
    out: 1.000_000_000_001
  tex:
    in: \mathrm{chop}(1+10^{-12})
    out: 1.000\,000\,000\,001
  wolfram:
    in: Chop[Plus[1, 1*^-12]]
    out: 1000000000001/1000000000000
    tex:
      in: \text{Chop}\left[1+\frac{1}{1000000000000}\right]
      out: \frac{1000000000001}{1000000000000}
a-hard-cutoff-at-about-10-10-a-value-just-above:
  epsil:
    in: Chop(10_000_000_001e-20)
    out: 10_000_000_001e-20
  tex:
    in: \mathrm{chop}(10\,000\,000\,001\cdot10^{-20})
    out: 10\,000\,000\,001\cdot10^{-20}
  wolfram:
    in: Chop[1.0000000001*^-10]
    out: 1.0000000001*^-10
    tex:
      in: \text{Chop}[\text{1.0000000001$\grave{ }$*${}^{\wedge}$-10}]
      out: \text{1.0000000001$\grave{ }$*${}^{\wedge}$-10}
threads-element-wise-over-a-list:
  epsil:
    in: Chop([1.2, e-11, 3.5])
    out: "[1.2, 0, 3.5]"
  tex:
    in: \mathrm{chop}(\bigl\lbrack1.2, 10^{-11}, 3.5\bigr\rbrack)
    out: \bigl\lbrack1.2, 0, 3.5\bigr\rbrack
  wolfram:
    in: Chop[List[1.2, 1*^-11, 3.5]]
a-negligible-imaginary-part-is-dropped-leaving-a:
  epsil:
    in: Chop(1 + e-14 * i)
    out: "1"
  tex:
    in: \mathrm{chop}(1+10^{-14}i)
    out: "1"
  wolfram:
    in: Chop[Plus[1, Complex[0, 1*^-14]]]
stays-symbolic:
  epsil:
    in: Chop(x)
    out: Chop(x)
  tex:
    in: \mathrm{chop}(x)
    out: \mathrm{chop}(x)
exact-numbers-not-near-zero-pass-through:
  epsil:
    in: Chop(1 / 3)
    out: 1 / 3
  tex:
    in: \mathrm{chop}(\frac{1}{3})
    out: \frac{1}{3}
  wolfram:
    in: Chop[Rational[1, 3]]
a-second-argument-sets-the-tolerance-here:
  epsil:
    in: Chop(0.001, 0.01)
    out: "0"
  tex:
    in: \mathrm{chop}(0.001, 0.01)
    out: "0"
  wolfram:
    in: Chop[0.001, 0.01]
and-a-tighter-tolerance-keeps-a-value-the:
  epsil:
    in: Chop(e-15, e-20)
    out: e-15
  tex:
    in: \mathrm{chop}(10^{-15}, 10^{-20})
    out: 10^{-15}
  wolfram:
    in: Chop[1*^-15, 1*^-20]
an-exact-small-number-is-chopped-too:
  epsil:
    in: Chop(10 ^ -20)
    out: "0"
  tex:
    in: \mathrm{chop}(\frac{1}{100\,000\,000\,000\,000\,000\,000})
    out: "0"
  wolfram:
    in: Chop[Power[10, -20]]
    note: "Wolfram's Chop only touches approximate numbers: $\\mathrm{Chop}[10^{-20}]$ stays $1/10^{20}$."
