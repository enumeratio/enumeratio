name: IsInteger
domain: Collections
signature: IsInteger(x)
summary: Tests whether x is manifestly an integer.
signatures:
  - call: IsInteger(x)
    description: True if x is an integer, False otherwise
    library: enumeratio-collections
details:
  - Returns False unless x is provably an integer -- there's no third "unknown" outcome, same convention as IsPrime.
  - A free symbol, or anything compute-engine can't classify, answers False.
seeAlso:
  - IsPrime
  - IsTrue
names:
  wolfram: IntegerQ
