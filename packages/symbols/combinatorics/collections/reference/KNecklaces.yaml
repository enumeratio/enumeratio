name: KNecklaces
domain: Collections
signature: KNecklaces(n, k)
summary: The words of length $n$ over a $k$-letter alphabet up to rotation, represented by the lexicographically-least word in each orbit.
signatures:
  - call: KNecklaces(n, k)
    description: the words of length $n$ over a $k$-letter alphabet up to rotation, represented by the lexicographically-least word in each orbit
    library: enumeratio-collections
details:
  - Count is $\frac{1}{n}\sum_{d \mid n} \varphi(d) \, k^{n/d}$; specializes to [[BinaryNecklaces]] at $k=2$.
seeAlso:
  - BinaryNecklaces
  - KLyndonWords
