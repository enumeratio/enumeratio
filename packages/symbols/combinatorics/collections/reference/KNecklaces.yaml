name: KNecklaces
domain: Collections
signature: KNecklaces(n, k)
summary: The words of length $n$ over a $k$-letter alphabet up to rotation, represented by the lexicographically-least word in each orbit.
signatures:
  - call: KNecklaces(n, k)
    description: the words of length $n$ over a $k$-letter alphabet up to rotation, represented by the lexicographically-least word in each orbit
    library: enumeratio-collections
details:
  - Count is $\frac{1}{n}\sum_{d \mid n} \varphi(d) \, k^{n/d}$; specializes to [[BinaryNecklaces]] at $k=2$.
seeAlso:
  - BinaryNecklaces
  - KLyndonWords
catalog:
  - system: sage
    identity: Necklaces(content)
    url: https://doc.sagemath.org/html/en/reference/combinat/sage/combinat/necklace.html
    note: sage parameterizes by letter-multiplicity content (a composition); ours by fixed (size, base) — a different but related parameterization of the same rotation-class idea
  - system: sympy
    identity: necklaces
    url: https://docs.sympy.org/latest/modules/utilities/iterables.html#sympy.utilities.iterables.necklaces
    note: necklaces(n, base) — 0-indexed colors, shift +1 for our 1-based letters
grades:
  - name: size
    role: axis
  - name: base
    role: param
carrier: Word
