    out: "15"
  tex:
    in: \mathrm{Count}(\mathrm{RestrictedGrowthStrings}(4))
    out: "15"
  fullform:
    in: Count[RestrictedGrowthStrings[4]]
first-element-of-restrictedgrowthstrings-4:
