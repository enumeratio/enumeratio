name: Last
domain: Collections
signature: Last(collection)
summary: The last element of a collection.
signatures:
  - call: Last(collection)
    description: the last element of the collection.
  - call: Last(collection, default)
    description: "`default` when the collection is empty, instead of the last element."
    library: enumeratio-collections
  - call: Last(expr)
    description: the last operand of any expression, not just a collection.
    library: enumeratio-collections
details:
  - $Last(c) = At(c, -1)$. See [[At]].
  - Positional indexing from the front (index 1) and back (negative indices).
  - Complements [[First]] for the other end of a collection.
  - A second argument supplies a default for an empty collection, instead of $Missing$.
  - Works on the operands of any expression, not just a collection's elements.
examples:
  - id: last-list-1-2-3
    expr: [Last, [List, 1, 2, 3]]
    expected: 3
  - id: last-list-10-20-30
    expr: [Last, [List, 10, 20, 30]]
    expected: 30
  - id: last-c-at-c-1-see-at
    expr: [Equal, [Last, [List, 1, 2, 3]], [At, [List, 1, 2, 3], -1]]
    expected: True
    category: Properties
    caption: $Last(c) = At(c, -1)$. See [[At]]
  - id: a-second-argument-supplies-a-default-for-an
    expr: [Last, [List], 99]
    expected: 99
    category: Scope
    caption: A second argument supplies a default for an empty collection
  - id: last-list-a-b-c
    expr: [Last, [List, a, b, c]]
    expected: c
  - id: of-a-matrix-the-last-row
    expr: [Last, [List, [List, a, b], [List, c, d], [List, f, g]]]
    expected: [List, f, g]
    category: Scope
    caption: Of a matrix, the last row
  - id: a-lazy-range-works-too
    expr: [Last, [Range, 5, 10]]
    expected: 10
    category: Scope
    caption: A lazy [[Range]] works too
  - id: any-expression-not-just-a-list-the-last-term-of
    expr: [Last, [Add, [Power, a, 2], [Power, b, 2]]]
    expected: [Power, b, 2]
    category: Scope
    caption: "Any expression, not just a list: the last term of a sum"
  - id: a-default-is-ignored-when-the-collection-has-a
    expr: [Last, [List, a, b], x]
    expected: b
    category: Scope
    caption: A default is ignored when the collection has a last element
  - id: an-empty-collection-has-no-last-element-compute
    expr: [Last, [List]]
    expected: Missing
    category: Possible issues
    caption: An empty collection has no last element; compute-engine returns the symbol $Missing$
    divergence:
      wolfram: Last of an empty list is the symbol Missing here; Wolfram leaves Last[{}] unevaluated (with a Last::nolast message).
seeAlso:
  - First
  - At
