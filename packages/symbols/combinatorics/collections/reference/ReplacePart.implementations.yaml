replaces-a-single-1-based-position:
  epsil:
    in: ReplacePart([a, b, c], Rule(2, z))
    out: "[a, z, c]"
  tex:
    in: \mathrm{ReplacePart}(\bigl\lbrack a, b, c\bigr\rbrack, \mathrm{Rule}(2, z))
    out: \bigl\lbrack a, z, c\bigr\rbrack
  fullform:
    in: ReplacePart[List[a, b, c], Rule[2, z]]
with-a-negative-position-counts-from-the-end:
  epsil:
    in: ReplacePart([a, b, c], Rule(-1, z))
    out: "[a, b, z]"
  tex:
    in: \mathrm{ReplacePart}(\bigl\lbrack a, b, c\bigr\rbrack, \mathrm{Rule}(-1, z))
    out: \bigl\lbrack a, b, z\bigr\rbrack
  fullform:
    in: ReplacePart[List[a, b, c], Rule[-1, z]]
applies-a-list-of-rules:
  epsil:
    in: ReplacePart([a, b, c], [Rule(1, x), Rule(3, y)])
    out: "[x, b, y]"
  tex:
    in: \mathrm{ReplacePart}(\bigl\lbrack a, b, c\bigr\rbrack, \bigl\lbrack\mathrm{Rule}(1, x), \mathrm{Rule}(3, y)\bigr\rbrack)
    out: \bigl\lbrack x, b, y\bigr\rbrack
  fullform:
    in: ReplacePart[List[a, b, c], List[Rule[1, x], Rule[3, y]]]
with-a-nested-i-j-position-drills-into-a-sublist:
  epsil:
    in: ReplacePart([[a, b], c], Rule([1, 2], z))
    out: "[[a, z], c]"
  tex:
    in: \mathrm{ReplacePart}(\bigl\lbrack\bigl\lbrack a, b\bigr\rbrack, c\bigr\rbrack, \mathrm{Rule}(\bigl\lbrack1, 2\bigr\rbrack, z))
    out: \bigl\lbrack\bigl\lbrack a, z\bigr\rbrack, c\bigr\rbrack
  fullform:
    in: ReplacePart[List[List[a, b], c], Rule[List[1, 2], z]]
