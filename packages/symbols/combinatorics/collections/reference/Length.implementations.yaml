length-list-1-2-3-4:
  epsil:
    in: Length([1, 2, 3, 4])
    out: "4"
  tex:
    in: \mathrm{Length}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack)
    out: "4"
  fullform:
    in: Length[List[1, 2, 3, 4]]
  wolfram:
    in: Length[List[1, 2, 3, 4]]
    out: "4"
    tex:
      in: \text{Length}[\{1,2,3,4\}]
      out: "4"
  sympy:
    in: (len([1, 2, 3, 4]) if hasattr([1, 2, 3, 4], '__len__') else 0)
    out: "4"
  sage:
    in: (len([1, 2, 3, 4]) if hasattr([1, 2, 3, 4], '__len__') else 0)
    out: "4"
