length-list-1-2-3-4:
  wolfram:
    in: Length[List[1, 2, 3, 4]]
    out: "4"
    tex:
      in: \text{Length}[\{1,2,3,4\}]
      out: "4"
  sage:
    in: len([1, 2, 3, 4])
    out: "4"
  sympy:
    in: (len([1, 2, 3, 4]) if hasattr([1, 2, 3, 4], '__len__') else 0)
    out: "4"
length-list-1-2-3-4-5:
  wolfram:
    in: Length[List[1, 2, 3, 4, 5]]
    out: "5"
    tex:
      in: \text{Length}[\{1,2,3,4,5\}]
      out: "5"
  sage:
    in: len([1, 2, 3, 4, 5])
    out: "5"
  sympy:
    in: (len([1, 2, 3, 4, 5]) if hasattr([1, 2, 3, 4, 5], '__len__') else 0)
    out: "5"
works-on-any-collection-not-just-list:
  wolfram:
    in: Length[Union[List[1, 2, 3]]]
    out: "3"
    tex:
      in: \text{Length}[\text{Union}[\{1,2,3\}]]
      out: "3"
length-join-a-b-length-a-length-b-see-join:
  wolfram:
    in: (Length[Join[List[1, 2, 3], List[4, 5]]] == Plus[Length[List[1, 2, 3]], Length[List[4, 5]]])
    out: True
    tex:
      in: \text{Length}[\text{Join}[\{1,2,3\},\{4,5\}]]=\text{Length}[\{1,2,3\}]+\text{Length}[\{4,5\}]
      out: \text{True}
an-atom-has-no-parts-so-its-length-is-0:
  sympy:
    in: (len(5) if hasattr(5, '__len__') else 0)
    out: "0"
the-empty-list-has-length-0:
  sympy:
    in: (len([]) if hasattr([], '__len__') else 0)
    out: "0"
of-a-matrix-the-number-of-rows:
  sympy:
    in: (len([[1, 2], [3, 4], [5, 6]]) if hasattr([[1, 2], [3, 4], [5, 6]], '__len__') else 0)
    out: "3"
a-symbol-such-as-pi-is-an-atom-of-length-0:
  sympy:
    in: (len(pi) if hasattr(pi, '__len__') else 0)
    out: "0"
