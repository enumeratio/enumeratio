works-on-any-collection-not-just-list:
  epsil:
    in: Length({1, 2, 3})
    out: "3"
  tex:
    in: \mathrm{Length}(\lbrace1, 2, 3\rbrace)
    out: "3"
  fullform:
    in: Length[Union[List[1, 2, 3]]]
    back: [Length, [Union, [List, 1, 2, 3]]]
  wolfram:
    in: Length[Union[List[1, 2, 3]]]
    out: "3"
    tex:
      in: \text{Length}[\text{Union}[\{1,2,3\}]]
      out: "3"
length-join-a-b-length-a-length-b-see-join:
  epsil:
    in: Length(Join([1, 2, 3], [4, 5])) == Length([1, 2, 3]) + Length([4, 5])
    out: True
  tex:
    in: \mathrm{Length}(\mathrm{Join}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5\bigr\rbrack))=\mathrm{Length}(\bigl\lbrack1, 2, 3\bigr\rbrack)+\mathrm{Length}(\bigl\lbrack4, 5\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Length}(\mathrm{Join}(\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5\bigr\rbrack))=\mathrm{Length}(\bigl\lbrack1, 2, 3\bigr\rbrack)+\mathrm{Length}(\bigl\lbrack4, 5\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: Equal[Length[Join[List[1, 2, 3], List[4, 5]]], Plus[Length[List[1, 2, 3]], Length[List[4, 5]]]]
  wolfram:
    in: (Length[Join[List[1, 2, 3], List[4, 5]]] == Plus[Length[List[1, 2, 3]], Length[List[4, 5]]])
    out: True
    tex:
      in: \text{Length}[\text{Join}[\{1,2,3\},\{4,5\}]]=\text{Length}[\{1,2,3\}]+\text{Length}[\{4,5\}]
      out: \text{True}
an-atom-has-no-parts-so-its-length-is-0:
  epsil:
    in: Length(5)
    out: "0"
  tex:
    in: \mathrm{Length}(5)
    out: "0"
  fullform:
    in: Length[5]
  wolfram:
    in: Length[5]
  sympy:
    in: (len(5) if hasattr(5, '__len__') else 0)
    out: "TypeError: object of type 'int' has no len()"
    verdict: error
    kind: domain
    note: compute-engine's Length is defined as 0 on a non-collection atom; SymPy's len() refuses a non-collection outright.
  sage:
    in: (len(5) if hasattr(5, '__len__') else 0)
