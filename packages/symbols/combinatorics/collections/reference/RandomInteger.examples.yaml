- id: randominteger-default-seed-is-reproducible
  expr: [Last, [List, [SeedRandom, 42], [RandomInteger, 100]]]
  expected: 60
  caption: 42 is the fixed default seed a bare RandomInteger call (no SeedRandom) also uses — reseeded explicitly here so the example stays reproducible regardless of whatever else has already drawn from this engine's shared stream (e.g. another head's own reference example, run earlier on the same worker — see RandomGraph)
