- id: ismachinenumber-ordinary-float
  expr: [IsMachineNumber, 2.5]
  expected: True
- id: ismachinenumber-exact-integer
  expr: [IsMachineNumber, 2]
  expected: False
  category: Scope
  caption: Exact numbers are never machine numbers
- id: ismachinenumber-extended-precision
  expr: [IsMachineNumber, 3.141592653589793]
  expected: False
  category: Possible issues
  caption: A literal with more digits than a double can hold rounds to about 16 — over the machine-precision cutoff
