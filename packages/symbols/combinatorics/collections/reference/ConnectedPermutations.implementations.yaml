count-connectedpermutations-4:
  epsil:
    in: Count(ConnectedPermutations(4))
    out: "13"
  tex:
    in: \mathrm{Count}(\mathrm{ConnectedPermutations}(4))
    out: "13"
  fullform:
    in: Count[ConnectedPermutations[4]]
first-element-of-connectedpermutations-4:
  epsil:
    in: ConnectedPermutations(4)[1]
    out: "[2, 3, 4, 1]"
  tex:
    in: \mathrm{ConnectedPermutations}(4)[1]
    out: \bigl\lbrack2, 3, 4, 1\bigr\rbrack
  fullform:
    in: Part[ConnectedPermutations[4], 1]
every-element-of-connectedpermutations-4:
  epsil:
    in: Take(ConnectedPermutations(4), 13)
    out: |-
      [
        [2, 3, 4, 1],
        [2, 4, 1, 3],
        [2, 4, 3, 1],
        [3, 4, 1, 2],
        [3, 4, 2, 1],
        [3, 1, 4, 2],
        [3, 2, 4, 1],
        [4, 1, 2, 3],
        [4, 1, 3, 2],
        [4, 2, 1, 3],
        [4, 2, 3, 1],
        [4, 3, 1, 2],
        [4, 3, 2, 1],
      ]
  tex:
    in: \mathrm{Take}(\mathrm{ConnectedPermutations}(4), 13)
    out: \bigl\lbrack\bigl\lbrack2, 3, 4, 1\bigr\rbrack, \bigl\lbrack2, 4, 1, 3\bigr\rbrack, \bigl\lbrack2, 4, 3, 1\bigr\rbrack, \bigl\lbrack3, 4, 1, 2\bigr\rbrack, \bigl\lbrack3, 4, 2, 1\bigr\rbrack, \bigl\lbrack3, 1, 4, 2\bigr\rbrack, \bigl\lbrack3, 2, 4, 1\bigr\rbrack, \bigl\lbrack4, 1, 2, 3\bigr\rbrack, \bigl\lbrack4, 1, 3, 2\bigr\rbrack, \bigl\lbrack4, 2, 1, 3\bigr\rbrack, \bigl\lbrack4, 2, 3, 1\bigr\rbrack, \bigl\lbrack4, 3, 1, 2\bigr\rbrack, \bigl\lbrack4, 3, 2, 1\bigr\rbrack\bigr\rbrack
  fullform:
    in: Take[ConnectedPermutations[4], 13]
