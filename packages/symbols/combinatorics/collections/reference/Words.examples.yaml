- id: count-words-3-2
  expr: [Count, [Words, 3, 2]]
  expected: 8
  category: Basic
  caption: $Count(Words(3, 2)) = 8$
- id: first-element-of-words-3-2
  expr: [At, [Words, 3, 2], 1]
  expected: [List, 1, 1, 1]
  category: Basic
  caption: The first element in enumeration order
- id: every-element-of-words-3-2
  role: test
  expr: [Take, [Words, 3, 2], 8]
  expected:
    [
      List,
      [List, 1, 1, 1],
      [List, 1, 1, 2],
      [List, 1, 2, 1],
      [List, 1, 2, 2],
      [List, 2, 1, 1],
      [List, 2, 1, 2],
      [List, 2, 2, 1],
      [List, 2, 2, 2],
    ]
