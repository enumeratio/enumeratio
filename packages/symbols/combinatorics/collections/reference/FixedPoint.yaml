name: FixedPoint
domain: Collections
signature: FixedPoint(f, x)
summary: Iterates f from x until the result no longer changes.
signatures:
  - call: FixedPoint(f, x)
    description: iterates $f$ starting from $x$ until two successive values are equal.
    library: enumeratio-collections
details:
  - compute-engine declares $FixedPoint$ itself but ships no evaluator for it; this library extends that declaration rather than replacing it.
  - Capped at 10,000 iterations, so a sequence that never settles fails closed instead of looping forever — Wolfram's own (much larger, configurable) cap is $MaxIterations.
  - Stops the moment two successive values are the SAME ($SameQ$, structural equality) — exact for an exact sequence, like the halving example below. For an inexact (floating) sequence, also stops once two successive values agree to the engine's working precision ($|\Delta| \le |x| \cdot 10^{1 - precision}$), since a converging inexact iteration essentially never becomes bit-for-bit identical.
examples:
  - id: halving-and-flooring-until-nothing-changes
    expr: [FixedPoint, [Function, [Floor, [Divide, _1, 2]]], 100]
    expected: 0
    caption: Halving and flooring until nothing changes
  - id: the-dottie-number-the-fixed-point-of-cos
    expr: [FixedPoint, Cos, 0.5]
    expected: {num: '0.739085133215160641658'}
    caption: The Dottie number, the fixed point of cos
    divergence:
      wolfram: Wolfram iterates at machine (double) precision and reports 0.7390851332151607; this engine's default precision is 21 digits, and the two agree through the first 15 digits, diverging only in Wolfram's own machine-precision rounding beyond that.
  - id: newton-s-method-for-sqrt-2-run-to-this-engine-s
    expr: [FixedPoint, [Function, [Divide, [Add, _1, [Divide, 2, _1]], 2]], 1.5]
    expected: {num: '1.4142135623730950488016875'}
    category: Applications
    caption: Newton's method for $\sqrt{2}$, run to this engine's default precision
    divergence:
      wolfram: "Same precision difference as the Cos example above: Wolfram's machine-precision fixed point is 1.4142135623730951, agreeing with this one through the first 15 digits."
seeAlso:
  - Nest
  - NestList
