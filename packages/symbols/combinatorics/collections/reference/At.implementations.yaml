    in: "[[1, 2, 3], [4, 5, 6]][All, 2]"
    out: "[2, 5]"
  tex:
    in: \bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack\bigr\rbrack[\mathrm{All}, 2]
    out: \bigl\lbrack2, 5\bigr\rbrack
  fullform:
    in: Part[List[List[1, 2, 3], List[4, 5, 6]], AllTrue, 2]
  wolfram:
    in: Part[List[List[1, 2, 3], List[4, 5, 6]], AllTrue, 2]
index-lists-at-two-levels-extract-a-submatrix:
  epsil:
    in: "[[1, 2, 3], [4, 5, 6], [7, 8, 9]][[1, 3], [2, 3]]"
    out: "[[2, 3], [8, 9]]"
  tex:
    in: \bigl\lbrack\bigl\lbrack1, 2, 3\bigr\rbrack, \bigl\lbrack4, 5, 6\bigr\rbrack, \bigl\lbrack7, 8, 9\bigr\rbrack\bigr\rbrack[\bigl\lbrack1, 3\bigr\rbrack, \bigl\lbrack2, 3\bigr\rbrack]
    out: \bigl\lbrack\bigl\lbrack2, 3\bigr\rbrack, \bigl\lbrack8, 9\bigr\rbrack\bigr\rbrack
  fullform:
    in: Part[List[List[1, 2, 3], List[4, 5, 6], List[7, 8, 9]], List[1, 3], List[2, 3]]
  wolfram:
    in: Part[List[List[1, 2, 3], List[4, 5, 6], List[7, 8, 9]], List[1, 3], List[2, 3]]
