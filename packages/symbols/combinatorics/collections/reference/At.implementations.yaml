list-1-2-3-4-list-2:
  epsil:
    in: "[1, 2, 3, 4][2]"
    out: "2"
  tex:
    in: \bigl\lbrack1, 2, 3, 4\bigr\rbrack[2]
    out: "2"
  fullform:
    in: Part[List[1, 2, 3, 4], 2]
  wolfram:
    in: Part[List[1, 2, 3, 4], 2]
    out: "2"
    tex:
      in: \{1,2,3,4\}[[2]]
      out: "2"
list-1-2-3-4-list-neg-1:
  epsil:
    in: "[1, 2, 3, 4][-1]"
    out: "4"
  tex:
    in: \bigl\lbrack1, 2, 3, 4\bigr\rbrack[-1]
    out: "4"
  fullform:
    in: Part[List[1, 2, 3, 4], -1]
  wolfram:
    in: Part[List[1, 2, 3, 4], -1]
    out: "4"
    tex:
      in: \{1,2,3,4\}[[-1]]
      out: "4"
list-a-b-c-d-list-neg-2:
  epsil:
    in: "[a, b, c, d][-2]"
    out: c
  tex:
    in: \bigl\lbrack a, b, c, d\bigr\rbrack[-2]
    out: c
  fullform:
    in: Part[List[a, b, c, d], -2]
chaining-at-reaches-into-nested-collections-like:
  epsil:
    in: "[[1, 2], [3, 4]][2][1]"
    out: "3"
  tex:
    in: \bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack[2][1]
    out: "3"
  fullform:
    in: Part[Part[List[List[1, 2], List[3, 4]], 2], 1]
  wolfram:
    in: Part[Part[List[List[1, 2], List[3, 4]], 2], 1]
    out: "3"
    tex:
      in: \left( \begin{array}{cc}  1 & 2 \\  3 & 4 \\ \end{array} \right)[[2]][[1]]
      out: "3"
a-list-of-indices-selects-several-elements-at:
  epsil:
    in: "[a, b, c, d][[1, 3]]"
    out: "[a, c]"
  tex:
    in: \bigl\lbrack a, b, c, d\bigr\rbrack[\bigl\lbrack1, 3\bigr\rbrack]
    out: \bigl\lbrack a, c\bigr\rbrack
  fullform:
    in: Part[List[a, b, c, d], List[1, 3]]
a-range-also-works-as-an-index-list-extracting-a:
  epsil:
    in: "[a, b, c, d, e][Range(2, 4)]"
    out: "[b, c, d]"
  tex:
    in: \bigl\lbrack a, b, c, d, e\bigr\rbrack[2..4]
    out: \bigl\lbrack b, c, d\bigr\rbrack
  fullform:
    in: Part[List[a, b, c, d, e], Range[2, 4]]
index-0-is-the-collection-s-own-head-matching:
  epsil:
    in: "[1, 2, 3][0]"
    out: List
  tex:
    in: \bigl\lbrack1, 2, 3\bigr\rbrack[0]
    out: \mathrm{List}
  fullform:
    in: Part[List[1, 2, 3], 0]
  wolfram:
    in: Part[List[1, 2, 3], 0]
an-out-of-range-index-evaluates-to-nan-rather:
  epsil:
    in: "[1, 2, 3][10]"
    out: "`NaN`"
  tex:
    in: \bigl\lbrack1, 2, 3\bigr\rbrack[10]
    out: \operatorname{NaN}
  fullform:
    in: Part[List[1, 2, 3], 10]
  wolfram:
    in: Part[List[1, 2, 3], 10]
    out: "{1, 2, 3}[[10]]"
    tex:
      in: \{1,2,3\}[[10]]
      out: \{1,2,3\}[[10]]
    verdict: disagree
    kind: undefined-form
    note: An out-of-range index is NaN here; Wolfram leaves Part unevaluated (with a Part::partw message).
