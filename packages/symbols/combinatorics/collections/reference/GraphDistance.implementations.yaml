distance-along-a-path-graph:
  epsil:
    in: GraphDistance(PathGraph(5), 1, 5)
    out: "4"
  tex:
    in: \mathrm{GraphDistance}(\mathrm{PathGraph}(5), 1, 5)
    out: "4"
  fullform:
    in: GraphDistance[enumeratio`PathGraph[5], 1, 5]
unreachable-is-infinite:
  epsil:
    in: |-
      GraphDistance(
                     Graph([1, 2, 3, 4], [DirectedEdge(1, 2), UndirectedEdge(3, 4)]),
                     4,
                     1,
                   )
    out: PositiveInfinity
  tex:
    in: \mathrm{GraphDistance}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{DirectedEdge}(1, 2), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack), 4, 1)
    out: \infty
  fullform:
    in: GraphDistance[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], UndirectedEdge[3, 4]]], 4, 1]
  wolfram:
    in: GraphDistance[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], UndirectedEdge[3, 4]]], 4, 1]
unreachable-against-a-longer-directed-chain:
  epsil:
    in: |-
      GraphDistance(Graph([1, 2, 3, 4], [
                                          DirectedEdge(1, 2),
                                          DirectedEdge(2, 3),
                                          UndirectedEdge(3, 4),
                                        ]), 4, 1)
    out: PositiveInfinity
  tex:
    in: \mathrm{GraphDistance}(\mathrm{Graph}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack\mathrm{DirectedEdge}(1, 2), \mathrm{DirectedEdge}(2, 3), \mathrm{UndirectedEdge}(3, 4)\bigr\rbrack), 4, 1)
    out: \infty
  fullform:
    in: GraphDistance[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], DirectedEdge[2, 3], UndirectedEdge[3, 4]]], 4, 1]
  wolfram:
    in: GraphDistance[Graph[List[1, 2, 3, 4], List[DirectedEdge[1, 2], DirectedEdge[2, 3], UndirectedEdge[3, 4]]], 4, 1]
