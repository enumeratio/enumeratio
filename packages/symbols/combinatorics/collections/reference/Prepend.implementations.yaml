prepend-list-a-b-c-d-x:
  epsil:
    in: Prepend([a, b, c, d], x)
    out: "[x, a, b, c, d]"
  tex:
    in: \mathrm{Prepend}(\bigl\lbrack a, b, c, d\bigr\rbrack, x)
    out: \bigl\lbrack x, a, b, c, d\bigr\rbrack
  fullform:
    in: Prepend[List[a, b, c, d], x]
  wolfram:
    in: Prepend[List[a, b, c, d], x]
    out: "{x, a, b, c, d}"
    tex:
      in: \text{Prepend}[\{a,b,c,d\},x]
      out: \{x,a,b,c,d\}
prepend-c-x-join-x-c-see-join:
  epsil:
    in: Prepend([1, 2, 3], 0) == Join([0], [1, 2, 3])
    out: True
  tex:
    in: \mathrm{Prepend}(\bigl\lbrack1, 2, 3\bigr\rbrack, 0)=\mathrm{Join}(\bigl\lbrack0\bigr\rbrack, \bigl\lbrack1, 2, 3\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Prepend}(\bigl\lbrack1, 2, 3\bigr\rbrack, 0)=\mathrm{Join}(\bigl\lbrack0\bigr\rbrack, \bigl\lbrack1, 2, 3\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: Equal[Prepend[List[1, 2, 3], 0], Join[List[0], List[1, 2, 3]]]
  wolfram:
    in: (Prepend[List[1, 2, 3], 0] == Join[List[0], List[1, 2, 3]])
a-rule-inserted-at-the-front-of-an-association:
  epsil:
    in: Prepend(Association(Rule(1, a), Rule(2, b)), Rule(3, d))
    out: Association(Rule(3, d), Rule(1, a), Rule(2, b))
  tex:
    in: \mathrm{Prepend}(\mathrm{Association}(\mathrm{Rule}(1, a), \mathrm{Rule}(2, b)), \mathrm{Rule}(3, d))
    out: \mathrm{Association}(\mathrm{Rule}(3, d), \mathrm{Rule}(1, a), \mathrm{Rule}(2, b))
  fullform:
    in: Prepend[Association[Rule[1, a], Rule[2, b]], Rule[3, d]]
    back: [Prepend, [Association, [KeyValuePair, 1, a], [KeyValuePair, 2, b]], [KeyValuePair, 3, d]]
  wolfram:
    in: Prepend[Association[Rule[1, a], Rule[2, b]], Rule[3, d]]
    out: <|3 -> d, 1 -> a, 2 -> b|>
    tex:
      in: \text{Prepend}[\text{Association}[1\to a,2\to b],3\to d]
      out: \unicode{f113}3\to d,1\to a,2\to b\unicode{f114}
several-rules-prepended-at-once:
  epsil:
    in: Prepend(Association(Rule(1, a), Rule(2, b)), [Rule(3, d), Rule(4, e)])
    out: Association(Rule(3, d), Rule(4, e), Rule(1, a), Rule(2, b))
  tex:
    in: \mathrm{Prepend}(\mathrm{Association}(\mathrm{Rule}(1, a), \mathrm{Rule}(2, b)), \bigl\lbrack\mathrm{Rule}(3, d), \mathrm{Rule}(4, e)\bigr\rbrack)
    out: \mathrm{Association}(\mathrm{Rule}(3, d), \mathrm{Rule}(4, e), \mathrm{Rule}(1, a), \mathrm{Rule}(2, b))
  fullform:
    in: Prepend[Association[Rule[1, a], Rule[2, b]], List[Rule[3, d], Rule[4, e]]]
    back:
      [
        Prepend,
        [Association, [KeyValuePair, 1, a], [KeyValuePair, 2, b]],
        [List, [KeyValuePair, 3, d], [KeyValuePair, 4, e]],
      ]
  wolfram:
    in: Prepend[Association[Rule[1, a], Rule[2, b]], List[Rule[3, d], Rule[4, e]]]
    out: <|3 -> d, 4 -> e, 1 -> a, 2 -> b|>
    tex:
      in: \text{Prepend}[\text{Association}[1\to a,2\to b],\{3\to d,4\to e\}]
      out: \unicode{f113}3\to d,4\to e,1\to a,2\to b\unicode{f114}
prepend-front-of-list:
  epsil:
    in: Prepend([1, 2, 3], 0)
    out: "[0, 1, 2, 3]"
  tex:
    in: \mathrm{Prepend}(\bigl\lbrack1, 2, 3\bigr\rbrack, 0)
    out: \bigl\lbrack0, 1, 2, 3\bigr\rbrack
  fullform:
    in: Prepend[List[1, 2, 3], 0]
  wolfram:
    in: Prepend[List[1, 2, 3], 0]
prepend-single-element-list:
  epsil:
    in: Prepend([5], 10)
    out: "[10, 5]"
  tex:
    in: \mathrm{Prepend}(\bigl\lbrack5\bigr\rbrack, 10)
    out: \bigl\lbrack10, 5\bigr\rbrack
  fullform:
    in: Prepend[List[5], 10]
  wolfram:
    in: Prepend[List[5], 10]
prepend-empty-list:
  epsil:
    in: Prepend([], 42)
    out: "[42]"
  tex:
    in: \mathrm{Prepend}(\bigl\lbrack\bigr\rbrack, 42)
    out: \bigl\lbrack42\bigr\rbrack
  fullform:
    in: Prepend[List[], 42]
  wolfram:
    in: Prepend[List[], 42]
