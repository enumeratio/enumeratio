    in: |-
      EigenvectorCentrality(Graph([1, 2, 3, 4], [
                                                  UndirectedEdge(1, 2),
                                                  UndirectedEdge(2, 3),
                                                  UndirectedEdge(3, 4),
                                                ]))
    out: |-
      [
        0.190_983_005_625_053,
        0.309_016_994_374_947,
        0.309_016_994_374_947,
        0.190_983_005_625_053,
      ]
