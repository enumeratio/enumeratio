- id: count-kbracelets-4-3-21-bracelets-of-length-4
  expr: [Count, [KBracelets, 4, 3]]
  expected: 21
  category: Basic
  caption: "$Count(KBracelets(4, 3)) = 21$: bracelets of length 4 over a 3-letter alphabet"
- id: kbracelets-n-2-agrees-with-binarybracelets-n
  expr: [Equal, [Count, [KBracelets, 5, 2]], [Count, [BinaryBracelets, 5]]]
  expected: True
  category: Properties
  caption: $KBracelets(n, 2)$ agrees with [[BinaryBracelets]]$(n)$ — same Burnside sum over $D_n$
- role: test
  id: every-element-of-kbracelets-4-3
  expr: [Take, [KBracelets, 4, 3], 21]
  expected:
    [
      List,
      [List, 0, 0, 0, 0],
      [List, 0, 0, 0, 1],
      [List, 0, 0, 0, 2],
      [List, 0, 0, 1, 1],
      [List, 0, 0, 1, 2],
      [List, 0, 0, 2, 2],
      [List, 0, 1, 0, 1],
      [List, 0, 1, 0, 2],
      [List, 0, 1, 1, 1],
      [List, 0, 1, 1, 2],
      [List, 0, 1, 2, 1],
      [List, 0, 1, 2, 2],
      [List, 0, 2, 0, 2],
      [List, 0, 2, 1, 2],
      [List, 0, 2, 2, 2],
      [List, 1, 1, 1, 1],
      [List, 1, 1, 1, 2],
      [List, 1, 1, 2, 2],
      [List, 1, 2, 1, 2],
      [List, 1, 2, 2, 2],
      [List, 2, 2, 2, 2],
    ]
