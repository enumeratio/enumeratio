count-list-1-2-2-3-2-2:
  epsil:
    in: Count([1, 2, 2, 3, 2], 2)
    out: "3"
  tex:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 2\bigr\rbrack, 2)
    out: "3"
  fullform:
    in: Count[List[1, 2, 2, 3, 2], 2]
  wolfram:
    in: Count[List[1, 2, 2, 3, 2], 2]
    out: "3"
    tex:
      in: \text{Count}[\{1,2,2,3,2\},2]
      out: "3"
count-list-1-2-2-3-2-4-2:
  epsil:
    in: Count([1, 2, 2, 3, 2, 4], 2)
    out: "3"
  tex:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 2, 4\bigr\rbrack, 2)
    out: "3"
  fullform:
    in: Count[List[1, 2, 2, 3, 2, 4], 2]
  wolfram:
    in: Count[List[1, 2, 2, 3, 2, 4], 2]
    out: "3"
    tex:
      in: \text{Count}[\{1,2,2,3,2,4\},2]
      out: "3"
a-value-absent-from-the-collection-counts-as-0:
  epsil:
    in: Count([1, 2, 3], 9)
    out: "0"
  tex:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 3\bigr\rbrack, 9)
    out: "0"
  fullform:
    in: Count[List[1, 2, 3], 9]
  wolfram:
    in: Count[List[1, 2, 3], 9]
    out: "0"
    tex:
      in: \text{Count}[\{1,2,3\},9]
      out: "0"
count-tests-exact-equality-a-typed-pattern-like:
  epsil:
    in: Count([1, a, 2, b], _Integer)
    out: "0"
  tex:
    in: \mathrm{Count}(\bigl\lbrack1, a, 2, b\bigr\rbrack, \operatorname{\_Integer})
    out: "0"
  fullform:
    in: Count[List[1, a, 2, b], _Integer]
  wolfram:
    in:
    note: Wolfram's `_Integer` pattern counts every integer element, here 2 (1 and 2).
count-list-a-b-a-a-b-c-b-b:
  epsil:
    in: Count([a, b, a, a, b, c, b], b)
    out: "3"
  tex:
    in: \mathrm{Count}(\bigl\lbrack a, b, a, a, b, c, b\bigr\rbrack, b)
    out: "3"
  fullform:
    in: Count[List[a, b, a, a, b, c, b], b]
the-value-can-itself-be-a-list:
  epsil:
    in: Count([[1, 2], [1, 2], 3], [1, 2])
    out: "2"
  tex:
    in: \mathrm{Count}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack1, 2\bigr\rbrack, 3\bigr\rbrack, \bigl\lbrack1, 2\bigr\rbrack)
    out: "2"
  fullform:
    in: Count[List[List[1, 2], List[1, 2], 3], List[1, 2]]
  wolfram:
    in: Count[List[List[1, 2], List[1, 2], 3], List[1, 2]]
a-predicate-counts-the-elements-satisfying-it:
  epsil:
    in: Count([1, 2, 3, 4], Function(_1 > 2))
    out: "2"
  tex:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 3, 4\bigr\rbrack, ()\mapsto\operatorname{\_1}\gt2)
    out: "2"
  fullform:
    in: Count[List[1, 2, 3, 4], Function[Greater[Slot[1], 2]]]
  wolfram:
    in: Count[List[1, 2, 3, 4], Function[Greater[Slot[1], 2]]]
only-top-level-elements-are-compared-by-default:
  epsil:
    in: Count([[a, a, b], b, [a, b, a]], b)
    out: "1"
  tex:
    in: \mathrm{Count}(\bigl\lbrack\bigl\lbrack a, a, b\bigr\rbrack, b, \bigl\lbrack a, b, a\bigr\rbrack\bigr\rbrack, b)
    out: "1"
  fullform:
    in: Count[List[List[a, a, b], b, List[a, b, a]], b]
a-bare-level-spec-counts-matches-down-through:
  epsil:
    in: Count([[a, a, b], b, [a, b, a]], b, 2)
    out: "3"
  tex:
    in: \mathrm{Count}(\bigl\lbrack\bigl\lbrack a, a, b\bigr\rbrack, b, \bigl\lbrack a, b, a\bigr\rbrack\bigr\rbrack, b, 2)
    out: "3"
  fullform:
    in: Count[List[List[a, a, b], b, List[a, b, a]], b, 2]
2-counts-matches-at-level-2-only:
  epsil:
    in: Count([[a, a, b], b, [a, b, a]], b, [2])
    out: "2"
  tex:
    in: \mathrm{Count}(\bigl\lbrack\bigl\lbrack a, a, b\bigr\rbrack, b, \bigl\lbrack a, b, a\bigr\rbrack\bigr\rbrack, b, \bigl\lbrack2\bigr\rbrack)
    out: "2"
  fullform:
    in: Count[List[List[a, a, b], b, List[a, b, a]], b, List[2]]
count-tests-exact-equality-so-a-pattern-like:
  epsil:
    in: Count([a, 2, a, a, 1, c, b, 3, 3], _Integer)
    out: "0"
  tex:
    in: \mathrm{Count}(\bigl\lbrack a, 2, a, a, 1, c, b, 3, 3\bigr\rbrack, \operatorname{\_Integer})
    out: "0"
  fullform:
    in: Count[List[a, 2, a, a, 1, c, b, 3, 3], _Integer]
  wolfram:
    in:
    note: Wolfram's `_Integer` pattern counts every integer element, here 4 (2, 1, 3, 3).
the-counts-of-the-distinct-values-add-up-to-the:
  epsil:
    in: |-
      Count([1, 2, 2, 3, 3, 3], 1) + Count([1, 2, 2, 3, 3, 3], 2) + Count([
                                                                            1,
                                                                            2,
                                                                            2,
                                                                            3,
                                                                            3,
                                                                            3,
                                                                          ], 3) ==
      Length([1, 2, 2, 3, 3, 3])
    out: True
  tex:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack, 1)+\mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack, 2)+\mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack, 3)=\mathrm{Length}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack)
    out: \top
  traditional:
    in: \mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack, 1)+\mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack, 2)+\mathrm{Count}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack, 3)=\mathrm{Length}(\bigl\lbrack1, 2, 2, 3, 3, 3\bigr\rbrack)
    out: \mathrm{True}
  fullform:
    in: Equal[Plus[Count[List[1, 2, 2, 3, 3, 3], 1], Count[List[1, 2, 2, 3, 3, 3], 2], Count[List[1, 2, 2, 3, 3, 3], 3]], Length[List[1, 2, 2, 3, 3, 3]]]
  wolfram:
    in: (Plus[Count[List[1, 2, 2, 3, 3, 3], 1], Count[List[1, 2, 2, 3, 3, 3], 2], Count[List[1, 2, 2, 3, 3, 3], 3]] == Length[List[1, 2, 2, 3, 3, 3]])
