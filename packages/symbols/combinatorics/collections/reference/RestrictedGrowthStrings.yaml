name: RestrictedGrowthStrings
domain: Collections
signature: RestrictedGrowthStrings(n)
summary: 'The restricted-growth strings of length $n$: words $w$ with $w_0 = 0$ and $w_i \le 1 + \max(w_0, …, w_{i-1})$.'
signatures:
  - call: RestrictedGrowthStrings(n)
    description: 'the restricted-growth strings of length $n$: words $w$ with $w_0 = 0$ and $w_i \le 1 + \max(w_0, …, w_{i-1})$'
    library: enumeratio-collections
details:
  - Count is the Bell number $B_n$ (A000110); the canonical RGS encoding of a set partition of $\{1, …, n\}$ used by [[SetPartitions]].
seeAlso:
  - SetPartitions
references:
  - system: oeis
    identity: A000110
catalog:
  - system: oeis
    identity: A000110
    url: https://oeis.org/A000110
  - system: sage
    identity: SetPartitions(n)
    url: https://doc.sagemath.org/html/en/reference/combinat/sage/combinat/set_partition.html
    note: word (RGS) encoding, not sage's block-list representation
grades:
  - name: n
    role: axis
carrier: SetPartition
