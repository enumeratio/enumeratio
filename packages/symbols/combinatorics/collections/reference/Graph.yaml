name: Graph
domain: Collections
signature: Graph(vertices, edges)
summary: A graph, as an explicit vertex list and edge list ([[UndirectedEdge]]/[[DirectedEdge]]) — the data every graph query in this library reads.
signatures:
  - call: Graph(edges)
    description: the vertex set is inferred from the edges' endpoints, in first-appearance order.
    library: enumeratio-collections
  - call: Graph(vertices, edges)
    description: an explicit vertex list, so an isolated vertex (mentioned by no edge) can be included.
    library: enumeratio-collections
details:
  - Inert — `Graph(...)` holds exactly as written; it never reduces to anything else. Every query head ([[VertexList]], [[EdgeList]], [[VertexCount]], …) reads it directly.
  - "Vertex order follows Wolfram's own convention — first appearance: the declared vertex list (if given), then each edge's endpoints, in order."
  - A vertex may be any expression (an integer, a symbol, a string, …); two vertices are the same exactly when their canonical (MathJSON) forms are identical.
  - No drawing. Rendering a `Graph` (vertex placement, an SVG/canvas element) is not implemented — see the graphs.ts module comment for what that would need.
examples:
  - id: a-triangle-vertices-inferred
    expr: [Graph, [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 2, 3], [UndirectedEdge, 3, 1]]]
    expected:
      [Graph, [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 2, 3], [UndirectedEdge, 3, 1]]]
    caption: A triangle, vertices inferred from the edges
  - id: an-isolated-vertex-needs-the-explicit-form
    expr: [VertexList, [Graph, [List, 1, 2, 3], [List, [UndirectedEdge, 1, 2]]]]
    expected: [List, 1, 2, 3]
    caption: An isolated vertex needs the explicit two-argument form
seeAlso:
  - UndirectedEdge
  - DirectedEdge
  - VertexList
  - EdgeList
