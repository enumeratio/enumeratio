name: Subgraph
domain: Collections
signature: Subgraph(g, vertices)
summary: The induced subgraph of g on the given vertices.
signatures:
  - call: Subgraph(g, vertices)
    description: those vertices (in $g$'s order), and every edge of $g$ with both endpoints among them.
