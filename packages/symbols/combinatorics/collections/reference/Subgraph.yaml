name: Subgraph
domain: Collections
signature: Subgraph(g, vertices)
summary: The induced subgraph of g on the given vertices.
signatures:
  - call: Subgraph(g, vertices)
    description: those vertices (in $g$'s order), and every edge of $g$ with both endpoints among them.
    library: enumeratio-collections
examples:
  - id: three-of-k4s-vertices
    expr: [Subgraph, [CompleteGraph, 4], [List, 1, 2, 3]]
    expected:
      [
        Graph,
        [List, 1, 2, 3],
        [List, [UndirectedEdge, 1, 2], [UndirectedEdge, 1, 3], [UndirectedEdge, 2, 3]],
      ]
    caption: The induced subgraph on 3 of $K_4$'s vertices is $K_3$
seeAlso:
  - NeighborhoodGraph
  - Graph
