    out: \infty
  fullform:
    in: Precision[Rational[1, 3]]
  wolfram:
    in: Precision[Rational[1, 3]]
precision-inexact-literal:
  epsil:
    in: Precision(2.5)
    out: "2"
  tex:
    in: \mathrm{Precision}(2.5)
    out: "2"
  fullform:
    in: Precision[2.5]
  wolfram:
    in: Precision[2.5]
precision-extended:
  epsil:
    in: Precision(3.141_592_653_589_793)
    out: "16"
  tex:
    in: \mathrm{Precision}(3.141\,592\,653\,589\,793)
    out: "16"
