    in: Precision(2)
    out: PositiveInfinity
  tex:
    in: \mathrm{Precision}(2)
    out: \infty
  fullform:
    in: Precision[2]
  wolfram:
    in: Precision[2]
precision-rational:
  epsil:
    in: Precision(1 / 3)
    out: PositiveInfinity
