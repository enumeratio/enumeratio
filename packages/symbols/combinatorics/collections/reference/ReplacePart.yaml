name: ReplacePart
domain: Collections
signature: ReplacePart(expr, i -> new)
summary: expr with the operand at position i replaced by new — Wolfram 1-based positions, negative counting from the end.
signatures:
  - call: ReplacePart(expr, i -> new)
    description: expr with its ith operand replaced (1-based; i < 0 counts from the end)
    library: enumeratio-collections
  - call: ReplacePart(expr, {i, j, …} -> new)
    description: like the scalar form, drilling into nested operands along the given path
    library: enumeratio-collections
  - call: ReplacePart(expr, {rule1, rule2, …})
    description: applies every rule, each position resolved against the RESULT of the earlier ones
    library: enumeratio-collections
examples:
  - id: replaces-a-single-1-based-position
    expr: [ReplacePart, [List, a, b, c], [Rule, 2, z]]
    expected: [List, a, z, c]
  - id: with-a-negative-position-counts-from-the-end
    expr: [ReplacePart, [List, a, b, c], [Rule, -1, z]]
    expected: [List, a, b, z]
    category: Scope
  - id: applies-a-list-of-rules
    expr: [ReplacePart, [List, a, b, c], [List, [Rule, 1, x], [Rule, 3, y]]]
    expected: [List, x, b, y]
    category: Scope
  - id: with-a-nested-i-j-position-drills-into-a-sublist
    expr: [ReplacePart, [List, [List, a, b], c], [Rule, [List, 1, 2], z]]
    expected: [List, [List, a, z], c]
    category: Scope
seeAlso:
  - Replace
  - Level
