equal-over-lists:
  epsil:
    in: Thread([1, 2, 3] == [1, 5, 3])
    out: "[1 == 1, 2 == 5, 3 == 3]"
  tex:
    in: \mathrm{Thread}(\bigl\lbrack1, 2, 3\bigr\rbrack=\bigl\lbrack1, 5, 3\bigr\rbrack)
    out: \begin{cases}1=1\\2=5\\3=3\end{cases}
  fullform:
    in: Thread[Equal[List[1, 2, 3], List[1, 5, 3]]]
  wolfram:
    in: Thread[(List[1, 2, 3] == List[1, 5, 3])]
scalar-broadcast:
  epsil:
    in: Thread([1, 2, 3] == 1)
    out: "[1 == 1, 2 == 1, 3 == 1]"
  tex:
    in: \mathrm{Thread}(\bigl\lbrack1, 2, 3\bigr\rbrack=1)
    out: \begin{cases}1=1\\2=1\\3=1\end{cases}
  fullform:
    in: Thread[Equal[List[1, 2, 3], 1]]
  wolfram:
    in: Thread[(List[1, 2, 3] == 1)]
custom-head:
  epsil:
    in: Thread(f(g(1, 2), g(3, 4)), g)
    out: g(f(1, 3), f(2, 4))
  tex:
    in: \mathrm{Thread}(f(g(1, 2), g(3, 4)), g)
    out: g(f(1, 3), f(2, 4))
  fullform:
    in: Thread[f[g[1, 2], g[3, 4]], g]
  wolfram:
    in: Thread[f[g[1, 2], g[3, 4]], g]
    out: True
    tex:
      in: \text{Module}\left[\{d=\text{Quiet}[\text{TimeConstrained}[\text{FullSimplify}[\text{Thread}[f(g(1,2),g(3,4)),g]-g(f(1,3),f(2,4))],10,\text{$\$$Aborted}]]\},\text{If}\left[d\text{===}0,\text{True},\text{Module}\left[\left\{s=\left\{\text{Chop}\left[N\left[\text{Thread}\left[f(g(1,2),g(3,4)),-\frac{11}{5}\right]-g(f(1,3),f(2,4))\right]\right],\text{Chop}\left[N\left[\text{Thread}\left[f(g(1,2),g(3,4)),-\frac{17}{6}\right]-g(f(1,3),f(2,4))\right]\right],\text{Chop}\left[N\left[\text{Thread}\left[f(g(1,2),g(3,4)),-\frac{23}{9}\right]-g(f(1,3),f(2,4))\right]\right]\right\}\right\},\text{If}[\text{AllTrue}[s,\text{NumericQ}],\text{AllTrue}[s,\text{$\#$1}=0\&],\text{Indeterminate}]\right]\right]\right]
      out: \text{True}
