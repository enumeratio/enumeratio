equal-over-lists:
  epsil:
    in: Thread([1, 2, 3] == [1, 5, 3])
    out: "[1 == 1, 2 == 5, 3 == 3]"
  tex:
    in: \mathrm{Thread}(\bigl\lbrack1, 2, 3\bigr\rbrack=\bigl\lbrack1, 5, 3\bigr\rbrack)
    out: \begin{cases}1=1\\2=5\\3=3\end{cases}
  fullform:
    in: Thread[Equal[List[1, 2, 3], List[1, 5, 3]]]
  wolfram:
    in: Thread[(List[1, 2, 3] == List[1, 5, 3])]
scalar-broadcast:
  epsil:
    in: Thread([1, 2, 3] == 1)
    out: "[1 == 1, 2 == 1, 3 == 1]"
  tex:
    in: \mathrm{Thread}(\bigl\lbrack1, 2, 3\bigr\rbrack=1)
    out: \begin{cases}1=1\\2=1\\3=1\end{cases}
  fullform:
    in: Thread[Equal[List[1, 2, 3], 1]]
  wolfram:
    in: Thread[(List[1, 2, 3] == 1)]
custom-head:
  epsil:
    in: Thread(f(g(1, 2), g(3, 4)), g)
    out: g(f(1, 3), f(2, 4))
  tex:
    in: \mathrm{Thread}(f(g(1, 2), g(3, 4)), g)
    out: g(f(1, 3), f(2, 4))
  fullform:
    in: Thread[f[g[1, 2], g[3, 4]], g]
