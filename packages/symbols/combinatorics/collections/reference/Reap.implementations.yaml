collect-everything-sown:
  epsil:
    in: Reap(Last([Sow(1), Sow(2), 3]))
    out: "[3, [[1, 2]]]"
  tex:
    in: \mathrm{Reap}(\mathrm{Last}(\bigl\lbrack\mathrm{Sow}(1), \mathrm{Sow}(2), 3\bigr\rbrack))
    out: \bigl\lbrack3, \bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack\bigr\rbrack\bigr\rbrack
  fullform:
    in: Reap[Last[List[Sow[1], Sow[2], 3]]]
  wolfram:
    in: Reap[Last[List[Sow[1], Sow[2], 3]]]
nothing-sown-gives-an-empty-group-list:
  epsil:
    in: Reap(5)
    out: "[5, []]"
  tex:
    in: \mathrm{Reap}(5)
    out: \bigl\lbrack5, \bigl\lbrack \bigr\rbrack\bigr\rbrack
  fullform:
    in: Reap[5]
  wolfram:
    in: Reap[5]
reap-only-a-matching-tag:
  epsil:
    in: Reap(Last([Sow(1, a), Sow(2, b), Sow(3, a), 0]), a)
    out: "[0, [[1, 3]]]"
  tex:
    in: \mathrm{Reap}(\mathrm{Last}(\bigl\lbrack\mathrm{Sow}(1, a), \mathrm{Sow}(2, b), \mathrm{Sow}(3, a), 0\bigr\rbrack), a)
    out: \bigl\lbrack0, \bigl\lbrack\bigl\lbrack1, 3\bigr\rbrack\bigr\rbrack\bigr\rbrack
  fullform:
    in: Reap[Last[List[Sow[1, a], Sow[2, b], Sow[3, a], 0]], a]
