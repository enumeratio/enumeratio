- id: collect-everything-sown
  expr: [Reap, [Last, [List, [Sow, 1], [Sow, 2], 3]]]
  expected: [List, 3, [List, [List, 1, 2]]]
  caption: collect everything sown, untagged sows sharing one group
- id: nothing-sown-gives-an-empty-group-list
  expr: [Reap, 5]
  expected: [List, 5, [List]]
  caption: nothing sown gives an empty group list
- id: reap-only-a-matching-tag
  expr: [Reap, [Last, [List, [Sow, 1, a], [Sow, 2, b], [Sow, 3, a], 0]], a]
  expected: [List, 0, [List, [List, 1, 3]]]
  caption: Reap(expr, tag) collects only the matching tag's group
  category: Scope
