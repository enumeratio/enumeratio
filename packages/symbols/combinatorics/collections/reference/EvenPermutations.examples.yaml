- id: count-evenpermutations-4
  expr: [Count, [EvenPermutations, 4]]
  expected: 12
  category: Basic
  caption: $Count(EvenPermutations(4)) = 12$
- id: first-element-of-evenpermutations-4
  expr: [At, [EvenPermutations, 4], 1]
  expected: [List, 1, 2, 3, 4]
  category: Basic
  caption: The first element in enumeration order
- id: every-element-of-evenpermutations-4
  role: test
  expr: [Take, [EvenPermutations, 4], 12]
  expected:
    [
      List,
      [List, 1, 2, 3, 4],
      [List, 1, 3, 4, 2],
      [List, 1, 4, 2, 3],
      [List, 2, 1, 4, 3],
      [List, 2, 3, 1, 4],
      [List, 2, 4, 3, 1],
      [List, 3, 1, 2, 4],
      [List, 3, 2, 4, 1],
      [List, 3, 4, 1, 2],
      [List, 4, 1, 3, 2],
      [List, 4, 2, 1, 3],
      [List, 4, 3, 2, 1],
    ]
