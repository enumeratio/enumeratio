petersen-is-3-regular:
  epsil:
    in: VertexDegree(PetersenGraph())
    out: "[3, 3, 3, 3, 3, 3, 3, 3, 3, 3]"
  tex:
    in: \mathrm{VertexDegree}(\mathrm{PetersenGraph}())
    out: \bigl\lbrack3, 3, 3, 3, 3, 3, 3, 3, 3, 3\bigr\rbrack
  fullform:
    in: VertexDegree[PetersenGraph[]]
  wolfram:
    in: VertexDegree[PetersenGraph[]]
petersen-is-not-bipartite:
  epsil:
    in: IsBipartiteGraph(PetersenGraph())
    out: False
  tex:
    in: \mathrm{IsBipartiteGraph}(\mathrm{PetersenGraph}())
    out: \bot
  traditional:
    in: \mathrm{IsBipartiteGraph}(\mathrm{PetersenGraph}())
    out: \mathrm{False}
  fullform:
    in: BipartiteGraphQ[PetersenGraph[]]
  wolfram:
    in: BipartiteGraphQ[PetersenGraph[]]
petersen-has-10-vertices:
  epsil:
    in: VertexCount(PetersenGraph())
    out: "10"
  tex:
    in: \mathrm{VertexCount}(\mathrm{PetersenGraph}())
    out: "10"
  fullform:
    in: VertexCount[PetersenGraph[]]
  wolfram:
    in: VertexCount[PetersenGraph[]]
petersen-has-15-edges:
  epsil:
    in: EdgeCount(PetersenGraph())
    out: "15"
  tex:
    in: \mathrm{EdgeCount}(\mathrm{PetersenGraph}())
    out: "15"
  fullform:
    in: EdgeCount[PetersenGraph[]]
  wolfram:
    in: EdgeCount[PetersenGraph[]]
