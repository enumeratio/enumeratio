pairs-each-element-with-its-1-based-index:
  epsil:
    in: MapIndexed(f, [a, b, c])
    out: "[f(a, [1]), f(b, [2]), f(c, [3])]"
  tex:
    in: \mathrm{MapIndexed}(f, \bigl\lbrack a, b, c\bigr\rbrack)
    out: \bigl\lbrack f(a, \bigl\lbrack1\bigr\rbrack), f(b, \bigl\lbrack2\bigr\rbrack), f(c, \bigl\lbrack3\bigr\rbrack)\bigr\rbrack
  fullform:
    in: MapIndexed[f, List[a, b, c]]
