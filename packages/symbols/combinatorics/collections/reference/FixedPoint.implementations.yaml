the-dottie-number-the-fixed-point-of-cos:
  wolfram:
    in: FixedPoint[Cos, 0.5]
    note: Wolfram iterates at machine (double) precision and reports 0.7390851332151607; this engine's default precision is 21 digits, and the two agree through the first 15 digits, diverging only in Wolfram's own machine-precision rounding beyond that.
newton-s-method-for-sqrt-2-run-to-this-engine-s:
  wolfram:
    in: FixedPoint[Function[Divide[Plus[Slot[1], Divide[2, Slot[1]]], 2]], 1.5]
    note: "Same precision difference as the Cos example above: Wolfram's machine-precision fixed point is 1.4142135623730951, agreeing with this one through the first 15 digits."
