join-list-1-2-list-3-4:
  epsil:
    in: Join([1, 2], [3, 4])
    out: "[1, 2, 3, 4]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack)
    out: \bigl\lbrack1, 2, 3, 4\bigr\rbrack
  fullform:
    in: Join[List[1, 2], List[3, 4]]
  wolfram:
    in: Join[List[1, 2], List[3, 4]]
    out: "{1, 2, 3, 4}"
    tex:
      in: \text{Join}[\{1,2\},\{3,4\}]
      out: \{1,2,3,4\}
join-list-1-2-list-3-4-list-5:
  epsil:
    in: Join([1, 2], [3, 4], [5])
    out: "[1, 2, 3, 4, 5]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack, \bigl\lbrack5\bigr\rbrack)
    out: \bigl\lbrack1, 2, 3, 4, 5\bigr\rbrack
  fullform:
    in: Join[List[1, 2], List[3, 4], List[5]]
  wolfram:
    in: Join[List[1, 2], List[3, 4], List[5]]
    out: "{1, 2, 3, 4, 5}"
    tex:
      in: \text{Join}[\{1,2\},\{3,4\},\{5\}]
      out: \{1,2,3,4,5\}
join-a-b-flatten-a-b-1-see-flatten:
  epsil:
    in: Join([1, 2], [3, 4]) == Flatten([[1, 2], [3, 4]], 1)
    out: True
  tex:
    in: \mathrm{Join}(\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack)=\mathrm{Flatten}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, 1)
    out: \top
  traditional:
    in: \mathrm{Join}(\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack)=\mathrm{Flatten}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, 1)
    out: \mathrm{True}
  fullform:
    in: Equal[Join[List[1, 2], List[3, 4]], Flatten[List[List[1, 2], List[3, 4]], 1]]
  wolfram:
    in: (Join[List[1, 2], List[3, 4]] == Flatten[List[List[1, 2], List[3, 4]], 1])
    out: True
    tex:
      in: \text{Join}[\{1,2\},\{3,4\}]=\text{Flatten}\left[\left( \begin{array}{cc}  1 & 2 \\  3 & 4 \\ \end{array} \right),1\right]
      out: \text{True}
a-trailing-integer-argument-joins-at-that-level:
  epsil:
    in: Join([[1, 2], [3, 4]], [[5, 6], [7, 8]], 2)
    out: "[[1, 2, 5, 6], [3, 4, 7, 8]]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack5, 6\bigr\rbrack, \bigl\lbrack7, 8\bigr\rbrack\bigr\rbrack, 2)
    out: \bigl\lbrack\bigl\lbrack1, 2, 5, 6\bigr\rbrack, \bigl\lbrack3, 4, 7, 8\bigr\rbrack\bigr\rbrack
  fullform:
    in: Join[List[List[1, 2], List[3, 4]], List[List[5, 6], List[7, 8]], 2]
  wolfram:
    in: Join[List[List[1, 2], List[3, 4]], List[List[5, 6], List[7, 8]], 2]
join-list-a-b-c-list-x-y-list-u-v-w:
  epsil:
    in: Join([a, b, c], [x, y], [u, v, w])
    out: "[a, b, c, x, y, u, v, w]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack a, b, c\bigr\rbrack, \bigl\lbrack x, y\bigr\rbrack, \bigl\lbrack u, v, w\bigr\rbrack)
    out: \bigl\lbrack a, b, c, x, y, u, v, w\bigr\rbrack
  fullform:
    in: Join[List[a, b, c], List[x, y], List[u, v, w]]
joining-matrices-stacks-their-rows:
  epsil:
    in: Join([[a, b], [c, d]], [[1, 2], [3, 4]])
    out: "[[a, b], [c, d], [1, 2], [3, 4]]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack\bigl\lbrack a, b\bigr\rbrack, \bigl\lbrack c, d\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack)
    out: \bigl\lbrack\bigl\lbrack a, b\bigr\rbrack, \bigl\lbrack c, d\bigr\rbrack, \bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack
  fullform:
    in: Join[List[List[a, b], List[c, d]], List[List[1, 2], List[3, 4]]]
sets-as-well-as-lists-as-long-as-all-arguments:
  epsil:
    in: Join({1, 2}, {3})
    out: "{1, 2, 3}"
  tex:
    in: \mathrm{Join}(\lbrace1, 2\rbrace, \lbrace3\rbrace)
    out: \lbrace1, 2, 3\rbrace
  fullform:
    in: Join[Union[List[1, 2]], Union[List[3]]]
    back: [Join, [Union, [List, 1, 2]], [Union, [List, 3]]]
  wolfram:
    in: Join[Union[List[1, 2]], Union[List[3]]]
a-lazy-range-is-spliced-in:
  epsil:
    in: Join([1, 2], Range(3, 5))
    out: "[1, 2, 3, 4, 5]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack1, 2\bigr\rbrack, 3..5)
    out: \bigl\lbrack1, 2, 3, 4, 5\bigr\rbrack
  fullform:
    in: Join[List[1, 2], Range[3, 5]]
  wolfram:
    in: Join[List[1, 2], Range[3, 5]]
with-no-arguments-the-empty-list:
  epsil:
    in: Join()
    out: "[]"
  tex:
    in: \mathrm{Join}()
    out: \bigl\lbrack \bigr\rbrack
  fullform:
    in: Join[]
  wolfram:
    in: Join[]
at-level-2-matrices-are-joined-side-by-side:
  epsil:
    in: Join([[a, b], [c, d]], [[1, 2], [3, 4]], 2)
    out: "[[a, b, 1, 2], [c, d, 3, 4]]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack\bigl\lbrack a, b\bigr\rbrack, \bigl\lbrack c, d\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, 2)
    out: \bigl\lbrack\bigl\lbrack a, b, 1, 2\bigr\rbrack, \bigl\lbrack c, d, 3, 4\bigr\rbrack\bigr\rbrack
  fullform:
    in: Join[List[List[a, b], List[c, d]], List[List[1, 2], List[3, 4]], 2]
ragged-rows-join-at-level-2-too:
  epsil:
    in: Join([[1], [5, 6]], [[2, 3], [7]], [[4], [8]], 2)
    out: "[[1, 2, 3, 4], [5, 6, 7, 8]]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack\bigl\lbrack1\bigr\rbrack, \bigl\lbrack5, 6\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack2, 3\bigr\rbrack, \bigl\lbrack7\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack4\bigr\rbrack, \bigl\lbrack8\bigr\rbrack\bigr\rbrack, 2)
    out: \bigl\lbrack\bigl\lbrack1, 2, 3, 4\bigr\rbrack, \bigl\lbrack5, 6, 7, 8\bigr\rbrack\bigr\rbrack
  fullform:
    in: Join[List[List[1], List[5, 6]], List[List[2, 3], List[7]], List[List[4], List[8]], 2]
  wolfram:
    in: Join[List[List[1], List[5, 6]], List[List[2, 3], List[7]], List[List[4], List[8]], 2]
a-row-missing-from-the-shorter-array-simply-isn:
  epsil:
    in: Join([[x]], [[1, 2], [3, 4]], 2)
    out: "[[x, 1, 2], [3, 4]]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack\bigl\lbrack x\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, 2)
    out: \bigl\lbrack\bigl\lbrack x, 1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack
  fullform:
    in: Join[List[List[x]], List[List[1, 2], List[3, 4]], 2]
any-head-as-long-as-all-the-arguments-share-it:
  epsil:
    in: Join(f(a), f(b))
    out: f(a, b)
  tex:
    in: \mathrm{Join}(f(a), f(b))
    out: f(a, b)
  fullform:
    in: Join[f[a], f[b]]
join-is-associative:
  epsil:
    in: |-
      Join(Join([a, b, c], [x, y]), [u, v, w]) == Join(
                                                        [a, b, c],
                                                        Join([x, y], [u, v, w]),
                                                      )
    out: True
  tex:
    in: \mathrm{Join}(\mathrm{Join}(\bigl\lbrack a, b, c\bigr\rbrack, \bigl\lbrack x, y\bigr\rbrack), \bigl\lbrack u, v, w\bigr\rbrack)=\mathrm{Join}(\bigl\lbrack a, b, c\bigr\rbrack, \mathrm{Join}(\bigl\lbrack x, y\bigr\rbrack, \bigl\lbrack u, v, w\bigr\rbrack))
    out: \top
  traditional:
    in: \mathrm{Join}(\mathrm{Join}(\bigl\lbrack a, b, c\bigr\rbrack, \bigl\lbrack x, y\bigr\rbrack), \bigl\lbrack u, v, w\bigr\rbrack)=\mathrm{Join}(\bigl\lbrack a, b, c\bigr\rbrack, \mathrm{Join}(\bigl\lbrack x, y\bigr\rbrack, \bigl\lbrack u, v, w\bigr\rbrack))
    out: \mathrm{True}
  fullform:
    in: Equal[Join[Join[List[a, b, c], List[x, y]], List[u, v, w]], Join[List[a, b, c], Join[List[x, y], List[u, v, w]]]]
join-tolerates-shorter-array-second:
  epsil:
    in: Join([[1, 2], [3, 4]], [[x]], 2)
    out: "[[1, 2, x], [3, 4]]"
  tex:
    in: \mathrm{Join}(\bigl\lbrack\bigl\lbrack1, 2\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack, \bigl\lbrack\bigl\lbrack x\bigr\rbrack\bigr\rbrack, 2)
    out: \bigl\lbrack\bigl\lbrack1, 2, x\bigr\rbrack, \bigl\lbrack3, 4\bigr\rbrack\bigr\rbrack
  fullform:
    in: Join[List[List[1, 2], List[3, 4]], List[List[x]], 2]
join-splices-any-shared-head:
  epsil:
    in: Join(f(a), f(b), f(c))
    out: f(a, b, c)
  tex:
    in: \mathrm{Join}(f(a), f(b), f(c))
    out: f(a, b, c)
  fullform:
    in: Join[f[a], f[b], f[c]]
join-associations-first-seen-order:
  epsil:
    in: Join(Association(Rule(a, b)), Association(Rule(c, d), Rule(a, f)))
    out: Association(Rule(a, f), Rule(c, d))
  tex:
    in: \mathrm{Join}(\mathrm{Association}(\mathrm{Rule}(a, b)), \mathrm{Association}(\mathrm{Rule}(c, d), \mathrm{Rule}(a, f)))
    out: \mathrm{Association}(\mathrm{Rule}(a, f), \mathrm{Rule}(c, d))
  fullform:
    in: Join[Association[Rule[a, b]], Association[Rule[c, d], Rule[a, f]]]
