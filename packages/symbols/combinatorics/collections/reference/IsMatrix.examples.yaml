- id: a-2x2-is-a-matrix
  expr: [IsMatrix, [List, [List, 1, 2], [List, 3, 4]]]
  expected: True
- id: a-flat-list-is-not-a-matrix
  expr: [IsMatrix, [List, 1, 2, 3]]
  expected: False
  category: Scope
- id: a-ragged-list-of-lists-is-not-a-matrix
  expr: [IsMatrix, [List, [List, 1, 2], [List, 3]]]
  expected: False
  category: Scope
- id: an-empty-list-is-not-a-matrix
  expr: [IsMatrix, [List]]
  expected: False
  category: Scope
- id: a-test-function-must-hold-of-every-entry
  expr: [IsMatrix, [List, [List, 2, 4], [List, 6, 8]], IsEven]
  expected: True
  category: Scope
