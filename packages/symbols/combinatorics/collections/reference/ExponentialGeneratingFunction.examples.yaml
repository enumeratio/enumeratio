- id: factorial
  expr: [ExponentialGeneratingFunction, [Factorial, n], n, x]
  expected: [Divide, 1, [Add, [Negate, x], 1]]
  caption: $1/(1-x)$
- id: derangements
  expr: [ExponentialGeneratingFunction, [Subfactorial, n], n, x]
  expected: [Divide, [Power, ExponentialE, [Negate, x]], [Add, [Negate, x], 1]]
  caption: $e^{-x}/(1-x)$
- id: bell-numbers
  expr: [ExponentialGeneratingFunction, [BellNumber, n], n, x]
  expected: [Power, ExponentialE, [Add, [Power, ExponentialE, x], -1]]
  caption: $e^{e^x-1}$ -- the exponential formula for set partitions
- id: fibonacci
  expr: [ExponentialGeneratingFunction, [Fibonacci, n], n, x]
  expected:
    [
      Add,
      [
        Multiply,
        [Negate, [Divide, [Sqrt, 5], 5]],
        [Power, ExponentialE, [Multiply, [Rational, 1, 2], x, [Add, 1, [Negate, [Sqrt, 5]]]]],
      ],
      [Multiply, [Divide, [Sqrt, 5], 5], [Power, ExponentialE, [Multiply, [Rational, 1, 2], x, [Add, 1, [Sqrt, 5]]]]],
    ]
  caption: Binet's formula, exponentiated -- built from the order-2 recurrence's own roots $(1\pm\sqrt5)/2$
