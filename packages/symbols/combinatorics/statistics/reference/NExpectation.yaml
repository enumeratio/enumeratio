name: NExpectation
domain: Statistics
signature: NExpectation(f, x \[Distributed] dist)
summary: A numeric-only $E[f(x)]$ — falls back to summation/quadrature where `Expectation` stays symbolic.
signatures:
  - call: NExpectation(f, Distributed(x, dist))
    description: tries the exact Expectation first; otherwise sums (discrete) or integrates (continuous) numerically. Always returns a machine float.
    library: enumeratio-statistics
details:
  - "Tries `Expectation(f, Distributed(x, dist))` first — a real (exact) answer whenever it resolves, just converted to a float. Only falls back to a numeric approximation past `Expectation`'s own reach: `f` past a linear/quadratic polynomial in `x`, or a distribution `Expectation` has no closed form for at all."
  - "Discrete, finite support (e.g. [[BinomialDistribution]]): an exact finite sum, converted to a float."
  - "Discrete, infinite support (e.g. [[PoissonDistribution]]): summed with an infinite-tail cutoff — stops once the cumulative PDF mass is within $10^{-12}$ of $1$ and the current term is below $10^{-12}$."
  - "Continuous: double-exponential (tanh-sinh) quadrature, generalized to a finite interval, a semi-infinite one, or the whole real line depending on the distribution's domain, converging to the same $10^{-12}$ relative tolerance."
  - Distributions this package has no tabulated support/domain for (including every wave-4 compound distribution — TruncatedDistribution, MixtureDistribution, etc.) stay unevaluated — a documented gap, not a bug.
seeAlso:
  - Expectation
  - NProbability
  - Distributed
names:
  wolframIdentity: true
