name: OccurrencesOf123
domain: Permutations statistics
signature: OccurrencesOf123(p)
summary: Triples i < j < k with p(i) < p(j) < p(k).
details:
  - Defined over `Permutations` as an expression in `_x`, evaluated by compute-engine — the definition IS the implementation.
  - "Takes a `Permutations`, and also a bare list of integers: this reading compares entries with each other rather than with their positions, so it stands on any sequence."
