nexpectation-sin-of-normal:
  epsil:
    in: NExpectation(Sin(x), Distributed(x, NormalDistribution(2, 3)))
    out: 0.010_101_381_966_839_188
  tex:
    in: \mathrm{NExpectation}(\sin(x), \mathrm{Distributed}(x, \operatorname{NormalDistribution}(2, 3)))
    out: 0.010\,101\,381\,966\,839\,188
  fullform:
    in: NExpectation[Sin[x], Distributed[x, NormalDistribution[2, 3]]]
nexpectation-cube-of-exponential:
  epsil:
    in: NExpectation(x ^ 3, Distributed(x, ExponentialDistribution(2)))
    out: 0.750_000_000_000_000_1
  tex:
    in: \mathrm{NExpectation}(x^3, \mathrm{Distributed}(x, \operatorname{ExponentialDistribution}(2)))
    out: 0.750\,000\,000\,000\,000\,1
  fullform:
    in: NExpectation[Power[x, 3], Distributed[x, ExponentialDistribution[2]]]
nexpectation-poisson-reciprocal:
  epsil:
    in: NExpectation((x + 1) ^ -1, Distributed(x, PoissonDistribution(3)))
    out: 0.316_737_643_877_377_7
  tex:
    in: \mathrm{NExpectation}(\frac{1}{x+1}, \mathrm{Distributed}(x, \operatorname{PoissonDistribution}(3)))
    out: 0.316\,737\,643\,877\,377\,7
  fullform:
    in: NExpectation[Power[Plus[x, 1], -1], Distributed[x, PoissonDistribution[3]]]
nexpectation-binomial-cube-finite-sum:
  epsil:
    in: NExpectation(x ^ 3, Distributed(x, BinomialDistribution(5, 2 / 5)))
    out: "15.44"
  tex:
    in: \mathrm{NExpectation}(x^3, \mathrm{Distributed}(x, \operatorname{BinomialDistribution}(5, \frac{2}{5})))
    out: "15.44"
  fullform:
    in: NExpectation[Power[x, 3], Distributed[x, BinomialDistribution[5, Rational[2, 5]]]]
