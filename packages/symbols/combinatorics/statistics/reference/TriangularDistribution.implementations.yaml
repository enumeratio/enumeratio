triangular-pdf-exact:
  epsil:
    in: PDF(TriangularDistribution([0, 1]), 1 / 4)
    out: "1"
  tex:
    in: \operatorname{PDF}(\mathrm{TriangularDistribution}(\bigl\lbrack0, 1\bigr\rbrack), \frac{1}{4})
    out: "1"
  fullform:
    in: PDF[TriangularDistribution[List[0, 1]], Rational[1, 4]]
  wolfram:
    in: PDF[TriangularDistribution[List[0, 1]], Rational[1, 4]]
