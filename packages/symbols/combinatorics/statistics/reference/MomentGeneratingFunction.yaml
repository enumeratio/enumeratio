name: MomentGeneratingFunction
domain: Statistics
signature: MomentGeneratingFunction(dist, t)
summary: The moment generating function $M(t) = E[e^{tX}]$ of $dist$.
signatures:
  - call: MomentGeneratingFunction(dist, t)
    description: a per-distribution closed form, the same scoped subset [[CharacteristicFunction]] covers, minus [[CauchyDistribution]] (its MGF genuinely does not exist — $E[e^{tX}]$ diverges for any $t\neq0$) and plus [[LogisticDistribution]] via the [[Beta]] function.
    library: enumeratio-statistics
details:
  - $M(t) = \varphi(t/i)$ in principle; this file writes each distribution's formula directly (the naive `i -> 1` substitution of [[CharacteristicFunction]]'s formula) rather than deriving one from the other, EXCEPT [[LogisticDistribution]], whose MGF is $e^{\mu t}B(1-\beta t, 1+\beta t)$ — a different (still elementary) closed form from its CF.
  - $M(0) = 1$ always; a numeric derivative of $M$ at $t=0$ reproduces [[Mean]] (checked in `tests/distributions-3.test.ts`, not repeated here).
seeAlso:
  - CharacteristicFunction
  - PDF
  - Moment
  - Cumulant
names:
  wolframIdentity: true
