name: LaplaceDistribution
domain: Statistics
signature: LaplaceDistribution(mu, b)
summary: The Laplace (double-exponential) distribution with location $\mu$ and scale $b$.
signatures:
  - call: LaplaceDistribution(mu, b)
    description: an inert distribution object — carries $\mu, b$, unevaluated.
    library: enumeratio-statistics
details:
  - $PDF(x) = e^{-|x-\mu|/b}/(2b)$, exact.
  - $CDF(x) = e^{(x-\mu)/b}/2$ for $x < \mu$, $1-e^{-(x-\mu)/b}/2$ otherwise.
  - $Mean = \mu$, $Variance = 2b^2$, both exact.
  - "[[RandomVariate]] samples via inverse transform."
seeAlso:
  - CauchyDistribution
  - LogisticDistribution
  - PDF
  - CDF
names:
  wolframIdentity: true
