hypergeometric-pdf-exact:
  epsil:
    in: PDF(HypergeometricDistribution(20, 50, 100), 10)
    out: 10_272_278_170 / 52_177_653_441
  tex:
    in: \operatorname{PDF}(\mathrm{HypergeometricDistribution}(20, 50, 100), 10)
    out: \frac{10\,272\,278\,170}{52\,177\,653\,441}
  wolfram:
    in: PDF[HypergeometricDistribution[20, 50, 100], 10]
hypergeometric-mean-exact:
  epsil:
    in: Mean(HypergeometricDistribution(20, 50, 100))
    out: "10"
  tex:
    in: \mathrm{mean}(\mathrm{HypergeometricDistribution}(20, 50, 100))
    out: "10"
  wolfram:
    in: Mean[HypergeometricDistribution[20, 50, 100]]
hypergeometric-variance-exact:
  epsil:
    in: Variance(HypergeometricDistribution(20, 50, 100))
    out: 400 / 99
  tex:
    in: \mathrm{Variance}(\mathrm{HypergeometricDistribution}(20, 50, 100))
    out: \frac{400}{99}
  wolfram:
    in: Variance[HypergeometricDistribution[20, 50, 100]]
