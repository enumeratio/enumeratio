name: LogisticDistribution
domain: Statistics
signature: LogisticDistribution(mu, beta)
summary: The logistic distribution with location $\mu$ and scale $\beta$.
signatures:
  - call: LogisticDistribution(mu, beta)
    description: an inert distribution object — carries $\mu, \beta$, unevaluated.
    library: enumeratio-statistics
details:
  - $PDF(x) = e^{-(x-\mu)/\beta} \big/ \big(\beta(1+e^{-(x-\mu)/\beta})^2\big)$, exact.
  - $CDF(x) = 1/(1+e^{-(x-\mu)/\beta})$, exact.
  - $Mean = \mu$, $Variance = \beta^2\pi^2/3$, both exact.
  - '[[RandomVariate]] samples via inverse transform: $\mu + \beta\log(U/(1-U))$.'
examples:
  - id: logistic-pdf-exact
    expr: [PDF, [LogisticDistribution, 0, 1], 0]
    expected: [Rational, 1, 4]
  - id: logistic-cdf-exact
    expr: [CDF, [LogisticDistribution, 0, 1], 0]
    expected: [Rational, 1, 2]
  - id: logistic-mean-exact
    expr: [Mean, [LogisticDistribution, 0, 1]]
    expected: 0
  - id: logistic-variance-exact
    expr: [Variance, [LogisticDistribution, 0, 1]]
    expected: [Multiply, [Rational, 1, 3], [Power, Pi, 2]]
seeAlso:
  - LaplaceDistribution
  - PDF
  - CDF
