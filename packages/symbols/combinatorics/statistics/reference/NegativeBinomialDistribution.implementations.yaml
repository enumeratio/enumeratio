negativebinomial-pdf-exact:
  epsil:
    in: PDF(NegativeBinomialDistribution(5, 1 / 3), 2)
    out: 20 / 729
  tex:
    in: \operatorname{PDF}(\mathrm{NegativeBinomialDistribution}(5, \frac{1}{3}), 2)
    out: \frac{20}{729}
  fullform:
    in: PDF[NegativeBinomialDistribution[5, Rational[1, 3]], 2]
  wolfram:
    in: PDF[NegativeBinomialDistribution[5, Rational[1, 3]], 2]
negativebinomial-cdf-exact:
  epsil:
    in: CDF(NegativeBinomialDistribution(5, 1 / 3), 2)
    out: BetaRegularized(1 / 3, 5, 3)
  tex:
    in: \operatorname{CDF}(\mathrm{NegativeBinomialDistribution}(5, \frac{1}{3}), 2)
    out: \operatorname{BetaRegularized}(\frac{1}{3}, 5, 3)
  traditional:
    in: \operatorname{CDF}(\mathrm{NegativeBinomialDistribution}(5, \frac{1}{3}), 2)
    out: I_{\frac{1}{3}}(5, 3)
  fullform:
    in: CDF[NegativeBinomialDistribution[5, Rational[1, 3]], 2]
  wolfram:
    in: CDF[NegativeBinomialDistribution[5, Rational[1, 3]], 2]
negativebinomial-mean-exact:
  epsil:
    in: Mean(NegativeBinomialDistribution(5, 1 / 3))
    out: "10"
  tex:
    in: \mathrm{mean}(\mathrm{NegativeBinomialDistribution}(5, \frac{1}{3}))
    out: "10"
  fullform:
    in: Mean[NegativeBinomialDistribution[5, Rational[1, 3]]]
  wolfram:
    in: Mean[NegativeBinomialDistribution[5, Rational[1, 3]]]
negativebinomial-variance-exact:
  epsil:
    in: Variance(NegativeBinomialDistribution(5, 1 / 3))
    out: "30"
  tex:
    in: \mathrm{Variance}(\mathrm{NegativeBinomialDistribution}(5, \frac{1}{3}))
    out: "30"
  fullform:
    in: Variance[NegativeBinomialDistribution[5, Rational[1, 3]]]
  wolfram:
    in: Variance[NegativeBinomialDistribution[5, Rational[1, 3]]]
