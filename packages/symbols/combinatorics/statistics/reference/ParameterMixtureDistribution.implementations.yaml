parameter-mixture-poisson-gamma-pdf:
  epsil:
    in: |-
      PDF(ParameterMixtureDistribution(
                                        PoissonDistribution(theta),
                                        Distributed(theta, GammaDistribution(3, 2)),
                                      ), 4)
    out: 80 / 729
  tex:
    in: \operatorname{PDF}(\mathrm{ParameterMixtureDistribution}(\operatorname{PoissonDistribution}(\theta), \mathrm{Distributed}(\theta, \mathrm{GammaDistribution}(3, 2))), 4)
    out: \frac{80}{729}
  fullform:
    in: PDF[ParameterMixtureDistribution[PoissonDistribution[theta], Distributed[theta, GammaDistribution[3, 2]]], 4]
parameter-mixture-poisson-gamma-mean:
  epsil:
    in: |-
      Mean(ParameterMixtureDistribution(
                                         PoissonDistribution(theta),
                                         Distributed(theta, GammaDistribution(3, 2)),
                                       ))
    out: "6"
  tex:
    in: \mathrm{mean}(\mathrm{ParameterMixtureDistribution}(\operatorname{PoissonDistribution}(\theta), \mathrm{Distributed}(\theta, \mathrm{GammaDistribution}(3, 2))))
