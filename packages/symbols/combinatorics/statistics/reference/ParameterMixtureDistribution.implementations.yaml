                                         Distributed(theta, BetaDistribution(2, 3)),
                                       ))
    out: "4"
  tex:
    in: \mathrm{mean}(\mathrm{ParameterMixtureDistribution}(\operatorname{BinomialDistribution}(10, \theta), \mathrm{Distributed}(\theta, \mathrm{BetaDistribution}(2, 3))))
    out: "4"
  fullform:
    in: Mean[ParameterMixtureDistribution[BinomialDistribution[10, theta], Distributed[theta, BetaDistribution[2, 3]]]]
