logistic-pdf-exact:
  epsil:
    in: PDF(LogisticDistribution(0, 1), 0)
    out: 1 / 4
  tex:
    in: \operatorname{PDF}(\mathrm{LogisticDistribution}(0, 1), 0)
    out: \frac{1}{4}
  fullform:
    in: PDF[LogisticDistribution[0, 1], 0]
  wolfram:
    in: PDF[LogisticDistribution[0, 1], 0]
logistic-cdf-exact:
  epsil:
    in: CDF(LogisticDistribution(0, 1), 0)
    out: 1 / 2
  tex:
    in: \operatorname{CDF}(\mathrm{LogisticDistribution}(0, 1), 0)
    out: \frac{1}{2}
  fullform:
    in: CDF[LogisticDistribution[0, 1], 0]
  wolfram:
    in: CDF[LogisticDistribution[0, 1], 0]
logistic-mean-exact:
  epsil:
    in: Mean(LogisticDistribution(0, 1))
    out: "0"
  tex:
    in: \mathrm{mean}(\mathrm{LogisticDistribution}(0, 1))
    out: "0"
  fullform:
    in: Mean[LogisticDistribution[0, 1]]
  wolfram:
    in: Mean[LogisticDistribution[0, 1]]
logistic-variance-exact:
  epsil:
    in: Variance(LogisticDistribution(0, 1))
    out: 1 / 3 * Pi ^ 2
  tex:
    in: \mathrm{Variance}(\mathrm{LogisticDistribution}(0, 1))
    out: \frac{\pi^2}{3}
  fullform:
    in: Variance[LogisticDistribution[0, 1]]
  wolfram:
    in: Variance[LogisticDistribution[0, 1]]
