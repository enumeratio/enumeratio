- id: probability-distribution-pdf-in-range
  expr: [PDF, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]], [Rational, 1, 2]]
  expected: 1
  caption: pdf(x) = 2x, a triangular density on [0,1].
- id: probability-distribution-pdf-outside
  expr: [PDF, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]], 2]
  expected: 0
- id: probability-distribution-mean
  expr: [Mean, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]]]
  expected: [Rational, 2, 3]
- id: probability-distribution-variance
  expr: [Variance, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]]]
  expected: [Rational, 1, 18]
- id: probability-distribution-cdf
  expr: [CDF, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]], [Rational, 1, 2]]
  expected: [Rational, 1, 4]
- id: probability-distribution-discrete-pdf
  expr: [PDF, [ProbabilityDistribution, [Rational, 1, 4], [List, x, 1, 4, 1]], 2]
  expected: [Rational, 1, 4]
  caption: a discrete uniform on {1,2,3,4} written by hand.
- id: probability-distribution-discrete-mean
  expr: [Mean, [ProbabilityDistribution, [Rational, 1, 4], [List, x, 1, 4, 1]]]
  expected: [Rational, 5, 2]
- id: probability-distribution-stays-unevaluated
  expr: [Mean, [ProbabilityDistribution, [Sin, [Power, x, x]], [List, x, 0, 1]]]
  expected: [Mean, [ProbabilityDistribution, [Sin, [Power, x, x]], [List, x, 0, 1]]]
  caption: Integrate has no closed form here, so Mean stays unevaluated rather than approximate.
