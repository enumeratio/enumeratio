multinomial-pdf:
  epsil:
    in: PDF(MultinomialDistribution(4, [1 / 2, 1 / 3, 1 / 6]), [2, 1, 1])
    out: 1 / 6
  tex:
    in: \operatorname{PDF}(\mathrm{MultinomialDistribution}(4, \bigl\lbrack\frac{1}{2}, \frac{1}{3}, \frac{1}{6}\bigr\rbrack), \bigl\lbrack2, 1, 1\bigr\rbrack)
    out: \frac{1}{6}
  fullform:
    in: PDF[MultinomialDistribution[4, List[Rational[1, 2], Rational[1, 3], Rational[1, 6]]], List[2, 1, 1]]
  wolfram:
    in: PDF[MultinomialDistribution[4, List[Rational[1, 2], Rational[1, 3], Rational[1, 6]]], List[2, 1, 1]]
multinomial-pdf-zero:
  epsil:
    in: PDF(MultinomialDistribution(4, [1 / 2, 1 / 2]), [1, 1])
    out: "0"
  tex:
    in: \operatorname{PDF}(\mathrm{MultinomialDistribution}(4, \bigl\lbrack\frac{1}{2}, \frac{1}{2}\bigr\rbrack), \bigl\lbrack1, 1\bigr\rbrack)
    out: "0"
  fullform:
    in: PDF[MultinomialDistribution[4, List[Rational[1, 2], Rational[1, 2]]], List[1, 1]]
  wolfram:
    in: PDF[MultinomialDistribution[4, List[Rational[1, 2], Rational[1, 2]]], List[1, 1]]
multinomial-mean:
  epsil:
    in: Mean(MultinomialDistribution(10, [1 / 5, 4 / 5]))
    out: "[2, 8]"
  tex:
    in: \mathrm{mean}(\mathrm{MultinomialDistribution}(10, \bigl\lbrack\frac{1}{5}, \frac{4}{5}\bigr\rbrack))
    out: \bigl\lbrack2, 8\bigr\rbrack
  fullform:
    in: Mean[MultinomialDistribution[10, List[Rational[1, 5], Rational[4, 5]]]]
  wolfram:
    in: Mean[MultinomialDistribution[10, List[Rational[1, 5], Rational[4, 5]]]]
multinomial-variance:
  epsil:
    in: Variance(MultinomialDistribution(10, [1 / 5, 4 / 5]))
    out: "[8 / 5, 8 / 5]"
  tex:
    in: \mathrm{Variance}(\mathrm{MultinomialDistribution}(10, \bigl\lbrack\frac{1}{5}, \frac{4}{5}\bigr\rbrack))
    out: \bigl\lbrack\frac{8}{5}, \frac{8}{5}\bigr\rbrack
  fullform:
    in: Variance[MultinomialDistribution[10, List[Rational[1, 5], Rational[4, 5]]]]
  wolfram:
    in: Variance[MultinomialDistribution[10, List[Rational[1, 5], Rational[4, 5]]]]
multinomial-covariance:
  epsil:
    in: Covariance(MultinomialDistribution(10, [1 / 5, 4 / 5]))
    out: "[[8 / 5, -8 / 5], [-8 / 5, 8 / 5]]"
  tex:
    in: \operatorname{Covariance}(\mathrm{MultinomialDistribution}(10, \bigl\lbrack\frac{1}{5}, \frac{4}{5}\bigr\rbrack))
    out: \bigl\lbrack\bigl\lbrack\frac{8}{5}, -\frac{8}{5}\bigr\rbrack, \bigl\lbrack-\frac{8}{5}, \frac{8}{5}\bigr\rbrack\bigr\rbrack
  fullform:
    in: Covariance[MultinomialDistribution[10, List[Rational[1, 5], Rational[4, 5]]]]
  wolfram:
    in: Covariance[MultinomialDistribution[10, List[Rational[1, 5], Rational[4, 5]]]]
