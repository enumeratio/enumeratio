name: HookProduct
domain: Partition statistics
signature: HookProduct(partition)
summary: The product of all hook lengths — the denominator in the hook-length formula.
details:
  - Defined over `IntegerPartitions` as an expression in `_x`, evaluated by compute-engine — the definition IS the implementation.
  - Takes a `IntegerPartitions` and nothing else — it reads values against their positions, or walks the orbits, so it needs the bijection. Applying it to a bare list is a type error, not a wrong answer.
