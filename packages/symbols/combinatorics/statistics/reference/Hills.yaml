name: Hills
domain: Dyck path statistics
signature: Hills(path)
summary: Peaks at height 1 — an up step from the axis immediately followed by a down step.
details:
  - Defined over `DyckPaths` as an expression in `_x`, evaluated by compute-engine — the definition IS the implementation.
  - Takes a `DyckPaths` and nothing else — it reads values against their positions, or walks the orbits, so it needs the bijection. Applying it to a bare list is a type error, not a wrong answer.
examples:
  - id: the-step-word-uuddud
    expr: [Hills, [DyckPaths, [List, 1, 1, 0, 0, 1, 0]]]
    expected: 1
    caption: the step word $UUDDUD$
  - id: the-step-word-uduudd
    expr: [Hills, [DyckPaths, [List, 1, 0, 1, 1, 0, 0]]]
    expected: 1
    caption: the step word $UDUUDD$
