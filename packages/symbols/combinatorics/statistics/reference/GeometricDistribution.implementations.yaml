geometric-pdf-exact:
  epsil:
    in: PDF(GeometricDistribution(1 / 4), 2)
    out: 9 / 64
  tex:
    in: \operatorname{PDF}(\mathrm{GeometricDistribution}(\frac{1}{4}), 2)
    out: \frac{9}{64}
  wolfram:
    in: PDF[GeometricDistribution[Rational[1, 4]], 2]
geometric-cdf-exact:
  epsil:
    in: CDF(GeometricDistribution(1 / 4), 2)
    out: 37 / 64
  tex:
    in: \operatorname{CDF}(\mathrm{GeometricDistribution}(\frac{1}{4}), 2)
    out: \frac{37}{64}
  wolfram:
    in: CDF[GeometricDistribution[Rational[1, 4]], 2]
geometric-mean-exact:
  epsil:
    in: Mean(GeometricDistribution(1 / 4))
    out: "3"
  tex:
    in: \mathrm{mean}(\mathrm{GeometricDistribution}(\frac{1}{4}))
    out: "3"
  wolfram:
    in: Mean[GeometricDistribution[Rational[1, 4]]]
geometric-variance-exact:
  epsil:
    in: Variance(GeometricDistribution(1 / 4))
    out: "12"
  tex:
    in: \mathrm{Variance}(\mathrm{GeometricDistribution}(\frac{1}{4}))
    out: "12"
  wolfram:
    in: Variance[GeometricDistribution[Rational[1, 4]]]
