pareto-pdf-exact:
  epsil:
    in: PDF(ParetoDistribution(1, 3), 2)
    out: 3 / 16
  tex:
    in: \operatorname{PDF}(\mathrm{ParetoDistribution}(1, 3), 2)
    out: \frac{3}{16}
  wolfram:
    in: PDF[ParetoDistribution[1, 3], 2]
pareto-cdf-exact:
  epsil:
    in: CDF(ParetoDistribution(1, 3), 2)
    out: 7 / 8
  tex:
    in: \operatorname{CDF}(\mathrm{ParetoDistribution}(1, 3), 2)
    out: \frac{7}{8}
  wolfram:
    in: CDF[ParetoDistribution[1, 3], 2]
pareto-mean-exact:
  epsil:
    in: Mean(ParetoDistribution(1, 3))
    out: 3 / 2
  tex:
    in: \mathrm{mean}(\mathrm{ParetoDistribution}(1, 3))
    out: \frac{3}{2}
  wolfram:
    in: Mean[ParetoDistribution[1, 3]]
pareto-variance-exact:
  epsil:
    in: Variance(ParetoDistribution(1, 3))
    out: 3 / 4
  tex:
    in: \mathrm{Variance}(\mathrm{ParetoDistribution}(1, 3))
    out: \frac{3}{4}
  wolfram:
    in: Variance[ParetoDistribution[1, 3]]
