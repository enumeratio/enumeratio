- id: histogram-distribution-pdf
  expr: [PDF, [HistogramDistribution, [List, 1, 1, 2, 2, 2, 3, 3, 4], [List, 0, 5, 1]], [Rational, 3, 2]]
  expected: [Rational, 1, 4]
  caption: bin [1,2) has 2 of the 8 points -> height 2/(8*1).
- id: histogram-distribution-pdf-outside
  expr: [PDF, [HistogramDistribution, [List, 1, 1, 2, 2, 2, 3, 3, 4], [List, 0, 5, 1]], 10]
  expected: 0
- id: histogram-distribution-cdf
  expr: [CDF, [HistogramDistribution, [List, 1, 1, 2, 2, 2, 3, 3, 4], [List, 0, 5, 1]], 2]
  expected: [Rational, 1, 4]
  caption: P(X < 2) = the two points below 2, out of 8.
- id: histogram-distribution-mean
  expr: [Mean, [HistogramDistribution, [List, 1, 1, 2, 2, 2, 3, 3, 4], [List, 0, 5, 1]]]
  expected: [Rational, 11, 4]
- id: histogram-distribution-dx-only-form
  expr: [PDF, [HistogramDistribution, [List, 1, 2, 2, 3], [List, 1]], [Rational, 3, 2]]
  expected: [Rational, 1, 4]
  caption: the {dx} form picks x0 = floor(min(data)/dx)*dx = 1 as the first bin's left edge.
