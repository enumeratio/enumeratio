marginal-single-factor:
  epsil:
    in: |-
      MarginalDistribution(ProductDistribution(
                                                NormalDistribution(0, 1),
                                                NormalDistribution(5, 2),
                                              ), 2)
    out: NormalDistribution(5, 2)
  tex:
    in: \mathrm{MarginalDistribution}(\mathrm{ProductDistribution}(\operatorname{NormalDistribution}(0, 1), \operatorname{NormalDistribution}(5, 2)), 2)
    out: \operatorname{NormalDistribution}(5, 2)
  fullform:
    in: MarginalDistribution[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]], 2]
  wolfram:
    in: MarginalDistribution[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]], 2]
marginal-single-factor-mean:
  epsil:
    in: |-
      Mean(MarginalDistribution(ProductDistribution(
                                                     NormalDistribution(0, 1),
                                                     NormalDistribution(5, 2),
                                                   ), 2))
    out: "5"
  tex:
    in: \mathrm{mean}(\mathrm{MarginalDistribution}(\mathrm{ProductDistribution}(\operatorname{NormalDistribution}(0, 1), \operatorname{NormalDistribution}(5, 2)), 2))
    out: "5"
  fullform:
    in: Mean[MarginalDistribution[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]], 2]]
  wolfram:
    in: Mean[MarginalDistribution[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]], 2]]
marginal-index-list:
  epsil:
    in: |-
      MarginalDistribution(ProductDistribution(
                                                NormalDistribution(0, 1),
                                                NormalDistribution(5, 2),
                                                NormalDistribution(9, 1),
                                              ), [1, 3])
    out: ProductDistribution(NormalDistribution(0, 1), NormalDistribution(9, 1))
  tex:
    in: \mathrm{MarginalDistribution}(\mathrm{ProductDistribution}(\operatorname{NormalDistribution}(0, 1), \operatorname{NormalDistribution}(5, 2), \operatorname{NormalDistribution}(9, 1)), \bigl\lbrack1, 3\bigr\rbrack)
    out: \mathrm{ProductDistribution}(\operatorname{NormalDistribution}(0, 1), \operatorname{NormalDistribution}(9, 1))
  fullform:
    in: MarginalDistribution[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2], NormalDistribution[9, 1]], List[1, 3]]
  wolfram:
    in: MarginalDistribution[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2], NormalDistribution[9, 1]], List[1, 3]]
