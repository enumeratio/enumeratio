gamma-distribution-one-argument-defaults-scale:
  epsil:
    in: GammaDistribution(2)
    out: GammaDistribution(2, 1)
  tex:
    in: \mathrm{GammaDistribution}(2)
    out: \mathrm{GammaDistribution}(2, 1)
  wolfram:
    in: GammaDistribution[2]
gamma-pdf-exact:
  epsil:
    in: PDF(GammaDistribution(2, 2), 3)
    out: 3 / (4 * Gamma(2) * ExponentialE ^ (3 / 2))
  tex:
    in: \operatorname{PDF}(\mathrm{GammaDistribution}(2, 2), 3)
    out: (3)(4\Gamma(2)\exp(\frac{3}{2}))^{-1}
  wolfram:
    in: PDF[GammaDistribution[2, 2], 3]
gamma-cdf-exact:
  epsil:
    in: CDF(GammaDistribution(2, 2), 3)
    out: 1 + -5 / (2 * ExponentialE ^ (3 / 2))
  tex:
    in: \operatorname{CDF}(\mathrm{GammaDistribution}(2, 2), 3)
    out: 1-(5)(2\exp(\frac{3}{2}))^{-1}
  wolfram:
    in: CDF[GammaDistribution[2, 2], 3]
gamma-mean-exact:
  epsil:
    in: Mean(GammaDistribution(2, 2))
    out: "4"
  tex:
    in: \mathrm{mean}(\mathrm{GammaDistribution}(2, 2))
    out: "4"
  wolfram:
    in: Mean[GammaDistribution[2, 2]]
gamma-variance-exact:
  epsil:
    in: Variance(GammaDistribution(2, 2))
    out: "8"
  tex:
    in: \mathrm{Variance}(\mathrm{GammaDistribution}(2, 2))
    out: "8"
  wolfram:
    in: Variance[GammaDistribution[2, 2]]
gamma-cdf-clamps-below-support:
  epsil:
    in: N(CDF(GammaDistribution(2, 2), -1))
    out: "0"
  tex:
    in: N(\operatorname{CDF}(\mathrm{GammaDistribution}(2, 2), -1))
    out: "0"
  wolfram:
    in: N[CDF[GammaDistribution[2, 2], -1]]
