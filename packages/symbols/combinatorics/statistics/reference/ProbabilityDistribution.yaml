name: ProbabilityDistribution
domain: Statistics
signature: ProbabilityDistribution(pdf, {x, min, max}) | ProbabilityDistribution(pdf, {x, min, max, 1})
summary: A distribution given directly by its density $pdf$, over $x \in [min,max]$ (continuous) or $x \in \{min,\ldots,max\}$ (discrete, step size 1).
signatures:
  - call: ProbabilityDistribution(pdf, {x, min, max})
    description: continuous, density pdf(x) over [min, max].
    library: enumeratio-statistics
  - call: ProbabilityDistribution(pdf, {x, min, max, 1})
    description: discrete, mass pdf(x) over {min, ..., max} — step size pinned to 1.
    library: enumeratio-statistics
details:
  - $pdf$ is used AS WRITTEN, not renormalized — same as Wolfram's own `ProbabilityDistribution`, which does not renormalize its `pdf` argument either; it is the caller's responsibility that it already integrates/sums to 1.
  - $PDF(v) = pdf|_{x=v}$ (substitution) inside $[min,max]$, $0$ outside.
  - "$CDF$/$Mean$/$Variance$ go through compute-engine's own native `Integrate` (continuous) or `Sum` (discrete): exact whenever those resolve to a closed form, and left UNEVALUATED (not approximated) when they don't — numeric approximation still reaches them through `N`, same as everywhere else in this package."
  - An arbitrary discrete step size (other than 1) is out of scope for this head.
examples:
  - id: probability-distribution-pdf-in-range
    expr: [PDF, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]], [Rational, 1, 2]]
    expected: 1
    caption: pdf(x) = 2x, a triangular density on [0,1].
  - id: probability-distribution-pdf-outside
    expr: [PDF, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]], 2]
    expected: 0
  - id: probability-distribution-mean
    expr: [Mean, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]]]
    expected: [Rational, 2, 3]
  - id: probability-distribution-variance
    expr: [Variance, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]]]
    expected: [Rational, 1, 18]
  - id: probability-distribution-cdf
    expr: [CDF, [ProbabilityDistribution, [Multiply, 2, x], [List, x, 0, 1]], [Rational, 1, 2]]
    expected: [Rational, 1, 4]
  - id: probability-distribution-discrete-pdf
    expr: [PDF, [ProbabilityDistribution, [Rational, 1, 4], [List, x, 1, 4, 1]], 2]
    expected: [Rational, 1, 4]
    caption: a discrete uniform on {1,2,3,4} written by hand.
  - id: probability-distribution-discrete-mean
    expr: [Mean, [ProbabilityDistribution, [Rational, 1, 4], [List, x, 1, 4, 1]]]
    expected: [Rational, 5, 2]
  - id: probability-distribution-stays-unevaluated
    expr: [Mean, [ProbabilityDistribution, [Sin, [Power, x, x]], [List, x, 0, 1]]]
    expected: [Mean, [ProbabilityDistribution, [Sin, [Power, x, x]], [List, x, 0, 1]]]
    caption: Integrate has no closed form here, so Mean stays unevaluated rather than approximate.
seeAlso:
  - HistogramDistribution
  - PDF
  - CDF
  - Mean
