cumulant-order-1-is-mean:
  epsil:
    in: Cumulant(ChiSquareDistribution(3), 1)
    out: "3"
  tex:
    in: \mathrm{Cumulant}(\mathrm{ChiSquareDistribution}(3), 1)
    out: "3"
  wolfram:
    in: Cumulant[ChiSquareDistribution[3], 1]
cumulant-order-2-is-variance:
  epsil:
    in: Cumulant(ChiSquareDistribution(3), 2)
    out: "6"
  tex:
    in: \mathrm{Cumulant}(\mathrm{ChiSquareDistribution}(3), 2)
    out: "6"
  wolfram:
    in: Cumulant[ChiSquareDistribution[3], 2]
