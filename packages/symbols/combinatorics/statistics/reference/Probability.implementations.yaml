probability-equal-is-pdf-for-discrete:
  epsil:
    in: Probability(x == 2, Distributed(x, PoissonDistribution(3)))
    out: 9 / (2 * ExponentialE ^ 3)
  tex:
    in: \mathrm{Probability}(x=2, \mathrm{Distributed}(x, \operatorname{PoissonDistribution}(3)))
    out: \frac{9}{2e^{3}}
  fullform:
    in: Probability[Equal[x, 2], Distributed[x, PoissonDistribution[3]]]
probability-equal-is-zero-for-continuous:
  epsil:
    in: Probability(x == 2, Distributed(x, NormalDistribution(0, 1)))
    out: "0"
  tex:
    in: \mathrm{Probability}(x=2, \mathrm{Distributed}(x, \operatorname{NormalDistribution}(0, 1)))
    out: "0"
  fullform:
    in: Probability[Equal[x, 2], Distributed[x, NormalDistribution[0, 1]]]
probability-lessequal-is-cdf:
  epsil:
    in: Probability(x <= 5, Distributed(x, PoissonDistribution(3)))
    out: 92 / (5 * ExponentialE ^ 3)
  tex:
    in: \mathrm{Probability}(x\le5, \mathrm{Distributed}(x, \operatorname{PoissonDistribution}(3)))
    out: \frac{92}{5e^{3}}
  fullform:
    in: Probability[LessEqual[x, 5], Distributed[x, PoissonDistribution[3]]]
probability-of-a-chained-range:
  epsil:
    in: Probability(1 <= x && x <= 5, Distributed(x, PoissonDistribution(3)))
    out: 87 / (5 * ExponentialE ^ 3)
  tex:
    in: \mathrm{Probability}(1\le x\land x\le5, \mathrm{Distributed}(x, \operatorname{PoissonDistribution}(3)))
    out: \frac{87}{5e^{3}}
  fullform:
    in: Probability[And[LessEqual[1, x], LessEqual[x, 5]], Distributed[x, PoissonDistribution[3]]]
probability-greater-is-canonicalized-first:
  epsil:
    in: N(Probability(x > 0, Distributed(x, NormalDistribution(0, 1))))
    out: "0.5"
  tex:
    in: N(\mathrm{Probability}(x\gt0, \mathrm{Distributed}(x, \operatorname{NormalDistribution}(0, 1))))
    out: "0.5"
  fullform:
    in: N[Probability[Greater[x, 0], Distributed[x, NormalDistribution[0, 1]]]]
