name: Order
domain: Permutations statistics
signature: Order(p)
summary: The order of p in the symmetric group — the lcm of its cycle lengths.
details:
  - Defined over `Permutations` as an expression in `_x`, evaluated by compute-engine — the definition IS the implementation.
  - Takes a `Permutations` and nothing else — it reads values against their positions, or walks the orbits, so it needs the bijection. Applying it to a bare list is a type error, not a wrong answer.
