name: LongestDescent
domain: Dyck path statistics
signature: LongestDescent(path)
summary: The longest run of consecutive down steps.
details:
  - Defined over `DyckPaths` as an expression in `_x`, evaluated by compute-engine — the definition IS the implementation.
  - Takes a `DyckPaths` and nothing else — it reads values against their positions, or walks the orbits, so it needs the bijection. Applying it to a bare list is a type error, not a wrong answer.
