wiener-slice-mean:
  epsil:
    in: Mean(SliceDistribution(WienerProcess(2, 3), 5))
    out: "10"
  tex:
    in: \mathrm{mean}(\mathrm{SliceDistribution}(\mathrm{WienerProcess}(2, 3), 5))
    out: "10"
  fullform:
    in: Mean[SliceDistribution[WienerProcess[2, 3], 5]]
  wolfram:
    in: Mean[SliceDistribution[WienerProcess[2, 3], 5]]
wiener-slice-variance:
