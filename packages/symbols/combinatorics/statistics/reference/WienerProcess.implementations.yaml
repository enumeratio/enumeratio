    in: \mathrm{Variance}(\mathrm{SliceDistribution}(\mathrm{WienerProcess}(0, 3), 4))
    out: "36"
  fullform:
    in: Variance[SliceDistribution[WienerProcess[0, 3], 4]]
  wolfram:
    in: Variance[SliceDistribution[WienerProcess[0, 3], 4]]
wiener-default-slice:
