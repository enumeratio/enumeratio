    in: SliceDistribution(WienerProcess(), 4)
    out: NormalDistribution(0, 2)
  tex:
    in: \mathrm{SliceDistribution}(\mathrm{WienerProcess}(), 4)
    out: \operatorname{NormalDistribution}(0, 2)
