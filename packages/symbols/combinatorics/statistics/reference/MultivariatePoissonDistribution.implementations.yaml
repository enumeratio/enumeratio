multivariate-poisson-mean:
  epsil:
    in: Mean(MultivariatePoissonDistribution(1, [2, 3]))
    out: "[3, 4]"
  tex:
    in: \mathrm{mean}(\mathrm{MultivariatePoissonDistribution}(1, \bigl\lbrack2, 3\bigr\rbrack))
    out: \bigl\lbrack3, 4\bigr\rbrack
  fullform:
    in: Mean[MultivariatePoissonDistribution[1, List[2, 3]]]
  wolfram:
    in: Mean[MultivariatePoissonDistribution[1, List[2, 3]]]
multivariate-poisson-variance:
