bernoulli-pdf-exact:
  epsil:
    in: PDF(BernoulliDistribution(1 / 3), 1)
    out: 1 / 3
  tex:
    in: \operatorname{PDF}(\mathrm{BernoulliDistribution}(\frac{1}{3}), 1)
    out: \frac{1}{3}
  wolfram:
    in: PDF[BernoulliDistribution[Rational[1, 3]], 1]
bernoulli-cdf-exact:
  epsil:
    in: CDF(BernoulliDistribution(1 / 3), 0)
    out: 2 / 3
  tex:
    in: \operatorname{CDF}(\mathrm{BernoulliDistribution}(\frac{1}{3}), 0)
    out: \frac{2}{3}
  wolfram:
    in: CDF[BernoulliDistribution[Rational[1, 3]], 0]
bernoulli-mean-exact:
  epsil:
    in: Mean(BernoulliDistribution(1 / 3))
    out: 1 / 3
  tex:
    in: \mathrm{mean}(\mathrm{BernoulliDistribution}(\frac{1}{3}))
    out: \frac{1}{3}
  wolfram:
    in: Mean[BernoulliDistribution[Rational[1, 3]]]
bernoulli-variance-exact:
  epsil:
    in: Variance(BernoulliDistribution(1 / 3))
    out: 2 / 9
  tex:
    in: \mathrm{Variance}(\mathrm{BernoulliDistribution}(\frac{1}{3}))
    out: \frac{2}{9}
  wolfram:
    in: Variance[BernoulliDistribution[Rational[1, 3]]]
