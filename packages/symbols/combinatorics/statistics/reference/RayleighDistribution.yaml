name: RayleighDistribution
domain: Statistics
signature: RayleighDistribution(sigma)
summary: The Rayleigh distribution with scale $\sigma$ — the distribution of the magnitude of a 2D Gaussian vector.
signatures:
  - call: RayleighDistribution(sigma)
    description: an inert distribution object — carries $\sigma$, unevaluated.
    library: enumeratio-statistics
details:
  - $PDF(x) = (x/\sigma^2)e^{-x^2/(2\sigma^2)}$ for $x \geq 0$.
  - $CDF(x) = 1-e^{-x^2/(2\sigma^2)}$, clamped to $0$ below $x=0$.
  - $Mean = \sigma\sqrt{\pi/2}$, $Variance = (4-\pi)\sigma^2/2$, both exact.
  - '[[RandomVariate]] samples via inverse transform: $\sigma\sqrt{-2\log U}$.'
seeAlso:
  - ChiDistribution
  - MaxwellDistribution
  - PDF
  - CDF
