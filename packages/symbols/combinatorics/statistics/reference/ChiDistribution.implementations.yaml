chi-pdf-exact:
  epsil:
    in: PDF(ChiDistribution(3), 1)
    out: Sqrt(2) / (2 * Gamma(3 / 2) * Sqrt(ExponentialE))
  tex:
    in: \operatorname{PDF}(\mathrm{ChiDistribution}(3), 1)
    out: (\sqrt{2})(2\Gamma(\frac{3}{2})\sqrt{e})^{-1}
  wolfram:
    in: PDF[ChiDistribution[3], 1]
chi-cdf-exact:
  epsil:
    in: CDF(ChiDistribution(3), 1)
    out: 1 - GammaRegularized(3 / 2, 1 / 2)
  tex:
    in: \operatorname{CDF}(\mathrm{ChiDistribution}(3), 1)
    out: 1-\operatorname{GammaRegularized}(\frac{3}{2}, \frac{1}{2})
  traditional:
    in: \operatorname{CDF}(\mathrm{ChiDistribution}(3), 1)
    out: 1-Q(\frac{3}{2}, \frac{1}{2})
  wolfram:
    in: CDF[ChiDistribution[3], 1]
chi-mean-exact:
  epsil:
    in: Mean(ChiDistribution(3))
    out: Sqrt(2) * Gamma(2) / Gamma(3 / 2)
  tex:
    in: \mathrm{mean}(\mathrm{ChiDistribution}(3))
    out: \frac{\sqrt{2}\Gamma(2)}{\Gamma(\frac{3}{2})}
  wolfram:
    in: Mean[ChiDistribution[3]]
