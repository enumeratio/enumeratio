name: WeibullDistribution
domain: Statistics
signature: WeibullDistribution(alpha, beta)
summary: The Weibull distribution with shape $\alpha$ and scale $\beta$.
signatures:
  - call: WeibullDistribution(alpha, beta)
    description: an inert distribution object — carries $\alpha, \beta$, unevaluated.
    library: enumeratio-statistics
details:
  - $PDF(x) = (\alpha/\beta)(x/\beta)^{\alpha-1}e^{-(x/\beta)^\alpha}$ for $x \geq 0$.
  - $CDF(x) = 1-e^{-(x/\beta)^\alpha}$, clamped to $0$ below $x=0$.
  - $Mean = \beta\Gamma(1+1/\alpha)$, $Variance = \beta^2(\Gamma(1+2/\alpha)-\Gamma(1+1/\alpha)^2)$, both exact.
  - '[[RandomVariate]] samples via inverse transform: $\beta(-\log(1-U))^{1/\alpha}$.'
examples:
  - id: weibull-pdf-exact
    expr: [PDF, [WeibullDistribution, 2, 5], 4]
    expected: [Divide, 8, [Multiply, 25, [Power, ExponentialE, [Rational, 16, 25]]]]
    caption: Cross-checked against wolframscript's N[PDF[WeibullDistribution[2, 5], 4]]
  - id: weibull-cdf-exact
    expr: [CDF, [WeibullDistribution, 2, 5], 4]
    expected: [Add, 1, [Negate, [Power, ExponentialE, [Rational, -16, 25]]]]
    caption: Cross-checked against wolframscript's N[CDF[WeibullDistribution[2, 5], 4]]
  - id: weibull-mean-exact
    expr: [Mean, [WeibullDistribution, 2, 5]]
    expected: [Multiply, 5, [Gamma, [Rational, 3, 2]]]
seeAlso:
  - ChiSquareDistribution
  - PDF
  - CDF
