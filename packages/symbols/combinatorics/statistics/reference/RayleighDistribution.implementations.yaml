rayleigh-pdf-exact:
  epsil:
    in: PDF(RayleighDistribution(3), 3)
    out: 1 / (3 * Sqrt(ExponentialE))
  tex:
    in: \operatorname{PDF}(\mathrm{RayleighDistribution}(3), 3)
    out: \frac{1}{3\sqrt{e}}
  fullform:
    in: PDF[RayleighDistribution[3], 3]
  wolfram:
    in: PDF[RayleighDistribution[3], 3]
rayleigh-cdf-exact:
  epsil:
    in: CDF(RayleighDistribution(3), 3)
    out: 1 - Sqrt(1 / ExponentialE)
  tex:
    in: \operatorname{CDF}(\mathrm{RayleighDistribution}(3), 3)
    out: 1-\sqrt{\frac{1}{e}}
  fullform:
    in: CDF[RayleighDistribution[3], 3]
  wolfram:
    in: CDF[RayleighDistribution[3], 3]
rayleigh-mean-exact:
  epsil:
    in: Mean(RayleighDistribution(3))
    out: 3 / 2 * Sqrt(2) * Sqrt(Pi)
  tex:
    in: \mathrm{mean}(\mathrm{RayleighDistribution}(3))
    out: \frac{1}{2}(3\sqrt{2}\sqrt{\pi})
  fullform:
    in: Mean[RayleighDistribution[3]]
  wolfram:
    in: Mean[RayleighDistribution[3]]
rayleigh-variance-exact:
  epsil:
    in: Variance(RayleighDistribution(3))
    out: 9 / 2 * (4 - Pi)
  tex:
    in: \mathrm{Variance}(\mathrm{RayleighDistribution}(3))
    out: \frac{9(4-\pi)}{2}
  fullform:
    in: Variance[RayleighDistribution[3]]
  wolfram:
    in: Variance[RayleighDistribution[3]]
