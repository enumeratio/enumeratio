product-pdf:
  epsil:
    in: |-
      PDF(
           ProductDistribution(NormalDistribution(0, 1), NormalDistribution(5, 2)),
           [0, 5],
         )
    out: 1 / (4Pi)
  tex:
    in: \operatorname{PDF}(\mathrm{ProductDistribution}(\operatorname{NormalDistribution}(0, 1), \operatorname{NormalDistribution}(5, 2)), \bigl\lbrack0, 5\bigr\rbrack)
    out: \frac{1}{4\pi}
  fullform:
    in: PDF[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]], List[0, 5]]
  wolfram:
    in: PDF[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]], List[0, 5]]
product-mean:
  epsil:
    in: Mean(ProductDistribution(NormalDistribution(0, 1), NormalDistribution(5, 2)))
    out: "[0, 5]"
  tex:
    in: \mathrm{mean}(\mathrm{ProductDistribution}(\operatorname{NormalDistribution}(0, 1), \operatorname{NormalDistribution}(5, 2)))
    out: \bigl\lbrack0, 5\bigr\rbrack
  fullform:
    in: Mean[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]]]
  wolfram:
    in: Mean[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]]]
product-variance:
  epsil:
    in: Variance(ProductDistribution(NormalDistribution(0, 1), NormalDistribution(5, 2)))
    out: "[1, 4]"
  tex:
    in: \mathrm{Variance}(\mathrm{ProductDistribution}(\operatorname{NormalDistribution}(0, 1), \operatorname{NormalDistribution}(5, 2)))
    out: \bigl\lbrack1, 4\bigr\rbrack
  fullform:
    in: Variance[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]]]
  wolfram:
    in: Variance[ProductDistribution[NormalDistribution[0, 1], NormalDistribution[5, 2]]]
product-repeated-form-mean:
  epsil:
    in: Mean(ProductDistribution([NormalDistribution(0, 1), 3]))
    out: "[0, 0, 0]"
  tex:
    in: \mathrm{mean}(\mathrm{ProductDistribution}(\bigl\lbrack\operatorname{NormalDistribution}(0, 1), 3\bigr\rbrack))
    out: \bigl\lbrack0, 0, 0\bigr\rbrack
  fullform:
    in: Mean[ProductDistribution[List[NormalDistribution[0, 1], 3]]]
  wolfram:
    in: Mean[ProductDistribution[List[NormalDistribution[0, 1], 3]]]
