- id: nprobability-normal-outside-one-sigma-ish
  expr: [NProbability, [Greater, [Power, x, 2], 1], [Distributed, x, [NormalDistribution, 0, 1]]]
  expected: 0.3173105078387169
  caption: $P(X^2 > 1) = 2(1-\Phi(1)) \approx 0.3173105079$ for standard normal $X$ — `Probability` itself stays unevaluated (`x^2 > 1` isn't `Equal`/`Less`/`LessEqual`/`And`), and the indicator has two jumps ($x=\pm1$), split off before integrating. Cross-checked against wolframscript's `N[NProbability[x^2 > 1, x \[Distributed] NormalDistribution[0,1]], 10]`.
- id: nprobability-poisson-is-even
  expr: [NProbability, [Equal, [Mod, x, 2], 0], [Distributed, x, [PoissonDistribution, 4]]]
  expected: 0.5001677313139468
  category: Scope
  caption: $P(X \text{ even}) = (1+e^{-2\mu})/2 \approx 0.5001677313$ for $X \sim \mathrm{Poisson}(4)$ — an infinite discrete sum, condition on `Mod`. Cross-checked against wolframscript's `N[NProbability[Mod[x,2] == 0, x \[Distributed] PoissonDistribution[4]], 10]`.
- id: nprobability-agrees-with-exact-cdf
  expr: [NProbability, [LessEqual, x, 5], [Distributed, x, [PoissonDistribution, 3]]]
  expected: 0.9160820579686966
  category: Scope
  caption: Agrees with `Probability`'s own exact `CDF`-based answer for the same condition (`N[92/(5 e^3)]`) — the exact path is tried first and used whenever it resolves.
