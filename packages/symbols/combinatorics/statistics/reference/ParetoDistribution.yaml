name: ParetoDistribution
domain: Statistics
signature: ParetoDistribution(k, alpha)
summary: The Pareto distribution with minimum value $k$ and shape $\alpha$.
signatures:
  - call: ParetoDistribution(k, alpha)
    description: an inert distribution object — carries $k, \alpha$, unevaluated.
    library: enumeratio-statistics
details:
  - $PDF(x) = \alpha k^\alpha / x^{\alpha+1}$ for $x \geq k$.
  - $CDF(x) = 1-(k/x)^\alpha$, clamped to $0$ below $x=k$.
  - $Mean = \alpha k/(\alpha-1)$ — exact only for $\alpha>1$; a documented divergence for $\alpha \leq 1$, where the mean is actually infinite.
  - $Variance = k^2\alpha/((\alpha-1)^2(\alpha-2))$ — exact only for $\alpha>2$, same divergence policy.
  - '[[RandomVariate]] samples via inverse transform: $k/U^{1/\alpha}$.'
examples:
  - id: pareto-pdf-exact
    expr: [PDF, [ParetoDistribution, 1, 3], 2]
    expected: [Rational, 3, 16]
  - id: pareto-cdf-exact
    expr: [CDF, [ParetoDistribution, 1, 3], 2]
    expected: [Rational, 7, 8]
  - id: pareto-mean-exact
    expr: [Mean, [ParetoDistribution, 1, 3]]
    expected: [Rational, 3, 2]
  - id: pareto-variance-exact
    expr: [Variance, [ParetoDistribution, 1, 3]]
    expected: [Rational, 3, 4]
seeAlso:
  - PDF
  - CDF
