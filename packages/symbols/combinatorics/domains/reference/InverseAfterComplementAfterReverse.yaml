name: InverseAfterComplementAfterReverse
domain: Combinatorial maps
signature: InverseAfterComplementAfterReverse(Permutation)
summary: Reverse, then complement, then invert.
details:
  - Takes a `Permutations` and returns a `Permutations` — a typed map, so a wrong carrier is a type error rather than a wrong answer.
  - "Defined as a COMPOSITION, applied right to left: [[Inverse]] after [[Complement]] after [[Reverse]]. Each step goes through its own declared head, so every intermediate value is a properly constructed carrier."
  - The name is FindStat's, and it is what a catalog produces when it cannot SAY composition. With Compositions it is Compose(Inverse, Complement, Reverse) and needs no name at all — kept only because the catalog has it.
examples:
  - id: the-one-line-word-231
    expr: [InverseAfterComplementAfterReverse, [Permutations, [List, 2, 3, 1]]]
    expected: [Permutations, [List, 2, 3, 1]]
    caption: the one-line word $231$
seeAlso:
  - Inverse
  - Complement
  - Reverse
