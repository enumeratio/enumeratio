name: ConjugateAfterCycleType
domain: Combinatorial maps
signature: ConjugateAfterCycleType(Permutation)
summary: The conjugate partition of the cycle type.
details:
  - Takes a `Permutation` and returns a `IntegerPartition` — a typed map, so a wrong carrier is a type error rather than a wrong answer.
  - Entry j is the count of cycles of length at least j — non-increasing in j by construction, so it comes out sorted without needing one.
examples:
  - id: the-one-line-word-231
    expr: [ConjugateAfterCycleType, [Permutation, [List, 2, 3, 1]]]
    expected: [IntegerPartition, [List, 1, 1, 1]]
    caption: the one-line word $231$
