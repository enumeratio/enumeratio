name: CycleType
domain: Combinatorial maps
signature: CycleType(Permutation)
summary: The multiset of cycle lengths, as a partition.
details:
  - Takes a `Permutations` and returns a `IntegerPartitions` — a typed map, so a wrong carrier is a type error rather than a wrong answer.
  - The first map here that CROSSES carriers — permutation in, integer partition out — which is the case the types exist for.
examples:
  - id: the-one-line-word-231
    expr: [CycleType, [Permutations, [List, 2, 3, 1]]]
    expected: [IntegerPartitions, [List, 3]]
    caption: the one-line word $231$
