name: Oracle drift
description: Rescan one oracle lane and fail if its rows differ from the committed entry sidecars.

inputs:
  system:
    description: The oracle system to rescan (packages/oracle/src/systems.ts)
    required: true

runs:
  using: composite
  steps:
    - run: node packages/reference/scripts/oracle-scan.ts ${{ inputs.system }}
      shell: bash
    # The scan writes JSON.stringify output; the committed files are formatted.
    - run: pnpm exec vp fmt packages/reference/src/entries packages/reference/golden/oracle
      shell: bash
    - name: ${{ inputs.system }} rows match the committed sidecars
      shell: bash
      run: |
        if ! git diff --quiet -- packages/reference; then
          { echo '```diff'; git diff -- packages/reference | head -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- packages/reference
          exit 1
        fi
