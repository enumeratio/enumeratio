name: Setup
description: pnpm + node + install, then build the library packages (type-aware lint, tests and scripts resolve siblings through dist/), restoring each package's outputs from the dist cache when nothing it reads changed.

inputs:
  packages:
    description: Space-separated package names to build, with everything they read. Empty builds every library package.
    default: ""
  save:
    description: Save the dist cache after building. Only the job that builds everything should.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.3.4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Entries are content-addressed, so any earlier cache is a valid seed; the newest one wins.
    - uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/dist-cache
        key: dist-${{ runner.os }}-${{ github.sha }}
        restore-keys: dist-${{ runner.os }}-
    - id: build
      run: |
        (while true; do free -m | awk '/^Mem:/ {print $3}' >> "$RUNNER_TEMP/mem.log"; sleep 2; done) &
        sampler=$!
        status=0
        node tools/ci/dist-cache.ts build $PACKAGES || status=$?
        kill $sampler
        echo "::notice::peak memory used $(sort -n "$RUNNER_TEMP/mem.log" | tail -1) MB of $(free -m | awk '/^Mem:/ {print $2}') MB"
        exit $status
      shell: bash
      env:
        DIST_CACHE_DIR: ${{ runner.temp }}/dist-cache
        PACKAGES: ${{ inputs.packages }}
        # combinatorics' compile steps take ~20 min one at a time on 4 vCPUs (BUILD_JOBS defaults to
        # cpus/3 = 1 there); the units' own parallelism keeps its default of 4.
        BUILD_JOBS: 3
        DIST_CACHE_JOBS: 4
    - if: inputs.save == 'true' && steps.build.outputs.built != '0'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/dist-cache
        key: dist-${{ runner.os }}-${{ github.sha }}
    - run: node tools/ci/clean-tree.ts
      shell: bash
