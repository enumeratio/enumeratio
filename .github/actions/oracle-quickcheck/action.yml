name: Oracle quickcheck
description: Sample new examples from the documented ones (seeded by the date), run them through one ecosystem's oracle lanes, and keep one rolling tracking issue of what's new.

inputs:
  systems:
    description: The oracle systems to sample against, space-separated
    required: true
  ecosystem:
    description: The ecosystem's name, for the tracking issue's title
    required: true
  samples:
    description: Samples per template
    default: "3"

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        set +e
        node packages/reference/scripts/oracle-quickcheck.ts ${{ inputs.systems }} --samples ${{ inputs.samples }} --strict > quickcheck.md
        echo "code=$?" >> "$GITHUB_OUTPUT"
    # Findings are for triage, not a red nightly: they collect in one issue per ecosystem, which
    # the nightly-fixup routine sweeps. Each run's findings replace the last run's in a comment.
    - uses: actions/github-script@v7
      env:
        TITLE: "oracle quickcheck findings: ${{ inputs.ecosystem }}"
        CODE: ${{ steps.run.outputs.code }}
      with:
        script: |
          const fs = require('fs')
          const TITLE = process.env.TITLE
          const found = await github.rest.search.issuesAndPullRequests({
            q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITLE}"`,
          })
          const existing = found.data.items.find(i => i.title === TITLE)
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          if (process.env.CODE === '0') {
            if (existing && existing.state === 'open') {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `No findings tonight. ${runUrl}` })
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' })
            }
            return
          }
          let report = ''
          try { report = fs.readFileSync('quickcheck.md', 'utf8') } catch {}
          const body = [
            `The nightly oracle quickcheck sampled new examples and found answers that differ in a way no classified example covers. Triage each family: fix ours, fix the mapping, or add the case as a classified (hidden) example. Replay locally with the seed below.`,
            ``,
            `Run: ${runUrl}`,
            ``,
            report.slice(0, 60000),
          ].join('\n')
          const LABELS = ['nightly-fixup']
          try {
            await github.rest.issues.createLabel({ ...context.repo, name: 'nightly-fixup', color: 'fbca04', description: 'swept nightly by the fixup routine' })
          } catch (e) { /* exists */ }
          if (existing) {
            if (existing.state === 'closed') await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'open' })
            await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
          } else {
            await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: LABELS })
          }
