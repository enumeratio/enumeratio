name: Plausible

# Property-based sampling over the collection catalogue (packages/symbols/combinatorics/combinatorics/collections/scripts/plausible.ts): random
# (family, params, rank) points, checked for round trip, validity, injectivity and count. A fresh seed each run
# means a red result is a finding to triage, not a broken build — so this is ADVISORY, never a required check.
#   main      — after CI passes a push that touched the collections, default budget, on the dists CI cached. The
#               job stays green; a failure opens/reopens ONE rolling tracking issue (labelled `nightly-fixup`,
#               which the fixup routine sweeps). Never on a PR.
#   nightly   — a deep sample; a failure also fails this (non-blocking) run, and a green one closes the issue.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 4 * * *" # 04:41 UTC, after nightly.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plausible-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # A CI push run that passed and touched the collections (a squash merge is one commit); nightly and manual runs always go.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          run=true
          if [ "$EVENT" = workflow_run ]; then
            run=false
            if [ "$CI_EVENT" = push ] && [ "$CI_RESULT" = success ] \
              && git diff --name-only HEAD^ HEAD | grep -q '^packages/symbols/combinatorics/combinatorics/collections/'; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  plausible:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25 # margin for a cold dist cache; the build below is already narrowed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The sampler reads only combinatorics (and what it reads); CI's dist cache holds it for this commit.
      - uses: ./.github/actions/setup
        with:
          packages: "@enumeratio/combinatorics"
          dist-key: auto

      - id: run
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            export PLAUSIBLE_POINTS=100 PLAUSIBLE_MAX_SIZE=9
          fi
          node packages/symbols/combinatorics/combinatorics/collections/scripts/plausible.ts 2>&1 | tee plausible.log

      - name: open/reopen the tracking issue
        if: steps.run.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const TITLE = 'plausible sampling regression'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const trigger = context.eventName === 'schedule' ? 'nightly (deep sample)' : 'main, after CI'

            let log = ''
            try { log = fs.readFileSync('plausible.log', 'utf8') } catch {}
            const tail = log.split('\n').slice(-60).join('\n')
            const body = [
              `A **Plausible** run found a sampled property that does not hold. Trigger: ${trigger}.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Each failure prints the exact replay command (\`node packages/symbols/combinatorics/combinatorics/collections/scripts/plausible.ts <family> <seed>\`). Findings collect here and are swept in batches rather than gating PRs. Tail of the output:`,
              ``,
              '```',
              tail,
              '```',
            ].join('\n')
            const LABELS = ['bug', 'nightly-fixup']
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: 'nightly-fixup', color: 'fbca04',
                description: 'swept nightly by the fixup routine' })
            } catch (e) { /* exists */ }
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'open' })
              }
              await github.rest.issues.addLabels({ ...context.repo, issue_number: existing.number, labels: LABELS })
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: LABELS })
            }

      - name: nightly — close the issue on recovery
        # only the deep sample may close it; a main sample is too small to prove anything
        if: github.event_name == 'schedule' && steps.run.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'plausible sampling regression'
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Green again — nightly Plausible passed. ${runUrl}` })
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' })
            }

      - name: nightly — fail the run if Plausible failed
        if: github.event_name == 'schedule' && steps.run.outcome == 'failure'
        run: exit 1
