name: Release gate (per-pack isolation + additivity)

# Per-pack isolation + additivity, moved off the per-PR path (#283 §6 originally ran this in ci.yml). PRs get the
# full complete-catalog run (ci.yml `core`) + pack-lint; the nightly deep sweep (nightly.yml) covers per-pack
# selfcert/quickcheck daily. This asserts the structural pack invariants — core+single-pack loads clean, and a
# pack only ADDS rows to core — before a release tag, plus on manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packs-setup:
    name: "packs: discover extracted"
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.list.outputs.packs }}
      has_packs: ${{ steps.list.outputs.has_packs }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: list
        run: |
          PACKS=$(pnpm --filter @enumeratio/data run --silent list-packs)
          echo "packs=$PACKS" >> "$GITHUB_OUTPUT"
          if [ "$PACKS" = "[]" ]; then
            echo "has_packs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_packs=true" >> "$GITHUB_OUTPUT"
          fi

  packs-pack-matrix:
    name: "packs: pack:${{ matrix.pack }}"
    needs: packs-setup
    # Job-level guard so an empty EXTRACTED_PACKS skips the job before `strategy.matrix` expands (an empty matrix
    # array is what triggers GitHub's "matrix must define at least one vector" error).
    if: needs.packs-setup.outputs.has_packs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.packs-setup.outputs.packs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # core + closure(pack) + pack; asserts the pack's own examples AND core's examples again (regression).
      - run: pnpm --filter @enumeratio/data exec node --import tsx run.mts --packs core,${{ matrix.pack }}
      # additivity differential (#283 §6): the pack may only ADD rows/signatures to core, never patch it.
      - run: pnpm --filter @enumeratio/data exec node --import tsx pack-additivity.mts --pack ${{ matrix.pack }}
