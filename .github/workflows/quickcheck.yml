name: Quickcheck

# Property-based (QuickCheck-style) SAMPLING verification (packages/data/quickcheck.mts) — the fast sibling of the
# exhaustive selfcert. Most collections are infinite and element_at-vs-sequential is O(N²) for generic-unrank
# collections, so the full selfcert sweep no longer finishes in reasonable time (see #294/#295).
#
# This is an OPTIONAL, ADVISORY check — a random-seed sampler is non-deterministic (a fresh seed surfaces a DIFFERENT
# latent bug each run), so it must NOT gate a PR; the deterministic gates that block live in ci.yml. On every tier a
# failure is RECORDED as a single rolling tracking issue rather than blocking, so findings are grouped and swept in
# batches, not lost:
#   push / PR  — a FAST sample (few points/collection, small enumeration cap), scoped to when it can catch something
#                (sqlsrc or the harness itself). NON-BLOCKING: on failure it opens/reopens the tracking issue; the job
#                stays green so the PR is never gated by a flaky sample.
#   nightly    — a DEEPER sample (more points); on failure it opens/reopens the same tracking issue AND fails its own
#                (already non-blocking) scheduled run, and closes the issue again on recovery.
on:
  push:
    branches: [main]
    paths:
      - packages/data/sqlsrc/**
      - packages/data/quickcheck.mts
  pull_request:
    paths:
      - packages/data/sqlsrc/**
      - packages/data/quickcheck.mts
  schedule:
    - cron: '41 4 * * *'   # nightly, 04:41 UTC (distinct from selfcert's weekly 17 3 * * 0)
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # every tier opens/reopens the rolling tracking issue; nightly also closes it on recovery

concurrency:
  group: quickcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickcheck:
    name: quickcheck (property-based sampling)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: run quickcheck
        id: run
        # scheduled = deep sample; push/PR = fast sample (fewer points + a smaller enumeration cap). set -o pipefail
        # so a harness failure survives the tee. continue-on-error on EVERY tier: this check is advisory, so a failure
        # never fails the job here — the issue steps below react to steps.run.outcome, and only nightly re-fails (below).
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            export QUICKCHECK_POINTS=5
          else
            export QUICKCHECK_POINTS=1
            export QUICKCHECK_NMAX=4
            export QUICKCHECK_RANK_CAP=50
            export QUICKCHECK_SCAN_RANK_CAP=3
            export QUICKCHECK_CAP_COUNT=2000
          fi
          pnpm --filter @enumeratio/data quickcheck 2>&1 | tee quickcheck.log

      - name: open/reopen tracking issue on failure
        if: ${{ steps.run.outcome == 'failure' }}
        continue-on-error: true   # never let issue-filing (e.g. a read-only token on a fork PR) gate the run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const TITLE = 'quickcheck sampling regression'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const trigger = context.eventName === 'schedule'
              ? 'nightly (deep sample)'
              : `${context.eventName} on \`${context.ref.replace('refs/heads/', '')}\` (fast sample)`
            let log = ''
            try { log = fs.readFileSync('quickcheck.log', 'utf8') } catch {}
            const tail = log.split('\n').slice(-60).join('\n')
            const body = [
              `A **quickcheck** sampling run FAILED — a sampled property does not hold. Trigger: ${trigger}.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `quickcheck is a non-deterministic sampler, so each run may surface a DIFFERENT latent bug (typically a \`contains\`-at-n=0 / membership mismatch on some collection). Findings are collected here and swept in batches rather than gating PRs. The harness prints the SEED needed to replay deterministically (\`pnpm --filter @enumeratio/data quickcheck <coll> <seed>\`). Tail of the output:`,
              ``,
              '```',
              tail,
              '```',
            ].join('\n')
            // `nightly-fixup` is the label the nightly fixup Routine sweeps — stamp it here so quickcheck findings
            // are picked up automatically. Ensure it exists first (createLabel 422s if it already does — ignore).
            const LABELS = ['bug', 'nightly-fixup']
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: 'nightly-fixup', color: 'fbca04',
                description: 'swept nightly by the fixup routine' })
            } catch (e) { /* already exists */ }
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'open' })
              }
              await github.rest.issues.addLabels({ ...context.repo, issue_number: existing.number, labels: LABELS })
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: LABELS })
            }

      - name: nightly — close issue on green recovery
        # only the deep nightly sample may close it — a push/PR fast sample is too small to prove recovery
        if: ${{ github.event_name == 'schedule' && steps.run.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'quickcheck sampling regression'
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Green again — nightly quickcheck passed. ${runUrl}` })
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' })
            }

      - name: nightly — fail the job if quickcheck failed
        if: ${{ github.event_name == 'schedule' && steps.run.outcome == 'failure' }}
        run: exit 1
