name: Preview cleanup (Cloudflare Pages)

# CF never expires a deployment, and ci.yml uploads one per commit. Two nightly sweeps
# (.github/scripts/sweep-previews.ts):
#   closed — a PR's deployments go once it has been closed a day (force-pushed-away commits included), so the
#            review links on a just-merged PR still work the morning after.
#   age    — every untagged preview older than 30 days goes; a tagged commit's preview stays reachable at its
#            <sha7>.enumeratio.pages.dev for good, and the newest main preview always survives.
# Best-effort: a failed delete never fails the run.

on:
  schedule:
    - cron: "33 5 * * *" # 05:33 UTC
  workflow_dispatch:
    inputs:
      closed_days:
        description: Delete a PR's previews once it has been closed this many days
        default: "1"
      max_age_days:
        description: Delete untagged previews older than this many days
        default: "30"
      dry_run:
        description: Only report what would be deleted
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write # note the teardown on the PR

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the age sweep asks git which commits carry a tag
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sweep closed PRs
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node .github/scripts/sweep-previews.ts closed "${{ inputs.closed_days || '1' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep by age
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node .github/scripts/sweep-previews.ts age "${{ inputs.max_age_days || '30' }}" | tee -a "$GITHUB_STEP_SUMMARY"
