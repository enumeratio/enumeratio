name: Preview cleanup (Cloudflare Pages)

# Tear down Cloudflare Pages preview deployments. On PR close (merged OR just closed) it deletes every deployment
# stamped with this PR's number — a PR accrues one per push and CF never auto-expires them, so ALL of them go, not
# just the last, and matching on the stamped PR number catches commits dropped by force-pushes too. A manual
# dispatch instead purges by branch metadata (for legacy branch-aliased deploys, e.g. an old smoke test). Sweeps
# all envs. Best-effort: a failed delete never fails the workflow.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose deployments to purge (matches CF branch metadata, e.g. main)
        required: true

permissions:
  contents: read
  pull-requests: write   # update the sticky preview comment to note teardown

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number || github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  cleanup:
    # PR-close (same-repo only — fork PRs never had the secrets to deploy) OR a manual dispatch for a named branch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete matching preview deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # On close, match the PR stamp in commit-message metadata (preview-PR-<n>); on dispatch, match branch.
          MATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && 'branch' || 'pr' }}
          MATCH_VAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || format('[preview-PR-{0}]', github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/enumeratio/deployments"
          auth="Authorization: Bearer $CF_API_TOKEN"
          # jq filter for the chosen match mode: PR stamp is a commit-message substring; branch is exact.
          if [ "$MATCH_MODE" = "branch" ]; then
            filter='.result[] | select(.deployment_trigger.metadata.branch == $v) | .id'
          else
            filter='.result[] | select((.deployment_trigger.metadata.commit_message // "") | contains($v)) | .id'
          fi
          deleted=0; page=1
          while :; do
            resp=$(curl -sf -H "$auth" "$api?per_page=25&page=$page") || break
            ids=$(printf '%s' "$resp" | jq -r --arg v "$MATCH_VAL" "$filter")
            count=$(printf '%s' "$resp" | jq '.result | length')
            for id in $ids; do
              if curl -sf -X DELETE -H "$auth" "$api/$id?force=true" >/dev/null; then
                deleted=$((deleted+1))
              else
                echo "warn: could not delete deployment $id" >&2
              fi
            done
            [ "$count" -lt 25 ] && break
            page=$((page+1))
          done
          echo "Deleted $deleted deployment(s) matching $MATCH_MODE=$MATCH_VAL." | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Note teardown on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(printf '<!-- cf-preview -->\nPreview deployments removed on close.')
          gh pr comment "$PR" --repo "${{ github.repository }}" --edit-last --body "$body" || true
        continue-on-error: true
