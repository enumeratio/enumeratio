name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # the `preview` job keeps a sticky preview-URL comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint/typecheck + the docs build, once; the dist is the artifact `preview` deploys.
  build:
    name: check + site build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec vp check
      - run: pnpm --filter @enumeratio/web run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: web/.vitepress/dist
          retention-days: 3

  # A handful of suites (statistics, domains, collections) are CPU-bound and saturate a 4-vCPU
  # runner on their own, so splitting them across separate runners buys real wall-clock time —
  # unlike unordered-but-single-runner, which just makes them contend for the same 4 cores.
  # Rebalance by moving a package between the shards below (or adding one) as suites grow.
  test_shard:
    name: tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: statistics
            filter: --filter @enumeratio/statistics
          - shard: domains-collections
            filter: --filter @enumeratio/domains --filter @enumeratio/collections
          - shard: rest
            filter: >-
              --filter '!@enumeratio/web'
              --filter '!@enumeratio/statistics'
              --filter '!@enumeratio/domains'
              --filter '!@enumeratio/collections'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm -r ${{ matrix.filter }} run test

  # Branch protection names the required check `tests`, but that name has to stay off the matrix
  # job above (each shard would collide on it). This fans back in and fails if any shard did.
  tests:
    name: tests
    needs: test_shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ needs.test_shard.result }}" != "success" ]; then
            echo "one or more test shards failed: ${{ needs.test_shard.result }}"
            exit 1
          fi

  # Every build of every commit goes up as a Cloudflare Pages preview at <sha7>.enumeratio.pages.dev — PR pushes
  # and main alike (production is GitHub Pages, pages.yml). Direct upload of the artifact `build` made: no second
  # site build, no CF build minutes. Same-repo only — fork PRs have no secrets. `--branch` is CF's one alias slot,
  # so it carries the sha; the commit message carries the PR number for preview-cleanup.yml to match on.
  preview:
    name: preview (Cloudflare Pages)
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - id: meta
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "deploy=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = true ] || echo "::notice::no CLOUDFLARE_API_TOKEN secret — preview skipped"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then echo "stamp=[preview-PR-$PR]" >> "$GITHUB_OUTPUT"
          else echo "stamp=[preview-${GITHUB_REF_NAME}]" >> "$GITHUB_OUTPUT"; fi
      - id: deploy
        if: steps.meta.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=enumeratio
            --branch=${{ steps.meta.outputs.sha7 }}
            --commit-hash=${{ steps.meta.outputs.sha }}
            --commit-message=${{ steps.meta.outputs.stamp }}
      - name: Preview URL
        if: steps.meta.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          SHA7: ${{ steps.meta.outputs.sha7 }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          alias="${ALIAS_URL:-https://$SHA7.enumeratio.pages.dev}"
          echo "Preview ($SHA7): $alias" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$PR" ] || exit 0
          # One sticky comment: its first two lines are ours, and anything below them (review links added by
          # hand) survives a push.
          line="Preview ($SHA7): $alias"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- cf-preview -->")) | .id' | tail -n1)
          if [ -n "$id" ]; then
            rest=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body | tail -n +3)
            body=$(printf '<!-- cf-preview -->\n%s' "$line")
            [ -n "$rest" ] && body=$(printf '%s\n%s' "$body" "$rest")
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$(printf '<!-- cf-preview -->\n%s' "$line")"
          fi
