name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # the `preview` job keeps a sticky preview-URL comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint/typecheck and the web unit tests. Runs beside the site build, not before it; `build` below
  # fans the two back in under the required check name.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the id check reads the base commit
      - uses: ./.github/actions/setup
        with:
          save: "true"
      - run: pnpm exec vp check
      - name: example ids aren't renamed silently
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/example-ids.ts
      - run: pnpm --filter @enumeratio/web run test

  # The docs build; its dist is the artifact `preview` deploys. Skipped when `changes` finds nothing
  # the site reads (a PR to root docs, say); `preview` is then skipped too.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @enumeratio/web run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: web/.vitepress/dist
          retention-days: 3

  # Branch protection names the required check `check + site build`; the work is in `check` and `site`.
  # A skipped `site` passes, but only when `changes` itself succeeded.
  build:
    name: check + site build
    needs: [changes, check, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          SITE: ${{ needs.site.result }}
        run: |
          if [ "$CHANGES" != "success" ] || [ "$CHECK" != "success" ]; then
            echo "changes: $CHANGES, check: $CHECK"
            exit 1
          fi
          if [ "$SITE" != "success" ] && [ "$SITE" != "skipped" ]; then
            echo "site build: $SITE"
            exit 1
          fi
          [ "$SITE" = "skipped" ] && echo "::notice::nothing the site reads changed — site build skipped"
          exit 0

  # Which packages a PR can affect (tools/ci/affected.ts): each changed package and what depends on
  # it. Anything that can move every package (lockfile, root config, CI, the engine) selects them
  # all, and pushes to main and manual runs always test everything. A PR confined to web/ and root
  # docs selects nothing, so the shards skip. The shards build only their selection and what it reads.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      site: ${{ steps.select.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then node tools/ci/affected.ts --base "$BASE" --github-output
          else node tools/ci/affected.ts --full --github-output; fi

  # A handful of suites (statistics, combinatorics) are CPU-bound and saturate a 4-vCPU
  # runner on their own, so splitting them across separate runners buys real wall-clock time —
  # unlike unordered-but-single-runner, which just makes them contend for the same 4 cores.
  # Rebalance by moving a package between the shards in tools/ci/affected.ts (SHARDS).
  test_shard:
    name: tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          packages: ${{ matrix.pkgs }}
      - env:
          PKGS: ${{ matrix.pkgs }}
        run: |
          filters=()
          for p in $PKGS; do filters+=(--filter "$p"); done
          pnpm -r "${filters[@]}" run test

  # Branch protection names the required check `tests`, but that name has to stay off the matrix
  # job above (each shard would collide on it). This fans back in and fails if any shard did;
  # shards skipped by `changes` pass, but only when `changes` itself succeeded.
  tests:
    name: tests
    needs: [changes, test_shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.test_shard.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "change detection failed: $CHANGES"
            exit 1
          fi
          if [ "$SHARDS" != "success" ] && [ "$SHARDS" != "skipped" ]; then
            echo "one or more test shards failed: $SHARDS"
            exit 1
          fi
          [ "$SHARDS" = "skipped" ] && echo "::notice::no package changes — test shards skipped"
          exit 0

  # Every build of every commit goes up as a Cloudflare Pages preview at <sha7>.enumeratio.pages.dev — PR pushes
  # and main alike — and a push to main also deploys as production (enumeratio.dev). Direct upload of the artifact `site` made: no second
  # site build, no CF build minutes. Same-repo only — fork PRs have no secrets. `--branch` is CF's one alias slot,
  # so it carries the sha; the commit message carries the PR number for preview-cleanup.yml to match on.
  preview:
    name: preview (Cloudflare Pages)
    needs: site
    if: needs.site.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - id: meta
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "deploy=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = true ] || echo "::notice::no CLOUDFLARE_API_TOKEN secret — preview skipped"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then echo "stamp=[preview-PR-$PR]" >> "$GITHUB_OUTPUT"
          else echo "stamp=[preview-${GITHUB_REF_NAME}]" >> "$GITHUB_OUTPUT"; fi
      - id: deploy
        if: steps.meta.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=enumeratio
            --branch=${{ steps.meta.outputs.sha7 }}
            --commit-hash=${{ steps.meta.outputs.sha }}
            --commit-message=${{ steps.meta.outputs.stamp }}
      - name: Production (main)
        if: steps.meta.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=enumeratio
            --branch=main
            --commit-hash=${{ steps.meta.outputs.sha }}
            --commit-message=${{ steps.meta.outputs.stamp }}
      - name: Preview URL
        if: steps.meta.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          SHA7: ${{ steps.meta.outputs.sha7 }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          alias="${ALIAS_URL:-https://$SHA7.enumeratio.pages.dev}"
          echo "Preview ($SHA7): $alias" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$PR" ] || exit 0
          # One sticky comment: its first two lines are ours, and anything below them (review links added by
          # hand) survives a push.
          line="Preview ($SHA7): $alias"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- cf-preview -->")) | .id' | tail -n1)
          if [ -n "$id" ]; then
            rest=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body | tail -n +3)
            body=$(printf '<!-- cf-preview -->\n%s' "$line")
            [ -n "$rest" ] && body=$(printf '%s\n%s' "$body" "$rest")
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$(printf '<!-- cf-preview -->\n%s' "$line")"
          fi
