name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # the `preview` job posts/updates a sticky preview-URL comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the explorer + docs ONCE and publish the result as an artifact. This is both the build gate and the
  # single source for the preview deploy (and could feed prod later) — docs:build no longer runs a second time
  # per PR just to produce a preview.
  build:
    name: test:build (explorer + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 3

  core:
    name: test:core (data suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Full profile (core + every pack together) — the complete-catalog example gate every PR gets.
      - run: pnpm test:core

  stack:
    name: test:stack (client + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:stack

  packs-core:
    name: "packs: core (self-containment)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # core alone, closed-world toposort + core's own examples — asserts core never leans on a pack file.
      - run: pnpm --filter @enumeratio/data run test:packs-core

  packs-lint:
    name: "packs: lint + migrate --check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Report-only: pack-lint checks the full trial partition against monolithic sqlsrc/, which still has real
      # cross-pack `requires:` edges the split hasn't undone. Flip continue-on-error to false once that's zero.
      - run: pnpm --filter @enumeratio/data run pack-lint
        continue-on-error: true
      # Blocking: asserts today's ACTUAL placement (EXTRACTED_PACKS) is self-consistent (no misplaced file, no
      # stale manifest).
      - run: pnpm --filter @enumeratio/data run pack-migrate:check

  # Per-pack isolation + additivity (core+single-pack loads clean; a pack only ADDS rows) is release/nightly-
  # shaped, not per-edit — the `core` job already runs the full catalog together every PR, and nightly runs the
  # deep per-pack sweep. It lives in release.yml (tag push) now, off the per-PR path.

  # Deploy a Cloudflare Pages preview from the artifact the `build` job already produced — no second docs:build.
  # PRs only (main pushes are prod, via pages.yml), and same-repo only (fork PRs have no CF secrets). Runs on
  # every push to the PR branch (pull_request `synchronize`); the per-branch alias always tracks the latest.
  preview:
    name: "preview: Cloudflare Pages"
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=enumeratio
            --branch=${{ github.head_ref }}
      - name: Sticky preview-URL comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Lead with the STABLE per-branch alias (always the latest push); fall back to computing it from the
          # branch name if the action didn't surface it (CF sanitizes: lowercase, non-alnum -> '-', <=63 chars).
          alias="$ALIAS_URL"
          if [ -z "$alias" ]; then
            host=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-63)
            alias="https://$host.enumeratio.pages.dev"
          fi
          body=$(printf '<!-- cf-preview -->\nPreview: %s' "$alias")
          echo "Preview: $alias" >> "$GITHUB_STEP_SUMMARY"
          # Edit our previous preview comment in place if there is one; otherwise post a fresh one.
          gh pr comment "$PR" --repo "${{ github.repository }}" --edit-last --body "$body" \
            || gh pr comment "$PR" --repo "${{ github.repository }}" --body "$body"
