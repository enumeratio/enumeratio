name: Self-certification

# selfcert.mts is the accelerated==naive differential oracle for the data package (see
# packages/data/selfcert.mts) — it caught a real bug (standard_tableau_pairs silent truncation)
# that the regular test suite missed, but it runs nowhere in CI today. This wires it in.
#
# The per-push/PR fast verification now lives in quickcheck.yml (property-based SAMPLING). This EXHAUSTIVE sweep is
# no longer a per-push gate: the catalog has grown and element_at-vs-sequential is O(N²) for generic-unrank
# collections, so the full sweep no longer finishes in reasonable time (#294/#295). Kept as a weekly backstop
# against drift with no matching source change (e.g. a pglite bump) + on-demand via workflow_dispatch.
on:
  schedule:
    - cron: '17 3 * * 0'   # weekly, Sunday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfcert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfcert:
    name: selfcert (accelerated == naive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enumeratio/data selfcert
