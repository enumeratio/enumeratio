name: Bench

# Cross-system benchmarks (design/benchmarking.md §6). One runner installs the light ecosystems
# from the caches the oracle lanes use and runs our side, mpmath, SymPy, Julia and Rust
# interleaved, so every ratio in a run comes from one machine and one time window. Reports go
# to the orphan `bench-data` branch (runs/<id>/, index.json), which the site's /bench/ viewer
# reads. Our own side's drift against the job's trailing median files/reopens one rolling
# issue, `bench drift`, labelled `nightly-fixup`. Advisory: never a required check.

on:
  schedule:
    - cron: "10 5 * * *" # 05:10 UTC, after perf.yml
  workflow_dispatch:
    inputs:
      suite:
        description: Which tiers to run (quick, standard, deep)
        type: choice
        options: [standard, quick, deep]
        default: standard

permissions:
  contents: write # pushes runs to bench-data
  issues: write
  actions: write # julia-actions/cache deletes its older saves

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    name: bench (TS, mpmath, SymPy, Julia, Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/oracle/python/requirements.txt
      - run: pip install -r packages/oracle/python/requirements.txt
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13" # packages/oracle/julia/Manifest.toml's julia_version
      - uses: julia-actions/cache@v2
      - run: node packages/oracle/scripts/setup.ts julia
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/oracle/rust
            packages/bench/generated/rust

      - id: bench
        uses: ./.github/actions/bench-run
        with:
          systems: ts,mpmath,sympy,julia,rust
          job: nightly
          token: ${{ github.token }}
          suite: ${{ inputs.suite || 'standard' }}

      - name: cpu-profile where we trail the field, and anything that drifted
        if: ${{ !cancelled() && steps.bench.outputs.dir != '' }}
        run: node packages/bench/scripts/profile.ts --from "${{ steps.bench.outputs.dir }}" --top 5 --drift drift.json --out bench-profiles

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-profiles-${{ github.run_id }}
          path: bench-profiles
          retention-days: 7
          if-no-files-found: ignore

      - name: open/reopen the tracking issue
        if: ${{ !cancelled() && steps.bench.outputs.drifted == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const TITLE = 'bench drift'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const drift = JSON.parse(fs.readFileSync('drift.json', 'utf8'))
            const ms = (ns) => (ns / 1e6).toFixed(2)
            const rows = drift.slice(0, 30).map(d =>
              `| [${d.name}](https://enumeratio.dev/reference/symbol/${d.name.replace('/', '#example/')}) | ${ms(d.medianNs)} | ${ms(d.trailingNs)} | ×${d.ratio.toFixed(2)} | ${d.priorRuns} |`
            ).join('\n')
            const body = [
              `The nightly bench found ${drift.length} case(s) on our side past their trailing median (≥1.5× and ≥1 ms). Run: ${runUrl}. CPU profiles of them are in the run's \`bench-profiles-${context.runId}\` artifact.`,
              ``,
              `| case | median (ms) | trailing (ms) | ratio | prior runs |`,
              `|---|---|---|---|---|`,
              rows,
              ``,
              `Hosted runners wobble; check the trend at https://enumeratio.dev/bench/ before treating one run as a regression.`,
            ].join('\n')
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: 'nightly-fixup', color: 'fbca04',
                description: 'swept nightly by the fixup routine' })
            } catch (e) { /* exists */ }
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'open' })
              }
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: ['nightly-fixup'] })
            }

      - name: close the issue on a clean run
        if: ${{ !cancelled() && steps.bench.outputs.drifted == 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'bench drift'
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${TITLE}"`,
            })
            const existing = found.data.items.find(i => i.title === TITLE)
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `No drift on the nightly bench. ${runUrl}` })
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' })
            }
